name: coronapoker-qa

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Record and verify commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          java -version
          mvn --version

      - name: Build current game and run release QA in one reactor
        run: >-
          mvn -B -ntp -f tools/reactor/pom.xml -P qa-release verify
          -Dqa.sim.hands=1
          -Dqa.sim.faults=1
          -Dqa.sim.bot.hands=1

      - name: Preserve QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-${{ github.sha }}
          path: |
            tools/qa/target/surefire-reports/
            target/*.jar
          if-no-files-found: error
          retention-days: 14
