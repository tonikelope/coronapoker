<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>CoronaPoker — Shorts de póker</title>
  <style>
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05080c; }
    body { font-family: system-ui, sans-serif; color: #fff; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px;
      box-sizing: border-box; text-align: center; background: #101820; z-index: 2; }
    #status.hidden { display: none; }
    #status.error { background: #2a1014; }
  </style>
</head>
<body>
  <div id="status">Buscando Shorts de póker…</div>
  <div id="player"></div>
  <script>
    'use strict';
    const VIDEO_IDS = [@@VIDEO_IDS@@];
    const ORIGIN = '@@ORIGIN@@';
    const statusBox = document.getElementById('status');
    let player = null;
    let ready = false;
    let currentIndex = @@INITIAL_INDEX@@;
    const START_SECONDS = @@START_SECONDS@@;
    const INITIAL_MUTED = @@INITIAL_MUTED@@;
    const INITIAL_VOLUME = @@INITIAL_VOLUME@@;
    let restoredAudioPending = true;
    let desiredMuted = INITIAL_MUTED;
    let desiredVolume = INITIAL_VOLUME;

    function report(kind, detail) {
      const request = kind + '|' + String(detail == null ? '' : detail).replace(/[|\r\n]/g, ' ');
      if (typeof window.cefQuery === 'function') {
        window.cefQuery({ request, onFailure: () => {} });
      }
    }

    function showError(message) {
      statusBox.className = 'error';
      statusBox.textContent = message;
      report('ERROR', message);
    }

    function selectVideo(index) {
      if (!player || !ready || VIDEO_IDS.length === 0) return;
      currentIndex = ((Number(index) % VIDEO_IDS.length) + VIDEO_IDS.length) % VIDEO_IDS.length;
      desiredMuted = player.isMuted ? player.isMuted() : desiredMuted;
      desiredVolume = player.getVolume ? player.getVolume() : desiredVolume;
      restoredAudioPending = true;
      player.loadVideoById(VIDEO_IDS[currentIndex]);
      restoreAudioState(player);
      report('INDEX', currentIndex);
    }

    function restoreAudioState(target) {
      if (!target) return;
      if (target.setVolume) target.setVolume(desiredVolume);
      if (desiredMuted) {
        if (target.mute) target.mute();
      } else if (target.unMute) {
        target.unMute();
      }
    }

    function reportAudio() {
      if (!player || !ready) return;
      const muted = player.isMuted && player.isMuted() ? 1 : 0;
      const volume = player.getVolume ? Math.round(player.getVolume()) : 100;
      desiredMuted = muted !== 0;
      desiredVolume = Math.max(0, Math.min(100, volume));
      report('AUDIO', muted + ':' + desiredVolume);
    }

    function reportDesiredAudio() {
      report('AUDIO', (desiredMuted ? 1 : 0) + ':' + desiredVolume);
    }

    window.coronaSelectVideo = selectVideo;
    window.coronaSetActive = function (active) {
      if (!player || !ready) return;
      if (active) player.playVideo();
      else player.pauseVideo();
    };

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: VIDEO_IDS[currentIndex],
        playerVars: {
          autoplay: 1,
          controls: 1,
          enablejsapi: 1,
          playsinline: 1,
          rel: 0,
          mute: INITIAL_MUTED ? 1 : 0,
          cc_load_policy: 0,
          iv_load_policy: 3,
          fs: 0,
          origin: ORIGIN,
          widget_referrer: ORIGIN,
          start: START_SECONDS
        },
        events: {
          onReady: event => {
            ready = true;
            statusBox.className = 'hidden';
            restoreAudioState(event.target);
            event.target.playVideo();
            report('INDEX', currentIndex);
            reportDesiredAudio();
            report('READY', '1');
            report('STATE', desiredMuted
              ? 'REPRODUCIENDO EN SILENCIO' : 'REPRODUCIENDO CON AUDIO');
          },
          onStateChange: event => {
            if (event.data === 1 && restoredAudioPending) {
              restoreAudioState(event.target);
              restoredAudioPending = false;
              setTimeout(reportAudio, 150);
            }
            const names = { '-1': 'SIN INICIAR', '0': 'FINALIZADO', '1': 'REPRODUCIENDO',
              '2': 'PAUSA', '3': 'CARGANDO', '5': 'PREPARADO' };
            report('STATE', names[String(event.data)] || ('ESTADO ' + event.data));
          },
          onError: event => {
            const errors = {
              2: 'Solicitud de vídeo no válida (error 2).',
              5: 'El contenido no puede reproducirse en HTML5 (error 5).',
              100: 'El vídeo no existe, es privado o fue retirado (error 100).',
              101: 'El propietario no permite reproducción embebida (error 101).',
              150: 'El propietario no permite reproducción embebida (error 150).',
              153: 'El reproductor no recibió una identificación Referer válida (error 153).'
            };
            showError(errors[event.data] || ('El reproductor devolvió el error ' + event.data + '.'));
          },
          onAutoplayBlocked: () => report('STATE', 'AUTOPLAY BLOQUEADO; PULSA PLAY')
        }
      });
    };

    function reportPosition() {
      if (!player || !ready || typeof player.getCurrentTime !== 'function') return;
      report('POSITION', currentIndex + ':' + Math.max(0, Math.floor(player.getCurrentTime())));
      reportAudio();
    }
    window.coronaReportPosition = reportPosition;
    setInterval(reportPosition, 750);

    setTimeout(() => {
      if (!ready) showError('No se pudo inicializar el reproductor. Comprueba la conexión.');
    }, 20000);

    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => showError('No se pudo descargar la API del reproductor.');
    document.head.appendChild(script);
  </script>
</body>
</html>
