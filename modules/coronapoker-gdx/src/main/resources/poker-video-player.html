<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>CoronaPoker — Vídeos de póker</title>
  <style>
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05080c; }
    body { font-family: system-ui, sans-serif; color: #fff; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px;
      box-sizing: border-box; text-align: center; align-content: center; gap: 16px; background: #101820; z-index: 2; }
    #status.hidden { display: none; }
    #status.error { background: #2a1014; }
    #status button { color: #ffdc6c; background: #111a2a; border: 1px solid #536073;
      border-radius: 12px; padding: 12px 24px; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <div id="status">Cargando reproductor…</div>
  <div id="player"></div>
  <script>
    'use strict';
    let VIDEO_IDS = [@@VIDEO_IDS@@];
    let orderedPlaylist = @@ORDERED_PLAYLIST@@;
    let playlistRevision = @@PLAYLIST_REVISION@@;
    const ORIGIN = '@@ORIGIN@@';
    const PLAYER_LANGUAGE = '@@PLAYER_LANGUAGE@@';
    const statusBox = document.getElementById('status');
    let player = null;
    let ready = false;
    let playbackAllowed = false;
    let currentIndex = @@INITIAL_INDEX@@;
    let playOrder = VIDEO_IDS.map((ignored, index) => index);
    let orderPosition = Math.max(0, playOrder.indexOf(currentIndex));
    const START_SECONDS = @@START_SECONDS@@;
    const INITIAL_MUTED = @@INITIAL_MUTED@@;
    const INITIAL_VOLUME = @@INITIAL_VOLUME@@;
    let desiredMuted = INITIAL_MUTED;
    let desiredVolume = INITIAL_VOLUME;
    let active = true;
    let audioRestorePending = true;
    let lastReportedMuted = null;
    let lastReportedVolume = null;
    const failedVideoIds = new Set();
    let skipTimer = null;
    let autoplayRetryTimer = null;
    const API_TIMEOUT_MS = 30000;
    const PLAYBACK_TIMEOUT_MS = 20000;
    const BUFFER_TIMEOUT_MS = 45000;
    let apiTimer = null;
    let playbackTimer = null;
    let apiRecoveryPending = false;
    let playbackGeneration = 0;
    let playbackRecoveries = 0;
    let playedCurrentVideo = false;
    let loadStopped = false;
    let loadStartSeconds = START_SECONDS;

    function text(spanish, english) {
      return PLAYER_LANGUAGE === 'en' ? english : spanish;
    }

    function cancelLoadTimers() {
      if (apiTimer !== null) clearTimeout(apiTimer);
      if (playbackTimer !== null) clearTimeout(playbackTimer);
      apiTimer = playbackTimer = null;
    }

    function loading(message) {
      statusBox.className = '';
      statusBox.textContent = message;
    }

    function report(kind, detail, onSuccess, onFailure) {
      const request = kind + '|' + String(detail == null ? '' : detail).replace(/[|\r\n]/g, ' ');
      if (typeof window.cefQuery === 'function') {
        try {
          window.cefQuery({ request, onSuccess: onSuccess || (() => {}), onFailure: onFailure || (() => {}) });
        } catch (failure) {
          if (onFailure) onFailure(failure);
        }
      } else if (onSuccess) {
        onSuccess('ok');
      }
    }

    function showError(message) {
      loadStopped = true;
      cancelLoadTimers();
      if (autoplayRetryTimer !== null) clearTimeout(autoplayRetryTimer);
      autoplayRetryTimer = null;
      if (skipTimer !== null) clearTimeout(skipTimer);
      skipTimer = null;
      statusBox.className = 'error';
      statusBox.textContent = message;
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = text('Reintentar', 'Retry');
      retry.onclick = retryLoad;
      statusBox.appendChild(retry);
      report('ERROR', message);
    }

    function recoverApi(manual) {
      if (apiRecoveryPending) return;
      apiRecoveryPending = true;
      cancelLoadTimers();
      loading(text('Reconectando con el reproductor…', 'Reconnecting to the player…'));
      const failed = () => {
        apiRecoveryPending = false;
        showError(text('No se pudo conectar con YouTube. Comprueba la conexión y reintenta.',
          'Could not connect to YouTube. Check your connection and retry.'));
      };
      report(manual ? 'RETRY_API_MANUAL' : 'RETRY_API', 'API unavailable', response => {
        if (response === 'reload') window.location.reload();
        else failed();
      }, failed);
    }

    function armApiTimeout() {
      if (!active || loadStopped || apiTimer !== null || apiRecoveryPending) return;
      if (ready) {
        if (!playbackAllowed) apiTimer = setTimeout(() => {
          apiTimer = null;
          showError(text('El reproductor no respondió. Pulsa Reintentar.',
            'The player did not respond. Press Retry.'));
        }, 10000);
        return;
      }
      apiTimer = setTimeout(() => {
        apiTimer = null;
        if (!ready && active) recoverApi(false);
      }, API_TIMEOUT_MS);
    }

    function armPlaybackTimeout(delay = PLAYBACK_TIMEOUT_MS) {
      if (!ready || !playbackAllowed || !active || loadStopped || playbackTimer !== null) return;
      if (player.getPlayerState && player.getPlayerState() === 1) return;
      const generation = playbackGeneration;
      playbackTimer = setTimeout(() => {
        playbackTimer = null;
        if (!active || generation !== playbackGeneration || loadStopped) return;
        if (player.getPlayerState && player.getPlayerState() === 1) return;
        playbackRecoveries += 1;
        report('RECOVERY', 'playback timeout ' + playbackRecoveries + ' video ' + VIDEO_IDS[currentIndex]);
        if (playbackRecoveries >= 3) {
          showError(text('El vídeo no responde. Comprueba la conexión y pulsa Reintentar.',
            'The video is not responding. Check your connection and press Retry.'));
        } else if (playbackRecoveries === 1) {
          const seconds = Math.max(loadStartSeconds, player.getCurrentTime ? player.getCurrentTime() || 0 : 0);
          selectOrderPosition(orderPosition, true, seconds);
        } else {
          skipUnavailable('timeout');
        }
      }, delay);
    }

    function retryLoad() {
      loadStopped = false;
      playbackRecoveries = 0;
      if (ready && playbackAllowed) {
        failedVideoIds.clear();
        selectOrderPosition(orderPosition, false, player.getCurrentTime ? player.getCurrentTime() || 0 : loadStartSeconds);
      } else {
        recoverApi(true);
      }
    }

    function reportIndex() {
      report('INDEX', currentIndex + ':' + orderPosition + ':' + playlistRevision);
    }

    function selectOrderPosition(position, recovery = false, startSeconds = 0) {
      if (!player || !ready || VIDEO_IDS.length === 0) return;
      cancelLoadTimers();
      playbackGeneration += 1;
      if (!recovery) playbackRecoveries = 0;
      playedCurrentVideo = false;
      loadStopped = false;
      loadStartSeconds = Math.max(0, Math.floor(startSeconds));
      if (skipTimer !== null) {
        clearTimeout(skipTimer);
        skipTimer = null;
      }
      orderPosition = ((Number(position) % playOrder.length) + playOrder.length) % playOrder.length;
      currentIndex = playOrder[orderPosition];
      loading(text('Cargando vídeo…', 'Loading video…'));
      captureStableAudioState();
      audioRestorePending = true;
      if (autoplayRetryTimer !== null) {
        clearTimeout(autoplayRetryTimer);
        autoplayRetryTimer = null;
      }
      applyDesiredAudio(player);
      try {
        if (loadStartSeconds > 0) player.loadVideoById({videoId: VIDEO_IDS[currentIndex], startSeconds: loadStartSeconds});
        else player.loadVideoById(VIDEO_IDS[currentIndex]);
        playVideo(player);
        armPlaybackTimeout();
      } catch (failure) {
        showError(text('No se pudo cargar el vídeo. Pulsa Reintentar.', 'Could not load the video. Press Retry.'));
      }
      reportIndex();
    }

    function selectVideo(index) {
      const normalized = ((Number(index) % VIDEO_IDS.length) + VIDEO_IDS.length) % VIDEO_IDS.length;
      const position = playOrder.indexOf(normalized);
      selectOrderPosition(position < 0 ? 0 : position);
    }

    function shuffleForNextCycle() {
      for (let index = playOrder.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [playOrder[index], playOrder[swap]] = [playOrder[swap], playOrder[index]];
      }
      if (playOrder.length > 1 && playOrder[0] === currentIndex) {
        [playOrder[0], playOrder[1]] = [playOrder[1], playOrder[0]];
      }
      orderPosition = -1;
    }

    function nextPlayableOrderPosition(direction) {
      const step = direction < 0 ? -1 : 1;
      if (!orderedPlaylist && step > 0 && orderPosition >= playOrder.length - 1) {
        shuffleForNextCycle();
      }
      for (let offset = 1; offset <= VIDEO_IDS.length; offset += 1) {
        const candidatePosition = ((orderPosition + step * offset)
          % playOrder.length + playOrder.length) % playOrder.length;
        const candidateIndex = playOrder[candidatePosition];
        if (!failedVideoIds.has(VIDEO_IDS[candidateIndex])) return candidatePosition;
      }
      return -1;
    }

    function selectRelative(delta) {
      const nextPosition = nextPlayableOrderPosition(delta);
      if (nextPosition < 0) {
        showError('No se han encontrado vídeos reproducibles.');
        return;
      }
      selectOrderPosition(nextPosition);
    }

    function skipUnavailable(errorCode) {
      if (skipTimer !== null || VIDEO_IDS.length === 0) return;
      cancelLoadTimers();
      failedVideoIds.add(VIDEO_IDS[currentIndex]);
      report('FAILED', currentIndex + ':' + errorCode);
      const nextPosition = nextPlayableOrderPosition(1);
      if (nextPosition < 0) {
        showError('No se han encontrado vídeos reproducibles.');
        return;
      }
      statusBox.className = '';
      statusBox.textContent = 'Cargando vídeo…';
      report('STATE', 'VÍDEO NO REPRODUCIBLE; PASANDO AL SIGUIENTE');
      skipTimer = setTimeout(() => {
        skipTimer = null;
        selectOrderPosition(nextPosition, true);
      }, 100);
    }

    function playVideo(target) {
      if (!target || !active || !playbackAllowed) return;
      if (autoplayRetryTimer !== null) {
        clearTimeout(autoplayRetryTimer);
        autoplayRetryTimer = null;
      }
      if (target.playVideo) target.playVideo();
      autoplayRetryTimer = setTimeout(() => {
        autoplayRetryTimer = null;
        if (!active || target.getPlayerState && target.getPlayerState() === 1) return;
        if (target.playVideo) target.playVideo();
      }, 400);
    }

    function captureStableAudioState() {
      if (!player || !ready || audioRestorePending
          || typeof player.isMuted !== 'function') return;
      desiredMuted = player.isMuted();
      if (typeof player.getVolume === 'function') {
        desiredVolume = Math.max(0, Math.min(100,
          Math.round(player.getVolume())));
      }
      reportAudioState();
    }

    function reportAudioState() {
      const muted = desiredMuted ? 1 : 0;
      if (muted === lastReportedMuted
          && desiredVolume === lastReportedVolume) return;
      lastReportedMuted = muted;
      lastReportedVolume = desiredVolume;
      report('AUDIO', muted + ':' + desiredVolume);
    }

    function applyDesiredAudio(target) {
      if (!target) return;
      if (target.setVolume) target.setVolume(desiredVolume);
      if (desiredMuted) {
        if (target.mute) target.mute();
      } else if (target.unMute) {
        target.unMute();
      }
    }

    function monitorAudioState() {
      if (!player || !ready) return;
      if (audioRestorePending) {
        if (player.isMuted() !== desiredMuted
            || Math.round(player.getVolume()) !== desiredVolume) return;
        audioRestorePending = false;
        reportAudioState();
        return;
      }
      // Native controls own subsequent audio changes. Observe them; never
      // reapply an older snapshot over a real mute/unmute click.
      captureStableAudioState();
    }

    window.coronaSelectVideo = selectVideo;
    window.coronaSelectRelative = selectRelative;
    window.coronaRefreshMutedControl = function () {
      if (player && ready && player.isMuted()) player.mute();
    };
    window.coronaReplaceVideos = function (ids, ordered = false, revision = 0, index = 0) {
      if (!Array.isArray(ids)) return;
      const valid = ids.filter(id => typeof id === 'string'
        && /^[A-Za-z0-9_-]{11}$/.test(id));
      if (valid.length === 0) return;
      VIDEO_IDS = valid;
      orderedPlaylist = ordered;
      playlistRevision = revision;
      failedVideoIds.clear();
      playOrder = VIDEO_IDS.map((ignored, index) => index);
      currentIndex = Math.max(0, Math.min(index, VIDEO_IDS.length - 1));
      orderPosition = currentIndex;
      if (player && ready) selectOrderPosition(orderPosition);
      else reportIndex();
    };
    window.coronaSetActive = function (enabled) {
      active = Boolean(enabled);
      if (!active) cancelLoadTimers();
      else armApiTimeout();
      if (!player || !ready) return;
      if (active) {
        playVideo(player);
        armPlaybackTimeout();
      } else {
        captureStableAudioState();
        reportAudioState();
        player.pauseVideo();
      }
    };

    window.onYouTubeIframeAPIReady = function () {
      try {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: VIDEO_IDS[currentIndex],
        playerVars: {
          // Never let YouTube start the cold iframe before CoronaPoker has
          // applied the real mute state through the supported Player API.
          autoplay: 0,
          // Shorts leaves a detached speaker glyph with controls=0. Keeping
          // native controls enabled binds the glyph to the real audio state.
          controls: 1,
          // Shorts also initializes its native control model from the embed
          // URL. API-only muting can precede that model on a cold process.
          // Supply the same initial state here and still apply the API mute.
          mute: INITIAL_MUTED ? 1 : 0,
          disablekb: 1,
          enablejsapi: 1,
          playsinline: 1,
          rel: 0,
          hl: PLAYER_LANGUAGE,
          cc_load_policy: 0,
          cc_lang_pref: PLAYER_LANGUAGE,
          iv_load_policy: 3,
          fs: 0,
          origin: ORIGIN,
          widget_referrer: ORIGIN,
          start: START_SECONDS
        },
        events: {
          onReady: event => {
            try {
            ready = true;
            cancelLoadTimers();
            loading(text('Cargando vídeo…', 'Loading video…'));
            desiredMuted = INITIAL_MUTED;
            desiredVolume = INITIAL_VOLUME;
            audioRestorePending = true;
            applyDesiredAudio(event.target);
            armApiTimeout();
            report('READY', playlistRevision, response => {
              cancelLoadTimers();
              if (response === 'reload') {
                window.location.reload();
                return;
              }
              playbackAllowed = true;
              loadStopped = false;
              playVideo(event.target);
              armPlaybackTimeout();
              reportIndex();
              report('STATE', INITIAL_MUTED
                ? 'REPRODUCIENDO EN SILENCIO' : 'RESTAURANDO AUDIO');
            }, () => showError(text('No se pudo iniciar el reproductor. Pulsa Reintentar.',
              'Could not start the player. Press Retry.')));
            } catch (failure) {
              showError(text('No se pudo iniciar el reproductor. Pulsa Reintentar.',
                'Could not start the player. Press Retry.'));
            }
          },
          onStateChange: event => {
            if (event.data === 1) {
              cancelLoadTimers();
              playedCurrentVideo = true;
              loadStopped = false;
              playbackRecoveries = 0;
              // Confirm the applied audio state at first playback, before a
              // fast native-control click can precede the polling interval.
              monitorAudioState();
              if (autoplayRetryTimer !== null) {
                clearTimeout(autoplayRetryTimer);
                autoplayRetryTimer = null;
              }
              statusBox.className = 'hidden';
              if (!active) event.target.pauseVideo();
            }
            if (event.data === 2 && (playedCurrentVideo || !active)) cancelLoadTimers();
            if (event.data === 3) armPlaybackTimeout(playedCurrentVideo ? BUFFER_TIMEOUT_MS : PLAYBACK_TIMEOUT_MS);
            const names = { '-1': 'SIN INICIAR', '0': 'FINALIZADO', '1': 'REPRODUCIENDO',
              '2': 'PAUSA', '3': 'CARGANDO', '5': 'PREPARADO' };
            report('STATE', names[String(event.data)] || ('ESTADO ' + event.data));
            if (event.data === 0) selectRelative(1);
          },
          onError: event => {
            if ([2, 5, 100, 101, 150].includes(Number(event.data))) {
              skipUnavailable(event.data);
              return;
            }
            const errors = {
              153: 'El reproductor no recibió una identificación Referer válida (error 153).'
            };
            showError(errors[event.data] || ('El reproductor devolvió el error ' + event.data + '.'));
          },
          onAutoplayBlocked: () => {
            report('STATE', 'REPRODUCCIÓN AUTOMÁTICA BLOQUEADA');
            showError(text('La reproducción automática se ha bloqueado. Pulsa Reintentar.',
              'Automatic playback was blocked. Press Retry.'));
          }
        }
      });
      } catch (failure) {
        showError(text('No se pudo iniciar el reproductor. Pulsa Reintentar.',
          'Could not start the player. Press Retry.'));
      }
    };

    function reportPosition() {
      if (!player || !ready || typeof player.getCurrentTime !== 'function') return;
      report('POSITION', currentIndex + ':' + Math.max(0, Math.floor(player.getCurrentTime()))
        + ':' + playlistRevision);
    }
    function reportSession() {
      captureStableAudioState();
      reportPosition();
    }
    window.coronaReportPosition = reportPosition;
    window.coronaReportSession = reportSession;
    setInterval(reportPosition, 750);
    setInterval(monitorAudioState, 250);

    loading(text('Conectando con el reproductor…', 'Connecting to the player…'));
    report('BOOT', '1');
    armApiTimeout();

    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => recoverApi(false);
    document.head.appendChild(script);
  </script>
</body>
</html>
