zero_trust.fatal_incident_body=CoronaPoker het ’n geverifieerde kritieke toestand verwerp en die tafel gestop voordat hy voortgegaan het. Bevestig hierdie waarskuwing om die geaffekteerde tabel toe te maak.\n\nNul Trustbewyse: {0}
