tooltip.cfg.custom_bots.name=Voer die sigbare naam sonder $ in. Die gereserveerde merker word outomaties bygevoeg.
tooltip.cfg.custom_bots.difficulty=Stel die uitdaging en die taktiek wat die bot gebruik. Maklik speel ontspanning, Normal gebruik 'n meer gedissiplineerde strategie en Hard gebruik gevorderde taktiek.
