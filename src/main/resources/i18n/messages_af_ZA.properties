gdx.settings.option_help.bot_difficulty.easy=Speel gemaklik en maak meer dikwels foute.
gdx.settings.option_help.bot_difficulty.medium=Gebruik 'n meer gedissiplineerde strategie en pas besluite aan soos die hand ontwikkel.
gdx.settings.option_help.bot_difficulty.hard=Gebruik meer gevorderde taktieke, soos om blindes te steel of druk toe te pas wanneer 'n teenstander kwesbaar lyk.
gdx.settings.option_help.custom_bot_personality.random=Kies 'n styl wanneer die bot geskep word en hou dit vir die aktiewe sessie.
gdx.settings.option_help.custom_bot_personality.nit=Voer min hande in en wag gewoonlik vir sterk kaarte voordat jy skyfies waag.
gdx.settings.option_help.custom_bot_personality.station=Is geneig om weddenskappe te bel en in die hand te bly. Raak minder gereeld op.
gdx.settings.option_help.custom_bot_personality.tag=Kies hande selektief en is geneig om die voortou te neem met weddenskappe en verhogings.
gdx.settings.option_help.custom_bot_personality.lag=Speel 'n groter reeks hande en pas druk toe met gereelde weddenskappe en verhogings.
gdx.settings.option_help.ante_mode.traditional=Elke aktiewe speler plaas een tiende van die groot blinde, afgerond tot die naaste sent.
gdx.settings.option_help.ante_mode.big_blind=Die speler in die groot blinde plaas die hele ante, gelyk aan een groot blinde.
