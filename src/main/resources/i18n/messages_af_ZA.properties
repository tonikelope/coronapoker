game.showdown_forfeit_msg=KENNISGEWING: kaarte oop-verifikasie het vir die volgende speler(s) misluk en hul kaarte sal NIE geopenbaar word nie:\n\n%nicks%\n\nDaardie spelers word uitgesluit van kaarte oop-weerstand (outo-vou hierdie pot) en KAN NIE hierdie pot wen nie. Die spel gaan normaal voort.
zero_trust.peer_sra_corrupt=Die kaarte oop-handtekening is eg, maar die eweknie se SRA-sleutel verander nie in geldige kaarte nie. Dit gebeur net as die eweknie doelbewus 'n korrupte sleutel onderteken het of hul kliënt is karig. Ons kan nie sê watter nie, en vir veiligheid beëindig ons die wedstryd.
zero_trust.straddle_recover_mismatch=Terwyl hy die hand teruggekry het, het die gasheer 'n straddle aangekondig wat verskil van die een wat jou eie plaaslike kopie opgeneem het. Dit gebeur slegs as die gasheer peuter met die herstelde straddle of sy kliënt is foutief. Die hand is steeds gerekonstrueer uit jou vertroude kopie, maar ons waarsku jou as 'n voorsorgmaatreël.
zero_trust.rit_recover_mismatch=Terwyl hy die hand herwin het, het die gasheer 'n hardloop-dit-twee keer-resultaat aangekondig wat verskil van die een wat jou eie plaaslike kopie opgeneem het. Dit gebeur slegs as die gasheer met die herstelde resultaat peuter of sy kliënt foutief is. Die hand is steeds gerekonstrueer uit jou vertroude kopie, maar ons waarsku jou as 'n voorsorgmaatreël.
zero_trust.peer_sra_corrupt_registro=\u2014 kaarte oop sleutel geteken, maar pas nie op kaarte nie. Moontlike cheat of kliënt fout.
