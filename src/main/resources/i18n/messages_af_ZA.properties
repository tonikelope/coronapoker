zero_trust.pocket_unlock_refused='n Gekoppelde speler het geweier om hul sleutel af te lewer om sakkaarte te dekripteer. Die wedstryd word gestaak. Hulle sal hul weiering om weer toegelaat te word moet regverdig.
zero_trust.community_unlock_refused='n Verbonde speler het geweier om hul sleutel te lewer om gemeenskapskaarte te openbaar. Die wedstryd word gestaak. Hulle sal hul weiering om weer toegelaat te word moet regverdig.
zero_trust.host_showdown_sig_missing='n kaarte oop-sleutel is van die bediener ontvang SONDER die skrywer se kriptografiese handtekening, of met 'n misvormde handtekening. Die bediener kan die sleutel op die draad vervang.
zero_trust.host_showdown_sig_invalid='n kaarte oop-sleutel is van die bediener ontvang met 'n ONGELDIGE kriptografiese handtekening. Die bediener kan die sleutel op die draad vervang.
zero_trust.host_potcards_mismatch=Die kaarte oop gewone teks wat deur die bediener gestuur word PAS NIE OOR DIE resultaat van die dekripteer van jou plaaslike stuk met die getekende sleutel nie. Die bediener stuur dalk vals kaarte by kaarte oop.
zero_trust.host_community_garbage=Die kriptografiese gemeenskapskaartdata wat vanaf die bediener ontvang word, is inkonsekwent (die stuk dekripteer nie na 'n geldige dekkaart nie, of stem nie ooreen met die bediener se ondertekende aankondiging nie). Moontlike oorsake: 'n FOUT in een of ander weergawe van die sagteware, 'n bedienerweergawe waarvan die kode dalk verander is, of plaaslike identiteitsleutelkorrupsie. Die kliënt kan nie die verskil onderskei nie en beskuldig NIE iemand nie.
zero_trust.host_unlock_out_of_order='n Dekripsieversoek is buite volgorde van die bediener ontvang (verkeerde straat, herhaalde gleuf, fase buite werking, of versoek uitgereik voordat die vorige straat gesluit het).
zero_trust.host_cascade_mid_hand='n Skommel-herbeginversoek is van die bediener ontvang in die middel van 'n deurlopende hand (sou my dekripsiesleutel oorskryf).
zero_trust.host_pocket_extraction='n Dekripsieversoek is vanaf die bediener ontvang wat JOU EIE privaat kaarte sal beïnvloed.
zero_trust.host_community_extraction='n Dekripsieversoek is van die bediener ontvang wat 'n gemeenskapskaart voor die tyd sal openbaar.
zero_trust.host_rotation_replay=Die bediener het 'n tweede kaartrotasie in dieselfde hand versoek. Die wettige rotasie is uniek per hand. 'n Herhaling dui op 'n poging om jou kliënt te gebruik om ander spelers se kaarte te dekripteer.
zero_trust.host_shuffle_proof_failed=Die transaksieverifikasie het misluk: die dek wat die bediener behandel het, kon nie bewys word as 'n eerlike skuif van die genesis-dek nie. Gemeenskapsontsluitings is geweier en hierdie sessie word beëindig om private kaarte te beskerm.
zero_trust.host_shuffle_proof_missing=Die transaksie het aangekom sonder 'n verifieerbare eerlike-skuifbewys vir hierdie hand se dek, en gemeenskapskaarte word nou geopenbaar. Dit kan 'n fout of 'n netwerkvertraging wees, of 'n gasheer wat probeer om die transaksie te manipuleer. Jy kan aanhou speel, maar dit word sterk aanbeveel om hierdie tafel te verlaat.
zero_trust.deck_unverified=Die dek van hierdie hand kon NIE as ’n eerlike skuifel geverifieer word nie. VERDAG: gasheer "{0}", wat die skuifbewys hanteer en uitsaai. Dit kan die gasheer wees wat die transaksie manipuleer of ’n speler wat hul bewyse weerhou het. Die hand word uitgespeel omdat die kaarte reeds uitgedeel is.
zero_trust.deck_unverified_body=Getekende bewyse van hierdie afwyking is aangeteken (in die spellogboek, in rooi en in die betwiste hande-tabel). Jy kan aanhou speel, maar as jy nie die gasheer vertrou nie, verlaat die tafel.
zero_trust.seat_redraw=Die gasheer "{0}" het ’n NUWE sitplektrekking afgedwing. Dit is ONGEWOON: die trekking is kollektief en verifieerbaar, so die gasheer kan nie die sitplekke kies nie, maar dit KAN weer rol totdat dit ’n reëling kry waarvan hy hou. As dit herhaal, is dit dalk die gasheer wat probeer om jou sitplek te rig.
zero_trust.seat_redraw_body=Die nuwe trekking het op dieselfde manier verloop en is steeds verifieerbaar: niemand, die gasheer ingesluit, kan die uitslag kies nie. Dit kan gebeur as 'n speler reg aan die begin val, maar as jy verskeie herproberings sien en jy nie die gasheer vertrou nie, verlaat die tafel. Dit is aangeteken.
zero_trust.seat_recover_mismatch=Met speletjieherwinning stem die sitplekvolgorde wat deur gasheer "{0}" gestuur is NIE ooreen met die een wat jou kliënt gestoor het nie: iemand wat jy reeds geken het, het van sitplek by die tafel verander. Dit kan ’n gasheer wees wat probeer om die sitplekke te herrangskik onder dekking van die herstel.
zero_trust.seat_recover_mismatch_body=Jou kliënt het die sitplekverwysing behou wat dit self aan die begin geverifieer het. Spelers wat tussenin aansluit of verlaat is normaal. Om iemand te herrangskik wat reeds daar was, is nie. As jy nie die gasheer vertrou nie, verlaat die tafel. Dit is aangeteken.
zero_trust.host_recover_action_forged=Die gasheer het tydens speletjieherwinning probeer om 'n GEVALSE aksie (ongeldige handtekening) in te spuit. Jou kliënt het dit geweier.
zero_trust.host_recover_action_omitted=Tydens herstel het die gasheer 'n aksie weggelaat wat JY gespeel het en in jou plaaslike databasis opgeneem het. Jou kliënt het dit teen sy eie kopie bespeur en NIE stilweg jou aksie laat vaar nie.
zero_trust.host_recover_balance_mismatch=Die gasheer het probeer om jou balans (skyfies/inkoop) te verander tydens spelherwinning: dit stem nie ooreen met jou plaaslike rekord nie. Jou kliënt het JOU werklike balans behou.
zero_trust.host_board_peek=Die gasheer het versoek om 'n gemeenskapskaart van 'n FUTURE straat te dekripteer ('n poging om die bord vroeg te lees). Jou kliënt het geweier.
zero_trust.suspect_host_prefix=VERDAG: gasheer "{0}".
zero_trust.suspect_peer_prefix=VERDAG: speler "{0}".
zero_trust.peer_alert=⚠️ [ANOMALE SPELERGEDRAG]
zero_trust.peer_suspicious_header=Abnormale of beledigende gedrag van 'n speler is by jou tafel bespeur:\n
zero_trust.peer_suspicious_body=Die tabel het die bypassende sekuriteitsmaatreël toegepas en die spel gaan voort vir die ander spelers. Goeie trou word veronderstel. Dit kan 'n sagtewarefout wees en niemand word beskuldig nie. Die getuienis word aangeteken.
zero_trust.peer_inbound_flood=Volgehoue ​​gewaarmerkte verkeer bo die anti-DoS-drempel.
zero_trust.peer_binary_flood=Stemboodskap-operasies gestuur teen 'n buitengewoon hoë koers.
zero_trust.host_binary_flood=Die gasheer stuur stemboodskapoperasies teen 'n buitengewoon hoë koers.
zero_trust.peer_flood_log=Anti-DoS-voorval wag op ’n besluit: speler {0}, IP {1}. Rede: {2}
zero_trust.peer_flood_confirm=Gebruiker {0} stuur ’n buitensporige hoeveelheid verkeer. Dit kan ’n DoS-aanval of ’n fout wees. Verdryf hulle uit die speletjie?\n\nIP: {1}\nBespeurde rede: {2}
zero_trust.peer_flood_suppress=Moenie hierdie waarskuwings wys nie
zero_trust.peer_hand_ready_withheld='n Speler antwoord PING maar bevestig nie gereedheid vir die volgende hand terwyl die speletjie aan die gang is nie. Dit was vries die hand begin en is uitgedryf. Die spel gaan sonder hulle voort.
zero_trust.peer_action_withheld='n Speler antwoord PING maar stuur nie sy wedderyaksie terwyl die speletjie aan die gang is nie, verby sy dinktyd. Dit was vriesend die rondte en is UITGESKRYF. Die spel gaan sonder hulle voort.
zero_trust.peer_conf_withheld='n Speler antwoord PING maar bevestig nie ontvangs van 'n transaksieboodskap terwyl die speletjie aan die gang is nie. Dit het die tafel verhinder om te vorder en is UITGESCHAK. Die spel gaan sonder hulle voort.
zero_trust.peer_deal_refusal_expelled='n Speler het verskeie handkansellasies in 'n ry gedwing deur die dek-skommeling of -rotasie te weier. Dit is UITGESKRYF sodat die speletjie kan voortgaan.
zero_trust.suspicious_alert=⚠️ [ANOMALE BEDINERGEDRAG]
zero_trust.suspicious_header=Jou kliënt het abnormale bedienergedrag bespeur (nie 'n kritieke voorval wat die speletjie vries nie):\n
zero_trust.suspicious_body=Jou kliënt het die abnormale operasie verwerp en die speletjie KAN voortgaan. Ons aanvaar goeie trou: dit kan 'n sagteware-FOUT (kliënt of bediener) wees en niemand word beskuldig nie. Maar aangesien 'n fout nie afgesien kan word van peuter nie, WORD DIT VIR JOU VEILIGHEID STERK AANBEVEEL OM hierdie tafel te verlaat deur die 'Verlaat'-knoppie te gebruik (jou geld sal NIE in hierdie hand verwerk word nie).
zero_trust.host_bad_wire='n Dekripsieversoek is van die bediener ontvang met 'n ongeldige formaat of punte wat nie aan die kriptografiese kurwe behoort nie.
zero_trust.host_critical_command_invalid=Die kritieke {0}-opdrag wat deur die bediener gestuur is, kon nie bekragtig word nie. Dit kan ’n onverenigbaarheid, ’n fout of ’n gewysigde bediener wees. Die sessie word gestop om die integriteit daarvan te beskerm.
zero_trust.cheater_detected=[ZERO-TRUST] 'n Speler met 'n gewysigde CoronaPoker-weergawe is opgespoor, wat daarop dui dat hulle dalk probeer kul. Wil jy voortgaan?
zero_trust.corrupted_mac_action=Die bediener het probeer om 'n handeling met 'n ongeldige kriptografiese handtekening (korrupte MAC) te verwerk namens:
zero_trust.critical=\u274c [ZERO-TRUST] KRITIESE WAARSKUWING: ONJELDIGE HANDTEKENING OF GEBROKE KONSENSUS.
zero_trust.critical_alert_body=KWARANTYNSTAAT GEAKTIVEER:\nJou kliënt SAL NIE meer kriptografiese sleutels na die bediener in hierdie sessie stuur nie.\nDie spel is wiskundig gevries om jou balans te beskerm.\n\nDie MOONTLIKE oorsake is:\n  - 'n BUG in die kliëntkode self,\n  - 'n BUG in die bedienerkode, of\n  - 'n SERVER wie se kode moontlik verander is.\n\nDie kliënt kan nie tussen hulle onderskei nie en GEEN beskuldiging word geïmpliseer nie. Vir veiligheid, en hangende hersiening van die hoofoorsaak, word dit AANBEVEEL dat jy hierdie speletjie VERLAAT met die 'Verlaat'-knoppie (jou geld sal NIE in hierdie hand verwerk word nie).
zero_trust.critical_alert_header=NUL-TRUST VOORVAL!\n\nJou kliënt het 'n afwyking in die kriptografiese protokol bespeur:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITIESE SESSIE FOUT
zero_trust.decrypting_street=[ZERO-TRUST] DEKRIPTEER STRAAT...
zero_trust.wait_deal=Wag vir spelers se bydraes om te skommel en uit te deel.
zero_trust.wait_shuffle_proof=Wag vir die kriptografiese bewys van die skommeling.
zero_trust.wait_sra_unlock=Wag vir die SRA-sleutels om {0} oop te maak.
game.settlement_verification_wait=Wag vir die kwitansies om die hand te verifieer en die saldo’s te bevestig.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Vinnige konsensus-timeout. Dwing vooruitgang.
zero_trust.forged_identity_action=Die bediener het probeer om 'n aksie met 'n vervalste identiteitshandtekening te verwerk namens:
zero_trust.game_aborted=[ZERO-TRUST] Speletjie is afgelas. Skop die cheaters.
zero_trust.generating_kem=[NUL-TRUST] KEM (P2P) GENEREER ...
zero_trust.invalid_mac=\u26a0\ufe0f [ZERO-TRUST ALERT] Ongeldige MAC op gemeenskapskaarte. Moontlike manipulasie.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] KONSENSUS-KRIPTOGRAFIESE VERIFIKASIE: ALLE SPELERS HET GESERTIFISEER OM HULLE PLAASLIKE HAND KRIPTOGRAFIESE VERIFIKASIE TE SLAAG.
zero_trust.legit2_error=\u274c [ZERO-TRUST] KONSENSUS KRIPTOGRAFIESE VERIFIKASIE: MINSTENS EEN SPELER HET NIE GESERTIFISEER OM HUL PLAASLIKE HAND KRIPTOGRAFIESE VERIFIKASIE SLAAG NIE.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] PLAASLIKE HAND KRYPTOGRAFIESE VERIFIKASIE: MY KAARTE, GEMEENSKAPSKAARTE EN ALLE AANGETEKEN HANDELINGE IS LEGITIEM.
zero_trust.legit_error=\u274c [ZERO-TRUST] PLAASLIKE HANDKRIPTOGRAFIESE VERIFIKASIE: NIE IN STAAT OM TE VERSEKER DAT MY KAARTE, GEMEENSKAPSKAARTE EN ALLE AANGETEKEN HANDELINGE WEGTIEM IS NIE.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Kwarantyn geaktiveer. Blokkeer oordrag van kriptografiese sleutels.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Geen vorige binêre logboek vir hierdie hand nie.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: OUDIT GEHEUUE...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] 'n Speler met 'n gewysigde CoronaPoker-weergawe is opgespoor, wat daarop dui dat hulle dalk probeer kul.
zero_trust.p2p_finished_resuming=P2P KEM-verifikasie voltooi. Hervat tans hand...
zero_trust.p2p_generating_challenges=[NUL-VERTROUE] P2P: GENEREER UITDAGINGS...
zero_trust.p2p_timeout=P2P Swerm Timeout! Sommige spelers is as onbetroubaar gemerk.
