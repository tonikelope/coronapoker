gdx.settings.option_help.ante_mode.small_blind=Die speler in die klein blinde plaas die hele ante, gelyk aan een groot blinde.
gdx.settings.option_help.rebuy_cap.buy_in=Jou maksimum stapel na 'n herinkoop is gebaseer op die speletjie se inkoop.
gdx.settings.option_help.rebuy_cap.highest_stack=Herinkoop tot by die grootste stapel aan die tafel. Die pet val nooit onder die standaard inkoop nie.
gdx.settings.option_help.rabbit.off=Ongedeelde gemeenskapskaarte bly versteek nadat die hand geëindig het.
gdx.settings.option_help.rabbit.free=Jy kan vra om ongedeelde gemeenskapskaarte te sien nadat die hand geëindig het sonder om skyfies te betaal.
gdx.settings.option_help.rabbit.free_small_blind=Jou eerste versoek van die speletjie is gratis. Elke latere versoek kos een klein blinde.
