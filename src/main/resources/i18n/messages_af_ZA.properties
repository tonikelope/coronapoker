game.popup_verificacion_firma_invalida=Tydens hierdie hand, een of meer deelnemers ({0}) ’n ongeldige kriptografiese handtekening op ’n handeling bespeur.\n\nDie data wat deur alle deelnemers ontvang is, was konsekwent (die finale ketting-hashes het ooreenstem), maar ten minste een aksie is nie behoorlik deur die verwagte outeur onderteken nie.\n\nCoronaPoker het veilige handsluiting gestop en sal die tafel as ’n sekuriteitsmislukking toemaak nadat hierdie waarskuwing erken is.\n\nBewyse gestoor in:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Kennisgewing: {0} het nie die eerlike skuifbewys vir hierdie hand ontvang nie. Bewyse: {1}
game.popup_verificacion_host_sin_prueba=Een of meer deelnemers ({0}) het nie die eerlike-skuifbewys vir hierdie hand ontvang nie.\n\nDie finale ketting-hashes stem ooreen met alle deelnemers, so die handaksies is konsekwent. ’n Korrekte gasheer stuur altyd hierdie bewys, so ’n herhaalde of eweknie-selektiewe afwesigheid kan gewysigde sagteware of ’n sagtewarefout aandui.\n\nDie hand was vas, maar om die wedstryd te verlaat word aanbeveel as ’n voorsorgmaatreël.\n\nBewyse gestoor in:\n{1}
game.popup_verificacion_titulo_alerta=Kriptografiese verifikasie divergensie
game.popup_verificacion_titulo_aviso=Kriptografiese verifikasie onvolledig
game.popup_verificacion_divergente=Een of meer deelnemers het ’n ander kriptografiese verifikasie van die finale handstaat gerapporteer.\n\nDit kan veroorsaak word deur gewysigde sagteware of deur ’n sagtewarefout. CoronaPoker kan nie outomaties die oorsaak of wie dit veroorsaak het bepaal nie.\n\nCoronaPoker het veilige handsluiting gestop en sal die tafel as ’n sekuriteitsmislukking toemaak nadat hierdie waarskuwing erken is.\n\nBewyse gestoor in:\n{0}
game.popup_verificacion_ausente=Die laaste hand kon nie konsensus bereik nie omdat speler {0} nie ’n sluitingshandtekening gestuur het nie.\n\nDit kan veroorsaak word deur ’n netwerkonderbreking, ’n kliëntfout of gewysigde sagteware. CoronaPoker het veilige handsluiting gestop en sal die tafel as ’n sekuriteitsfout toemaak nadat hierdie waarskuwing erken is.\n\nBewyse gestoor in:\n{1}
game.mano_verificacion_interrumpida=KRITIES: Veilige handsluiting het misluk ({0}). Die tafel sal toemaak as ’n sekuriteitsfout. Bewyse: {1}
game.popup_verificacion_interrumpida=CoronaPoker kon nie die kriptografiese sluitingsprotokol vir die laaste hand voltooi nie.\n\nFout: {0}\n\nDie hand bly oop vir herstel. Die tabel sal eers as ’n sekuriteitsfout toemaak nadat hierdie waarskuwing erken is.\n\nBewyse gestoor in:\n{1}
