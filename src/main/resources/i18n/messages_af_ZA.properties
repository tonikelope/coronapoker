game.recover_accion_ausencia=⚠ Kennisgewing: die gasheer het aksies later as jou laaste aangetekende aksie herhaal, waarskynlik gespeel terwyl jy buite die hand was - hulle kan nie geverifieer word nie en word aanvaar soos die gasheer dit gestuur het
game.mano_verificacion_divergente=⚠ KRIPTOGRAFIESE VERIFIKASIE-DIVERGENSIE. Een of meer deelnemers het ’n ander finale handstatus aangemeld. Bewyse: {0}
