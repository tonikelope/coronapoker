zero_trust.action_rejected_invalid_signature=\u26a0\ufe0f [НУЛЕВО ДОВЕРИЕ] Отхвърлено действие (Невалиден подпис) -> {0}
zero_trust.auditing_memory=[ZERO-TRUST] Одит на рояк RAM памет...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Двоичен дневник, зареден в паметта ({0} подписи, готови за синхронизирано възпроизвеждане).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Каскадата за криптографско разбъркване е неуспешна. Ръката е отменена.
zero_trust.unlock_failed=\u274c [НУЛЕВО ДОВЕРИЕ] Неуспешно отключване на частни карти (играч не отговори навреме). Ръката е отменена.
zero_trust.card_resolve_failed=\u274c [НУЛЕВО ДОВЕРИЕ] Декриптирана карта не съответства на нито една валидна карта в тестето. Играта е отменена.
peer.not_enough_players=Играч отпадна по време на разбъркването и вече няма достатъчно играчи, които да раздадат ръката.
peer.unlock_no_testament=Играч прекъсна връзката, без да остави ключа си за дешифриране. Ръката е отменена.
peer.broadcast_failed=Мрежова грешка при излъчване на лични карти. Ръката е отменена.
peer.recovery_action_data_unavailable=Запазената хронология на действията не може да бъде прочетена. Ръката е отменена безопасно и ще се върне към възстановяване.
straddle.deferred_release_failed=Картите блиндове страдъл не можаха да бъдат разкрити (играч прекъсна връзката или отказа да сътрудничи). Ръката е отменена.
peer.state_inconsistent=Състоянието на дилъра стана непоследователно. Ръката е отменена.
peer.bot_no_token=Ботът няма готов ключ за дешифриране. Ръката е отменена.
peer.community_unlock_no_testament=Играч прекъсна връзката, без да остави ключа си, за да разкрие общи карти. Ръката е отменена.
peer.dropped_during_cascade=Играч прекъсна връзката по време на криптографското разбъркване на колодата. Ръката е отменена.
peer.dropped_during_rotation=Играч прекъсна връзката по време на криптографската ротация на колодата. Ръката е отменена.
zero_trust.rotation_refused=Свързан играч отказа да достави своя ключ за въртене на колодата. Играта е спряна. Те ще трябва да обосноват отказа си да бъдат повторно допуснати.
zero_trust.cascade_refused=Свързан играч отказа да участва в каскадата за разбъркване на тестетата. Играта е спряна. Те ще трябва да обосноват отказа си да бъдат повторно допуснати.
zero_trust.pocket_unlock_refused=Свързан играч отказа да достави своя ключ за дешифриране на джобни карти. Играта е спряна. Те ще трябва да обосноват отказа си да бъдат повторно допуснати.
zero_trust.community_unlock_refused=Свързан играч отказа да достави своя ключ за разкриване на общи карти. Играта е спряна. Те ще трябва да обосноват отказа си да бъдат повторно допуснати.
zero_trust.host_showdown_sig_missing=От сървъра е получен ключ шоудаун БЕЗ криптографския подпис на автора или с неправилно образуван подпис. Сървърът може да замества ключа на кабела.
zero_trust.host_showdown_sig_invalid=От сървъра е получен ключ шоудаун с НЕВАЛИДЕН криптографски подпис. Сървърът може да замества ключа на кабела.
zero_trust.host_potcards_mismatch=Изпратеният от сървъра обикновен текст шоудаун НЕ СЪВПАДА с резултата от дешифрирането на вашата локална част с подписания ключ. Сървърът може да изпраща фалшиви карти на шоудаун.
zero_trust.host_community_garbage=Криптографските данни за общата карта, получени от сървъра, са несъвместими (частта не се декриптира до валидна тесте карта или не съвпада с подписаното съобщение на сървъра). Възможни причини: ГРЕШКА в някоя версия на софтуера, сървърна версия, чийто код може да е бил променен, или повреда на локалния ключ за самоличност. Клиентът не може да направи разлика и НЕ обвинява никого.
zero_trust.host_unlock_out_of_order=От сървъра е получена заявка за декриптиране извън последователността (грешна улица, повторен слот, постепенно прекъсване на реда или заявка, издадена преди затварянето на предишната улица).
zero_trust.host_cascade_mid_hand=Заявка за рестартиране на разбъркване е получена от сървъра по средата на текуща ръка (би презаписала моя ключ за дешифриране).
zero_trust.host_pocket_extraction=От сървъра е получена заявка за дешифриране, която ще засегне ВАШИТЕ СОБСТВЕНИ лични карти.
zero_trust.host_community_extraction=От сървъра е получена заявка за дешифриране, която ще разкрие обща карта преди време.
zero_trust.host_rotation_replay=Сървърът поиска втора ротация на картата в същата ръка. Законната ротация е уникална за всяка ръка. Повторението предполага опит за използване на вашия клиент за дешифриране на картите на други играчи.
zero_trust.host_shuffle_proof_failed=Проверката на сделката е неуспешна: тестето, което сървърът е раздал, не може да бъде доказано, че е честно разбъркване на колодата Genesis. Отключванията от общността са отказани и тази сесия се прекратява, за да се защитят личните карти.
zero_trust.host_shuffle_proof_missing=Сделката пристигна без проверимо доказателство за честно разбъркване за тестето на тази ръка и сега се разкриват общи карти. Може да е грешка или забавяне на мрежата, или хост, който се опитва да манипулира сделката. Можете да продължите да играете, но силно се препоръчва да напуснете тази маса.
zero_trust.deck_unverified=Тестето на тази ръка НЕ ​​може да бъде потвърдено като честно разбъркване. ПОДОЗРЯН: водещ "{0}", който раздава и излъчва доказателството за разбъркване. Възможно е домакинът да манипулира сделката или играч, който е скрил доказателството си. Ръката е изиграна, защото картите вече са раздадени.
zero_trust.deck_unverified_body=Подписано доказателство за тази аномалия е записано (в дневника на играта, в червено и в таблицата със спорни ръце). Можете да продължите да играете, но ако нямате доверие на домакина, напуснете масата.
zero_trust.seat_redraw=Домакинът "{0}" наложи теглене на НОВО място. Това е НЕОБИЧАЙНО: тегленето е колективно и подлежи на проверка, така че домакинът не може да избира местата, но МОЖЕ да прехвърли отново, докато получи подредба, която харесва. Ако се повтаря, може домакинът да се опитва да монтира мястото ви.
zero_trust.seat_redraw_body=Новото теглене протече по същия начин и все още може да се провери: никой, включително домакинът, не може да избере резултата. Може да се случи, ако играч отпадне в началото, но ако видите няколко повторения и нямате доверие на домакина, напуснете масата. Записано е.
zero_trust.seat_recover_mismatch=При възстановяване на играта редът за сядане, изпратен от домакина "{0}", НЕ съвпада с този, който вашият клиент е запазил: някой, когото вече познавате, е променил мястото си на масата. Може да е домакин, който се опитва да пренареди местата под прикритието на възстановяването.
zero_trust.seat_recover_mismatch_body=Вашият клиент запази референцията за местата, която провери в началото. Присъединяването или напускането на играчи между тях е нормално. Пренареждане на някой, който вече е бил там, не е. Ако нямате доверие на домакина, напуснете масата. Записано е.
zero_trust.host_recover_action_forged=Хостът се опита да инжектира FORGED действие (невалиден подпис) по време на възстановяване на играта. Вашият клиент го отказа.
zero_trust.host_recover_action_omitted=По време на възстановяване хостът е пропуснал действие, което ВИЕ сте изпълнили и сте записали във вашата локална база данни. Вашият клиент го е открил спрямо собственото си копие и НЕ е отхвърлил тихомълком вашето действие.
zero_trust.host_recover_balance_mismatch=Домакинът се опита да промени вашия баланс (чипове/вход) по време на възстановяването на играта: той не съответства на вашия местен рекорд. Вашият клиент запази ВАШИЯ реален баланс.
zero_trust.host_board_peek=Домакинът поиска да дешифрира обща карта от БЪДЕЩА улица (опит за рано прочитане на дъската). Вашият клиент отказа.
zero_trust.suspect_host_prefix=ПОДОЗРЯН: хост "{0}".
zero_trust.suspect_peer_prefix=ЗАПОДОЗРЕН: играч "{0}".
zero_trust.peer_alert=⚠️ [АНОМАЛНО ПОВЕДЕНИЕ НА ИГРАЧ]
zero_trust.peer_suspicious_header=На вашата маса е открито ненормално или обидно поведение от страна на играч: \n
zero_trust.peer_suspicious_body=Масата приложи съответната мярка за сигурност и играта продължава за останалите играчи. Добросъвестността се предполага. Може да е софтуерна грешка и никой не е обвинен. Доказателствата са протоколирани.
zero_trust.peer_inbound_flood=Устойчив удостоверен трафик над анти-DoS прага.
zero_trust.peer_binary_flood=Операциите с гласови съобщения се изпращат с необичайно висока скорост.
zero_trust.host_binary_flood=Хостът изпраща операции с гласови съобщения с необичайно висока скорост.
zero_trust.peer_flood_log=Анти-DoS инцидент, очакващ решение: играч {0}, IP {1}. Причина: {2}
zero_trust.peer_flood_confirm=Потребителят {0} изпраща прекалено много трафик. Това може да е DoS атака или грешка. Да ги изгоним от играта?\n\nIP: {1}\nОткрита причина: {2}
zero_trust.peer_flood_suppress=Не показвайте тези предупреждения
zero_trust.peer_hand_ready_withheld=Играч отговаря на PING, но не потвърждава готовността си за следващата ръка, докато играта тече. Стартът на ръката беше смразяващ и беше ИЗГОНЕН. Играта продължава без тях.
zero_trust.peer_action_withheld=Играч отговаря на PING, но не изпраща своето действие за залагане, докато играта тече, след времето за мислене. Беше смразяващ кръга и беше ИЗГОНЕН. Играта продължава без тях.
zero_trust.peer_conf_withheld=Играч отговаря на PING, но не потвърждава получаването на съобщение за раздаване, докато играта тече. Блокираше напредването на масата и беше ИЗГОНЕНО. Играта продължава без тях.
zero_trust.peer_deal_refusal_expelled=Играч принуди няколко последователни отменени ръце, като отказа разбъркване или завъртане на тестето. Той е ИЗГОНЕН, така че играта може да продължи.
zero_trust.suspicious_alert=⚠️ [АНОМАЛНО ПОВЕДЕНИЕ НА СЪРВЪРА]
zero_trust.suspicious_header=Вашият клиент е открил необичайно поведение на сървъра (не критичен инцидент, който замразява играта): \n
zero_trust.suspicious_body=Вашият клиент отхвърли аномалната операция и играта МОЖЕ да продължи. Предполагаме добросъвестно: това може да е софтуерна ГРЕШКА (клиент или сървър) и никой не е обвинен. Но тъй като бъгът не може да се разграничи от подправянето, ЗА ВАШАТА БЕЗОПАСНОСТ Е СИЛНО ПРЕПОРЪЧИТЕЛНО ДА НАПУСНЕТЕ тази маса, като използвате бутона „Напусни“ (вашите пари НЯМА да бъдат обработени в тази ръка).
zero_trust.host_bad_wire=От сървъра е получена заявка за дешифриране с невалиден формат или точки, които не принадлежат на криптографската крива.
zero_trust.host_critical_command_invalid=Критичната команда {0}, изпратена от сървъра, не може да бъде валидирана. Това може да е несъвместимост, грешка или модифициран сървър. Сесията е спряна, за да се защити нейната цялост.
zero_trust.cheater_detected=[ZERO-TRUST] Открит е играч с модифицирана версия CoronaPoker, което предполага, че може да се опитва да мами. Искате ли да продължите?
zero_trust.corrupted_mac_action=Сървърът се опита да обработи действие с невалиден криптографски подпис (повреден MAC) от името на:
zero_trust.critical=\u274c [НУЛЕВО ДОВЕРИЕ] КРИТИЧЕН ПРЕДУПРЕЖДЕНИЕ: НЕВАЛИДЕН ПОДПИС ИЛИ НАРУШЕН КОНСЕНСУС.
zero_trust.critical_alert_body=АКТИВИРАНО СЪСТОЯНИЕ НА КАРАНТИНА:\nВашият клиент НЯМА да изпраща повече криптографски ключове към сървъра в тази сесия.\nИграта е математически замразена, за да защити баланса ви.\n\nВЪЗМОЖНИТЕ причини са:\n - ГРЕШКА в кода на клиента себе си,\n - ГРЕШКА в кода на сървъра, или\n - СЪРВЪР, чийто код може да е бил променен.\n\nКлиентът не може да направи разлика между тях и НЕ се подразбира обвинение. За безопасност и в очакване на преглед на първопричината, ПРЕПОРЪЧИТЕЛНО е да НАПУСНЕТЕ тази игра, като използвате бутона „Изход“ (вашите пари НЯМА да бъдат обработени в тази ръка).
zero_trust.critical_alert_header=ИНЦИДЕНТ С НУЛЕВО ДОВЕРИЕ!\n\nВашият клиент е открил аномалия в криптографския протокол:\n
zero_trust.critical_session_error=[НУЛЕВО ДОВЕРИЕ] КРИТИЧНА ГРЕШКА В СЕСИЯТА
