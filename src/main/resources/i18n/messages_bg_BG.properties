tooltip.cfg.ante=Добавя принудителен принос към пота след блиндове. Режимът определя кой и колко плаща.
tooltip.cfg.ante_mode=В традиционен режим всеки активен играч плаща 10% от голям блинд. В BBA, BA или SBA, голям блинд, бутонът или малък блинд плаща едно голям блинд. Блиндове са публикувани първи.
tooltip.cfg.blind_cap=Спира блиндове се увеличава при конфигурираната горна граница.
tooltip.cfg.blinds_level=Започвайки от блиндове (малък/голям) за играта.
tooltip.cfg.bot_balance=Когато играта приключи, комбинираният баланс на ботовете се разделя поравно между човешките играчи, така че истинските пари се уреждат само между хората.
tooltip.cfg.bot_rebuy=Глобален автоматичен контрол повторно купуване за всеки бот. Изключването му също деактивира настройките повторно купуване на персонализирани ботове.
tooltip.cfg.bots=Задава трудността на стандартните ботове. Персонализираните ботове запазват трудността, конфигурирана индивидуално в Bot Manager.
tooltip.cfg.buyin_fixed=Всички започват с едно и също вход. Когато е изключено, играчите избират в рамките на конфигурирания диапазон.
tooltip.cfg.double_blinds=Преминава към следващото ниво блиндове в структурата след определен брой ръце или минути.
tooltip.cfg.hand_limit=Играта приключва, когато се достигне този брой ръце.
tooltip.cfg.iwtsth=Позволява ви да поискате да видите ръката на съперник при шоудаун.
tooltip.cfg.rabbit=Разкрива нераздадени общи карти след ръката. Първата заявка на всеки играч е безплатна. Избраният режим определя дали по-късните заявки остават безплатни или струват малко или голям блинд.
tooltip.cfg.rebuy_limit=Максимален брой повторни покупки на играч.
tooltip.cfg.recover=Възобновява игра, която преди е била прекъсната.
tooltip.cfg.rit=Позволява гласуване за раздаване на оставащите карти два пъти, когато Ол-ин затвори залагането.
tooltip.cfg.straddle=Играчът след голям блинд може да публикува две голям блинд, преди да види своите карти и да действа последен префлоп.
tooltip.cfg.straddle_on_timeout=Публикувайте страдъл автоматично, когато подканата изтече. Това засяга само вашия плейър и е изключено по подразбиране.
tooltip.cfg.structure=Структура на ниво Блиндове за играта.
tooltip.cfg.think_time=Налични секунди за вземане на решение. Автоматичното действие се изпълнява, когато времето изтече.
tooltip.cfg.showdown_time=Секунди резултатът от ръката остава на екрана, преди да бъде раздадена следващата ръка.
tooltip.cfg.allow_hot_join=Позволява на нови играчи да се присъединят като ЗАГРЯВАЩИ и да влязат в следващата ръка. Когато се промени по време на игра, това засяга само новите опити за свързване.
tooltip.cfg.card_flip_duration=Задава колко време отнема всяка карта, за да завърши реда си, когато се разкрие.
tooltip.cfg.card_flip_direction=Избира по какъв начин да се обърнат картите, когато се разкрият. Смесено избира посока за всяко разкриване. Картите в една и съща група се обръщат по същия начин.
tooltip.cfg.reparto_velocidad=Задава колко време отнема всяка карта, за да пътува от тестето до мястото си.
tooltip.cfg.community_deal_style=Изберете дали всичките пет общи карти да бъдат раздадени с лицето надолу в началото или на собствената им улица. Запазените промени се прилагат от следващата ръка.
tooltip.cfg.anim_calidad=Качеството запазва всеки визуален детайл. Производителността намалява цената на картовите полети и разкрива на по-слаби компютри.
tooltip.cfg.downgrade_velocidad=Задава колко време отнема на масата да пренареди местата си, когато играч напусне.
tooltip.cfg.swap_velocidad=Задава колко време е необходимо на вашите карти, за да се пресекат, когато са сортирани.
tooltip.cfg.swap_estilo=Arc вдига една карта над друга. Хоризонталните ги пресичат на еднаква височина.
tooltip.cfg.resaltar_avatares=Поставянето на мишката за момент върху аватара на играча го показва увеличен над масата, до неговото име и стека, и изчезва, когато преместите мишката от него.
tooltip.cfg.resaltar_jugada_showdown=По време на шоудаун, задържането на мишката над името на която и да е ръка на играча (победител или губещ) осветява само картите, които го съставят, и затъмнява останалите.
tooltip.cfg.screenshot_fin_timba=Автоматично запазва екранна снимка на последния екран, когато броячът на парите приключи (или когато го напуснете, ако напуснете по-рано).
tooltip.cfg.server_ip=Адрес (IP или домейн), където сървърът на играта слуша.
tooltip.cfg.server_port=TCP порт от 1 до 65535, който сървърът слуша.
tooltip.cfg.upnp=Моли вашия рутер да препрати този порт TCP към хоста, докато сесията на играта се затвори.
tooltip.cfg.preset=Зарежда профил със запазени настройки.
tooltip.cfg.preset_save=Запазва текущите настройки като профил за многократна употреба.
tooltip.cfg.preset_delete=Изтрива избрания профил за настройки.
tooltip.cfg.buyin=Чипове, с които всеки играч започва на масата.
tooltip.cfg.buyin_range=С променлива вход, всеки играч избира своя вход в рамките на този диапазон (в голям блинд).
tooltip.cfg.volume=Общ обем на играта.
tooltip.cfg.sound_master=Активира или заглушава музиката, звуковите ефекти и аудиото за чат. Покер видео плейърът има собствен обем.
tooltip.cfg.music_master=Включва или изключва цялата музика.
tooltip.cfg.fx_master=Включва или изключва всички звукови ефекти.
tooltip.cfg.game_start_sound=Възпроизвежда началния звук, когато играта започне или бъде възстановена.
tooltip.cfg.music_surface=Активира музиката за този екран или момент. Бутонът за възпроизвеждане го визуализира, без да излизате от настройките.
tooltip.cfg.recovery_music=Активира музиката, която се възпроизвежда, докато се възстановява прекъсната игра.
tooltip.cfg.silly_sounds=Активира звуци на шеги, които могат да се възпроизведат по време на играта.
gdx.settings.tooltip.mod_audio_override=Използва се версията, предоставена от заредения MOD.
tooltip.cfg.play_own_notes=Също така възпроизвежда вашите собствени гласови бележки, когато ги изпращате.
tooltip.cfg.notes_retention=Задава колко дълго да се съхраняват гласовите бележки. С „Завинаги“ те се изтриват само ръчно.
tooltip.cfg.purge_notes=Изтрива всички запазени гласови бележки в момента.
tooltip.cfg.view_notes=Отваря визуализатора за запазени гласови бележки.
tooltip.cfg.voice_notes_rule=Правило за таблица: позволява изпращане и получаване на гласови бележки.
tooltip.cfg.notes_local=Активира гласови бележки на вашето устройство (запис и възпроизвеждане).
tooltip.cfg.tts=Позволява да се четат на глас съобщения за чат на маса. Всеки играч може да заглуши текст-към-говор на своето устройство.
tooltip.cfg.display_mode=Изберете между прозорци, цял екран без рамки и изключителен цял екран. Прилага се при запазване.
tooltip.cfg.compact_view=Намалява чиповете и картите, за да покаже повече маса. Състояния: изключено, компактно, компактно с малки карти, а също и собственоръчно компактно.
tooltip.cfg.dialog_zoom=Мащабира диалозите и техния текст. Може да се промени само от началния екран. Прилага се към следващия диалогов прозорец, който отворите.
tooltip.cfg.deck=Дизайн на тесте карти.
tooltip.cfg.table_renderer=Изберете GDX или Swing Legacy за следващата таблица. Не може да се променя по време на игра.
tooltip.cfg.table_renderer_cli=Рендерингът е принуден за това изпълнение от командния ред.
tooltip.cfg.deck_back=Дизайн на гърба на картата.
tooltip.cfg.table_felt=Цвят филц за маса.
tooltip.cfg.nivel_luz=Колко яркост (%) запазва масата при изключени светлини, независимо дали вие ги изключвате сами или те изгасват сами (пауза, играта приключи). Колкото по-ниско е, толкова по-тъмно изглежда. 35% по подразбиране.
