game.showdown_forfeit_msg=ЗАБЕЛЕЖКА: шоудаун проверката е неуспешна за следния играч(и) и техните карти НЯМА да бъдат разкрити:\n\n%nicks%\n\nТези играчи са изключени от шоудаун съпротива (автоматично фолд) и НЕ МОГАТ да спечелят този пот. Играта продължава нормално.
zero_trust.peer_sra_corrupt=Подписът шоудаун е истински, но SRA ключът на партньора не се разрешава до валидни карти. Това се случва само ако партньорът умишлено е подписал повреден ключ или техният клиент е с грешки. Не можем да кажем кои и за безопасност прекратяваме играта.
zero_trust.straddle_recover_mismatch=Докато прибираше ръката, домакинът обяви страдъл, различен от този, който вашето собствено локално копие беше записало. Това се случва само ако хостът намеси възстановения страдъл или неговият клиент е с грешки. Ръката все още е реконструирана от вашето доверено копие, но ви предупреждаваме като предпазна мярка.
zero_trust.rit_recover_mismatch=Докато възстановяваше ръката, домакинът обяви резултат от стартиране два пъти, различен от този, който вашето собствено локално копие беше записало. Това се случва само ако хостът подправя възстановения резултат или неговият клиент е с грешки. Ръката все още е реконструирана от вашето доверено копие, но ви предупреждаваме като предпазна мярка.
zero_trust.peer_sra_corrupt_registro=Ключът \u2014 шоудаун е подписан, но не се преобразува в карти. Възможна измама или клиентска грешка.
