tooltip.cfg.custom_bots=Активира персонализирания каталог. Първо се добавят конфигурирани профили, последвани от стандартни ботове.
tooltip.cfg.custom_bots.only=Предотвратява добавянето на стандартни ботове. Не могат да се добавят повече ботове след изчерпването на персонализирания каталог.
tooltip.cfg.custom_bots.manage=Отворете мениджъра, за да създавате, редактирате и подреждате своите ботове. Можете да изберете тяхната трудност и стил.
tooltip.cfg.custom_bots.row=Изберете този бот, за да редактирате неговото име, аватар, трудност, стил или повторно купуване.
tooltip.cfg.custom_bots.avatar=Изберете валидно изображение или запазете официалния аватар на бота. CoronaPoker съхранява безопасно копие, за да не се загуби.
tooltip.cfg.custom_bots.name=Въведете видимото име без $. Запазеният маркер се добавя автоматично.
tooltip.cfg.custom_bots.difficulty=Задава предизвикателството и тактиката, която ботът използва. Easy играе развлекателно, Normal използва по-дисциплинирана стратегия, а Hard използва напреднали тактики.
tooltip.cfg.custom_bots.personality=Задава основния стил. Random го избира, когато ботът е създаден, и го запазва за активната сесия. Ботът може да адаптира своите решения към ситуацията.
gdx.settings.option_help.bot_difficulty.easy=Играе небрежно и прави грешки по-често.
gdx.settings.option_help.bot_difficulty.medium=Използва по-дисциплинирана стратегия и коригира решенията с развитието на ръката.
gdx.settings.option_help.bot_difficulty.hard=Използва по-усъвършенствани тактики, като кражба на блиндове или оказване на натиск, когато опонентът изглежда уязвим.
gdx.settings.option_help.custom_bot_personality.random=Избира стил, когато ботът е създаден, и го запазва за активната сесия.
gdx.settings.option_help.custom_bot_personality.nit=Влиза в малко ръце и обикновено чака силни карти, преди да рискува с чипове.
gdx.settings.option_help.custom_bot_personality.station=Има склонност да плаща залози и да остава в ръката. Повишава по-рядко.
gdx.settings.option_help.custom_bot_personality.tag=Избира ръце селективно и е склонен да поеме лидерството със залози и рейзове.
gdx.settings.option_help.custom_bot_personality.lag=Играе с по-широк диапазон от ръце и упражнява натиск с чести залози и рейзове.
gdx.settings.option_help.ante_mode.traditional=Всеки активен играч публикува една десета от голям блинд, закръглена до най-близкия цент.
gdx.settings.option_help.ante_mode.big_blind=Играчът в голям блинд публикува цялото анте, равно на едно голям блинд.
gdx.settings.option_help.ante_mode.button=Играчът на бутона публикува цялото анте, равно на едно голям блинд.
gdx.settings.option_help.ante_mode.small_blind=Играчът в малък блинд публикува цялото анте, равно на едно голям блинд.
gdx.settings.option_help.rebuy_cap.buy_in=Вашият максимален стак след повторно купуване се базира на вход на играта.
gdx.settings.option_help.rebuy_cap.highest_stack=Повторно купуване до най-големия стак на масата. Капачката никога не пада под стандарта вход.
gdx.settings.option_help.rabbit.off=Нераздадените общи карти остават скрити след края на ръката.
gdx.settings.option_help.rabbit.free=Можете да поискате да видите нераздадени общи карти, след като ръката приключи без плащане на чипове.
gdx.settings.option_help.rabbit.free_small_blind=Първата ви заявка за играта е безплатна. Всяка следваща заявка струва един малък блинд.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Първата ви заявка от играта е безплатна, втората струва едно малък блинд, а по-късните заявки струват едно голям блинд.
gdx.settings.option_help.window_mode.exclusive=Използва режима на цял екран на монитора.
gdx.settings.option_help.window_mode.borderless=Запълва екрана с прозорец без граници и запазва режима на показване на работния плот.
tooltip.cfg.custom_bots.automatic_rebuy=Позволява на този персонализиран бот повторно купуване след изчерпване на чиповете. Глобалният автоматичен контрол повторно купуване трябва да бъде активиран.
tooltip.cfg.custom_bots.order_up=Премества избрания профил с една позиция нагоре. Списъкът го следва, когато е необходимо превъртане.
tooltip.cfg.custom_bots.order_down=Премества избрания профил една позиция надолу. Списъкът го следва, когато е необходимо превъртане.
tooltip.cfg.custom_bots.random_selection=Разбърква каталога веднъж, когато се създаде лоби. Всеки персонализиран бот може да влезе само веднъж и изборът остава стабилен за това лоби.
tooltip.cfg.custom_bots.new=Подготвя нов профил, без да променя вече запазените ботове.
