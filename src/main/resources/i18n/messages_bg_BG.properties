ui.tts_warning_detail=Въпреки че CoronaPoker използва криптиране от край до край за всички комуникации, гласовият чат използва външни TTS API за преобразуване на текст в аудио, така че съобщенията, изпратени до тези сървъри, могат (на теория) да бъдат прочетени от трети страни.\n\nМОЛЯ, ИМАЙТЕ ТОВА ПРЕДВИД, КОГАТО ИЗПОЛЗВАТЕ ЧАТА
