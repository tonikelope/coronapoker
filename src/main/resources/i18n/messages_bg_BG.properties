game.recover_accion_ausencia=⚠ Забележка: хостът повтори действия по-късно от последното ви записано действие, вероятно изиграно, докато сте били извън ръката - те не могат да бъдат проверени и се приемат така, както ги е изпратил хостът
game.mano_verificacion_divergente=⚠ РАЗЛИЧИЯ В КРИПТОГРАФСКАТА ПРОВЕРКА. Един или повече участници съобщиха за различно крайно състояние на ръката. Доказателство: {0}
game.mano_verificacion_jugador_ausente=⚠ Забележка: {0} не е изпратил заключителния подпис. Сигурното затваряне с ръка беше спряно. Доказателство: {1}
game.mano_verificacion_firma_invalida=⚠ Забележка: {0} откри невалиден криптографски подпис по време на тази ръка. Сигурното затваряне беше спряно. Доказателство: {1}
game.popup_verificacion_firma_invalida=По време на тази ръка един или повече участници ({0}) откриха невалиден криптографски подпис на действие.\n\nДанните, получени от всички участници, бяха последователни (крайните верижни хешове съвпадаха), но поне едно действие не беше правилно подписано от очаквания автор.\n\nCoronaPoker спря безопасното затваряне на ръката и ще затвори масата като грешка в сигурността след потвърждаване на това предупреждение.\n\nДоказателството е запазено в:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Забележка: {0} не получи доказателството за честно разбъркване за тази ръка. Доказателство: {1}
game.popup_verificacion_host_sin_prueba=Един или повече участници ({0}) не получиха доказателството за честно разбъркване за тази ръка.\n\nПоследните верижни хешове съвпадат за всички участници, така че действията на ръцете са последователни. Правилният хост винаги изпраща това доказателство, така че повтарящо се или селективно отсъствие може да означава модифициран софтуер или софтуерен дефект.\n\nРъката беше уредена, но напускането на играта е препоръчително като предпазна мярка.\n\nДоказателството, запазено в:\n{1}
game.popup_verificacion_titulo_alerta=Разминаване при криптографска проверка
game.popup_verificacion_titulo_aviso=Криптографската проверка е непълна
game.popup_verificacion_divergente=Един или повече участници съобщиха за различна криптографска проверка на крайното състояние на ръката.\n\nТова може да е причинено от модифициран софтуер или софтуерен дефект. CoronaPoker не може автоматично да определи причината или кой го е причинил.\n\nCoronaPoker спря сигурното затваряне на ръцете и ще затвори масата като грешка в сигурността, след като това предупреждение бъде потвърдено.\n\nДоказателствата са запазени в:\n{0}
game.popup_verificacion_ausente=Последната ръка не успя да постигне консенсус, тъй като играч {0} не изпрати подпис за затваряне.\n\nТова може да е причинено от прекъсване на мрежата, повреда на клиента или модифициран софтуер. CoronaPoker спря сигурното затваряне с ръка и ще затвори масата като грешка в сигурността, след като това предупреждение бъде потвърдено.\n\nДоказателството е запазено в:\n{1}
game.mano_verificacion_interrumpida=КРИТИЧНО: Сигурното затваряне с ръка е неуспешно ({0}). Таблицата ще се затвори като грешка в сигурността. Доказателство: {1}
game.popup_verificacion_interrumpida=CoronaPoker не можа да завърши криптографския протокол за затваряне за последната ръка.\n\nНеуспех: {0}\n\nРъката остава отворена за възстановяване. Таблицата ще се затвори като грешка в сигурността само след като това предупреждение бъде потвърдено.\n\nДоказателството е запазено в:\n{1}
