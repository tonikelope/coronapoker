game.showdown_forfeit_msg=AVÍS: La verificació mostra de cartes ha fallat per als següents jugadors i les seves cartes NO es revelaran:\n\n%nicks%\n\nAquests jugadors queden exclosos de la resistència mostra de cartes (guany automàticament) i NO POT guanyar aquest pot. El joc continua amb normalitat.
zero_trust.peer_sra_corrupt=La signatura mostra de cartes és autèntica, però la clau SRA del parell no es resol en targetes vàlides. Això només passa si l'igual ha signat intencionadament una clau corrupta o si el seu client té errors. No podem dir quina, i per seguretat acabem el joc.
zero_trust.straddle_recover_mismatch=Mentre recuperava la mà, l'amfitrió va anunciar un straddle diferent del que havia gravat la vostra còpia local. Això només passa si l'amfitrió manipula el straddle recuperat o si el seu client té errors. La mà encara està reconstruïda a partir de la vostra còpia de confiança, però us avisem com a precaució.
zero_trust.rit_recover_mismatch=Mentre recuperava la mà, l'amfitrió va anunciar un resultat d'executar-lo dues vegades diferent del que havia gravat la vostra còpia local. Això només passa si l'amfitrió manipula el resultat recuperat o si el seu client té errors. La mà encara està reconstruïda a partir de la vostra còpia de confiança, però us avisem com a precaució.
zero_trust.peer_sra_corrupt_registro=\u2014 mostra de cartes clau signada però no es resol amb targetes. Possible trampa o error del client.
