game.recover_accion_ausencia=⚠ Avís: l'amfitrió va repetir les accions més tard de la darrera acció gravada, és probable que s'hagin jugat mentre no teníeu la mà; no es poden verificar i s'accepten com l'amfitrió les va enviar.
