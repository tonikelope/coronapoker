game.mano_verificacion_jugador_ausente=⚠ Avís: {0} no ha enviat la signatura de tancament. Es va aturar el tancament segur de les mans. Evidència: {1}
game.mano_verificacion_firma_invalida=⚠ Avís: {0} ha detectat una signatura criptogràfica no vàlida durant aquesta mà. El tancament segur es va aturar. Evidència: {1}
game.popup_verificacion_firma_invalida=Durant aquesta mà, un o més participants ({0}) ha detectat una signatura criptogràfica no vàlida en una acció.\n\nLes dades rebudes per tots els participants eren coherents (els hash finals de la cadena coincideixen), però almenys una acció no estava signada correctament pel seu autor esperat.\n\nCoronaPoker va aturar el tancament segur de les mans i tancarà la taula com a fallada de seguretat després de reconèixer aquest avís.\n\nEvidència guardada a:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Avís: {0} no ha rebut la prova de barreja honesta per a aquesta mà. Evidència: {1}
game.popup_verificacion_host_sin_prueba=Un o més participants ({0}) no va rebre la prova de barreja honesta per a aquesta mà.\n\nEls hashes de cadena finals coincideixen entre tots els participants, de manera que les accions manuals són coherents. Un amfitrió correcte sempre envia aquesta prova, de manera que una absència repetida o selectiva d’iguals podria indicar un programari modificat o un defecte del programari.\n\nLa mà estava resolta, però es recomana abandonar el joc com a precaució.\n\nEvidència guardada a:\n{1}
game.popup_verificacion_titulo_alerta=Divergència de verificació criptogràfica
game.popup_verificacion_titulo_aviso=Verificació criptogràfica incompleta
game.popup_verificacion_divergente=Un o més participants van informar d’una verificació criptogràfica diferent de l’estat final de la mà.\n\nAixò pot ser causat per un programari modificat o per un defecte del programari. CoronaPoker no pot determinar automàticament la causa o qui la va originar.\n\nCoronaPoker va aturar el tancament segur de les mans i tancarà la taula com a fallada de seguretat després de reconèixer aquest avís.\n\nEvidència guardada a:\n{0}
game.popup_verificacion_ausente=L’última mà no ha pogut arribar a un consens perquè el jugador {0} no ha enviat una signatura de tancament.\n\nAixò pot ser causat per una interrupció de la xarxa, una fallada del client o un programari modificat. CoronaPoker s’ha aturat el tancament segur de les mans i tancarà la taula com a fallada de seguretat després que es reconegui aquest avís.\n\nEvidència desada a:\n{1}
game.mano_verificacion_interrumpida=CRÍTIC: S’ha fallat el tancament segur de la mà ({0}). La taula es tancarà com a fallada de seguretat. Evidència: {1}
game.popup_verificacion_interrumpida=CoronaPoker no s’ha pogut completar el protocol de tancament criptogràfic per a l’última mà.\n\nFalla: {0}\n\nLa mà roman oberta per a la recuperació. La taula es tancarà com a error de seguretat només després que s’hagi reconegut aquest avís.\n\nEvidència desada a:\n{1}
