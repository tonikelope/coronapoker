tooltip.cfg.custom_bots=Habilita el catàleg personalitzat. Els perfils configurats s'afegeixen primer, seguits dels robots estàndard.
tooltip.cfg.custom_bots.only=Evita que s'afegeixin bots estàndard. No es poden afegir més bots després d'esgotar el catàleg personalitzat.
tooltip.cfg.custom_bots.manage=Obriu el gestor per crear, editar i ordenar els vostres bots. Podeu triar la seva dificultat i estil.
tooltip.cfg.custom_bots.row=Seleccioneu aquest bot per editar-ne el nom, l'avatar, la dificultat, l'estil o recompra.
tooltip.cfg.custom_bots.avatar=Trieu una imatge vàlida o manteniu l'avatar oficial del bot. CoronaPoker emmagatzema una còpia segura perquè no es perdi.
tooltip.cfg.custom_bots.name=Introduïu el nom visible sense $. El marcador reservat s'afegeix automàticament.
tooltip.cfg.custom_bots.difficulty=Estableix el repte i les tàctiques que utilitza el bot. Jocs fàcils de manera recreativa, Normal utilitza una estratègia més disciplinada i Hard utilitza tàctiques avançades.
tooltip.cfg.custom_bots.personality=Estableix l'estil base. L'atzar el tria quan es crea el bot i el manté per a la sessió activa. El bot pot adaptar les seves decisions a la situació.
gdx.settings.option_help.bot_difficulty.easy=Juga casualment i s'equivoca més sovint.
gdx.settings.option_help.bot_difficulty.medium=Utilitza una estratègia més disciplinada i ajusta les decisions a mesura que es desenvolupa la mà.
gdx.settings.option_help.bot_difficulty.hard=Utilitza tàctiques més avançades, com ara robar cegues o fer pressió quan un oponent sembla vulnerable.
gdx.settings.option_help.custom_bot_personality.random=Tria un estil quan es crea el bot i el manté per a la sessió activa.
gdx.settings.option_help.custom_bot_personality.nit=Entra poques mans i sol esperar cartes fortes abans d'arriscar fitxes.
gdx.settings.option_help.custom_bot_personality.station=Acostuma a marcar apostes i mantenir-se a la mà. Puja menys sovint.
gdx.settings.option_help.custom_bot_personality.tag=Tria les mans de manera selectiva i tendeix a prendre el lideratge amb apostes i pujades.
gdx.settings.option_help.custom_bot_personality.lag=Juga una gamma més àmplia de mans i aplica pressió amb apostes i pujades freqüents.
gdx.settings.option_help.ante_mode.traditional=Cada jugador actiu publica una dècima part del cega gran, arrodonit al cent més proper.
gdx.settings.option_help.ante_mode.big_blind=El jugador del cega gran publica tot el ante, igual a un cega gran.
gdx.settings.option_help.ante_mode.button=El jugador del botó publica el ante sencer, igual a un cega gran.
gdx.settings.option_help.ante_mode.small_blind=El jugador del cega petita publica tot el ante, igual a un cega gran.
gdx.settings.option_help.rebuy_cap.buy_in=La teva pila màxima després d'un recompra es basa en el entrada del joc.
gdx.settings.option_help.rebuy_cap.highest_stack=Recompra fins a la pila més gran de la taula. El límit no baixa mai de l'estàndard entrada.
gdx.settings.option_help.rabbit.off=Les cartes comunitàries no repartides romanen amagades un cop acaba la mà.
gdx.settings.option_help.rabbit.free=Podeu demanar veure les cartes comunitàries sense repartir després que la mà acabi sense pagar fitxes.
gdx.settings.option_help.rabbit.free_small_blind=La teva primera petició del joc és gratuïta. Cada petició posterior costa un cega petita.
gdx.settings.option_help.rabbit.free_small_and_big_blind=La teva primera petició del joc és gratuïta, la segona costa un cega petita i les peticions posteriors un cega gran.
gdx.settings.option_help.window_mode.exclusive=Utilitza el mode de pantalla completa del monitor.
gdx.settings.option_help.window_mode.borderless=Omple la pantalla amb una finestra sense vores i manté el mode de visualització de l'escriptori.
tooltip.cfg.custom_bots.automatic_rebuy=Permet que aquest bot personalitzat recompra després de quedar-se sense fitxes. El control automàtic global recompra ha d'estar habilitat.
tooltip.cfg.custom_bots.order_up=Mou el perfil seleccionat una posició cap amunt. La llista la segueix quan cal desplaçar-se.
tooltip.cfg.custom_bots.order_down=Mou el perfil seleccionat una posició cap avall. La llista la segueix quan cal desplaçar-se.
tooltip.cfg.custom_bots.random_selection=Barreja el catàleg una vegada quan es crea un vestíbul. Cada bot personalitzat només pot entrar una vegada i la selecció es manté estable per a aquest vestíbul.
tooltip.cfg.custom_bots.new=Prepara un perfil nou sense canviar els bots ja desats.
tooltip.cfg.custom_bots.save=Afegeix el perfil nou o desa els canvis fets al bot seleccionat.
tooltip.cfg.custom_bots.delete=Elimina el perfil seleccionat després de demanar confirmació.
tooltip.cfg.custom_bots.close=Tanca el gestor. Els perfils desats i el seu ordre es mantenen automàticament.
