peer.community_unlock_no_testament=Un jugador es desconnecta sense deixar la seva clau per revelar cartes comunitàries. La mà ha estat descartada.
peer.dropped_during_cascade=Un jugador desconnectat durant la barreja criptogràfica de la coberta. La mà ha estat descartada.
peer.dropped_during_rotation=Un jugador desconnectat durant la rotació criptogràfica de la coberta. La mà ha estat descartada.
zero_trust.rotation_refused=Un jugador connectat es va negar a lliurar la seva clau de rotació de la coberta. El joc està aturat. Hauran de justificar la seva negativa a ser readmesos.
zero_trust.cascade_refused=Un jugador connectat es va negar a participar en la cascada de la baralla de la coberta. El joc està aturat. Hauran de justificar la seva negativa a ser readmesos.
zero_trust.pocket_unlock_refused=Un jugador connectat es va negar a lliurar la seva clau per desxifrar les targetes de butxaca. El joc està aturat. Hauran de justificar la seva negativa a ser readmesos.
zero_trust.community_unlock_refused=Un jugador connectat es va negar a lliurar la seva clau per revelar les targetes de la comunitat. El joc està aturat. Hauran de justificar la seva negativa a ser readmesos.
zero_trust.host_showdown_sig_missing=S'ha rebut una clau mostra de cartes del servidor SENSE la signatura criptogràfica de l'autor o amb una signatura incorrecta. El servidor pot estar substituint la clau del cable.
zero_trust.host_showdown_sig_invalid=S'ha rebut una clau mostra de cartes del servidor amb una signatura criptogràfica NO VÀLIDA. El servidor pot estar substituint la clau del cable.
zero_trust.host_potcards_mismatch=El text sense format mostra de cartes enviat pel servidor NO COINCIDEIX amb el resultat de desxifrar la vostra peça local amb la clau signada. És possible que el servidor estigui enviant targetes falses a mostra de cartes.
zero_trust.host_community_garbage=Les dades criptogràfiques de la targeta comunitària rebudes del servidor són inconsistents (la peça no es desxifra a una targeta de baralla vàlida o no coincideix amb l'anunci signat del servidor). Causes possibles: un ERROR en alguna versió del programari, una versió del servidor el codi del qual podria haver estat alterat o corrupció de la clau d'identitat local. El client no pot notar la diferència i NO acusa ningú.
zero_trust.host_unlock_out_of_order=S'ha rebut una petició de desxifrat del servidor fora de seqüència (carrer incorrecte, ranura repetida, desactivació gradual o petició emesa abans que es tanqués el carrer anterior).
zero_trust.host_cascade_mid_hand=S'ha rebut una petició de reinici aleatori del servidor enmig d'una mà en curs (sobreescriuria la meva clau de desxifrat).
zero_trust.host_pocket_extraction=S'ha rebut una petició de desxifrat del servidor que afectaria les TEUS PROPIES targetes privades.
zero_trust.host_community_extraction=S'ha rebut una petició de desxifrat del servidor que revelaria una targeta comunitària amb antelació.
zero_trust.host_rotation_replay=El servidor va demanar una segona rotació de carta a la mateixa mà. La rotació legítima és única per mà. Una repetició suggereix un intent d'utilitzar el vostre client per desxifrar les cartes d'altres jugadors.
zero_trust.host_shuffle_proof_failed=La verificació de l'acord ha fallat: no s'ha pogut demostrar que la plataforma que el servidor va tractar fos una barreja honesta de la plataforma de gènesi. S'han rebutjat els desbloqueigs de la comunitat i s'està finalitzant aquesta sessió per protegir les targetes privades.
zero_trust.host_shuffle_proof_missing=L'acord va arribar sense una prova de barreja honesta verificable per a la baralla d'aquesta mà, i ara s'estan revelant les cartes comunitàries. Pot ser un error o un retard de xarxa, o un amfitrió que intenta manipular l'acord. Podeu seguir jugant, però és molt recomanable deixar aquesta taula.
zero_trust.deck_unverified=La baralla d’aquesta mà NO s’ha pogut verificar com una barreja honesta. SOSPECTE: amfitrió "{0}", que s’ocupa i emet la prova de barreja. Pot ser l’amfitrió manipulant l’acord o un jugador que va retenir la seva prova. La mà es juga perquè les cartes ja estan repartides.
zero_trust.deck_unverified_body=S'ha registrat una prova signada d'aquesta anomalia (al registre del joc, en vermell i a la taula de mans disputades). Pots seguir jugant, però si no confies en l'amfitrió, deixa la taula.
zero_trust.seat_redraw=L’amfitrió "{0}" va forçar un NOU sorteig de seients. Això és INUSUAL: el sorteig és conjunt i verificable, de manera que l’amfitrió no pot triar els seients, però es pot tornar a tirar fins que aconsegueixi l’acord que li agradi. Si es repeteix, pot ser que l’amfitrió estigui intentant manipular el seient.
zero_trust.seat_redraw_body=El nou sorteig va funcionar de la mateixa manera i encara és verificable: ningú, inclòs l'amfitrió, pot triar el resultat. Pot passar si un jugador va caure just al principi, però si veus diversos intents i no confies en l'amfitrió, deixa la taula. S'ha registrat.
zero_trust.seat_recover_mismatch=En la recuperació del joc, l’ordre de seient enviat per l’amfitrió "{0}" NO coincideix amb el que el vostre client havia desat: algú que ja coneixeu ha canviat de seient a la taula. Pot ser un amfitrió que intenti reordenar els seients sota la cobertura de la recuperació.
zero_trust.seat_recover_mismatch_body=El vostre client va conservar la referència del seient que va verificar ell mateix al principi. És normal que els jugadors s'uneixin o surtin entremig. Reordenar algú que ja hi era no ho és. Si no confieu en l'amfitrió, deixeu la taula. S'ha registrat.
zero_trust.host_recover_action_forged=L'amfitrió va intentar injectar una acció FORGADA (signatura no vàlida) durant la recuperació del joc. El teu client ho va negar.
zero_trust.host_recover_action_omitted=Durant la recuperació, l'amfitrió va ometre una acció que TU vas jugar i que havia enregistrat a la teva base de dades local. El vostre client l'ha detectat contra la seva pròpia còpia i NO ha abandonat la vostra acció en silenci.
zero_trust.host_recover_balance_mismatch=L'amfitrió ha intentat canviar el vostre saldo (xips/entrada) durant la recuperació del joc: no coincideix amb el vostre registre local. El vostre client va mantenir el VOSTRE equilibri real.
zero_trust.host_board_peek=L'amfitrió va demanar desxifrar una targeta comunitària d'un carrer FUTUR (un intent de llegir el tauler abans). El teu client es va negar.
zero_trust.suspect_host_prefix=SUSPECT: host "{0}".
zero_trust.suspect_peer_prefix=SOSPECTAT: jugador "{0}".
zero_trust.peer_alert=⚠️ [COMPORTAMENT ANÒMAL DEL JUGADOR]
zero_trust.peer_suspicious_header=S'ha detectat un comportament anòmal o abusiu d'un jugador a la teva taula:\n
zero_trust.peer_suspicious_body=La taula va aplicar la mesura de seguretat corresponent i el joc continua per als altres jugadors. Es presumeix la bona fe. Podria ser un error de programari i no s'acusa ningú. Les proves estan registrades.
zero_trust.peer_inbound_flood=Trànsit autenticat sostingut per sobre del llindar anti-DoS.
zero_trust.peer_binary_flood=Operacions de missatges de veu enviades a una velocitat inusualment alta.
zero_trust.host_binary_flood=L'amfitrió està enviant operacions de missatges de veu a una velocitat inusualment alta.
zero_trust.peer_flood_log=Incident anti-DoS a l’espera d’una decisió: jugador {0}, IP {1}. Motiu: {2}
zero_trust.peer_flood_confirm=L’usuari {0} està enviant una quantitat excessiva de trànsit. Pot ser un atac DoS o un error. Expulsar-los del joc?\n\nIP: {1}\nMotiu detectat: {2}
zero_trust.peer_flood_suppress=No mostris aquestes advertències
zero_trust.peer_hand_ready_withheld=Un jugador respon al PING però no confirma que està preparat per a la següent mà mentre el joc s'executa. Estava congelant la mà d'arrencada i ha estat EXPULSAT. El joc continua sense ells.
zero_trust.peer_action_withheld=Un jugador respon al PING però no envia la seva acció d'apostes mentre el joc s'executa, passat el seu temps de reflexió. Estava congelant la ronda i ha estat EXPULSAT. El joc continua sense ells.
zero_trust.peer_conf_withheld=Un jugador respon al PING però no confirma la recepció d'un missatge de repartiment mentre el joc s'està executant. Estava bloquejant la taula d'avançar i ha estat EXPULSAT. El joc continua sense ells.
zero_trust.peer_deal_refusal_expelled=Un jugador va forçar diverses interrupcions de mà seguides en rebutjar la barreja o la rotació de la baralla. Ha estat EXPULSAT perquè el joc pugui continuar.
zero_trust.suspicious_alert=⚠️ [COMPORTAMENT ANÒMAL DEL SERVIDOR]
zero_trust.suspicious_header=El vostre client ha detectat un comportament anòmal del servidor (no és un incident crític que congela el joc):\n
zero_trust.suspicious_body=El vostre client va rebutjar l'operació anòmala i el joc POT continuar. Suposem de bona fe: podria tractar-se d'un BUG de programari (client o servidor) i no s'acusa ningú. Però com que no es pot distingir un error a part de la manipulació, PER LA VOSTRA SEGURETAT ES RECOMANA MOLTAMENT QUE DEIXI aquesta taula utilitzant el botó "Surt" (els vostres diners NO es processaran en aquesta mà).
zero_trust.host_bad_wire=S'ha rebut una petició de desxifrat del servidor amb un format no vàlid o punts que no pertanyen a la corba criptogràfica.
zero_trust.host_critical_command_invalid=L’ordre {0} crítica enviada pel servidor no s’ha pogut validar. Això pot ser una incompatibilitat, un error o un servidor modificat. La sessió s’atura per protegir-ne la integritat.
zero_trust.cheater_detected=[CONFIANÇA ZERO] S'ha detectat un jugador amb una versió modificada CoronaPoker, cosa que suggereix que podria estar intentant fer trampes. Vols continuar?
zero_trust.corrupted_mac_action=El servidor ha intentat processar una acció amb una signatura criptogràfica no vàlida (MAC danyada) en nom de:
zero_trust.critical=\u274c [CONFIANÇA ZERO] ALERTA CRÍTICA: SIGNATURA NO VÀLIDA O CONSENS RALLAT.
zero_trust.critical_alert_body=ESTAT DE QUARENTENA ACTIVAT:\nEl vostre client NO enviarà més claus criptogràfiques al servidor en aquesta sessió.\nEl joc està matemàticament congelat per protegir el vostre equilibri.\n\nLes causes possibles són:\n  - un BUG al propi codi del client,\n  - un BUG al codi del servidor, o\n  - un SERVIDOR el codi del qual podria haver estat alterat.\n\nEl client no pot distingir entre ells i NO s'implica cap acusació. Per seguretat, i a l'espera de la revisió de la causa arrel, es RECOMANA que abandonis aquest joc fent servir el botó "Surt" (els teus diners NO es processaran en aquesta mà).
zero_trust.critical_alert_header=INCIDENT DE CONFIANÇA ZERO!\n\nEl vostre client ha detectat una anomalia en el protocol criptogràfic:\n
zero_trust.critical_session_error=[CONFIANÇA ZERO] ERROR CRÍTIC DE SESSIÓ
zero_trust.decrypting_street=[CONFIANÇA ZERO] S'ESTÀ DESENCRIPTANT EL CARRER...
zero_trust.wait_deal=Esperem les aportacions dels jugadors per barrejar i repartir les cartes.
zero_trust.wait_shuffle_proof=Esperem la prova criptogràfica de la barreja.
zero_trust.wait_sra_unlock=Esperem les claus SRA per obrir {0}.
game.settlement_verification_wait=Esperem els rebuts per verificar la mà i confirmar els saldos.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [CONFIANÇA ZERO] Temps d'espera de consens ràpid. Forçar l'avanç.
zero_trust.forged_identity_action=El servidor ha intentat processar una acció amb una signatura d'identitat falsificada en nom de:
