zero_trust.fatal_incident_body=CoronaPoker ha rebutjat un estat crític autenticat i ha aturat la taula abans de continuar. Confirmeu aquest avís per tancar la taula afectada.\n\nEvidència de confiança zero: {0}
zero_trust.qa_pre_settlement_fault=L'acord criptogràfic va ser rebutjat abans de la liquidació.
zero_trust.qa_lockdown_fault=L'estat de l'amfitrió autenticat ha fallat la validació criptogràfica.
zero_trust.session_generated=\u2714\ufe0f [CONFIANÇA ZERO] Nova sessió generada i desada al disc.
zero_trust.session_restored=\u2714\ufe0f [ZERO-TRUST] S'ha restaurat la clau de sessió correctament.
zero_trust.timeout=\u274c TEMPS D'EXPLORACIÓ [CONFIANÇA ZERO] (VALIDACIÓ MANUAL OMITIDA)
zero_trust.timeout_community_cards=\u274c [CONFIANÇA ZERO] Temps d'espera a l'espera de les targetes comunitàries.
zero_trust.verifying_integrity=[ZERO-TRUST] S'està verificant la integritat del joc...
zero_trust.verifying_integrity_error=[CONFIANÇA ZERO] FALLA LA VERIFICACIÓ DE LA INTEGRITAT DEL JOC
zero_trust.verifying_swarm=[CONFIANÇA ZERO] S'ESTÀ VERIFICANT L'EIXAM...
