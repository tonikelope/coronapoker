zero_trust.generating_kem=[CONFIANÇA ZERO] S'ESTÀ GENERANT KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ALERTA DE CONFIANÇA ZERO] MAC no vàlid a les targetes comunitàries. Possible manipulació.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [CONFIANÇA ZERO] VERIFICACIÓ CRIPTOGRÀFICA DE CONSENS: TOTS ELS JUGADORS HAN CERTIFICAT APROFIT LA SEVA VERIFICACIÓ CRIPTOGRÀFICA LOCAL DE MÀ.
zero_trust.legit2_error=\u274c [CONFIANÇA ZERO] VERIFICACIÓ CRIPTOGRÀFICA DE CONSENS: COMMENÇAMENT UN JUGADOR NO HA CERTIFICAT APROBAR LA SEVA VERIFICACIÓ CRIPTOGRÀFICA LOCAL DE MÀ.
zero_trust.legit=\u2714\ufe0f [CONFIANÇA ZERO] VERIFICACIÓ CRIPTOGRÀFICA LOCAL A MÀ: LES MEVES TARGETES, TARGETES COMUNITATS I TOTES LES ACCIONS ENREGISTRADES SÓN LEGÍTIMES.
zero_trust.legit_error=\u274c [CONFIANÇA ZERO] VERIFICACIÓ CRIPTOGRÀFICA LOCAL A MÀ: NO ES POT GARANTIR QUE LES MEVES TARGETES, TARGETES COMUNITÀRIES I TOTES LES ACCIONS ENREGISTRADES SÓN LEGÍTIMES.
zero_trust.lockdown_activated=\ud83d\udd12 [BLOQUEO] Quarantena activada. Bloqueig de la transmissió de claus criptogràfiques.
zero_trust.no_binary_log=\u26a0\ufe0f [CONFIANÇA ZERO] No hi ha registre binari anterior per a aquesta mà.
zero_trust.p2p_auditing_memory=[CONFIANÇA ZERO] P2P: AUDITORIA DE LA MEMÒRIA...
zero_trust.p2p_cheater_detected2=[CONFIANÇA ZERO] S'ha detectat un jugador amb una versió modificada CoronaPoker, cosa que suggereix que podria estar intentant fer trampes.
zero_trust.p2p_finished_resuming=S'ha acabat la verificació P2P KEM. Reprèn la mà...
zero_trust.p2p_generating_challenges=[CONFIANÇA ZERO] P2P: GENERACIÓ DE REPTES...
zero_trust.p2p_timeout=Temps d'espera de l'eixam P2P! Alguns jugadors van ser marcats com a poc fiables.
zero_trust.p2p_verifying_signatures=[CONFIANÇA ZERO] P2P: VERIFICACIÓ DE SIGNATURES...
zero_trust.read_binary_log_failure=[ZERO-TRUST] No s'ha pogut llegir el registre binari.
zero_trust.rejecting_master_key=\ud83d\udd12 [BLOQUEO] S'està rebutjant la transmissió compartida de clau mestra al servidor.
zero_trust.rejecting_street_token=\ud83d\udd12 [BLOQUEO] S'està rebutjant la petició de Street Token del servidor.
zero_trust.replay_queue_synced=\u2714\ufe0f [CONFIANÇA ZERO] Cua de reproducció sincronitzada (signatures {0}).
zero_trust.security_alert=\u26a0\ufe0f [ALERTA DE SEGURETAT]
zero_trust.evidence_location=Evidència de confiança zero: {0}
