tooltip.cfg.ante=Přidá vynucený příspěvek do banku po blindy. Režim nastavuje, kdo a kolik platí.
tooltip.cfg.ante_mode=V tradičním režimu každý aktivní hráč zaplatí 10 % z velký blind. V BBA, BA nebo SBA platí tlačítko velký blind, tlačítko nebo malý blind jeden velký blind. Blindy jsou zveřejněny jako první.
tooltip.cfg.blind_cap=Zastaví blindy zvýšení na konfigurovaném stropu.
tooltip.cfg.blinds_level=Počínaje blindy (malý/velký) za hru.
tooltip.cfg.bot_balance=Když hra skončí, kombinovaný zůstatek robotů se rovnoměrně rozdělí mezi lidské hráče, takže skutečné peníze se vypořádají pouze mezi lidmi.
tooltip.cfg.bot_rebuy=Globální automatická kontrola dokoupení pro každého robota. Vypnutím také deaktivujete nastavení dokoupení vlastních botů.
tooltip.cfg.bots=Nastavuje obtížnost standardních robotů. Vlastní roboti udržují obtížnost nakonfigurovanou individuálně ve Správci botů.
tooltip.cfg.buyin_fixed=Každý začíná stejným vstupné. Když je vypnuto, hráči si vybírají v rámci nakonfigurovaného rozsahu.
tooltip.cfg.double_blinds=Postoupí na další úroveň blindy ve struktuře po nastaveném počtu hand nebo minut.
tooltip.cfg.hand_limit=Hra končí, když je dosaženo tohoto počtu hand.
tooltip.cfg.iwtsth=Umožňuje vám požádat o zobrazení soupeřovy karty na showdown.
tooltip.cfg.rabbit=Odhalí nerozdané společné karty po hře. První žádost každého hráče je zdarma. Zvolený režim určuje, zda pozdější požadavky zůstanou zdarma nebo budou stát malé nebo velký blind.
tooltip.cfg.rebuy_limit=Maximální rebuys na hráče.
tooltip.cfg.recover=Obnoví hru, která byla dříve přerušena.
tooltip.cfg.rit=Umožňuje hlasování rozdat zbývající karty dvakrát, když All-in ukončí sázku.
tooltip.cfg.straddle=Hráč po velký blind může vložit dvě velký blind předtím, než uvidí své karty a hrát poslední preflop.
tooltip.cfg.straddle_on_timeout=Post the straddle automatically when its prompt times out. To se týká pouze vašeho přehrávače a je ve výchozím nastavení vypnuto.
tooltip.cfg.structure=Struktura úrovně Blindy pro hru.
tooltip.cfg.think_time=Vteřiny k dispozici na rozhodnutí. Automatická akce se spustí, když vyprší čas.
tooltip.cfg.showdown_time=V sekundách zůstane výsledek handy na obrazovce před rozdáním další handy.
tooltip.cfg.allow_hot_join=Umožňuje novým hráčům připojit se jako WARMING UP a vstoupit v další hře. Při změně během hry to ovlivní pouze nové pokusy o připojení.
tooltip.cfg.card_flip_duration=Nastavuje, jak dlouho každé kartě po odhalení trvá, než dokončí svůj tah.
tooltip.cfg.card_flip_direction=Vybírá, jakým směrem se karty otočí, když jsou odhaleny. Smíšené vybere směr pro každé odhalení. Karty ve stejné skupině se otočí stejným způsobem.
tooltip.cfg.reparto_velocidad=Nastavuje, jak dlouho každé kartě trvá cesta z balíčku na místo.
tooltip.cfg.community_deal_style=Vyberte, zda se všech pět společných karet rozdá na začátku lícem dolů, nebo na vlastní ulici. Uložené změny se použijí od další hry.
tooltip.cfg.anim_calidad=Kvalita zachovává každý vizuální detail. Výkon snižuje náklady na let karty a odhaluje na slabších počítačích.
tooltip.cfg.downgrade_velocidad=Nastavuje, jak dlouho trvá stolu, než se změní uspořádání sedadel, když hráč odejde.
tooltip.cfg.swap_velocidad=Nastavuje, jak dlouho trvá křížení karet při třídění.
tooltip.cfg.swap_estilo=Arc zvedá jednu kartu nad druhou. Horizontální je kříží ve stejné výšce.
tooltip.cfg.resaltar_avatares=Když na chvíli položíte myš na avatar hráče, zobrazí se zvětšený nad stolem vedle jeho jména a zásobníku a zmizí, když z něj dáte myš.
tooltip.cfg.resaltar_jugada_showdown=Během showdown se při najetí myší na jméno libovolného hráče (vítěz nebo poražený) zvýrazní pouze karty, které jej tvoří, a zbytek se ztlumí.
tooltip.cfg.screenshot_fin_timba=Automaticky uloží snímek obrazovky poslední obrazovky, když počítadlo peněz skončí (nebo když jej opustíte, pokud odejdete dříve).
tooltip.cfg.server_ip=Adresa (IP nebo doména), na které herní server naslouchá.
tooltip.cfg.server_port=TCP port od 1 do 65535, na kterém server naslouchá.
tooltip.cfg.upnp=Požádá váš router, aby předal tento port TCP hostiteli, dokud se herní relace neuzavře.
tooltip.cfg.preset=Načte uložený profil nastavení.
