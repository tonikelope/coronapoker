tooltip.cfg.buyin=Každý hráč začíná u stolu s žetony.
tooltip.cfg.buyin_range=S proměnnou vstupné si každý hráč vybere své vstupné v tomto rozsahu (v velký blind).
tooltip.cfg.volume=Celkový objem hry.
tooltip.cfg.sound_master=Povolí nebo ztlumí hudbu, zvukové efekty a zvuk chatu. Přehrávač pokerových videí má svůj vlastní objem.
