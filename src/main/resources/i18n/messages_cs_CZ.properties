zero_trust.legit=\u2714\ufe0f [NULA DŮVĚRYHODNÁ] MÍSTNÍ RUČNÍ KRYPTOGRAFICKÉ OVĚŘENÍ: MOJE KARTY, KARTY KOMUNITY A VŠECHNY ZÁZNAMNÉ AKCE JSOU LEGITIMNÍ.
zero_trust.legit_error=\u274c [NULA DŮVĚRYHODNÁ] MÍSTNÍ RUČNÍ KRYPTOGRAFICKÉ OVĚŘENÍ: NELZE ZAJISTIT, ABY MÉ KARTY, KARTY KOMUNITY A VŠECHNY ZÁZNAMNÉ AKCE JSOU LEGITIMNÍ.
