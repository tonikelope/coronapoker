gdx.settings.tooltip.flying_chip_shadows=Stíny žetonů v letu na 3D stole. Vysoká zachovává původní vyhlazení. Normální používá méně vzorků pro plynulejší hromadná dokoupení.
gdx.settings.tooltip.stack_bet_preview=Když jsi na tahu, najeď na Dorovnej, Zvyš nebo All-in. Odpovídající žetony se zvýrazní zlatě. Je-li třeba rozměnit, zvýrazní se žetony, které pokryjí částku.
gdx.settings.tooltip.animation_final_summary_cards=Animuje příchod balančních karet, když hra končí. Vypněte jej, aby se karty okamžitě zobrazily na místě.
gdx.settings.tooltip.animation_allin_fire=Ukazuje oheň za hráči, kteří jsou All-in.
gdx.settings.tooltip.animation_winner=Zobrazuje světla a částice kolem vítězných míst.
gdx.settings.tooltip.animation_chips=Animuje létající žetony při sázení a vybírání banku.
gdx.settings.tooltip.animation_reseat=Animuje uspořádání stolu, když hráč odejde.
gdx.settings.tooltip.animation_shuffle_cascade=Zobrazuje distribuované náhodné míchání mezi hráči.
gdx.settings.tooltip.auto_fullscreen=Automaticky přejde na celou obrazovku při spuštění stolu a vybraný režim okna to umožňuje.
gdx.settings.tooltip.vsync=Synchronizuje snímky s monitorem, aby se zabránilo trhání. Může snížit FPS a zvýšit latenci.
gdx.settings.tooltip.fps_limit=Čepice FPS. Na displeji se zobrazí „Obnovovací frekvence monitoru“. Vyšší snímková frekvence spotřebuje více energie.
gdx.settings.tooltip.msaa=Vyhlazuje geometrické okraje ve scéně. Více vzorků zvyšuje zátěž o GPU. Platí po restartu.
gdx.settings.row.shuffle_angle=Úhel míchání ve 3D
gdx.settings.tooltip.shuffle_angle=Otáčí balíček na stole při míchání ve 3D.
gdx.settings.tooltip.card_rendering=Smooth aplikuje další filtr na okraje karty. Domorodec si lízne karty přímo. Vyvážené (trilineární filtrování a až 16× anizotropní filtrování).
gdx.settings.tooltip.show_fps=Zobrazuje aktuální FPS a stav VSync na obrazovce.
gdx.settings.tooltip.show_cpu_memory=Zobrazuje Java CPU a využití paměti.
gdx.settings.tooltip.gpu_renderer=Zobrazuje grafický adaptér a ovladač OpenGL používaný hrou.
gdx.settings.tooltip.audio_output=Vybírá zařízení používané k přehrávání zvuku hry.
gdx.settings.tooltip.audio_capture=Vybírá mikrofon používaný k nahrávání hlasových zpráv.
gdx.settings.tooltip.microphone=Umožňuje nahrávání a odesílání hlasových zpráv ze hry.
gdx.settings.tooltip.mic_auto_gain=Automaticky upravuje úroveň mikrofonu, aby kompenzoval hlasy, které jsou příliš tiché nebo hlasité.
gdx.settings.tooltip.local_tts=Povolí nebo zablokuje přehrávání zpráv převodu textu na řeč na tomto počítači.
gdx.settings.tooltip.auto_buttons=Zobrazuje automatické akce, které se mohou spustit, když na vás přijde řada.
gdx.settings.tooltip.auto_call=Konfiguruje automatické volání a jeho maximální povolenou částku.
gdx.settings.tooltip.auto_persist=Udržuje vybranou automatickou akci po jejím spuštění, dokud neskončí ruka nebo není výběr vymazán.
gdx.settings.tooltip.auto_confirm=Před spuštěním automatické akce požaduje potvrzení.
gdx.settings.tooltip.confirm_actions=Před důležitými ručními akcemi požaduje potvrzení.
gdx.settings.tooltip.auto_rebuy=Když vám dojdou žetony, automaticky se dokoupí znovu a jsou povoleny rebuy.
gdx.settings.tooltip.shortcut=Vyberte řádek a poté stiskněte klávesu, kterou chcete přiřadit této akci.
gdx.settings.tooltip.rebuy_cap=Určuje, zda je limit žetonů po dokoupení založen na vstupné nebo na největším stacku u stolu.
gdx.settings.tooltip.blind_structures=Otevře editor pro správu struktur na úrovni blindy.
gdx.settings.tooltip.blind_unit=Určuje, zda je navýšení blindy naplánováno podle odehraných hand nebo podle minut.
gdx.settings.tooltip.blind_interval=Nastavuje, kolik hand nebo minut uplyne mezi nárůsty blindy.
gdx.settings.tooltip.blind_cap_level=Maximální počet blindy se zvyšuje od počáteční úrovně.
gdx.settings.tooltip.rebuy=Umožňuje hráčům nakupovat další žetony během hry až do limitu dokoupení.
