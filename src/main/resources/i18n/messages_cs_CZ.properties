gdx.settings.tooltip.poker_videos=Zobrazuje hráče v hlavní nabídce, lobby a u stolu. Zavře se při spuštění hry a lze ji znovu otevřít z její ikony.
gdx.settings.tooltip.halo_effects=Kolem sedadel svítí ovládací prvky, nebezpečí a vítěz.
gdx.settings.tooltip.modal_blur=Rozmaže pozadí za modálními dialogy a upozorněními.
gdx.settings.tooltip.glass_effects=Ovládá dekorativní lesk a hloubku tlačítek a ovládacích prvků.
gdx.settings.tooltip.cinematics_master=Povolí nebo zakáže sekvence ALL-IN a GAME OVER.
