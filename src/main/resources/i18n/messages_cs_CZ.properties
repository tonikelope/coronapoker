tooltip.cfg.game_start_sound=Přehraje úvodní zvuk, když hra začíná nebo je obnovena.
tooltip.cfg.music_surface=Povolí hudbu pro tuto obrazovku nebo okamžik. Tlačítko přehrávání zobrazí náhled, aniž byste opustili Nastavení.
tooltip.cfg.recovery_music=Povolí hudbu, která se přehrává při obnově přerušené hry.
tooltip.cfg.silly_sounds=Umožňuje vtipné zvuky, které se mohou přehrávat během hry.
