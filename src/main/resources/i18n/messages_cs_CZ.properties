tooltip.cfg.display_mode=Vyberte si mezi zobrazením v okně, bez okrajů na celou obrazovku a exkluzivní celou obrazovkou. Platí při uložení.
tooltip.cfg.compact_view=Zmenší žetony a karty, aby se zobrazil další stůl. Stavy: vypnutý, kompaktní, kompaktní s malými kartami a také vlastní kompaktní.
