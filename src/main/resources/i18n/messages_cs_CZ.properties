tooltip.cfg.custom_bots=Povolí vlastní katalog. Nakonfigurované profily jsou přidány jako první, poté následují standardní roboti.
tooltip.cfg.custom_bots.only=Zabraňuje přidávání standardních robotů. Po vyčerpání vlastního katalogu nelze přidat žádné další roboty.
tooltip.cfg.custom_bots.manage=Otevřete správce, abyste mohli vytvářet, upravovat a objednávat své roboty. Můžete si vybrat jejich obtížnost a styl.
tooltip.cfg.custom_bots.row=Vyberte tohoto robota, chcete-li upravit jeho jméno, avatar, obtížnost, styl nebo dokoupení.
tooltip.cfg.custom_bots.avatar=Vyberte platný obrázek nebo si ponechte oficiálního avatara robota. CoronaPoker ukládá bezpečnou kopii, aby se neztratila.
tooltip.cfg.custom_bots.name=Zadejte viditelné jméno bez $. Rezervovaná značka se přidá automaticky.
tooltip.cfg.custom_bots.difficulty=Nastavuje výzvu a taktiku, kterou bot používá. Easy hraje rekreačně, Normal používá disciplinovanější strategii a Hard využívá pokročilé taktiky.
tooltip.cfg.custom_bots.personality=Nastaví základní styl. Náhodně jej vybere při vytvoření robota a ponechá si jej pro aktivní relaci. Robot může svá rozhodnutí přizpůsobit situaci.
gdx.settings.option_help.bot_difficulty.easy=Hraje ležérně a častěji dělá chyby.
gdx.settings.option_help.bot_difficulty.medium=Používá disciplinovanější strategii a upravuje rozhodnutí podle toho, jak se ruka vyvíjí.
gdx.settings.option_help.bot_difficulty.hard=Uses more advanced tactics, such as stealing blindy or applying pressure when an opponent looks vulnerable.
gdx.settings.option_help.custom_bot_personality.random=Vybere styl při vytvoření robota a ponechá si jej pro aktivní relaci.
gdx.settings.option_help.custom_bot_personality.nit=Zadává málo hand a obvykle čeká na silné karty, než riskuje žetony.
gdx.settings.option_help.custom_bot_personality.station=Má tendenci dorovnávat sázky a zůstat ve hře. Méně často se zvedá.
gdx.settings.option_help.custom_bot_personality.tag=Vybírá si kombinace selektivně a má tendenci přebírat vedení pomocí sázek a navyšování.
gdx.settings.option_help.custom_bot_personality.lag=Hraje širší rozsah hand a vyvíjí tlak s častými sázkami a navyšováním.
gdx.settings.option_help.ante_mode.traditional=Každý aktivní hráč vloží jednu desetinu velký blind, zaokrouhleno na nejbližší cent.
gdx.settings.option_help.ante_mode.big_blind=Hráč v velký blind zveřejní celý ante, rovný jedné velký blind.
gdx.settings.option_help.ante_mode.button=Hráč na tlačítku vloží celých ante, což se rovná jedné velký blind.
gdx.settings.option_help.ante_mode.small_blind=Hráč v malý blind zveřejní celý ante, rovný jedné velký blind.
gdx.settings.option_help.rebuy_cap.buy_in=Váš maximální stack po dokoupení je založen na vstupné hry.
gdx.settings.option_help.rebuy_cap.highest_stack=Dokoupení až po největší stack u stolu. Strop nikdy neklesne pod standardní vstupné.
gdx.settings.option_help.rabbit.off=Nerozdané společné karty zůstanou po skončení hry skryté.
gdx.settings.option_help.rabbit.free=Po skončení hry můžete požádat o zobrazení nerozdaných společných karet, aniž byste museli platit žetony.
gdx.settings.option_help.rabbit.free_small_blind=Vaše první žádost o hru je zdarma. Každá pozdější žádost stojí 1 malý blind.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Vaše první žádost o hru je zdarma, druhá stojí 1 malý blind a pozdější žádosti stojí 1 velký blind.
gdx.settings.option_help.window_mode.exclusive=Používá režim celé obrazovky monitoru.
gdx.settings.option_help.window_mode.borderless=Vyplní obrazovku oknem bez okrajů a zachová režim zobrazení plochy.
gdx.settings.value.balanced=Vyvážené
tooltip.cfg.custom_bots.automatic_rebuy=Nechte tohoto vlastního robota dokoupení po vyčerpání žetonů. Musí být povoleno globální automatické ovládání dokoupení.
tooltip.cfg.custom_bots.order_up=Posune vybraný profil o jednu pozici nahoru. Seznam následuje, když je potřeba rolování.
tooltip.cfg.custom_bots.order_down=Posune vybraný profil o jednu pozici dolů. Seznam následuje, když je potřeba rolování.
tooltip.cfg.custom_bots.random_selection=Při vytvoření lobby jednou zamíchá katalog. Každý vlastní bot může vstoupit pouze jednou a výběr zůstává pro danou lobby stabilní.
tooltip.cfg.custom_bots.new=Připraví nový profil bez změny již uložených robotů.
