game.recover_accion_ausencia=⚠ Upozornění: hostitel přehrál akce později než vaše poslední zaznamenaná akce, pravděpodobně hrál, když jste byli mimo hru – nelze je ověřit a jsou přijímány tak, jak je hostitel odeslal
game.mano_verificacion_divergente=⚠ ROZDÍL KRYPTOGRAFICKÉHO OVĚŘENÍ. Jeden nebo více účastníků nahlásilo jiný konečný stav ruky. Důkaz: {0}
game.mano_verificacion_jugador_ausente=⚠ Upozornění: {0} neodeslalo závěrečný podpis. Bezpečné ruční zavírání bylo zastaveno. Důkaz: {1}
game.mano_verificacion_firma_invalida=⚠ Upozornění: {0} zjistil během této handy neplatný kryptografický podpis. Bezpečné uzavření bylo zastaveno. Důkaz: {1}
game.popup_verificacion_firma_invalida=Během této handy jeden nebo více účastníků ({0}) zjistil neplatný kryptografický podpis na akci.\n\nData obdržená všemi účastníky byla konzistentní (konečné hash řetězce se shodovaly), ale minimálně jedna akce nebyla řádně podepsána jejím očekávaným autorem.\n\nCoronaPoker zastavil bezpečné zavírání hand a po potvrzení tohoto varování zavře stůl jako bezpečnostní selhání.\n\nDůkazy uložené v:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Upozornění: {0} neobdrželo poctivé zamíchání za tuto handu. Důkaz: {1}
game.popup_verificacion_host_sin_prueba=Jeden nebo více účastníků ({0}) nezískal poctivý důkaz pro tuto handu.\n\nKonečné hash řetězce se shodují u všech účastníků, takže akce rukou jsou konzistentní. Správný hostitel vždy odesílá tento důkaz, takže opakovaná nebo selektivní nepřítomnost může znamenat upravený software nebo softwarovou vadu.\n\nHra byla vyrovnána, ale jako preventivní opatření se doporučuje opustit hru.\n\nDůkazy uložené v:\n{1}
game.popup_verificacion_titulo_alerta=Divergence kryptografického ověření
game.popup_verificacion_titulo_aviso=Kryptografické ověření nebylo dokončeno
game.popup_verificacion_divergente=Jeden nebo více účastníků oznámilo odlišné kryptografické ověření konečného stavu ruky.\n\nTo může být způsobeno upraveným softwarem nebo softwarovou vadou. CoronaPoker nemůže automaticky určit příčinu nebo kdo ji způsobil.\n\nCoronaPoker zastavil bezpečné zavírání hand a po potvrzení tohoto varování zavře stůl jako bezpečnostní selhání.\n\nDůkazy uložené v:\n{0}
game.popup_verificacion_ausente=Poslední handa nemohla dosáhnout konsensu, protože hráč {0} neposlal závěrečný podpis.\n\nTo může být způsobeno výpadkem sítě, selháním klienta nebo upraveným softwarem. CoronaPoker zastavilo bezpečné zavírání rukou a po potvrzení tohoto varování zavře stůl jako selhání zabezpečení.\n\nEvidence uložena v:\n{1}
game.mano_verificacion_interrumpida=CRITICAL: Secure hand closure failed ({0}). Tabulka se zavře jako selhání zabezpečení. Důkaz: {1}
game.popup_verificacion_interrumpida=CoronaPoker nemohl dokončit šifrovací závěrečný protokol pro poslední hru.\n\nSelhání: {0}\n\nHra zůstává otevřená pro obnovení. Tabulka se zavře jako selhání zabezpečení pouze po potvrzení tohoto varování.\n\nEvidence uložena v:\n{1}
