tooltip.cfg.play_own_notes=Přehraje také vaše vlastní hlasové poznámky, když je odešlete.
tooltip.cfg.notes_retention=Nastavuje, jak dlouho budou uchovávány hlasové poznámky. Pomocí „Navždy“ se odstraní pouze ručně.
tooltip.cfg.purge_notes=Okamžitě odstraní všechny uložené hlasové poznámky.
