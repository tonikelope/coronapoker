zero_trust.auditing_memory=[ZERO-TRUST] Auditování paměti roje RAM...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Binární protokol načten do paměti ({0} podpisy připravené pro synchronizované přehrávání).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Kaskáda kryptografického náhodného přehrávání se nezdařila. Ruka byla zrušena.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Nepodařilo se odemknout soukromé karty (hráč neodpověděl včas). Ruka byla zrušena.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Dešifrovaná karta neodpovídá žádné platné kartě v balíčku. Hra byla zrušena.
peer.not_enough_players=Hráč vypadl během míchání a již není dostatek hráčů, aby rozdali handu.
peer.unlock_no_testament=Hráč se odpojil, aniž by opustil svůj dešifrovací klíč. Ruka byla zrušena.
peer.broadcast_failed=Chyba sítě při vysílání soukromých karet. Ruka byla zrušena.
peer.recovery_action_data_unavailable=Uloženou historii akcí nelze přečíst. Ruka byla bezpečně zrušena a vrátí se k obnově.
straddle.deferred_release_failed=Karty blindy straddle nebylo možné odhalit (hráč se odpojil nebo odmítl spolupracovat). Ruka byla zrušena.
peer.state_inconsistent=Stav dealera se stal nekonzistentním. Ruka byla zrušena.
peer.bot_no_token=Robot nemá připravený dešifrovací klíč. Ruka byla zrušena.
peer.community_unlock_no_testament=Hráč se odpojil, aniž by opustil svůj klíč, aby odhalil společné karty. Ruka byla zrušena.
peer.dropped_during_cascade=Hráč se odpojil během kryptografického míchání balíčku. Ruka byla zrušena.
peer.dropped_during_rotation=Hráč odpojený během kryptografické rotace balíčku. Ruka byla zrušena.
zero_trust.rotation_refused=Připojený hráč odmítl doručit svůj klíč k otočení balíčku. Hra je zastavena. Budou muset odůvodnit své odmítnutí opětovného přijetí.
zero_trust.cascade_refused=Připojený hráč se odmítl zúčastnit kaskády míchání balíčků. Hra je zastavena. Budou muset odůvodnit své odmítnutí opětovného přijetí.
zero_trust.pocket_unlock_refused=Připojený hráč odmítl doručit svůj klíč k dešifrování kapesních karet. Hra je zastavena. Budou muset odůvodnit své odmítnutí opětovného přijetí.
zero_trust.community_unlock_refused=Připojený hráč odmítl doručit svůj klíč, aby odhalil společné karty. Hra je zastavena. Budou muset odůvodnit své odmítnutí opětovného přijetí.
zero_trust.host_showdown_sig_missing=Ze serveru byl přijat klíč showdown BEZ kryptografického podpisu autora nebo s chybným podpisem. Server možná nahrazuje klíč na drátu.
zero_trust.host_showdown_sig_invalid=Ze serveru byl přijat klíč showdown s NEPLATNÝM kryptografickým podpisem. Server možná nahrazuje klíč na drátu.
zero_trust.host_potcards_mismatch=showdown prostý text zaslaný serverem NEODPOVÍDÁ výsledku dešifrování vaší místní části pomocí podepsaného klíče. Server může odesílat falešné karty na showdown.
zero_trust.host_community_garbage=Data kryptografické společné karty přijatá ze serveru jsou nekonzistentní (díl se nedešifruje na platnou kartu balíčku nebo neodpovídá podepsanému oznámení serveru). Možné příčiny: CHYBA v některé verzi softwaru, verze serveru, jejíž kód mohl být změněn, nebo poškození místního klíče identity. Klient nemůže rozlišit a nikoho neobviňuje.
zero_trust.host_unlock_out_of_order=Požadavek na dešifrování byl přijat ze serveru mimo pořadí (nesprávná ulice, opakovaný slot, fáze mimo pořadí nebo požadavek vydaný před uzavřením předchozí ulice).
zero_trust.host_cascade_mid_hand=Uprostřed probíhající handy byl ze serveru přijat požadavek na náhodné restartování (přepsalo by se můj dešifrovací klíč).
zero_trust.host_pocket_extraction=Ze serveru byl přijat požadavek na dešifrování, který by ovlivnil VAŠE VLASTNÍ soukromé karty.
zero_trust.host_community_extraction=Ze serveru byl přijat požadavek na dešifrování, který by před časem odhalil společnou kartu.
zero_trust.host_rotation_replay=Server požadoval druhou rotaci karet ve stejné ruce. Legitimní rotace je pro každou handu jedinečná. Opakování naznačuje pokus použít vašeho klienta k dešifrování karet jiných hráčů.
zero_trust.host_shuffle_proof_failed=Ověření dohody se nezdařilo: balíček, který server rozdal, nebylo možné prokázat jako poctivé zamíchání balíčku genesis. Odemknutí komunity bylo odmítnuto a tato relace se ukončuje z důvodu ochrany soukromých karet.
zero_trust.host_shuffle_proof_missing=Dohoda dorazila bez ověřitelného důkazu o poctivém míchání pro tento balíček a nyní jsou odhaleny společné karty. Může to být chyba nebo zpoždění sítě nebo se hostitel snaží zmanipulovat dohodu. Můžete pokračovat ve hře, ale důrazně doporučujeme opustit tento stůl.
zero_trust.deck_unverified=Balíček této kombinace NELZE ověřit jako poctivé míchání. PODezřelý: hostitel "{0}", který rozdává a vysílá důkaz náhodného přehrávání. Může to být hostitel manipulující s dohodou nebo hráč, který zadržel svůj důkaz. Hra je rozehrána, protože karty jsou již rozdány.
zero_trust.deck_unverified_body=Podepsaný důkaz této anomálie byl zaznamenán (v herním deníku, červeně a v tabulce sporných hand). Můžete hrát dál, ale pokud hostiteli nevěříte, odejděte od stolu.
zero_trust.seat_redraw=Hostitel "{0}" si vynutil NOVÉ losování míst. To je NEOBVYKLÉ: losování je hromadné a ověřitelné, takže hostitel nemůže vybrat místa, ale MŮŽE se hodit znovu, dokud nedosáhne uspořádání, které se mu líbí. Pokud se to opakuje, může to být hostitel, který se snaží zmanipulovat vaše sedadlo.
zero_trust.seat_redraw_body=Nové losování proběhlo stejným způsobem a je stále ověřitelné: nikdo, včetně hostitele, nemůže zvolit výsledek. Může se to stát, pokud hráč vypadne hned na začátku, ale pokud vidíte několik pokusů a nevěříte hostiteli, odejděte od stolu. Bylo zaznamenáno.
zero_trust.seat_recover_mismatch=Při obnově hry se pořadí k sezení zaslané hostitelem „{0}“ NEodpovídá tomu, který si váš klient uložil: někdo, koho jste již znali, si vyměnil místo u stolu. Může to být hostitel, který se snaží změnit pořadí sedadel pod krytem zotavení.
zero_trust.seat_recover_mismatch_body=Váš klient si ponechal referenci sedadel, kterou si sám ověřil na začátku. Hráči, kteří se mezitím připojují nebo odcházejí, je normální. Přeřazení někoho, kdo už tam byl, není. Pokud hostiteli nevěříte, odejděte od stolu. Bylo zaznamenáno.
zero_trust.host_recover_action_forged=Hostitel se během obnovy hry pokusil vložit FORGED akci (neplatný podpis). Váš klient to odmítl.
zero_trust.host_recover_action_omitted=Během obnovy hostitel vynechal akci, kterou jste VY hráli a kterou jste zaznamenali ve své místní databázi. Váš klient to detekoval proti své vlastní kopii a NEVYPUSTIL vaši akci.
zero_trust.host_recover_balance_mismatch=Hostitel se pokusil změnit váš zůstatek (žetony/vstupné) během obnovy hry: neodpovídá vašemu místnímu rekordu. Váš klient udržoval VAŠI skutečnou rovnováhu.
zero_trust.host_board_peek=Hostitel požádal o dešifrování společné karty z ulice FUTURE (pokus o předčasné přečtení desky). Váš klient odmítl.
zero_trust.suspect_host_prefix=PODezřelý: hostitel "{0}".
zero_trust.suspect_peer_prefix=PODezřelý: hráč "{0}".
zero_trust.peer_alert=⚠️ [ANOMÁLNÍ CHOVÁNÍ HRÁČŮ]
zero_trust.peer_suspicious_header=U vašeho stolu bylo zjištěno neobvyklé nebo hrubé chování hráče:\n
zero_trust.peer_suspicious_body=Stůl použil odpovídající bezpečnostní opatření a hra pokračuje pro ostatní hráče. Předpokládá se dobrá víra. Může to být softwarová chyba a nikdo není obviněn. Důkazy jsou zaznamenány.
zero_trust.peer_inbound_flood=Trvalý ověřený provoz nad prahem anti-DoS.
zero_trust.peer_binary_flood=Operace hlasových zpráv jsou odesílány neobvykle vysokou rychlostí.
zero_trust.host_binary_flood=Hostitel odesílá operace hlasových zpráv neobvykle vysokou rychlostí.
zero_trust.peer_flood_log=Anti-DoS incident čekající na rozhodnutí: hráč {0}, IP {1}. Důvod: {2}
zero_trust.peer_flood_confirm=Uživatel {0} odesílá nadměrné množství provozu. Může to být útok DoS nebo chyba. Vyloučit je ze hry?\n\nIP: {1}\nZjištěný důvod: {2}
zero_trust.peer_flood_suppress=Nezobrazovat tato varování
zero_trust.peer_hand_ready_withheld=Hráč odpoví PING, ale nepotvrdí připravenost na další handu, zatímco hra běží. Ruční start zamrzl a byl VYPUŠTĚN. Hra pokračuje bez nich.
zero_trust.peer_action_withheld=Hráč odpoví PING, ale nepošle svou sázkovou akci, zatímco hra běží, po uplynutí doby na přemýšlení. Kolem to zmrzlo a bylo VYPUŠTĚNO. Hra pokračuje bez nich.
zero_trust.peer_conf_withheld=Hráč odpoví PING, ale nepotvrdí přijetí rozdávací zprávy, zatímco hra běží. Blokovalo to stůl v postupu a bylo VYPUŠTĚNO. Hra pokračuje bez nich.
zero_trust.peer_deal_refusal_expelled=Hráč si vynutil několik zrušení hand za sebou tím, že odmítl zamíchání balíčku nebo rotaci. Bylo VYPUŠTĚNO, takže hra může pokračovat.
zero_trust.suspicious_alert=⚠️ [ANOMÁLNÍ CHOVÁNÍ SERVERU]
zero_trust.suspicious_header=Váš klient zjistil anomální chování serveru (nejedná se o kritický incident, který zmrazí hru):\n
zero_trust.suspicious_body=Váš klient odmítl anomální operaci a hra MŮŽE pokračovat. Předpokládáme dobrou víru: může se jednat o softwarovou CHYBU (klienta nebo serveru) a nikdo není obviněn. Ale protože chybu nelze odlišit od manipulace, PRO VAŠI BEZPEČNOST DŮRAZNĚ DOPORUČUJEME Opustit tento stůl pomocí tlačítka 'Opustit' (vaše peníze NEBUDOU v této hře zpracovány).
zero_trust.host_bad_wire=Ze serveru byl přijat požadavek na dešifrování s neplatným formátem nebo body, které nepatří do kryptografické křivky.
zero_trust.host_critical_command_invalid=Kritický příkaz {0} odeslaný serverem nelze ověřit. Může se jednat o nekompatibilitu, chybu nebo upravený server. Relace je zastavena, aby byla chráněna její integrita.
zero_trust.cheater_detected=[ZERO-TRUST] Byl detekován hráč s upravenou verzí CoronaPoker, což naznačuje, že se možná pokouší podvádět. Chcete pokračovat?
zero_trust.corrupted_mac_action=Server se pokusil zpracovat akci s neplatným kryptografickým podpisem (poškozený MAC) jménem:
zero_trust.critical=\u274c [NULA DŮVĚRYHODNÁ] KRITICKÉ VAROVÁNÍ: NEPLATNÝ PODPIS NEBO PORUŠENÝ KONSENZUS.
zero_trust.critical_alert_body=STAV KARANTÉNY AKTIVOVÁN:\nVáš klient NEBUDE v této relaci posílat na server žádné další kryptografické klíče.\nHra je matematicky zmrazena, aby byla chráněna vaše rovnováha.\n\nMOŽNÉ příčiny jsou:\n  - CHYBA v samotném klientském kódu,\n  - CHYBA v kódu serveru, popř\n  - SERVER, jehož kód mohl být změněn.\n\nKlient mezi nimi nedokáže rozlišit a není implikováno ŽÁDNÉ obvinění. Z bezpečnostních důvodů a do doby, než bude přezkoumána hlavní příčina, DOPORUČUJEME OPUSTIT tuto hru pomocí tlačítka 'Exit' (vaše peníze NEBUDOU v této hře zpracovány).
zero_trust.critical_alert_header=NULOVÝ INCIDENT!\n\nVáš klient detekoval anomálii v kryptografickém protokolu:\n
zero_trust.critical_session_error=[NULA-TRUST] CHYBA KRITICKÉ RELACE
