game.mano_anulada_footer=\n\nUPOZORNĚNÍ: Všechny sázky byly hráčům vráceny beze změny.
game.showdown_forfeit_msg=UPOZORNĚNÍ: Ověření showdown selhalo u následujících hráčů a jejich karty NEBUDOU odhaleny:\n\n%nicks%\n\nTito hráči jsou vyloučeni z odolnosti showdown (automatické skládání) a NEMOHOU tento bank vyhrát. Hra normálně pokračuje.
zero_trust.peer_sra_corrupt=Podpis showdown je pravý, ale klíč SRA partnera nelze přeložit na platné karty. K tomu dochází pouze v případě, že partner úmyslně podepsal poškozený klíč nebo je jeho klient chybný. Nemůžeme říct které, a pro jistotu hru ukončíme.
zero_trust.straddle_recover_mismatch=Při obnovování handu hostitel oznámil straddle odlišný od té, kterou zaznamenala vaše vlastní místní kopie. To se stane pouze v případě, že hostitel manipuluje s obnoveným straddle nebo jeho klient je buggy. Ruka je stále rekonstruována z vaší důvěryhodné kopie, ale preventivně vás varujeme.
zero_trust.rit_recover_mismatch=Při obnovování ruky hostitel oznámil výsledek běhu dvakrát odlišný od toho, který zaznamenala vaše vlastní místní kopie. K tomu dochází pouze v případě, že hostitel manipuluje s obnoveným výsledkem nebo je jeho klient buggy. Ruka je stále rekonstruována z vaší důvěryhodné kopie, ale preventivně vás varujeme.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown klíč podepsán, ale nelze jej převést na karty. Možný cheat nebo chyba klienta.
