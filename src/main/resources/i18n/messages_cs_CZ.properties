radar.el_servidor_ha_activado_el=Server aktivoval anti-cheat RADAR pro tuto hru. Každý hráč může během hry požádat o anti-cheat zprávu jiného hráče, která obsahuje snímek obrazovky hráče (bez zobrazení jeho karet) a také jeho seznam systémových procesů.
radar.esta_funcionalidad_permite_a_cualquier=Tato funkce umožňuje každému hráči získat snímek obrazovky a seznam procesů jiného hráče, pokud má podezření, že podvádí nebo používá software třetí strany. Jako hostitel prosím zvažte důsledky ochrany soukromí před povolením této možnosti (nelze ji změnit uprostřed hry).\n\nPoznámka: Tato funkce je zcela závislá na platformě, takže není zaručeno, že bude dokonale fungovat na všech klientech.
