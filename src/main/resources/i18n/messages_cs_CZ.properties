player.en_el_bmodo_recuperacionb_se=In <b>REŽIM OBNOVENÍ</b> předchozí hra bude pokračovat od místa, kde skončila:\n\n1) Je <b>POVINNÉ</b> že staří hráči používají <b>STEJNÉ NICKY</b>.\n\n2) Chcete-li pokračovat od <b>PŘESNÝ BOD</b> z ruky to je <b>POVINNÉ</b> že <b>VŠECHNY</b> staří hráči se znovu připojí. Pokud to není možné, prohraje se handa, která probíhá v době, kdy byla hra přerušena.\n\n3) <b>Noví hráči</b> se mohou zapojit do hry (z první ruky budou diváky).
