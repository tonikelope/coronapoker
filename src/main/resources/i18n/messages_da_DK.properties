tooltip.cfg.custom_bots.difficulty=Sætter udfordringen og den taktik, botten bruger. Easy spiller rekreativt, Normal bruger en mere disciplineret strategi og Hard bruger avancerede taktikker.
tooltip.cfg.custom_bots.personality=Indstiller basisstilen. Tilfældig vælger det, når botten er oprettet, og beholder det til den aktive session. Botten kan tilpasse sine beslutninger til situationen.
gdx.settings.option_help.bot_difficulty.easy=Spiller afslappet og laver oftere fejl.
gdx.settings.option_help.bot_difficulty.medium=Bruger en mere disciplineret strategi og justerer beslutninger, efterhånden som hånden udvikler sig.
gdx.settings.option_help.bot_difficulty.hard=Bruger mere avancerede taktikker, såsom at stjæle blinds eller lægge pres, når en modstander ser sårbar ud.
gdx.settings.option_help.custom_bot_personality.random=Vælger en stil, når botten oprettes, og beholder den i den aktive session.
gdx.settings.option_help.custom_bot_personality.nit=Indtaster få hænder og venter normalt på stærke kort, før du risikerer jetoner.
gdx.settings.option_help.custom_bot_personality.station=Har tendens til at calle bets og forblive i hånden. Hæver sjældnere.
gdx.settings.option_help.custom_bot_personality.tag=Vælger hænder selektivt og har en tendens til at tage føringen med indsatser og raises.
gdx.settings.option_help.custom_bot_personality.lag=Spiller et bredere udvalg af hænder og lægger pres med hyppige indsatser og raises.
gdx.settings.option_help.ante_mode.traditional=Hver aktiv spiller poster en tiendedel af big blind, afrundet til nærmeste cent.
gdx.settings.option_help.ante_mode.big_blind=Spilleren i big blind poster hele ante, svarende til en big blind.
gdx.settings.option_help.ante_mode.button=Spilleren på knappen poster hele ante, svarende til en big blind.
gdx.settings.option_help.ante_mode.small_blind=Spilleren i small blind poster hele ante, svarende til en big blind.
gdx.settings.option_help.rebuy_cap.buy_in=Din maksimale stak efter en genkøb er baseret på spillets indkøb.
