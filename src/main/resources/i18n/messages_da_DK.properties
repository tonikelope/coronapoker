game.showdown_forfeit_msg=BEMÆRK: showdown bekræftelse mislykkedes for følgende spiller(e), og deres kort vil IKKE blive afsløret:\n\n%nicks%\n\nDisse spillere er udelukket fra showdown modstand (auto-fold) og KAN IKKE vinde denne pulje. Spillet fortsætter normalt.
zero_trust.peer_sra_corrupt=showdown-signaturen er ægte, men peerens SRA-nøgle omdannes ikke til gyldige kort. Dette sker kun, hvis peeren med vilje har underskrevet en korrupt nøgle, eller deres klient er buggy. Vi kan ikke sige hvilken, og for en sikkerheds skyld afslutter vi spillet.
zero_trust.straddle_recover_mismatch=Mens han genfandt hånden, annoncerede værten en straddle forskellig fra den, din egen lokale kopi havde optaget. Dette sker kun, hvis værten manipulerer med den gendannede straddle eller dens klient er fejlbehæftet. Hånden er stadig rekonstrueret fra din betroede kopi, men vi advarer dig som en forholdsregel.
zero_trust.rit_recover_mismatch=Mens han genoprettede hånden, annoncerede værten et run-it-twice-resultat, der var forskelligt fra det, din egen lokale kopi havde optaget. Dette sker kun, hvis værten manipulerer med det gendannede resultat, eller hvis klienten er fejlbehæftet. Hånden er stadig rekonstrueret fra din betroede kopi, men vi advarer dig som en forholdsregel.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown nøgle signeret, men løses ikke til kort. Mulig snyd eller klientfejl.
