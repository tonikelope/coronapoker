tooltip.cfg.ante=Tilføjer et tvungent bidrag til puljen efter blinds. Tilstanden angiver, hvem der betaler og hvor meget.
tooltip.cfg.ante_mode=I traditionel tilstand betaler hver aktiv spiller 10 % af big blind. I BBA, BA eller SBA betaler big blind, knappen eller small blind én big blind. Blinds bliver sendt først.
tooltip.cfg.blind_cap=Stopper blinds stiger ved det konfigurerede loft.
tooltip.cfg.blinds_level=Starter blinds (lille/stor) for spillet.
tooltip.cfg.bot_balance=Når spillet slutter, er bots' kombinerede saldo delt ligeligt mellem de menneskelige spillere, så rigtige penge afregnes kun mellem mennesker.
tooltip.cfg.bot_rebuy=Global automatisk genkøb kontrol for hver bot. Hvis du slår det fra, deaktiveres også genkøb-indstillingerne for brugerdefinerede bots.
tooltip.cfg.bots=Indstiller sværhedsgraden af ​​standard bots. Brugerdefinerede bots holder sværhedsgraden konfigureret individuelt i Bot Manager.
tooltip.cfg.buyin_fixed=Alle starter med det samme indkøb. Når de er slået fra, vælger spillerne inden for det konfigurerede område.
tooltip.cfg.double_blinds=Går videre til det næste blinds-niveau i strukturen efter et bestemt antal hænder eller minutter.
tooltip.cfg.hand_limit=Spillet slutter, når dette antal hænder er nået.
tooltip.cfg.iwtsth=Lader dig bede om at se en rivals hånd ved showdown.
tooltip.cfg.rabbit=Afslører uuddelte fælleskort efter hånden. Hver spillers første anmodning er gratis. Den valgte tilstand angiver, om senere anmodninger forbliver gratis eller koster en lille eller big blind.
tooltip.cfg.rebuy_limit=Maksimalt genkøb pr. spiller.
tooltip.cfg.recover=Genoptager et spil, der tidligere blev afbrudt.
tooltip.cfg.rit=Tillader en stemme at dele de resterende kort to gange, når en All-in lukker væddemål.
tooltip.cfg.straddle=Spilleren efter big blind kan poste to big blind, før de ser deres kort og agere sidste preflop.
tooltip.cfg.straddle_on_timeout=Send straddle automatisk, når prompten timeout. Dette påvirker kun din afspiller og er deaktiveret som standard.
tooltip.cfg.structure=Blinds-niveau struktur for spillet.
tooltip.cfg.think_time=Sekunder til rådighed til at beslutte. Den automatiske handling kører, når tiden udløber.
tooltip.cfg.showdown_time=Sekunder forbliver håndresultatet på skærmen, før den næste hånd uddeles.
tooltip.cfg.allow_hot_join=Tillader nye spillere at deltage som OPVARMNING og deltage i den næste hånd. Når det ændres under et spil, påvirker det kun nye forbindelsesforsøg.
tooltip.cfg.card_flip_duration=Indstiller, hvor lang tid det tager hvert kort at fuldføre sin tur, når det afsløres.
tooltip.cfg.card_flip_direction=Vælger, hvilken vej kortene vender, når de afsløres. Mixed vælger en retning for hver afsløring. Kort i samme gruppe vender sammen på samme måde.
tooltip.cfg.reparto_velocidad=Indstiller, hvor lang tid hvert kort tager at rejse fra bunken til dets sæde.
tooltip.cfg.community_deal_style=Vælg, om alle fem fælleskort skal uddeles med billedsiden nedad i starten eller på deres egen gade. Gemte ændringer gælder fra næste hånd.
tooltip.cfg.anim_calidad=Kvalitet bevarer alle visuelle detaljer. Ydeevne reducerer omkostningerne ved kortflyvninger og afslører på svagere computere.
tooltip.cfg.downgrade_velocidad=Indstiller, hvor lang tid det tager bordet at omarrangere sine pladser, når en spiller forlader.
tooltip.cfg.swap_velocidad=Indstiller, hvor lang tid det tager at krydse dine kort, når de er sorteret.
tooltip.cfg.swap_estilo=Arc hæver det ene kort over det andet. Vandret krydser dem i samme højde.
tooltip.cfg.resaltar_avatares=Hvis du hviler musen et øjeblik på en spillers avatar, vises den forstørret over bordet ved siden af ​​deres navn og stak, og den forsvinder, når du flytter musen fra den.
