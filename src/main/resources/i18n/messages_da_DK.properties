zero_trust.cascade_failed=\u274c [ZERO-TRUST] Kryptografisk shuffle-kaskade mislykkedes. Hånden er blevet annulleret.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Kunne ikke låse op for private kort (en spiller svarede ikke i tide). Hånden er blevet annulleret.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Et dekrypteret kort matcher ikke noget gyldigt kort i bunken. Spillet er blevet aflyst.
peer.not_enough_players=En spiller faldt under shufflen, og der er ikke længere nok spillere til at give hånden.
peer.unlock_no_testament=En spiller afbrød forbindelsen uden at forlade deres dekrypteringsnøgle. Hånden er blevet annulleret.
peer.broadcast_failed=Netværksfejl under udsendelse af private kort. Hånden er blevet annulleret.
peer.recovery_action_data_unavailable=Den gemte handlingshistorik kunne ikke læses. Hånden er blevet annulleret sikkert og vil vende tilbage til bedring.
straddle.deferred_release_failed=blinds straddle-kortene kunne ikke afsløres (en spiller blev afbrudt eller nægtede at samarbejde). Hånden er blevet annulleret.
peer.state_inconsistent=Forhandlertilstanden blev inkonsekvent. Hånden er blevet annulleret.
peer.bot_no_token=En bot har ikke sin dekrypteringsnøgle klar. Hånden er blevet annulleret.
peer.community_unlock_no_testament=En spiller afbrød forbindelsen uden at forlade deres nøgle for at afsløre fælleskort. Hånden er blevet annulleret.
peer.dropped_during_cascade=En spiller blev afbrudt under bunkens kryptografiske shuffle. Hånden er blevet annulleret.
peer.dropped_during_rotation=En spiller afbrudt under dæks kryptografiske rotation. Hånden er blevet annulleret.
zero_trust.rotation_refused=En tilsluttet spiller nægtede at levere deres dækrotationsnøgle. Spillet er stoppet. De bliver nødt til at begrunde deres afslag på at blive genoptaget.
zero_trust.cascade_refused=En tilsluttet spiller nægtede at deltage i deck shuffle-kaskaden. Spillet er stoppet. De bliver nødt til at begrunde deres afslag på at blive genoptaget.
zero_trust.pocket_unlock_refused=En tilsluttet spiller nægtede at levere deres nøgle til at dekryptere lommekort. Spillet er stoppet. De bliver nødt til at begrunde deres afslag på at blive genoptaget.
zero_trust.community_unlock_refused=En tilsluttet spiller nægtede at levere deres nøgle for at afsløre fælleskort. Spillet er stoppet. De bliver nødt til at begrunde deres afslag på at blive genoptaget.
zero_trust.host_showdown_sig_missing=En showdown nøgle blev modtaget fra serveren UDEN forfatterens kryptografiske signatur eller med en forkert udformet signatur. Serveren erstatter muligvis nøglen på ledningen.
zero_trust.host_showdown_sig_invalid=En showdown nøgle blev modtaget fra serveren med en Ugyldig kryptografisk signatur. Serveren erstatter muligvis nøglen på ledningen.
zero_trust.host_potcards_mismatch=showdown klarteksten sendt af serveren SAMMENHAR IKKE resultatet af dekryptering af dit lokale stykke med den signerede nøgle. Serveren sender muligvis falske kort på showdown.
zero_trust.host_community_garbage=De kryptografiske fælleskortdata, der modtages fra serveren, er inkonsekvente (stykket dekrypterer ikke til et gyldigt kortspil eller matcher ikke serverens underskrevne meddelelse). Mulige årsager: en BUG i en eller anden version af softwaren, en serverversion, hvis kode kan være blevet ændret, eller korruption af lokal identitetsnøgle. Klienten kan ikke se forskel og anklager IKKE nogen.
zero_trust.host_unlock_out_of_order=En dekrypteringsanmodning er blevet modtaget fra serveren uden for rækkefølge (forkert gade, gentaget slot, udfaset funktion eller anmodning udstedt før den forrige gade lukkede).
zero_trust.host_cascade_mid_hand=En shuffle-genstartsanmodning er blevet modtaget fra serveren midt i en igangværende hånd (ville overskrive min dekrypteringsnøgle).
zero_trust.host_pocket_extraction=Der er modtaget en dekrypteringsanmodning fra serveren, som ville påvirke DINE EGNE private kort.
zero_trust.host_community_extraction=Der er modtaget en dekrypteringsanmodning fra serveren, som ville afsløre et fælleskort på forhånd.
zero_trust.host_rotation_replay=Serveren anmodede om en anden kortrotation i samme hånd. Den legitime rotation er unik pr. hånd. En gentagelse foreslår et forsøg på at bruge din klient til at dekryptere andre spilleres kort.
zero_trust.host_shuffle_proof_failed=Verifikationen af ​​aftalen mislykkedes: det kort, serveren uddelte, kunne ikke bevises at være en ærlig blanding af genesis-dækket. Fællesskabets oplåsninger er blevet afvist, og denne session er ved at blive afsluttet for at beskytte private kort.
zero_trust.host_shuffle_proof_missing=Handlen ankom uden et verificerbart, ærligt blandet bevis for denne hånds kortspil, og fælleskort bliver nu afsløret. Det kan være en fejl eller en netværksforsinkelse, eller en vært, der forsøger at manipulere aftalen. Du kan fortsætte med at spille, men det anbefales kraftigt at forlade dette bord.
zero_trust.deck_unverified=Kortet på denne hånd kunne IKKE verificeres som en ærlig shuffle. MISTÆTTE: vært "{0}", som uddeler og udsender shuffle-beviset. Det kan være værten, der manipulerer aftalen, eller en spiller, der tilbageholdt deres bevis. Hånden spilles ud, fordi kortene allerede er uddelt.
zero_trust.deck_unverified_body=Underskrevne beviser på denne uregelmæssighed er blevet registreret (i spilloggen, i rødt og i tabellen med omstridte hænder). Du kan fortsætte med at spille, men hvis du ikke stoler på værten, så forlad bordet.
zero_trust.seat_redraw=Værten "{0}" fremtvang en NY lodtrækning. Dette er usædvanligt: ​​lodtrækningen er kollektiv og verificerbar, så værten kan ikke vælge pladserne, men den KAN rulle igen, indtil den får et arrangement, den kan lide. Hvis det gentager sig, kan det være værten, der forsøger at rigge dit sæde.
zero_trust.seat_redraw_body=Den nye lodtrækning kørte på samme måde og kan stadig verificeres: ingen, inklusive værten, kan vælge resultatet. Det kan ske, hvis en spiller faldt lige i starten, men hvis du ser flere forsøg igen, og du ikke stoler på værten, skal du forlade bordet. Det er blevet logget.
zero_trust.seat_recover_mismatch=Ved gendannelse af spillet svarer pladsrækkefølgen sendt af værten "{0}" IKKE til den, din klient havde gemt: en person, du allerede kendte, har skiftet plads ved bordet. Det kan være en vært, der forsøger at omarrangere sæderne i ly af genoprettelsen.
zero_trust.seat_recover_mismatch_body=Din klient beholdt sædereferencen, den verificerede sig selv i starten. Spillere, der tilslutter sig eller forlader i mellem, er normalt. At omarrangere en, der allerede var der, er ikke. Hvis du ikke stoler på værten, så forlad bordet. Det er blevet logget.
zero_trust.host_recover_action_forged=Værten forsøgte at injicere en FORGED-handling (ugyldig signatur) under gendannelse af spillet. Din klient nægtede det.
zero_trust.host_recover_action_omitted=Under gendannelse udelod værten en handling, som DU afspillede og havde optaget i din lokale database. Din klient opdagede det mod sin egen kopi og droppede IKKE lydløst din handling.
zero_trust.host_recover_balance_mismatch=Værten forsøgte at ændre din saldo (chips/indkøb) under gendannelse af spillet: det matcher ikke din lokale rekord. Din klient beholdt DIN reelle balance.
zero_trust.host_board_peek=Værten anmodede om at dekryptere et fælleskort fra en FUTURE gade (et forsøg på at læse tavlen tidligt). Din klient nægtede.
zero_trust.suspect_host_prefix=MISTÆTTE: vært "{0}".
zero_trust.suspect_peer_prefix=MISTÆTTE: spiller "{0}".
zero_trust.peer_alert=⚠️ [ANOMAL SPILLEREDFÆRD]
zero_trust.peer_suspicious_header=Unormal eller fornærmende adfærd fra en spiller er blevet opdaget ved dit bord:\n
zero_trust.peer_suspicious_body=Tabellen anvendte den tilsvarende sikkerhedsforanstaltning, og spillet fortsætter for de andre spillere. Der forudsættes god tro. Det kan være en softwarefejl, og ingen bliver anklaget. Beviserne er optaget.
zero_trust.peer_inbound_flood=Vedvarende autentificeret trafik over anti-DoS-grænsen.
zero_trust.peer_binary_flood=Talebeskeder sendes med en usædvanlig høj hastighed.
zero_trust.host_binary_flood=Værten sender talebeskeder med en usædvanlig høj hastighed.
zero_trust.peer_flood_log=Anti-DoS-hændelse afventer en afgørelse: spiller {0}, IP {1}. Årsag: {2}
zero_trust.peer_flood_confirm=Bruger {0} sender en for stor mængde trafik. Dette kan være et DoS-angreb eller en fejl. Udvis dem fra spillet?\n\nIP: {1}\nOpdaget årsag: {2}
zero_trust.peer_flood_suppress=Vis ikke disse advarsler
zero_trust.peer_hand_ready_withheld=En spiller svarer PING, men bekræfter ikke klar til næste hånd, mens spillet kører. Det var frysende håndstart og er blevet udvist. Spillet fortsætter uden dem.
zero_trust.peer_action_withheld=En spiller svarer PING, men sender ikke sin indsats, mens spillet kører, forbi sin tænketid. Det fryser rundt og er blevet udvist. Spillet fortsætter uden dem.
zero_trust.peer_conf_withheld=En spiller svarer PING, men bekræfter ikke modtagelsen af ​​en dealbesked, mens spillet kører. Det blokerede bordet i at komme videre og er blevet udvist. Spillet fortsætter uden dem.
zero_trust.peer_deal_refusal_expelled=En spiller tvang flere håndslysninger i træk ved at nægte bunken eller rotationen. Det er blevet udvist, så spillet kan fortsætte.
zero_trust.suspicious_alert=⚠️ [ANOMAL SERVERADFØRELSE]
zero_trust.suspicious_header=Din klient har registreret unormal serveradfærd (ikke en kritisk hændelse, der fryser spillet):\n
zero_trust.suspicious_body=Din klient afviste den unormale operation, og spillet KAN fortsætte. Vi antager god tro: dette kan være en software-BUG (klient eller server), og ingen bliver anklaget. Men da en fejl ikke kan ses ud over manipulation, ANBEFALES DET FOR DIN SIKKERHED STÆRKT AT FORLADE dette bord ved at bruge knappen 'Forlad' (dine penge vil IKKE blive behandlet i denne hånd).
zero_trust.host_bad_wire=Der er modtaget en dekrypteringsanmodning fra serveren med et ugyldigt format eller punkter, der ikke hører til den kryptografiske kurve.
zero_trust.host_critical_command_invalid=Den kritiske {0}-kommando sendt af serveren kunne ikke valideres. Dette kan være en inkompatibilitet, en fejl eller en modificeret server. Sessionen stoppes for at beskytte dens integritet.
zero_trust.cheater_detected=[ZERO-TRUST] En spiller med en ændret CoronaPoker-version er blevet opdaget, hvilket tyder på, at de måske forsøger at snyde. Vil du fortsætte?
zero_trust.corrupted_mac_action=Serveren forsøgte at behandle en handling med en ugyldig kryptografisk signatur (ødelagt MAC) på vegne af:
zero_trust.critical=\u274c [ZERO-TRUST] KRITISK ADVARSEL: Ugyldig SIGNATUR ELLER brudt KONSENSUS.
zero_trust.critical_alert_body=KARANTÆNESTAT AKTIVERET:\nDin klient VIL IKKE sende flere kryptografiske nøgler til serveren i denne session.\nSpillet er matematisk frosset for at beskytte din balance.\n\nDe MULIGE årsager er:\n  - en BUG i selve klientkoden,\n  - en BUG i serverkoden, eller\n  - en SERVER, hvis kode kan være blevet ændret.\n\nKlienten kan ikke skelne mellem dem, og INGEN anklage er underforstået. For en sikkerheds skyld, og i afventning af gennemgang af den grundlæggende årsag, ANBEFALES det, at du forlader dette spil ved at bruge knappen 'Afslut' (dine penge vil IKKE blive behandlet i denne hånd).
zero_trust.critical_alert_header=ZERO-TRUST INCIDENT!\n\nDin klient har registreret en anomali i den kryptografiske protokol:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITISK SESSION FEJL
zero_trust.decrypting_street=[NULL-TRUST] DESKRIVER GADEN...
zero_trust.wait_deal=Venter på spillernes bidrag til at blande og dele kortene ud.
zero_trust.wait_shuffle_proof=Venter på kryptografisk bevis for blandingen.
zero_trust.wait_sra_unlock=Venter på SRA-nøglerne til at åbne {0}.
game.settlement_verification_wait=Venter på kvitteringerne for at verificere hånden og bekræfte saldoerne.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Hurtig konsensus-timeout. Tvinger avancement.
zero_trust.forged_identity_action=Serveren forsøgte at behandle en handling med en forfalsket identitetssignatur på vegne af:
zero_trust.game_aborted=[ZERO-TRUST] Spillet blev afbrudt. Spark snyderne.
zero_trust.generating_kem=[ZERO-TRUST] GENERERER KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ZERO-TRUST ALERT] Ugyldig MAC på fælleskort. Mulig manipulation.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] KONSENSUS-KRYPTOGRAFISK VERIFIKATION: ALLE SPILLERE HAR CERTIFICERT, AT AT BESTADE DERES LOKALE HÅNDKRYPTOGRAFISKE VERIFIKATION.
zero_trust.legit2_error=\u274c [ZERO-TRUST] KONSENSUS KRYPTOGRAFISK VERIFIKATION: MINDST ÉN SPILLER HAR IKKE CERTIFICERET, AT AT BESTADE DERES LOKALE HÅNDKRYPTOGRAFISKE VERIFIKATION.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] LOKAL HÅNDKRYPTOGRAFISK VERIFIKATION: MINE KORT, FÆLLESSKABSKORT OG ALLE REGISTREREDE HANDLINGER ER LIGELITIME.
zero_trust.legit_error=\u274c [ZERO-TRUST] LOKAL HÅNDKRYPTOGRAFISK VERIFIKATION: KAN IKKE SIKRE, AT MINE KORT, FÆLLESSKABSKORT OG ALLE REGISTREREDE HANDLINGER ER LEGITIMME.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Karantæne aktiveret. Blokering af transmission af kryptografiske nøgler.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Ingen tidligere binær log for denne hånd.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: REVISION HUKOMMELSE...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] En spiller med en ændret CoronaPoker-version er blevet opdaget, hvilket tyder på, at de måske forsøger at snyde.
zero_trust.p2p_finished_resuming=P2P KEM-bekræftelse afsluttet. Genoptager hånden...
zero_trust.p2p_generating_challenges=[ZERO-TRUST] P2P: GENERERER UDFORDRINGER...
zero_trust.p2p_timeout=P2P Swarm Timeout! Nogle spillere blev markeret som upålidelige.
zero_trust.p2p_verifying_signatures=[ZERO-TRUST] P2P: VERIFICERER SIGNATURER...
zero_trust.read_binary_log_failure=[ZERO-TRUST] Kunne ikke læse binær log.
zero_trust.rejecting_master_key=\ud83d\udd12 [LOCKDOWN] Afvisning af Master Key Share-transmission til serveren.
zero_trust.rejecting_street_token=\ud83d\udd12 [LOCKDOWN] Afvisning af Street Token-anmodning fra serveren.
zero_trust.replay_queue_synced=\u2714\ufe0f [ZERO-TRUST] Genafspilningskø synkroniseret ({0} signaturer).
zero_trust.security_alert=\u26a0\ufe0f [SIKKERHEDSADVARSEL]
zero_trust.evidence_location=Nul tillidsbevis: {0}
zero_trust.fatal_incident_title=NUL TILLIDSHÆNDELSE
zero_trust.fatal_incident_body=CoronaPoker afviste en godkendt kritisk tilstand og stoppede tabellen, før den fortsatte. Bekræft denne advarsel for at lukke den berørte tabel.\n\nNul tillidsbevis: {0}
zero_trust.qa_pre_settlement_fault=Den kryptografiske aftale blev afvist før forlig.
zero_trust.qa_lockdown_fault=Den godkendte værtstilstand mislykkedes i kryptografisk validering.
zero_trust.session_generated=\u2714\ufe0f [ZERO-TRUST] Ny session genereret og gemt på disk.
zero_trust.session_restored=\u2714\ufe0f [ZERO-TRUST] Sessionsnøgle blev gendannet.
zero_trust.timeout=\u274c [ZERO-TRUST] TIMEOUT (SPRINGET HÅNDVALIDERING)
zero_trust.timeout_community_cards=\u274c [ZERO-TRUST] Timeout venter på fælleskort.
