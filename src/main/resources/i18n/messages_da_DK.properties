game.popup_verificacion_firma_invalida=I løbet af denne hånd vil en eller flere deltagere ({0}) opdagede en ugyldig kryptografisk signatur på en handling.\n\nDe data, der blev modtaget af alle deltagere, var konsistente (de sidste kæde-hashes matchede), men mindst én handling var ikke korrekt underskrevet af dens forventede forfatter.\n\nCoronaPoker stoppede sikker håndlukning og vil lukke bordet som en sikkerhedsfejl, efter at denne advarsel er blevet bekræftet.\n\nBeviser gemt i:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Bemærk: {0} modtog ikke det ærlige blandebevis for denne hånd. Beviser: {1}
game.popup_verificacion_host_sin_prueba=En eller flere deltagere ({0}) modtog ikke det ærlige-shuffle-bevis for denne hånd.\n\nDe sidste kæde-hashes matcher på tværs af alle deltagere, så håndhandlingerne er konsistente. En korrekt vært sender altid dette bevis, så et gentaget eller peer-selektivt fravær kan indikere modificeret software eller en softwarefejl.\n\nHånden var afgjort, men det anbefales at forlade spillet som en sikkerhedsforanstaltning.\n\nBeviser gemt i:\n{1}
