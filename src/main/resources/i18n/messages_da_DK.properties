game.popup_verificacion_divergente=En eller flere deltagere rapporterede om en anden kryptografisk verifikation af den endelige håndtilstand.\n\nDette kan være forårsaget af modificeret software eller af en softwaredefekt. CoronaPoker kan ikke automatisk fastslå årsagen, eller hvem der har forårsaget den.\n\nCoronaPoker stoppede sikker håndlukning og vil lukke bordet som en sikkerhedsfejl, efter at denne advarsel er blevet bekræftet.\n\nBeviser gemt i:\n{0}
game.popup_verificacion_ausente=Den sidste hånd kunne ikke nå konsensus, fordi spilleren {0} ikke sendte en afsluttende signatur.\n\nDette kan være forårsaget af et netværkssvigt, en klientfejl eller ændret software. CoronaPoker stoppede sikker håndlukning og vil lukke bordet som en sikkerhedsfejl, efter at denne advarsel er blevet bekræftet.\n\nBevis gemt i:\n{1}
