gdx.settings.tooltip.auto_buttons=Zeigt automatische Aktionen an, die ausgeführt werden können, wenn Sie an der Reihe sind.
gdx.settings.tooltip.auto_call=Konfiguriert automatische Anrufe und den maximal zulässigen Betrag.
gdx.settings.tooltip.auto_persist=Behält die automatische Aktion nach ihrer Ausführung ausgewählt bei, bis die Hand endet oder die Auswahl gelöscht wird.
