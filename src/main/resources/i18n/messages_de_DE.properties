radar.el_servidor_ha_activado_el=Der Server hat für dieses Spiel das Anti-Cheat-RADAR aktiviert. Jeder Spieler kann während des Spiels einen Anti-Cheat-Bericht eines anderen Spielers anfordern, der einen Screenshot des Spielers (ohne seine Karten zu zeigen) sowie eine Liste seiner Systemprozesse enthält.
radar.esta_funcionalidad_permite_a_cualquier=Mit dieser Funktion kann jeder Spieler einen Screenshot und eine Prozessliste eines anderen Spielers erhalten, wenn er den Verdacht hat, dass dieser betrügt oder Software von Drittanbietern verwendet. Bitte bedenken Sie als Gastgeber die Auswirkungen auf den Datenschutz, bevor Sie diese Option aktivieren (sie kann nicht während des Spiels geändert werden).\n\nHinweis: Diese Funktion ist stark plattformabhängig, daher kann nicht garantiert werden, dass sie auf allen Clients perfekt funktioniert.
