game.popup_verificacion_firma_invalida=Während dieser Hand haben ein oder mehrere Teilnehmer ({0}) eine ungültige kryptografische Signatur für eine Aktion festgestellt.\n\nDie von allen Teilnehmern empfangenen Daten waren konsistent (die endgültigen Ketten-Hashes stimmten überein), aber mindestens eine Aktion wurde vom erwarteten Autor nicht ordnungsgemäß signiert.\n\nCoronaPoker hat die sichere Handschließung gestoppt und wird den Tisch nach dieser Warnung als Sicherheitsfehler schließen bestätigt.\n\nBeweise gespeichert in:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Hinweis: {0} hat für diese Hand keinen Ehrlich-Misch-Beweis erhalten. Beweis: {1}
game.popup_verificacion_host_sin_prueba=Einer oder mehrere Teilnehmer ({0}) haben für diese Hand keinen Ehrlich-Misch-Beweis erhalten.\n\nDie endgültigen Ketten-Hashes stimmen bei allen Teilnehmern überein, sodass die Handaktionen konsistent sind. Ein korrekter Host sendet diesen Beweis immer, sodass ein wiederholtes oder punktuelles Fehlen auf eine geänderte Software oder einen Softwarefehler hinweisen könnte.\n\nDie Hand wurde entschieden, es wird jedoch vorsichtshalber empfohlen, das Spiel zu verlassen.\n\nBeweise gespeichert in:\n{1}
game.popup_verificacion_titulo_alerta=Divergenz bei der kryptografischen Verifizierung
game.popup_verificacion_titulo_aviso=Die kryptografische Überprüfung ist unvollständig
game.popup_verificacion_divergente=Einer oder mehrere Teilnehmer haben eine unterschiedliche kryptografische Überprüfung des endgültigen Handzustands gemeldet.\n\nDies kann durch geänderte Software oder einen Softwarefehler verursacht werden. CoronaPoker kann die Ursache oder den Verursacher nicht automatisch ermitteln.\n\nCoronaPoker hat die sichere Handschließung gestoppt und schließt den Tisch als Sicherheitsfehler, nachdem diese Warnung bestätigt wurde.\n\nBeweise gespeichert in:\n{0}
game.popup_verificacion_ausente=In der letzten Hand konnte kein Konsens erzielt werden, da Spieler {0} keine Abschlusssignatur gesendet hat.\n\nDies kann durch einen Netzwerkausfall, einen Clientfehler oder eine geänderte Software verursacht werden. CoronaPoker hat den sicheren Handverschluss gestoppt und schließt den Tisch als Sicherheitsfehler, nachdem diese Warnung bestätigt wurde.\n\nBeweis gespeichert in:\n{1}
game.mano_verificacion_interrumpida=KRITISCH: Sicherer Handverschluss fehlgeschlagen ({0}). Die Tabelle wird aufgrund eines Sicherheitsfehlers geschlossen. Beweis: {1}
game.popup_verificacion_interrumpida=CoronaPoker konnte das kryptografische Abschlussprotokoll für die letzte Hand nicht abschließen.\n\nFehler: {0}\n\nDie Hand bleibt zur Wiederherstellung offen. Der Tisch wird aufgrund eines Sicherheitsfehlers erst geschlossen, nachdem diese Warnung bestätigt wurde.\n\nBeweise gespeichert in:\n{1}
