player.en_el_bmodo_recuperacionb_se=Im <b>RECOVERY-MODUS</b> wird das vorherige Spiel dort fortgesetzt, wo es aufgehört hat:\n\n1) Es ist <b>PFLICHT</b>, dass alte Spieler das <b>GLEICHE verwenden NICKS</b>.\n\n2) Um ab dem <b>GENAUEN PUNKT</b> der Hand fortzufahren, ist es <b>PFLICHT</b>, dass <b>ALLE</b> alte Spieler sich wieder verbinden. Wenn dies nicht möglich ist, geht die laufende Hand verloren, als das Spiel unterbrochen wurde.\n\n3) <b>Neue Spieler</b> dürfen am Spiel teilnehmen (sie sind Zuschauer der ersten Hand).
