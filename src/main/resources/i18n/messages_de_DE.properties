tooltip.cfg.ante=Fügt nach dem Blinds einen erzwungenen Beitrag zum Pot hinzu. Der Modus legt fest, wer wie viel zahlt.
tooltip.cfg.ante_mode=Im traditionellen Modus zahlt jeder aktive Spieler 10 % der Big Blind. In BBA, BA oder SBA zahlt die Taste Big Blind oder Small Blind einen Big Blind. Blinds werden zuerst gepostet.
tooltip.cfg.blind_cap=Stoppt Blinds Erhöhungen bei der konfigurierten Obergrenze.
tooltip.cfg.blinds_level=Beginn Blinds (klein/groß) für das Spiel.
tooltip.cfg.bot_balance=Wenn das Spiel endet, wird das Gesamtguthaben der Bots zu gleichen Teilen unter den menschlichen Spielern aufgeteilt, sodass echtes Geld nur zwischen den Spielern ausgezahlt wird.
tooltip.cfg.bot_rebuy=Globale automatische Rebuy-Kontrolle für jeden Bot. Wenn Sie es deaktivieren, werden auch die Rebuy-Einstellungen benutzerdefinierter Bots deaktiviert.
tooltip.cfg.bots=Legt den Schwierigkeitsgrad von Standard-Bots fest. Bei benutzerdefinierten Bots wird der Schwierigkeitsgrad im Bot Manager individuell konfiguriert.
tooltip.cfg.buyin_fixed=Jeder beginnt mit dem gleichen Buy-in. Wenn diese Option deaktiviert ist, wählen die Spieler innerhalb des konfigurierten Bereichs.
tooltip.cfg.double_blinds=Wechselt nach einer festgelegten Anzahl von Zeigern oder Minuten zur nächsten Blinds-Ebene in der Struktur.
tooltip.cfg.hand_limit=Das Spiel endet, wenn diese Handanzahl erreicht ist.
tooltip.cfg.iwtsth=Hier können Sie um Showdown darum bitten, die Hand eines Rivalen zu sehen.
tooltip.cfg.rabbit=Zeigt nicht ausgeteilte Gemeinschaftskarten nach der Hand an. Die erste Anfrage jedes Spielers ist kostenlos. Der gewählte Modus legt fest, ob spätere Anfragen kostenlos bleiben oder einen kleinen Betrag oder Big Blind kosten.
tooltip.cfg.rebuy_limit=Maximale Rebuys pro Spieler.
tooltip.cfg.recover=Setzt ein zuvor unterbrochenes Spiel fort.
tooltip.cfg.rit=Ermöglicht eine Abstimmung, bei der die verbleibenden Karten zweimal ausgeteilt werden, wenn die Wette mit All-in abgeschlossen wird.
tooltip.cfg.straddle=Der Spieler nach der Big Blind kann zwei Big Blind setzen, bevor er seine Karten sieht, und als Letzter vor dem Flop handeln.
tooltip.cfg.straddle_on_timeout=Veröffentlichen Sie die Straddle automatisch, wenn die Eingabeaufforderung abläuft. Dies betrifft nur Ihren Player und ist standardmäßig deaktiviert.
tooltip.cfg.structure=Blinds-Level-Struktur für das Spiel.
tooltip.cfg.think_time=Es stehen Sekunden zur Verfügung, um zu entscheiden. Die automatische Aktion wird ausgeführt, wenn die Zeit abgelaufen ist.
tooltip.cfg.showdown_time=Sekunden lang bleibt das Ergebnis der Hand auf dem Bildschirm, bevor die nächste Hand ausgeteilt wird.
tooltip.cfg.allow_hot_join=Ermöglicht es neuen Spielern, als Aufwärmspieler beizutreten und an der nächsten Hand teilzunehmen. Wenn es während eines Spiels geändert wird, betrifft es nur neue Verbindungsversuche.
tooltip.cfg.card_flip_duration=Legt fest, wie lange es dauert, bis jede Karte nach dem Aufdecken an der Reihe ist.
tooltip.cfg.card_flip_direction=Legt fest, in welche Richtung sich die Karten drehen, wenn sie aufgedeckt werden. „Gemischt“ wählt für jede Laibung eine Richtung aus. Karten derselben Gruppe werden auf die gleiche Weise gedreht.
tooltip.cfg.reparto_velocidad=Legt fest, wie lange jede Karte braucht, um vom Stapel zu ihrem Platz zu gelangen.
tooltip.cfg.community_deal_style=Wählen Sie, ob alle fünf Gemeinschaftskarten zu Beginn verdeckt oder auf einer eigenen Straße ausgeteilt werden. Gespeicherte Änderungen gelten ab der nächsten Hand.
tooltip.cfg.anim_calidad=Qualität bewahrt jedes optische Detail. Durch die Leistung werden die Kosten für Kartenflüge und -enthüllungen auf schwächeren Computern gesenkt.
tooltip.cfg.downgrade_velocidad=Legt fest, wie lange der Tisch braucht, um seine Plätze neu zu ordnen, wenn ein Spieler den Tisch verlässt.
tooltip.cfg.swap_velocidad=Legt fest, wie lange es dauert, bis Ihre Karten sortiert sind.
tooltip.cfg.swap_estilo=Arc hebt eine Karte über die andere. Die Horizontale kreuzt sie auf gleicher Höhe.
tooltip.cfg.resaltar_avatares=Wenn Sie die Maus einen Moment lang auf dem Avatar eines Spielers ruhen lassen, wird dieser vergrößert über dem Tisch angezeigt, neben seinem Namen und Stapel, und er verschwindet, wenn Sie die Maus davon wegbewegen.
tooltip.cfg.resaltar_jugada_showdown=Wenn Sie während der Showdown mit der Maus über den Namen der Hand eines Spielers (Gewinner oder Verlierer) fahren, werden nur die Karten hervorgehoben, aus denen sie besteht, und der Rest wird abgeblendet.
tooltip.cfg.screenshot_fin_timba=Speichert automatisch einen Screenshot des letzten Bildschirms, wenn der Geldzähler fertig ist (oder wenn Sie ihn verlassen, falls Sie ihn früher verlassen).
tooltip.cfg.server_ip=Adresse (IP oder Domäne), an der der Spieleserver lauscht.
tooltip.cfg.server_port=TCP Port von 1 bis 65535, auf dem der Server lauscht.
tooltip.cfg.upnp=Fordert Ihren Router auf, diesen TCP-Port an den Host weiterzuleiten, bis die Spielsitzung geschlossen wird.
tooltip.cfg.preset=Lädt ein gespeichertes Einstellungsprofil.
tooltip.cfg.preset_save=Speichert die aktuellen Einstellungen als wiederverwendbares Profil.
tooltip.cfg.preset_delete=Löscht das ausgewählte Einstellungsprofil.
tooltip.cfg.buyin=Chips, mit denen jeder Spieler am Tisch beginnt.
tooltip.cfg.buyin_range=Bei einer Variablen Buy-in wählt jeder Spieler sein Buy-in innerhalb dieses Bereichs (in Big Blind).
tooltip.cfg.volume=Gesamtspiellautstärke.
tooltip.cfg.sound_master=Aktiviert oder stummschaltet Musik, Soundeffekte und Chat-Audio. Der Poker-Videoplayer verfügt über eine eigene Lautstärke.
tooltip.cfg.music_master=Schaltet die gesamte Musik ein oder aus.
tooltip.cfg.fx_master=Schaltet alle Soundeffekte ein oder aus.
tooltip.cfg.game_start_sound=Spielt den Startton ab, wenn ein Spiel beginnt oder wiederhergestellt wird.
tooltip.cfg.music_surface=Aktiviert die Musik für diesen Bildschirm oder Moment. Mit der Wiedergabetaste können Sie eine Vorschau anzeigen, ohne die Einstellungen zu verlassen.
tooltip.cfg.recovery_music=Aktiviert die Musik, die abgespielt wird, während ein unterbrochenes Spiel wiederhergestellt wird.
tooltip.cfg.silly_sounds=Aktiviert Scherzgeräusche, die während des Spiels abgespielt werden können.
gdx.settings.tooltip.mod_audio_override=Es wird die vom geladenen MOD bereitgestellte Version verwendet.
tooltip.cfg.play_own_notes=Spielt auch Ihre eigenen Sprachnotizen ab, wenn Sie diese senden.
tooltip.cfg.notes_retention=Legt fest, wie lange Sprachnotizen aufbewahrt werden. Bei „Für immer“ werden sie nur manuell gelöscht.
tooltip.cfg.purge_notes=Löscht sofort alle gespeicherten Sprachnotizen.
tooltip.cfg.view_notes=Öffnet den Viewer für gespeicherte Sprachnotizen.
tooltip.cfg.voice_notes_rule=Tabellenregel: Ermöglicht das Senden und Empfangen von Sprachnotizen.
tooltip.cfg.notes_local=Ermöglicht Sprachnotizen auf Ihrem Gerät (Aufzeichnung und Wiedergabe).
tooltip.cfg.tts=Ermöglicht das Vorlesen von Tisch-Chat-Nachrichten. Jeder Spieler kann die Text-zu-Sprache-Funktion auf seinem Gerät stummschalten.
tooltip.cfg.display_mode=Wählen Sie zwischen Fenster, randlosem Vollbild und exklusivem Vollbild. Gilt beim Speichern.
tooltip.cfg.compact_view=Verkleinert Chips und Karten, um mehr Tischfläche anzuzeigen. Zustände: aus, kompakt, kompakt mit kleinen Karten und auch handkompakt.
tooltip.cfg.dialog_zoom=Skaliert Dialoge und deren Text. Es kann nur vom Startbildschirm aus geändert werden. Dies gilt für den nächsten Dialog, den Sie öffnen.
tooltip.cfg.deck=Kartendeck-Design.
tooltip.cfg.table_renderer=Wählen Sie GDX oder Swing Legacy für den nächsten Tisch. Es kann während eines Spiels nicht geändert werden.
