tooltip.cfg.custom_bots=Aktiviert den benutzerdefinierten Katalog. Zuerst werden konfigurierte Profile hinzugefügt, gefolgt von Standard-Bots.
tooltip.cfg.custom_bots.only=Verhindert das Hinzufügen von Standard-Bots. Nachdem der benutzerdefinierte Katalog erschöpft ist, können keine weiteren Bots hinzugefügt werden.
tooltip.cfg.custom_bots.manage=Öffnen Sie den Manager, um Ihre Bots zu erstellen, zu bearbeiten und zu bestellen. Sie können den Schwierigkeitsgrad und den Stil wählen.
tooltip.cfg.custom_bots.row=Wählen Sie diesen Bot aus, um seinen Namen, Avatar, Schwierigkeitsgrad, Stil oder Rebuy zu bearbeiten.
tooltip.cfg.custom_bots.avatar=Wählen Sie ein gültiges Bild oder behalten Sie den offiziellen Bot-Avatar. CoronaPoker speichert eine sichere Kopie, damit sie nicht verloren geht.
tooltip.cfg.custom_bots.name=Geben Sie den sichtbaren Namen ohne $ ein. Der reservierte Marker wird automatisch hinzugefügt.
tooltip.cfg.custom_bots.difficulty=Legt die Herausforderung und die Taktiken fest, die der Bot verwendet. Easy spielt in der Freizeit, Normal verwendet eine diszipliniertere Strategie und Hard verwendet fortgeschrittene Taktiken.
tooltip.cfg.custom_bots.personality=Legt den Basisstil fest. Der Zufallsgenerator wählt es aus, wenn der Bot erstellt wird, und behält es für die aktive Sitzung. Der Bot kann seine Entscheidungen an die Situation anpassen.
gdx.settings.option_help.bot_difficulty.easy=Spielt locker und macht häufiger Fehler.
gdx.settings.option_help.bot_difficulty.medium=Verwendet eine diszipliniertere Strategie und passt Entscheidungen an die Entwicklung der Hand an.
gdx.settings.option_help.bot_difficulty.hard=Verwendet fortgeschrittenere Taktiken, wie zum Beispiel das Stehlen von Blinds oder das Ausüben von Druck, wenn ein Gegner verwundbar erscheint.
gdx.settings.option_help.custom_bot_personality.random=Wählt beim Erstellen des Bots einen Stil aus und behält ihn für die aktive Sitzung bei.
gdx.settings.option_help.custom_bot_personality.nit=Nimmt an wenigen Händen teil und wartet normalerweise auf starke Karten, bevor er Chips riskiert.
gdx.settings.option_help.custom_bot_personality.station=Neigt dazu, Einsätze zu callen und in der Hand zu bleiben. Erhöht seltener.
gdx.settings.option_help.custom_bot_personality.tag=Wählt Hände selektiv aus und neigt dazu, bei Einsätzen und Erhöhungen die Führung zu übernehmen.
gdx.settings.option_help.custom_bot_personality.lag=Spielt eine größere Auswahl an Händen und übt durch häufige Einsätze und Erhöhungen Druck aus.
gdx.settings.option_help.ante_mode.traditional=Jeder aktive Spieler zahlt ein Zehntel des Big Blind, gerundet auf den nächsten Cent.
gdx.settings.option_help.ante_mode.big_blind=Der Spieler in der Big Blind postet die gesamte Ante, was einem Big Blind entspricht.
gdx.settings.option_help.ante_mode.button=Der Spieler auf dem Button postet die gesamte Ante, was einem Big Blind entspricht.
gdx.settings.option_help.ante_mode.small_blind=Der Spieler in der Small Blind postet die gesamte Ante, was einem Big Blind entspricht.
gdx.settings.option_help.blind_unit.minutes=Das Intervall zwischen Blinds Erhöhungen wird in Spielminuten gemessen.
gdx.settings.option_help.blind_unit.hands=Blinds erhöhen sich, nachdem die angegebene Anzahl an Händen beendet ist.
gdx.settings.option_help.rebuy_cap.buy_in=Ihr maximaler Stack nach einem Rebuy basiert auf dem Buy-in des Spiels.
gdx.settings.option_help.rebuy_cap.highest_stack=Rebuy bis zum größten Stapel am Tisch. Die Obergrenze fällt nie unter den Standard Buy-in.
gdx.settings.option_help.rabbit.off=Nicht ausgeteilte Gemeinschaftskarten bleiben nach Ende der Hand verborgen.
gdx.settings.option_help.rabbit.free=Sie können darum bitten, nicht ausgeteilte Gemeinschaftskarten zu sehen, nachdem die Hand endet, ohne Chips zu bezahlen.
gdx.settings.option_help.rabbit.free_small_blind=Ihre erste Anfrage für das Spiel ist kostenlos. Jede spätere Anfrage kostet einen Small Blind.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Ihre erste Anfrage für das Spiel ist kostenlos, die zweite kostet einen Small Blind und spätere Anfragen kosten einen Big Blind.
gdx.settings.option_help.window_mode.exclusive=Verwendet den Vollbildmodus des Monitors.
gdx.settings.option_help.window_mode.borderless=Füllt den Bildschirm mit einem randlosen Fenster und behält den Desktop-Anzeigemodus bei.
gdx.settings.option_help.window_mode.windowed=Öffnet CoronaPoker in einem Fenster, das Sie verschieben und in der Größe ändern können.
gdx.settings.option_help.fps_limit.fixed=Legt eine feste maximale Bildrate fest. Eine niedrigere Obergrenze kann den Stromverbrauch reduzieren.
gdx.settings.option_help.fps_limit.monitor=Passt die Bildratenobergrenze an die Bildwiederholfrequenz des Monitors an, auf dem das Spiel angezeigt wird.
gdx.settings.option_help.msaa.0=Deaktiviert Multisample-Anti-Aliasing für die Tabelle und die Schnittstelle. Erfordert einen Neustart.
gdx.settings.option_help.msaa.2=Verwendet 2 Samples pro Pixel, um Kanten bei geringem Grafikaufwand zu glätten. Erfordert einen Neustart.
gdx.settings.option_help.msaa.4=Verwendet 4 Samples pro Pixel, um Kantenglättung und Grafikkosten auszugleichen. Erfordert einen Neustart.
gdx.settings.option_help.msaa.8=Verwendet 8 Samples pro Pixel für die stärkste Glättung, die diese Einstellung bietet. Erfordert einen Neustart.
gdx.settings.value.balanced=Ausgewogen
gdx.settings.option_help.card_rendering.balanced=Trilinear mipmaps, AF 16×
gdx.settings.option_help.card_rendering.native=Zieht Karten direkt, um die Renderkosten zu senken.
gdx.settings.option_help.card_rendering.smooth=Verwendet einen zusätzlichen Filter, um Kartenkanten bei höheren Grafikkosten zu glätten.
tooltip.cfg.custom_bots.automatic_rebuy=Lässt diesen benutzerdefinierten Bot Rebuy zu, nachdem ihm die Chips ausgegangen sind. Die globale automatische Rebuy-Steuerung muss aktiviert sein.
tooltip.cfg.custom_bots.order_up=Verschiebt das ausgewählte Profil um eine Position nach oben. Die Liste folgt ihm, wenn ein Bildlauf erforderlich ist.
tooltip.cfg.custom_bots.order_down=Verschiebt das ausgewählte Profil um eine Position nach unten. Die Liste folgt ihm, wenn ein Bildlauf erforderlich ist.
tooltip.cfg.custom_bots.random_selection=Mischt den Katalog einmal, wenn eine Lobby erstellt wird. Jeder benutzerdefinierte Bot kann nur einmal teilnehmen und die Auswahl bleibt für diese Lobby stabil.
tooltip.cfg.custom_bots.new=Bereitet ein neues Profil vor, ohne die bereits gespeicherten Bots zu ändern.
tooltip.cfg.custom_bots.save=Fügt das neue Profil hinzu oder speichert die am ausgewählten Bot vorgenommenen Änderungen.
tooltip.cfg.custom_bots.delete=Entfernt das ausgewählte Profil nach Aufforderung zur Bestätigung.
tooltip.cfg.custom_bots.close=Schließt den Manager. Gespeicherte Profile und deren Reihenfolge bleiben automatisch erhalten.
