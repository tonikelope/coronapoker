tooltip.cfg.table_felt=Tischfilzfarbe.
tooltip.cfg.nivel_luz=Wie viel Helligkeit (%) der Tisch bei ausgeschaltetem Licht behält, unabhängig davon, ob Sie es selbst ausschalten oder ob es von selbst ausgeht (Pause, Spielende). Je niedriger es ist, desto dunkler sieht es aus. Standardmäßig 35 %.
