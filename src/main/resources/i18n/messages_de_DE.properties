zero_trust.fatal_incident_body=CoronaPoker lehnte einen authentifizierten kritischen Zustand ab und stoppte die Tabelle, bevor fortgefahren wurde. Bestätigen Sie diese Warnung, um die betroffene Tabelle zu schließen.\n\nZero Trust-Beweis: {0}
