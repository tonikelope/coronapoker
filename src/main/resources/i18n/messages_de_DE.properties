gdx.settings.tooltip.show_cpu_memory=Zeigt Java CPU und Speichernutzung an.
gdx.settings.tooltip.gpu_renderer=Zeigt den vom Spiel verwendeten Grafikadapter und OpenGL-Treiber an.
gdx.settings.tooltip.audio_output=Wählt das Gerät aus, das zum Abspielen von Spielaudio verwendet wird.
