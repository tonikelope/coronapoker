zero_trust.read_binary_log_failure=[ZERO-TRUST] Das Lesen des Binärprotokolls ist fehlgeschlagen.
zero_trust.rejecting_master_key=\ud83d\udd12 [LOCKDOWN] Master Key Share-Übertragung an den Server wird abgelehnt.
zero_trust.rejecting_street_token=\ud83d\udd12 [LOCKDOWN] Street-Token-Anfrage vom Server wird abgelehnt.
zero_trust.replay_queue_synced=\u2714\ufe0f [ZERO-TRUST] Wiedergabewarteschlange synchronisiert ({0} Signaturen).
