gdx.settings.tooltip.animation_seats=Animiert das Eintreten und Neuanordnen von Sitzplätzen rund um den Tisch.
gdx.settings.tooltip.animation_sort_hand=Animiert Ihre Karten, wenn sie sortiert werden.
gdx.settings.tooltip.animation_final_count=Animiert die Gewinn- und Verlustzählung, wenn das Spiel endet.
