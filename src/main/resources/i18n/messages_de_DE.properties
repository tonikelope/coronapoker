gdx.settings.tooltip.pot_player_count=Zeigt an, wie viele Spieler noch in der Hand agieren können. Ausgenommen sind gefoldete Spieler, All-Ins, Zuschauer und Spieler beim Aufwärmen. Der Zähler wird bei Null ausgeblendet.
