gdx.settings.tooltip.animation_chips=Animiert fliegende Chips beim Setzen und Einsammeln des Pots.
gdx.settings.tooltip.animation_reseat=Animiert die Neuordnung des Tisches, wenn ein Spieler geht.
gdx.settings.tooltip.animation_shuffle_cascade=Zeigt die verteilte Mischbewegung zwischen den Spielern.
gdx.settings.tooltip.auto_fullscreen=Wechselt automatisch in den Vollbildmodus, wenn die Tabelle startet und der ausgewählte Fenstermodus dies zulässt.
gdx.settings.tooltip.vsync=Synchronisiert Bilder mit dem Monitor, um Tearing zu verhindern. Es kann FPS senken und die Latenz erhöhen.
gdx.settings.tooltip.fps_limit=Großbuchstaben FPS. „Monitoraktualisierungsrate“ folgt Ihrer Anzeige. Höhere Bildraten verbrauchen mehr Strom.
gdx.settings.tooltip.msaa=Glättet geometrische Kanten in der Szene. Mehr Proben erhöhen die GPU-Last. Gilt nach dem Neustart.
gdx.settings.tooltip.card_rendering=„Glätten“ wendet einen zusätzlichen Filter auf Kartenkanten an. Native zieht die Karten direkt. Ausgewogen, Trilinear mipmaps, AF 16×
