zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Binäres Protokoll in den Speicher geladen ({0} Signaturen bereit für synchronisierte Wiedergabe).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Die kryptografische Shuffle-Kaskade ist fehlgeschlagen. Die Hand wurde abgesagt.
zero_trust.unlock_failed=\u274c [ZERO-TRAUST] Private Karten konnten nicht entsperrt werden (ein Spieler hat nicht rechtzeitig geantwortet). Die Hand wurde abgesagt.
zero_trust.card_resolve_failed=\u274c [NULL-VERTRAUEN] Eine entschlüsselte Karte stimmt mit keiner gültigen Karte im Deck überein. Das Spiel wurde abgesagt.
peer.not_enough_players=Ein Spieler ist während des Mischens ausgestiegen und es sind nicht mehr genügend Spieler vorhanden, um die Hand auszuteilen.
peer.unlock_no_testament=Ein Spieler hat die Verbindung getrennt, ohne seinen Entschlüsselungsschlüssel hinterlassen zu haben. Die Hand wurde abgesagt.
peer.broadcast_failed=Netzwerkfehler beim Senden privater Karten. Die Hand wurde abgesagt.
peer.recovery_action_data_unavailable=Der gespeicherte Aktionsverlauf konnte nicht gelesen werden. Die Hand wurde sicher abgebrochen und wird zur Genesung zurückkehren.
straddle.deferred_release_failed=Die Karten Blinds Straddle konnten nicht aufgedeckt werden (ein Spieler hat die Verbindung getrennt oder die Zusammenarbeit verweigert). Die Hand wurde abgesagt.
peer.state_inconsistent=Der Händlerstatus wurde inkonsistent. Die Hand wurde abgesagt.
peer.bot_no_token=Ein Bot hat seinen Entschlüsselungsschlüssel nicht bereit. Die Hand wurde abgesagt.
peer.community_unlock_no_testament=Ein Spieler hat die Verbindung getrennt, ohne seinen Schlüssel abzugeben, um Gemeinschaftskarten aufzudecken. Die Hand wurde abgesagt.
peer.dropped_during_cascade=Ein Spieler hat während des kryptografischen Mischens des Decks die Verbindung getrennt. Die Hand wurde abgesagt.
peer.dropped_during_rotation=Ein Spieler hat während der kryptografischen Rotation des Decks die Verbindung getrennt. Die Hand wurde abgesagt.
zero_trust.rotation_refused=Ein verbundener Spieler weigerte sich, seinen Deck-Rotationsschlüssel abzugeben. Das Spiel wird unterbrochen. Sie müssen ihre Weigerung, erneut aufgenommen zu werden, begründen.
zero_trust.cascade_refused=Ein verbundener Spieler weigerte sich, an der Deck-Shuffle-Kaskade teilzunehmen. Das Spiel wird unterbrochen. Sie müssen ihre Weigerung, erneut aufgenommen zu werden, begründen.
zero_trust.pocket_unlock_refused=Ein verbundener Spieler weigerte sich, seinen Schlüssel zum Entschlüsseln der Taschenkarten abzugeben. Das Spiel wird unterbrochen. Sie müssen ihre Weigerung, erneut aufgenommen zu werden, begründen.
zero_trust.community_unlock_refused=Ein verbundener Spieler weigerte sich, seinen Schlüssel abzugeben, um Gemeinschaftskarten aufzudecken. Das Spiel wird unterbrochen. Sie müssen ihre Weigerung, erneut aufgenommen zu werden, begründen.
zero_trust.host_showdown_sig_missing=Vom Server wurde ein Showdown-Schlüssel OHNE die kryptografische Signatur des Autors oder mit einer fehlerhaften Signatur empfangen. Möglicherweise ersetzt der Server den Schlüssel auf dem Kabel.
zero_trust.host_showdown_sig_invalid=Vom Server wurde ein Showdown-Schlüssel mit einer UNGÜLTIGEN kryptografischen Signatur empfangen. Möglicherweise ersetzt der Server den Schlüssel auf dem Kabel.
zero_trust.host_potcards_mismatch=Der vom Server gesendete Showdown-Klartext stimmt NICHT mit dem Ergebnis der Entschlüsselung Ihres lokalen Stücks mit dem signierten Schlüssel überein. Der Server sendet möglicherweise gefälschte Karten um Showdown.
zero_trust.host_community_garbage=Die vom Server empfangenen kryptografischen Community-Card-Daten sind inkonsistent (das Stück wird nicht in eine gültige Deckkarte entschlüsselt oder stimmt nicht mit der signierten Ankündigung des Servers überein). Mögliche Ursachen: ein FEHLER in einer Version der Software, eine Serverversion, deren Code möglicherweise geändert wurde, oder eine Beschädigung des lokalen Identitätsschlüssels. Der Kunde kann den Unterschied nicht erkennen und beschuldigt niemanden.
zero_trust.host_unlock_out_of_order=Vom Server wurde eine Entschlüsselungsanforderung außerhalb der Reihenfolge empfangen (falsche Straße, wiederholter Slot, Phase außerhalb der Reihenfolge oder Anforderung, die vor der Schließung der vorherigen Straße gestellt wurde).
zero_trust.host_cascade_mid_hand=Während einer laufenden Hand wurde vom Server eine Shuffle-Neustartanforderung empfangen (würde meinen Entschlüsselungsschlüssel überschreiben).
zero_trust.host_pocket_extraction=Vom Server wurde eine Entschlüsselungsanfrage empfangen, die IHRE EIGENEN Privatkarten betreffen würde.
zero_trust.host_community_extraction=Vom Server wurde eine Entschlüsselungsanfrage empfangen, die eine Gemeinschaftskarte vorzeitig enthüllen würde.
zero_trust.host_rotation_replay=Der Server forderte eine zweite Kartenrotation in derselben Hand. Die legitime Rotation ist pro Hand einzigartig. Eine Wiederholung deutet auf einen Versuch hin, mit Ihrem Client die Karten anderer Spieler zu entschlüsseln.
zero_trust.host_shuffle_proof_failed=Die Deal-Überprüfung schlug fehl: Es konnte nicht nachgewiesen werden, dass es sich bei dem Deck, das der Server austeilte, um eine ehrliche Mischung des Genesis-Decks handelte. Community-Freischaltungen wurden abgelehnt und diese Sitzung wird beendet, um private Karten zu schützen.
zero_trust.host_shuffle_proof_missing=Der Deal kam ohne einen nachweisbaren Ehrlichkeitsbeweis für das Deck dieser Hand zustande, und nun werden Gemeinschaftskarten aufgedeckt. Es kann sich um einen Fehler oder eine Netzwerkverzögerung handeln oder um einen Host, der versucht, den Deal zu manipulieren. Sie können weiterspielen, es wird jedoch dringend empfohlen, diesen Tisch zu verlassen.
zero_trust.deck_unverified=Das Deck dieser Hand konnte NICHT als ehrliches Mischen verifiziert werden. VERDÄCHTIGER: Moderator „{0}“, der den Shuffle-Beweis verteilt und sendet. Möglicherweise hat der Gastgeber den Deal manipuliert oder ein Spieler hat seinen Beweis zurückgehalten. Die Hand wird ausgespielt, da die Karten bereits ausgeteilt wurden.
zero_trust.deck_unverified_body=Es wurden unterzeichnete Beweise für diese Anomalie aufgezeichnet (im Spielprotokoll, in Rot und in der Tabelle der umstrittenen Hände). Sie können weiterspielen, aber wenn Sie dem Gastgeber nicht vertrauen, verlassen Sie den Tisch.
zero_trust.seat_redraw=Der Gastgeber „{0}“ erzwang eine NEUE Sitzauslosung. Das ist UNGEWÖHNLICH: Die Auslosung ist kollektiv und überprüfbar, sodass der Gastgeber die Sitze nicht auswählen kann, aber er KANN erneut würfeln, bis er eine Vereinbarung trifft, die ihm gefällt. Wenn es sich wiederholt, versucht der Gastgeber möglicherweise, Ihren Sitz zu manipulieren.
zero_trust.seat_redraw_body=Die neue Auslosung verlief nach dem gleichen Schema und ist immer noch nachweisbar: Niemand, auch der Gastgeber nicht, kann über den Ausgang entscheiden. Es kann vorkommen, dass ein Spieler gleich zu Beginn ausscheidet. Wenn Sie jedoch mehrere Wiederholungsversuche sehen und dem Gastgeber nicht vertrauen, verlassen Sie den Tisch. Es wurde protokolliert.
zero_trust.seat_recover_mismatch=Bei der Spielwiederherstellung stimmt die vom Gastgeber „{0}“ gesendete Sitzordnung NICHT mit der von Ihrem Kunden gespeicherten überein: Jemand, den Sie bereits kannten, hat den Platz am Tisch gewechselt. Möglicherweise versucht ein Gastgeber, die Sitze unter dem Deckmantel der Erholung neu zu bestellen.
zero_trust.seat_recover_mismatch_body=Ihr Kunde hat die Sitzplatzreferenz beibehalten, die er zu Beginn selbst überprüft hat. Es ist normal, dass Spieler zwischendurch ein- oder aussteigen. Jemanden neu zu ordnen, der bereits dort war, ist nicht möglich. Wenn Sie dem Gastgeber nicht vertrauen, verlassen Sie den Tisch. Es wurde protokolliert.
zero_trust.host_recover_action_forged=Der Host hat versucht, während der Spielwiederherstellung eine FORGED-Aktion (ungültige Signatur) einzuschleusen. Ihr Mandant hat dies abgelehnt.
zero_trust.host_recover_action_omitted=Während der Wiederherstellung hat der Host eine Aktion ausgelassen, die SIE ausgeführt und in Ihrer lokalen Datenbank aufgezeichnet haben. Ihr Client hat es anhand seiner eigenen Kopie erkannt und Ihre Aktion NICHT stillschweigend verworfen.
zero_trust.host_recover_balance_mismatch=Der Host hat während der Spielwiederherstellung versucht, Ihr Guthaben (Chips/Buy-in) zu ändern: Es stimmt nicht mit Ihrem lokalen Eintrag überein. Ihr Kunde hat IHR wahres Gleichgewicht bewahrt.
zero_trust.host_board_peek=Der Gastgeber forderte die Entschlüsselung einer Gemeinschaftskarte aus einer ZUKÜNFTIGEN Straße (ein Versuch, die Tafel frühzeitig zu lesen). Ihr Mandant lehnte ab.
zero_trust.suspect_host_prefix=VERDÄCHTLICH: Host „{0}“.
zero_trust.suspect_peer_prefix=VERDÄCHTIGER: Spieler „{0}“.
zero_trust.peer_alert=⚠️ [ANOMALES SPIELERVERHALTEN]
zero_trust.peer_suspicious_header=An Ihrem Tisch wurde ungewöhnliches oder missbräuchliches Verhalten eines Spielers festgestellt:\n
zero_trust.peer_suspicious_body=Der Tisch wendet die entsprechende Sicherheitsmaßnahme an und das Spiel geht für die anderen Spieler weiter. Treu und Glauben wird vorausgesetzt. Es könnte sich um einen Softwarefehler handeln, und niemand wird beschuldigt. Die Beweise werden protokolliert.
zero_trust.peer_inbound_flood=Anhaltender authentifizierter Datenverkehr über dem Anti-DoS-Schwellenwert.
zero_trust.peer_binary_flood=Sprachnachrichtenvorgänge werden mit ungewöhnlich hoher Rate gesendet.
zero_trust.host_binary_flood=Der Host sendet Sprachnachrichtenvorgänge mit ungewöhnlich hoher Geschwindigkeit.
zero_trust.peer_flood_log=Anti-DoS-Vorfall wartet auf Entscheidung: Spieler {0}, IP {1}. Grund: {2}
zero_trust.peer_flood_confirm=Benutzer {0} sendet übermäßig viel Datenverkehr. Dies könnte ein DoS-Angriff oder ein Fehler sein. Sie aus dem Spiel ausschließen?\n\nIP: {1}\nErkannter Grund: {2}
zero_trust.peer_flood_suppress=Diese Warnungen nicht anzeigen
zero_trust.peer_hand_ready_withheld=Ein Spieler antwortet auf PING, bestätigt aber nicht, dass er für die nächste Hand bereit ist, während das Spiel läuft. Es hat den Handstart blockiert und wurde AUSGESCHLOSSEN. Das Spiel geht ohne sie weiter.
zero_trust.peer_action_withheld=Ein Spieler antwortet auf PING, sendet seine Wettaktion jedoch nicht, während das Spiel läuft und seine Bedenkzeit überschritten ist. Es fror die Runde ein und wurde AUSGESCHLOSSEN. Das Spiel geht ohne sie weiter.
zero_trust.peer_conf_withheld=Ein Spieler antwortet auf PING, bestätigt aber nicht den Empfang einer Dealing-Nachricht, während das Spiel läuft. Es blockierte das Vorrücken des Tisches und wurde AUSGESCHLOSSEN. Das Spiel geht ohne sie weiter.
zero_trust.peer_deal_refusal_expelled=Ein Spieler erzwang den Abbruch mehrerer Hände hintereinander, indem er das Mischen oder Drehen des Decks verweigerte. Es wurde AUSGESCHLOSSEN, damit das Spiel fortgesetzt werden kann.
zero_trust.suspicious_alert=⚠️ [ANOMALES SERVERVERHALTEN]
zero_trust.suspicious_header=Ihr Client hat ein anormales Serververhalten festgestellt (kein kritischer Vorfall, der das Spiel einfriert):\n
zero_trust.suspicious_body=Ihr Client hat den anomalen Vorgang abgelehnt und das Spiel KANN fortgesetzt werden. Wir gehen von Treu und Glauben aus: Es könnte sich um einen Software-BUG (Client oder Server) handeln und niemand wird beschuldigt. Da sich ein Fehler jedoch nicht von einer Manipulation unterscheiden lässt, wird ZU IHRER SICHERHEIT DRINGEND EMPFOHLEN, diesen Tisch über die Schaltfläche „Verlassen“ zu verlassen (Ihr Geld wird in dieser Hand NICHT verarbeitet).
zero_trust.host_bad_wire=Vom Server wurde eine Entschlüsselungsanforderung mit einem ungültigen Format oder Punkten empfangen, die nicht zur kryptografischen Kurve gehören.
zero_trust.host_critical_command_invalid=Der vom Server gesendete kritische Befehl {0} konnte nicht validiert werden. Dies kann eine Inkompatibilität, ein Fehler oder ein geänderter Server sein. Die Sitzung wird gestoppt, um ihre Integrität zu schützen.
zero_trust.cheater_detected=[NULL-VERTRAUEN] Ein Spieler mit einer modifizierten CoronaPoker-Version wurde erkannt, was darauf hindeutet, dass er möglicherweise versucht zu betrügen. Möchten Sie fortfahren?
zero_trust.corrupted_mac_action=Der Server hat versucht, eine Aktion mit einer ungültigen kryptografischen Signatur (beschädigter MAC) im Namen von Folgendem zu verarbeiten:
zero_trust.critical=\u274c [ZERO-VERTRAUEN] KRITISCHER ALARM: UNGÜLTIGE SIGNATUR ODER GEBROCHENER KONSENS.
zero_trust.critical_alert_body=QUARANTÄNESTATUS AKTIVIERT:\nIhr Client wird in dieser Sitzung KEINE weiteren kryptografischen Schlüssel an den Server senden.\nDas Spiel ist mathematisch eingefroren, um Ihr Guthaben zu schützen.\n\nDie MÖGLICHEN Ursachen sind:\n – ein FEHLER im Client-Code selbst,\n – ein FEHLER im Servercode, oder\n – ein SERVER, dessen Code möglicherweise geändert wurde.\n\nDer Kunde kann nicht zwischen ihnen unterscheiden und es wird KEIN Vorwurf impliziert. Aus Sicherheitsgründen und bis zur Überprüfung der Grundursache wird EMPFOHLEN, dass Sie dieses Spiel mit der Schaltfläche „Beenden“ VERLASSEN (Ihr Geld wird in dieser Hand NICHT verarbeitet).
zero_trust.critical_alert_header=NULL-VERTRAUENSFALL!\n\nIhr Client hat eine Anomalie im kryptografischen Protokoll festgestellt:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITISCHER SITZUNGSFEHLER
zero_trust.decrypting_street=[ZERO-TRUST] STRASSE ENTSCHLÜSSELN...
zero_trust.wait_deal=Wir warten auf die Beiträge der Spieler zum Mischen und Austeilen.
zero_trust.wait_shuffle_proof=Wir warten auf den kryptografischen Nachweis für das Mischen.
zero_trust.wait_sra_unlock=Wir warten auf die SRA-Schlüssel zum Aufdecken von {0}.
game.settlement_verification_wait=Wir warten auf die Bestätigungen, um die Hand und die Guthaben zu prüfen.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [NULL-VERTRAUEN] Schnelle Konsens-Zeitüberschreitung. Aufstieg erzwingen.
zero_trust.forged_identity_action=Der Server hat versucht, eine Aktion mit einer gefälschten Identitätssignatur im Namen von:
zero_trust.game_aborted=[ZERO-TRUST] Spiel abgebrochen. Tritt den Betrügern den Garaus.
zero_trust.generating_kem=[ZERO-VERTRAUEN] KEM (P2P) GENERIEREN...
zero_trust.invalid_mac=\u26a0\ufe0f [ZERO-TRUST ALERT] Ungültiger MAC auf Gemeinschaftskarten. Mögliche Manipulation.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] CONSENSUS CRYPTOGRAPHIC VERIFICATION: ALLE SPIELER HABEN ZERTIFIZIERT, DASS SIE IHRE LOKALE HAND-KRYPTOGRAPHISCHE VERIFIZIERUNG BESTANDEN HABEN.
zero_trust.legit2_error=\u274c [ZERO-TRUST] CONSENSUS CRYPTOGRAPHIC VERIFICATION: MINDESTENS EIN SPIELER HAT NICHT ZERTIFIZIERT, DIE LOKALE HAND-KRYPTOGRAPHISCHE VERIFIZIERUNG ZU BESTANDEN.
zero_trust.legit=\u2714\ufe0f [ZERO-VERTRAUEN] LOKALE HANDKRYPTOGRAFISCHE ÜBERPRÜFUNG: MEINE KARTEN, COMMUNITY-KARTEN UND ALLE AUFGEZEICHNETEN AKTIONEN SIND RECHTLICH.
zero_trust.legit_error=\u274c [ZERO-TRUST] LOKALE HANDKRYPTOGRAFISCHE ÜBERPRÜFUNG: ES KANN NICHT SICHERGESTELLT WERDEN, DASS MEINE KARTEN, COMMUNITY-KARTEN UND ALLE AUFGEZEICHNETEN AKTIONEN RECHTLICH SIND.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Quarantäne aktiviert. Blockieren der Übertragung kryptografischer Schlüssel.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Kein vorheriges Binärprotokoll für diese Hand.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: SPEICHER ÜBERPRÜFEN...
zero_trust.p2p_cheater_detected2=[NULL-VERTRAUEN] Ein Spieler mit einer modifizierten CoronaPoker-Version wurde erkannt, was darauf hindeutet, dass er möglicherweise versucht zu betrügen.
zero_trust.p2p_finished_resuming=P2P-KEM-Überprüfung abgeschlossen. Wiederaufnahme der Hand...
zero_trust.p2p_generating_challenges=[ZERO-TRUST] P2P: HERAUSFORDERUNGEN SCHAFFEN...
zero_trust.p2p_timeout=P2P-Schwarm-Timeout! Einige Spieler wurden als unzuverlässig markiert.
