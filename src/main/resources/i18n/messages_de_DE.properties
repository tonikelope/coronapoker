gdx.settings.tooltip.confirm_actions=Fordert vor wichtigen manuellen Aktionen eine Bestätigung an.
gdx.settings.tooltip.auto_rebuy=Kauft sich automatisch wieder ein, wenn Sie keine Chips mehr haben und Rebuys sind erlaubt.
gdx.settings.tooltip.shortcut=Wählen Sie die Zeile aus und drücken Sie dann die Taste, die Sie dieser Aktion zuweisen möchten.
gdx.settings.tooltip.rebuy_cap=Wählt aus, ob die Chipobergrenze nach einer Rebuy auf der Buy-in oder dem größten Stapel am Tisch basiert.
