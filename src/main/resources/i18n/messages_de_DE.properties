game.showdown_forfeit_msg=HINWEIS: Die Showdown-Überprüfung ist für die folgenden Spieler fehlgeschlagen und ihre Karten werden NICHT aufgedeckt:\n\n%nicks%\n\nDiese Spieler sind vom Showdown-Widerstand (Auto-Fold) ausgeschlossen und KÖNNEN diesen Pot NICHT gewinnen. Das Spiel läuft normal weiter.
zero_trust.peer_sra_corrupt=Die Showdown-Signatur ist echt, aber der SRA-Schlüssel des Peers lässt sich nicht in gültige Karten auflösen. Dies geschieht nur, wenn der Peer absichtlich einen beschädigten Schlüssel signiert hat oder sein Client fehlerhaft ist. Wir können nicht sagen, welches, und aus Sicherheitsgründen beenden wir das Spiel.
zero_trust.straddle_recover_mismatch=Während er die Hand wiedererlangte, verkündete der Moderator ein Straddle, das sich von dem unterschied, das Ihre eigene lokale Kopie aufgezeichnet hatte. Dies geschieht nur, wenn der Host das wiederhergestellte Straddle manipuliert oder sein Client fehlerhaft ist. Die Hand wird immer noch aus Ihrer vertrauenswürdigen Kopie rekonstruiert, wir warnen Sie jedoch vorsichtshalber.
zero_trust.rit_recover_mismatch=Während er die Hand wiedererlangte, verkündete der Moderator ein Run-it-twice-Ergebnis, das sich von dem unterscheidet, das Ihre eigene lokale Kopie aufgezeichnet hatte. Dies geschieht nur, wenn der Host das wiederhergestellte Ergebnis manipuliert oder sein Client fehlerhaft ist. Die Hand wird immer noch aus Ihrer vertrauenswürdigen Kopie rekonstruiert, wir warnen Sie jedoch vorsichtshalber.
zero_trust.peer_sra_corrupt_registro=\u2014 Showdown Schlüssel signiert, aber nicht in Karten auflösbar. Möglicher Cheat oder Client-Fehler.
