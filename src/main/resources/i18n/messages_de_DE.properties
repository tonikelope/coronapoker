gdx.settings.tooltip.blind_cap_level=Die maximale Anzahl von Blinds steigt vom Startlevel an.
gdx.settings.tooltip.rebuy=Ermöglicht Spielern, während des Spiels weitere Chips zu kaufen, bis zu einer Obergrenze von Rebuy.
