game.mano_verificacion_divergente=⚠ ΑΠΟΚΛΙΣΗ ΚΡΥΠΤΟΓΡΑΦΙΚΗΣ ΕΠΑΛΗΘΕΥΣΗΣ. Ένας ή περισσότεροι συμμετέχοντες ανέφεραν διαφορετική τελική κατάσταση χεριού. Απόδειξη: {0}
