tooltip.cfg.ante=Προσθέτει μια αναγκαστική συνεισφορά στο pot μετά το blind. Η λειτουργία καθορίζει ποιος πληρώνει και πόσα.
tooltip.cfg.ante_mode=Στην παραδοσιακή λειτουργία, κάθε ενεργός παίκτης πληρώνει το 10% των big blind. Στο BBA, BA ή SBA, το κουμπί big blind, ή small blind πληρώνει ένα big blind. Blind δημοσιεύονται πρώτα.
tooltip.cfg.blind_cap=Σταματά blind αυξάνεται στο διαμορφωμένο όριο.
tooltip.cfg.blinds_level=Έναρξη blind (μικρό/μεγάλο) για το παιχνίδι.
tooltip.cfg.bot_balance=Όταν τελειώσει το παιχνίδι, το συνδυασμένο υπόλοιπο των bots μοιράζεται εξίσου στους ανθρώπινους παίκτες, έτσι τα πραγματικά χρήματα διακανονίζονται μόνο μεταξύ ατόμων.
tooltip.cfg.bot_rebuy=Παγκόσμιος αυτόματος έλεγχος επαναγορά για κάθε bot. Η απενεργοποίησή του απενεργοποιεί επίσης τις ρυθμίσεις επαναγορά των προσαρμοσμένων ρομπότ.
tooltip.cfg.bots=Ορίζει τη δυσκολία των τυπικών bots. Τα προσαρμοσμένα ρομπότ διατηρούν τη δυσκολία διαμορφωμένη ξεχωριστά στον Διαχειριστή ρομπότ.
tooltip.cfg.buyin_fixed=Όλοι ξεκινούν με το ίδιο ποσό εισόδου. Όταν είναι απενεργοποιημένο, οι παίκτες επιλέγουν εντός του ρυθμισμένου εύρους.
tooltip.cfg.double_blinds=Προχωρά στο επόμενο επίπεδο blind στη δομή μετά από έναν καθορισμένο αριθμό χεριών ή λεπτών.
tooltip.cfg.hand_limit=Το παιχνίδι τελειώνει όταν επιτευχθεί αυτός ο αριθμός χεριών.
tooltip.cfg.iwtsth=Σας επιτρέπει να ζητήσετε να δείτε το χέρι ενός αντιπάλου στις αποκάλυψη.
tooltip.cfg.rabbit=Αποκαλύπτει κοινές κάρτες που δεν έχουν μοιραστεί μετά το χέρι. Το πρώτο αίτημα κάθε παίκτη είναι δωρεάν. Η επιλεγμένη λειτουργία καθορίζει εάν τα μεταγενέστερα αιτήματα παραμένουν δωρεάν ή κοστίζουν ένα μικρό ή big blind.
tooltip.cfg.rebuy_limit=Μέγιστα rebuy ανά παίκτη.
tooltip.cfg.recover=Συνεχίζει ένα παιχνίδι που είχε προηγουμένως διακοπεί.
tooltip.cfg.rit=Επιτρέπει την ψήφο για να μοιραστούν τα υπόλοιπα φύλλα δύο φορές όταν ένα Όλα μέσα κλείνει το στοίχημα.
tooltip.cfg.straddle=Ο παίκτης μετά το big blind μπορεί να δημοσιεύσει δύο big blind πριν δει τα φύλλα του και να κάνει το τελευταίο preflop.
tooltip.cfg.straddle_on_timeout=Δημοσιεύστε το straddle αυτόματα όταν λήξει η προτροπή. Αυτό επηρεάζει μόνο τη συσκευή αναπαραγωγής σας και είναι απενεργοποιημένο από προεπιλογή.
tooltip.cfg.structure=Δομή επιπέδου Blind για το παιχνίδι.
tooltip.cfg.think_time=Δευτερόλεπτα διαθέσιμα για να αποφασίσετε. Η αυτόματη ενέργεια εκτελείται όταν λήξει ο χρόνος.
tooltip.cfg.showdown_time=Δευτερόλεπτα το αποτέλεσμα του χεριού παραμένει στην οθόνη πριν μοιραστεί το επόμενο χέρι.
tooltip.cfg.allow_hot_join=Επιτρέπει στους νέους παίκτες να συμμετέχουν ως WARMING UP και να εισέλθουν στο επόμενο χέρι. Όταν αλλάζει κατά τη διάρκεια ενός παιχνιδιού, επηρεάζει μόνο νέες προσπάθειες σύνδεσης.
tooltip.cfg.card_flip_duration=Ορίζει πόσο χρόνο χρειάζεται για κάθε φύλλο για να ολοκληρώσει τη σειρά του όταν αποκαλυφθεί.
tooltip.cfg.card_flip_direction=Επιλέγει με ποιον τρόπο γυρίζουν τα φύλλα όταν αποκαλύπτονται. Το Mixed επιλέγει μια κατεύθυνση για κάθε αποκάλυψη. Οι κάρτες στην ίδια ομάδα γυρίζουν μαζί με τον ίδιο τρόπο.
tooltip.cfg.reparto_velocidad=Ορίζει πόσο χρόνο χρειάζεται για κάθε κάρτα για να ταξιδέψει από την τράπουλα στη θέση της.
tooltip.cfg.community_deal_style=Επιλέξτε εάν και τα πέντε κοινά φύλλα θα μοιράζονται κλειστά στην αρχή ή θα μοιράζονται στον δικό τους δρόμο. Οι αποθηκευμένες αλλαγές ισχύουν από το επόμενο χέρι.
tooltip.cfg.anim_calidad=Η ποιότητα κρατά κάθε οπτική λεπτομέρεια. Η απόδοση μειώνει το κόστος των πτήσεων με κάρτες και αποκαλύπτει σε πιο αδύναμους υπολογιστές.
tooltip.cfg.downgrade_velocidad=Ορίζει πόσο χρόνο χρειάζεται το τραπέζι για να αναδιατάξει τις θέσεις του όταν ένας παίκτης φεύγει.
tooltip.cfg.swap_velocidad=Ορίζει πόσο χρόνο χρειάζονται για να σταυρώσουν τα φύλλα σας κατά την ταξινόμηση.
tooltip.cfg.swap_estilo=Το Arc σηκώνει το ένα φύλλο πάνω από το άλλο. Οριζόντια τα σταυρώνει στο ίδιο ύψος.
tooltip.cfg.resaltar_avatares=Αν ακουμπήσετε το ποντίκι για μια στιγμή στο avatar ενός παίκτη, το δείχνει σε μεγέθυνση πάνω από το τραπέζι, δίπλα στο όνομα και τη στοίβα του, και φεύγει όταν απομακρύνετε το ποντίκι από πάνω.
tooltip.cfg.resaltar_jugada_showdown=Κατά τη διάρκεια του αποκάλυψη, η τοποθέτηση του δείκτη του ποντικιού πάνω από το όνομα του χεριού οποιουδήποτε παίκτη (νικητής ή ηττημένος) επισημαίνει μόνο τα φύλλα που το αποτελούν και μειώνει τα υπόλοιπα.
tooltip.cfg.screenshot_fin_timba=Αποθηκεύει αυτόματα ένα στιγμιότυπο οθόνης της τελικής οθόνης όταν τελειώσει ο μετρητής χρημάτων (ή όταν τον αφήσετε, αν φύγετε νωρίτερα).
tooltip.cfg.server_ip=Διεύθυνση (IP ή τομέας) όπου ακούει ο διακομιστής του παιχνιδιού.
tooltip.cfg.server_port=Θύρα TCP από το 1 έως το 65535 που ακούει ο διακομιστής.
tooltip.cfg.upnp=Ζητάει από τον δρομολογητή σας να προωθήσει αυτήν τη θύρα TCP στον κεντρικό υπολογιστή μέχρι να κλείσει η περίοδος λειτουργίας του παιχνιδιού.
tooltip.cfg.preset=Φορτώνει ένα αποθηκευμένο προφίλ ρυθμίσεων.
tooltip.cfg.preset_save=Αποθηκεύει τις τρέχουσες ρυθμίσεις ως επαναχρησιμοποιήσιμο προφίλ.
tooltip.cfg.preset_delete=Διαγράφει το επιλεγμένο προφίλ ρυθμίσεων.
tooltip.cfg.buyin=Μάρκες με τις οποίες ξεκινάει κάθε παίκτης στο τραπέζι.
tooltip.cfg.buyin_range=Με μια μεταβλητή ποσό εισόδου, κάθε παίκτης επιλέγει το ποσό εισόδου του εντός αυτού του εύρους (σε big blind).
tooltip.cfg.volume=Συνολικός όγκος παιχνιδιού.
tooltip.cfg.sound_master=Ενεργοποιεί ή απενεργοποιεί τη μουσική, τα ηχητικά εφέ και τον ήχο συνομιλίας. Το πρόγραμμα αναπαραγωγής βίντεο πόκερ έχει τον δικό του όγκο.
tooltip.cfg.music_master=Ενεργοποιεί ή απενεργοποιεί όλη τη μουσική.
tooltip.cfg.fx_master=Ενεργοποιεί ή απενεργοποιεί όλα τα ηχητικά εφέ.
tooltip.cfg.game_start_sound=Παίζει τον ήχο έναρξης όταν ξεκινά ή ανακτάται ένα παιχνίδι.
tooltip.cfg.music_surface=Ενεργοποιεί τη μουσική για αυτήν την οθόνη ή τη στιγμή. Το κουμπί αναπαραγωγής το κάνει προεπισκόπηση χωρίς να φύγει από τις Ρυθμίσεις.
tooltip.cfg.recovery_music=Ενεργοποιεί τη μουσική που αναπαράγεται ενώ ανακτάται ένα παιχνίδι που έχει διακοπεί.
tooltip.cfg.silly_sounds=Ενεργοποιεί τους ήχους αστείου που μπορεί να παίζουν κατά τη διάρκεια του παιχνιδιού.
gdx.settings.tooltip.mod_audio_override=Χρησιμοποιείται η έκδοση που παρέχεται από το φορτωμένο MOD.
tooltip.cfg.play_own_notes=Επίσης, αναπαράγει τις δικές σας φωνητικές σημειώσεις όταν τις στέλνετε.
tooltip.cfg.notes_retention=Ρυθμίζει τη διάρκεια διατήρησης των φωνητικών σημειώσεων. Με το "Forever", διαγράφονται μόνο χειροκίνητα.
tooltip.cfg.purge_notes=Διαγράφει όλες τις αποθηκευμένες φωνητικές σημειώσεις αυτήν τη στιγμή.
tooltip.cfg.view_notes=Ανοίγει το πρόγραμμα προβολής για αποθηκευμένες φωνητικές σημειώσεις.
tooltip.cfg.voice_notes_rule=Κανόνας πίνακα: επιτρέπει την αποστολή και λήψη φωνητικών σημειώσεων.
tooltip.cfg.notes_local=Ενεργοποιεί φωνητικές σημειώσεις στο μηχάνημά σας (εγγραφή και αναπαραγωγή).
tooltip.cfg.tts=Επιτρέπει την ανάγνωση μηνυμάτων επιτραπέζιας συνομιλίας. Κάθε παίκτης μπορεί να κάνει σίγαση της μετατροπής κειμένου σε ομιλία στη συσκευή του.
tooltip.cfg.display_mode=Επιλέξτε μεταξύ πλήρους οθόνης με παράθυρα, χωρίς περιθώρια και αποκλειστικής πλήρους οθόνης. Ισχύει για αποθήκευση.
tooltip.cfg.compact_view=Συρρικνώνει τις μάρκες και τις κάρτες για να εμφανίζει περισσότερο τραπέζι. Καταστάσεις: off, compact, compact με μικρές κάρτες, και επίσης το δικό σας compact.
tooltip.cfg.dialog_zoom=Κλιμακώνει τους διαλόγους και το κείμενό τους. Μπορεί να αλλάξει μόνο από την οθόνη έναρξης. Ισχύει για το επόμενο παράθυρο διαλόγου που ανοίγετε.
tooltip.cfg.deck=Σχεδιασμός τράπουλας.
tooltip.cfg.table_renderer=Επιλέξτε GDX ή Swing Legacy για το επόμενο τραπέζι. Δεν μπορεί να αλλάξει κατά τη διάρκεια ενός παιχνιδιού.
tooltip.cfg.table_renderer_cli=Η απόδοση αναγκάζεται για αυτήν την εκτέλεση από τη γραμμή εντολών.
tooltip.cfg.deck_back=Σχέδιο πλάτης κάρτας.
tooltip.cfg.table_felt=Χρώμα τσόχας τραπεζιού.
tooltip.cfg.nivel_luz=Πόση φωτεινότητα (%) διατηρεί ο πίνακας με τα φώτα σβηστά, είτε τα σβήνετε μόνοι σας είτε σβήνουν μόνα τους (παύση, τέλος παιχνιδιού). Όσο πιο χαμηλά είναι, τόσο πιο σκούρο φαίνεται. 35% από προεπιλογή.
tooltip.change_avatar=Κάντε κλικ για να αλλάξετε το avatar (δεξί κλικ για να επαναφέρετε το προεπιλεγμένο)
