game.showdown_forfeit_msg=ΕΙΔΟΠΟΙΗΣΗ: Η επαλήθευση αποκάλυψη απέτυχε για τους ακόλουθους παίκτες και τα χαρτιά τους ΔΕΝ θα αποκαλυφθούν:\n\n%nicks%\n\nΑυτοί οι παίκτες αποκλείονται από την αντίσταση αποκάλυψη (Αυτόματο πάσο NNCAOT αυτή τη νίκη και NNCAOT win) Το παιχνίδι συνεχίζεται κανονικά.
zero_trust.peer_sra_corrupt=Η υπογραφή αποκάλυψη είναι γνήσια, αλλά το κλειδί SRA του ομοτίμου δεν μετατρέπεται σε έγκυρες κάρτες. Αυτό συμβαίνει μόνο εάν ο ομότιμος υπέγραψε σκόπιμα ένα κατεστραμμένο κλειδί ή ο πελάτης του είναι λάθη. Δεν μπορούμε να πούμε ποιο και για ασφάλεια τελειώνουμε το παιχνίδι.
zero_trust.straddle_recover_mismatch=Κατά την ανάκτηση του χεριού, ο οικοδεσπότης ανακοίνωσε ένα straddle διαφορετικό από αυτό που είχε ηχογραφήσει το δικό σας τοπικό αντίγραφο. Αυτό συμβαίνει μόνο εάν ο κεντρικός υπολογιστής παραβιάσει το ανακτημένο straddle ή ο πελάτης του είναι buggy. Το χέρι εξακολουθεί να ανακατασκευάζεται από το αξιόπιστο αντίγραφό σας, αλλά σας προειδοποιούμε προληπτικά.
zero_trust.rit_recover_mismatch=Κατά την ανάκτηση του χεριού, ο οικοδεσπότης ανακοίνωσε ένα run-it-twice αποτέλεσμα διαφορετικό από αυτό που είχε καταγράψει το δικό σας τοπικό αντίγραφο. Αυτό συμβαίνει μόνο εάν ο κεντρικός υπολογιστής παραβιάσει το αποτέλεσμα που ανακτήθηκε ή ο πελάτης του είναι λάθη. Το χέρι εξακολουθεί να ανακατασκευάζεται από το αξιόπιστο αντίγραφό σας, αλλά σας προειδοποιούμε προληπτικά.
zero_trust.peer_sra_corrupt_registro=Το κλειδί \u2014 αποκάλυψη είναι υπογεγραμμένο, αλλά δεν μετατρέπεται σε κάρτες. Πιθανή εξαπάτηση ή σφάλμα πελάτη.
