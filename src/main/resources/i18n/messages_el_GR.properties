peer.broadcast_failed=Σφάλμα δικτύου κατά τη μετάδοση ιδιωτικών καρτών. Το χέρι έχει ακυρωθεί.
peer.recovery_action_data_unavailable=Δεν ήταν δυνατή η ανάγνωση του αποθηκευμένου ιστορικού ενεργειών. Το χέρι έχει ακυρωθεί με ασφάλεια και θα επιστρέψει στην ανάκαμψη.
straddle.deferred_release_failed=Δεν ήταν δυνατή η αποκάλυψη των φύλλων blind straddle (ένας παίκτης αποσυνδέθηκε ή αρνήθηκε να συνεργαστεί). Το χέρι έχει ακυρωθεί.
peer.state_inconsistent=Το κράτος του αντιπροσώπου έγινε ασυνεπές. Το χέρι έχει ακυρωθεί.
peer.bot_no_token=Ένα bot δεν έχει έτοιμο το κλειδί αποκρυπτογράφησης του. Το χέρι έχει ακυρωθεί.
peer.community_unlock_no_testament=Ένας παίκτης αποσυνδέθηκε χωρίς να αφήσει το κλειδί του για να αποκαλύψει τις κοινές κάρτες. Το χέρι έχει ακυρωθεί.
peer.dropped_during_cascade=Μια συσκευή αναπαραγωγής που αποσυνδέθηκε κατά τη διάρκεια της κρυπτογραφικής τυχαίας αναπαραγωγής στο κατάστρωμα. Το χέρι έχει ακυρωθεί.
peer.dropped_during_rotation=Μια συσκευή αναπαραγωγής που αποσυνδέθηκε κατά τη διάρκεια της κρυπτογραφικής περιστροφής της τράπουλας. Το χέρι έχει ακυρωθεί.
zero_trust.rotation_refused=Ένας συνδεδεμένος παίκτης αρνήθηκε να του παραδώσει το κλειδί περιστροφής στο κατάστρωμα. Το παιχνίδι διακόπτεται. Θα χρειαστεί να αιτιολογήσουν την άρνησή τους να γίνουν εκ νέου δεκτοί.
zero_trust.cascade_refused=Ένας συνδεδεμένος παίκτης αρνήθηκε να συμμετάσχει στον καταρράκτη τυχαίας αναπαραγωγής στο κατάστρωμα. Το παιχνίδι διακόπτεται. Θα χρειαστεί να αιτιολογήσουν την άρνησή τους να γίνουν εκ νέου δεκτοί.
zero_trust.pocket_unlock_refused=Ένας συνδεδεμένος παίκτης αρνήθηκε να παραδώσει το κλειδί του για να αποκρυπτογραφήσει τις κάρτες τσέπης. Το παιχνίδι διακόπτεται. Θα χρειαστεί να αιτιολογήσουν την άρνησή τους να γίνουν εκ νέου δεκτοί.
zero_trust.community_unlock_refused=Ένας συνδεδεμένος παίκτης αρνήθηκε να παραδώσει το κλειδί του για να αποκαλύψει τις κοινές κάρτες. Το παιχνίδι διακόπτεται. Θα χρειαστεί να αιτιολογήσουν την άρνησή τους να γίνουν εκ νέου δεκτοί.
zero_trust.host_showdown_sig_missing=Λήφθηκε ένα κλειδί αποκάλυψη από τον διακομιστή ΧΩΡΙΣ την κρυπτογραφική υπογραφή του συγγραφέα ή με λανθασμένη υπογραφή. Ο διακομιστής μπορεί να αντικαθιστά το κλειδί στο καλώδιο.
zero_trust.host_showdown_sig_invalid=Λήφθηκε ένα κλειδί αποκάλυψη από τον διακομιστή με ΜΗ ΕΓΚΥΡΗ κρυπτογραφική υπογραφή. Ο διακομιστής μπορεί να αντικαθιστά το κλειδί στο καλώδιο.
zero_trust.host_potcards_mismatch=Το απλό κείμενο αποκάλυψη που αποστέλλεται από τον διακομιστή ΔΕΝ ΣΥΜΦΩΝΕΙ με το αποτέλεσμα της αποκρυπτογράφησης του τοπικού σας κομματιού με το υπογεγραμμένο κλειδί. Ο διακομιστής ενδέχεται να στέλνει ψεύτικες κάρτες στο αποκάλυψη.
zero_trust.host_community_garbage=Τα κρυπτογραφικά δεδομένα της κάρτας κοινότητας που λαμβάνονται από τον διακομιστή είναι ασυνεπή (το κομμάτι δεν αποκρυπτογραφείται σε έγκυρη κάρτα καταστρώματος ή δεν ταιριάζει με την υπογεγραμμένη ανακοίνωση του διακομιστή). Πιθανές αιτίες: ΣΦΑΛΜΑ σε κάποια έκδοση του λογισμικού, έκδοση διακομιστή της οποίας ο κωδικός μπορεί να έχει τροποποιηθεί ή καταστροφή του τοπικού κλειδιού ταυτότητας. Ο πελάτης δεν μπορεί να πει τη διαφορά και ΔΕΝ κατηγορεί κανέναν.
zero_trust.host_unlock_out_of_order=Έχει ληφθεί ένα αίτημα αποκρυπτογράφησης από τον διακομιστή χωρίς σειρά (λάθος δρόμος, επαναλαμβανόμενη υποδοχή, σταδιακή εκτός λειτουργίας ή αίτημα που εκδόθηκε πριν από το κλείσιμο της προηγούμενης οδού).
zero_trust.host_cascade_mid_hand=Έχει ληφθεί ένα αίτημα επανεκκίνησης τυχαίας αναπαραγωγής από τον διακομιστή στη μέση ενός συνεχόμενου χεριού (θα αντικαταστήσει το κλειδί αποκρυπτογράφησης μου).
zero_trust.host_pocket_extraction=Έχει ληφθεί ένα αίτημα αποκρυπτογράφησης από τον διακομιστή που θα επηρεάσει τις ΔΙΚΕΣ ΣΑΣ ιδιωτικές κάρτες.
zero_trust.host_community_extraction=Έχει ληφθεί ένα αίτημα αποκρυπτογράφησης από τον διακομιστή που θα αποκάλυπτε μια κάρτα κοινότητας εκ των προτέρων.
zero_trust.host_rotation_replay=Ο διακομιστής ζήτησε μια δεύτερη εναλλαγή κάρτας στο ίδιο χέρι. Η νόμιμη περιστροφή είναι μοναδική ανά χέρι. Μια επανάληψη προτείνει μια προσπάθεια να χρησιμοποιήσετε τον πελάτη σας για την αποκρυπτογράφηση των καρτών άλλων παικτών.
zero_trust.host_shuffle_proof_failed=Η επαλήθευση της συμφωνίας απέτυχε: η τράπουλα που μοίρασε ο διακομιστής δεν μπορούσε να αποδειχθεί ότι ήταν μια ειλικρινής ανακάτεμα της γέφυρας. Τα ξεκλειδώματα κοινότητας απορρίφθηκαν και αυτή η περίοδος σύνδεσης τερματίζεται για την προστασία των ιδιωτικών καρτών.
zero_trust.host_shuffle_proof_missing=Η συμφωνία έφτασε χωρίς επαληθεύσιμη ειλικρινή απόδειξη για την τράπουλα αυτού του χεριού και τα κοινά φύλλα αποκαλύπτονται τώρα. Μπορεί να είναι ένα σφάλμα ή μια καθυστέρηση δικτύου ή ένας κεντρικός υπολογιστής που προσπαθεί να χειραγωγήσει τη συμφωνία. Μπορείτε να συνεχίσετε να παίζετε, αλλά συνιστάται ανεπιφύλακτα να φύγετε από αυτό το τραπέζι.
zero_trust.deck_unverified=Η τράπουλα αυτού του χεριού ΔΕΝ μπορούσε να επαληθευτεί ως ειλικρινής ανακάτεμα. ΥΠΟΠΤΟΣ: οικοδεσπότης "{0}", ο οποίος ασχολείται και μεταδίδει την απόδειξη τυχαίας αναπαραγωγής. Μπορεί να είναι ο οικοδεσπότης που χειραγωγεί τη συμφωνία ή κάποιος παίκτης που απέκρυψε την απόδειξη του. Το χέρι παίζεται επειδή τα φύλλα έχουν ήδη μοιραστεί.
zero_trust.deck_unverified_body=Υπογεγραμμένα στοιχεία αυτής της ανωμαλίας έχουν καταγραφεί (στο αρχείο καταγραφής του παιχνιδιού, με κόκκινο χρώμα και στον πίνακα αμφισβητούμενων χεριών). Μπορείτε να συνεχίσετε να παίζετε, αλλά αν δεν εμπιστεύεστε τον οικοδεσπότη, αφήστε το τραπέζι.
zero_trust.seat_redraw=Ο οικοδεσπότης "{0}" ανάγκασε μια ΝΕΑ κλήρωση θέσεων. Αυτό είναι ΑΣΥΝΗΘΙΣΤΟ: η κλήρωση είναι συλλογική και επαληθεύσιμη, επομένως ο οικοδεσπότης δεν μπορεί να επιλέξει τις θέσεις, αλλά ΜΠΟΡΕΙ να επαναφέρει μέχρι να πάρει τη ρύθμιση που του αρέσει. Εάν επαναληφθεί, μπορεί να είναι ο οικοδεσπότης που προσπαθεί να βάλει τη θέση σας.
zero_trust.seat_redraw_body=Η νέα κλήρωση διεξήχθη με τον ίδιο τρόπο και εξακολουθεί να είναι επαληθεύσιμη: κανείς, συμπεριλαμβανομένου του οικοδεσπότη, δεν μπορεί να επιλέξει το αποτέλεσμα. Μπορεί να συμβεί εάν ένας παίκτης έπεσε αμέσως στην αρχή, αλλά αν δείτε πολλές επαναλήψεις και δεν εμπιστεύεστε τον οικοδεσπότη, αφήστε το τραπέζι. Έχει καταγραφεί.
zero_trust.seat_recover_mismatch=Κατά την ανάκτηση του παιχνιδιού, η σειρά θέσεων που αποστέλλεται από τον οικοδεσπότη "{0}" ΔΕΝ ταιριάζει με αυτή που είχε αποθηκεύσει ο πελάτης σας: κάποιος που ήδη γνωρίζετε έχει αλλάξει θέση στο τραπέζι. Μπορεί να είναι ένας οικοδεσπότης που προσπαθεί να αναδιατάξει τις θέσεις υπό την κάλυψη της ανάκτησης.
zero_trust.seat_recover_mismatch_body=Ο πελάτης σας κράτησε την αναφορά θέσεων που επαλήθευσε ο ίδιος στην αρχή. Η συμμετοχή ή η αποχώρηση παικτών στο ενδιάμεσο είναι φυσιολογικό. Η αναδιάταξη κάποιου που ήταν ήδη εκεί δεν είναι. Εάν δεν εμπιστεύεστε τον οικοδεσπότη, αφήστε το τραπέζι. Έχει καταγραφεί.
zero_trust.host_recover_action_forged=Ο οικοδεσπότης προσπάθησε να κάνει ένεση ΠΛΑΣΤΗΡΙΑΣΜΕΝΗΣ ενέργειας (μη έγκυρη υπογραφή) κατά την ανάκτηση του παιχνιδιού. Ο πελάτης σας το αρνήθηκε.
zero_trust.host_recover_action_omitted=Κατά την ανάκτηση, ο κεντρικός υπολογιστής παρέλειψε μια ενέργεια που ΕΣΕΙΣ παίξατε και είχατε καταγράψει στην τοπική σας βάση δεδομένων. Ο πελάτης σας το εντόπισε σε σχέση με το δικό του αντίγραφο και ΔΕΝ απέσυρε σιωπηλά την ενέργειά σας.
zero_trust.host_recover_balance_mismatch=Ο οικοδεσπότης προσπάθησε να αλλάξει το υπόλοιπό σας (μάρκες/ποσό εισόδου) κατά την ανάκτηση του παιχνιδιού: δεν ταιριάζει με το τοπικό σας ρεκόρ. Ο πελάτης σας κράτησε την πραγματική σας ισορροπία.
zero_trust.host_board_peek=Ο οικοδεσπότης ζήτησε να αποκρυπτογραφηθεί μια κάρτα κοινότητας από έναν ΜΕΛΛΟΝΤΙΚΟ δρόμο (μια προσπάθεια να διαβάσει τον πίνακα νωρίς). Ο πελάτης σας αρνήθηκε.
zero_trust.suspect_host_prefix=ΥΠΟΠΤΟ: φιλοξενεί "{0}".
zero_trust.suspect_peer_prefix=ΥΠΟΠΤΟΣ: παίκτης "{0}".
zero_trust.peer_alert=⚠️ [ΑΝΩΜΑΤΙΚΗ ΣΥΜΠΕΡΙΦΟΡΑ ΠΑΙΚΤΩΝ]
zero_trust.peer_suspicious_header=Έχει εντοπιστεί ανώμαλη ή καταχρηστική συμπεριφορά από έναν παίκτη στο τραπέζι σας:\n
zero_trust.peer_suspicious_body=Ο πίνακας εφάρμοσε το αντίστοιχο μέτρο ασφαλείας και το παιχνίδι συνεχίζεται για τους άλλους παίκτες. Η καλή πίστη τεκμαίρεται. Θα μπορούσε να είναι σφάλμα λογισμικού και κανείς δεν κατηγορείται. Τα στοιχεία καταγράφονται.
zero_trust.peer_inbound_flood=Διαρκής έλεγχος ταυτότητας της κυκλοφορίας πάνω από το όριο anti-DoS.
zero_trust.peer_binary_flood=Οι λειτουργίες φωνητικών μηνυμάτων αποστέλλονται με ασυνήθιστα υψηλό ρυθμό.
zero_trust.host_binary_flood=Ο οικοδεσπότης στέλνει λειτουργίες φωνητικών μηνυμάτων με ασυνήθιστα υψηλό ρυθμό.
zero_trust.peer_flood_log=Περιστατικό Anti-DoS εν αναμονή απόφασης: player {0}, IP {1}. Αιτία: {2}
zero_trust.peer_flood_confirm=Ο χρήστης {0} στέλνει υπερβολικό όγκο επισκεψιμότητας. Αυτό μπορεί να είναι επίθεση DoS ή σφάλμα. Αποβολή τους από το παιχνίδι; \n\nIP: {1}\nΑιτία που εντοπίστηκε: {2}
zero_trust.peer_flood_suppress=Μην εμφανίζετε αυτές τις προειδοποιήσεις
zero_trust.peer_hand_ready_withheld=Ένας παίκτης απαντά PING αλλά δεν επιβεβαιώνει την ετοιμότητα για το επόμενο χέρι ενώ το παιχνίδι τρέχει. Ήταν παγωμένο η εκκίνηση με το χέρι και έχει ΕΔΙΩΘΕΙ. Το παιχνίδι συνεχίζεται χωρίς αυτούς.
zero_trust.peer_action_withheld=Ένας παίκτης απαντά σε PING, αλλά δεν στέλνει τη στοιχηματική του ενέργεια ενώ το παιχνίδι τρέχει, αφού έχει περάσει ο χρόνος σκέψης του. Ήταν παγωμένος ο γύρος και έχει ΕΔΙΩΘΕΙ. Το παιχνίδι συνεχίζεται χωρίς αυτούς.
zero_trust.peer_conf_withheld=Ένας παίκτης απαντά PING αλλά δεν επιβεβαιώνει τη λήψη ενός μηνύματος δοσοληψίας ενώ το παιχνίδι εκτελείται. Εμπόδιζε το τραπέζι να προχωρήσει και ΕΔΙΩΘΗΚΕ. Το παιχνίδι συνεχίζεται χωρίς αυτούς.
zero_trust.peer_deal_refusal_expelled=Ένας παίκτης ανάγκασε πολλές διαδοχικές ακυρώσεις χεριών, αρνούμενος την ανακατεύθυνση ή την περιστροφή της τράπουλας. ΕΧΕΙ ΕΔΙΩΘΕΙ για να συνεχιστεί το παιχνίδι.
zero_trust.suspicious_alert=⚠️ [ΑΝΩΜΑΤΙΚΗ ΣΥΜΠΕΡΙΦΟΡΑ ΣΕΡΒΕΡ]
zero_trust.suspicious_header=Ο πελάτης σας έχει εντοπίσει ανώμαλη συμπεριφορά διακομιστή (όχι κρίσιμο περιστατικό που παγώνει το παιχνίδι):\n
zero_trust.suspicious_body=Ο πελάτης σας απέρριψε την ανώμαλη λειτουργία και το παιχνίδι ΜΠΟΡΕΙ να συνεχιστεί. Υποθέτουμε καλή πίστη: αυτό θα μπορούσε να είναι σφάλμα λογισμικού (πελάτης ή διακομιστής) και κανείς δεν κατηγορείται. Επειδή όμως ένα σφάλμα δεν μπορεί να εντοπιστεί εκτός από παραβίαση, ΓΙΑ ΤΗΝ ΑΣΦΑΛΕΙΑ ΣΑΣ ΣΥΝΙΣΤΑΤΑΙ ΑΝΕΠΙΦΥΛΑΚΤΑ ΝΑ ΦΥΓΕΤΕ από αυτόν τον πίνακα χρησιμοποιώντας το κουμπί "Αποχώρηση" (τα χρήματά σας ΔΕΝ θα υποβληθούν σε επεξεργασία σε αυτό το χέρι).
zero_trust.host_bad_wire=Έχει ληφθεί ένα αίτημα αποκρυπτογράφησης από τον διακομιστή με μη έγκυρη μορφή ή σημεία που δεν ανήκουν στην κρυπτογραφική καμπύλη.
zero_trust.host_critical_command_invalid=Δεν ήταν δυνατή η επικύρωση της κρίσιμης εντολής {0} που στάλθηκε από τον διακομιστή. Αυτό μπορεί να είναι ασυμβατότητα, σφάλμα ή τροποποιημένος διακομιστής. Η συνεδρία διακόπτεται για προστασία της ακεραιότητάς της.
zero_trust.cheater_detected=[ZERO-TRUST] Εντοπίστηκε ένας παίκτης με τροποποιημένη έκδοση CoronaPoker, υποδηλώνοντας ότι μπορεί να προσπαθεί να εξαπατήσει. Θέλετε να συνεχίσετε;
zero_trust.corrupted_mac_action=Ο διακομιστής προσπάθησε να επεξεργαστεί μια ενέργεια με μη έγκυρη κρυπτογραφική υπογραφή (κατεστραμμένο MAC) εκ μέρους:
zero_trust.critical=\u274c [ZERO-TRUST] ΚΡΙΤΙΚΗ ΠΡΟΕΙΔΟΠΟΙΗΣΗ: ΑΚΥΡΗ ΥΠΟΓΡΑΦΗ Ή ΚΑΤΑΣΚΕΥΑΣΜΕΝΗ ΣΥΝΟΨΗ.
zero_trust.critical_alert_body=ΕΝΕΡΓΟΠΟΙΗΣΗ ΚΑΤΑΣΤΑΣΗΣ ΚΑΡΑΝΤΙΝΗΣ:\nΟ πελάτης σας ΔΕΝ ΘΑ στείλει άλλα κρυπτογραφικά κλειδιά στον διακομιστή σε αυτήν την περίοδο λειτουργίας.\nΤο παιχνίδι είναι μαθηματικά παγωμένο για να προστατεύσει την ισορροπία σας.\n\nΟΙ ΠΙΘΑΝΕΣ Αιτίες είναι:\n  - ένα ΣΦΑΛΜΑ στον ίδιο τον κωδικό πελάτη,\n  - ένα ΣΦΑΛΜΑ στον κώδικα διακομιστή ή\n  - έναν SERVER του οποίου ο κωδικός μπορεί να έχει αλλάξει.\n\nΟ πελάτης δεν μπορεί να διακρίνει μεταξύ τους και ΔΕΝ υπονοείται κατηγορία. Για ασφάλεια και εν αναμονή της εξέτασης της βασικής αιτίας, ΣΥΝΙΣΤΑΤΑΙ να ΑΠΟΧΩΡΗΣΕΤΕ αυτό το παιχνίδι χρησιμοποιώντας το κουμπί 'Έξοδος' (τα χρήματά σας ΔΕΝ θα υποβληθούν σε επεξεργασία σε αυτό το χέρι).
zero_trust.critical_alert_header=ΠΕΡΙΣΤΑΤΙΚΟ ΜΗΔΕΝΙΚΗΣ ΕΜΠΙΣΤΟΣΥΝΗΣ!\n\nΟ πελάτης σας εντόπισε μια ανωμαλία στο κρυπτογραφικό πρωτόκολλο:\n
zero_trust.critical_session_error=[ZERO-TRUST] ΣΦΑΛΜΑ ΚΡΙΣΙΜΟΥ ΣΥΝΕΔΡΙΟΥ
zero_trust.decrypting_street=[ZERO-TRUST] ΟΔΟΣ ΑΠΟΚΡΥΠΤΩΣΗΣ...
zero_trust.wait_deal=Περιμένουμε τη συνεισφορά των παικτών για το ανακάτεμα και τη μοιρασιά.
zero_trust.wait_shuffle_proof=Περιμένουμε την κρυπτογραφική απόδειξη του ανακατέματος.
zero_trust.wait_sra_unlock=Περιμένουμε τα κλειδιά SRA για να ανοίξει το {0}.
game.settlement_verification_wait=Περιμένουμε τις επιβεβαιώσεις για να επαληθεύσουμε την παρτίδα και τα υπόλοιπα.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Fast Consensus Timeout. Αναγκαστική πρόοδος.
zero_trust.forged_identity_action=Ο διακομιστής προσπάθησε να επεξεργαστεί μια ενέργεια με πλαστό υπογραφή ταυτότητας εκ μέρους:
zero_trust.game_aborted=[ZERO-TRUST] Το παιχνίδι ματαιώθηκε. Κλωτσήστε τους απατεώνες.
zero_trust.generating_kem=[ZERO-TRUST] ΔΗΜΙΟΥΡΓΙΑ KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ZERO-TRUST ALERT] Μη έγκυρο MAC σε κοινές κάρτες. Πιθανή χειραγώγηση.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] CONSENSUS CRYPTOGRAPHIC VERIFICATION: ΟΛΟΙ ΟΙ ΠΑΙΚΤΕΣ ΕΧΟΥΝ ΠΙΣΤΟΠΟΙΗΘΕΙ ΠΕΡΙΣΤΩΣΗ ΤΗΣ ΤΟΠΙΚΗΣ ΚΡΥΠΤΟΓΡΑΦΙΚΗΣ ΕΠΑΛΗΘΕΥΣΗΣ ΤΟΥ ΧΕΡΙΟΥ.
zero_trust.legit2_error=\u274c [ZERO-TRUST] ΣΥΝΟΨΗ ΚΡΥΠΤΟΓΡΑΦΙΚΗ ΕΠΑΛΗΘΕΥΣΗ: ΤΟΥΛΑΧΙΣΤΟΝ ΕΝΑΣ ΠΑΙΚΤΗΣ ΔΕΝ ΕΧΕΙ ΠΙΣΤΟΠΟΙΗΘΕΙ ΠΕΡΙΣΤΩΣΗ ΤΗΣ ΤΟΠΙΚΗΣ ΚΡΥΠΤΟΓΡΑΦΙΚΗΣ ΕΠΑΛΗΘΕΥΣΗΣ ΤΟΥ ΧΕΡΙΟΥ.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] ΤΟΠΙΚΗ ΚΡΥΠΤΟΓΡΑΦΙΚΗ ΕΠΑΛΗΘΕΥΣΗ ΧΕΡΙΟΥ: ΟΙ ΚΑΡΤΕΣ ΜΟΥ, ΟΙ ΚΑΡΤΕΣ ΚΟΙΝΟΤΗΤΑΣ ΚΑΙ ΟΛΕΣ ΟΙ ΚΑΤΑΓΡΑΦΕΙΣ ΕΝΕΡΓΕΙΕΣ ΜΟΥ ΕΙΝΑΙ ΝΟΜΙΜΕΣ.
zero_trust.legit_error=\u274c [ZERO-TRUST] ΤΟΠΙΚΗ ΕΠΑΛΗΘΕΥΣΗ ΚΡΥΠΤΟΓΡΑΦΙΚΗΣ ΧΕΡΙΟΥ: ΔΕΝ ΜΠΟΡΩ ΝΑ ΔΙΑΣΦΑΛΙΣΩ ΟΤΙ ΟΙ ΚΑΡΤΕΣ, ΟΙ ΚΑΡΤΕΣ ΚΟΙΝΟΤΙΚΗΣ ΜΟΥ ΚΑΙ ΟΛΕΣ ΟΙ ΚΑΤΑΓΡΑΦΕΙΣ ΕΝΕΡΓΕΙΕΣ ΜΟΥ ΕΙΝΑΙ ΝΟΜΙΜΕΣ.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Η καραντίνα ενεργοποιήθηκε. Μπλοκάρισμα μετάδοσης κρυπτογραφικών κλειδιών.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Δεν υπάρχει προηγούμενο δυαδικό αρχείο καταγραφής για αυτό το χέρι.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: ΜΝΗΜΗ ΕΛΕΓΧΟΥ...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] Εντοπίστηκε ένας παίκτης με τροποποιημένη έκδοση CoronaPoker, υποδηλώνοντας ότι μπορεί να προσπαθεί να εξαπατήσει.
zero_trust.p2p_finished_resuming=Η επαλήθευση P2P KEM ολοκληρώθηκε. Συνέχιση του χεριού...
zero_trust.p2p_generating_challenges=[ZERO-TRUST] P2P: ΔΗΜΙΟΥΡΓΙΑ ΠΡΟΚΛΗΣΕΩΝ...
zero_trust.p2p_timeout=P2P Swarm Timeout! Ορισμένοι παίκτες επισημάνθηκαν ως αναξιόπιστοι.
zero_trust.p2p_verifying_signatures=[ZERO-TRUST] P2P: ΕΠΑΛΗΘΕΥΣΗ ΥΠΟΓΡΑΦΩΝ...
zero_trust.read_binary_log_failure=[ZERO-TRUST] Απέτυχε η ανάγνωση του δυαδικού αρχείου καταγραφής.
zero_trust.rejecting_master_key=\ud83d\udd12 [LOCKDOWN] Απόρριψη της μετάδοσης κοινής χρήσης κύριου κλειδιού στον διακομιστή.
zero_trust.rejecting_street_token=\ud83d\udd12 [LOCKDOWN] Απόρριψη αιτήματος Street Token από τον διακομιστή.
zero_trust.replay_queue_synced=\u2714\ufe0f [ZERO-TRUST] Η ουρά επανάληψης συγχρονίστηκε ({0} υπογραφές).
zero_trust.security_alert=\u26a0\ufe0f [ΕΙΔΟΠΟΙΗΣΗ ΑΣΦΑΛΕΙΑΣ]
zero_trust.evidence_location=Αποδεικτικά στοιχεία μηδενικής εμπιστοσύνης: {0}
zero_trust.fatal_incident_title=ΠΕΡΙΣΤΑΤΙΚΟ ΜΗΔΕΝΙΚΗΣ ΕΜΠΙΣΤΟΣΥΝΗΣ
zero_trust.fatal_incident_body=Το CoronaPoker απέρριψε μια επικυρωμένη κρίσιμη κατάσταση και σταμάτησε το τραπέζι πριν συνεχίσει. Επιβεβαιώστε αυτήν την προειδοποίηση για να κλείσετε τον πίνακα που επηρεάζεται.\n\nΑπόδειξη μηδενικής εμπιστοσύνης: {0}
zero_trust.qa_pre_settlement_fault=Η κρυπτογραφική συμφωνία απορρίφθηκε πριν από τη διευθέτηση.
zero_trust.qa_lockdown_fault=Η επικυρωμένη κατάσταση κεντρικού υπολογιστή απέτυχε στην κρυπτογραφική επικύρωση.
zero_trust.session_generated=\u2714\ufe0f [ZERO-TRUST] Δημιουργήθηκε νέα περίοδος λειτουργίας και αποθηκεύτηκε στο δίσκο.
zero_trust.session_restored=\u2714\ufe0f [ZERO-TRUST] Το κλειδί περιόδου λειτουργίας επαναφέρθηκε με επιτυχία.
zero_trust.timeout=\u274c [ZERO-TRUST] TIME OUT (ΕΠΙΚΥΡΩΣΗ ΧΕΙΡΙΟΥ ΠΑΡΑΚΛΗΨΗΣ)
zero_trust.timeout_community_cards=\u274c [ZERO-TRUST] Χρονικό όριο αναμονής για κοινές κάρτες.
zero_trust.verifying_integrity=[ZERO-TRUST] Επαλήθευση της ακεραιότητας του παιχνιδιού...
