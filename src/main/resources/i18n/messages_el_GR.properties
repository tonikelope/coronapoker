tooltip.cfg.custom_bots=Ενεργοποιεί τον προσαρμοσμένο κατάλογο. Τα διαμορφωμένα προφίλ προστίθενται πρώτα και ακολουθούν τα τυπικά bots.
tooltip.cfg.custom_bots.only=Αποτρέπει την προσθήκη τυπικών ρομπότ. Δεν μπορούν να προστεθούν άλλα bots μετά την εξάντληση του προσαρμοσμένου καταλόγου.
tooltip.cfg.custom_bots.manage=Ανοίξτε τον διαχειριστή για να δημιουργήσετε, να επεξεργαστείτε και να παραγγείλετε τα bot σας. Μπορείτε να επιλέξετε τη δυσκολία και το στυλ τους.
tooltip.cfg.custom_bots.row=Επιλέξτε αυτό το bot για να επεξεργαστείτε το όνομα, το avatar, τη δυσκολία, το στυλ ή το επαναγορά.
tooltip.cfg.custom_bots.avatar=Επιλέξτε μια έγκυρη εικόνα ή διατηρήστε το επίσημο avatar του bot. Το CoronaPoker αποθηκεύει ένα ασφαλές αντίγραφο για να μην χαθεί.
tooltip.cfg.custom_bots.name=Εισαγάγετε το ορατό όνομα χωρίς $. Ο δεσμευμένος δείκτης προστίθεται αυτόματα.
tooltip.cfg.custom_bots.difficulty=Ορίζει την πρόκληση και τις τακτικές που χρησιμοποιεί το bot. Το Easy παίζει ψυχαγωγικά, το Normal χρησιμοποιεί μια πιο πειθαρχημένη στρατηγική και ο Hard χρησιμοποιεί προηγμένες τακτικές.
tooltip.cfg.custom_bots.personality=Ορίζει το βασικό στυλ. Το επιλέγει τυχαία όταν δημιουργείται το bot και το διατηρεί για την ενεργή περίοδο λειτουργίας. Το bot μπορεί να προσαρμόσει τις αποφάσεις του στην κατάσταση.
gdx.settings.option_help.bot_difficulty.easy=Παίζει χαλαρά και κάνει λάθη πιο συχνά.
gdx.settings.option_help.bot_difficulty.medium=Χρησιμοποιεί μια πιο πειθαρχημένη στρατηγική και προσαρμόζει τις αποφάσεις καθώς αναπτύσσεται το χέρι.
gdx.settings.option_help.bot_difficulty.hard=Χρησιμοποιεί πιο προηγμένες τακτικές, όπως κλοπή blind ή άσκηση πίεσης όταν ένας αντίπαλος φαίνεται ευάλωτος.
gdx.settings.option_help.custom_bot_personality.random=Επιλέγει ένα στυλ όταν δημιουργείται το bot και το διατηρεί για την ενεργή περίοδο λειτουργίας.
gdx.settings.option_help.custom_bot_personality.nit=Μπαίνει σε λίγα χέρια και συνήθως περιμένει δυνατά φύλλα πριν ρισκάρει μάρκες.
gdx.settings.option_help.custom_bot_personality.station=Τείνει να κάνει call στοιχήματα και να παραμένει στο χέρι. Ανεβάζει λιγότερο συχνά.
gdx.settings.option_help.custom_bot_personality.tag=Επιλέγει χέρια επιλεκτικά και τείνει να παίρνει το προβάδισμα με στοιχήματα και αυξήσεις.
gdx.settings.option_help.custom_bot_personality.lag=Παίζει μεγαλύτερο εύρος χεριών και ασκεί πίεση με συχνά στοιχήματα και αυξήσεις.
gdx.settings.option_help.ante_mode.traditional=Κάθε ενεργός παίκτης δημοσιεύει το ένα δέκατο του big blind, στρογγυλοποιημένο στο πλησιέστερο σεντ.
gdx.settings.option_help.ante_mode.big_blind=Ο παίκτης στο big blind δημοσιεύει ολόκληρο το άντε, ίσο με ένα big blind.
gdx.settings.option_help.ante_mode.button=Ο παίκτης στο κουμπί δημοσιεύει ολόκληρο το άντε, ίσο με ένα big blind.
gdx.settings.option_help.ante_mode.small_blind=Ο παίκτης στο small blind δημοσιεύει ολόκληρο το άντε, ίσο με ένα big blind.
gdx.settings.option_help.rebuy_cap.buy_in=Η μέγιστη στοίβα μετά από ένα επαναγορά βασίζεται στο ποσό εισόδου του παιχνιδιού.
gdx.settings.option_help.rebuy_cap.highest_stack=Επαναγορά μέχρι τη μεγαλύτερη στοίβα στο τραπέζι. Το καπάκι δεν πέφτει ποτέ κάτω από το τυπικό ποσό εισόδου.
gdx.settings.option_help.rabbit.off=Τα κοινά φύλλα που δεν μοιράζονται παραμένουν κρυμμένα μετά το τέλος του χεριού.
gdx.settings.option_help.rabbit.free=Μπορείτε να ζητήσετε να δείτε κοινές κάρτες που δεν έχουν μοιραστεί αφού τελειώσει το χέρι χωρίς να πληρώσετε μάρκες.
gdx.settings.option_help.rabbit.free_small_blind=Το πρώτο σας αίτημα για το παιχνίδι είναι δωρεάν. Κάθε μεταγενέστερο αίτημα κοστίζει ένα small blind.
