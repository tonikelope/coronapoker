radar.cuidado_el_ejecutable_del_juego=ΠΡΟΕΙΔΟΠΟΙΗΣΗ: ΑΥΤΟΣ Ο ΠΑΙΚΤΗΣ ΜΠΟΡΕΙ ΝΑ ΠΡΟΣΠΑΘΕΙ ΝΑ ΚΑΝΕΙ ΧΡΗΣΙΜΟΠΟΙΩΝΤΑΣ ΜΙΑ ΤΡΟΠΟΠΟΙΗΜΕΝΗ ΕΚΔΟΣΗ ΤΟΥ CORONAPOKER.
radar.el_servidor_ha_activado_el=Ο διακομιστής έχει ενεργοποιήσει το anti-cheat RADAR για αυτό το παιχνίδι. Οποιοσδήποτε παίκτης μπορεί να ζητήσει μια αναφορά κατά της απάτης ενός άλλου παίκτη κατά τη διάρκεια του παιχνιδιού, η οποία περιλαμβάνει ένα στιγμιότυπο οθόνης του παίκτη (χωρίς να δείχνει τις κάρτες του) καθώς και τη λίστα διαδικασιών του συστήματός του.
radar.esta_funcionalidad_permite_a_cualquier=Αυτή η δυνατότητα επιτρέπει σε οποιονδήποτε παίκτη να λάβει ένα στιγμιότυπο οθόνης και να επεξεργαστεί τη λίστα ενός άλλου παίκτη, εάν υποψιάζεται ότι έχει εξαπατήσει ή χρησιμοποιεί λογισμικό τρίτων. Ως οικοδεσπότης, λάβετε υπόψη τις επιπτώσεις του απορρήτου προτού ενεργοποιήσετε αυτήν την επιλογή (δεν μπορεί να αλλάξει στα μέσα του παιχνιδιού).\n\nΣημείωση: αυτή η δυνατότητα εξαρτάται αρκετά από την πλατφόρμα, επομένως δεν είναι εγγυημένο ότι θα λειτουργεί τέλεια σε όλους τους πελάτες.
