ui.identicon.self_explicacion=Αυτό είναι το δημόσιο κλειδί σας. Μπορείτε να μοιραστείτε αυτήν την εικόνα ή το δεκαεξαδικό της αποτύπωμα μέσω ενός ασφαλούς εξωτερικού καναλιού (WhatsApp, Telegram, φωνή...) ώστε οι άλλοι παίκτες να μπορούν να επαληθεύσουν την ταυτότητά σας.
ui.identicon.session_explicacion=Κάθε εικονίδιο είναι το οπτικό δακτυλικό αποτύπωμα του κλειδιού AES για ένα κρυπτογραφημένο κανάλι. Και τα δύο άκρα του ίδιου καναλιού πρέπει να βλέπουν το ΙΔΙΟ εικονίδιο. Συγκρίνετε το με το άλλο πρόγραμμα αναπαραγωγής μέσω ενός ασφαλούς εξωτερικού καναλιού όπως φωνή, WhatsApp ή Telegram. Εάν ταιριάζει, κανείς δεν παρεμποδίζει τη σύνδεση. Εάν διαφέρει, υπάρχει ένας μεσάζων στο δίκτυο και θα πρέπει να αποσυνδεθείτε.
ui.identity.load_error=Δεν ήταν δυνατή η φόρτωση ή η δημιουργία της κρυπτογραφικής ταυτότητας για αυτό το ψευδώνυμο.\n\nΤεχνικές λεπτομέρειες: {0}\n\nΔεν μπορεί να εισαχθεί ένα δικτυωμένο παιχνίδι χωρίς σταθερή ταυτότητα. Ελέγξτε τα δικαιώματα καταλόγου χρήστη και δοκιμάστε ξανά.
