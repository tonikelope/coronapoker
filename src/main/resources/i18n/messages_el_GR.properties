game.mano_verificacion_firma_invalida=⚠ Σημείωση: Το {0} εντόπισε μη έγκυρη κρυπτογραφική υπογραφή κατά τη διάρκεια αυτού του χεριού. Το ασφαλές κλείσιμο διακόπηκε. Απόδειξη: {1}
game.popup_verificacion_firma_invalida=Κατά τη διάρκεια αυτού του χεριού, ένας ή περισσότεροι συμμετέχοντες ({0}) εντόπισε μια μη έγκυρη κρυπτογραφική υπογραφή σε μια ενέργεια.\n\nΤα δεδομένα που ελήφθησαν από όλους τους συμμετέχοντες ήταν συνεπή (ταίριαξαν οι κατακερματισμοί της τελικής αλυσίδας), αλλά τουλάχιστον μία ενέργεια δεν είχε υπογραφεί σωστά από τον αναμενόμενο συντάκτη της.\n\nΤο CoronaPoker σταμάτησε το ασφαλές κλείσιμο των χεριών και θα κλείσει το τραπέζι ως αποτυχία ασφαλείας αφού αναγνωριστεί αυτή η προειδοποίηση.\n\nΑποδεικτικά στοιχεία που αποθηκεύτηκαν σε:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Σημείωση: Το {0} δεν έλαβε την απόδειξη ειλικρινούς ανακατέματος για αυτό το χέρι. Απόδειξη: {1}
game.popup_verificacion_host_sin_prueba=Ένας ή περισσότεροι συμμετέχοντες ({0}) δεν έλαβε την ειλικρινή ανακατεύθυνση απόδειξη για αυτό το χέρι.\n\nΟι τελικοί κατακερματισμοί της αλυσίδας ταιριάζουν σε όλους τους συμμετέχοντες, επομένως οι ενέργειες των χεριών είναι συνεπείς. Ένας σωστός κεντρικός υπολογιστής στέλνει πάντα αυτήν την απόδειξη, επομένως μια επαναλαμβανόμενη ή επιλεκτική απουσία μπορεί να υποδηλώνει τροποποιημένο λογισμικό ή ελάττωμα λογισμικού.\n\nΤο χέρι διευθετήθηκε, αλλά συνιστάται η έξοδος από το παιχνίδι ως προληπτικό μέτρο.\n\nΑποδεικτικά στοιχεία που αποθηκεύτηκαν σε:\n{1}
game.popup_verificacion_titulo_alerta=Απόκλιση κρυπτογραφικής επαλήθευσης
game.popup_verificacion_titulo_aviso=Η κρυπτογραφική επαλήθευση δεν έχει ολοκληρωθεί
game.popup_verificacion_divergente=Ένας ή περισσότεροι συμμετέχοντες ανέφεραν διαφορετική κρυπτογραφική επαλήθευση της τελικής κατάστασης του χεριού.\n\nΑυτό μπορεί να οφείλεται σε τροποποιημένο λογισμικό ή σε ελάττωμα λογισμικού. CoronaPoker δεν μπορεί να προσδιορίσει αυτόματα την αιτία ή ποιος την προκάλεσε.\n\nΤο CoronaPoker σταμάτησε το ασφαλές κλείσιμο των χεριών και θα κλείσει το τραπέζι ως αποτυχία ασφαλείας αφού αναγνωριστεί αυτή η προειδοποίηση.\n\nΑποδεικτικά στοιχεία που αποθηκεύτηκαν σε:\n{0}
game.popup_verificacion_ausente=Το τελευταίο χέρι δεν μπόρεσε να επιτύχει συναίνεση επειδή ο παίκτης {0} δεν έστειλε υπογραφή κλεισίματος.\n\nΑυτό μπορεί να οφείλεται σε διακοπή δικτύου, αποτυχία πελάτη ή τροποποιημένο λογισμικό. CoronaPoker σταμάτησε το ασφαλές κλείσιμο με το χέρι και θα κλείσει το τραπέζι ως αποτυχία ασφαλείας μετά την αναγνώριση αυτής της προειδοποίησης.\n\nΤα αποδεικτικά στοιχεία αποθηκεύτηκαν σε:\n{1}
game.mano_verificacion_interrumpida=ΚΡΙΣΙΜΟ: Το ασφαλές κλείσιμο με το χέρι απέτυχε ({0}). Ο πίνακας θα κλείσει ως αποτυχία ασφαλείας. Απόδειξη: {1}
game.popup_verificacion_interrumpida=Το CoronaPoker δεν μπόρεσε να ολοκληρώσει το πρωτόκολλο κρυπτογραφικού κλεισίματος για το τελευταίο χέρι.\n\nΑποτυχία: {0}\n\nΤο χέρι παραμένει ανοιχτό για ανάκτηση. Ο πίνακας θα κλείσει ως αποτυχία ασφαλείας μόνο μετά την επιβεβαίωση αυτής της προειδοποίησης.\n\nΤα αποδεικτικά στοιχεία αποθηκεύτηκαν σε:\n{1}
