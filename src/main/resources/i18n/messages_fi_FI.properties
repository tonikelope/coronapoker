zero_trust.wait_shuffle_proof=Odotetaan sekoituksen kryptografista todistetta.
zero_trust.wait_sra_unlock=Odotetaan SRA-avaimia korttien paljastamiseksi vaiheessa {0}.
game.settlement_verification_wait=Odotetaan vahvistuksia käden ja saldojen tarkistamiseksi.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Fast Consensus Timeout. Edistymisen pakottaminen.
zero_trust.forged_identity_action=Palvelin yritti käsitellä toimintoa väärennetyllä identiteettiallekirjoituksella seuraavien puolesta:
zero_trust.game_aborted=[ZERO-TRUST] Peli keskeytetty. Potkia huijareita.
