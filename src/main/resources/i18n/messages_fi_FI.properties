game.popup_verificacion_firma_invalida=Tämän käden aikana yksi tai useampi osallistuja ({0}) havaitsi virheellisen kryptografisen allekirjoituksen toiminnossa.\n\nKaikkien osallistujien saamat tiedot olivat johdonmukaisia ​​(viimeiset ketjun tiivisteet täsmäsivät), mutta vähintään yhtä toimintoa ei allekirjoitettu asianmukaisesti sen odotetun tekijän toimesta.\n\nCoronaPoker lopetti suojatun käden sulkemisen ja sulkee pöydän turvallisuusvian vuoksi tämän varoituksen kuittauksen jälkeen.\n\nTodisteet tallennettu:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Huomautus: {0} ei saanut rehellistä sekoitustodistusta tälle kädelle. Todisteet: {1}
game.popup_verificacion_host_sin_prueba=Yksi tai useampi osallistuja ({0}) ei saanut rehellisen sekoituksen todistetta tästä kädestä.\n\nViimeiset ketjun tiivisteet vastaavat kaikkia osallistujia, joten käsien toiminnot ovat johdonmukaisia. Oikea isäntä lähettää aina tämän todisteen, joten toistuva tai vertaisvalintainen poissaolo voi olla merkki muunnetusta ohjelmistosta tai ohjelmistovirheestä.\n\nKäsi oli ratkaistu, mutta pelistä poistuminen on suositeltavaa varotoimenpiteenä.\n\nTodisteet tallennettu:\n{1}
