zero_trust.peer_suspicious_header=Pöydässäsi on havaittu pelaajan epänormaalia tai loukkaavaa käytöstä:\n
zero_trust.peer_suspicious_body=Pöydässä sovellettiin vastaavaa turvatoimea ja peli jatkuu muille pelaajille. Hyvä usko oletetaan. Se voi olla ohjelmistovirhe, eikä ketään syytetä. Todisteet tallennetaan.
zero_trust.peer_inbound_flood=Jatkuva todennettu liikenne, joka ylittää anti-DoS-kynnyksen.
zero_trust.peer_binary_flood=Ääniviestitoiminnot lähetetään epätavallisen suurella nopeudella.
zero_trust.host_binary_flood=Isäntä lähettää ääniviestitoimintoja epätavallisen suurella nopeudella.
zero_trust.peer_flood_log=Anti-DoS-tapahtuma odottaa päätöstä: pelaaja {0}, IP {1}. Syy: {2}
zero_trust.peer_flood_confirm=Käyttäjä {0} lähettää liikaa liikennettä. Tämä voi olla DoS-hyökkäys tai bugi. Poistetaanko heidät pelistä?\n\nIP: {1}\nHavaittu syy: {2}
zero_trust.peer_flood_suppress=Älä näytä näitä varoituksia
zero_trust.peer_hand_ready_withheld=Pelaaja vastaa PING, mutta ei vahvista valmiutta seuraavaan käteen pelin ollessa käynnissä. Se jäädytti käsikäynnistyksen ja on karkotettu. Peli jatkuu ilman heitä.
zero_trust.peer_action_withheld=Pelaaja vastaa PING:ään, mutta ei lähetä panostustoimintoaan pelin ollessa käynnissä, ajatteluaikansa ylittyessä. Se jäädytti kierroksen ja on karkotettu. Peli jatkuu ilman heitä.
zero_trust.peer_conf_withheld=Pelaaja vastaa PING:ään, mutta ei vahvista jakamisviestin vastaanottamista pelin ollessa käynnissä. Se esti pöytää etenemästä ja on POISTETTU. Peli jatkuu ilman heitä.
zero_trust.peer_deal_refusal_expelled=Pelaaja pakotti useita käsien peruutuksia peräkkäin kieltäytymällä pakan sekoittamisesta tai kierrosta. Se on POISTETTU, jotta peli voi jatkua.
zero_trust.suspicious_alert=⚠️ [PALVELIMEKÄYTTÄYTYMINEN]
zero_trust.suspicious_header=Asiakkaasi on havainnut epänormaalin palvelimen toiminnan (ei kriittinen tapahtuma, joka pysäyttää pelin):\n
zero_trust.suspicious_body=Asiakkaasi hylkäsi poikkeavan toimenpiteen ja peli VOI jatkua. Oletamme vilpittömässä mielessä: tämä voi olla ohjelmistovirhe (asiakas tai palvelin), eikä ketään syytetä. Mutta koska vikaa ei voi kertoa muutoin kuin peukalointia, TURVALLISUUTESI SUOSITTELEMME POISTUMISTA tältä pöydältä käyttämällä 'Poistu'-painiketta (rahojasi EI käsitellä tässä kädessä).
zero_trust.host_bad_wire=Palvelimelta on vastaanotettu salauksen purkupyyntö, jossa on virheellinen muoto tai pisteet, jotka eivät kuulu salauskäyrään.
zero_trust.host_critical_command_invalid=Palvelimen lähettämää kriittistä {0}-komentoa ei voitu vahvistaa. Tämä voi olla yhteensopimattomuus, bugi tai muokattu palvelin. Istunto pysäytetään sen eheyden suojelemiseksi.
zero_trust.cheater_detected=[ZERO-TRUST] Pelaaja, jonka versio on muokattu CoronaPoker, on havaittu, mikä viittaa siihen, että hän yrittää huijata. Haluatko jatkaa?
zero_trust.corrupted_mac_action=Palvelin yritti käsitellä toimintoa virheellisellä salausallekirjoituksella (vioittunut MAC) puolesta:
zero_trust.critical=\u274c [NOLLALUOTTAMINEN] KRIITTINEN VAROITUS: VIRHEELLINEN ALLEKIRJOITUS TAI Rikkoutunut KONSENSUS.
zero_trust.critical_alert_body=KARANTEENITILA AKTIVOINTI:\nAsiakkaasi EI lähetä enempää salausavaimia palvelimelle tässä istunnossa.\nPeli on matemaattisesti jäädytetty tasapainon suojaamiseksi.\n\nMAHDOLLISIA syitä ovat:\n  - BUG itse asiakaskoodissa,\n  - BUG palvelinkoodissa tai\n  - PALVELIN, jonka koodia on saatettu muuttaa.\n\nAsiakas ei voi erottaa niitä toisistaan, eikä siinä ole mitään syytöstä. Turvallisuussyistä ja odotettaessa perussyyn tarkistusta SUOSITTELEMME, että POISTAT tästä pelistä käyttämällä "Poistu"-painiketta (rahojasi EI käsitellä tässä kädessä).
zero_trust.critical_alert_header=ZERO-TRUST INCIDENT!\n\nAsiakkaasi on havainnut poikkeaman salausprotokollassa:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRIITTINEN ISTUNNON VIRHE
zero_trust.decrypting_street=[ZERO-TRUST] KATUN KUVAUS...
