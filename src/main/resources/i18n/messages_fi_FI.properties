tooltip.cfg.rabbit=Paljastaa jakamattomat yhteiset kortit käden jälkeen. Jokaisen pelaajan ensimmäinen pyyntö on ilmainen. Valittu tila määrittää, ovatko myöhemmät pyynnöt ilmaisia ​​vai maksavatko ne vähän vai iso blindi.
