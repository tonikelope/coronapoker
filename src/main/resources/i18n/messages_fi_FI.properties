zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] CONSENSUS CRYPTOGRAPHIC VERIFICATION: KAIKKI PELAAJAT OVAT SERTIFIOINTI LÄPISTÄVÄT PAIKALLISEN KÄSIN KRYPTOGRAFISEN VAHVISTUKSEN.
zero_trust.legit2_error=\u274c [ZERO-TRUST] CONSENSUS CRYPTOGRAPHIC VERIFICATION: AINA YKSI PELAAJA EI OLE SERTIFIOINTI läpäisemään PAIKALLISEN KÄSIN KRYPTOGRAFISEN VAHVISTUKSEN.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] PAIKALLINEN KÄSIN KRYPTOGRAAFINEN VAHVISTAMINEN: KORTTIT, YHTEISÖKORTTIT JA KAIKKI TALLENNETUT TOIMENPITEET OVAT LAITTOJA.
zero_trust.legit_error=\u274c [ZERO-TRUST] PAIKALLINEN KÄSIN KRYPTOGRAFIINEN VAHVISTUS: EI VOI VARMISTAA KORTTIENI, YHTEISÖKORTTIENI JA KAIKKI TALLENNETUT TOIMENPITEET OVAT LAITTOJA.
