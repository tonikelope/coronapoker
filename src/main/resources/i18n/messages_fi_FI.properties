gdx.settings.option_help.window_mode.borderless=Täyttää näytön reunattomalla ikkunalla ja säilyttää työpöydän näyttötilan.
tooltip.cfg.custom_bots.automatic_rebuy=Antaa tämän mukautetun botin lisäosto pelimerkkien loppumisen jälkeen. Globaali automaattinen lisäosto-ohjaus on otettava käyttöön.
