game.showdown_forfeit_msg=VAROITUS: korttien näyttö vahvistus epäonnistui seuraaville pelaajille, ja heidän korttejaan EI paljasteta:\n\n%nicks%\n\nNämä pelaajat suljetaan pois korttien näyttö-vastus (auto-fold) ja CANNOT. Peli jatkuu normaalisti.
zero_trust.peer_sra_corrupt=Allekirjoitus korttien näyttö on aito, mutta vertaiskumppanin SRA-avain ei määritä kelvollisia kortteja. Tämä tapahtuu vain, jos vertaiskäyttäjä on tarkoituksella allekirjoittanut korruptoituneen avaimen tai hänen asiakkaansa on viallinen. Emme voi sanoa kumpi, ja turvallisuuden vuoksi lopetamme pelin.
zero_trust.straddle_recover_mismatch=Palauttaessaan kättä isäntä ilmoitti straddle erilaista kuin se, jonka oma paikallinen kopiosi oli tallentanut. Tämä tapahtuu vain, jos isäntä peukaloi palautettua numeroa straddle tai sen asiakas on viallinen. Käsi on edelleen rekonstruoitu luotetusta kopiostasi, mutta varoitamme sinua varotoimenpiteenä.
zero_trust.rit_recover_mismatch=Palauttaessaan kättä isäntä ilmoitti suorita kahdesti -tuloksen, joka poikkesi siitä, jonka oma paikallinen kopiosi oli tallentanut. Tämä tapahtuu vain, jos isäntä peukaloi palautettua tulosta tai sen asiakas on viallinen. Käsi on edelleen rekonstruoitu luotetusta kopiostasi, mutta varoitamme sinua varotoimenpiteenä.
zero_trust.peer_sra_corrupt_registro=\u2014 korttien näyttö avain allekirjoitettu, mutta ei sovi korteiksi. Mahdollinen huijaus tai asiakasvirhe.
