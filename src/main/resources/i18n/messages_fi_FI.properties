tooltip.cfg.custom_bots.avatar=Valitse kelvollinen kuva tai säilytä virallinen botin avatar. CoronaPoker tallentaa turvallisen kopion, jotta se ei katoa.
tooltip.cfg.custom_bots.name=Syötä näkyvä nimi ilman $. Varattu merkki lisätään automaattisesti.
tooltip.cfg.custom_bots.difficulty=Asettaa haasteen ja taktiikat, joita botti käyttää. Easy pelaa virkistystarkoituksessa, Normal käyttää kurinalaisempaa strategiaa ja Hard edistyksellistä taktiikkaa.
tooltip.cfg.custom_bots.personality=Asettaa perustyylin. Satunnainen valitsee sen, kun botti luodaan, ja säilyttää sen aktiivisen istunnon ajan. Botti voi mukauttaa päätöksensä tilanteen mukaan.
gdx.settings.option_help.bot_difficulty.easy=Pelaa rennosti ja tekee virheitä useammin.
gdx.settings.option_help.bot_difficulty.medium=Käyttää kurinalaisempaa strategiaa ja muuttaa päätöksiä käden kehittyessä.
gdx.settings.option_help.bot_difficulty.hard=Käyttää kehittyneempiä taktiikoita, kuten varastaa numeroa blindit tai käyttää painostusta, kun vastustaja näyttää haavoittuvalta.
gdx.settings.option_help.custom_bot_personality.random=Valitsee tyylin, kun botti luodaan, ja säilyttää sen aktiivisen istunnon ajan.
gdx.settings.option_help.custom_bot_personality.nit=Ansaitsee muutaman käden ja odottaa yleensä vahvoja kortteja ennen kuin riskeeraa pelimerkkejä.
gdx.settings.option_help.custom_bot_personality.station=Yleensä maksaa panoksia ja pysyä kädessä. Nostaa harvemmin.
gdx.settings.option_help.custom_bot_personality.tag=Valitsee kädet valikoivasti ja pyrkii johtamaan panoksia ja korotuksia.
gdx.settings.option_help.custom_bot_personality.lag=Pelaa laajemman valikoiman käsiä ja painostaa toistuvilla panoksilla ja korotuksilla.
gdx.settings.option_help.ante_mode.traditional=Jokainen aktiivinen pelaaja lähettää yhden kymmenesosan luvusta iso blindi pyöristettynä lähimpään senttiin.
