gdx.settings.option_help.ante_mode.button=Painikkeen pelaaja lähettää koko ante, joka on yhtä suuri kuin yksi iso blindi.
gdx.settings.option_help.ante_mode.small_blind=Kohteen pieni blindi pelaaja lähettää koko numeron ante, yhtä kuin yksi iso blindi.
gdx.settings.option_help.rebuy_cap.buy_in=Maksimipinosi numeron lisäosto jälkeen perustuu pelin arvoon sisäänosto.
gdx.settings.option_help.rebuy_cap.highest_stack=Lisäosto pöydän suurimpaan pinoon asti. Korkki ei koskaan laske standardin sisäänosto alapuolelle.
gdx.settings.option_help.rabbit.off=Jakamattomat yhteiset kortit jäävät piiloon käden päätyttyä.
gdx.settings.option_help.rabbit.free=Voit pyytää nähdä jakamattomia yhteiskortteja, kun käsi päättyy maksamatta pelimerkkejä.
gdx.settings.option_help.rabbit.free_small_blind=Ensimmäinen pelipyyntösi on ilmainen. Jokainen myöhempi pyyntö maksaa yhden pieni blindi.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Pelin ensimmäinen pyyntösi on ilmainen, toinen maksaa yhden pieni blindi ja myöhemmät pyynnöt yhden iso blindi.
