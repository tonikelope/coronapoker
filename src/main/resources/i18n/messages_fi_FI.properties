peer.broadcast_failed=Verkkovirhe lähetettäessä yksityisiä kortteja. Käsi on peruutettu.
peer.recovery_action_data_unavailable=Tallennettua toimintohistoriaa ei voitu lukea. Käsi on peruutettu turvallisesti ja palaa toipumiseen.
straddle.deferred_release_failed=Kortteja blindit straddle ei voitu paljastaa (pelaaja katkaisi yhteyden tai kieltäytyi yhteistyöstä). Käsi on peruutettu.
peer.state_inconsistent=Jälleenmyyjätilasta tuli epäjohdonmukainen. Käsi on peruutettu.
peer.bot_no_token=Botilla ei ole salauksenpurkuavainta valmiina. Käsi on peruutettu.
peer.community_unlock_no_testament=Pelaaja katkaisi yhteyden jättämättä avaimensa paljastaakseen yhteiset kortit. Käsi on peruutettu.
peer.dropped_during_cascade=Soittimen yhteys katkesi pakan kryptografisen sekoituksen aikana. Käsi on peruutettu.
peer.dropped_during_rotation=Soittimen yhteys katkesi pakan salauskierron aikana. Käsi on peruutettu.
zero_trust.rotation_refused=Yhdistetty pelaaja kieltäytyi toimittamasta pakan kiertoavainta. Peli pysäytetään. Heidän on perusteltava uudelleenpääsyn epäämisensä.
zero_trust.cascade_refused=Yhdistetty pelaaja kieltäytyi osallistumasta pakan sekoituskaskadiin. Peli pysäytetään. Heidän on perusteltava uudelleenpääsyn epäämisensä.
zero_trust.pocket_unlock_refused=Yhdistetty pelaaja kieltäytyi toimittamasta avainta taskukorttien salauksen purkamiseksi. Peli pysäytetään. Heidän on perusteltava uudelleenpääsyn epäämisensä.
zero_trust.community_unlock_refused=Yhdistetty pelaaja kieltäytyi luovuttamasta avainta yhteisten korttien paljastamiseksi. Peli pysäytetään. Heidän on perusteltava uudelleenpääsyn epäämisensä.
zero_trust.host_showdown_sig_missing=Avain korttien näyttö vastaanotettiin palvelimelta ILMAN kirjoittajan salausallekirjoitusta tai väärällä allekirjoituksella. Palvelin saattaa korvata johdossa olevan avaimen.
zero_trust.host_showdown_sig_invalid=Palvelimelta vastaanotettiin avain korttien näyttö, jossa oli VIRHEELLINEN kryptografinen allekirjoitus. Palvelin saattaa korvata johdossa olevan avaimen.
zero_trust.host_potcards_mismatch=Palvelimen lähettämä pelkkä teksti korttien näyttö EI TÄYTÄ tulosta paikallisen kappaleen salauksen purkamisesta allekirjoitetulla avaimella. Palvelin saattaa lähettää väärennettyjä kortteja numeroon korttien näyttö.
zero_trust.host_community_garbage=Palvelimelta saadut kryptografiset yhteisön korttitiedot ovat epäjohdonmukaisia ​​(pala ei pure kelvollista dekkikorttia tai ei vastaa palvelimen allekirjoitettua ilmoitusta). Mahdollisia syitä: BUG jossain ohjelmistoversiossa, palvelinversio, jonka koodia on saatettu muuttaa, tai paikallisen identiteettiavaimen vioittuminen. Asiakas ei osaa erottaa toisistaan ​​eikä syyllistä ketään.
zero_trust.host_unlock_out_of_order=Salauksen purkupyyntö on vastaanotettu palvelimelta väärässä järjestyksessä (väärä katu, toistuva paikka, vaihe poissa käytöstä tai pyyntö lähetetty ennen edellisen kadun sulkemista).
zero_trust.host_cascade_mid_hand=Palvelimelta on vastaanotettu sekoitus uudelleenkäynnistyspyyntö kesken käynnissä olevan käden (korvaisi salauksen purkuavaimeni).
zero_trust.host_pocket_extraction=Palvelimelta on vastaanotettu salauksen purkupyyntö, joka vaikuttaisi OMISI yksityisiin kortteihisi.
zero_trust.host_community_extraction=Palvelimelta on vastaanotettu salauksen purkupyyntö, joka paljastaisi yhteisen kortin etukäteen.
zero_trust.host_rotation_replay=Palvelin pyysi toista kortin kiertoa samassa kädessä. Laillinen kierto on ainutlaatuinen per käsi. Toisto viittaa yritykseen käyttää asiakasta muiden pelaajien korttien salauksen purkamiseen.
zero_trust.host_shuffle_proof_failed=Sopimuksen varmistus epäonnistui: palvelimen jakamaa pakkaa ei voitu todistaa olevan genesis-dekin rehellinen sekoitus. Yhteisön lukituksen avaaminen on evätty, ja tämä istunto lopetetaan yksityisten korttien suojaamiseksi.
zero_trust.host_shuffle_proof_missing=Kauppa saavutettiin ilman todennettavissa olevaa rehellistä sekoitustodistusta tämän käden pakalle, ja nyt paljastetaan yhteiset kortit. Se voi olla virhe tai verkkoviive tai isäntä, joka yrittää manipuloida sopimusta. Voit jatkaa pelaamista, mutta tästä pöydästä poistuminen on erittäin suositeltavaa.
zero_trust.deck_unverified=Tämän käden pakkaa EI voitu vahvistaa rehellisenä sekoitusna. EpäILYTTÄMÄ: isäntä "{0}", joka jakaa ja lähettää satunnaistodistuksen. Se voi olla isäntä, joka manipuloi sopimusta, tai pelaaja, joka ei todistanut todisteita. Käsi pelataan, koska kortit on jo jaettu.
zero_trust.deck_unverified_body=Allekirjoitetut todisteet tästä poikkeavuudesta on tallennettu (pelilokiin, punaisella ja kiistanalaisten käsien taulukkoon). Voit jatkaa pelaamista, mutta jos et luota isäntään, poistu pöydästä.
zero_trust.seat_redraw=Isäntä "{0}" pakotti UUDEN paikkaarvontaan. Tämä on epätavallista: arvonta on kollektiivinen ja tarkistettavissa, joten isäntä ei voi valita paikkoja, mutta se VOI rullata uudelleen, kunnes se saa itselleen mieluisen järjestelyn. Jos se toistuu, se saattaa johtua isännästä, joka yrittää vääntää istuintasi.
zero_trust.seat_redraw_body=Uusi arvonta sujui samalla tavalla ja on edelleen tarkistettavissa: kukaan, isäntä mukaan lukien, ei voi valita lopputulosta. Se voi tapahtua, jos pelaaja putoaa heti alussa, mutta jos näet useita uudelleenyrityksiä etkä luota isäntään, poistu pöydästä. Se on kirjattu.
zero_trust.seat_recover_mismatch=Pelin palautuksen yhteydessä isännän "{0}" lähettämä paikkajärjestys EI vastaa asiakkaasi tallentamaa järjestystä: joku, jonka jo tunnet, on vaihtanut paikkaa pöydässä. Se voi olla isäntä, joka yrittää järjestää paikkoja uudelleen palautuksen suojassa.
zero_trust.seat_recover_mismatch_body=Asiakkaasi piti paikkaviitteen, jonka se vahvisti itsensä alussa. Pelaajien liittyminen tai lähteminen välillä on normaalia. Jo siellä olleen henkilön tilaaminen uudelleen ei ole mahdollista. Jos et luota isäntään, poistu pöydästä. Se on kirjattu.
zero_trust.host_recover_action_forged=Isäntä yritti syöttää VÄÄNNETTYN toiminnon (virheellinen allekirjoitus) pelin palautuksen aikana. Asiakkaasi kieltäytyi.
zero_trust.host_recover_action_omitted=Palautuksen aikana isäntä jätti pois toiminnon, jonka SINÄ soitit ja jonka olit tallentanut paikalliseen tietokantaan. Asiakkaasi havaitsi sen omasta kopiostaan ​​eikä hylännyt toimintaasi hiljaa.
zero_trust.host_recover_balance_mismatch=Isäntä yritti muuttaa saldoasi (chips/sisäänosto) pelin palautuksen aikana: se ei vastaa paikallista ennätystäsi. Asiakkaasi piti todellisen tasapainosi.
zero_trust.host_board_peek=Isäntä pyysi FUTURE-kadun yhteisen kortin salauksen purkamista (yritys lukea taulua aikaisin). Asiakkaasi kieltäytyi.
