tooltip.cfg.ante=Ajoute une contribution forcée au pot après le blindes. Le mode définit qui paie et combien.
tooltip.cfg.ante_mode=En mode Traditionnel, chaque joueur actif paie 10% des grosse blinde. En BBA, BA ou SBA, le bouton grosse blinde, ou petite blinde paie un grosse blinde. Blindes sont postés en premier.
tooltip.cfg.blind_cap=Arrête blindes augmente au plafond configuré.
tooltip.cfg.blinds_level=À partir de blindes (petit/grand) pour le jeu.
tooltip.cfg.bot_balance=À la fin du jeu, le solde combiné des robots est réparti à parts égales entre les joueurs humains, de sorte que l'argent réel n'est réglé qu'entre les personnes.
tooltip.cfg.bot_rebuy=Contrôle automatique global recave pour chaque bot. Le désactiver désactive également les paramètres recave des robots personnalisés.
tooltip.cfg.bots=Définit la difficulté des robots standards. Les robots personnalisés conservent la difficulté configurée individuellement dans le Bot Manager.
tooltip.cfg.buyin_fixed=Tout le monde commence par le même cave. Lorsqu'elle est désactivée, les joueurs choisissent dans la plage configurée.
tooltip.cfg.double_blinds=Passe au niveau blindes suivant dans la structure après un nombre défini de mains ou de minutes.
tooltip.cfg.hand_limit=Le jeu se termine lorsque ce nombre de mains est atteint.
tooltip.cfg.iwtsth=Vous permet de demander à voir la main d'un rival à abattage.
tooltip.cfg.rabbit=Révèle les cartes communautaires non distribuées après la main. La première demande de chaque joueur est gratuite. Le mode choisi détermine si les demandes ultérieures restent gratuites ou coûtent une petite somme ou grosse blinde.
tooltip.cfg.rebuy_limit=Rebuys maximum par joueur.
tooltip.cfg.recover=Reprend une partie précédemment interrompue.
tooltip.cfg.rit=Permet à un vote de distribuer les cartes restantes deux fois lorsqu'un Tapis clôture les paris.
tooltip.cfg.straddle=Le joueur après le grosse blinde peut poster deux grosse blinde avant de voir ses cartes et agir en dernier préflop.
tooltip.cfg.straddle_on_timeout=Publiez le straddle automatiquement lorsque son invite expire. Cela affecte uniquement votre lecteur et est désactivé par défaut.
tooltip.cfg.structure=Structure de niveau Blindes pour le jeu.
tooltip.cfg.think_time=Secondes disponibles pour décider. L'action automatique s'exécute à l'expiration du délai.
tooltip.cfg.showdown_time=Pendant quelques secondes, le résultat de la main reste affiché à l'écran avant que la main suivante ne soit distribuée.
tooltip.cfg.allow_hot_join=Permet aux nouveaux joueurs de se joindre au WARMING UP et de participer à la main suivante. Lorsqu'il est modifié en cours de jeu, cela n'affecte que les nouvelles tentatives de connexion.
tooltip.cfg.card_flip_duration=Définit le temps nécessaire à chaque carte pour terminer son tour une fois révélée.
tooltip.cfg.community_reveal_style=Choisissez comment les cartes communes se retournent. Chaque vue mémorise son choix. Par défaut, le retournement est rigide en 2D et souple en 3D.
tooltip.cfg.card_flip_direction=Choisit la direction dans laquelle les cartes tournent lorsqu'elles sont révélées. Mixed sélectionne une direction pour chaque révélation. Les cartes d’un même groupe se retournent de la même manière.
tooltip.cfg.card_flip_zoom=Agrandit les cartes pendant le retournement pour qu'elles semblent se déplacer vers l'écran.
tooltip.cfg.reparto_velocidad=Définit le temps nécessaire à chaque carte pour voyager du jeu à son emplacement.
tooltip.cfg.community_deal_style=Choisissez si les cinq cartes communes seront distribuées face cachée au début ou distribuées dans leur propre rue. Les modifications enregistrées s'appliqueront à partir de la main suivante.
tooltip.cfg.anim_calidad=La qualité conserve chaque détail visuel. Les performances réduisent le coût des vols de cartes et s'affichent sur des ordinateurs plus faibles.
tooltip.cfg.downgrade_velocidad=Définit le temps nécessaire à la table pour réorganiser ses sièges lorsqu'un joueur part.
tooltip.cfg.swap_velocidad=Définit le temps nécessaire à vos cartes pour traverser une fois triées.
tooltip.cfg.swap_estilo=Arc lève une carte au-dessus de l'autre. L'horizontale les traverse à la même hauteur.
tooltip.cfg.resaltar_avatares=Poser la souris un instant sur l'avatar d'un joueur l'affiche agrandi au-dessus de la table, à côté de son nom et de sa pile, et il disparaît lorsque vous éloignez la souris.
tooltip.cfg.resaltar_jugada_showdown=Pendant le abattage, le survol du nom de la main d'un joueur (gagnant ou perdant) met en surbrillance uniquement les cartes qui le composent et atténue le reste.
tooltip.cfg.screenshot_fin_timba=Enregistre automatiquement une capture d'écran de l'écran final lorsque le compteur d'argent se termine (ou lorsque vous le quittez, si vous partez plus tôt).
