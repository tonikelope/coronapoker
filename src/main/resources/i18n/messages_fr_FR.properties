tooltip.cfg.custom_bots.name=Entrez le nom visible sans $. Le marqueur réservé est ajouté automatiquement.
tooltip.cfg.custom_bots.difficulty=Définit le défi et les tactiques utilisées par le bot. Easy joue de manière récréative, Normal utilise une stratégie plus disciplinée et Hard utilise des tactiques avancées.
tooltip.cfg.custom_bots.personality=Définit le style de base. Le choisit au hasard lors de la création du bot et le conserve pour la session active. Le bot peut adapter ses décisions à la situation.
gdx.settings.option_help.bot_difficulty.easy=Joue avec désinvolture et fait des erreurs plus souvent.
gdx.settings.option_help.bot_difficulty.medium=Utilise une stratégie plus disciplinée et ajuste ses décisions à mesure que la main se développe.
gdx.settings.option_help.bot_difficulty.hard=Utilise des tactiques plus avancées, telles que voler blindes ou appliquer une pression lorsqu'un adversaire semble vulnérable.
gdx.settings.option_help.custom_bot_personality.random=Sélectionne un style lors de la création du bot et le conserve pour la session active.
gdx.settings.option_help.custom_bot_personality.nit=Entre peu de mains et attend généralement des cartes fortes avant de risquer des jetons.
gdx.settings.option_help.custom_bot_personality.station=A tendance à suivre les mises et à rester dans la main. Augmente moins souvent.
gdx.settings.option_help.custom_bot_personality.tag=Choisit les mains de manière sélective et a tendance à prendre les devants avec les mises et les relances.
gdx.settings.option_help.custom_bot_personality.lag=Joue un plus large éventail de mains et applique une pression avec des mises et des relances fréquentes.
gdx.settings.option_help.ante_mode.traditional=Chaque joueur actif verse un dixième des grosse blinde, arrondi au centime le plus proche.
gdx.settings.option_help.ante_mode.big_blind=Le joueur dans le grosse blinde publie l'intégralité du ante, égal à un grosse blinde.
gdx.settings.option_help.ante_mode.button=Le joueur sur le bouton publie la totalité du ante, égal à un grosse blinde.
gdx.settings.option_help.ante_mode.small_blind=Le joueur dans le petite blinde publie l'intégralité du ante, égal à un grosse blinde.
gdx.settings.option_help.blind_unit.minutes=L'intervalle entre les augmentations de blindes est mesuré en minutes de jeu.
gdx.settings.option_help.blind_unit.hands=Blindes augmente une fois le nombre de mains spécifié terminé.
gdx.settings.option_help.rebuy_cap.buy_in=Votre stack maximum après un recave est basé sur le cave du jeu.
gdx.settings.option_help.rebuy_cap.highest_stack=Recave jusqu'au plus gros stack de la table. Le plafond ne descend jamais en dessous de la norme cave.
gdx.settings.option_help.rabbit.off=Les cartes communautaires non distribuées restent cachées une fois la main terminée.
gdx.settings.option_help.rabbit.free=Vous pouvez demander à voir les cartes communautaires non distribuées après la fin de la main sans payer de jetons.
gdx.settings.option_help.rabbit.free_small_blind=Votre première demande de jeu est gratuite. Chaque demande ultérieure coûte un petite blinde.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Votre première demande du jeu est gratuite, la seconde coûte un petite blinde et les demandes ultérieures coûtent un grosse blinde.
gdx.settings.option_help.window_mode.exclusive=Utilise le mode plein écran du moniteur.
gdx.settings.option_help.window_mode.borderless=Remplit l'écran avec une fenêtre sans bordure et conserve le mode d'affichage du bureau.
gdx.settings.option_help.window_mode.windowed=Ouvre CoronaPoker dans une fenêtre que vous pouvez déplacer et redimensionner.
gdx.settings.option_help.fps_limit.fixed=Définit une fréquence d’images maximale fixe. Un plafond inférieur peut réduire la consommation d’énergie.
gdx.settings.option_help.fps_limit.monitor=Fait correspondre la limite de fréquence d'images au taux de rafraîchissement du moniteur affichant le jeu.
gdx.settings.option_help.msaa.0=Désactive l’anticrénelage multi-échantillons pour la table et l’interface. Nécessite un redémarrage.
gdx.settings.option_help.msaa.2=Utilise 2 échantillons par pixel pour lisser les bords avec un faible coût graphique. Nécessite un redémarrage.
gdx.settings.option_help.msaa.4=Utilise 4 échantillons par pixel pour équilibrer le lissage des bords et le coût graphique. Nécessite un redémarrage.
gdx.settings.option_help.msaa.8=Utilise 8 échantillons par pixel pour le lissage le plus puissant offert par ce paramètre. Nécessite un redémarrage.
gdx.settings.option_help.card_rendering.native=Dessine des cartes directement pour réduire le coût de rendu.
gdx.settings.option_help.card_rendering.smooth=Utilise un filtre supplémentaire pour lisser les bords de la carte à un coût graphique plus élevé.
tooltip.cfg.custom_bots.automatic_rebuy=Permet à ce bot personnalisé recave après avoir manqué de jetons. Le contrôle automatique global recave doit être activé.
tooltip.cfg.custom_bots.order_up=Déplace le profil sélectionné d'une position vers le haut. La liste le suit lorsqu'un défilement est nécessaire.
tooltip.cfg.custom_bots.order_down=Déplace le profil sélectionné d'une position vers le bas. La liste le suit lorsqu'un défilement est nécessaire.
tooltip.cfg.custom_bots.random_selection=Mélange le catalogue une fois lorsqu'un lobby est créé. Chaque bot personnalisé ne peut entrer qu'une seule fois et la sélection reste stable pour ce lobby.
tooltip.cfg.custom_bots.new=Prépare un nouveau profil sans modifier les robots déjà enregistrés.
tooltip.cfg.custom_bots.save=Ajoute le nouveau profil ou enregistre les modifications apportées au bot sélectionné.
tooltip.cfg.custom_bots.delete=Supprime le profil sélectionné après avoir demandé une confirmation.
tooltip.cfg.custom_bots.close=Ferme le gestionnaire. Les profils enregistrés et leur ordre sont conservés automatiquement.
