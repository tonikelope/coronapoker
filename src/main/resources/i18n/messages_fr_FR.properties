zero_trust.p2p_cheater_detected2=[ZERO-TRUST] Un joueur avec une version CoronaPoker modifiée a été détecté, suggérant qu'il pourrait essayer de tricher.
zero_trust.p2p_finished_resuming=Vérification P2P KEM terminée. Reprise de la main...
