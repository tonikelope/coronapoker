game.recover_accion_ausencia=⚠ Remarque : l'hôte a rejoué les actions plus tard que votre dernière action enregistrée, probablement jouée alors que vous étiez hors de la main - elles ne peuvent pas être vérifiées et sont acceptées telles que l'hôte les a envoyées.
game.mano_verificacion_divergente=⚠ DIVERGENCE DE VÉRIFICATION CRYPTOGRAPHIQUE. Un ou plusieurs participants ont signalé un état final différent de la main. Preuve : {0}
game.mano_verificacion_jugador_ausente=⚠ Remarque : {0} n’a pas envoyé la signature de clôture. La fermeture manuelle sécurisée a été stoppée. Preuve : {1}
game.mano_verificacion_firma_invalida=⚠ Remarque : {0} a détecté une signature cryptographique invalide lors de cette main. La fermeture sécurisée a été stoppée. Preuve : {1}
game.popup_verificacion_firma_invalida=Au cours de cette main, un ou plusieurs participants ({0}) ont détecté une signature cryptographique invalide sur une action.\n\nLes données reçues par tous les participants étaient cohérentes (les hachages de chaîne finaux correspondaient), mais au moins une action n’a pas été correctement signée par son auteur attendu.\n\nCoronaPoker a arrêté la fermeture sécurisée de la main et fermera la table pour cause de faille de sécurité après cet avertissement. acknowledged.\n\nEvidence saved in:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Remarque : {0} n’a pas reçu la preuve de mélange honnête pour cette main. Preuve : {1}
game.popup_verificacion_host_sin_prueba=Un ou plusieurs participants ({0}) n’ont pas reçu la preuve de mélange honnête pour cette main.\n\nLes hachages de chaîne finaux correspondent à tous les participants, donc les actions des mains sont cohérentes. Un hôte correct envoie toujours cette preuve, donc une absence répétée ou sélective par les pairs pourrait indiquer un logiciel modifié ou un défaut logiciel.\n\nLa main a été réglée, mais il est recommandé de quitter le jeu par précaution.\n\nPreuve enregistrée dans :\n{1}
game.popup_verificacion_titulo_alerta=Divergence de vérification cryptographique
game.popup_verificacion_titulo_aviso=Vérification cryptographique incomplète
game.popup_verificacion_divergente=Un ou plusieurs participants ont signalé une vérification cryptographique différente de l’état final de la main.\n\nCela peut être dû à un logiciel modifié ou à un défaut logiciel. CoronaPoker ne peut pas déterminer automatiquement la cause ou son origine.\n\nCoronaPoker a arrêté la fermeture sécurisée de la main et fermera la table en raison d’une défaillance de sécurité après que cet avertissement ait été reconnu.\n\nPreuve enregistrée dans :\n{0}
game.popup_verificacion_ausente=The last hand could not reach consensus because player {0} did not send a closing signature.\n\nThis may be caused by a network outage, a client failure or modified software. CoronaPoker stopped secure hand closure and will close the table as a security failure after this warning is acknowledged.\n\nEvidence saved in:\n{1}
game.mano_verificacion_interrumpida=CRITIQUE : échec de la fermeture manuelle sécurisée ({0}). La table se fermera suite à une faille de sécurité. Preuve : {1}
game.popup_verificacion_interrumpida=CoronaPoker n’a pas pu terminer le protocole de clôture cryptographique pour la dernière main.\n\nÉchec : {0}\n\nLa main reste ouverte pour la récupération. La table se fermera en raison d’une défaillance de sécurité seulement après que cet avertissement ait été reconnu.\n\nPreuve enregistrée dans :\n{1}
