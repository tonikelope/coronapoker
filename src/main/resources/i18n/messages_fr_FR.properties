game.showdown_forfeit_msg=AVIS : la vérification abattage a échoué pour le(s) joueur(s) suivant(s) et leurs cartes ne seront PAS révélées :\n\n%nicks%\n\nCes joueurs sont exclus de la résistance abattage (pliage automatique) et NE PEUVENT PAS gagner ce pot. Le jeu continue normalement.
zero_trust.peer_sra_corrupt=La signature abattage est authentique mais la clé SRA du homologue ne permet pas de résoudre les cartes valides. Cela ne se produit que si l'homologue a intentionnellement signé une clé corrompue ou si son client est bogué. Nous ne pouvons pas dire lequel, et pour des raisons de sécurité, nous mettons fin au jeu.
zero_trust.straddle_recover_mismatch=Tout en récupérant la main, l'hôte a annoncé un straddle différent de celui que votre propre copie locale avait enregistré. Cela ne se produit que si l'hôte altère le straddle récupéré ou si son client est bogué. La main est toujours reconstituée à partir de votre copie de confiance, mais nous vous prévenons par précaution.
zero_trust.rit_recover_mismatch=Lors de la récupération de la main, l'hôte a annoncé un résultat d'exécution deux fois différent de celui enregistré par votre propre copie locale. Cela ne se produit que si l'hôte altère le résultat récupéré ou si son client est bogué. La main est toujours reconstituée à partir de votre copie de confiance, mais nous vous prévenons par précaution.
zero_trust.peer_sra_corrupt_registro=\u2014 abattage clé signée mais ne se résout pas en cartes. Triche possible ou bug client.
