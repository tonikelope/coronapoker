ui.identicon.session_explicacion=Chaque icône est l'empreinte visuelle de la clé AES d'un canal crypté. Les deux extrémités du même canal doivent voir la MÊME icône. Comparez-le avec l'autre joueur via un canal externe sécurisé tel que la voix, WhatsApp ou Telegram. Si cela correspond, personne n'intercepte la connexion. Si c'est différent, il y a un intermédiaire sur le réseau et vous devez vous déconnecter.
