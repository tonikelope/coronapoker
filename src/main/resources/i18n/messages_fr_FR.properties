zero_trust.action_rejected_invalid_signature=\u26a0\ufe0f [ZERO-TRUST] Action rejetée (Signature invalide) -> {0}
zero_trust.auditing_memory=[ZERO-TRUST] Audit de la mémoire de l'essaim RAM...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Journal binaire chargé en mémoire ({0} signatures prêtes pour la relecture synchronisée).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] La cascade de lecture aléatoire cryptographique a échoué. La main a été annulée.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Échec du déverrouillage des cartes privées (un joueur n'a pas répondu à temps). La main a été annulée.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Une carte déchiffrée ne correspond à aucune carte valide du jeu. Le jeu a été annulé.
peer.not_enough_players=Un joueur a chuté pendant le mélange et il n'y a plus assez de joueurs pour distribuer la main.
peer.unlock_no_testament=Un joueur s'est déconnecté sans laisser sa clé de décryptage. La main a été annulée.
peer.broadcast_failed=Erreur réseau lors de la diffusion des cartes privées. La main a été annulée.
peer.recovery_action_data_unavailable=L'historique des actions enregistrées n'a pas pu être lu. La main a été annulée en toute sécurité et reviendra à la récupération.
straddle.deferred_release_failed=Les cartes blindes straddle n'ont pas pu être révélées (un joueur s'est déconnecté ou a refusé de coopérer). La main a été annulée.
peer.state_inconsistent=L'état du concessionnaire est devenu incohérent. La main a été annulée.
peer.bot_no_token=Un bot n’a pas sa clé de déchiffrement prête. La main a été annulée.
peer.community_unlock_no_testament=Un joueur s'est déconnecté sans laisser sa clé pour révéler des cartes communes. La main a été annulée.
peer.dropped_during_cascade=Un joueur déconnecté lors du mélange cryptographique du deck. La main a été annulée.
peer.dropped_during_rotation=Un joueur déconnecté lors de la rotation cryptographique du deck. La main a été annulée.
zero_trust.rotation_refused=Un joueur connecté a refusé de remettre sa clé de rotation du deck. Le jeu est arrêté. Ils devront justifier leur refus d'être réadmis.
zero_trust.cascade_refused=Un joueur connecté a refusé de participer à la cascade de mélange de deck. Le jeu est arrêté. Ils devront justifier leur refus d'être réadmis.
zero_trust.pocket_unlock_refused=Un joueur connecté a refusé de remettre sa clé pour décrypter les cartes pocket. Le jeu est arrêté. Ils devront justifier leur refus d'être réadmis.
zero_trust.community_unlock_refused=Un joueur connecté a refusé de remettre sa clé pour révéler les cartes communes. Le jeu est arrêté. Ils devront justifier leur refus d'être réadmis.
zero_trust.host_showdown_sig_missing=Une clé abattage a été reçue du serveur SANS la signature cryptographique de l'auteur, ou avec une signature mal formée. Le serveur remplace peut-être la clé sur le fil.
zero_trust.host_showdown_sig_invalid=Une clé abattage a été reçue du serveur avec une signature cryptographique INVALIDE. Le serveur remplace peut-être la clé sur le fil.
zero_trust.host_potcards_mismatch=Le texte brut abattage envoyé par le serveur NE CORRESPOND PAS au résultat du déchiffrement de votre pièce locale avec la clé signée. Le serveur envoie peut-être de fausses cartes à abattage.
zero_trust.host_community_garbage=Les données cryptographiques de la carte communautaire reçues du serveur sont incohérentes (la pièce n'est pas déchiffrée en une carte de jeu valide ou ne correspond pas à l'annonce signée du serveur). Causes possibles : un BUG dans une version du logiciel, une version du serveur dont le code a pu être altéré ou une corruption de la clé d'identité locale. Le client ne peut pas faire la différence et n’accuse personne.
zero_trust.host_unlock_out_of_order=Une demande de décryptage a été reçue du serveur dans le désordre (mauvaise rue, créneau répété, déclassement ou demande émise avant la fermeture de la rue précédente).
zero_trust.host_cascade_mid_hand=Une demande de redémarrage aléatoire a été reçue du serveur au milieu d'une main en cours (elle écraserait ma clé de déchiffrement).
zero_trust.host_pocket_extraction=Une demande de décryptage a été reçue du serveur qui affecterait VOS PROPRES cartes privées.
zero_trust.host_community_extraction=Une demande de décryptage a été reçue du serveur qui révélerait à l'avance une carte communautaire.
zero_trust.host_rotation_replay=Le serveur a demandé une deuxième rotation de carte dans la même main. La rotation légitime est unique par main. Une répétition suggère une tentative d'utiliser votre client pour décrypter les cartes d'autres joueurs.
zero_trust.host_shuffle_proof_failed=La vérification de la transaction a échoué : il n'a pas été possible de prouver que le jeu distribué par le serveur était un mélange honnête du jeu Genesis. Les déverrouillages communautaires ont été refusés et cette session est terminée pour protéger les cartes privées.
zero_trust.host_shuffle_proof_missing=L'accord est arrivé sans preuve vérifiable de mélange honnête pour le jeu de cette main, et les cartes communes sont maintenant révélées. Il peut s'agir d'un bug ou d'un retard du réseau, ou d'un hôte essayant de manipuler la transaction. Vous pouvez continuer à jouer, mais quitter cette table est fortement recommandé.
zero_trust.deck_unverified=Le jeu de cette main n’a PAS pu être vérifié comme étant un mélange honnête. SUSPECT : animateur "{0}", qui distribue et diffuse la preuve shuffle. Il peut s’agir de l’hôte qui manipule la transaction ou d’un joueur qui a caché sa preuve. La main est jouée car les cartes sont déjà distribuées.
zero_trust.deck_unverified_body=Des preuves signées de cette anomalie ont été enregistrées (dans le journal de jeu, en rouge, et dans le tableau des mains contestées). Vous pouvez continuer à jouer, mais si vous ne faites pas confiance à l'hôte, quittez la table.
zero_trust.seat_redraw=L’hôte "{0}" a forcé un NOUVEAU tirage au sort des sièges. C’est INSOLITE : le tirage au sort est collectif et vérifiable, donc l’hôte ne peut pas choisir les sièges, mais il PEUT relancer jusqu’à ce qu’il obtienne un arrangement qui lui plaît. Si cela se répète, il se peut que l’hôte essaie de truquer votre siège.
zero_trust.seat_redraw_body=Le nouveau tirage au sort s'est déroulé de la même manière et est toujours vérifiable : personne, y compris l'hôte, ne peut choisir le résultat. Cela peut arriver si un joueur abandonne dès le début, mais si vous voyez plusieurs tentatives et que vous ne faites pas confiance à l'hôte, quittez la table. Il a été enregistré.
zero_trust.seat_recover_mismatch=Lors de la récupération du jeu, l’ordre de place envoyé par l’hôte "{0}" ne correspond PAS à celui que votre client avait enregistré : une personne que vous connaissiez déjà a changé de place à la table. Il s’agit peut-être d’un hébergeur qui tente de réorganiser les sièges sous couvert de la reprise.
zero_trust.seat_recover_mismatch_body=Votre client a conservé la référence de siège qu'il a vérifié lui-même au départ. Il est normal que des joueurs rejoignent ou partent entre les deux. Réorganiser quelqu'un qui était déjà là ne l'est pas. Si vous ne faites pas confiance à l'hôte, quittez la table. Il a été enregistré.
zero_trust.host_recover_action_forged=L'hôte a tenté d'injecter une action FORGÉE (signature invalide) lors de la récupération du jeu. Votre client l'a refusé.
zero_trust.host_recover_action_omitted=Lors de la récupération, l'hôte a omis une action que VOUS avez jouée et enregistrée dans votre base de données locale. Votre client l'a détecté par rapport à sa propre copie et n'a PAS abandonné silencieusement votre action.
zero_trust.host_recover_balance_mismatch=L'hôte a tenté de modifier votre solde (chips/cave) lors de la récupération du jeu : il ne correspond pas à votre record local. Votre client a conservé VOTRE véritable solde.
zero_trust.host_board_peek=L'hôte a demandé de décrypter une carte communautaire d'une rue FUTURE (une tentative de lire le tableau plus tôt). Votre client a refusé.
zero_trust.suspect_host_prefix=SUSPECT : hôte "{0}".
zero_trust.suspect_peer_prefix=SUSPECT : joueur "{0}".
zero_trust.peer_alert=⚠️ [COMPORTEMENT ANOMALEUX DU JOUEUR]
zero_trust.peer_suspicious_header=Un comportement anormal ou abusif de la part d'un joueur a été détecté à votre table :\n
zero_trust.peer_suspicious_body=La table a appliqué la mesure de sécurité correspondante et le jeu continue pour les autres joueurs. La bonne foi est présumée. Il pourrait s'agir d'un bug logiciel et personne n'est accusé. Les preuves sont enregistrées.
zero_trust.peer_inbound_flood=Trafic authentifié soutenu au-dessus du seuil anti-DoS.
zero_trust.peer_binary_flood=Opérations de messages vocaux envoyés à un rythme inhabituellement élevé.
zero_trust.host_binary_flood=L'hôte envoie des opérations de messages vocaux à un rythme inhabituellement élevé.
zero_trust.peer_flood_log=Incident anti-DoS en attente de décision : joueur {0}, IP {1}. Raison : {2}
zero_trust.peer_flood_confirm=L’utilisateur {0} envoie une quantité excessive de trafic. Cela pourrait être une attaque DoS ou un bug. Les expulser du jeu ?\n\nIP : {1}\nRaison détectée : {2}
zero_trust.peer_flood_suppress=Ne pas afficher ces avertissements
zero_trust.peer_hand_ready_withheld=Un joueur répond à PING mais ne confirme pas qu'il est prêt pour la prochaine main pendant que le jeu est en cours. Il gelait le démarrage manuel et a été EXPULSÉ. Le jeu continue sans eux.
zero_trust.peer_action_withheld=Un joueur répond à PING mais n'envoie pas son action de pari pendant que le jeu est en cours, au-delà de son temps de réflexion. Il gelait la ronde et a été EXPULSÉ. Le jeu continue sans eux.
zero_trust.peer_conf_withheld=Un joueur répond à PING mais ne confirme pas la réception d'un message de distribution pendant que le jeu est en cours. Il bloquait l'avancée de la table et a été EXPULSÉ. Le jeu continue sans eux.
zero_trust.peer_deal_refusal_expelled=Un joueur a forcé plusieurs annulations de main d'affilée en refusant le mélange ou la rotation du jeu. Il a été EXPULSÉ pour que le jeu puisse continuer.
zero_trust.suspicious_alert=⚠️ [COMPORTEMENT ANOMALEUX DU SERVEUR]
zero_trust.suspicious_header=Votre client a détecté un comportement anormal du serveur (pas un incident critique qui gèle le jeu) :\n
zero_trust.suspicious_body=Votre client a rejeté l'opération anormale et le jeu PEUT continuer. Nous partons du principe de bonne foi : il peut s'agir d'un BUG logiciel (client ou serveur) et personne n'est accusé. Mais comme un bug ne peut être distingué d'une falsification, POUR VOTRE SÉCURITÉ, IL EST FORTEMENT RECOMMANDÉ DE QUITTER cette table en utilisant le bouton 'Quitter' (votre argent ne sera PAS traité dans cette main).
zero_trust.host_bad_wire=Une demande de décryptage a été reçue du serveur avec un format invalide ou des points n'appartenant pas à la courbe cryptographique.
zero_trust.host_critical_command_invalid=La commande critique {0} envoyée par le serveur n’a pas pu être validée. Il peut s’agir d’une incompatibilité, d’un bug ou d’un serveur modifié. La session est arrêtée pour protéger son intégrité.
zero_trust.cheater_detected=[ZERO-TRUST] Un joueur avec une version CoronaPoker modifiée a été détecté, suggérant qu'il pourrait essayer de tricher. Voulez-vous continuer ?
zero_trust.corrupted_mac_action=Le serveur a tenté de traiter une action avec une signature cryptographique invalide (MAC corrompu) pour le compte de :
zero_trust.critical=\u274c [ZERO-TRUST] ALERTE CRITIQUE : SIGNATURE INVALIDE OU CONSENSUS RUPTURE.
zero_trust.critical_alert_body=ÉTAT DE QUARANTAINE ACTIVÉ :\nVotre client n'enverra plus de clés cryptographiques au serveur lors de cette session.\nLe jeu est mathématiquement gelé pour protéger votre solde.\n\nLes causes POSSIBLES sont :\n - un BUG dans le code client lui-même,\n - un BUG dans le code du serveur, ou\n - un SERVEUR dont le code peut avoir été modifié.\n\nLe client ne peut pas les distinguer et AUCUNE accusation n'est implicite. Pour des raisons de sécurité et en attendant l'examen de la cause profonde, il est RECOMMANDÉ de QUITTER ce jeu en utilisant le bouton « Quitter » (votre argent ne sera PAS traité dans cette main).
zero_trust.critical_alert_header=INCIDENT ZÉRO CONFIANCE !\n\nVotre client a détecté une anomalie dans le protocole cryptographique :\n
zero_trust.critical_session_error=[ZERO-TRUST] ERREUR DE SESSION CRITIQUE
zero_trust.decrypting_street=[ZERO-TRUST] DÉCRYPEMENT DE LA RUE...
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Délai d'expiration rapide du consensus. Forcer l’avancement.
zero_trust.forged_identity_action=Le serveur a tenté de traiter une action avec une fausse signature d'identité au nom de :
zero_trust.game_aborted=[ZERO-TRUST] Jeu abandonné. Kick les tricheurs.
zero_trust.generating_kem=[ZERO-TRUST] GÉNÉRATION DE KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ALERTE ZÉRO-TRUST] MAC invalide sur les cartes communautaires. Manipulations possibles.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZÉRO-CONFIANCE] VÉRIFICATION CRYPTOGRAPHIQUE PAR CONSENSUS : TOUS LES JOUEURS ONT CERTIFIÉ AVOIR RÉUSSI LEUR VÉRIFICATION CRYPTOGRAPHIQUE MANUELLE LOCALE.
zero_trust.legit2_error=\u274c [ZERO-TRUST] VÉRIFICATION CRYPTOGRAPHIQUE PAR CONSENSUS : AU MOINS UN JOUEUR N'A PAS CERTIFIÉ AVOIR RÉUSSI LEUR VÉRIFICATION CRYPTOGRAPHIQUE MANUELLE LOCALE.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] VÉRIFICATION CRYPTOGRAPHIQUE MANUELLE LOCALE : MES CARTES, CARTES COMMUNAUTAIRES ET TOUTES LES ACTIONS ENREGISTRÉES SONT LÉGITIMES.
zero_trust.legit_error=\u274c [ZERO-TRUST] VÉRIFICATION CRYPTOGRAPHIQUE MANUELLE LOCALE : IMPOSSIBLE DE GARANTIR QUE MES CARTES, CARTES COMMUNAUTAIRES ET TOUTES LES ACTIONS ENREGISTRÉES SONT LÉGITIMES.
zero_trust.lockdown_activated=\ud83d\udd12 [VERROUILLAGE] Quarantaine activée. Blocage de la transmission des clés cryptographiques.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Aucun journal binaire précédent pour cette main.
