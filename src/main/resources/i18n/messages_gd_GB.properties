radar.el_servidor_ha_activado_el=Tha am frithealaiche air an RADAR anti-meallta a chuir an gnìomh airson a’ gheama seo. Faodaidh cluicheadair sam bith aithisg an-aghaidh meallta iarraidh bho chluicheadair eile rè a’ gheama, a tha a’ toirt a-steach dealbh-sgrìn den chluicheadair (gun a bhith a’ sealltainn na cairtean aca) a bharrachd air an liosta pròiseas siostam aca.
radar.esta_funcionalidad_permite_a_cualquier=Leigidh am feart seo le cluicheadair sam bith dealbh-sgrìn agus liosta pròiseas fhaighinn de chluicheadair eile ma tha iad fo amharas gu bheil iad a’ mealladh no a’ cleachdadh bathar-bog treas-phàrtaidh. Mar aoigh, feuch an smaoinich thu air na buaidhean prìobhaideachd mus cuir thu an comas an roghainn seo (chan urrainnear atharrachadh ann am meadhan a’ gheama).\n\nAn aire: tha am feart seo gu tur an urra ri àrd-ùrlar, agus mar sin chan eilear cinnteach gun obraich e gu foirfe air a h-uile neach-dèiligidh.
