zero_trust.unlock_failed=\u274c [ZERO-TRUST] Dh’ fhàillig na cairtean prìobhaideach fhuasgladh (cha do fhreagair cluicheadair ann an ùine). Chaidh an làmh a chuir dheth.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Chan eil cairt dì-chrioptaichte a’ freagairt ri cairt dligheach sam bith san deic. Tha an geama air a chuir dheth.
peer.not_enough_players=Thuit cluicheadair tron ​​​​t-suidheachadh agus chan eil cluicheadairean gu leòr ann tuilleadh airson an làmh a làimhseachadh.
peer.unlock_no_testament=Chaidh cluicheadair a dhì-cheangal gun an iuchair dì-chrioptachaidh fhàgail. Chaidh an làmh a chuir dheth.
peer.broadcast_failed=Mearachd lìonra fhad 'sa bha sinn a' craoladh chairtean prìobhaideach. Chaidh an làmh a chuir dheth.
peer.recovery_action_data_unavailable=Cha b' urrainn dhuinn eachdraidh nan gnìomhan a chaidh a shàbhaladh a leughadh. Chaidh an làmh a chuir dheth gu sàbhailte agus tillidh i gu faighinn seachad air.
straddle.deferred_release_failed=Cha b’ urrainnear na cairtean geallaidhean dall straddle fhoillseachadh (cluicheadair air a dhì-cheangal no air diùltadh co-obrachadh). Chaidh an làmh a chuir dheth.
peer.state_inconsistent=Dh'fhàs staid an neach-reic neo-chunbhalach. Chaidh an làmh a chuir dheth.
peer.bot_no_token=Chan eil an iuchair dì-chrioptachaidh aige deiseil aig bot. Chaidh an làmh a chuir dheth.
peer.community_unlock_no_testament=Chaidh cluicheadair a dhì-cheangal gun an iuchair fhàgail gus cairtean coimhearsnachd fhoillseachadh. Chaidh an làmh a chuir dheth.
peer.dropped_during_cascade=Cluicheadair air a dhì-cheangal aig àm gluasad criptografach an deic. Chaidh an làmh a chuir dheth.
peer.dropped_during_rotation=Cluicheadair air a dhì-cheangal rè cuairteachadh criptografach an deic. Chaidh an làmh a chuir dheth.
zero_trust.rotation_refused=Dhiùlt cluicheadair ceangailte an iuchair cuairteachaidh deic a lìbhrigeadh. Tha an geama air a stad. Feumaidh iad fìreanachadh gu bheil iad a' diùltadh cead fhaighinn a-rithist.
zero_trust.cascade_refused=Dhiùlt cluicheadair ceangailte pàirt a ghabhail ann an cascade shuffle deic. Tha an geama air a stad. Feumaidh iad fìreanachadh gu bheil iad a' diùltadh cead fhaighinn a-rithist.
zero_trust.pocket_unlock_refused=Dhiùlt cluicheadair ceangailte an iuchair aca a lìbhrigeadh gus cairtean pòcaid a dhì-chrioptachadh. Tha an geama air a stad. Feumaidh iad fìreanachadh gu bheil iad a' diùltadh cead fhaighinn a-rithist.
zero_trust.community_unlock_refused=Dhiùlt cluicheadair ceangailte an iuchair aca a lìbhrigeadh gus cairtean coimhearsnachd fhoillseachadh. Tha an geama air a stad. Feumaidh iad fìreanachadh gu bheil iad a' diùltadh cead fhaighinn a-rithist.
zero_trust.host_showdown_sig_missing=Fhuaras iuchair taisbeanadh nan cairtean on fhrithealaiche GUN ainm-sgrìobhte criptografach an ùghdair, no le ainm-sgrìobhte mì-chruthaichte. Dh'fhaoidte gu bheil am frithealaiche a' cur na h-iuchrach air an uèir na àite.
zero_trust.host_showdown_sig_invalid=Chaidh iuchair taisbeanadh nan cairtean fhaighinn bhon t-seirbheisiche le ainm-sgrìobhte criptografach INVALID. Dh'fhaoidte gu bheil am frithealaiche a' cur na h-iuchrach air an uèir na àite.
zero_trust.host_potcards_mismatch=CHAN EIL an teacsa àbhaisteach taisbeanadh nan cairtean a chuir am frithealaiche a-steach a’ freagairt ris a’ bhuil bho bhith a’ dì-chrioptachadh a’ phìos ionadail agad leis an iuchair shoidhnichte. Is dòcha gu bheil am frithealaiche a’ cur chairtean meallta aig taisbeanadh nan cairtean.
zero_trust.host_community_garbage=Tha an dàta cairt coimhearsnachd criptografach a gheibhear bhon t-seirbheisiche neo-chunbhalach (chan eil am pìos air a dhì-chrioptachadh gu cairt deic dligheach, no chan eil e a’ freagairt ri sanas soidhnichte an fhrithealaiche). Adhbharan a dh’ fhaodadh a bhith ann: BUG ann an dreach air choreigin den bhathar-bog, dreach frithealaiche a dh’ fhaodadh a chòd atharrachadh, no coirbeachd iuchrach dearbh-aithne ionadail. Chan urrainn don neach-dèiligidh an diofar innse agus CHAN EIL a’ casaid neach sam bith.
zero_trust.host_unlock_out_of_order=Tha iarrtas dì-chrioptachaidh air fhaighinn bhon t-seirbheisiche a-mach à òrdugh (sràid cheàrr, slot a-rithist, ceum a-mach à òrdugh, no iarrtas a chaidh a chuir a-mach mus do dhùin an t-sràid roimhe).
zero_trust.host_cascade_mid_hand=Tha iarrtas ath-thòiseachadh shuffle air fhaighinn bhon fhrithealaiche ann am meadhan làmh leantainneach (bhiodh sgrìobhadh thairis air an iuchair dì-chrioptachaidh agam).
zero_trust.host_pocket_extraction=Chaidh iarrtas dì-chrioptachaidh fhaighinn bhon t-seirbheisiche a bheireadh buaidh air DO chairtean prìobhaideach FHÈIN.
zero_trust.host_community_extraction=Tha iarrtas dì-chrioptachaidh air fhaighinn bhon fhrithealaiche a dh'fhoillsicheadh ​​cairt coimhearsnachd air thoiseach air an àm.
zero_trust.host_rotation_replay=Dh'iarr am frithealaiche tionndadh cairt eile san aon làimh. Tha an cuairteachadh dligheach gun samhail gach làimh. Tha ath-aithris a’ moladh oidhirp an neach-dèiligidh agad a chleachdadh gus cairtean chluicheadairean eile a dhì-chrioptachadh.
zero_trust.host_shuffle_proof_failed=Dh’fhàillig dearbhadh a’ chùmhnaint: cha b’ urrainn an deic ris an do dhèilig an frithealaiche a bhith air a dhearbhadh mar shuffle onarach den deic genesis. Chaidh fuasglaidhean coimhearsnachd a dhiùltadh agus tha an seisean seo ga thoirt gu crìch gus cairtean prìobhaideach a dhìon.
zero_trust.host_shuffle_proof_missing=Ràinig an aonta às aonais dearbhadh onarach dearbhte airson an deic làimhe seo, agus tha cairtean coimhearsnachd a-nis gan foillseachadh. Is dòcha gur e bug no dàil lìonra a th’ ann, no neach-aoigheachd a tha a’ feuchainn ris a’ chùmhnant a làimhseachadh. Faodaidh tu cumail a’ cluich, ach thathas a’ moladh gu làidir am bòrd seo fhàgail.
zero_trust.deck_unverified=CHAN EIL deic na làimhe seo a dhearbhadh mar shuffle onarach. SUSPECT: aoigheachd “{0}”, a bhios a’ dèiligeadh agus a’ craoladh an dearbhadh shuffle. Is dòcha gur e an aoigh a bhios a’ làimhseachadh a’ chùmhnant no cluicheadair a chùm an dearbhadh aca air ais. Tha an làmh air a chluich a-mach oir tha na cairtean air an làimhseachadh mu thràth.
zero_trust.deck_unverified_body=Chaidh fianais soidhnichte den neo-riaghailteachd seo a chlàradh (ann an log a’ gheama, ann an dearg, agus anns a’ chlàr làmhan connspaideach). Faodaidh tu cumail a’ cluich, ach mura h-eil earbsa agad san aoigh, fàg am bòrd.
zero_trust.seat_redraw=Thug an aoigh “{0}” air tarraing cathair ÙR. Tha seo neo-àbhaisteach: tha an tarraing cruinn agus dearbhach, agus mar sin chan urrainn don aoigh na suidheachain a thaghadh, ach faodaidh e ath-rolladh gus am faigh e rèiteachadh as toil leis. Ma thèid e a-rithist, is dòcha gur e an aoigh a bhios a’ feuchainn ri do shuidheachan a chàradh.
zero_trust.seat_redraw_body=Bha an tarraing ùr a’ ruith san aon dòigh agus tha e fhathast ri dhearbhadh: chan urrainn do dhuine sam bith, an aoigh air a ghabhail a-steach, an toradh a thaghadh. Is dòcha gun tachair e ma thuit cluicheadair dìreach aig an toiseach, ach ma chì thu grunn ath-chuingean agus nach eil earbsa agad san òstair, fàg am bòrd. Tha e air a chlàradh.
zero_trust.seat_recover_mismatch=A thaobh faighinn seachad air geama, CHAN EIL an òrdugh suidhe a chuir an t-òstair “{0}” a-steach don fhear a shàbhail an neach-dèiligidh agad: tha cuideigin air an robh thu eòlach mu thràth air cathair aig a’ bhòrd atharrachadh. Is dòcha gur e aoigheachd a th’ ann a tha a’ feuchainn ris na suidheachain ath-òrdachadh fo chòmhdach an ath-bheothachaidh.
zero_trust.seat_recover_mismatch_body=Chùm an neach-dèiligidh agad an t-iomradh suidheachan a dhearbh e fhèin aig an toiseach. Tha e àbhaisteach do chluicheadairean a bhith a’ tighinn còmhla no a’ falbh eatorra. Ag ath-òrdachadh cuideigin a bha ann mar-thà nach eil. Mura h-eil earbsa agad san òstair, fàg am bòrd. Tha e air a chlàradh.
zero_trust.host_recover_action_forged=Dh’ fheuch an aoigh ri gnìomh FORGED (ainm-sgrìobhte neo-dhligheach) a thoirt a-steach aig àm faighinn seachad air a’ gheama. Dhiùlt an neach-dèiligidh agad e.
zero_trust.host_recover_action_omitted=Rè ath-bheothachadh dh'fhàg an t-òstair gnìomh a chluich thu agus a chlàraich thu san stòr-dàta ionadail agad. Lorg an neach-dèiligidh agad e an aghaidh a leth-bhreac fhèin agus CHAN EIL a’ leigeil às do ghnìomh gu sàmhach.
zero_trust.host_recover_balance_mismatch=Dh’ fheuch an t-òstair ri do chothromachadh atharrachadh (chips/ceannach a-steach) aig àm faighinn seachad air a’ gheama: chan eil e a’ freagairt ris a’ chlàr ionadail agad. Chùm an neach-dèiligidh agad AN fhìor chothromachadh agad.
zero_trust.host_board_peek=Dh’ iarr an aoigh cairt coimhearsnachd a dhì-chrioptachadh bho shràid FUTURE (oidhirp air am bòrd a leughadh tràth). Dhiùlt an neach-dèiligidh agad.
zero_trust.suspect_host_prefix=SUSPECT: òstair "{0}".
zero_trust.suspect_peer_prefix=SUSPECT: cluicheadair "{0}".
zero_trust.peer_alert=⚠️ [GIÙLAN ANOMALOUS PLAYER]
zero_trust.peer_suspicious_header=Chaidh giùlan neo-riaghailteach no maslach bho chluicheadair a lorg aig do bhòrd: \n
zero_trust.peer_suspicious_body=Chuir am bòrd an tomhas tèarainteachd co-ionnan an sàs agus tha an geama a’ leantainn airson na cluicheadairean eile. Thathas den bheachd gu bheil deagh chreideamh ann. Dh’ fhaodadh gur e bug bathar-bog a th’ ann agus chan eil duine fo chasaid. Tha an fhianais air a chlàradh.
zero_trust.peer_inbound_flood=Trafaic dearbhte seasmhach os cionn na stairsnich an-aghaidh DoS.
zero_trust.peer_binary_flood=Gnìomhan teachdaireachd-gutha air an cur aig ìre neo-àbhaisteach àrd.
zero_trust.host_binary_flood=Tha an aoigh a’ cur gnìomhachd teachdaireachd guth aig ìre neo-àbhaisteach àrd.
zero_trust.peer_flood_log=Tachartas anti-DoS a’ feitheamh ri co-dhùnadh: cluicheadair {0}, IP {1}. Adhbhar: {2}
zero_trust.peer_flood_confirm=Tha cleachdaiche {0} a’ cur cus trafaic air falbh. Dh’ fhaodadh seo a bhith na ionnsaigh DoS no bug. An cuir thu a-mach às a’ gheama iad? \n\nIP: {1}\nAdhbhar a chaidh a lorg: {2}
zero_trust.peer_flood_suppress=Na seall na rabhaidhean sin
zero_trust.peer_hand_ready_withheld=Bidh cluicheadair a 'freagairt PING ach chan eil e a' dearbhadh gu bheil e deònach an ath làmh fhad 'sa tha an geama a' ruith. Bha e a 'reothadh toiseach làimhe agus chaidh a chuir às. Tha an geama a 'leantainn às an aonais.
zero_trust.peer_action_withheld=Bidh cluicheadair a’ freagairt PING ach cha chuir e an gnìomh geall fhad ‘s a tha an geama a’ ruith, seachad air an ùine smaoineachaidh aige. Bha e a 'reothadh a' chuairt agus chaidh a chuir às. Tha an geama a 'leantainn às an aonais.
zero_trust.peer_conf_withheld=Bidh cluicheadair a’ freagairt PING ach chan eil e a’ dearbhadh gun d’ fhuair e teachdaireachd malairt fhad ‘s a tha an geama a’ ruith. Bha e a’ cur casg air a’ bhòrd bho bhith a’ gluasad air adhart agus chaidh a chuir às. Tha an geama a 'leantainn às an aonais.
zero_trust.peer_deal_refusal_expelled=Thug cluicheadair air grunn làmhan a chuir dheth ann an sreath le bhith a’ diùltadh an deic shuffle no an cuairteachadh. Chaidh a chuir a-mach gus an urrainn don gheama leantainn air adhart.
zero_trust.suspicious_alert=⚠️ [GIÙLAN FRITHEALAICHE NEO-RIAGHAILTEACH]
zero_trust.suspicious_header=Tha an neach-dèiligidh agad air giùlan frithealaiche neo-riaghailteach a lorg (chan e tachartas èiginneach a bhios a’ reothadh a’ gheama): \n
zero_trust.suspicious_body=Dhiùlt an neach-dèiligidh agad an gnìomhachd neo-riaghailteach agus faodaidh an geama leantainn air adhart. Tha sinn a’ gabhail ris le deagh rùn: dh’ fhaodadh gur e BUG bathar-bog (cliant no frithealaiche) a tha seo agus chan eil duine fo chasaid. Ach leis nach urrainnear innse mu bhiast a bharrachd air a bhith a’ cur dragh air, AIRSON DO SHÀBHAILTEACHD THA e air a mholadh gu làidir am bòrd seo fhàgail leis a’ phutan ‘Fàg’ (cha tèid an t-airgead agad a phròiseasadh san làimh seo).
zero_trust.host_bad_wire=Chaidh iarrtas dì-chrioptachaidh fhaighinn bhon fhrithealaiche le cruth neo-dhligheach no puingean nach buin don lùb criptografach.
zero_trust.host_critical_command_invalid=Cha b’ urrainn dhuinn an àithne èiginneach {0} a chuir am frithealaiche a-steach a dhearbhadh. Faodaidh gur e mì-fhreagarrachd a tha seo, bug no frithealaiche atharraichte. Tha an seisean air a stad gus a ionracas a dhìon.
zero_trust.cheater_detected=[ZERO-TRUST] Chaidh cluicheadair le dreach CoronaPoker atharraichte a lorg, a’ moladh gur dòcha gu bheil iad a’ feuchainn ri mealladh. A bheil thu airson leantainn air adhart?
zero_trust.corrupted_mac_action=Dh’fheuch am frithealaiche ri gnìomh a phròiseasadh le ainm-sgrìobhte criptografach mì-dhligheach (MAC truaillidh) às leth:
zero_trust.critical=\u274c [ZERO-TRUST] Rabhadh CRITICEACH: ainm-sgrìobhte neo-dhligheach NO co-aontachd briste.
zero_trust.critical_alert_body=STATE QUARANTINE air a ghnìomhachadh:\nCHAN EIL an neach-dèiligidh agad tuilleadh iuchraichean criptografach a chuir chun t-seirbheisiche san t-seisean seo.\nTha an geama reòta gu matamataigeach gus do chothromachadh a dhìon.\n\nIs e na h-adhbharan POSSIBLE:\n  - BUG anns a’ chòd teachdaiche fhèin,\n  - BUG ann an còd an fhrithealaiche, no\n  - FREAGAIRT a dh’ fhaodadh gun deach an còd atharrachadh.\n\nChan urrainn don neach-dèiligidh eadar-dhealachadh a dhèanamh eatorra agus chan eil casaid sam bith air a thuigsinn. Airson sàbhailteachd, agus a’ feitheamh ath-sgrùdadh air a’ bhun-adhbhar, thathas a’ MHOLADH gun fhàg thu an geama seo leis a’ phutan ‘Exit’ (cha tèid an t-airgead agad a phròiseasadh san làimh seo).
zero_trust.critical_alert_header=TACHARTAS ZERO-TRUST! \n\n Tha an neach-dèiligidh agad air neo-riaghailteachd a lorg anns a’ phròtacal criptografach: \n
