game.popup_verificacion_firma_invalida=Rè an làimh seo, aon no barrachd chom-pàirtichean ({0}) lorg e ainm-sgrìobhte criptografach neo-dhligheach air gnìomh.\n\nBha an dàta a fhuair a h-uile com-pàirtiche cunbhalach (cho-fhreagair na hashes slabhraidh mu dheireadh), ach cha deach co-dhiù aon ghnìomh a shoidhnigeadh gu ceart leis an ùghdar ris an robh dùil.\n\nSguir CoronaPoker dùnadh làimhe tèarainte agus dùinidh e am bòrd mar fhàiligeadh tèarainteachd às deidh don rabhadh seo aithneachadh.\n\nFianais air a shàbhaladh ann an:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Sanas: {0} cha d’ fhuair iad an dearbhadh onarach-shuffle airson an làmh seo. Fianais: {1}
game.popup_verificacion_host_sin_prueba=Aon no barrachd chom-pàirtichean ({0}) nach d’ fhuair an dearbhadh onorach air son na làimhe so.\n\nBidh an sreath mu dheireadh hashes a’ maidseadh thairis air a h-uile com-pàirtiche, agus mar sin tha na gnìomhan làimhe cunbhalach. Bidh aoigheachd ceart an-còmhnaidh a’ cur an dearbhaidh seo, agus mar sin dh’ fhaodadh neo-làthaireachd a-rithist no a tha air a thaghadh le co-aoisean a bhith a’ nochdadh bathar-bog atharraichte no uireasbhaidh bathar-bog.\n\nChaidh an làmh a shocrachadh, ach thathas a’ moladh a bhith a’ fàgail a’ gheama mar rabhadh.\n\nFianais air a shàbhaladh ann an:\n{1}
game.popup_verificacion_titulo_alerta=Eadar-dhealachadh dearbhaidh criptografach
game.popup_verificacion_titulo_aviso=Dearbhadh criptografach neo-iomlan
game.popup_verificacion_divergente=Thug aon no barrachd chom-pàirtichean cunntas air dearbhadh criptografach eadar-dhealaichte air an staid làimhe mu dheireadh.\n\nFaodaidh seo a bhith air adhbhrachadh le bathar-bog atharraichte no le uireasbhaidh bathar-bog. CoronaPoker chan urrainn dha adhbhar a dhearbhadh gu fèin-ghluasadach no cò às a thàinig e.\n\nSguir CoronaPoker dùnadh làimhe tèarainte agus dùinidh e am bòrd mar fhàiligeadh tèarainteachd às deidh don rabhadh seo aithneachadh.\n\nFianais air a shàbhaladh ann an:\n{0}
game.popup_verificacion_ausente=Cha b ’urrainn don làmh mu dheireadh co-aontachd a ruighinn oir cluicheadair {0} cha do chuir e ainm-sgrìobhte dùnaidh.\n\nDh’ fhaodadh seo a bhith air adhbhrachadh le briseadh lìonra, fàilligeadh teachdaiche no bathar-bog atharraichte. CoronaPoker stad air dùnadh làimhe tèarainte agus dùinidh e am bòrd mar fhàiligeadh tèarainteachd às deidh don rabhadh seo aithneachadh.\n\nFianais air a shàbhaladh ann an:\n{1}
game.mano_verificacion_interrumpida=CRITICEACH: Dh’ fhàillig dùnadh làimhe tèarainte ({0}). Dùinidh an clàr mar fhàilligeadh tèarainteachd. Fianais: {1}
