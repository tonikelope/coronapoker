tooltip.cfg.ante=A 'cur tabhartas èiginneach ris a' phoit às deidh an geallaidhean dall. The mode sets who pays and how much.
tooltip.cfg.ante_mode=Ann am modh traidiseanta, bidh gach cluicheadair gnìomhach a’ pàigheadh ​​10% den geall dall mòr. Ann am BBA, BA no SBA, bidh am putan geall dall mòr, putan no geall dall beag a’ pàigheadh ​​aon geall dall mòr. Geallaidhean dall air a phostadh an toiseach.
tooltip.cfg.blind_cap=A’ stad àrdachadh geallaidhean dall aig a’ chaip rèiteachaidh.
tooltip.cfg.blinds_level=A’ tòiseachadh geallaidhean dall (beag/mòr) airson a’ gheama.
tooltip.cfg.bot_balance=Nuair a thig an geama gu crìch, tha cothromachadh nam botaichean air a roinn gu cothromach am measg chluicheadairean daonna, agus mar sin chan eil fìor airgead air a shocrachadh ach eadar daoine.
tooltip.cfg.bot_rebuy=Smachd fèin-ghluasadach cruinne ath-cheannach airson a h-uile bot. Ma chuireas tu dheth e cuideachd cuiridh e à comas roghainnean ath-cheannach botaichean àbhaisteach.
tooltip.cfg.bots=Suidhich duilgheadas botaichean àbhaisteach. Bidh botaichean gnàthaichte a’ cumail an duilgheadas air a rèiteachadh leotha fhèin ann am Manaidsear Bot.
tooltip.cfg.buyin_fixed=Bidh a h-uile duine a’ tòiseachadh leis an aon ceannach a-steach. Nuair a bhios e dheth, bidh cluicheadairean a’ taghadh taobh a-staigh an raon rèiteachaidh.
tooltip.cfg.double_blinds=Adhartasan chun ath ìre geallaidhean dall san structar às deidh grunn làmhan no mionaidean.
tooltip.cfg.hand_limit=Thig an geama gu crìch nuair a ruigear an àireamh làimhe seo.
tooltip.cfg.iwtsth=A’ leigeil leat iarraidh làmh farpaiseach fhaicinn aig taisbeanadh nan cairtean.
tooltip.cfg.rabbit=A’ nochdadh cairtean coimhearsnachd nach deach dèiligeadh riutha às deidh an làmh. Tha a’ chiad iarrtas aig gach cluicheadair an-asgaidh. Bidh am modh taghte a’ suidheachadh a bheil iarrtasan nas fhaide air adhart a’ fuireach an-asgaidh no a’ cosg beagan no geall dall mòr.
tooltip.cfg.rebuy_limit=Ath-cheannach as àirde airson gach cluicheadair.
tooltip.cfg.recover=Ath-thòiseachadh geama a chaidh a bhriseadh roimhe.
tooltip.cfg.rit=A’ ceadachadh bhòt dèiligeadh ris na cairtean a tha air fhàgail dà uair nuair a dhùineas Uile a-steach geall.
tooltip.cfg.straddle=Faodaidh an cluicheadair às deidh an geall dall mòr dà geall dall mòr a phostadh mus faic iad na cairtean aca agus an preflop mu dheireadh a chuir an gnìomh.
tooltip.cfg.straddle_on_timeout=Post an straddle gu fèin-ghluasadach nuair a thig amannan sgiobalta a-mach. Cha toir seo buaidh ach air do chluicheadair agus tha e dheth gu bunaiteach.
tooltip.cfg.structure=Structar ìre Geallaidhean dall airson a’ gheama.
tooltip.cfg.think_time=Diogan rim faighinn airson co-dhùnadh. Bidh an gnìomh fèin-ghluasadach a’ ruith nuair a thig an ùine gu crìch.
tooltip.cfg.showdown_time=Diogan bidh an toradh làimhe a’ fuireach air an sgrion mus tèid dèiligeadh ris an ath làmh.
tooltip.cfg.allow_hot_join=A’ leigeil le cluicheadairean ùra a thighinn còmhla mar WARMING UP agus a dhol a-steach air an ath làimh. Nuair a thèid atharrachadh rè geama, cha toir e buaidh ach air oidhirpean ceangail ùra.
tooltip.cfg.card_flip_duration=Suidhich dè cho fada ‘s a bheir gach cairt gus a tionndadh a chrìochnachadh nuair a thèid fhoillseachadh.
tooltip.cfg.card_flip_direction=A’ taghadh dè an dòigh anns a thionndaidheas cairtean nuair a thèid am foillseachadh. Bidh measgachadh a’ taghadh stiùireadh airson gach foillseachadh. Bidh cairtean san aon bhuidheann a’ tionndadh còmhla san aon dòigh.
tooltip.cfg.card_flip_zoom=Meudaich cairtean rè an flip gus am bi coltas gu bheil iad a’ gluasad chun sgrion.
tooltip.cfg.reparto_velocidad=A’ suidheachadh dè cho fada ‘s a bheir gach cairt siubhal bhon deic chun t-suidheachain aige.
tooltip.cfg.community_deal_style=Tagh a bheil na còig cairtean coimhearsnachd air an làimhseachadh aghaidh sìos aig an toiseach no air an làimhseachadh air an t-sràid aca fhèin. Bidh atharrachaidhean sàbhalaidh a’ buntainn bhon ath làimh.
tooltip.cfg.anim_calidad=Bidh càileachd a’ cumail a h-uile mion-fhiosrachadh lèirsinneach. Bidh coileanadh a’ lughdachadh cosgais tursan-adhair cairt agus a’ nochdadh air coimpiutairean nas laige.
tooltip.cfg.downgrade_velocidad=A’ suidheachadh dè cho fada ‘s a bheir am bòrd gus na suidheachain aige ath-rèiteachadh nuair a dh’ fhalbhas cluicheadair.
tooltip.cfg.swap_velocidad=Suidhich dè cho fada ‘s a bheir na cairtean agad a dhol tarsainn nuair a thèid an òrdachadh.
tooltip.cfg.swap_estilo=Bidh Arc a’ togail aon chairt os cionn a’ chinn eile. Bidh còmhnard a 'dol thairis orra aig an aon àirde.
tooltip.cfg.resaltar_avatares=Le bhith a’ gabhail fois na luchaige airson mionaid air avatar cluicheadair chithear e air a leudachadh thairis air a’ bhòrd, ri taobh an ainm agus an stac, agus falbhaidh e nuair a ghluaiseas tu an luchag dheth.
tooltip.cfg.resaltar_jugada_showdown=Rè an taisbeanadh nan cairtean, le bhith a’ dol thairis air ainm làimhe cluicheadair sam bith (buannaiche no neach-call) chan eil sin a’ nochdadh ach na cairtean a tha ga dhèanamh suas agus a’ lughdachadh a’ chòrr.
tooltip.cfg.screenshot_fin_timba=Sàbhalaidh gu fèin-ghluasadach dealbh-sgrìn den sgrion mu dheireadh nuair a thig an cuntair airgid gu crìch (no nuair a dh’ fhàgas tu e, ma dh’ fhàgas tu nas luaithe).
tooltip.cfg.server_ip=Seòladh (IP no àrainn) far am bi frithealaiche a’ gheama ag èisteachd.
tooltip.cfg.server_port=port TCP bho 1 gu 65535 air a bheil am frithealaiche ag èisteachd.
tooltip.cfg.upnp=Ag iarraidh air an router agad am port TCP seo a chuir air adhart chun aoigh gus an dùin seisean a’ gheama.
tooltip.cfg.preset=A’ luchdachadh pròifil roghainnean sàbhalaidh.
tooltip.cfg.preset_save=Sàbhail na roghainnean gnàthach mar phròifil ath-chleachdadh.
tooltip.cfg.preset_delete=Sguab às a’ phròifil roghainnean taghte.
tooltip.cfg.buyin=Chips gach cluicheadair a 'tòiseachadh le aig a' bhòrd.
tooltip.cfg.buyin_range=Le caochladair ceannach a-steach, bidh gach cluicheadair a’ taghadh an ceannach a-steach taobh a-staigh an raoin seo (ann an geall dall mòr).
tooltip.cfg.volume=Meud iomlan de gheamannan.
tooltip.cfg.sound_master=A’ comasachadh no a’ cuir dheth ceòl, buadhan fuaim agus claisneachd cabadaich. Tha an tomhas-lìonaidh aige fhèin aig cluicheadair bhidio poker.
tooltip.cfg.music_master=Tionndaidh a h-uile ceòl air no dheth.
tooltip.cfg.fx_master=Tionndaidh a h-uile buaidh fuaim air no dheth.
tooltip.cfg.game_start_sound=Cluich am fuaim tòiseachaidh nuair a thòisicheas geama no nuair a thèid fhaighinn air ais.
tooltip.cfg.music_surface=A’ comasachadh a’ cheòl airson an sgrion no an àm seo. Bidh am putan cluiche ga ro-shealladh gun a bhith a’ fàgail Settings.
tooltip.cfg.recovery_music=A’ comasachadh a’ cheòl a bhios a’ cluich fhad ‘s a thathas a’ faighinn air ais geama briste.
tooltip.cfg.silly_sounds=A’ comasachadh fuaimean fealla-dhà a dh’ fhaodadh cluich tron gheama.
gdx.settings.tooltip.mod_audio_override=Tha an dreach a thug an MOD luchdaichte air a chleachdadh.
tooltip.cfg.play_own_notes=Bidh e cuideachd a’ cluich na notaichean guth agad fhèin air ais nuair a chuireas tu iad.
tooltip.cfg.notes_retention=A’ suidheachadh dè cho fada ‘s a tha notaichean guth air an cumail. Le “Gu bràth”, cha tèid an toirt às ach le làimh.
tooltip.cfg.purge_notes=Sguab às a h-uile nòta guth a chaidh a shàbhaladh an-dràsta.
tooltip.cfg.view_notes=A’ fosgladh an t-seallaidh airson notaichean guth a chaidh a shàbhaladh.
tooltip.cfg.voice_notes_rule=Riaghailt clàr: a’ ceadachadh notaichean guth a chuir agus fhaighinn.
tooltip.cfg.notes_local=A’ comasachadh notaichean gutha air an inneal agad (clàradh agus ath-chluich).
tooltip.cfg.tts=A’ leigeil le teachdaireachdan cabadaich bùird a bhith air an leughadh a-mach. Faodaidh gach cluicheadair teacsa-gu-cainnt a chuir dheth air an inneal aca.
tooltip.cfg.display_mode=Tagh eadar làn-sgrìn uinneig, gun chrìoch agus làn-sgrìn toirmeasgach. A’ buntainn ri sàbhaladh.
tooltip.cfg.compact_view=A’ crìonadh chips is chairtean gus barrachd bhùird a shealltainn. Stàitean: dheth, teann, teann le cairtean beaga, agus cuideachd do làmh fhèin.
tooltip.cfg.dialog_zoom=Sgèile còmhraidhean agus an teacsa aca. Chan urrainnear atharrachadh ach bhon sgrion tòiseachaidh. Tha e a’ buntainn ris an ath chòmhradh a dh’fhosglas tu.
tooltip.cfg.deck=Dealbhadh deic cairt.
tooltip.cfg.table_renderer=Tagh GDX no Swing Legacy airson an ath chlàr. Chan urrainn dha atharrachadh rè gèam.
tooltip.cfg.table_renderer_cli=Tha an renderer air a sparradh airson an ruith seo bhon loidhne-àithne.
tooltip.cfg.deck_back=Dealbhadh cùl cairt.
tooltip.cfg.table_felt=Dath a’ faireachdainn clàr.
tooltip.cfg.nivel_luz=Dè an ìre de shoilleireachd (%) a bhios am bòrd a’ cumail leis na solais dheth, ge bith an cuir thu dheth iad fhèin no ma thèid iad dheth leotha fhèin (stad, geama seachad). Mar as ìsle a tha e, is ann as dorcha a bhios e a’ coimhead. 35% a ghnàth.
