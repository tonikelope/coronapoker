radar.atencion_toda_esta_informacion_debe=RABHADH: feumaidh am fiosrachadh seo gu lèir a bhith air ath-sgrùdadh le làimh agus air a choimeasachadh gus co-dhùnadh an robh an cluicheadair a’ mealladh.
