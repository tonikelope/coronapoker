tooltip.cfg.custom_bots=A’ comasachadh an catalog gnàthaichte. Thèid pròifilean rèiteachaidh a chur ris an toiseach, agus an uairsin botaichean àbhaisteach.
tooltip.cfg.custom_bots.only=A’ cur casg air botaichean àbhaisteach a bhith air an cur ris. Chan urrainnear barrachd bhotan a chuir ris às deidh don chatalog àbhaisteach a bhith sgìth.
tooltip.cfg.custom_bots.manage=Fosgail am manaidsear gus na botaichean agad a chruthachadh, a dheasachadh agus òrdachadh. Faodaidh tu an duilgheadas agus an stoidhle aca a thaghadh.
tooltip.cfg.custom_bots.row=Tagh am bot seo gus ainm, avatar, duilgheadas, stoidhle no ath-cheannach a dheasachadh.
tooltip.cfg.custom_bots.avatar=Tagh ìomhaigh dhligheach no cùm an avatar bot oifigeil. Bidh CoronaPoker a’ stòradh leth-bhreac sàbhailte gus nach tèid e air chall.
tooltip.cfg.custom_bots.name=Cuir a-steach an t-ainm faicsinneach gun $. Thèid an comharra glèidhte a chuir ris gu fèin-ghluasadach.
tooltip.cfg.custom_bots.difficulty=Suidhich an dùbhlan agus na innleachdan a bhios am bot a’ cleachdadh. Bidh furasta a 'cluich gu cur-seachad, bidh Normal a' cleachdadh ro-innleachd nas smachdail agus bidh cruaidh a 'cleachdadh innleachdan adhartach.
tooltip.cfg.custom_bots.personality=A 'suidheachadh an stoidhle bunaiteach. Bidh air thuaiream ga thaghadh nuair a thèid am bot a chruthachadh agus ga chumail airson an t-seisein gnìomhach. Faodaidh am bot a cho-dhùnaidhean atharrachadh a rèir an t-suidheachaidh.
gdx.settings.option_help.bot_difficulty.easy=A’ cluich gu cas agus a’ dèanamh mhearachdan nas trice.
gdx.settings.option_help.bot_difficulty.medium=A’ cleachdadh ro-innleachd nas smachdail agus ag atharrachadh cho-dhùnaidhean mar a bhios an làmh a’ fàs.
gdx.settings.option_help.bot_difficulty.hard=A’ cleachdadh innleachdan nas adhartaiche, leithid a bhith a’ goid geallaidhean dall no a’ cur cuideam an sàs nuair a tha neach-dùbhlain a’ coimhead so-leònte.
gdx.settings.option_help.custom_bot_personality.random=Tagh stoidhle nuair a thèid am bot a chruthachadh agus ga chumail airson an t-seisein gnìomhach.
gdx.settings.option_help.custom_bot_personality.nit=A’ dol a-steach beagan làmhan agus mar as trice bidh i a’ feitheamh ri cairtean làidir mus cuir e cunnart air chips.
gdx.settings.option_help.custom_bot_personality.station=Tha e buailteach geall a ghairm agus fuireach nad làimh. Bidh e ag èirigh cho tric.
gdx.settings.option_help.custom_bot_personality.tag=A 'taghadh làmhan gu roghnach agus buailteach a bhith air thoiseach le geall is àrdachaidhean.
gdx.settings.option_help.custom_bot_personality.lag=A 'cluich raon nas fharsainge de làmhan agus a' cur cuideam air adhart le geall tric agus àrdachaidhean.
gdx.settings.option_help.ante_mode.traditional=Bidh gach cluicheadair gnìomhach a’ postadh an deicheamh cuid den geall dall mòr, cruinn chun cheud as fhaisge.
gdx.settings.option_help.ante_mode.big_blind=Bidh an cluicheadair anns na geall dall mòr a’ postadh an ante gu lèir, co-ionann ri aon geall dall mòr.
gdx.settings.option_help.ante_mode.button=Bidh an cluicheadair air a’ phutan a’ postadh an ante gu lèir, co-ionann ri aon geall dall mòr.
gdx.settings.option_help.ante_mode.small_blind=Bidh an cluicheadair anns na geall dall beag a’ postadh an ante gu lèir, co-ionann ri aon geall dall mòr.
gdx.settings.option_help.blind_unit.minutes=Tha an eadar-ama eadar àrdachadh geallaidhean dall air a thomhas ann am mionaidean de chluich.
gdx.settings.option_help.blind_unit.hands=Geallaidhean dall àrdachadh às deidh an àireamh de làmhan a chaidh a shònrachadh a chrìochnachadh.
gdx.settings.option_help.rebuy_cap.buy_in=Tha an stac as àirde agad às deidh ath-cheannach stèidhichte air ceannach a-steach a’ gheama.
gdx.settings.option_help.rebuy_cap.highest_stack=Ath-cheannach up to the largest stack at the table. The cap never falls below the standard ceannach a-steach.
gdx.settings.option_help.rabbit.off=Bidh cairtean coimhearsnachd undealt fhathast falaichte às deidh deireadh na làimhe.
gdx.settings.option_help.rabbit.free=Faodaidh tu iarraidh air cairtean coimhearsnachd nach deach dèiligeadh riutha fhaicinn às deidh an làmh a thighinn gu crìch gun a bhith a’ pàigheadh ​​chips.
gdx.settings.option_help.rabbit.free_small_blind=Tha a’ chiad iarrtas agad airson a’ gheama an-asgaidh. Tha gach iarrtas nas fhaide air adhart a’ cosg aon geall dall beag.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Tha a’ chiad iarrtas agad den gheama an-asgaidh, cosgaidh an dàrna fear geall dall beag, agus cosgaidh iarrtasan nas fhaide air adhart aon geall dall mòr.
gdx.settings.option_help.window_mode.exclusive=A’ cleachdadh modh làn-sgrìn an monitor.
gdx.settings.option_help.window_mode.borderless=A ’lìonadh an sgrion le uinneag gun chrìoch agus a’ cumail modh taisbeanaidh an deasg.
gdx.settings.option_help.window_mode.windowed=A’ fosgladh CoronaPoker ann an uinneag as urrainn dhut a ghluasad agus ath-mheudachadh.
gdx.settings.option_help.fps_limit.fixed=A 'suidheachadh ìre frèam as àirde stèidhichte. Faodaidh caip nas ìsle cleachdadh cumhachd a lughdachadh.
gdx.settings.option_help.fps_limit.monitor=A’ maidseadh caip ìre frèam ri ìre ùrachaidh an monitor a tha a’ taisbeanadh a’ gheama.
gdx.settings.option_help.msaa.0=Cuir à comas anti-aliasing multisample airson a’ bhùird agus an eadar-aghaidh. Tha feum air ath-thòiseachadh.
gdx.settings.option_help.msaa.2=A’ cleachdadh 2 shampall gach piogsail gus oirean rèidh le cosgais grafaig ìosal. Tha feum air ath-thòiseachadh.
gdx.settings.option_help.msaa.4=A’ cleachdadh 4 sampallan gach piogsail gus cosgaisean rèidh agus grafaigs a chothromachadh. Tha feum air ath-thòiseachadh.
gdx.settings.option_help.msaa.8=A’ cleachdadh 8 sampaill gach piogsail airson an rèidh as làidire a tha an suidheachadh seo a’ tabhann. Tha feum air ath-thòiseachadh.
gdx.settings.option_help.card_rendering.native=Tarraing cairtean gu dìreach gus cosgais tairgse a lughdachadh.
gdx.settings.option_help.card_rendering.smooth=A’ cleachdadh criathrag a bharrachd gus oirean cairt a dhèanamh rèidh aig cosgais grafaic nas àirde.
tooltip.cfg.custom_bots.automatic_rebuy=Leigidh am bot àbhaisteach seo ath-cheannach às deidh dha ruith a-mach à chips. Feumar smachd fèin-ghluasadach cruinne ath-cheannach a bhith air a chomasachadh.
tooltip.cfg.custom_bots.order_up=Gluais am pròifil taghte aon suidheachadh suas. Bidh an liosta ga leantainn nuair a tha feum air scrollaidh.
tooltip.cfg.custom_bots.order_down=Gluais am pròifil taghte aon suidheachadh sìos. Bidh an liosta ga leantainn nuair a tha feum air scrollaidh.
tooltip.cfg.custom_bots.random_selection=A’ gluasad a’ chatalog aon uair nuair a thèid lobaidh a chruthachadh. Chan fhaod gach bot àbhaisteach a dhol a-steach ach aon turas agus bidh an taghadh seasmhach airson an lobaidh sin.
tooltip.cfg.custom_bots.new=Ag ullachadh pròifil ùr gun a bhith ag atharrachadh na botaichean a chaidh a shàbhaladh mu thràth.
tooltip.cfg.custom_bots.save=Cuir ris a’ phròifil ùr no sàbhail na h-atharrachaidhean a chaidh a dhèanamh air a’ bhot taghte.
tooltip.cfg.custom_bots.delete=Thoir air falbh a’ phròifil taghte às deidh dhut dearbhadh iarraidh.
tooltip.cfg.custom_bots.close=A 'dùnadh a' mhanaidsear. Bidh pròifilean sàbhalaidh agus an òrdugh aca air an cumail gu fèin-ghluasadach.
