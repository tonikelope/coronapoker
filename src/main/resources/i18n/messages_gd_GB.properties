game.showdown_forfeit_msg=FIOSRACHADH: Dh’ fhàillig dearbhadh taisbeanadh nan cairtean airson a’ chluicheadair(ean) a leanas agus CHAN EIL na cairtean aca fhoillseachadh:\n\n%nicks% \n\nTha na cluicheadairean sin air an dùnadh a-mach à strì taisbeanadh nan cairtean (fèin-fhillte) agus chan urrainn dhaibh a’ phoit seo a bhuannachadh. Tha an geama a 'leantainn gu h-àbhaisteach.
zero_trust.peer_sra_corrupt=Tha an t-ainm-sgrìobhte taisbeanadh nan cairtean fìor ach chan eil iuchair SRA an t-seise a’ fuasgladh do chairtean dligheach. Cha tachair seo ach ma chuir an co-aoisean ainm ri iuchair coirbte a dh’aona ghnothach no ma tha an neach-dèiligidh aca buggy. Chan urrainn dhuinn innse dè, agus airson sàbhailteachd tha sinn a 'crìochnachadh a' gheama.
zero_trust.straddle_recover_mismatch=Fhad ‘s a bha e a’ faighinn air ais an làmh, dh’ainmich an aoigh straddle eadar-dhealaichte bhon fhear a bha an leth-bhreac ionadail agad fhèin air a chlàradh. Cha tachair seo ach ma tha an t-òstair a’ bualadh air an straddle a chaidh fhaighinn air ais no ma tha an neach-dèiligidh aige nam buga. Tha an làmh fhathast air ath-chruthachadh bhon leth-bhreac earbsach agad, ach tha sinn a’ toirt rabhadh dhut mar rabhadh.
zero_trust.rit_recover_mismatch=Fhad ‘s a bha e a’ faighinn air ais an làmh, dh’ainmich an aoigh toradh run-it-twice eadar-dhealaichte bhon fhear a bha an leth-bhreac ionadail agad fhèin air a chlàradh. Cha tachair seo ach ma tha an neach-aoigheachd a’ cur bacadh air an toradh a chaidh fhaighinn air ais no ma tha an neach-dèiligidh aige nam buggy. Tha an làmh fhathast air ath-chruthachadh bhon leth-bhreac earbsach agad, ach tha sinn a’ toirt rabhadh dhut mar rabhadh.
zero_trust.peer_sra_corrupt_registro=\u2014 taisbeanadh nan cairtean iuchair air a shoidhnigeadh ach chan eil i a’ fuasgladh do chairtean. Mealladh no bug teachdaiche a dh’ fhaodadh a bhith ann.
