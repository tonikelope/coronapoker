player.en_el_bmodo_recuperacionb_se=Anns <b>MODE SEACHDAIN</b> leanaidh an geama roimhe bhon àite a stad e:\n\n1) Tha <b>RIAGHLADH</b> gu bheil seann chluicheadairean a’ cleachdadh an <b>AN AON NICKS</b>.\n\n2) Gus leantainn air adhart bhon <b>PUING EXACT</b> as an làimh a tha e <b>RIAGHLADH</b> sin <b>UILE</b> Bidh seann chluicheadairean ag ath-cheangal. Mura h-eil seo comasach, thèid an làmh a bha a’ dol air adhart nuair a chaidh stad a chuir air a’ gheama a chall.\n\n3) <b>Cluicheadairean ùra</b> tha cead aca a dhol a-steach don gheama (bidh iad nan luchd-amhairc airson a’ chiad làimh).
