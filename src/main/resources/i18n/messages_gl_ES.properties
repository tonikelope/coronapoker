tooltip.cfg.custom_bots.name=Introduza o nome visible sen $. O marcador reservado engádese automaticamente.
tooltip.cfg.custom_bots.difficulty=Establece o desafío e as tácticas que usa o bot. Xogas fáciles de xeito recreativo, Normal usa unha estratexia máis disciplinada e Hard usa tácticas avanzadas.
tooltip.cfg.custom_bots.personality=Establece o estilo base. Escólleo aleatoriamente cando se crea o bot e gardao durante a sesión activa. O bot pode adaptar as súas decisións á situación.
gdx.settings.option_help.bot_difficulty.easy=Xoga casualmente e comete erros con máis frecuencia.
gdx.settings.option_help.bot_difficulty.medium=Utiliza unha estratexia máis disciplinada e axusta as decisións a medida que se desenvolve a man.
gdx.settings.option_help.bot_difficulty.hard=Usa tácticas máis avanzadas, como roubar cegas ou aplicar presión cando un opoñente parece vulnerable.
gdx.settings.option_help.custom_bot_personality.random=Escolle un estilo cando se crea o bot e gárdao para a sesión activa.
gdx.settings.option_help.custom_bot_personality.nit=Entra en poucas mans e normalmente espera cartas fortes antes de arriscar as fichas.
gdx.settings.option_help.custom_bot_personality.station=Tende a apostar e manterse na man. Aumenta con menos frecuencia.
gdx.settings.option_help.custom_bot_personality.tag=Escolle mans de forma selectiva e tende a tomar o liderado con apostas e aumentos.
gdx.settings.option_help.custom_bot_personality.lag=Xoga unha gama máis ampla de mans e aplica presión con apostas e aumentos frecuentes.
