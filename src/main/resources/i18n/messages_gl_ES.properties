peer.state_inconsistent=O estado do distribuidor fíxose inconsistente. A man foi cancelada.
peer.bot_no_token=Un bot non ten lista a súa clave de descifrado. A man foi cancelada.
peer.community_unlock_no_testament=Un xogador desconectouse sen deixar a súa chave para revelar as tarxetas comunitarias. A man foi cancelada.
