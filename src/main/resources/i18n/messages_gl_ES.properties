game.showdown_forfeit_msg=AVISO: fallou a verificación de mostra das cartas para os seguintes xogadores e NON se revelarán as súas cartas:\n\n%nicks%\n\nEses xogadores quedan excluídos da resistencia mostra das cartas (dobrar automaticamente) e NON PODEN gañar este bote. O xogo continúa normalmente.
zero_trust.peer_sra_corrupt=A sinatura mostra das cartas é xenuína, pero a clave SRA do compañeiro non se resolve en tarxetas válidas. Isto só ocorre se o compañeiro asinou intencionadamente unha clave corrupta ou se o seu cliente ten erros. Non podemos dicir cal, e por seguridade rematamos o partido.
zero_trust.straddle_recover_mismatch=Mentres recuperaba a man, o anfitrión anunciou un straddle diferente ao que gravara a túa propia copia local. Isto só ocorre se o host manipula o straddle recuperado ou o seu cliente ten erros. A man aínda está reconstruída a partir da túa copia de confianza, pero avisámosche por precaución.
zero_trust.rit_recover_mismatch=Mentres recuperaba a man, o anfitrión anunciou un resultado executado dúas veces diferente do que gravara a túa propia copia local. Isto só ocorre se o host manipula o resultado recuperado ou se o seu cliente ten erros. A man aínda está reconstruída a partir da túa copia de confianza, pero avisámosche por precaución.
zero_trust.peer_sra_corrupt_registro=\u2014 mostra das cartas a chave asinada pero non se resolve con tarxetas. Posible trampa ou erro do cliente.
