zero_trust.wait_sra_unlock=Agardamos polas chaves SRA para abrir {0}.
game.settlement_verification_wait=Agardamos polos recibos para verificar a man e confirmar os saldos.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [CONFIANZA CERO] Tempo de espera de consenso rápido. Forzando o avance.
zero_trust.forged_identity_action=O servidor tentou procesar unha acción cunha sinatura de identidade falsificada en nome de:
