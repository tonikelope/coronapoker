game.mano_verificacion_firma_invalida=⚠ Aviso: {0} detectou unha sinatura criptográfica non válida durante esta man. Detívose o peche seguro. Evidencia: {1}
game.popup_verificacion_firma_invalida=Durante esta man, un ou máis participantes ({0}) detectou unha sinatura criptográfica non válida nunha acción.\n\nOs datos recibidos por todos os participantes foron consistentes (os hash da cadea final coincidían), pero polo menos unha acción non foi asinada correctamente polo autor esperado.\n\nCoronaPoker detivo o peche seguro das mans e pechará a mesa como un fallo de seguridade despois de que se recoñeza esta advertencia.\n\nEvidencias gardadas en:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Aviso: {0} non recibiu a proba de baralla honesta para esta man. Evidencia: {1}
game.popup_verificacion_host_sin_prueba=Un ou máis participantes ({0}) non recibiu a proba de honestidade para esta man.\n\nOs hashs finais da cadea coinciden en todos os participantes, polo que as accións manuais son consistentes. Un servidor correcto sempre envía esta proba, polo que unha ausencia repetida ou selectiva por pares pode indicar un software modificado ou un defecto do software.\n\nA man estaba resolta, pero recoméndase abandonar o xogo por precaución.\n\nEvidencias gardadas en:\n{1}
game.popup_verificacion_titulo_alerta=Diverxencia de verificación criptográfica
game.popup_verificacion_titulo_aviso=Verificación criptográfica incompleta
game.popup_verificacion_divergente=Un ou máis participantes informaron dunha verificación criptográfica diferente do estado final da man.\n\nIsto pode ser causado por un software modificado ou por un defecto do software. CoronaPoker non pode determinar automaticamente a causa ou quen a orixinou.\n\nCoronaPoker detivo o peche seguro das mans e pechará a mesa como un fallo de seguridade despois de que se recoñeza esta advertencia.\n\nEvidencias gardadas en:\n{0}
game.popup_verificacion_ausente=A última man non puido chegar a un consenso porque o xogador {0} non enviou unha sinatura de peche.\n\nIsto pode ser causado por unha interrupción da rede, un fallo do cliente ou un software modificado. CoronaPoker detivo o peche seguro das mans e pecharase a mesa como un fallo de seguranza despois de que se recoñeza este aviso.\n\nEvidencia gardada en:\n{1}
game.mano_verificacion_interrumpida=CRÍTICO: fallou o peche seguro da man ({0}). A mesa pecharase por un fallo de seguridade. Evidencia: {1}
game.popup_verificacion_interrumpida=CoronaPoker non se puido completar o protocolo de peche criptográfico para a última man.\n\nFallo: {0}\n\nA man permanece aberta para a súa recuperación. A táboa pecharase como un fallo de seguranza só despois de que se recoñeza este aviso.\n\nEvidencia gardada en:\n{1}
