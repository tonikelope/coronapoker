tooltip.cfg.ante=Engade unha contribución forzada ao bote despois do cegas. O modo establece quen paga e canto.
tooltip.cfg.ante_mode=No modo Tradicional, cada xogador activo paga o 10% dos cega grande. En BBA, BA ou SBA, o botón cega grande ou cega pequena paga un cega grande. Cegas publícanse primeiro.
tooltip.cfg.blind_cap=As paradas cegas aumentan no límite configurado.
tooltip.cfg.blinds_level=A partir de cegas (pequeno/grande) para o xogo.
tooltip.cfg.bot_balance=Cando o xogo remata, o saldo combinado dos bots repártese por partes equitativas entre os xogadores humanos, polo que o diñeiro real só se liquida entre as persoas.
tooltip.cfg.bot_rebuy=Control automático global de recompra para cada bot. Ao desactivalo tamén se desactiva a configuración recompra dos bots personalizados.
tooltip.cfg.bots=Establece a dificultade dos bots estándar. Os bots personalizados manteñen a dificultade configurada individualmente no Xestor de bots.
tooltip.cfg.buyin_fixed=Todo o mundo comeza co mesmo entrada. Cando está desactivado, os xogadores elixen dentro do intervalo configurado.
tooltip.cfg.double_blinds=Avanza ao seguinte nivel cegas na estrutura despois dun número determinado de mans ou minutos.
tooltip.cfg.hand_limit=O xogo remata cando se alcanza este reconto de mans.
tooltip.cfg.iwtsth=Permíteche pedir ver a man dun rival ás mostra das cartas.
tooltip.cfg.rabbit=Revela as cartas comunitarias sen repartir despois da man. A primeira solicitude de cada xogador é gratuíta. O modo escollido establece se as solicitudes posteriores permanecen gratuítas ou custan un pequeno ou cega grande.
tooltip.cfg.rebuy_limit=Recompras máximas por xogador.
tooltip.cfg.recover=Retoma un xogo que foi interrompido anteriormente.
tooltip.cfg.rit=Permite un voto para repartir as cartas restantes dúas veces cando un Todo dentro pecha aposta.
tooltip.cfg.straddle=O xogador despois do cega grande pode publicar dous cega grande antes de ver as súas cartas e actuar no último preflop.
tooltip.cfg.straddle_on_timeout=Publica o straddle automaticamente cando se agote o tempo de espera. Isto afecta só ao teu reprodutor e está desactivado por defecto.
tooltip.cfg.structure=Estrutura de nivel Cegas para o xogo.
tooltip.cfg.think_time=Segundos dispoñibles para decidir. A acción automática execútase cando transcorre o tempo.
tooltip.cfg.showdown_time=Segundos, o resultado da man permanece na pantalla antes de que se reparte a seguinte man.
tooltip.cfg.allow_hot_join=Permite aos novos xogadores unirse como WARMING UP e entrar na seguinte man. Cando se cambia durante un xogo, só afecta aos novos intentos de conexión.
tooltip.cfg.card_flip_duration=Establece o tempo que tarda cada carta en completar a súa quenda cando se revela.
tooltip.cfg.card_flip_direction=Escolle de que xeito xiran as cartas cando se revelan. Mixed selecciona unha dirección para cada revelación. As cartas do mesmo grupo xiran xuntas do mesmo xeito.
tooltip.cfg.reparto_velocidad=Establece o tempo que tarda cada carta en viaxar desde a baralla ata o seu asento.
tooltip.cfg.community_deal_style=Escolle se as cinco cartas comunitarias se reparten boca abaixo ao principio ou na súa propia rúa. Os cambios gardados aplícanse desde a seguinte man.
tooltip.cfg.anim_calidad=A calidade mantén cada detalle visual. O rendemento reduce o custo dos voos con tarxeta e revélase en ordenadores máis débiles.
