zero_trust.invalid_mac=\u26a0\ufe0f [ALERTA DE CONFIANZA CERO] MAC non válida nas tarxetas comunitarias. Posible manipulación.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [CONFIANZA CERO] VERIFICACIÓN CRIPTOGRÁFICA DE CONSENSO: TODOS OS XOGADORES CERTIFICARON PASAR A SÚA VERIFICACIÓN CRIPTOGRÁFICA MANUAL LOCAL.
zero_trust.legit2_error=\u274c [CONFIANZA CERO] VERIFICACIÓN CRIPTOGRÁFICA DE CONSENSO: COMO MENOS UN XOGADOR NON CERTIFIOU PASAR A SÚA VERIFICACIÓN CRIPTOGRÁFICA MANUAL LOCAL.
zero_trust.legit=\u2714\ufe0f [CONFIANZA CERO] VERIFICACIÓN LOCAL CRIPTÓGRÁFICA MANUAL: AS MIÑAS TARXETAS, TARXETAS COMUNIDADES E TODAS LAS ACCIÓNS GRABADAS SON LEXÍTIMAS.
zero_trust.legit_error=\u274c [CONFIANZA CERO] VERIFICACIÓN LOCAL CRIPTÓGRÁFICA MANUAL: NON SE PODE GARANTIZAR DE QUE AS MIÑAS TARXETAS, TARXETAS COMUNIDADES E TODAS LAS ACCIÓNS GRABADAS SON LEXÍTIMAS.
zero_trust.lockdown_activated=\ud83d\udd12 [BLOQUEO] Activouse a corentena. Bloqueo da transmisión de claves criptográficas.
zero_trust.no_binary_log=\u26a0\ufe0f [CONFIANZA CERO] Non hai rexistro binario anterior para esta man.
