peer.dropped_during_rotation=Un xogador desconectado durante a rotación criptográfica do mazo. A man foi cancelada.
zero_trust.rotation_refused=Un xogador conectado negouse a entregar a súa chave de rotación do mazo. O xogo está detido. Deberán xustificar a súa negativa a ser readmitidos.
zero_trust.cascade_refused=Un xogador conectado negouse a participar na fervenza de barallas. O xogo está detido. Deberán xustificar a súa negativa a ser readmitidos.
zero_trust.pocket_unlock_refused=Un xogador conectado negouse a entregar a súa chave para descifrar as tarxetas de peto. O xogo está detido. Deberán xustificar a súa negativa a ser readmitidos.
zero_trust.community_unlock_refused=Un xogador conectado negouse a entregar a súa chave para revelar as tarxetas comunitarias. O xogo está detido. Deberán xustificar a súa negativa a ser readmitidos.
zero_trust.host_showdown_sig_missing=Recibiuse unha chave mostra das cartas do servidor SEN a sinatura criptográfica do autor ou cunha sinatura incorrecta. É posible que o servidor estea a substituír a chave do cable.
zero_trust.host_showdown_sig_invalid=Recibiuse unha chave mostra das cartas do servidor cunha sinatura criptográfica NON VÁLIDA. É posible que o servidor estea a substituír a chave do cable.
zero_trust.host_potcards_mismatch=O texto claro mostra das cartas enviado polo servidor NON COINCITE co resultado de descifrar a súa peza local coa clave asinada. É posible que o servidor estea enviando tarxetas falsas ao mostra das cartas.
zero_trust.host_community_garbage=Os datos criptográficos da tarxeta comunitaria recibidos do servidor son inconsistentes (a peza non se descifra a unha tarxeta de mazo válida ou non coincide co anuncio asinado do servidor). Posibles causas: un ERROR nalgunha versión do software, unha versión do servidor cuxo código puido ser alterado ou corrupción da clave de identidade local. O cliente non pode notar a diferenza e NON está acusando a ninguén.
zero_trust.host_unlock_out_of_order=Recibiuse unha solicitude de descifrado do servidor fóra de secuencia (rúa incorrecta, slot repetido, desactivación gradual ou solicitude emitida antes de que se pechase a rúa anterior).
zero_trust.host_cascade_mid_hand=Recibiuse unha solicitude de reinicio aleatorio do servidor no medio dunha man en curso (sobrescribiría a miña clave de descifrado).
zero_trust.host_pocket_extraction=Recibiuse unha solicitude de descifrado do servidor que afectaría ás SÚAS PROPIAS tarxetas privadas.
zero_trust.host_community_extraction=Recibiuse unha solicitude de descifrado do servidor que revelaría unha tarxeta comunitaria antes de tempo.
zero_trust.host_rotation_replay=O servidor solicitou unha segunda rotación de tarxetas na mesma man. A rotación lexítima é única por man. Unha repetición suxire un intento de usar o teu cliente para descifrar as tarxetas doutros xogadores.
zero_trust.host_shuffle_proof_failed=A verificación do acordo fallou: non se puido probar que o mazo que tratou o servidor fose unha baralla honesta do mazo de xénese. Os desbloqueos da comunidade foron rexeitados e esta sesión está a ser finalizada para protexer as tarxetas privadas.
zero_trust.host_shuffle_proof_missing=O trato chegou sen unha proba de baralla honesta verificable para o mazo desta man, e agora están a revelarse as cartas comunitarias. Pode ser un erro ou un atraso na rede, ou un anfitrión que intenta manipular o acordo. Podes seguir xogando, pero é moi recomendable deixar esta mesa.
zero_trust.deck_unverified=A baralla desta man NON se puido verificar como unha baralla honesta. SOSPECTO: anfitrión "{0}", que trata e transmite a proba aleatoria. Pode ser o anfitrión que manipule o trato ou un xogador que retivo a súa proba. A man xógase porque as cartas xa están repartidas.
zero_trust.deck_unverified_body=Rexistráronse probas asinadas desta anomalía (no rexistro do xogo, en vermello e na táboa de mans disputadas). Podes seguir xogando, pero se non confías no anfitrión, deixa a mesa.
zero_trust.seat_redraw=O anfitrión "{0}" forzou un NOVO sorteo de asentos. Isto é INUSUAL: o sorteo é colectivo e verificable, polo que o anfitrión non pode escoller os asentos, pero pode volver a tirar ata que consiga un arranxo que lle guste. Se se repite, pode ser o anfitrión que intente amañar o seu asento.
zero_trust.seat_redraw_body=O novo sorteo foi da mesma forma e aínda é verificable: ninguén, incluído o anfitrión, pode escoller o resultado. Pode ocorrer se un xogador caeu ao principio, pero se ves varios intentos e non confías no anfitrión, abandona a mesa. Rexistrouse.
zero_trust.seat_recover_mismatch=Na recuperación do xogo, a orde de asento enviada polo anfitrión "{0}" NON coincide coa que gardara o teu cliente: alguén que xa coñecías cambiou de asento na mesa. Pode ser un anfitrión que intente reordenar os asentos ao amparo da recuperación.
zero_trust.seat_recover_mismatch_body=O teu cliente conservou a referencia do asento que comprobou por si mesmo ao comezo. É normal que entren ou saian xogadores no medio. Reordenar a alguén que xa estaba alí non é. Se non confías no anfitrión, deixa a mesa. Rexistrouse.
zero_trust.host_recover_action_forged=O host intentou inxectar unha acción FORXADA (sinatura non válida) durante a recuperación do xogo. O teu cliente rexeitouno.
zero_trust.host_recover_action_omitted=Durante a recuperación, o host omitiu unha acción que TI xogaches e que rexistrara na túa base de datos local. O teu cliente detectouno contra a súa propia copia e NON abandonou silenciosamente a túa acción.
zero_trust.host_recover_balance_mismatch=O anfitrión intentou cambiar o teu saldo (fichas/entrada) durante a recuperación do xogo: non coincide co teu rexistro local. O teu cliente mantivo o teu equilibrio real.
zero_trust.host_board_peek=O anfitrión solicitou descifrar unha tarxeta comunitaria dunha rúa FUTURO (un intento de ler o taboleiro cedo). O teu cliente negouse.
zero_trust.suspect_host_prefix=SOSPECTO: host "{0}".
zero_trust.suspect_peer_prefix=SOSPECTO: xogador "{0}".
zero_trust.peer_alert=⚠️ [COMPORTAMENTO ANOMÁLICO DO XOGADOR]
zero_trust.peer_suspicious_header=Detectouse un comportamento anómalo ou abusivo dun xogador na túa mesa:\n
zero_trust.peer_suspicious_body=A táboa aplicou a medida de seguridade correspondente e o xogo continúa para os demais xogadores. Presúmese a boa fe. Pode ser un erro de software e ninguén está sendo acusado. A evidencia está rexistrada.
zero_trust.peer_inbound_flood=Tráfico sostido autenticado por encima do limiar anti-DoS.
zero_trust.peer_binary_flood=Operacións de mensaxes de voz enviadas a un ritmo inusualmente alto.
zero_trust.host_binary_flood=O anfitrión está a enviar operacións de mensaxes de voz a un ritmo inusualmente alto.
zero_trust.peer_flood_log=Incidente anti-DoS á espera dunha decisión: xogador {0}, IP {1}. Motivo: {2}
zero_trust.peer_flood_confirm=O usuario {0} está enviando unha cantidade excesiva de tráfico. Este pode ser un ataque DoS ou un erro. Expulsalos do xogo?\n\nIP: {1}\nMotivo detectado: {2}
zero_trust.peer_flood_suppress=Non mostre estes avisos
zero_trust.peer_hand_ready_withheld=Un xogador responde PING pero non confirma que está preparado para a seguinte man mentres o xogo está en execución. Estaba conxelando o arranque manual e foi EXPULSO. O xogo continúa sen eles.
zero_trust.peer_action_withheld=Un xogador responde PING pero non envía a súa acción de aposta mentres o xogo está en execución, pasado o seu tempo de reflexión. Estaba conxelando a rolda e foi EXPULSIÓN. O xogo continúa sen eles.
zero_trust.peer_conf_withheld=Un xogador responde PING pero non confirma a recepción dunha mensaxe de reparto mentres o xogo está en execución. Estaba bloqueando o avance da mesa e foi EXPULSADA. O xogo continúa sen eles.
zero_trust.peer_deal_refusal_expelled=Un xogador forzou varias cancelacións de mans seguidas ao rexeitar a baralla ou a rotación do mazo. Expulsouse para que o xogo poida continuar.
zero_trust.suspicious_alert=⚠️ [COMPORTAMENTO ANOMÁLICO DO SERVIDOR]
zero_trust.suspicious_header=O teu cliente detectou un comportamento anómalo do servidor (non é un incidente crítico que conxela o xogo):\n
zero_trust.suspicious_body=O teu cliente rexeitou a operación anómala e o xogo PODE continuar. Asumimos boa fe: isto pode tratarse dun ERROR de software (cliente ou servidor) e ninguén está sendo acusado. Pero dado que un erro non se pode diferenciar da manipulación, PARA A SÚA SEGURIDADE RECOMÁNDESE ENVÍTAMENTE SAÍR desta táboa mediante o botón 'Saír' (o seu diñeiro NON se procesará nesta man).
zero_trust.host_bad_wire=Recibiuse unha solicitude de descifrado do servidor cun formato non válido ou puntos que non pertencen á curva criptográfica.
zero_trust.host_critical_command_invalid=Non se puido validar o comando crítico {0} enviado polo servidor. Isto pode ser unha incompatibilidade, un erro ou un servidor modificado. A sesión detense para protexer a súa integridade.
zero_trust.cheater_detected=[CONFIANZA CERO] Detectouse un xogador cunha versión CoronaPoker modificada, o que suxire que podería estar tentando facer trampas. Queres continuar?
zero_trust.corrupted_mac_action=O servidor tentou procesar unha acción cunha sinatura criptográfica non válida (MAC danada) en nome de:
zero_trust.critical=\u274c [CERO CONFIANZA] ALERTA CRÍTICA: SINATURA NON VÁLIDA OU CONSENSO ROMATO.
zero_trust.critical_alert_body=ESTADO DE CARENTENA ACTIVADO:\nO teu cliente NON enviará máis chaves criptográficas ao servidor nesta sesión.\nO xogo está matematicamente conxelado para protexer o teu equilibrio.\n\nAs POSIBLES causas son:\n  - un ERROR no propio código do cliente,\n  - un ERROR no código do servidor, ou\n  - un SERVIDOR cuxo código puido ser alterado.\n\nO cliente non pode distinguir entre eles e NON hai acusación implícita. Por seguridade, e á espera da revisión da causa raíz, RECOMÉNDANSE que abandones este xogo usando o botón "Saír" (o teu diñeiro NON se procesará nesta man).
zero_trust.critical_alert_header=INCIDENTE DE CONFIANZA CERO!\n\nO teu cliente detectou unha anomalía no protocolo criptográfico:\n
zero_trust.critical_session_error=[CERO CONFIANZA] ERRO CRÍTICO DA SESIÓN
zero_trust.decrypting_street=[CERO-CONFIANZA] DESCRIPTANDO A RÚA...
