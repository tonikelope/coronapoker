zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Gyors konszenzus időtúllépés. Előrelépés kényszerítése.
zero_trust.forged_identity_action=A szerver megkísérelt feldolgozni egy műveletet hamisított azonosító aláírással a következő nevében:
zero_trust.game_aborted=[ZERO-TRUST] A játék megszakadt. Rúgd a csalókat.
