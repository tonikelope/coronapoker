peer.not_enough_players=Egy játékos kiesett a keverés közben, és már nincs elég játékos a leosztáshoz.
peer.unlock_no_testament=Egy játékos megszakította a kapcsolatot anélkül, hogy elhagyta volna a visszafejtési kulcsát. A leosztást törölték.
peer.broadcast_failed=Hálózati hiba a privát kártyák sugárzása közben. A leosztást törölték.
peer.recovery_action_data_unavailable=A mentett műveleti előzmények nem olvashatók. A leosztást biztonságosan törölték, és visszatér a gyógyuláshoz.
straddle.deferred_release_failed=A vakok straddle kártyákat nem lehetett felfedni (egy játékos megszakadt vagy megtagadta az együttműködést). A leosztást törölték.
peer.state_inconsistent=A kereskedő állapota következetlen lett. A leosztást törölték.
peer.bot_no_token=A botnak nincs készen a visszafejtési kulcsa. A leosztást törölték.
peer.community_unlock_no_testament=Egy játékos megszakadt anélkül, hogy elhagyta volna a kulcsát, hogy felfedje a közös lapokat. A leosztást törölték.
peer.dropped_during_cascade=Egy játékos megszakadt a pakli kriptográfiai keverése közben. A leosztást törölték.
peer.dropped_during_rotation=Egy játékos megszakadt a pakli kriptográfiai forgatása közben. A leosztást törölték.
zero_trust.rotation_refused=Egy csatlakoztatott játékos megtagadta a pakliforgató kulcs átadását. A játék leáll. Indokolniuk kell az újbóli befogadás elutasítását.
zero_trust.cascade_refused=Egy csatlakoztatott játékos megtagadta, hogy részt vegyen a pakli keverési kaszkádjában. A játék leáll. Indokolniuk kell az újbóli befogadás elutasítását.
zero_trust.pocket_unlock_refused=Egy csatlakoztatott játékos nem volt hajlandó átadni a kulcsát a zsebkártyák visszafejtéséhez. A játék leáll. Indokolniuk kell az újbóli befogadás elutasítását.
zero_trust.community_unlock_refused=Egy kapcsolt játékos nem volt hajlandó átadni a kulcsát a közös lapok felfedéséhez. A játék leáll. Indokolniuk kell az újbóli befogadás elutasítását.
zero_trust.host_showdown_sig_missing=Egy mutatás kulcs érkezett a szerverről a szerző kriptográfiai aláírása nélkül, vagy hibás aláírással. Lehet, hogy a szerver helyettesíti a kulcsot a vezetéken.
zero_trust.host_showdown_sig_invalid=Egy mutatás kulcs érkezett a szervertől ÉRVÉNYTELEN kriptográfiai aláírással. Lehet, hogy a szerver helyettesíti a kulcsot a vezetéken.
zero_trust.host_potcards_mismatch=A kiszolgáló által küldött mutatás egyszerű szöveg NEM egyezik meg a helyi darab aláírt kulccsal történő visszafejtésének eredményével. Lehet, hogy a szerver hamis kártyákat küld a mutatás címre.
zero_trust.host_community_garbage=A szervertől kapott kriptográfiai közösségi kártya adatok inkonzisztensek (a darab nem dekódol vissza érvényes paklikártyára, vagy nem egyezik a szerver aláírt bejelentésével). Lehetséges okok: HIBA a szoftver egyes verzióiban, olyan kiszolgálóverzió, amelynek kódja megváltozhatott, vagy helyi identitáskulcs sérülése. Az ügyfél nem tud különbséget tenni, és NEM vádol senkit.
zero_trust.host_unlock_out_of_order=A kiszolgálótól soron kívül érkezett visszafejtési kérés (rossz utca, ismétlődő hely, üzemzavar, vagy az előző utca bezárása előtt kiadott kérés).
zero_trust.host_cascade_mid_hand=Kevert sorrendű újraindítási kérés érkezett a szervertől egy folyamatban lévő leosztás közben (felülírná a visszafejtő kulcsomat).
zero_trust.host_pocket_extraction=Visszafejtési kérés érkezett a szervertől, amely érinteni fogja az ÖN SAJÁT privát kártyáit.
zero_trust.host_community_extraction=Dekódolási kérés érkezett a szervertől, amely idő előtt felfedné a közös kártyát.
zero_trust.host_rotation_replay=A szerver egy második kártyaforgatást kért ugyanabban a leosztásban. A törvényes forgatás leosztásonként egyedi. Az ismétlés azt sugallja, hogy a kliensével próbálják megfejteni más játékosok kártyáit.
zero_trust.host_shuffle_proof_failed=Az üzlet ellenőrzése meghiúsult: a szerver által forgalmazott pakliról nem lehetett bizonyítani, hogy a genesis pakli becsületes keverése. A közösségi feloldásokat elutasították, és ezt a munkamenetet a privát kártyák védelme érdekében leállítják.
zero_trust.host_shuffle_proof_missing=Az üzlet anélkül érkezett meg, hogy ennek a leosztásnak a paklijában ellenőrizhető őszinte keverés bizonyítéka lett volna, és most kiderülnek a közös lapok. Lehet, hogy hiba vagy hálózati késés, vagy egy gazdagép próbálja manipulálni az üzletet. Folytathatod a játékot, de erősen ajánlott elhagyni ezt az asztalt.
zero_trust.deck_unverified=Ennek a leosztásnak a paklija NEM igazolható becsületes keverésnek. GYANÚSÍTOTT: "{0}" műsorvezető, aki osztja és sugározza a véletlenszerű próbát. Lehet, hogy a házigazda manipulálja az üzletet, vagy egy játékos, aki visszatartotta a bizonyítékát. A leosztást azért játsszák ki, mert a lapok már ki vannak osztva.
zero_trust.deck_unverified_body=Ennek az anomáliának aláírt bizonyítékát rögzítettük (a játéknaplóban, pirossal és a vitatott kezek táblázatában). Játszhatsz tovább, de ha nem bízol a házigazdában, hagyd el az asztalt.
zero_trust.seat_redraw=A "{0}" műsorvezető ÚJ helysorsolást kényszerített ki. Ez SZOKatlan: a sorsolás kollektív és ellenőrizhető, így a házigazda nem tudja kiválasztani a helyeket, de újra dobhatja, amíg meg nem kapja a neki tetsző elrendezést. Ha megismétlődik, akkor előfordulhat, hogy a házigazda megpróbálja elrontani az ülést.
zero_trust.seat_redraw_body=Az új sorsolás ugyanúgy lezajlott, és továbbra is ellenőrizhető: senki, beleértve a házigazdát, nem választhatja meg a végeredményt. Megtörténhet, ha egy játékos rögtön az elején kiesett, de ha több próbálkozást lát, és nem bízik a házigazdában, hagyja el az asztalt. Naplózásra került.
zero_trust.seat_recover_mismatch=A játék helyreállításakor a "{0}" gazdagép által küldött üléssor NEM egyezik meg azzal, amelyet az ügyfele mentett el: valaki, akit már ismert, helyet cserélt az asztalnál. Lehet, hogy egy fogadó próbálja átrendezni az üléseket a helyreállítás fedezete alatt.
zero_trust.seat_recover_mismatch_body=Ügyfele megőrizte az ülőhely-referenciát, amelyet az elején maga ellenőrzött. Normális, ha közben csatlakoznak vagy távoznak a játékosok. Nem lehet újrarendelni valakit, aki már ott volt. Ha nem bízik a házigazdában, hagyja el az asztalt. Naplózásra került.
zero_trust.host_recover_action_forged=A gazdagép megpróbált beadni egy HAMISÍTOTT műveletet (érvénytelen aláírást) a játék helyreállítása során. Ügyfele visszautasította.
zero_trust.host_recover_action_omitted=A helyreállítás során a gazdagép kihagyott egy olyan műveletet, amelyet Ön játszott le, és amelyet a helyi adatbázisban rögzített. Ügyfele a saját példányán észlelte, és NEM ejtette el csendben a műveletet.
zero_trust.host_recover_balance_mismatch=A házigazda megpróbálta megváltoztatni az egyenlegedet (zseton/beülő) a játék helyreállítása közben: nem egyezik a helyi rekorddal. Ügyfele megőrizte valódi egyensúlyát.
zero_trust.host_board_peek=A házigazda egy JÖVŐ utcából származó közös kártya visszafejtését kérte (kísérlet a tábla korai olvasására). Ügyfele visszautasította.
zero_trust.suspect_host_prefix=SUSPECT: host "{0}".
zero_trust.suspect_peer_prefix=GYANÚSÍTOTT: „{0}” játékos.
zero_trust.peer_alert=⚠️ [ANOMÁLÁS JÁTÉKOS MAGATARTÁS]
zero_trust.peer_suspicious_header=Egy játékos rendellenes vagy sértő viselkedését észlelték az asztalodnál:\n
zero_trust.peer_suspicious_body=A táblázat alkalmazta a megfelelő biztonsági intézkedést, és a játék folytatódik a többi játékos számára. A jóhiszeműség feltételezhető. Lehet, hogy szoftverhiba, és senkit sem vádolnak. A bizonyítékokat rögzítik.
zero_trust.peer_inbound_flood=Tartós hitelesített forgalom a DoS-ellenes küszöbérték felett.
zero_trust.peer_binary_flood=Szokatlanul nagy sebességgel küldött hangüzenet-műveletek.
zero_trust.host_binary_flood=A gazdagép szokatlanul nagy sebességgel küld hangüzenet-műveleteket.
zero_trust.peer_flood_log=Döntésre váró Anti-DoS incidens: játékos {0}, IP {1}. Ok: {2}
zero_trust.peer_flood_confirm=A {0} felhasználó túl nagy forgalmat küld. Ez lehet DoS támadás vagy hiba. Kizárni őket a játékból?\n\nIP: {1}\nÉszlelt ok: {2}
zero_trust.peer_flood_suppress=Ne jelenítse meg ezeket a figyelmeztetéseket
zero_trust.peer_hand_ready_withheld=Egy játékos válaszol PING-re, de nem erősíti meg, hogy készen áll a következő leosztásra, miközben a játék fut. Lefagyasztotta a kézi indítást, és KIÁLLÍTOTTAK. A játék nélkülük folytatódik.
zero_trust.peer_action_withheld=Egy játékos válaszol a PING-re, de nem küldi el a fogadási akcióját, miközben a játék fut, a gondolkodási idejének lejártával. Lefagyott a körben, és KIFIZETETT. A játék nélkülük folytatódik.
zero_trust.peer_conf_withheld=Egy játékos válaszol PING-re, de nem erősíti meg az osztóüzenet kézhezvételét, miközben a játék fut. Megakadályozta az asztal előrehaladását, és KIÁLLÍTOTT. A játék nélkülük folytatódik.
zero_trust.peer_deal_refusal_expelled=Egy játékos egymás után több leosztást kényszerített ki, mivel megtagadta a pakli keverését vagy elforgatását. KIADTA, így folytatható a játék.
zero_trust.suspicious_alert=⚠️ [ANOMÁLÁS SZERVER MAGATARTÁS]
zero_trust.suspicious_header=Az Ön kliense rendellenes kiszolgálói viselkedést észlelt (nem olyan kritikus incidenst, amely leállítja a játékot):\n
zero_trust.suspicious_body=Ügyfele elutasította a rendellenes műveletet, és a játék folytatható. Feltételezzük, hogy jóhiszeműen: ez lehet szoftverhiba (kliens vagy szerver), és senkit sem vádolnak meg. De mivel egy hibát nem lehet megkülönböztetni a manipuláción kívül, az Ön BIZTONSÁGA ÉRDEKÉBEN ERŐSEN AJÁNLOTT HAGYJA EL ezt az asztalt a 'Kilépés' gombbal (a pénzét NEM dolgozzuk fel ebben a leosztásban).
zero_trust.host_bad_wire=Visszafejtési kérés érkezett a szervertől érvénytelen formátummal vagy pontokkal, amelyek nem tartoznak a kriptográfiai görbéhez.
zero_trust.host_critical_command_invalid=A szerver által küldött kritikus {0} parancs nem érvényesíthető. Ez lehet inkompatibilitás, hiba vagy módosított szerver. A munkamenetet leállítják az integritás védelme érdekében.
zero_trust.cheater_detected=[ZERO-TRUST] Egy módosított CoronaPoker verziójú játékost észleltünk, ami arra utal, hogy csalni próbál. Folytatja?
zero_trust.corrupted_mac_action=A szerver megpróbált feldolgozni egy műveletet érvénytelen kriptográfiai aláírással (sérült MAC) a következő nevében:
zero_trust.critical=\u274c [NULLA MEGBÍZHATÓSÁG] KRITIKUS FIGYELMEZTETÉS: ÉRVÉNYTELEN ALÁÍRÁS VAGY TÖRTÉNŐ KONSZENZUS.
zero_trust.critical_alert_body=KARANTÉN ÁLLAPOT AKTIVÁLT:\nEbben a munkamenetben az Ön kliense NEM küld több kriptográfiai kulcsot a szervernek.\nA játék matematikailag lefagyott, hogy megvédje az egyensúlyát.\n\nA LEHETSÉGES okok a következők:\n  - BUG magában a kliens kódban,\n  - BUG a szerver kódjában, vagy\n  - egy SZERVER, amelynek kódja megváltozhatott.\n\nAz ügyfél nem tud különbséget tenni közöttük, és NINCS vádaskodó. A biztonság kedvéért és a kiváltó ok felülvizsgálatáig AJÁNLOTT HAGYJA EL ezt a játékot a „Kilépés” gombbal (a pénzét NEM dolgozzuk fel ebben a leosztásban).
zero_trust.critical_alert_header=NULLA BIZTONSÁGI ESEMÉNY!\n\nKliense anomáliát észlelt a kriptográfiai protokollban:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITIKUS MUNKAHELYI HIBA
