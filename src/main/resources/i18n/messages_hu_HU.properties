tooltip.cfg.ante=Kényszer hozzájárulást ad a pothoz a vakok után. A mód beállítja, hogy ki és mennyit fizessen.
tooltip.cfg.ante_mode=Hagyományos módban minden aktív játékos a nagyvak 10%-át fizeti. A BBA, BA vagy SBA esetében a nagyvak, a gomb vagy a kisvak egy nagyvak-t fizet. Vakok kerülnek először közzé.
