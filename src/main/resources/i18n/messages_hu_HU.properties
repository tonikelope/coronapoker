tooltip.cfg.bot_balance=Amikor a játék véget ér, a botok egyenlege egyenlő arányban oszlik meg az emberi játékosok között, így a valódi pénz csak az emberek között oszlik meg.
tooltip.cfg.bot_rebuy=Globális automatikus újravásárlás vezérlés minden bothoz. A kikapcsolása letiltja az egyéni robotok újravásárlás beállításait is.
tooltip.cfg.bots=Beállítja a szabványos robotok nehézségét. Az egyéni robotok a nehézségeket külön-külön konfigurálják a Bot Managerben.
tooltip.cfg.buyin_fixed=Mindenki ugyanazzal a beülő-vel kezdi. Kikapcsolt állapotban a játékosok a beállított tartományon belül választhatnak.
tooltip.cfg.double_blinds=A következő vakok szintre lép a szerkezetben meghatározott számú leosztás vagy perc után.
tooltip.cfg.hand_limit=A játék akkor ér véget, amikor eléri ezt a kézszámot.
tooltip.cfg.iwtsth=Lehetővé teszi, hogy megkérje a rivális kezét mutatás-kor.
tooltip.cfg.rabbit=A leosztás után felfedi a fel nem osztott közös lapokat. Minden játékos első kérése ingyenes. A választott mód beállítja, hogy a későbbi kérések ingyenesek maradjanak-e, vagy egy kis vagy nagyvak-ba kerüljenek.
tooltip.cfg.rebuy_limit=Maximum rebuy játékosonként.
tooltip.cfg.recover=A korábban megszakított játék folytatása.
tooltip.cfg.rit=Lehetővé teszi a szavazás a fennmaradó lapok kétszeri kiosztását, amikor egy All-in zárja a fogadást.
tooltip.cfg.straddle=A nagyvak utáni játékos kiírhat két nagyvak-t, mielőtt látná a lapjait, és az utolsó preflop felléphet.
tooltip.cfg.straddle_on_timeout=A straddle automatikus közzététele, amikor a felszólítás időtúllépése megszűnik. Ez csak a lejátszót érinti, és alapértelmezés szerint ki van kapcsolva.
tooltip.cfg.structure=Vakok szintű struktúra a játékhoz.
tooltip.cfg.think_time=Másodpercek állnak rendelkezésre a döntéshez. Az automatikus művelet az idő lejártakor indul el.
tooltip.cfg.showdown_time=A leosztás eredménye másodpercekkel a képernyőn marad a következő leosztás előtt.
tooltip.cfg.allow_hot_join=Lehetővé teszi, hogy új játékosok csatlakozzanak WARMING UP-ként, és belépjenek a következő leosztásba. Ha játék közben változtatjuk, az csak az új csatlakozási kísérleteket érinti.
tooltip.cfg.card_flip_duration=Beállítja, hogy az egyes kártyák felfedésekor mennyi időbe telik a kör befejezése.
tooltip.cfg.card_flip_direction=Kiválasztja, hogy a kártyák milyen irányba forduljanak felfedésekor. A Vegyes beállítás minden egyes felfedés irányát választja ki. Az ugyanabban a csoportban lévő kártyák ugyanúgy fordulnak össze.
tooltip.cfg.reparto_velocidad=Beállítja, hogy az egyes kártyák mennyi ideig utazzanak a pakliból a helyére.
tooltip.cfg.community_deal_style=Válaszd ki, hogy mind az öt közös lapot képpel lefelé adják ki az elején, vagy a saját utcájukban. A mentett módosítások a következő leosztástól érvényesek.
tooltip.cfg.anim_calidad=A minőség minden vizuális részletet megtart. A teljesítmény csökkenti a kártyás repülések költségeit, és gyengébb számítógépeken felfedi.
tooltip.cfg.downgrade_velocidad=Beállítja, hogy az asztal mennyi ideig tart átrendezni a helyeit, amikor egy játékos távozik.
tooltip.cfg.swap_velocidad=Beállítja, hogy mennyi időbe telik a kártyák keresztezése rendezéskor.
tooltip.cfg.swap_estilo=Arc egyik kártyát a másik fölé emeli. Vízszintes keresztezi őket azonos magasságban.
tooltip.cfg.resaltar_avatares=Ha az egeret egy pillanatra a játékos avatarján pihenteti, az az asztal felett kinagyítva jelenik meg, a neve és a köteg mellett, és eltűnik, ha eltávolítja róla az egeret.
tooltip.cfg.resaltar_jugada_showdown=A mutatás során, ha az egérmutatót bármelyik játékos keze neve fölé viszi (győztes vagy vesztes), csak az azt alkotó kártyákat emeli ki, a többit pedig elhalványítja.
tooltip.cfg.screenshot_fin_timba=Automatikusan elment egy képernyőképet az utolsó képernyőről, amikor a pénzszámláló véget ér (vagy amikor elhagyja, ha hamarabb távozik).
