game.showdown_forfeit_msg=FIGYELMEZTETÉS: A mutatás ellenőrzés sikertelen volt a következő játékos(ok)nál, és a lapjaik NEM derülnek ki:\n\n%nicks%\n\nEzek a játékosok ki vannak zárva a mutatás ellenállásból (auto-fold) és CANNOT. A játék a szokásos módon folytatódik.
zero_trust.peer_sra_corrupt=A mutatás aláírás eredeti, de a társ SRA kulcsa nem oldja fel az érvényes kártyákat. Ez csak akkor történik meg, ha a partner szándékosan írt alá egy sérült kulcsot, vagy ha a kliense hibás. Nem tudjuk megmondani, hogy melyik, és a biztonság kedvéért véget vetünk a játéknak.
zero_trust.straddle_recover_mismatch=A kéz visszaszerzése közben a házigazda egy straddle-t jelentett be, amely különbözik attól, amit a saját helyi példányod rögzített. Ez csak akkor történik meg, ha a gazdagép manipulálja a helyreállított straddle-t, vagy a kliense hibás. A kéz még mindig az Ön megbízható másolatából épül fel, de elővigyázatosságból figyelmeztetünk.
zero_trust.rit_recover_mismatch=Miközben visszaszerezte a leosztást, a házigazda egy „futtasd meg kétszer” eredményt jelentett be, amely különbözik attól, amit a saját helyi példányod rögzített. Ez csak akkor történik meg, ha a gazdagép manipulálja a helyreállított eredményt, vagy a kliense hibás. A kéz még mindig az Ön megbízható másolatából épül fel, de elővigyázatosságból figyelmeztetünk.
zero_trust.peer_sra_corrupt_registro=\u2014 mutatás kulcs aláírva, de nem oldódik fel kártyákra. Lehetséges csalás vagy ügyfélhiba.
