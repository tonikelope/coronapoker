game.popup_verificacion_divergente=Egy vagy több résztvevő a kéz végső állapotának eltérő kriptográfiai ellenőrzéséről számolt be.\n\nEnnek oka lehet szoftvermódosítás vagy szoftverhiba. CoronaPoker nem tudja automatikusan meghatározni az okot vagy azt, hogy ki okozta.\n\nA CoronaPoker leállította a biztonságos leosztást, és a figyelmeztetés nyugtázása után biztonsági hiba miatt bezárja az asztalt.\n\nA bizonyítékok elmentve:\n{0}
game.popup_verificacion_ausente=Az utolsó leosztás nem tudott konszenzusra jutni, mert a {0} játékos nem küldött záró aláírást.\n\nEzt hálózati kimaradás, ügyfélhiba vagy szoftvermódosítás okozhatja. CoronaPoker leállította a biztonságos kézzárást, és a figyelmeztetés nyugtázása után biztonsági hibaként bezárja az asztalt.\n\nA bizonyíték mentése ide:\n{1}
game.mano_verificacion_interrumpida=KRITIKUS: A biztonságos kézzárás sikertelen ({0}). Az asztal biztonsági hiba miatt bezárul. Bizonyíték: {1}
