radar.esta_funcionalidad_permite_a_cualquier=Ez a funkció lehetővé teszi bármely játékos számára, hogy képernyőképet kapjon, és feldolgozza egy másik játékos listáját, ha azt gyanítja, hogy csalnak vagy harmadik féltől származó szoftvert használnak. Házigazdaként, kérjük, fontolja meg az adatvédelmi vonatkozásokat, mielőtt engedélyezi ezt az opciót (a játék közben nem módosítható).\n\nMegjegyzés: ez a funkció meglehetősen platformfüggő, így nem garantált, hogy minden kliensen tökéletesen működik.
