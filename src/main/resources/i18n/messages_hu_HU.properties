game.recover_accion_ausencia=⚠ Figyelmeztetés: a házigazda az utolsó rögzített akciódnál később játszotta le az akciókat, valószínűleg akkor, amikor Ön nem volt kéznél – ezeket nem lehet ellenőrizni, és elfogadjuk, ahogy a házigazda küldte őket.
game.mano_verificacion_divergente=⚠ A KRIPTOGRÁFIAI ELLENŐRZÉS ELTÉRÉSE. Egy vagy több résztvevő eltérő végső leosztási állapotról számolt be. Bizonyíték: {0}
game.mano_verificacion_jugador_ausente=⚠ Figyelmeztetés: {0} nem küldte el a záró aláírást. A biztonságos kézi zárást leállították. Bizonyíték: {1}
game.mano_verificacion_firma_invalida=⚠ Megjegyzés: {0} érvénytelen kriptográfiai aláírást észlelt ebben a leosztásban. A biztonságos lezárást leállították. Bizonyíték: {1}
game.popup_verificacion_firma_invalida=A leosztás során egy vagy több résztvevő ({0}) érvénytelen kriptográfiai aláírást észlelt egy műveletnél.\n\nAz összes résztvevő által kapott adatok konzisztensek voltak (a végső lánckivonatok megegyeztek), de legalább egy műveletet nem írt alá megfelelően a várható szerzője.\n\nA CoronaPoker leállította a biztonságos leosztást, és a figyelmeztetés nyugtázása után biztonsági hiba miatt bezárja az asztalt.\n\nA bizonyítékok elmentve:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Megjegyzés: {0} nem kapta meg az őszinte keverés igazolását ehhez a leosztáshoz. Bizonyíték: {1}
game.popup_verificacion_host_sin_prueba=Egy vagy több résztvevő ({0}) nem kapta meg az őszinte keverés bizonyítékát ehhez a leosztáshoz.\n\nAz utolsó lánckivonat minden résztvevőnél megegyezik, így a kézműveletek következetesek. A megfelelő gazdagép mindig elküldi ezt a bizonyítékot, így az ismételt vagy társ-szelektív hiányzás szoftvermódosításra vagy szoftverhibára utalhat.\n\nA leosztás rendezve volt, de elővigyázatosságból javasolt a játék elhagyása.\n\nA bizonyítékok elmentve:\n{1}
