gdx.settings.tooltip.pot_player_count=Mostra quanti giocatori possono ancora agire nella mano. Sono esclusi i giocatori foldati, gli all-in, gli spettatori ed i giocatori in fase di riscaldamento. Il contatore è nascosto a zero.
