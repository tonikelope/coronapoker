game.popup_verificacion_firma_invalida=Durante questa mano, uno o più partecipanti ({0}) hanno rilevato una firma crittografica non valida su un’azione.\n\nI dati ricevuti da tutti i partecipanti erano coerenti (gli hash della catena finale corrispondevano), ma almeno un’azione non è stata firmata correttamente dall’autore previsto.\n\nCoronaPoker ha interrotto la chiusura sicura della mano e chiuderà il tavolo come errore di sicurezza dopo che questo avviso è stato visualizzato. riconosciuto.\n\nProve salvate in:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Avviso: {0} non ha ricevuto la prova del mescolamento onesto per questa mano. Prova: {1}
game.popup_verificacion_host_sin_prueba=Uno o più partecipanti ({0}) non hanno ricevuto la prova di mescolamento onesto per questa mano.\n\nGli hash della catena finale corrispondono a tutti i partecipanti, quindi le azioni della mano sono coerenti. Un host corretto invia sempre questa prova, quindi un’assenza ripetuta o selettiva tra pari potrebbe indicare un software modificato o un difetto del software.\n\nLa mano è stata decisa, ma si consiglia di lasciare il gioco come precauzione.\n\nProva salvata in:\n{1}
game.popup_verificacion_titulo_alerta=Divergenza nella verifica crittografica
game.popup_verificacion_titulo_aviso=Verifica crittografica incompleta
game.popup_verificacion_divergente=Uno o più partecipanti hanno segnalato una diversa verifica crittografica dello stato finale della mano.\n\nCiò potrebbe essere causato da un software modificato o da un difetto del software. CoronaPoker non è in grado di determinare automaticamente la causa o chi l’ha originata.\n\nCoronaPoker ha interrotto la chiusura sicura della mano e chiuderà il tavolo come errore di sicurezza dopo aver riconosciuto questo avviso.\n\nProva salvata in:\n{0}
game.popup_verificacion_ausente=L’ultima mano non ha potuto raggiungere il consenso perché il giocatore {0} non ha inviato una firma di chiusura.\n\nCiò potrebbe essere causato da un’interruzione della rete, un errore del client o un software modificato. CoronaPoker ha interrotto la chiusura sicura della mano e chiuderà la tabella come errore di sicurezza dopo che questo avviso è stato riconosciuto.\n\nProva salvata in:\n{1}
game.mano_verificacion_interrumpida=CRITICO: chiusura sicura della mano non riuscita ({0}). La tabella verrà chiusa a causa di un errore di sicurezza. Prova: {1}
game.popup_verificacion_interrumpida=CoronaPoker non è riuscito a completare il protocollo di chiusura crittografica per l’ultima mano.\n\nFailure: {0}\n\nLa mano rimane aperta per il recupero. La tabella verrà chiusa come errore di sicurezza solo dopo che questo avviso sarà stato riconosciuto.\n\nEvidenza salvata in:\n{1}
