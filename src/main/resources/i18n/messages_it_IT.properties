zero_trust.auditing_memory=[ZERO-TRUST] Controllo della memoria dello sciame RAM...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Log binario caricato in memoria ({0} firme pronte per la riproduzione sincronizzata).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] La cascata di shuffle crittografico non è riuscita. La mano è stata annullata.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Impossibile sbloccare le carte private (un giocatore non ha risposto in tempo). La mano è stata annullata.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Una carta decifrata non corrisponde ad alcuna carta valida nel mazzo. Il gioco è stato cancellato.
peer.not_enough_players=Un giocatore è caduto durante il mescolamento e non ci sono più abbastanza giocatori per distribuire la mano.
peer.unlock_no_testament=Un giocatore si è disconnesso senza lasciare la chiave di decrittazione. La mano è stata annullata.
peer.broadcast_failed=Errore di rete durante la trasmissione delle carte private. La mano è stata annullata.
peer.recovery_action_data_unavailable=Impossibile leggere la cronologia delle azioni salvata. La mano è stata annullata in modo sicuro e tornerà in recupero.
straddle.deferred_release_failed=Non è stato possibile rivelare le carte bui straddle (un giocatore si è disconnesso o si è rifiutato di collaborare). La mano è stata annullata.
peer.state_inconsistent=Lo stato del concessionario è diventato incoerente. La mano è stata annullata.
peer.bot_no_token=Un bot non ha la chiave di decrittazione pronta. La mano è stata annullata.
peer.community_unlock_no_testament=Un giocatore si è disconnesso senza lasciare la chiave per rivelare le carte comuni. La mano è stata annullata.
peer.dropped_during_cascade=Un giocatore si è disconnesso durante il rimescolamento crittografico del mazzo. La mano è stata annullata.
peer.dropped_during_rotation=Un giocatore si è disconnesso durante la rotazione crittografica del mazzo. La mano è stata annullata.
zero_trust.rotation_refused=Un giocatore connesso ha rifiutato di consegnare la chiave di rotazione del mazzo. Il gioco è interrotto. Dovranno motivare il loro rifiuto alla riammissione.
zero_trust.cascade_refused=Un giocatore connesso ha rifiutato di prendere parte alla cascata di mescolamento dei mazzi. Il gioco è interrotto. Dovranno motivare il loro rifiuto alla riammissione.
zero_trust.pocket_unlock_refused=Un giocatore connesso ha rifiutato di consegnare la propria chiave per decrittografare le carte personali. Il gioco è interrotto. Dovranno motivare il loro rifiuto alla riammissione.
zero_trust.community_unlock_refused=Un giocatore connesso ha rifiutato di consegnare la propria chiave per rivelare le carte comuni. Il gioco è interrotto. Dovranno motivare il loro rifiuto alla riammissione.
zero_trust.host_showdown_sig_missing=Una chiave showdown è stata ricevuta dal server SENZA la firma crittografica dell'autore o con una firma non corretta. Il server potrebbe sostituire la chiave sulla rete.
zero_trust.host_showdown_sig_invalid=Una chiave showdown è stata ricevuta dal server con una firma crittografica NON VALIDA. Il server potrebbe sostituire la chiave sulla rete.
zero_trust.host_potcards_mismatch=Il testo in chiaro showdown inviato dal server NON CORRISPONDE al risultato della decrittografia del pezzo locale con la chiave firmata. Il server potrebbe inviare carte false a showdown.
zero_trust.host_community_garbage=I dati crittografici della carta comune ricevuti dal server non sono coerenti (il pezzo non viene decrittografato in una carta del mazzo valida o non corrisponde all'annuncio firmato dal server). Possibili cause: un BUG in alcune versioni del software, una versione del server il cui codice potrebbe essere stato alterato o corruzione della chiave di identità locale. Il cliente non può notare la differenza e NON accusa nessuno.
zero_trust.host_unlock_out_of_order=Una richiesta di decrittazione è stata ricevuta dal server fuori sequenza (strada sbagliata, slot ripetuto, fuori servizio o richiesta emessa prima della chiusura della strada precedente).
zero_trust.host_cascade_mid_hand=Una richiesta di riavvio della riproduzione casuale è stata ricevuta dal server nel bel mezzo di una mano in corso (sovrascriverebbe la mia chiave di decrittazione).
zero_trust.host_pocket_extraction=Dal server è stata ricevuta una richiesta di decrittazione che potrebbe influenzare le TUE carte private.
zero_trust.host_community_extraction=Dal server è stata ricevuta una richiesta di decrittazione che rivelerebbe in anticipo una carta comune.
zero_trust.host_rotation_replay=Il server ha richiesto una seconda rotazione delle carte nella stessa mano. La rotazione legittima è unica per mano. Una ripetizione suggerisce un tentativo di utilizzare il tuo client per decrittografare le carte di altri giocatori.
zero_trust.host_shuffle_proof_failed=La verifica della distribuzione non è riuscita: non è stato possibile dimostrare che il mazzo distribuito dal server fosse un'onesta mescolanza del mazzo Genesi. Gli sblocchi della community sono stati rifiutati e questa sessione verrà terminata per proteggere le carte private.
zero_trust.host_shuffle_proof_missing=L'accordo è arrivato senza una prova verificabile di mescolamento onesto per il mazzo di questa mano e le carte comuni ora vengono rivelate. Potrebbe trattarsi di un bug, di un ritardo della rete o di un host che tenta di manipolare l'accordo. Puoi continuare a giocare, ma è fortemente consigliato abbandonare questo tavolo.
zero_trust.deck_unverified=Il mazzo di questa mano NON può essere verificato come un mescolamento onesto. SOSPETTO: conduttore "{0}", che distribuisce e trasmette la prova shuffle. Potrebbe essere l’ospite a manipolare l’accordo o un giocatore che ha nascosto la propria prova. La mano viene giocata perché le carte sono già state distribuite.
zero_trust.deck_unverified_body=Sono state registrate prove firmate di questa anomalia (nel registro del gioco, in rosso, e nella tabella delle mani contestate). Puoi continuare a giocare, ma se non ti fidi dell'host, lascia il tavolo.
zero_trust.seat_redraw=L’ospite "{0}" ha forzato l’estrazione di un NUOVO posto. Questo è INUSUALE: il sorteggio è collettivo e verificabile, quindi l’ospite non può scegliere i posti, ma PUÒ ripetere il lancio finché non ottiene un accordo di suo gradimento. Se si ripete, potrebbe essere l’host che cerca di manipolare il tuo posto.
zero_trust.seat_redraw_body=Il nuovo sorteggio si è svolto allo stesso modo ed è tuttora verificabile: nessuno, compreso il padrone di casa, può sceglierne l'esito. Può succedere se un giocatore abbandona proprio all'inizio, ma se vedi diversi tentativi e non ti fidi dell'host, lascia il tavolo. È stato registrato.
zero_trust.seat_recover_mismatch=Al ripristino della partita, l’ordine dei posti inviato dall’host "{0}" NON corrisponde a quello salvato dal tuo cliente: qualcuno che già conoscevi ha cambiato posto al tavolo. Potrebbe trattarsi di un host che tenta di riordinare i posti con la copertura della ripresa.
zero_trust.seat_recover_mismatch_body=Il tuo cliente ha mantenuto il riferimento del posto a sedere verificato all'inizio. I giocatori che si uniscono o lasciano nel frattempo è normale. Riordinare qualcuno che era già lì non lo è. Se non ti fidi dell'ospite, lascia il tavolo. È stato registrato.
zero_trust.host_recover_action_forged=L'host ha tentato di inserire un'azione FORGED (firma non valida) durante il ripristino del gioco. Il tuo cliente l'ha rifiutato.
zero_trust.host_recover_action_omitted=Durante il ripristino l'host ha omesso un'azione che TU hai eseguito e che hai registrato nel tuo database locale. Il tuo client l'ha rilevato rispetto alla sua stessa copia e NON ha abbandonato silenziosamente la tua azione.
zero_trust.host_recover_balance_mismatch=L'host ha provato a modificare il tuo saldo (fiches/buy-in) durante il recupero del gioco: non corrisponde al tuo record locale. Il tuo cliente ha mantenuto il TUO saldo reale.
zero_trust.host_board_peek=L'host ha richiesto di decriptare una carta comune da una strada FUTURE (un tentativo di leggere il tabellone in anticipo). Il tuo cliente ha rifiutato.
zero_trust.suspect_host_prefix=SOSPETTO: host "{0}".
zero_trust.suspect_peer_prefix=SOSPETTO: giocatore "{0}".
zero_trust.peer_alert=⚠️ [COMPORTAMENTOANOMALO DEL GIOCATORE]
zero_trust.peer_suspicious_header=È stato rilevato un comportamento anomalo o offensivo da parte di un giocatore al tuo tavolo:\n
zero_trust.peer_suspicious_body=Il tavolo applica la misura di sicurezza corrispondente e il gioco continua per gli altri giocatori. Si presuppone la buona fede. Potrebbe trattarsi di un bug del software e nessuno viene accusato. Le prove vengono registrate.
zero_trust.peer_inbound_flood=Traffico autenticato sostenuto al di sopra della soglia anti-DoS.
zero_trust.peer_binary_flood=Operazioni di messaggistica vocale inviate a una velocità insolitamente elevata.
zero_trust.host_binary_flood=L'host invia operazioni di messaggistica vocale a una velocità insolitamente elevata.
zero_trust.peer_flood_log=Incidente anti-DoS in attesa di decisione: giocatore {0}, IP {1}. Motivo: {2}
zero_trust.peer_flood_confirm=L’utente {0} sta inviando una quantità eccessiva di traffico. Potrebbe trattarsi di un attacco DoS o di un bug. Espellerli dal gioco?\n\nIP: {1}\nMotivo rilevato: {2}
zero_trust.peer_flood_suppress=Non mostrare questi avvisi
zero_trust.peer_hand_ready_withheld=Un giocatore risponde al PING ma non conferma di essere pronto per la mano successiva mentre il gioco è in corso. Stava congelando la mano ed è stato ESPULSO. Il gioco continua senza di loro.
zero_trust.peer_action_withheld=Un giocatore risponde al PING ma non invia la sua azione di scommessa mentre il gioco è in corso, oltre il tempo di riflessione. Stava gelando il turno ed è stato ESPULSO. Il gioco continua senza di loro.
zero_trust.peer_conf_withheld=Un giocatore risponde al PING ma non conferma la ricezione di un messaggio di distribuzione mentre il gioco è in corso. Stava bloccando l'avanzamento del tavolo ed è stato ESPULSO. Il gioco continua senza di loro.
zero_trust.peer_deal_refusal_expelled=Un giocatore ha forzato l'annullamento di diverse mani di seguito rifiutando di mescolare o ruotare il mazzo. È stato ESPULSO quindi il gioco può continuare.
zero_trust.suspicious_alert=⚠️ [COMPORTAMENTOANOMALO DEL SERVER]
zero_trust.suspicious_header=Il tuo client ha rilevato un comportamento anomalo del server (non un incidente critico che blocca il gioco): \n
zero_trust.suspicious_body=Il tuo client ha rifiutato l'operazione anomala e il gioco PUÒ continuare. Assumiamo la buona fede: potrebbe trattarsi di un BUG software (client o server) e nessuno viene accusato. Ma poiché non è possibile distinguere un bug da una manomissione, PER LA TUA SICUREZZA SI CONSIGLIA FORTEMENTE DI LASCIARE questo tavolo utilizzando il pulsante "Lascia" (i tuoi soldi NON verranno elaborati in questa mano).
zero_trust.host_bad_wire=È stata ricevuta una richiesta di decrittografia dal server con un formato non valido o con punti che non appartengono alla curva crittografica.
zero_trust.host_critical_command_invalid=Impossibile convalidare il comando critico {0} inviato dal server. Potrebbe trattarsi di un’incompatibilità, di un bug o di un server modificato. La sessione viene interrotta per proteggerne l’integrità.
zero_trust.cheater_detected=[ZERO-TRUST] È stato rilevato un giocatore con una versione CoronaPoker modificata, suggerendo che potrebbe tentare di imbrogliare. Vuoi continuare?
zero_trust.corrupted_mac_action=Il Server ha tentato di elaborare un'azione con una firma crittografica non valida (MAC danneggiato) per conto di:
zero_trust.critical=\u274c [ZERO-TRUST] AVVISO CRITICO: FIRMA NON VALIDA O CONSENSO ROTTO.
zero_trust.critical_alert_body=STATO DI QUARANTENA ATTIVATO:\nIl tuo client NON invierà più chiavi crittografiche al server in questa sessione.\nIl gioco è matematicamente congelato per proteggere il tuo saldo.\n\nLe POSSIBILI cause sono:\n - un BUG nel codice client stesso,\n - un BUG nel codice server, oppure\n - un SERVER il cui codice potrebbe essere stato alterato.\n\nIl client non riesce a distinguerli e NON è implicita alcuna accusa. Per motivi di sicurezza e in attesa della verifica della causa principale, SI CONSIGLIA di LASCIARE il gioco utilizzando il pulsante "Esci" (i tuoi soldi NON verranno elaborati in questa mano).
zero_trust.critical_alert_header=INCIDENTE ZERO-TRUST!\n\nIl tuo cliente ha rilevato un'anomalia nel protocollo crittografico:\n
zero_trust.critical_session_error=[ZERO-TRUST] ERRORE SESSIONE CRITICA
zero_trust.decrypting_street=[ZERO-TRUST] DECRITTO STRADA...
zero_trust.wait_deal=In attesa dei contributi dei giocatori per mescolare e distribuire le carte.
zero_trust.wait_shuffle_proof=In attesa della prova crittografica del mescolamento.
zero_trust.wait_sra_unlock=In attesa delle chiavi SRA per rivelare {0}.
game.settlement_verification_wait=In attesa delle ricevute per verificare la mano e confermare i saldi.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Timeout consenso rapido. Forzare l'avanzamento.
zero_trust.forged_identity_action=Il Server ha tentato di elaborare un'azione con una firma di identità contraffatta per conto di:
zero_trust.game_aborted=[ZERO-TRUST] Gioco interrotto. Calcia gli imbroglioni.
zero_trust.generating_kem=[ZERO-TRUST] GENERAZIONE DI KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [AVVISO ZERO-TRUST] MAC non valido sulle carte comuni. Possibile manipolazione.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] VERIFICA CRITTOGRAFICA CONSENSO: TUTTI I GIOCATORI HANNO CERTIFICATO DI SUPERARE LA VERIFICA CRITTOGRAFICA DELLA MANO LOCALE.
zero_trust.legit2_error=\u274c [ZERO-TRUST] VERIFICA CRITTOGRAFICA DEL CONSENSO: ALMENO UN GIOCATORE NON HA CERTIFICATO DI SUPERARE LA VERIFICA CRITTOGRAFICA DELLA MANO LOCALE.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] VERIFICA CRITTOGRAFICA DELLA MANO LOCALE: LE MIE CARTE, LE CARTE COMUNITARIE E TUTTE LE AZIONI REGISTRATE SONO LEGITTIME.
zero_trust.legit_error=\u274c [ZERO-TRUST] VERIFICA CRITTOGRAFICA A MANO LOCALE: IMPOSSIBILE GARANTIRE CHE LE MIE CARTE, LE CARTE COMUNITARIE E TUTTE LE AZIONI REGISTRATE SIANO LEGITTIME.
