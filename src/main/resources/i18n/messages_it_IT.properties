tooltip.cfg.custom_bots=Abilita il catalogo personalizzato. I profili configurati vengono aggiunti per primi, seguiti dai bot standard.
tooltip.cfg.custom_bots.only=Impedisce l'aggiunta di bot standard. Non è possibile aggiungere altri bot una volta esaurito il catalogo personalizzato.
tooltip.cfg.custom_bots.manage=Apri il gestore per creare, modificare e ordinare i tuoi bot. Puoi scegliere la loro difficoltà e stile.
tooltip.cfg.custom_bots.row=Seleziona questo bot per modificarne nome, avatar, difficoltà, stile o riacquisto.
tooltip.cfg.custom_bots.avatar=Scegli un'immagine valida o mantieni l'avatar ufficiale del bot. CoronaPoker memorizza una copia sicura in modo che non venga persa.
tooltip.cfg.custom_bots.name=Inserisci il nome visibile senza $. Il contrassegno riservato viene aggiunto automaticamente.
tooltip.cfg.custom_bots.difficulty=Imposta la sfida e le tattiche utilizzate dal bot. Facile gioca in modo ricreativo, Normale utilizza una strategia più disciplinata e Difficile utilizza tattiche avanzate.
tooltip.cfg.custom_bots.personality=Imposta lo stile di base. Lo sceglie casualmente quando viene creato il bot e lo conserva per la sessione attiva. Il bot può adattare le sue decisioni alla situazione.
gdx.settings.option_help.bot_difficulty.easy=Gioca casualmente e commette errori più spesso.
gdx.settings.option_help.bot_difficulty.medium=Utilizza una strategia più disciplinata e adatta le decisioni man mano che la mano si sviluppa.
gdx.settings.option_help.bot_difficulty.hard=Utilizza tattiche più avanzate, come rubare bui o esercitare pressione quando un avversario sembra vulnerabile.
gdx.settings.option_help.custom_bot_personality.random=Sceglie uno stile quando viene creato il bot e lo mantiene per la sessione attiva.
gdx.settings.option_help.custom_bot_personality.nit=Partecipa a poche mani e solitamente aspetta carte forti prima di rischiare le fiches.
gdx.settings.option_help.custom_bot_personality.station=Tende a chiamare le puntate e a restare nella mano. Alza meno spesso.
gdx.settings.option_help.custom_bot_personality.tag=Sceglie le mani in modo selettivo e tende a prendere l'iniziativa con puntate e rilanci.
gdx.settings.option_help.custom_bot_personality.lag=Gioca una gamma più ampia di mani ed esercita pressione con puntate e rilanci frequenti.
gdx.settings.option_help.ante_mode.traditional=Ogni giocatore attivo posta un decimo di grande buio, arrotondato al centesimo più vicino.
gdx.settings.option_help.ante_mode.big_blind=Il giocatore in grande buio punta l'intero ante, pari a uno grande buio.
gdx.settings.option_help.ante_mode.button=Il giocatore sul pulsante punta l'intero ante, pari a uno grande buio.
gdx.settings.option_help.ante_mode.small_blind=Il giocatore in piccolo buio punta l'intero ante, pari a uno grande buio.
gdx.settings.option_help.blind_unit.minutes=L'intervallo tra bui incrementi viene misurato in minuti di gioco.
gdx.settings.option_help.blind_unit.hands=Bui aumento al termine del numero di mani specificato.
gdx.settings.option_help.rebuy_cap.buy_in=Il tuo stack massimo dopo un riacquisto si basa sul buy-in del gioco.
gdx.settings.option_help.rebuy_cap.highest_stack=Riacquisto fino allo stack più grande al tavolo. Il limite non scende mai al di sotto dello standard buy-in.
gdx.settings.option_help.rabbit.off=Le carte comuni non distribuite rimangono nascoste al termine della mano.
gdx.settings.option_help.rabbit.free=Puoi chiedere di vedere le carte comuni non distribuite al termine della mano senza pagare le fiches.
gdx.settings.option_help.rabbit.free_small_blind=La tua prima richiesta del gioco è gratuita. Ogni richiesta successiva costa 1 piccolo buio.
gdx.settings.option_help.rabbit.free_small_and_big_blind=La tua prima richiesta del gioco è gratuita, la seconda costa 1 piccolo buio e le richieste successive costano 1 grande buio.
gdx.settings.option_help.window_mode.exclusive=Utilizza la modalità a schermo intero del monitor.
gdx.settings.option_help.window_mode.borderless=Riempie lo schermo con una finestra senza bordi e mantiene la modalità di visualizzazione desktop.
gdx.settings.option_help.window_mode.windowed=Apre CoronaPoker in una finestra che puoi spostare e ridimensionare.
gdx.settings.option_help.fps_limit.fixed=Imposta un frame rate massimo fisso. Un tappo inferiore può ridurre il consumo energetico.
gdx.settings.option_help.fps_limit.monitor=Abbina il limite della frequenza fotogrammi alla frequenza di aggiornamento del monitor su cui viene visualizzato il gioco.
gdx.settings.option_help.msaa.0=Disabilita l'anti-aliasing multicampione per la tabella e l'interfaccia. Richiede un riavvio.
gdx.settings.option_help.msaa.2=Utilizza 2 campioni per pixel per smussare i bordi con un basso costo grafico. Richiede un riavvio.
gdx.settings.option_help.msaa.4=Utilizza 4 campioni per pixel per bilanciare l'arrotondamento dei bordi e il costo della grafica. Richiede un riavvio.
gdx.settings.option_help.msaa.8=Utilizza 8 campioni per pixel per la massima uniformità offerta da questa impostazione. Richiede un riavvio.
gdx.settings.option_help.card_rendering.native=Disegna le carte direttamente per ridurre i costi di rendering.
gdx.settings.option_help.card_rendering.smooth=Utilizza un filtro aggiuntivo per smussare i bordi delle carte a un costo grafico più elevato.
tooltip.cfg.custom_bots.automatic_rebuy=Lascia questo bot personalizzato riacquisto dopo aver finito i chip. Il controllo automatico globale riacquisto deve essere abilitato.
tooltip.cfg.custom_bots.order_up=Sposta il profilo selezionato di una posizione verso l'alto. L'elenco lo segue quando è necessario lo scorrimento.
tooltip.cfg.custom_bots.order_down=Sposta il profilo selezionato di una posizione verso il basso. L'elenco lo segue quando è necessario lo scorrimento.
tooltip.cfg.custom_bots.random_selection=Mescola il catalogo una volta quando viene creata una lobby. Ogni bot personalizzato può entrare solo una volta e la selezione rimane stabile per quella lobby.
tooltip.cfg.custom_bots.new=Prepara un nuovo profilo senza modificare i bot già salvati.
tooltip.cfg.custom_bots.save=Aggiunge il nuovo profilo o salva le modifiche apportate al bot selezionato.
tooltip.cfg.custom_bots.delete=Rimuove il profilo selezionato dopo aver chiesto conferma.
tooltip.cfg.custom_bots.close=Chiude il gestore. I profili salvati e il loro ordine vengono mantenuti automaticamente.
