game.showdown_forfeit_msg=AVVISO: la verifica showdown è fallita per i seguenti giocatori e le loro carte NON verranno rivelate:\n\n%nicks%\n\nQuei giocatori sono esclusi dalla resistenza showdown (fold automatico) e NON POSSONO vincere questo piatto. Il gioco continua normalmente.
zero_trust.peer_sra_corrupt=La firma showdown è autentica ma la chiave SRA del peer non si risolve in carte valide. Ciò accade solo se il peer ha firmato intenzionalmente una chiave corrotta o se il suo client è difettoso. Non possiamo dirlo e per sicurezza terminiamo il gioco.
zero_trust.straddle_recover_mismatch=Mentre recuperava la mano, l'host ha annunciato un straddle diverso da quello registrato dalla tua copia locale. Ciò accade solo se l'host manomette il straddle recuperato o il suo client è difettoso. La mano è ancora ricostruita dalla tua copia attendibile, ma ti avvisiamo per precauzione.
zero_trust.rit_recover_mismatch=Durante il recupero della mano, l'host ha annunciato un risultato run-it-twice diverso da quello registrato dalla tua copia locale. Ciò accade solo se l'host manomette il risultato recuperato o il suo client è difettoso. La mano è ancora ricostruita dalla tua copia attendibile, ma ti avvisiamo per precauzione.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown chiave firmata ma non si risolve in carte. Possibile cheat o bug del client.
