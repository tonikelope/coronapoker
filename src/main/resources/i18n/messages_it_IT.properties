gdx.settings.tooltip.cinematic_gameover=Mostra una sequenza visiva quando un giocatore finisce le fiches.
gdx.settings.tooltip.animation_shuffle=Riproduce la riproduzione casuale prima che venga distribuita ogni mano.
gdx.settings.tooltip.animation_deal=Anima le carte che volano dal mazzo ai giocatori e nelle posizioni delle carte comuni.
gdx.settings.tooltip.animation_reveal=Anima le carte che girano quando vengono rivelate.
gdx.settings.tooltip.animation_position_chips=Anima il dealer, le fiches bui e straddle si muovono sul tavolo.
gdx.settings.tooltip.animation_counters=Anima le modifiche agli stack, alle puntate e al piatto.
gdx.settings.tooltip.animation_seats=Anima i posti a sedere che entrano e si riorganizzano attorno al tavolo.
gdx.settings.tooltip.animation_sort_hand=Anima le tue carte che si incrociano quando vengono ordinate.
gdx.settings.tooltip.animation_final_count=Anima il conteggio dei profitti e delle perdite al termine del gioco.
gdx.settings.tooltip.animation_final_summary_cards=Anima l'arrivo delle carte saldo al termine del gioco. Spegnilo per mostrare le carte immediatamente al loro posto.
gdx.settings.tooltip.animation_allin_fire=Mostra il fuoco dietro i giocatori che sono All-in.
gdx.settings.tooltip.animation_winner=Mostra luci e particelle attorno ai posti vincenti.
gdx.settings.tooltip.animation_chips=Anima il volo delle fiches quando si punta e si raccoglie il piatto.
gdx.settings.tooltip.animation_reseat=Anima la riorganizzazione del tavolo quando un giocatore se ne va.
gdx.settings.tooltip.animation_shuffle_cascade=Mostra lo spostamento casuale distribuito tra i giocatori.
gdx.settings.tooltip.auto_fullscreen=Passa automaticamente allo schermo intero all'avvio della tabella e la modalità della finestra selezionata lo consente.
gdx.settings.tooltip.vsync=Sincronizza i fotogrammi con il monitor per evitare strappi. Può abbassare FPS e aumentare la latenza.
gdx.settings.tooltip.fps_limit=Maiuscole FPS. La "frequenza di aggiornamento del monitor" segue il display. Frame rate più elevati consumano più energia.
gdx.settings.tooltip.msaa=Smussa i bordi geometrici della scena. Più campioni aumentano il carico di GPU. Si applica dopo il riavvio.
gdx.settings.tooltip.card_rendering=Smooth applica un filtro aggiuntivo ai bordi delle carte. Il nativo pesca direttamente le carte.
gdx.settings.tooltip.show_fps=Mostra lo stato attuale FPS e VSync sullo schermo.
gdx.settings.tooltip.show_cpu_memory=Mostra Java CPU e l'utilizzo della memoria.
gdx.settings.tooltip.gpu_renderer=Mostra l'adattatore grafico e il driver OpenGL utilizzati dal gioco.
gdx.settings.tooltip.audio_output=Seleziona il dispositivo utilizzato per riprodurre l'audio del gioco.
gdx.settings.tooltip.audio_capture=Seleziona il microfono utilizzato per registrare i messaggi vocali.
gdx.settings.tooltip.microphone=Permette di registrare e inviare messaggi vocali dal gioco.
gdx.settings.tooltip.mic_auto_gain=Regola automaticamente il livello del microfono per compensare le voci troppo basse o troppo forti.
gdx.settings.tooltip.local_tts=Consente o blocca la riproduzione dei messaggi di sintesi vocale su questo computer.
gdx.settings.tooltip.auto_buttons=Mostra le azioni automatiche che possono essere eseguite quando arriva il tuo turno.
gdx.settings.tooltip.auto_call=Configura la chiamata automatica e il suo importo massimo consentito.
gdx.settings.tooltip.auto_persist=Mantiene l'azione automatica selezionata dopo l'esecuzione fino al termine della lancetta o fino all'annullamento della selezione.
gdx.settings.tooltip.auto_confirm=Richiede conferma prima di eseguire un'azione automatica.
gdx.settings.tooltip.confirm_actions=Richiede conferma prima di azioni manuali importanti.
gdx.settings.tooltip.auto_rebuy=Effettua nuovamente il buy-in automatico quando finisci le chips e sono consentiti i rebuy.
gdx.settings.tooltip.shortcut=Seleziona la riga e quindi premi il tasto che desideri assegnare a questa azione.
gdx.settings.tooltip.rebuy_cap=Scegli se il chip cap dopo un riacquisto si basa su buy-in o sullo stack più grande al tavolo.
gdx.settings.tooltip.blind_structures=Apre l'editor per la gestione delle strutture di livello bui.
gdx.settings.tooltip.blind_unit=Scegli se gli aumenti di bui sono programmati per mani giocate o per minuti.
gdx.settings.tooltip.blind_interval=Imposta il numero di lancette o minuti che passano tra gli incrementi di bui.
gdx.settings.tooltip.blind_cap_level=Il numero massimo di bui aumenta dal livello iniziale.
gdx.settings.tooltip.rebuy=Consente ai giocatori di acquistare più fiches durante il gioco, fino al limite massimo di riacquisto.
