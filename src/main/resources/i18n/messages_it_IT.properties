tooltip.cfg.ante=Aggiunge un contributo forzato al piatto dopo bui. La modalità stabilisce chi paga e quanto.
tooltip.cfg.ante_mode=Nella modalità Tradizionale, ogni giocatore attivo paga il 10% dei grande buio. In BBA, BA o SBA, il pulsante grande buio, o piccolo buio paga uno grande buio. Bui vengono pubblicati per primi.
tooltip.cfg.blind_cap=Arresta bui aumenti al limite configurato.
tooltip.cfg.blinds_level=A partire da bui (piccolo/grande) per il gioco.
tooltip.cfg.bot_balance=Quando il gioco finisce, il saldo combinato dei robot viene diviso equamente tra i giocatori umani, quindi il denaro reale viene regolato solo tra le persone.
tooltip.cfg.bot_rebuy=Controllo automatico globale riacquisto per ogni bot. Disattivandolo si disabilitano anche le impostazioni riacquisto dei bot personalizzati.
tooltip.cfg.bots=Imposta la difficoltà dei bot standard. I bot personalizzati mantengono la difficoltà configurata individualmente nel Bot Manager.
tooltip.cfg.buyin_fixed=Tutti iniziano con lo stesso buy-in. Quando è disattivato, i giocatori scelgono entro l'intervallo configurato.
tooltip.cfg.double_blinds=Avanza al livello successivo bui nella struttura dopo un determinato numero di lancette o minuti.
tooltip.cfg.hand_limit=Il gioco termina quando viene raggiunto il conteggio delle mani.
tooltip.cfg.iwtsth=Ti permette di chiedere di vedere la mano di un rivale a showdown.
tooltip.cfg.rabbit=Rivela le carte comuni non distribuite dopo la mano. La prima richiesta di ogni giocatore è gratuita. La modalità scelta stabilisce se le richieste successive rimangono gratuite o costano poco o grande buio.
tooltip.cfg.rebuy_limit=Rebuy massimi per giocatore.
tooltip.cfg.recover=Riprende una partita precedentemente interrotta.
tooltip.cfg.rit=Consente un voto per distribuire le carte rimanenti due volte quando un All-in chiude le puntate.
tooltip.cfg.straddle=Il giocatore dopo grande buio può puntare due grande buio prima di vedere le proprie carte e agire per ultimo preflop.
tooltip.cfg.straddle_on_timeout=Pubblica automaticamente straddle allo scadere del messaggio. Ciò influisce solo sul tuo lettore ed è disattivato per impostazione predefinita.
tooltip.cfg.structure=Struttura di livello Bui per il gioco.
tooltip.cfg.think_time=Secondi a disposizione per decidere. L'azione automatica viene eseguita allo scadere del tempo.
tooltip.cfg.showdown_time=Secondi in cui il risultato della mano rimane sullo schermo prima che venga distribuita la mano successiva.
tooltip.cfg.allow_hot_join=Consente ai nuovi giocatori di unirsi come RISCALDAMENTO ed entrare nella mano successiva. Se modificato durante una partita, influisce solo sui nuovi tentativi di connessione.
tooltip.cfg.card_flip_duration=Imposta il tempo impiegato da ciascuna carta per completare il proprio turno quando viene rivelata.
tooltip.cfg.card_flip_direction=Sceglie in che modo girare le carte quando vengono rivelate. Misto seleziona una direzione per ciascuna rivelazione. Le carte nello stesso gruppo girano insieme nello stesso modo.
