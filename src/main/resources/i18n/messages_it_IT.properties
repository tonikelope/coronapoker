gdx.settings.tooltip.table_chat_feed=Mostra gli avvisi di chat e di gioco sul tavolo. La chat veloce conserva la cronologia completa.
gdx.settings.tooltip.table_speaking_emoji=Mostra l'emoji gialla sopra l'altoparlante durante la sintesi vocale e le note vocali, incluse le tue.
gdx.settings.tooltip.chat_images=Ti consente di inviare immagini dal tavolo e visualizza le immagini ricevute sopra il giocatore che le ha inviate.
gdx.settings.tooltip.animations_master=Interruttore principale per animazioni, effetti, filmati e lettore video di poker.
gdx.settings.option.mostrar_videos_poker=Video di poker
gdx.settings.tooltip.poker_videos=Mostra il giocatore nel menu principale, nella lobby e al tavolo. Si chiude all'avvio del gioco e può essere riaperto dalla sua icona.
gdx.settings.tooltip.halo_effects=I controlli girano, il pericolo e il vincitore si illuminano attorno ai sedili.
