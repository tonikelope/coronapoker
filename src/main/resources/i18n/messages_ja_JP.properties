game.mano_verificacion_divergente=⚠ 暗号検証の相違。 1 人以上の参加者が、異なる最終ハンド状態を報告しました。証拠: {0}
game.mano_verificacion_jugador_ausente=⚠ 注意: {0} は終了署名を送信しませんでした。安全なハンドクローズが停止されました。証拠: {1}
game.mano_verificacion_firma_invalida=⚠ 注意: {0} はこのハンド中に無効な暗号署名を検出しました。安全な閉鎖が停止されました。証拠: {1}
game.popup_verificacion_firma_invalida=このハンド中に、1 人以上の参加者 ({0}) がアクションの無効な暗号署名を検出しました。\n\nすべての参加者が受信したデータは一貫していました (最終チェーン ハッシュが一致しました)。しかし、少なくとも 1 つのアクションが予想される作成者によって適切に署名されていませんでした。\n\nCoronaPoker は安全なハンド クロージャを停止し、この警告が終了した後、セキュリティ エラーとしてテーブルを閉じます。承認されました。\n\n証拠の保存場所:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ 注意: {0} はこのハンドの正直シャッフル証明を受け取りませんでした。証拠: {1}
game.popup_verificacion_host_sin_prueba=1 人以上の参加者 ({0}) は、このハンドの正直シャッフル証明を受け取りませんでした。\n\n 最終チェーン ハッシュはすべての参加者で一致するため、ハンド アクションは一貫しています。正しいホストが常にこの証拠を送信するため、繰り返しまたはピア選択的な不在は、修正されたソフトウェアまたはソフトウェアの欠陥を示している可能性があります。\n\nハンドは決着しましたが、予防措置としてゲームを終了することをお勧めします。\n\n証拠の保存場所:\n{1}
