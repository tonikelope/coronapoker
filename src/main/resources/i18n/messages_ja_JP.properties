peer.unlock_no_testament=プレーヤーが復号化キーを残さずに接続を切断しました。ハンドはキャンセルされました。
peer.broadcast_failed=プライベート カードのブロードキャスト中にネットワーク エラーが発生しました。ハンドはキャンセルされました。
peer.recovery_action_data_unavailable=保存された行動履歴を読み込むことができませんでした。ハンドは無事にキャンセルされ回復に戻ります。
straddle.deferred_release_failed=ブラインド ストラドル のカードを公開できませんでした (プレイヤーが切断されたか、協力を拒否しました)。ハンドはキャンセルされました。
peer.state_inconsistent=ディーラーの状態が不安定になりました。ハンドはキャンセルされました。
peer.bot_no_token=ボットには復号キーが用意されていません。ハンドはキャンセルされました。
peer.community_unlock_no_testament=プレイヤーがコミュニティ カードを公開するためにキーを残さずに接続を切断しました。ハンドはキャンセルされました。
peer.dropped_during_cascade=デッキ暗号シャッフル中にプレーヤーが切断されました。ハンドはキャンセルされました。
peer.dropped_during_rotation=デッキ暗号ローテーション中にプレーヤーが切断されました。ハンドはキャンセルされました。
zero_trust.rotation_refused=接続されているプレイヤーがデッキローテーションキーの配信を拒否しました。ゲームは中止されます。彼らは再入院の拒否を正当化する必要があるだろう。
zero_trust.cascade_refused=接続されているプレイヤーがデッキ シャッフル カスケードへの参加を拒否しました。ゲームは中止されます。彼らは再入院の拒否を正当化する必要があるだろう。
zero_trust.pocket_unlock_refused=接続されているプレーヤーが、ポケット カードを復号化するためのキーの提供を拒否しました。ゲームは中止されます。彼らは再入院の拒否を正当化する必要があるだろう。
zero_trust.community_unlock_refused=接続されているプレイヤーが、コミュニティ カードを公開するためのキーの配達を拒否しました。ゲームは中止されます。彼らは再入院の拒否を正当化する必要があるだろう。
zero_trust.host_showdown_sig_missing=ショーダウン キーが、作成者の暗号化署名なし、または不正な形式の署名付きでサーバーから受信されました。サーバーが回線上のキーを置き換えている可能性があります。
zero_trust.host_showdown_sig_invalid=無効な暗号署名を持つ ショーダウン キーをサーバーから受信しました。サーバーが回線上のキーを置き換えている可能性があります。
zero_trust.host_potcards_mismatch=サーバーによって送信された ショーダウン 平文は、署名付きキーを使用してローカル部分を復号化した結果と一致しません。サーバーはショーダウンに偽のカードを送信している可能性があります。
zero_trust.host_community_garbage=サーバーから受信した暗号コミュニティ カード データに一貫性がありません (ピースが有効なデッキ カードに復号化されていないか、サーバーの署名済みアナウンスメントと一致しません)。考えられる原因: ソフトウェアの一部のバージョンのバグ、サーバーのバージョンのコードが変更された可能性がある、またはローカル ID キーの破損。クライアントは違いを見分けることができず、誰も非難していません。
zero_trust.host_unlock_out_of_order=サーバーから復号化リクエストを順序どおりに受信できませんでした (間違ったストリート、繰り返されたスロット、順序が狂ったフェーズ、または前のストリートが閉じる前に発行されたリクエスト)。
zero_trust.host_cascade_mid_hand=進行中のハンドの途中でサーバーからシャッフル再起動リクエストを受信しました (復号化キーが上書きされます)。
zero_trust.host_pocket_extraction=あなた自身のプライベートカードに影響を与える復号リクエストをサーバーから受信しました。
zero_trust.host_community_extraction=コミュニティ カードを事前に公開する復号化リクエストをサーバーから受信しました。
zero_trust.host_rotation_replay=サーバーは同じハンドで 2 番目のカードのローテーションを要求しました。正当な回転はハンドごとに一意です。繰り返しは、クライアントを使用して他のプレイヤーのカードを解読しようとする試みを示唆しています。
zero_trust.host_shuffle_proof_failed=取引の検証は失敗しました。サーバーが配ったデッキはジェネシス デッキの正当なシャッフルであることが証明できませんでした。コミュニティのロック解除が拒否されたため、プライベート カードを保護するためにこのセッションは終了されます。
zero_trust.host_shuffle_proof_missing=この取引は、このハンドのデッキに対する検証可能な正直シャッフル証明なしで行われ、現在コミュニティカードが公開されています。それはバグ、ネットワークの遅延、またはホストが取引を操作しようとしている可能性があります。プレイを続けることはできますが、このテーブルから離れることを強くお勧めします。
zero_trust.deck_unverified=このハンドのデッキは正直なシャッフルとして検証できませんでした。容疑者: シャッフル証明を配布しブロードキャストするホスト「{0}」。それは、取引を操作しているホストか、証拠を差し控えたプレイヤーである可能性があります。カードはすでに配られているため、ハンドはプレイアウトされます。
zero_trust.deck_unverified_body=この異常の署名された証拠が記録されています (ゲームログ、赤色、および争点ハンドテーブルにあります)。プレイを続けることはできますが、ホストを信頼できない場合は、テーブルから離れてください。
zero_trust.seat_redraw=ホスト「{0}」が新しい座席の抽選を強制しました。これは珍しいことです。抽選は集合的で検証可能であるため、主催者は座席を選ぶことはできませんが、好みの配置が得られるまで抽選をやり直すことができます。繰り返し発生する場合は、主催者があなたの席を不正操作しようとしている可能性があります。
zero_trust.seat_redraw_body=新しい抽選は同じ方法で実行され、まだ検証可能です。主催者を含む誰も結果を選択できません。プレーヤーが開始直後にドロップした場合にこの問題が発生する可能性がありますが、何度か再試行が行われ、ホストを信頼できない場合は、テーブルから離れてください。記録されています。
zero_trust.seat_recover_mismatch=ゲームの回復時に、ホスト「{0}」によって送信された座席順序が、クライアントが保存したものと一致しません。すでに知っている誰かがテーブルの席を変更しました。もしかしたら、ホストが景気回復にかこつけて席を並べ替えようとしているのかもしれない。
zero_trust.seat_recover_mismatch_body=クライアントは、開始時に自身で確認した座席番号を保持していました。プレイヤーが途中で参加したり退場したりするのは正常です。すでにそこにいた人を再注文することはできません。ホストを信頼できない場合は、テーブルから離れてください。記録されています。
zero_trust.host_recover_action_forged=ホストは、ゲームの回復中に FORGED アクション (無効な署名) を挿入しようとしました。あなたのクライアントはそれを拒否しました。
zero_trust.host_recover_action_omitted=リカバリ中に、ホストは、あなたがプレイしてローカル データベースに記録したアクションを省略しました。クライアントはそれを自身のコピーに対して検出しましたが、黙ってアクションを削除しませんでした。
zero_trust.host_recover_balance_mismatch=ホストはゲームのリカバリ中にあなたの残高 (チップ/バイイン) を変更しようとしました。あなたのローカル記録と一致しません。あなたのクライアントはあなたの本当のバランスを保っていました。
zero_trust.host_board_peek=ホストは、FUTURE ストリートからコミュニティ カードを復号化するように要求しました (ボードを早期に読み取ろうとする試み)。あなたのクライアントは拒否しました。
zero_trust.suspect_host_prefix=容疑者: ホスト「{0}」。
zero_trust.suspect_peer_prefix=容疑者: プレイヤー「{0}」。
zero_trust.peer_alert=⚠️ [プレイヤーの異常な行動]
zero_trust.peer_suspicious_header=プレイヤーの異常または虐待的な行為があなたのテーブルで検出されました:\n
zero_trust.peer_suspicious_body=テーブルは一致するセキュリティ対策を適用し、他のプレイヤーのためにゲームが続行されます。善意が推定されます。ソフトウェアのバグである可能性がありますが、誰も非難されていません。証拠は記録されています。
zero_trust.peer_inbound_flood=認証されたトラフィックが DoS 対策しきい値を超え続けた。
zero_trust.peer_binary_flood=音声メッセージ操作が異常に高い速度で送信されました。
zero_trust.host_binary_flood=ホストは異常な高速でボイス メッセージ操作を送信しています。
zero_trust.peer_flood_log=決定を待っているアンチ DoS インシデント: プレイヤー {0}、IP {1}。理由: {2}
zero_trust.peer_flood_confirm=ユーザー {0} が過剰な量のトラフィックを送信しています。これは DoS 攻撃またはバグである可能性があります。ゲームから追放しますか?\n\nIP: {1}\n検出された理由: {2}
zero_trust.peer_flood_suppress=これらの警告を表示しないでください
zero_trust.peer_hand_ready_withheld=プレーヤーは PING に応答しますが、ゲームの実行中に次のハンドの準備ができているかどうかを確認しません。ハンドスタートがフリーズしていたため追放されました。彼らがいなくてもゲームは続行されます。
zero_trust.peer_action_withheld=プレーヤーは PING に応答しますが、ゲームの実行中に思考時間を過ぎてベット アクションを送信しません。ラウンドがフリーズしていたので追放されました。彼らがいなくてもゲームは続行されます。
zero_trust.peer_conf_withheld=プレーヤーは PING に応答しますが、ゲームの実行中に取引メッセージの受信を確認しません。テーブルの進行を妨げていたため、追放されました。彼らがいなくてもゲームは続行されます。
zero_trust.peer_deal_refusal_expelled=プレイヤーがデッキのシャッフルまたはローテーションを拒否して、連続して数回のハンドキャンセルを強制しました。ゲームを続行できるように追放されました。
zero_trust.suspicious_alert=⚠️ [サーバーの異常な動作]
zero_trust.suspicious_header=クライアントはサーバーの異常な動作を検出しました (ゲームをフリーズさせる重大なインシデントではありません):\n
zero_trust.suspicious_body=クライアントは異常な操作を拒否したため、ゲームは続行できます。これはソフトウェアのバグ (クライアントまたはサーバー) である可能性があり、誰も非難されません。ただし、バグと改ざんを区別することはできないため、安全のため、[退出] ボタンを使用してこのテーブルから退出することを強くお勧めします (お金はこのハンドでは処理されません)。
zero_trust.host_bad_wire=無効な形式または暗号曲線に属さないポイントを持つ復号化リクエストをサーバーから受信しました。
zero_trust.host_critical_command_invalid=サーバーから送信された重要な {0} コマンドを検証できませんでした。これは、非互換性、バグ、または変更されたサーバーである可能性があります。セッションは、整合性を保護するために停止されます。
zero_trust.cheater_detected=[ゼロトラスト] 修正された CoronaPoker バージョンを持つプレーヤーが検出され、不正行為を試みている可能性があります。続けますか?
zero_trust.corrupted_mac_action=サーバーは、次のものに代わって、無効な暗号化署名 (破損した MAC) を使用してアクションを処理しようとしました。
zero_trust.critical=\u274c [ゼロトラスト] 重大な警告: 無効な署名または壊れたコンセンサス。
zero_trust.critical_alert_body=隔離状態がアクティブ化されました:\nこのセッションでは、クライアントはこれ以上暗号キーをサーバーに送信しません。\nゲームは残高を保護するために数学的に凍結されています。\n\n考えられる原因は次のとおりです:\n - クライアント コード自体のバグ、\n - サーバーのバグコード、または\n - コードが変更された可能性のあるサーバー。\n\n クライアントはそれらを区別できず、告発は暗示されません。安全のため、根本原因の検討中のため、「終了」ボタンを使用してこのゲームを終了することをお勧めします (お金はこのハンドでは処理されません)。
zero_trust.critical_alert_header=ゼロトラスト インシデント!\n\nクライアントが暗号化プロトコルで異常を検出しました:\n
zero_trust.critical_session_error=[ゼロトラスト] 重大なセッション エラー
