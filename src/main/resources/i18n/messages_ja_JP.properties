game.popup_verificacion_titulo_aviso=暗号検証が不完全
game.popup_verificacion_divergente=1 人以上の参加者が、最終的なハンド状態の異なる暗号検証を報告しました。\n\nこれは、修正されたソフトウェアまたはソフトウェアの欠陥が原因である可能性があります。 CoronaPoker 原因や発信者を自動的に判断することはできません。\n\nCoronaPoker は安全なハンド クロージャを停止し、この警告が認識された後、セキュリティ障害としてテーブルを閉じます。\n\n証拠の保存場所:\n{0}
game.popup_verificacion_ausente=プレイヤー {0} が終了署名を送信しなかったため、最後のハンドはコンセンサスに達できませんでした。\n\n これは、ネットワークの停止、クライアントの障害、またはソフトウェアの変更が原因である可能性があります。 CoronaPoker は安全なハンド クロージャを停止し、この警告が認識された後、セキュリティ障害としてテーブルを閉じます。\n\n証拠の保存場所:\n{1}
