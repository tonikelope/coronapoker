zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ゼロトラスト] コンセンサス暗号検証: すべてのプレイヤーは、ローカルの手書き暗号検証に合格したことを証明されています。
zero_trust.legit2_error=\u274c [ゼロトラスト] コンセンサス暗号検証: 少なくとも 1 人のプレイヤーがローカルの手動暗号検証に合格したことが証明されていません。
zero_trust.legit=\u2714\ufe0f [ゼロトラスト] ローカルハンド暗号検証: 私のカード、コミュニティカード、および記録されたすべてのアクションは正当です。
zero_trust.legit_error=\u274c [ゼロトラスト] ローカルハンド暗号検証: 私のカード、コミュニティカード、および記録されたすべてのアクションが正当であることを確認できません。
zero_trust.lockdown_activated=\ud83d\udd12 [ロックダウン] 隔離が有効になりました。暗号キーの送信をブロックします。
