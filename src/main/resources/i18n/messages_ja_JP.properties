tooltip.cfg.custom_bots=カスタム カタログを有効にします。構成されたプロファイルが最初に追加され、次に標準ボットが追加されます。
tooltip.cfg.custom_bots.only=標準ボットの追加を防ぎます。カスタム カタログがなくなると、それ以上ボットを追加できなくなります。
tooltip.cfg.custom_bots.manage=マネージャーを開いて、ボットを作成、編集、注文します。難易度とスタイルを選択できます。
tooltip.cfg.custom_bots.row=このボットを選択して、名前、アバター、難易度、スタイル、または リバイ を編集します。
tooltip.cfg.custom_bots.avatar=有効な画像を選択するか、公式ボットのアバターをそのまま使用してください。 CoronaPoker は紛失しないように安全なコピーを保存します。
tooltip.cfg.custom_bots.name=$ を付けずに表示される名前を入力します。予約済みマーカーは自動的に追加されます。
tooltip.cfg.custom_bots.difficulty=ボットが使用する課題と戦術を設定します。イージーはレクリエーションとしてプレイし、ノーマルはより規律ある戦略を使用し、ハードは高度な戦術を使用します。
tooltip.cfg.custom_bots.personality=基本スタイルを設定します。ボットの作成時にランダムに選択され、アクティブなセッションの間保持されます。ボットは状況に応じて決定を適応させることができます。
gdx.settings.option_help.bot_difficulty.easy=何気なくプレーし、ミスが多くなります。
gdx.settings.option_help.bot_difficulty.medium=より規律ある戦略を採用し、ハンドの発達に応じて決定を調整します。
gdx.settings.option_help.bot_difficulty.hard=ブラインドを盗んだり、相手が弱そうに見えるときにプレッシャーをかけたりするなど、より高度な戦術を使用します。
gdx.settings.option_help.custom_bot_personality.random=ボットの作成時にスタイルを選択し、それをアクティブなセッションの間保持します。
gdx.settings.option_help.custom_bot_personality.nit=参加するハンドはほとんどなく、通常はチップを危険にさらす前に強力なカードを待ちます。
gdx.settings.option_help.custom_bot_personality.station=ベットをコールしてハンドに留まる傾向があります。上げる頻度は少なくなります。
gdx.settings.option_help.custom_bot_personality.tag=ハンドを選択的に選択し、ベットとレイズで主導権を握る傾向があります。
gdx.settings.option_help.custom_bot_personality.lag=より幅広いハンドをプレイし、頻繁なベットとレイズでプレッシャーを与えます。
gdx.settings.option_help.ante_mode.traditional=各アクティブ プレーヤーは、ビッグブラインド の 10 分の 1 (最も近いセントに四捨五入) を投稿します。
gdx.settings.option_help.ante_mode.big_blind=ビッグブラインド のプレーヤーは、1 つの ビッグブラインド に等しい アンティ 全体を投稿します。
gdx.settings.option_help.ante_mode.button=ボタン上のプレーヤーは 1 つの ビッグブラインド に等しい アンティ 全体を投稿します。
gdx.settings.option_help.ante_mode.small_blind=スモールブラインド のプレーヤーは、1 つの ビッグブラインド に等しい アンティ 全体を投稿します。
gdx.settings.option_help.blind_unit.minutes=ブラインド が増加する間隔は、プレイ時間の分単位で測定されます。
gdx.settings.option_help.blind_unit.hands=指定されたハンド数が終了すると、ブラインド が増加します。
gdx.settings.option_help.rebuy_cap.buy_in=リバイ 以降の最大スタックは、ゲームの バイイン に基づいています。
gdx.settings.option_help.rebuy_cap.highest_stack=リバイ テーブルの最大スタックまで。キャップは基準バイインを下回ることはありません。
gdx.settings.option_help.rabbit.off=未配付のコミュニティ カードは、ハンドが終了した後も非表示のままになります。
gdx.settings.option_help.rabbit.free=ハンドが終了した後、チップを支払わずに未配のコミュニティ カードを表示するように要求できます。
gdx.settings.option_help.rabbit.free_small_blind=ゲームの最初のリクエストは無料です。それ以降のリクエストごとに 1 スモールブラインド の費用がかかります。
gdx.settings.option_help.rabbit.free_small_and_big_blind=ゲームの最初のリクエストは無料、2 回目は 1 スモールブラインド、それ以降のリクエストは 1 ビッグブラインド かかります。
gdx.settings.option_help.window_mode.exclusive=モニターの全画面モードを使用します。
gdx.settings.option_help.window_mode.borderless=画面を境界のないウィンドウで満たし、デスクトップ表示モードを維持します。
gdx.settings.option_help.window_mode.windowed=移動やサイズ変更が可能なウィンドウで CoronaPoker が開きます。
gdx.settings.option_help.fps_limit.fixed=固定の最大フレーム レートを設定します。キャップを低くすると、消費電力を削減できます。
gdx.settings.option_help.fps_limit.monitor=フレーム レートの上限を、ゲームを表示するモニターのリフレッシュ レートに合わせます。
gdx.settings.option_help.msaa.0=テーブルとインターフェイスのマルチサンプル アンチエイリアスを無効にします。再起動が必要です。
gdx.settings.option_help.msaa.2=ピクセルごとに 2 つのサンプルを使用して、グラフィックス コストを低く抑えてエッジを滑らかにします。再起動が必要です。
gdx.settings.option_help.msaa.4=エッジ スムージングとグラフィックス コストのバランスをとるために、ピクセルあたり 4 つのサンプルを使用します。再起動が必要です。
gdx.settings.option_help.msaa.8=この設定で最も強力なスムージングを実現するには、ピクセルごとに 8 つのサンプルを使用します。再起動が必要です。
gdx.settings.option_help.card_rendering.native=レンダリングコストを削減するためにカードを直接ドローします。
gdx.settings.option_help.card_rendering.smooth=追加のフィルターを使用して、グラフィックス コストを高めてカードの端を滑らかにします。
tooltip.cfg.custom_bots.automatic_rebuy=チップがなくなったら、このカスタムボットをリバイにしましょう。グローバル自動 リバイ 制御を有効にする必要があります。
tooltip.cfg.custom_bots.order_up=選択したプロファイルを 1 つ上の位置に移動します。スクロールが必要な場合は、リストが続きます。
tooltip.cfg.custom_bots.order_down=選択したプロファイルを 1 つ下の位置に移動します。スクロールが必要な場合は、リストが続きます。
tooltip.cfg.custom_bots.random_selection=ロビーの作成時にカタログを 1 回シャッフルします。各カスタム ボットは 1 回だけ入場でき、選択はそのロビーで安定したままになります。
tooltip.cfg.custom_bots.new=すでに保存されているボットを変更せずに、新しいプロファイルを準備します。
tooltip.cfg.custom_bots.save=新しいプロファイルを追加するか、選択したボットに加えた変更を保存します。
tooltip.cfg.custom_bots.delete=確認を求めた後、選択したプロファイルを削除します。
