game.showdown_forfeit_msg=注意: 次のプレイヤーのショーダウン 検証は失敗し、カードは公開されません:\n\n%nicks%\n\n これらのプレイヤーはショーダウン レジスタンス (自動フォールド) から除外され、このポットに勝つことはできません。ゲームは通常通り続行されます。
zero_trust.peer_sra_corrupt=ショーダウン 署名は本物ですが、ピアの SRA キーは有効なカードに解決されません。これは、ピアが意図的に破損したキーに署名した場合、またはクライアントにバグがある場合にのみ発生します。どちらであるか判断できないため、安全を確保するためにゲームを終了します。
zero_trust.straddle_recover_mismatch=ハンドを回復しているときに、ホストは、自分のローカル コピーが記録したものとは異なる ストラドル をアナウンスしました。これは、ホストが回復された ストラドル を改ざんするか、そのクライアントにバグがある場合にのみ発生します。手はまだ信頼できるコピーから再構築されていますが、予防措置として警告します。
zero_trust.rit_recover_mismatch=ハンドを回復している間に、ホストは、自分のローカル コピーが記録したものとは異なる run-it-tws の結果を発表しました。これは、ホストが回復された結果を改ざんするか、そのクライアントにバグがある場合にのみ発生します。手はまだ信頼できるコピーから再構築されていますが、予防措置として警告します。
zero_trust.peer_sra_corrupt_registro=\u2014 ショーダウン キーは署名されていますが、カードに解決されません。チートまたはクライアントのバグの可能性があります。
