radar.el_servidor_ha_activado_el=サーバーはこのゲームのアンチチート RADAR を有効にしました。どのプレイヤーも、ゲーム中に他のプレイヤーのアンチチートレポートをリクエストできます。これには、プレイヤーのスクリーンショット（カードを見せていない状態）とシステムプロセスリストが含まれます。
