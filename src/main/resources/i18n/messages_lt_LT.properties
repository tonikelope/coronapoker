tooltip.cfg.straddle_on_timeout=Paskelbkite straddle automatiškai, kai baigiasi jo raginimo laikas. Tai turi įtakos tik jūsų grotuvui ir pagal numatytuosius nustatymus yra išjungta.
tooltip.cfg.structure=Privalomieji statymai lygio žaidimo struktūra.
