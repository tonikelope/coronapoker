tooltip.cfg.custom_bots=Įjungia pasirinktinį katalogą. Pirmiausia pridedami sukonfigūruoti profiliai, po to standartiniai robotai.
tooltip.cfg.custom_bots.only=Neleidžia pridėti standartinių robotų. Išnaudojus pasirinktinį katalogą, nebegalima pridėti robotų.
tooltip.cfg.custom_bots.manage=Norėdami sukurti, redaguoti ir užsisakyti robotus, atidarykite tvarkyklę. Galite pasirinkti jų sudėtingumą ir stilių.
tooltip.cfg.custom_bots.row=Pasirinkite šį robotą, kad galėtumėte redaguoti jo pavadinimą, pseudoportretą, sunkumą, stilių arba papildoma įpirka.
tooltip.cfg.custom_bots.avatar=Pasirinkite tinkamą vaizdą arba pasilikite oficialų boto avatarą. CoronaPoker saugo saugią kopiją, kad ji nebūtų prarasta.
tooltip.cfg.custom_bots.name=Įveskite matomą pavadinimą be $. Rezervuotas žymeklis pridedamas automatiškai.
tooltip.cfg.custom_bots.difficulty=Nustato iššūkį ir taktiką, kurią naudoja robotas. „Easy“ žaidžia laisvalaikio tikslais, „Normal“ naudoja disciplinuotą strategiją, o „Hard“ – pažangią taktiką.
tooltip.cfg.custom_bots.personality=Nustato pagrindinį stilių. Atsitiktinai jį parenka, kai sukuriamas robotas, ir išsaugo jį aktyviam seansui. Botas gali pritaikyti savo sprendimus prie situacijos.
gdx.settings.option_help.bot_difficulty.easy=Žaidžia atsainiai ir dažniau klysta.
gdx.settings.option_help.bot_difficulty.medium=Naudoja drausmingesnę strategiją ir koreguoja sprendimus tobulėjant rankai.
gdx.settings.option_help.bot_difficulty.hard=Naudoja pažangesnę taktiką, pvz., vogti privalomieji statymai arba spaudimą, kai priešininkas atrodo pažeidžiamas.
gdx.settings.option_help.custom_bot_personality.random=Parenka stilių, kai sukuriamas robotas, ir išsaugo jį aktyviam seansui.
gdx.settings.option_help.custom_bot_personality.nit=Įeina į kelias rankas ir dažniausiai laukia stiprių kortų prieš rizikuodamas žetonais.
gdx.settings.option_help.custom_bot_personality.station=Linkęs atsakyti į statymus ir likti rankoje. Kelia rečiau.
gdx.settings.option_help.custom_bot_personality.tag=Selektyviai renkasi rankas ir linkęs pirmauti atlikdamas statymus ir kėlimus.
gdx.settings.option_help.custom_bot_personality.lag=Žaidžia įvairesnėmis rankomis ir daro spaudimą dažnai statydamas ir padidindamas.
gdx.settings.option_help.ante_mode.traditional=Kiekvienas aktyvus žaidėjas paskelbia vieną dešimtąją didysis privalomasis statymas, suapvalintą iki artimiausio cento.
gdx.settings.option_help.ante_mode.big_blind=Žaidėjas didysis privalomasis statymas paskelbia visą ante, lygų vienam didysis privalomasis statymas.
gdx.settings.option_help.ante_mode.button=Mygtuko grotuvas paskelbia visą ante, lygų vienam didysis privalomasis statymas.
gdx.settings.option_help.ante_mode.small_blind=Žaidėjas mažasis privalomasis statymas paskelbia visą ante, lygų vienam didysis privalomasis statymas.
gdx.settings.option_help.rebuy_cap.buy_in=Jūsų didžiausias krūvas po papildoma įpirka priklauso nuo žaidimo įpirka.
gdx.settings.option_help.rebuy_cap.highest_stack=Papildoma įpirka iki didžiausios krūvos prie stalo. Viršutinė riba niekada nenukrenta žemiau standartinės įpirka.
gdx.settings.option_help.rabbit.off=Neišdalintos bendros kortos lieka paslėptos pasibaigus kortai.
gdx.settings.option_help.rabbit.free=Galite paprašyti pamatyti neišdalytas bendrąsias kortas po to, kai ranka baigiasi nesumokėjus žetonų.
gdx.settings.option_help.rabbit.free_small_blind=Jūsų pirmoji žaidimo užklausa yra nemokama. Kiekviena vėlesnė užklausa kainuoja vieną mažasis privalomasis statymas.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Pirmoji žaidimo užklausa yra nemokama, antroji kainuoja vieną mažasis privalomasis statymas, o vėlesnės užklausos kainuoja vieną didysis privalomasis statymas.
gdx.settings.option_help.window_mode.exclusive=Naudoja monitoriaus viso ekrano režimą.
gdx.settings.option_help.window_mode.borderless=Ekranas užpildomas langu be paraščių ir išlaikomas darbalaukio rodymo režimas.
tooltip.cfg.custom_bots.automatic_rebuy=Leidžia šiam tinkintam botui papildoma įpirka, kai baigiasi lustai. Turi būti įjungtas visuotinis automatinis valdymas papildoma įpirka.
tooltip.cfg.custom_bots.order_up=Perkelia pasirinktą profilį viena pozicija aukštyn. Sąrašas pateikiamas po jo, kai reikia slinkti.
tooltip.cfg.custom_bots.order_down=Perkelia pasirinktą profilį viena pozicija žemyn. Sąrašas pateikiamas po jo, kai reikia slinkti.
tooltip.cfg.custom_bots.random_selection=Sukūrus fojė, katalogas sumaišomas vieną kartą. Kiekvienas tinkintas robotas gali patekti tik vieną kartą, o pasirinkimas išlieka stabilus tam fojė.
tooltip.cfg.custom_bots.new=Parengia naują profilį nekeičiant jau išsaugotų robotų.
tooltip.cfg.custom_bots.save=Prideda naują profilį arba išsaugo pasirinkto roboto pakeitimus.
tooltip.cfg.custom_bots.delete=Pašalina pasirinktą profilį paprašius patvirtinimo.
