zero_trust.cascade_refused=Prisijungęs žaidėjas atsisakė dalyvauti kaladžių maišymo kaskadoje. Žaidimas sustabdytas. Jie turės pagrįsti savo atsisakymą būti pakartotinai priimti.
zero_trust.pocket_unlock_refused=Prisijungęs žaidėjas atsisakė pateikti savo raktą, kad iššifruotų kišenines korteles. Žaidimas sustabdytas. Jie turės pagrįsti savo atsisakymą būti pakartotinai priimti.
zero_trust.community_unlock_refused=Prisijungęs žaidėjas atsisakė pateikti savo raktą, kad atskleistų bendrąsias kortas. Žaidimas sustabdytas. Jie turės pagrįsti savo atsisakymą būti pakartotinai priimti.
zero_trust.host_showdown_sig_missing=kortų atvertimas raktas buvo gautas iš serverio BE autoriaus kriptografinio parašo arba su netinkamai suformuotu parašu. Serveris gali pakeisti laido raktą.
zero_trust.host_showdown_sig_invalid=Iš serverio buvo gautas raktas kortų atvertimas su NETEISINGU kriptografiniu parašu. Serveris gali pakeisti laido raktą.
zero_trust.host_potcards_mismatch=Serverio atsiųstas paprastas tekstas kortų atvertimas NESUTAIPIA vietinės dalies iššifravimo su pasirašytu raktu rezultato. Gali būti, kad serveris siunčia netikras korteles kortų atvertimas.
zero_trust.host_community_garbage=Iš serverio gauti kriptografiniai bendrosios kortelės duomenys yra nenuoseklūs (gabalas neiššifruojamas į galiojančią denio kortelę arba neatitinka serverio pasirašyto pranešimo). Galimos priežastys: KLAIDA kurioje nors programinės įrangos versijoje, serverio versija, kurios kodas galėjo būti pakeistas, arba vietinio tapatybės rakto pažeidimas. Klientas negali pasakyti skirtumo ir nieko nekaltina.
zero_trust.host_unlock_out_of_order=Iš serverio iššifravimo užklausa gauta ne eilės tvarka (netinkama gatvė, pasikartojantis lizdas, laipsniškas eilės nutraukimas arba užklausa, pateikta prieš uždarant ankstesnę gatvę).
zero_trust.host_cascade_mid_hand=Iš serverio buvo gauta maišymo iš naujo užklausa vykstančios rankos viduryje (perrašytų mano iššifravimo raktą).
zero_trust.host_pocket_extraction=Iš serverio gauta užklausa iššifruoti, kuri turės įtakos JŪSŲ privačioms kortelėms.
zero_trust.host_community_extraction=Iš serverio gauta iššifravimo užklausa, kuri iš anksto atskleistų bendrąją kortelę.
zero_trust.host_rotation_replay=Serveris paprašė antros kortos pasukimo toje pačioje rankoje. Teisėtas sukimas yra unikalus kiekvienai rankai. Pakartojimas rodo bandymą panaudoti savo klientą kitų žaidėjų kortoms iššifruoti.
zero_trust.host_shuffle_proof_failed=Sandorio patvirtinimas nepavyko: nepavyko įrodyti, kad serverio dalijamas denis yra sąžiningas genezės denio maišymas. Bendruomenės atrakinimas buvo atmestas ir ši sesija nutraukiama siekiant apsaugoti privačias korteles.
zero_trust.host_shuffle_proof_missing=Sandoris buvo pasiektas be patikrinamo sąžiningo maišymo įrodymo šios rankos kaladėje, o dabar atskleidžiamos bendros kortos. Tai gali būti klaida ar tinklo delsimas arba priegloba, bandanti manipuliuoti sandoriu. Galite žaisti toliau, bet labai rekomenduojama palikti šį stalą.
zero_trust.deck_unverified=Šios rankos kaladė NEGALI būti patikrinta kaip sąžiningas maišymas. Įtariamasis: vedėjas „{0}“, kuris parduoda ir transliuoja maišymo įrodymą. Tai gali būti šeimininkas, manipuliuojantis sandoriu, arba žaidėjas, kuris nuslėpė savo įrodymus. Ranka žaidžiama, nes kortos jau išdalintos.
zero_trust.deck_unverified_body=Buvo įrašyti pasirašyti šios anomalijos įrodymai (žaidimo žurnale, raudonai ir ginčijamų rankų lentelėje). Galite žaisti toliau, bet jei nepasitikite šeimininku, palikite stalą.
zero_trust.seat_redraw=Rengėjas „{0}“ privertė ištraukti NAUJĄ vietą. Tai NEPRASTA: burtai yra kolektyviniai ir patikrinami, todėl vedėjas negali pasirinkti vietų, bet GALI iš naujo riedėti, kol gaus patinkančią tvarką. Jei tai kartojasi, gali būti, kad šeimininkas bando sutvarkyti jūsų vietą.
zero_trust.seat_redraw_body=Naujas burtų traukimas vyko taip pat ir vis dar yra patikrinamas: niekas, įskaitant šeimininką, negali pasirinkti rezultato. Taip gali nutikti, jei žaidėjas nukrito iškart pradžioje, bet jei matote kelis bandymus ir nepasitikite šeimininku, palikite stalą. Jis buvo užregistruotas.
zero_trust.seat_recover_mismatch=Atkūrus žaidimą, prieglobos „{0}“ atsiųsta sėdimų vietų tvarka NESUTAPA to, kurią išsaugojo jūsų klientas: kažkas, kurį jau pažinojote, pakeitė vietą prie stalo. Tai gali būti šeimininkas, bandantis pertvarkyti vietas, prisidengdamas atkūrimu.
zero_trust.seat_recover_mismatch_body=Jūsų klientas pasiliko sėdimosios vietos nuorodą, kurią pats patikrino pradžioje. Žaidėjų prisijungimas ar pasitraukimas tarp jų yra normalu. Perskirstyti asmenį, kuris jau buvo ten, nėra. Jei nepasitikite šeimininku, palikite stalą. Jis buvo užregistruotas.
zero_trust.host_recover_action_forged=Šeimininkas bandė atlikti SUKLASTOTĄ veiksmą (netinkamą parašą) žaidimo atkūrimo metu. Jūsų klientas atsisakė.
zero_trust.host_recover_action_omitted=Atkūrimo metu pagrindinis kompiuteris praleido veiksmą, kurį JŪS atlikote ir įrašėte į vietinę duomenų bazę. Jūsų klientas aptiko jį prieš savo kopiją ir tyliai neatmetė jūsų veiksmo.
zero_trust.host_recover_balance_mismatch=Šeimininkas bandė pakeisti jūsų balansą (žetonai/įpirka) žaidimo atkūrimo metu: jis neatitinka jūsų vietinio įrašo. Jūsų klientas išlaikė jūsų tikrąją pusiausvyrą.
zero_trust.host_board_peek=Šeimininkas paprašė iššifruoti bendrą kortelę iš ATEITIES gatvės (bandymas anksti perskaityti lentą). Jūsų klientas atsisakė.
zero_trust.suspect_host_prefix=Įtariamas: priegloba „{0}“.
zero_trust.suspect_peer_prefix=Įtariamasis: žaidėjas „{0}“.
zero_trust.peer_alert=⚠️ [ANOMALUS ŽAIDĖJO ELGESYS]
zero_trust.peer_suspicious_header=Prie jūsų stalo aptiktas nenormalus ar įžeidžiantis žaidėjo elgesys:\n
zero_trust.peer_suspicious_body=Lentelėje buvo pritaikyta atitinkama apsaugos priemonė ir žaidimas tęsiamas kitiems žaidėjams. Sąžiningumas yra preziumuojamas. Tai gali būti programinės įrangos klaida ir niekas nėra apkaltintas. Įrodymai yra užfiksuoti.
zero_trust.peer_inbound_flood=Nuolatinis autentifikuotas srautas, viršijantis anti-DoS slenkstį.
zero_trust.peer_binary_flood=Balso pranešimų operacijos siunčiamos neįprastai dideliu greičiu.
zero_trust.host_binary_flood=Priegloba siunčia balso pranešimų operacijas neįprastai dideliu greičiu.
zero_trust.peer_flood_log=Anti-DoS incidentas laukia sprendimo: grotuvas {0}, IP {1}. Priežastis: {2}
zero_trust.peer_flood_confirm=Naudotojas {0} siunčia per daug srauto. Tai gali būti DoS ataka arba klaida. Pašalinti juos iš žaidimo?\n\nIP: {1}\nAptikta priežastis: {2}
zero_trust.peer_flood_suppress=Nerodykite šių įspėjimų
zero_trust.peer_hand_ready_withheld=Žaidėjas atsako PING, bet nepatvirtina pasirengimo kitai rankai, kol žaidimas vyksta. Jis užšaldė rankos paleidimą ir buvo išmestas. Žaidimas tęsiasi be jų.
zero_trust.peer_action_withheld=Žaidėjas atsako į PING, bet nesiunčia savo statymo veiksmo žaidimui vykstant, praėjus mąstymo laikui. Jis buvo užšalęs ir buvo išsiųstas. Žaidimas tęsiasi be jų.
zero_trust.peer_conf_withheld=Žaidėjas atsako į PING, bet nepatvirtina, kad gavo dalijimosi pranešimą, kol žaidimas vyksta. Jis neleido stalui pajudėti ir buvo IŠLINTAS. Žaidimas tęsiasi be jų.
zero_trust.peer_deal_refusal_expelled=Žaidėjas priverstinai atšaukė keletą kortų iš eilės, atsisakydamas maišyti arba pasukti. Jis buvo išmestas, todėl žaidimas gali tęstis.
zero_trust.suspicious_alert=⚠️ [ANOMALUS SERVERIO ELGESYS]
zero_trust.suspicious_header=Jūsų klientas aptiko neįprastą serverio elgseną (ne kritinį incidentą, dėl kurio žaidimas užšaldomas):\n
zero_trust.suspicious_body=Jūsų klientas atmetė anomalią operaciją ir žaidimas GALI tęstis. Darome prielaidą, kad tai gali būti programinės įrangos KLAIDA (klientas arba serveris) ir niekas nėra apkaltintas. Tačiau kadangi klaidos negalima atskirti nuo klastojimo, JŪSŲ SAUGUMO DĖL GRIŠTAI REKOMENDUOJAME PALEIKTI nuo šios lentelės paspaudus mygtuką „Palikti“ (jūsų pinigai šioje rankoje NEBUS apdorojami).
zero_trust.host_bad_wire=Iš serverio gauta iššifravimo užklausa su netinkamu formatu arba taškais, kurie nepriklauso kriptografinei kreivei.
zero_trust.host_critical_command_invalid=Nepavyko patvirtinti serverio išsiųstos kritinės komandos {0}. Tai gali būti nesuderinamumas, klaida arba pakeistas serveris. Sesija sustabdoma siekiant apsaugoti jos vientisumą.
zero_trust.cheater_detected=[ZERO-TRUST] Buvo aptiktas žaidėjas su modifikuota CoronaPoker versija, o tai rodo, kad jis gali bandyti apgauti. Ar norite tęsti?
zero_trust.corrupted_mac_action=Serveris bandė apdoroti veiksmą su netinkamu kriptografiniu parašu (sugadintas MAC) vardu:
zero_trust.critical=\u274c [NULIO PASITIKĖJIMO] KRITINIS ĮSPĖJIMAS: NETEISINGAS PARAŠAS ARBA NUTRAUKTAS SUSITARIMAS.
zero_trust.critical_alert_body=KARANTINO BŪSENA ĮJUNGTA:\nJūsų klientas NESIUSS daugiau kriptografinių raktų į serverį šios sesijos metu.\nŽaidimas yra matematiškai užšaldytas, kad apsaugotumėte jūsų pusiausvyrą.\n\nGALIMOS priežastys yra šios:\n  - KLAIDA pačiame kliento kode,\n  - KLAIDA serverio kode arba\n  - SERVERIS, kurio kodas galėjo būti pakeistas.\n\nKlientas negali jų atskirti ir JOKIŲ kaltinimų nėra. Saugumo sumetimais ir laukiant pagrindinės priežasties peržiūros REKOMENDUOJAME IŠĖTI iš šio žaidimo spustelėjus mygtuką „Išeiti“ (jūsų pinigai šioje rankoje NEBUS apdorojami).
zero_trust.critical_alert_header=NULINIO PASITIKĖJIMO ĮVYKIS!\n\nJūsų klientas aptiko kriptografinio protokolo anomaliją:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITINĖ SESIJA KLAIDA
