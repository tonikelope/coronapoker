game.showdown_forfeit_msg=PRANEŠIMAS: kortų atvertimas patvirtinimas nepavyko šiems žaidėjams ir jų kortos NEBUS atskleistos:\n\n%nicks%\n\nTie žaidėjai pašalinami iš kortų atvertimas pasipriešinimo (automatinio nusimetimo) ir CANNOT. Žaidimas tęsiasi įprastai.
zero_trust.peer_sra_corrupt=Parašas kortų atvertimas yra tikras, tačiau bendraamžio SRA raktas neatitiks galiojančių kortelių. Tai atsitinka tik tuo atveju, jei partneris tyčia pasirašė sugadintą raktą arba jų klientas yra klaidingas. Negalime pasakyti, kuris, ir dėl saugumo baigiame žaidimą.
zero_trust.straddle_recover_mismatch=Atkurdamas ranką šeimininkas paskelbė straddle, kuris skiriasi nuo to, kurį įrašė jūsų vietinė kopija. Taip nutinka tik tuo atveju, jei pagrindinis kompiuteris pažeidžia atkurtą straddle arba jo klientas yra klaidingas. Ranka vis dar atkurta iš jūsų patikimos kopijos, tačiau dėl atsargumo įspėjame.
zero_trust.rit_recover_mismatch=Atgaunant ranką, šeimininkas paskelbė „paleiskite du kartus“ rezultatą, kuris skiriasi nuo to, kurį užfiksavo jūsų vietinė kopija. Taip nutinka tik tuo atveju, jei pagrindinis kompiuteris pažeidžia atkurtą rezultatą arba jo klientas yra klaidingas. Ranka vis dar atkurta iš jūsų patikimos kopijos, tačiau dėl atsargumo įspėjame.
zero_trust.peer_sra_corrupt_registro=\u2014 kortų atvertimas raktas pasirašytas, bet neišskiriamas į korteles. Galima apgaulė arba kliento klaida.
