game.popup_verificacion_firma_invalida=Šios partijos metu vienas ar daugiau dalyvių ({0}) aptiko netinkamą veiksmo kriptografinį parašą.\n\nVisų dalyvių gauti duomenys buvo nuoseklūs (galutinės grandinės maišos atitiko), tačiau bent vienas veiksmas nebuvo tinkamai pasirašytas laukiamo autoriaus.\n\nsaugus įspėjimas bus uždarytas po perspėjimo. yra pripažinta.\n\nĮrodymai išsaugoti:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Pastaba: {0} negavo šios rankos sąžiningo maišymo įrodymo. Įrodymai: {1}
game.popup_verificacion_host_sin_prueba=Vienas ar daugiau dalyvių ({0}) negavo sąžiningo maišymo įrodymo dėl šios rankos.\n\nGalutinė grandinės maiša atitinka visus dalyvius, todėl rankų veiksmai yra nuoseklūs. Tinkamas pagrindinis kompiuteris visada siunčia šį įrodymą, todėl pasikartojantis arba atrankinis nebuvimas gali reikšti pakeistą programinę įrangą arba programinės įrangos defektą.\n\nRanka buvo išspręsta, tačiau dėl atsargumo rekomenduojama išeiti iš žaidimo.\n\nĮrodymai išsaugoti:\n{1}
game.popup_verificacion_titulo_alerta=Kriptografinio patikrinimo skirtumai
game.popup_verificacion_titulo_aviso=Kriptografinis patvirtinimas nebaigtas
game.popup_verificacion_divergente=Vienas ar daugiau dalyvių pranešė apie skirtingą galutinės rankos būsenos kriptografinį patikrinimą.\n\nTai gali sukelti modifikuota programinė įranga arba programinės įrangos defektas. CoronaPoker negali automatiškai nustatyti priežasties arba kas ją sukėlė.\n\nCoronaPoker sustabdė saugų rankų uždarymą ir uždarys stalą dėl saugumo gedimo po šio įspėjimo patvirtinimo.\n\nĮrodymai išsaugoti:\n{0}
game.popup_verificacion_ausente=Paskutine ranka nepavyko pasiekti bendro sutarimo, nes žaidėjas {0} neatsiuntė uždarymo parašo.\n\nTai gali nutikti dėl tinklo nutrūkimo, kliento gedimo arba pakeistos programinės įrangos. CoronaPoker sustabdė saugų rankų uždarymą ir uždarys stalą dėl saugumo gedimo, kai bus patvirtintas šis įspėjimas.\n\nĮrodymai išsaugoti:\n{1}
game.mano_verificacion_interrumpida=KRITINIS: nepavyko saugiai uždaryti ranka ({0}). Lentelė užsidarys dėl saugumo gedimo. Įrodymai: {1}
game.popup_verificacion_interrumpida=CoronaPoker nepavyko užbaigti paskutinės rankos kriptografinio uždarymo protokolo.\n\nGedimas: {0}\n\nKrovinys lieka atviras atkūrimui. Lentelė bus uždaryta kaip saugos klaida tik patvirtinus šį įspėjimą.\n\nĮrodymai išsaugoti:\n{1}
