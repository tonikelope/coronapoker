game.showdown_forfeit_msg=MERKNAD: showdown verifisering mislyktes for følgende spiller(e) og kortene deres vil IKKE bli avslørt:\n\n%nicks%\n\nDisse spillerne er ekskludert fra showdown motstand (automatisk fold) og KAN IKKE vinne denne potten. Spillet fortsetter normalt.
zero_trust.peer_sra_corrupt=showdown-signaturen er ekte, men jevnaldrendes SRA-nøkkel gir ikke gyldige kort. Dette skjer bare hvis kollegaen med hensikt har signert en korrupt nøkkel eller klienten er buggy. Vi kan ikke si hvilken, og for sikkerhets skyld avslutter vi kampen.
zero_trust.straddle_recover_mismatch=Mens han gjenopprettet hånden, annonserte verten en straddle forskjellig fra den din egen lokale kopi hadde spilt inn. Dette skjer bare hvis verten tukler med den gjenopprettede straddle eller klienten er buggy. Hånden er fortsatt rekonstruert fra din pålitelige kopi, men vi advarer deg som en forholdsregel.
zero_trust.rit_recover_mismatch=Mens han gjenopprettet hånden, annonserte verten et run-it-twice-resultat som var forskjellig fra det din egen lokale kopi hadde spilt inn. Dette skjer bare hvis verten tukler med det gjenopprettede resultatet eller klienten er buggy. Hånden er fortsatt rekonstruert fra din pålitelige kopi, men vi advarer deg som en forholdsregel.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown nøkkel signert, men løses ikke til kort. Mulig juks eller klientfeil.
