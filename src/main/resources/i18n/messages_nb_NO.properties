zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Binær logg lastet inn i minnet ({0} signaturer klare for Synchronized Replay).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Kryptografisk shuffle-kaskade mislyktes. Hånden er kansellert.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Kunne ikke låse opp private kort (en spiller svarte ikke i tide). Hånden er kansellert.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Et dekryptert kort samsvarer ikke med noen gyldige kort i kortstokken. Spillet er avlyst.
peer.not_enough_players=En spiller falt under shuffle og det er ikke lenger nok spillere til å dele ut hånden.
peer.unlock_no_testament=En spiller koblet fra uten å forlate dekrypteringsnøkkelen. Hånden er kansellert.
peer.broadcast_failed=Nettverksfeil under kringkasting av private kort. Hånden er kansellert.
peer.recovery_action_data_unavailable=Den lagrede handlingsloggen kunne ikke leses. Hånden har blitt kansellert trygt og vil komme tilbake til gjenoppretting.
straddle.deferred_release_failed=blinder straddle-kortene kunne ikke avsløres (en spiller koblet fra eller nektet å samarbeide). Hånden er kansellert.
peer.state_inconsistent=Forhandlerstaten ble inkonsekvent. Hånden er kansellert.
peer.bot_no_token=En bot har ikke dekrypteringsnøkkelen klar. Hånden er kansellert.
peer.community_unlock_no_testament=En spiller koblet fra uten å forlate nøkkelen for å avsløre felleskort. Hånden er kansellert.
peer.dropped_during_cascade=En spiller koblet fra under den kryptografiske stokkingen. Hånden er kansellert.
peer.dropped_during_rotation=En spiller koblet fra under kortstokkens kryptografiske rotasjon. Hånden er kansellert.
zero_trust.rotation_refused=En tilkoblet spiller nektet å levere dekkrotasjonsnøkkelen. Spillet er stoppet. De må begrunne avslaget på å bli tatt opp på nytt.
zero_trust.cascade_refused=En tilkoblet spiller nektet å delta i stokkingen. Spillet er stoppet. De må begrunne avslaget på å bli tatt opp på nytt.
zero_trust.pocket_unlock_refused=En tilkoblet spiller nektet å levere nøkkelen sin for å dekryptere lommekort. Spillet er stoppet. De må begrunne avslaget på å bli tatt opp på nytt.
zero_trust.community_unlock_refused=En tilkoblet spiller nektet å levere nøkkelen sin for å avsløre felleskort. Spillet er stoppet. De må begrunne avslaget på å bli tatt opp på nytt.
zero_trust.host_showdown_sig_missing=En showdown nøkkel ble mottatt fra serveren UTEN forfatterens kryptografiske signatur, eller med en misformet signatur. Serveren kan erstatte nøkkelen på ledningen.
zero_trust.host_showdown_sig_invalid=En showdown nøkkel ble mottatt fra serveren med en Ugyldig kryptografisk signatur. Serveren kan erstatte nøkkelen på ledningen.
zero_trust.host_potcards_mismatch=showdown-klarteksten sendt av serveren SAMMER IKKE med resultatet av å dekryptere din lokale del med den signerte nøkkelen. Serveren kan sende falske kort på showdown.
zero_trust.host_community_garbage=De kryptografiske felleskortdataene som mottas fra serveren er inkonsekvente (stykket dekrypterer ikke til et gyldig kortstokk, eller samsvarer ikke med serverens signerte kunngjøring). Mulige årsaker: en FEIL i en eller annen versjon av programvaren, en serverversjon hvis kode kan ha blitt endret, eller korrupsjon av lokal identitetsnøkkel. Klienten kan ikke se forskjell og anklager IKKE noen.
zero_trust.host_unlock_out_of_order=En dekrypteringsforespørsel er mottatt fra serveren uten rekkefølge (feil gate, gjentatt spor, fase ut av drift eller forespørsel utstedt før forrige gate stengte).
zero_trust.host_cascade_mid_hand=En forespørsel om shuffle omstart er mottatt fra serveren midt i en pågående hånd (ville overskrive dekrypteringsnøkkelen min).
zero_trust.host_pocket_extraction=En dekrypteringsforespørsel er mottatt fra serveren som vil påvirke DINE EGNE private kort.
zero_trust.host_community_extraction=En dekrypteringsforespørsel er mottatt fra serveren som vil avsløre et felleskort på forhånd.
zero_trust.host_rotation_replay=Serveren ba om en andre kortrotasjon i samme hånd. Den legitime rotasjonen er unik per hånd. En gjentakelse foreslår et forsøk på å bruke klienten din til å dekryptere andre spilleres kort.
zero_trust.host_shuffle_proof_failed=Verifiseringen av avtalen mislyktes: kortstokken serveren delte ut kunne ikke bevises å være en ærlig stokking av genesis-dekket. Fellesopplåsing har blitt nektet, og denne økten blir avsluttet for å beskytte private kort.
zero_trust.host_shuffle_proof_missing=Avtalen kom uten et verifiserbart bevis for ærlig stokking for denne håndens kortstokk, og felleskort blir nå avslørt. Det kan være en feil eller en nettverksforsinkelse, eller en vert som prøver å manipulere avtalen. Du kan fortsette å spille, men det anbefales på det sterkeste å forlate dette bordet.
zero_trust.deck_unverified=Kortstokken til denne hånden kunne IKKE verifiseres som en ærlig shuffle. MISTENT: vert «{0}», som deler ut og sender shuffle-beviset. Det kan være verten som manipulerer avtalen eller en spiller som holdt tilbake bevisene sine. Hånden spilles ut fordi kortene allerede er delt ut.
zero_trust.deck_unverified_body=Signerte bevis på denne uregelmessigheten er registrert (i spillloggen, i rødt og i tabellen med omstridte hender). Du kan fortsette å spille, men hvis du ikke stoler på verten, forlat bordet.
zero_trust.seat_redraw=Verten «{0}» tvang fram en NY setetrekning. Dette er UVANLIG: trekningen er kollektiv og verifiserbar, så verten kan ikke velge plassene, men den KAN rulle på nytt til den får en ordning den liker. Hvis det gjentar seg, kan det være verten som prøver å rigge setet ditt.
zero_trust.seat_redraw_body=Den nye trekningen gikk på samme måte og er fortsatt verifiserbar: ingen, inkludert verten, kan velge utfallet. Det kan skje hvis en spiller falt rett i starten, men hvis du ser flere forsøk på nytt og du ikke stoler på verten, forlat bordet. Den er loggført.
zero_trust.seat_recover_mismatch=Ved spillgjenoppretting samsvarer IKKE plassrekkefølgen sendt av verten "{0}" den som klienten din hadde lagret: noen du allerede kjente har byttet plass ved bordet. Det kan være en vert som prøver å omorganisere setene i ly av gjenopprettingen.
zero_trust.seat_recover_mismatch_body=Kunden din beholdt sittereferansen som den bekreftet selv ved starten. Spillere som blir med eller går i mellom er normalt. Å ombestille noen som allerede var der er ikke. Hvis du ikke stoler på verten, forlat bordet. Den er loggført.
zero_trust.host_recover_action_forged=Verten prøvde å injisere en FORGED-handling (ugyldig signatur) under gjenoppretting av spillet. Din klient nektet det.
zero_trust.host_recover_action_omitted=Under gjenoppretting utelot verten en handling som DU spilte og hadde registrert i din lokale database. Klienten din oppdaget den mot sin egen kopi og droppet IKKE handlingen i det stille.
zero_trust.host_recover_balance_mismatch=Verten prøvde å endre saldoen din (sjetonger/innkjøp) under spillgjenoppretting: det samsvarer ikke med din lokale rekord. Din klient beholdt DIN virkelige balanse.
zero_trust.host_board_peek=Verten ba om å dekryptere et felleskort fra en FUTURE gate (et forsøk på å lese tavlen tidlig). Din klient nektet.
zero_trust.suspect_host_prefix=MISTENT: vert "{0}".
zero_trust.suspect_peer_prefix=MISTENT: spiller "{0}".
zero_trust.peer_alert=⚠️ [ANOMAL SPILLEREDFERD]
zero_trust.peer_suspicious_header=Unormal eller fornærmende oppførsel fra en spiller har blitt oppdaget ved bordet ditt:\n
zero_trust.peer_suspicious_body=Tabellen brukte det samsvarende sikkerhetstiltaket og spillet fortsetter for de andre spillerne. Det forutsettes god tro. Det kan være en programvarefeil og ingen blir anklaget. Bevisene er registrert.
zero_trust.peer_inbound_flood=Vedvarende autentisert trafikk over anti-DoS-terskelen.
zero_trust.peer_binary_flood=Talemeldingsoperasjoner sendt med en uvanlig høy hastighet.
zero_trust.host_binary_flood=Verten sender talemeldingsoperasjoner med en uvanlig høy hastighet.
zero_trust.peer_flood_log=Anti-DoS-hendelse venter på avgjørelse: spiller {0}, IP {1}. Årsak: {2}
zero_trust.peer_flood_confirm=Bruker {0} sender en overdreven mengde trafikk. Dette kan være et DoS-angrep eller en feil. Utvise dem fra spillet?\n\nIP: {1}\nOppdaget årsak: {2}
zero_trust.peer_flood_suppress=Ikke vis disse advarslene
