game.popup_verificacion_divergente=En eller flere deltakere rapporterte om en annen kryptografisk verifisering av den endelige håndtilstanden.\n\nDette kan være forårsaket av modifisert programvare eller av en programvaredefekt. CoronaPoker kan ikke automatisk fastslå årsaken eller hvem som oppsto den.\n\nCoronaPoker stoppet sikker håndlukking og vil lukke bordet som en sikkerhetsfeil etter at denne advarselen er bekreftet.\n\nBevis lagret i:\n{0}
game.popup_verificacion_ausente=Den siste hånden kunne ikke nå konsensus fordi spilleren {0} ikke sendte en avsluttende signatur.\n\nDette kan være forårsaket av et nettverksbrudd, en klientfeil eller modifisert programvare. CoronaPoker stoppet sikker håndlukking og vil lukke bordet som en sikkerhetsfeil etter at denne advarselen er bekreftet.\n\nBevis lagret i:\n{1}
