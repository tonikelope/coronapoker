game.popup_verificacion_firma_invalida=I løpet av denne hånden, en eller flere deltakere ({0}) oppdaget en ugyldig kryptografisk signatur på en handling.\n\nDataene mottatt av alle deltakerne var konsistente (de siste kjede-hashene samsvarte), men minst én handling ble ikke riktig signert av den forventede forfatteren.\n\nCoronaPoker stoppet sikker håndlukking og vil lukke bordet som en sikkerhetsfeil etter at denne advarselen er bekreftet.\n\nBevis lagret i:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Merknad: {0} mottok ikke det ærlige shuffle-beviset for denne hånden. Bevis: {1}
game.popup_verificacion_host_sin_prueba=En eller flere deltakere ({0}) mottok ikke det ærlige shuffle-beviset for denne hånden.\n\nDe siste kjede-hashene samsvarer med alle deltakerne, så håndhandlingene er konsekvente. En korrekt vert sender alltid dette beviset, så et gjentatt eller peer-selektivt fravær kan indikere modifisert programvare eller en programvaredefekt.\n\nHånden ble avgjort, men å forlate spillet anbefales som en forholdsregel.\n\nBevis lagret i:\n{1}
