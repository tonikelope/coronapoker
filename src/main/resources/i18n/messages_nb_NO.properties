tooltip.cfg.ante=Legger til et tvungent bidrag til potten etter blinder. Modusen angir hvem som betaler og hvor mye.
tooltip.cfg.ante_mode=I tradisjonell modus betaler hver aktiv spiller 10 % av stor blind. I BBA, BA eller SBA betaler stor blind,-knappen eller liten blind én stor blind. Blinder blir lagt ut først.
tooltip.cfg.blind_cap=Stopper blinder øker ved den konfigurerte toppen.
tooltip.cfg.blinds_level=Starter blinder (liten/stor) for spillet.
tooltip.cfg.bot_balance=Når spillet avsluttes, deles botens kombinerte saldo likt mellom de menneskelige spillerne, så ekte penger avgjøres kun mellom mennesker.
tooltip.cfg.bot_rebuy=Global automatisk gjenkjøp-kontroll for hver bot. Hvis du slår den av, deaktiveres også gjenkjøp-innstillingene for egendefinerte roboter.
tooltip.cfg.bots=Angir vanskelighetsgraden til standardroboter. Tilpassede roboter holder vanskelighetsgraden konfigurert individuelt i Bot Manager.
tooltip.cfg.buyin_fixed=Alle starter med samme innkjøp. Når av, velger spillere innenfor det konfigurerte området.
tooltip.cfg.double_blinds=Går videre til neste blinder-nivå i strukturen etter et angitt antall hender eller minutter.
tooltip.cfg.hand_limit=Spillet avsluttes når denne håndtellingen er nådd.
tooltip.cfg.iwtsth=Lar deg be om å se en rivals hånd på showdown.
tooltip.cfg.rabbit=Avslører udelte felleskort etter hånden. Hver spillers første forespørsel er gratis. Den valgte modusen angir om senere forespørsler forblir gratis eller koster en liten eller stor blind.
tooltip.cfg.rebuy_limit=Maksimalt gjenkjøp per spiller.
tooltip.cfg.recover=Gjenopptar et spill som tidligere ble avbrutt.
tooltip.cfg.rit=Lar en stemme dele ut de gjenværende kortene to ganger når en All-in lukker spill.
tooltip.cfg.straddle=Spilleren etter stor blind kan legge ut to stor blind før de ser kortene sine og handle siste preflop.
tooltip.cfg.straddle_on_timeout=Legg ut straddle automatisk når forespørselen går ut. Dette påvirker bare spilleren din og er av som standard.
tooltip.cfg.structure=Blinder-nivå struktur for spillet.
tooltip.cfg.think_time=Sekunder tilgjengelig for å bestemme. Den automatiske handlingen kjører når tiden utløper.
tooltip.cfg.showdown_time=Sekunder forblir håndresultatet på skjermen før neste hånd deles ut.
tooltip.cfg.allow_hot_join=Lar nye spillere bli med som OPPVARMING og delta i neste hånd. Når det endres i løpet av et spill, påvirker det bare nye tilkoblingsforsøk.
tooltip.cfg.card_flip_duration=Angir hvor lang tid det tar for hvert kort å fullføre sin tur når det avsløres.
tooltip.cfg.card_flip_direction=Velger hvilken vei kortene vender når de blir avslørt. Mixed velger en retning for hver avsløring. Kort i samme gruppe vendes sammen på samme måte.
tooltip.cfg.reparto_velocidad=Angir hvor lang tid hvert kort tar å reise fra kortstokken til setet.
tooltip.cfg.community_deal_style=Velg om alle fem felleskort skal deles ut med forsiden ned i starten eller på deres egen gate. Lagrede endringer gjelder fra neste hånd.
tooltip.cfg.anim_calidad=Kvalitet beholder alle visuelle detaljer. Ytelse reduserer kostnadene for kortreiser og avslører på svakere datamaskiner.
tooltip.cfg.downgrade_velocidad=Angir hvor lang tid bordet tar å omorganisere setene når en spiller forlater.
tooltip.cfg.swap_velocidad=Angir hvor lang tid det tar å krysse kortene dine når de er sortert.
tooltip.cfg.swap_estilo=Arc hever det ene kortet over det andre. Horisontal krysser dem i samme høyde.
tooltip.cfg.resaltar_avatares=Hvis du hviler musen et øyeblikk på en spillers avatar, vises den forstørret over bordet, ved siden av navnet og stabelen, og den forsvinner når du flytter musen av den.
tooltip.cfg.resaltar_jugada_showdown=I løpet av showdown, fremhever du bare kortene som utgjør det, ved å holde musepekeren over en spillers håndnavn (vinner eller taper), og resten dimper.
tooltip.cfg.screenshot_fin_timba=Lagrer automatisk et skjermbilde av den siste skjermen når pengetelleren er ferdig (eller når du forlater den, hvis du drar tidligere).
tooltip.cfg.server_ip=Adresse (IP eller domene) der spillserveren lytter.
tooltip.cfg.server_port=TCP port fra 1 til 65535 som serveren lytter på.
tooltip.cfg.upnp=Ber ruteren om å videresende denne TCP-porten til verten til spilløkten stenger.
tooltip.cfg.preset=Laster en lagret innstillingsprofil.
tooltip.cfg.preset_save=Lagrer gjeldende innstillinger som en gjenbrukbar profil.
