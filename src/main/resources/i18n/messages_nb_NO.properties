zero_trust.suspicious_body=Klienten din avviste den unormale operasjonen, og spillet KAN fortsette. Vi antar god tro: dette kan være en programvarefeil (klient eller server) og ingen blir anklaget. Men siden en feil ikke kan fortelles bortsett fra tukling, ANBEFALES DET FOR DIN SIKKERHET STERKE Å FORLAE dette bordet ved å bruke 'Leave'-knappen (pengene dine vil IKKE bli behandlet i denne hånden).
