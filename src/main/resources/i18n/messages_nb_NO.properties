zero_trust.critical_alert_body=KARANTENESTAT AKTIVERT:\nDin klient VIL IKKE sende flere kryptografiske nøkler til serveren i denne økten.\nSpillet er matematisk frosset for å beskytte balansen din.\n\nMULIGE årsaker er:\n  - en FEIL i selve klientkoden,\n  - en BUG i serverkoden, eller\n  - en SERVER hvis kode kan ha blitt endret.\n\nKlienten kan ikke skille mellom dem og INGEN anklage er underforstått. For sikkerhets skyld, og i påvente av gjennomgang av grunnårsaken, ANBEFALES det at du forlater dette spillet ved å bruke 'Avslutt'-knappen (pengene dine vil IKKE bli behandlet i denne hånden).
