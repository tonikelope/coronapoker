tooltip.cfg.custom_bots=Aktiverer den tilpassede katalogen. Konfigurerte profiler legges til først, etterfulgt av standard bots.
tooltip.cfg.custom_bots.only=Forhindrer at standardroboter blir lagt til. Ingen flere roboter kan legges til etter at den tilpassede katalogen er oppbrukt.
tooltip.cfg.custom_bots.manage=Åpne administratoren for å opprette, redigere og bestille robotene dine. Du kan velge vanskelighetsgrad og stil.
tooltip.cfg.custom_bots.row=Velg denne boten for å redigere navnet, avataren, vanskelighetsgraden, stilen eller gjenkjøp.
tooltip.cfg.custom_bots.avatar=Velg et gyldig bilde eller behold den offisielle bot-avataren. CoronaPoker lagrer en sikker kopi slik at den ikke går tapt.
tooltip.cfg.custom_bots.name=Skriv inn det synlige navnet uten $. Den reserverte markøren legges til automatisk.
tooltip.cfg.custom_bots.difficulty=Setter utfordringen og taktikken boten bruker. Easy spiller rekreasjonsmessig, Normal bruker en mer disiplinert strategi og Hard bruker avansert taktikk.
tooltip.cfg.custom_bots.personality=Angir basisstilen. Tilfeldig velger den når boten er opprettet og beholder den for den aktive økten. Boten kan tilpasse sine beslutninger til situasjonen.
gdx.settings.option_help.bot_difficulty.easy=Spiller tilfeldig og gjør feil oftere.
gdx.settings.option_help.bot_difficulty.medium=Bruker en mer disiplinert strategi og justerer avgjørelser etter hvert som hånden utvikler seg.
gdx.settings.option_help.bot_difficulty.hard=Bruker mer avanserte taktikker, som å stjele blinder eller å legge press når en motstander ser sårbar ut.
gdx.settings.option_help.custom_bot_personality.random=Velger en stil når roboten er opprettet og beholder den for den aktive økten.
gdx.settings.option_help.custom_bot_personality.nit=Går inn noen få hender og venter vanligvis på sterke kort før du risikerer sjetonger.
gdx.settings.option_help.custom_bot_personality.station=Har en tendens til å syne veddemål og holde seg i hånden. Hever sjeldnere.
gdx.settings.option_help.custom_bot_personality.tag=Velger hender selektivt og har en tendens til å ta ledelsen med innsatser og høyninger.
gdx.settings.option_help.custom_bot_personality.lag=Spiller et bredere spekter av hender og legger press med hyppige innsatser og høyninger.
gdx.settings.option_help.ante_mode.traditional=Hver aktive spiller poster en tidel av stor blind, avrundet til nærmeste cent.
gdx.settings.option_help.ante_mode.big_blind=Spilleren i stor blind legger ut hele ante, lik en stor blind.
gdx.settings.option_help.ante_mode.button=Spilleren på knappen legger ut hele ante, lik en stor blind.
gdx.settings.option_help.ante_mode.small_blind=Spilleren i liten blind legger ut hele ante, lik en stor blind.
gdx.settings.option_help.blind_unit.minutes=Intervallet mellom blinder økninger måles i spilleminutter.
gdx.settings.option_help.blind_unit.hands=Blinder øke etter at det angitte antallet hender er ferdig.
gdx.settings.option_help.rebuy_cap.buy_in=Din maksimale stabel etter en gjenkjøp er basert på spillets innkjøp.
gdx.settings.option_help.rebuy_cap.highest_stack=Gjenkjøp opp til den største stabelen ved bordet. Hetten faller aldri under standarden innkjøp.
gdx.settings.option_help.rabbit.off=Uutdelte felleskort forblir skjult etter at hånden er ferdig.
gdx.settings.option_help.rabbit.free=Du kan be om å se uutdelte felleskort etter at hånden er ferdig uten å betale sjetonger.
gdx.settings.option_help.rabbit.free_small_blind=Din første forespørsel om spillet er gratis. Hver senere forespørsel koster én liten blind.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Din første forespørsel til spillet er gratis, den andre koster én liten blind, og senere forespørsler koster én stor blind.
gdx.settings.option_help.window_mode.exclusive=Bruker skjermens fullskjermmodus.
gdx.settings.option_help.window_mode.borderless=Fyller skjermen med et kantløst vindu og beholder skrivebordsvisningsmodus.
gdx.settings.option_help.window_mode.windowed=Åpner CoronaPoker i et vindu du kan flytte og endre størrelse på.
gdx.settings.option_help.fps_limit.fixed=Angir en fast maksimal bildefrekvens. En lavere hette kan redusere strømforbruket.
