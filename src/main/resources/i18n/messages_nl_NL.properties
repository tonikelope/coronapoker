game.popup_verificacion_divergente=Een of meer deelnemers meldden een andere cryptografische verificatie van de uiteindelijke handstatus.\n\nDit kan worden veroorzaakt door gewijzigde software of door een softwarefout. CoronaPoker kan niet automatisch de oorzaak vaststellen of wie de oorzaak is.\n\nCoronaPoker heeft de veilige handsluiting stopgezet en zal de tafel sluiten als een veiligheidsfout nadat deze waarschuwing is bevestigd.\n\nBewijs opgeslagen in:\n{0}
game.popup_verificacion_ausente=De laatste hand kon geen consensus bereiken omdat speler {0} geen afsluitende handtekening heeft verzonden.\n\nDit kan worden veroorzaakt door een netwerkstoring, een clientfout of gewijzigde software. CoronaPoker heeft de veilige sluiting van de handen gestopt en zal de tafel sluiten als een beveiligingsfout nadat deze waarschuwing is bevestigd.\n\nBewijs opgeslagen in:\n{1}
