tooltip.cfg.ante=Voegt een gedwongen bijdrage aan de pot toe na de blinds. De modus bepaalt wie betaalt en hoeveel.
tooltip.cfg.ante_mode=In de traditionele modus betaalt elke actieve speler 10% van de big blind. In BBA, BA of SBA betaalt de big blind, knop of small blind één big blind. Blinds worden als eerste geplaatst.
tooltip.cfg.blind_cap=Stops blinds nemen toe bij de geconfigureerde limiet.
tooltip.cfg.blinds_level=Beginnend met blinds (klein/groot) voor het spel.
tooltip.cfg.bot_balance=Wanneer het spel eindigt, wordt het gecombineerde saldo van de bots gelijkelijk verdeeld onder de menselijke spelers, zodat echt geld alleen tussen mensen wordt verrekend.
tooltip.cfg.bot_rebuy=Globale automatische herinkoop controle voor elke bot. Als u dit uitschakelt, worden ook de herinkoop-instellingen van aangepaste bots uitgeschakeld.
tooltip.cfg.bots=Stelt de moeilijkheidsgraad van standaardbots in. Aangepaste bots houden de moeilijkheidsgraad individueel geconfigureerd in Bot Manager.
tooltip.cfg.buyin_fixed=Iedereen begint met dezelfde inkoop. Wanneer uitgeschakeld, kiezen spelers binnen het geconfigureerde bereik.
tooltip.cfg.double_blinds=Gaat na een bepaald aantal handen of minuten door naar het volgende niveau blinds in de structuur.
tooltip.cfg.hand_limit=Het spel eindigt wanneer dit handaantal is bereikt.
tooltip.cfg.iwtsth=Hiermee kun je vragen om de hand van een rivaal te zien op showdown.
tooltip.cfg.rabbit=Onthult niet-uitgedeelde gemeenschappelijke kaarten na de hand. Het eerste verzoek van elke speler is gratis. De gekozen modus bepaalt of latere verzoeken gratis blijven of een kleine of big blind kosten.
tooltip.cfg.rebuy_limit=Maximale rebuys per speler.
tooltip.cfg.recover=Hervat een spel dat eerder werd onderbroken.
tooltip.cfg.rit=Maakt het mogelijk dat bij een stemming de resterende kaarten twee keer worden gedeeld wanneer een All-in de weddenschap sluit.
tooltip.cfg.straddle=De speler na de big blind mag twee big blind plaatsen voordat hij zijn kaarten ziet en als laatste preflop handelt.
tooltip.cfg.straddle_on_timeout=Plaats de straddle automatisch wanneer de prompt verdwijnt. Dit heeft alleen invloed op uw speler en is standaard uitgeschakeld.
