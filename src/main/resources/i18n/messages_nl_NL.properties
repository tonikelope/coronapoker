game.showdown_forfeit_msg=LET OP: showdown verificatie mislukt voor de volgende speler(s) en hun kaarten worden NIET onthuld:\n\n%nicks%\n\nDeze spelers zijn uitgesloten van showdown weerstand (auto-fold) en KUNNEN deze pot NIET winnen. Het spel gaat normaal verder.
zero_trust.peer_sra_corrupt=De handtekening showdown is echt, maar de SRA-sleutel van de peer wordt niet omgezet in geldige kaarten. Dit gebeurt alleen als de peer opzettelijk een corrupte sleutel heeft ondertekend of als de client fouten bevat. We kunnen niet zeggen welke, en voor de veiligheid beëindigen we het spel.
zero_trust.straddle_recover_mismatch=Terwijl hij de hand herstelde, kondigde de gastheer een straddle aan die afwijkt van de hand die uw eigen lokale kopie had opgenomen. Dit gebeurt alleen als de host met de herstelde straddle knoeit of als de client fouten bevat. De hand is nog steeds gereconstrueerd op basis van uw vertrouwde exemplaar, maar we waarschuwen u uit voorzorg.
zero_trust.rit_recover_mismatch=Terwijl hij de hand herstelde, kondigde de gastheer een run-it-twice-resultaat aan dat anders was dan het resultaat dat uw eigen lokale kopie had geregistreerd. Dit gebeurt alleen als de host met het herstelde resultaat knoeit of als de client fouten bevat. De hand is nog steeds gereconstrueerd op basis van uw vertrouwde exemplaar, maar we waarschuwen u uit voorzorg.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown sleutel ondertekend, maar lost niet op naar kaarten. Mogelijke cheat of clientbug.
