game.popup_verificacion_firma_invalida=Tijdens deze hand hebben een of meer deelnemers ({0}) een ongeldige cryptografische handtekening op een actie gedetecteerd.\n\nDe door alle deelnemers ontvangen gegevens waren consistent (de laatste keten-hash kwam overeen), maar ten minste één actie was niet correct ondertekend door de verwachte auteur.\n\nCoronaPoker stopte met het veilig sluiten van handen en zal de tafel sluiten als veiligheidsfout nadat deze waarschuwing is ontvangen. erkend.\n\nBewijs opgeslagen in:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Let op: {0} heeft voor deze hand geen eerlijk shuffle-bewijs ontvangen. Bewijs: {1}
game.popup_verificacion_host_sin_prueba=Een of meer deelnemers ({0}) hebben geen eerlijk shuffle-bewijs voor deze hand ontvangen.\n\nDe laatste keten-hashes komen voor alle deelnemers overeen, dus de handacties zijn consistent. Een correcte host stuurt dit bewijs altijd, dus een herhaalde of peer-selectieve afwezigheid kan wijzen op gewijzigde software of een softwarefout.\n\nDe hand is afgehandeld, maar het wordt aanbevolen om uit voorzorg het spel te verlaten.\n\nBewijs opgeslagen in:\n{1}
