tooltip.cfg.custom_bots.row=Selecteer deze bot om de naam, avatar, moeilijkheidsgraad, stijl of herinkoop te bewerken.
tooltip.cfg.custom_bots.avatar=Kies een geldige afbeelding of behoud de officiële botavatar. CoronaPoker slaat een veilige kopie op, zodat deze niet verloren gaat.
tooltip.cfg.custom_bots.name=Voer de zichtbare naam in zonder $. De gereserveerde markering wordt automatisch toegevoegd.
tooltip.cfg.custom_bots.difficulty=Stelt de uitdaging in en de tactieken die de bot gebruikt. Gemakkelijk speelt recreatief, Normaal gebruikt een meer gedisciplineerde strategie en Hard gebruikt geavanceerde tactieken.
tooltip.cfg.custom_bots.personality=Stelt de basisstijl in. Willekeurig kiest het wanneer de bot wordt gemaakt en bewaart het voor de actieve sessie. De bot kan zijn beslissingen aanpassen aan de situatie.
gdx.settings.option_help.bot_difficulty.easy=Speelt nonchalant en maakt vaker fouten.
gdx.settings.option_help.bot_difficulty.medium=Gebruikt een meer gedisciplineerde strategie en past beslissingen aan naarmate de hand zich ontwikkelt.
gdx.settings.option_help.bot_difficulty.hard=Gebruikt geavanceerdere tactieken, zoals het stelen van blinds of het uitoefenen van druk wanneer een tegenstander er kwetsbaar uitziet.
gdx.settings.option_help.custom_bot_personality.random=Kiest een stijl wanneer de bot wordt gemaakt en bewaart deze voor de actieve sessie.
gdx.settings.option_help.custom_bot_personality.nit=Komt weinig handen binnen en wacht meestal op sterke kaarten voordat hij chips riskeert.
gdx.settings.option_help.custom_bot_personality.station=Heeft de neiging om weddenschappen te callen en in de hand te blijven. Verhoogt minder vaak.
gdx.settings.option_help.custom_bot_personality.tag=Kiest selectief handen en heeft de neiging de leiding te nemen met inzetten en verhogingen.
gdx.settings.option_help.custom_bot_personality.lag=Speelt een breder scala aan handen en oefent druk uit met frequente inzetten en verhogingen.
gdx.settings.option_help.ante_mode.traditional=Elke actieve speler plaatst een tiende van de big blind, afgerond op de dichtstbijzijnde cent.
gdx.settings.option_help.ante_mode.big_blind=De speler in de big blind plaatst de volledige ante, gelijk aan één big blind.
gdx.settings.option_help.ante_mode.button=De speler op de knop plaatst de volledige ante, gelijk aan één big blind.
gdx.settings.option_help.ante_mode.small_blind=De speler in de small blind plaatst de volledige ante, gelijk aan één big blind.
gdx.settings.option_help.rebuy_cap.buy_in=Je maximale stapel na een herinkoop is gebaseerd op de inkoop van het spel.
gdx.settings.option_help.rebuy_cap.highest_stack=Herinkoop tot de grootste stapel aan tafel. De dop valt nooit onder de standaard inkoop.
gdx.settings.option_help.rabbit.off=Niet-uitgedeelde gemeenschappelijke kaarten blijven verborgen nadat de hand is afgelopen.
gdx.settings.option_help.rabbit.free=Je kunt vragen om de niet-uitgedeelde gemeenschappelijke kaarten te zien nadat de hand is afgelopen, zonder fiches te betalen.
gdx.settings.option_help.rabbit.free_small_blind=Je eerste aanvraag van het spel is gratis. Elk later verzoek kost één small blind.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Je eerste aanvraag voor het spel is gratis, de tweede kost één small blind en latere aanvragen kosten één big blind.
gdx.settings.option_help.window_mode.exclusive=Gebruikt de volledig schermmodus van de monitor.
gdx.settings.option_help.window_mode.borderless=Vult het scherm met een randloos venster en behoudt de bureaubladweergavemodus.
tooltip.cfg.custom_bots.automatic_rebuy=Laat deze aangepaste bot herinkoop staan ​​nadat de chips op zijn. De globale automatische herinkoop-besturing moet zijn ingeschakeld.
tooltip.cfg.custom_bots.order_up=Verplaatst het geselecteerde profiel één positie naar boven. De lijst volgt deze wanneer scrollen nodig is.
tooltip.cfg.custom_bots.order_down=Verplaatst het geselecteerde profiel één positie naar beneden. De lijst volgt deze wanneer scrollen nodig is.
tooltip.cfg.custom_bots.random_selection=Schudt de catalogus één keer wanneer er een lobby wordt gemaakt. Elke aangepaste bot kan slechts één keer meedoen en de selectie blijft stabiel voor die lobby.
tooltip.cfg.custom_bots.new=Bereidt een nieuw profiel voor zonder de reeds opgeslagen bots te wijzigen.
tooltip.cfg.custom_bots.save=Voegt het nieuwe profiel toe of slaat de wijzigingen op die aan de geselecteerde bot zijn aangebracht.
tooltip.cfg.custom_bots.delete=Verwijdert het geselecteerde profiel nadat om bevestiging is gevraagd.
tooltip.cfg.custom_bots.close=Sluit de beheerder. Opgeslagen profielen en hun volgorde worden automatisch bewaard.
