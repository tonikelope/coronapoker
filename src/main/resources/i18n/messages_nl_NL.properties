zero_trust.cascade_refused=Een aangesloten speler weigerde deel te nemen aan de deck shuffle-cascade. Het spel wordt stopgezet. Zij zullen hun weigering om opnieuw te worden toegelaten moeten rechtvaardigen.
zero_trust.pocket_unlock_refused=Een verbonden speler weigerde zijn sleutel af te geven om zijn pocketkaarten te decoderen. Het spel wordt stopgezet. Zij zullen hun weigering om opnieuw te worden toegelaten moeten rechtvaardigen.
zero_trust.community_unlock_refused=Een verbonden speler weigerde zijn sleutel af te leveren om gemeenschappelijke kaarten te onthullen. Het spel wordt stopgezet. Zij zullen hun weigering om opnieuw te worden toegelaten moeten rechtvaardigen.
zero_trust.host_showdown_sig_missing=Er is een sleutel showdown ontvangen van de server ZONDER de cryptografische handtekening van de auteur, of met een verkeerd opgemaakte handtekening. Het kan zijn dat de server de sleutel op de draad vervangt.
zero_trust.host_showdown_sig_invalid=Er is een sleutel showdown ontvangen van de server met een ONGELDIGE cryptografische handtekening. Het kan zijn dat de server de sleutel op de draad vervangt.
zero_trust.host_potcards_mismatch=De showdown platte tekst die door de server wordt verzonden, KOMT NIET OVEREEN met het resultaat van het decoderen van uw lokale stuk met de ondertekende sleutel. De server verzendt mogelijk valse kaarten op showdown.
zero_trust.host_community_garbage=De cryptografische gemeenschappelijke kaartgegevens die van de server worden ontvangen, zijn inconsistent (het stuk wordt niet gedecodeerd naar een geldige kaartstapel of komt niet overeen met de ondertekende aankondiging van de server). Mogelijke oorzaken: een BUG in een bepaalde versie van de software, een serverversie waarvan de code mogelijk is gewijzigd, of corruptie van de lokale identiteitssleutel. De cliënt kan het verschil niet zien en beschuldigt niemand.
zero_trust.host_unlock_out_of_order=Er is een decryptieverzoek ontvangen van de server in de verkeerde volgorde (verkeerde straat, herhaald slot, uitfasering of verzoek uitgegeven voordat de vorige straat werd gesloten).
zero_trust.host_cascade_mid_hand=Er is een verzoek voor een willekeurige herstart ontvangen van de server, midden in een lopende hand (zou mijn decoderingssleutel overschrijven).
zero_trust.host_pocket_extraction=Er is een decoderingsverzoek ontvangen van de server dat invloed heeft op UW EIGEN privékaarten.
zero_trust.host_community_extraction=Er is een decoderingsverzoek ontvangen van de server waardoor van tevoren een gemeenschappelijke kaart zou worden vrijgegeven.
zero_trust.host_rotation_replay=De serveerder vroeg om een ​​tweede kaartrotatie in dezelfde hand. De legitieme rotatie is uniek per hand. Een herhaling duidt op een poging om uw client te gebruiken om de kaarten van andere spelers te decoderen.
zero_trust.host_shuffle_proof_failed=De dealverificatie mislukte: het kaartspel dat de server uitdeelde, kon niet worden bewezen als een eerlijke schudding van het Genesis-kaartspel. Community-ontgrendelingen zijn geweigerd en deze sessie wordt beëindigd om privékaarten te beschermen.
zero_trust.host_shuffle_proof_missing=De deal kwam tot stand zonder een verifieerbaar, eerlijk schudbewijs voor het kaartspel van deze hand, en gemeenschappelijke kaarten worden nu onthuld. Het kan een bug zijn, een netwerkvertraging, of een host die de deal probeert te manipuleren. Je kunt blijven spelen, maar het wordt sterk aanbevolen om deze tafel te verlaten.
zero_trust.deck_unverified=Het kaartspel van deze hand kan NIET worden geverifieerd als een eerlijke shuffle. VERDACHT: gastheer "{0}", die het shuffle-bewijs uitdeelt en uitzendt. Het kan de gastheer zijn die de deal manipuleert, of een speler die zijn bewijs heeft achtergehouden. De hand wordt uitgespeeld omdat de kaarten al zijn uitgedeeld.
zero_trust.deck_unverified_body=Er is ondertekend bewijs van deze anomalie vastgelegd (in het spellogboek, in rood en in de tabel met betwiste handen). Je kunt blijven spelen, maar als je de gastheer niet vertrouwt, verlaat dan de tafel.
zero_trust.seat_redraw=De gastheer "{0}" dwong een NIEUWE stoeltrekking af. Dit is ONGEBRUIKELIJK: de trekking is collectief en verifieerbaar, dus de gastheer kan de stoelen niet kiezen, maar kan wel opnieuw rollen totdat hij een arrangement krijgt dat hij leuk vindt. Als het zich herhaalt, kan het zijn dat de gastheer probeert uw stoel te manipuleren.
zero_trust.seat_redraw_body=De nieuwe trekking verliep op dezelfde manier en is nog steeds verifieerbaar: niemand, inclusief de gastheer, kan de uitkomst kiezen. Het kan gebeuren dat een speler direct bij de start is gevallen, maar als je verschillende nieuwe pogingen ziet en je de gastheer niet vertrouwt, verlaat dan de tafel. Het is geregistreerd.
zero_trust.seat_recover_mismatch=Bij het herstellen van het spel komt de door host "{0}" verzonden zitvolgorde NIET overeen met de volgorde die uw klant had opgeslagen: iemand die u al kende, is van plaats aan de tafel veranderd. Het kan een gastheer zijn die probeert de stoelen opnieuw te ordenen onder dekking van het herstel.
zero_trust.seat_recover_mismatch_body=Uw klant bewaarde de zitreferentie die hij bij aanvang zelf had geverifieerd. Het is normaal dat spelers tussendoor toetreden of vertrekken. Iemand opnieuw ordenen die er al was, kan niet. Als u de gastheer niet vertrouwt, verlaat dan de tafel. Het is geregistreerd.
zero_trust.host_recover_action_forged=De host heeft geprobeerd een VERGIST-actie (ongeldige handtekening) in te voeren tijdens het herstel van de game. Uw cliënt heeft dit geweigerd.
zero_trust.host_recover_action_omitted=Tijdens het herstel heeft de host een actie weggelaten die JIJ hebt gespeeld en die in je lokale database was opgenomen. Uw cliënt heeft het in zijn eigen kopie gedetecteerd en heeft uw actie NIET stilzwijgend stopgezet.
zero_trust.host_recover_balance_mismatch=De host heeft geprobeerd uw saldo (fiches/inkoop) te wijzigen tijdens het herstel van het spel: dit komt niet overeen met uw lokale record. Uw klant heeft UW echte evenwicht bewaard.
zero_trust.host_board_peek=De gastheer heeft verzocht om een ​​gemeenschapskaart van een TOEKOMSTIGE straat te ontsleutelen (een poging om het bord vroegtijdig te lezen). Uw cliënt weigerde.
zero_trust.suspect_host_prefix=VERDACHT: host "{0}".
zero_trust.suspect_peer_prefix=VERDACHT: speler "{0}".
zero_trust.peer_alert=⚠️ [ANOMAAL SPELERSGEDRAG]
zero_trust.peer_suspicious_header=Er is afwijkend of beledigend gedrag van een speler aan uw tafel gedetecteerd:\n
zero_trust.peer_suspicious_body=De tafel heeft de passende veiligheidsmaatregel toegepast en het spel gaat verder voor de andere spelers. Er wordt uitgegaan van goede trouw. Het zou een softwarefout kunnen zijn en niemand wordt beschuldigd. Het bewijsmateriaal wordt geregistreerd.
zero_trust.peer_inbound_flood=Aanhoudend geverifieerd verkeer boven de anti-DoS-drempel.
zero_trust.peer_binary_flood=Spraakberichtbewerkingen worden met een ongewoon hoge snelheid verzonden.
zero_trust.host_binary_flood=De host verzendt spraakberichten met een ongebruikelijk hoge snelheid.
zero_trust.peer_flood_log=Anti-DoS-incident in afwachting van een beslissing: speler {0}, IP {1}. Reden: {2}
zero_trust.peer_flood_confirm=Gebruiker {0} verzendt een buitensporige hoeveelheid verkeer. Dit kan een DoS-aanval of een bug zijn. Ze uit het spel verwijderen?\n\nIP: {1}\nGedetecteerde reden: {2}
zero_trust.peer_flood_suppress=Laat deze waarschuwingen niet zien
zero_trust.peer_hand_ready_withheld=Een speler antwoordt op PING, maar bevestigt niet dat hij klaar is voor de volgende hand terwijl het spel loopt. Het bevroor de handstart en is VERWIJDERD. Het spel gaat verder zonder hen.
zero_trust.peer_action_withheld=Een speler antwoordt PING maar verzendt zijn inzetactie niet terwijl het spel loopt, voorbij de bedenktijd. Het vroor de hele ronde en is VERWIJDERD. Het spel gaat verder zonder hen.
zero_trust.peer_conf_withheld=Een speler beantwoordt PING maar bevestigt de ontvangst van een deelbericht niet terwijl het spel loopt. Het blokkeerde de voortgang van de tafel en is VERWIJDERD. Het spel gaat verder zonder hen.
zero_trust.peer_deal_refusal_expelled=Een speler dwong verschillende handannuleringen op rij af door het schudden of roteren van het kaartspel te weigeren. Het is VERWIJDERD zodat het spel verder kan gaan.
zero_trust.suspicious_alert=⚠️ [AFZONDERLIJK SERVERGEDRAG]
zero_trust.suspicious_header=Je client heeft afwijkend servergedrag gedetecteerd (geen kritiek incident waardoor het spel vastloopt):\n
zero_trust.suspicious_body=Je cliënt heeft de afwijkende handeling afgewezen en het spel KAN doorgaan. We gaan uit van goede trouw: dit kan een softwarefout zijn (client of server) en niemand wordt beschuldigd. Maar aangezien een bug niet los kan worden gezien van geknoei, WORDT HET VOOR UW VEILIGHEID STERK AANBEVOLEN om deze tafel te VERLATEN met de knop 'Verlaten' (uw geld wordt NIET verwerkt in deze hand).
zero_trust.host_bad_wire=Er is een decoderingsverzoek ontvangen van de server met een ongeldig formaat of punten die niet tot de cryptografische curve behoren.
zero_trust.host_critical_command_invalid=Het kritieke {0}-commando verzonden door de server kon niet worden gevalideerd. Dit kan een incompatibiliteit, een bug of een gewijzigde server zijn. De sessie wordt gestopt om de integriteit ervan te beschermen.
zero_trust.cheater_detected=[ZERO-TRUST] Er is een speler met een aangepaste CoronaPoker-versie gedetecteerd, wat erop wijst dat hij of zij misschien probeert vals te spelen. Wil je doorgaan?
zero_trust.corrupted_mac_action=De server heeft geprobeerd een actie met een ongeldige cryptografische handtekening (beschadigde MAC) te verwerken namens:
zero_trust.critical=\u274c [ZERO-TRUST] KRITISCHE WAARSCHUWING: ONGELDIGE HANDTEKENING OF GEBROKEN CONSENSUS.
zero_trust.critical_alert_body=QUARANTAINESTAAT GEACTIVEERD:\nJe client ZAL GEEN cryptografische sleutels meer naar de server sturen tijdens deze sessie.\nHet spel is wiskundig bevroren om je saldo te beschermen.\n\nDe MOGELIJKE oorzaken zijn:\n - een BUG in de clientcode zelf,\n - een BUG in de servercode, of\n - een SERVER waarvan de code mogelijk is gewijzigd.\n\nDe klant kan er geen onderscheid tussen maken en er wordt GEEN beschuldiging geïmpliceerd. Voor de veiligheid, en in afwachting van onderzoek naar de hoofdoorzaak, wordt het AANBEVOLEN dat u dit spel VERLAAT met de knop 'Afsluiten' (uw geld wordt NIET verwerkt in deze hand).
zero_trust.critical_alert_header=ZERO-TRUST INCIDENT!\n\nUw cliënt heeft een anomalie gedetecteerd in het cryptografische protocol:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRITIEKE SESSIEFOUT
zero_trust.decrypting_street=[ZERO-TRUST] STRAAT DECRYPTEN...
zero_trust.wait_deal=We wachten op de bijdragen van de spelers om de kaarten te schudden en te delen.
zero_trust.wait_shuffle_proof=We wachten op het cryptografische bewijs van het schudden.
zero_trust.wait_sra_unlock=We wachten op de SRA-sleutels om {0} open te leggen.
game.settlement_verification_wait=We wachten op de bevestigingen om de hand en de saldi te verifiëren.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Snelle consensustime-out. Vooruitgang afdwingen.
zero_trust.forged_identity_action=De server heeft geprobeerd een actie met een vervalste identiteitshandtekening te verwerken namens:
zero_trust.game_aborted=[ZERO-TRUST] Spel afgebroken. Schop de valsspelers.
zero_trust.generating_kem=[ZERO-TRUST] KEM GENEREREN (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ZERO-TRUST ALERT] Ongeldige MAC op gemeenschappelijke kaarten. Mogelijke manipulatie.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] CONSENSUS CRYPTOGRAFISCHE VERIFICATIE: ALLE SPELERS HEBBEN GECERTIFICEERD DAT HUN LOKALE HAND CRYPTOGRAFISCHE VERIFICATIE IS GESLAAGD.
zero_trust.legit2_error=\u274c [ZERO-TRUST] CONSENSUS CRYPTOGRAFISCHE VERIFICATIE: TEN MINSTE ÉÉN SPELER HEEFT NIET GECERTIFICEERD DAT HUN LOKALE HAND CRYPTOGRAFISCHE VERIFICATIE DOORGAAT.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] LOKALE HAND CRYPTOGRAFISCHE VERIFICATIE: MIJN KAARTEN, GEMEENSCHAPSKAARTEN EN ALLE OPGENOMEN ACTIES ZIJN LEGITIEM.
zero_trust.legit_error=\u274c [ZERO-TRUST] LOKALE HANDCRYPTOGRAFISCHE VERIFICATIE: KAN NIET GARANDEREN DAT MIJN KAARTEN, GEMEENSCHAPSKAARTEN EN ALLE OPGENOMEN ACTIES LEGITIEM ZIJN.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Quarantaine geactiveerd. Blokkeren van de overdracht van cryptografische sleutels.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Geen eerder binair log voor deze hand.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: GEHEUGEN CONTROLEREN...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] Er is een speler met een aangepaste CoronaPoker-versie gedetecteerd, wat erop wijst dat hij of zij misschien probeert vals te spelen.
zero_trust.p2p_finished_resuming=P2P KEM-verificatie voltooid. Hand hervatten...
zero_trust.p2p_generating_challenges=[ZERO-TRUST] P2P: UITDAGINGEN GENEREREN...
zero_trust.p2p_timeout=P2P-zwermtime-out! Sommige spelers werden als onbetrouwbaar aangemerkt.
zero_trust.p2p_verifying_signatures=[ZERO-TRUST] P2P: HANDTEKENINGEN VERIFICEREN...
zero_trust.read_binary_log_failure=[ZERO-TRUST] Kan het binaire logboek niet lezen.
zero_trust.rejecting_master_key=\ud83d\udd12 [LOCKDOWN] Weigeren van Master Key Share-verzending naar de server.
zero_trust.rejecting_street_token=\ud83d\udd12 [LOCKDOWN] Straattokenverzoek van de server weigeren.
zero_trust.replay_queue_synced=\u2714\ufe0f [ZERO-TRUST] Herhaalwachtrij gesynchroniseerd ({0} handtekeningen).
zero_trust.security_alert=\u26a0\ufe0f [BEVEILIGINGSALARM]
zero_trust.evidence_location=Zero Trust-bewijs: {0}
zero_trust.fatal_incident_title=NUL VERTROUWEN INCIDENT
zero_trust.fatal_incident_body=CoronaPoker heeft een geverifieerde kritieke status afgewezen en de tabel gestopt voordat hij doorging. Bevestig deze waarschuwing om de betrokken tabel te sluiten.\n\nZero Trust-bewijs: {0}
zero_trust.qa_pre_settlement_fault=De cryptografische deal werd vóór de schikking afgewezen.
zero_trust.qa_lockdown_fault=De geverifieerde hoststatus heeft de cryptografische validatie niet doorstaan.
zero_trust.session_generated=\u2714\ufe0f [ZERO-TRUST] Nieuwe sessie gegenereerd en op schijf opgeslagen.
zero_trust.session_restored=\u2714\ufe0f [ZERO-TRUST] Sessiesleutel succesvol hersteld.
zero_trust.timeout=\u274c [ZERO-TRUST] TIME-OUT (OVERSLAG HANDVALIDATIE)
zero_trust.timeout_community_cards=\u274c [ZERO-TRUST] Time-out bij wachten op gemeenschappelijke kaarten.
zero_trust.verifying_integrity=[ZERO-TRUST] Game-integriteit verifiëren...
zero_trust.verifying_integrity_error=[ZERO-TRUST] VERIFICATIE VAN SPELINTEGRITEIT MISLUKT
zero_trust.verifying_swarm=[ZERO-TRUST] ZWARM VERIFICEREN...
zero_trust.write_binary_log_failure=[ZERO-TRUST] Kan binair logbestand niet schrijven.
