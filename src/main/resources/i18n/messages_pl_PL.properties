tooltip.cfg.custom_bots=Włącza katalog niestandardowy. Najpierw dodawane są skonfigurowane profile, a następnie standardowe boty.
tooltip.cfg.custom_bots.only=Uniemożliwia dodawanie standardowych botów. Po wyczerpaniu się katalogu niestandardowego nie można dodać więcej botów.
tooltip.cfg.custom_bots.manage=Otwórz menedżera, aby tworzyć, edytować i zamawiać boty. Możesz wybrać ich poziom trudności i styl.
tooltip.cfg.custom_bots.row=Wybierz tego bota, aby edytować jego nazwę, awatar, poziom trudności, styl lub dokupienie.
tooltip.cfg.custom_bots.avatar=Wybierz prawidłowy obraz lub zachowaj oficjalny awatar bota. CoronaPoker przechowuje bezpieczną kopię, aby nie została utracona.
tooltip.cfg.custom_bots.name=Wprowadź widoczną nazwę bez $. Zarezerwowany znacznik jest dodawany automatycznie.
tooltip.cfg.custom_bots.difficulty=Ustawia wyzwanie i taktykę używaną przez bota. Easy gra rekreacyjnie, Normal używa bardziej zdyscyplinowanej strategii, a Hard używa zaawansowanej taktyki.
tooltip.cfg.custom_bots.personality=Ustawia styl podstawowy. Losowo wybiera go podczas tworzenia bota i przechowuje go do aktywnej sesji. Bot potrafi dostosować swoje decyzje do sytuacji.
gdx.settings.option_help.bot_difficulty.easy=Gra swobodnie i częściej popełnia błędy.
gdx.settings.option_help.bot_difficulty.medium=Stosuje bardziej zdyscyplinowaną strategię i dostosowuje decyzje w miarę rozwoju ręki.
gdx.settings.option_help.bot_difficulty.hard=Stosuje bardziej zaawansowane taktyki, takie jak kradzież ciemne lub wywieranie presji, gdy przeciwnik wygląda na bezbronnego.
gdx.settings.option_help.custom_bot_personality.random=Wybiera styl podczas tworzenia bota i zatrzymuje go do aktywnej sesji.
gdx.settings.option_help.custom_bot_personality.nit=Rozgrywa kilka rozdań i zazwyczaj czeka na mocne karty, zanim zaryzykuje żetony.
gdx.settings.option_help.custom_bot_personality.station=Ma tendencję do sprawdzania zakładów i pozostawania w rozdaniu. Podnosi rzadziej.
gdx.settings.option_help.custom_bot_personality.tag=Wybiera ręce selektywnie i ma tendencję do przejmowania prowadzenia w przypadku zakładów i podbić.
gdx.settings.option_help.custom_bot_personality.lag=Rozgrywa szerszy zakres rąk i wywiera presję poprzez częste zakłady i podbicia.
gdx.settings.option_help.ante_mode.traditional=Każdy aktywny gracz wpłaca jedną dziesiątą duża ciemna, zaokrągloną do najbliższego centa.
gdx.settings.option_help.ante_mode.big_blind=Gracz w duża ciemna wrzuca całe ante, równe jeden duża ciemna.
gdx.settings.option_help.ante_mode.button=Gracz na przycisku wpłaca całe ante, równe jeden duża ciemna.
gdx.settings.option_help.ante_mode.small_blind=Gracz w mała ciemna wrzuca całe ante, równe jeden duża ciemna.
gdx.settings.option_help.blind_unit.minutes=Odstęp pomiędzy ciemne wzrostami mierzony jest w minutach gry.
gdx.settings.option_help.blind_unit.hands=Ciemne wzrost po zakończeniu określonej liczby rozdań.
gdx.settings.option_help.rebuy_cap.buy_in=Twój maksymalny stack po dokupienie opiera się na wpisowe w grze.
gdx.settings.option_help.rebuy_cap.highest_stack=Dokupienie aż do największego stosu na stole. Limit nigdy nie spada poniżej standardu wpisowe.
gdx.settings.option_help.rabbit.off=Nierozdane karty wspólne pozostają ukryte po zakończeniu rozdania.
gdx.settings.option_help.rabbit.free=Możesz poprosić o wyświetlenie nierozdanych kart wspólnych po zakończeniu rozdania bez płacenia żetonów.
gdx.settings.option_help.rabbit.free_small_blind=Twoje pierwsze żądanie gry jest bezpłatne. Każde późniejsze żądanie kosztuje jednego mała ciemna.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Twoje pierwsze żądanie gry jest bezpłatne, drugie kosztuje 1 mała ciemna, a późniejsze prośby kosztują 1 duża ciemna.
gdx.settings.option_help.window_mode.exclusive=Używa trybu pełnoekranowego monitora.
gdx.settings.option_help.window_mode.borderless=Wypełnia ekran oknem bez obramowania i utrzymuje tryb wyświetlania pulpitu.
gdx.settings.option_help.window_mode.windowed=Otwiera CoronaPoker w oknie, które możesz przesuwać i zmieniać rozmiar.
gdx.settings.option_help.fps_limit.fixed=Ustawia stałą maksymalną liczbę klatek na sekundę. Niższa nasadka może zmniejszyć zużycie energii.
gdx.settings.option_help.fps_limit.monitor=Dopasowuje ograniczenie liczby klatek na sekundę do częstotliwości odświeżania monitora wyświetlającego grę.
gdx.settings.option_help.msaa.0=Wyłącza antyaliasing wielopróbkowy dla tabeli i interfejsu. Wymaga ponownego uruchomienia.
gdx.settings.option_help.msaa.2=Wykorzystuje 2 próbki na piksel, aby wygładzić krawędzie przy niskim koszcie grafiki. Wymaga ponownego uruchomienia.
gdx.settings.option_help.msaa.4=Wykorzystuje 4 próbki na piksel, aby zrównoważyć wygładzanie krawędzi i koszty grafiki. Wymaga ponownego uruchomienia.
gdx.settings.option_help.msaa.8=Wykorzystuje 8 próbek na piksel, aby uzyskać najsilniejsze wygładzenie, jakie zapewnia to ustawienie. Wymaga ponownego uruchomienia.
gdx.settings.option_help.card_rendering.native=Bezpośrednio dobiera karty, aby zmniejszyć koszt renderowania.
gdx.settings.option_help.card_rendering.smooth=Wykorzystuje dodatkowy filtr do wygładzania krawędzi kart przy wyższych kosztach grafiki.
tooltip.cfg.custom_bots.automatic_rebuy=Pozwala temu niestandardowemu botowi dokupienie po wyczerpaniu się żetonów. Musi być włączone globalne automatyczne sterowanie dokupienie.
