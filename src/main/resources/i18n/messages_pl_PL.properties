tooltip.cfg.ante=Dodaje wymuszony wkład do puli po ciemne. Tryb określa, kto i ile płaci.
tooltip.cfg.ante_mode=W trybie tradycyjnym każdy aktywny gracz płaci 10% duża ciemna. W BBA, BA lub SBA przycisk duża ciemna, lub mała ciemna płaci jeden duża ciemna. Ciemne są publikowane jako pierwsze.
tooltip.cfg.blind_cap=Zatrzymuje wzrosty ciemne w skonfigurowanym limicie.
tooltip.cfg.blinds_level=Począwszy od ciemne (mały/duży) gry.
tooltip.cfg.bot_balance=Kiedy gra się kończy, łączne saldo botów zostaje równo podzielone pomiędzy graczy-ludzi, więc prawdziwe pieniądze są rozliczane tylko pomiędzy ludźmi.
tooltip.cfg.bot_rebuy=Globalna automatyczna kontrola dokupienie dla każdego bota. Wyłączenie tej opcji powoduje również wyłączenie ustawień dokupienie niestandardowych botów.
tooltip.cfg.bots=Ustawia trudność standardowych botów. Niestandardowe boty pozwalają na indywidualną konfigurację poziomu trudności w Menedżerze botów.
tooltip.cfg.buyin_fixed=Każdy zaczyna od tego samego wpisowe. Gdy opcja jest wyłączona, gracze wybierają w skonfigurowanym zakresie.
tooltip.cfg.double_blinds=Awans na kolejny poziom ciemne w strukturze po określonej liczbie rozdań lub minut.
tooltip.cfg.hand_limit=Gra kończy się po osiągnięciu tej liczby rąk.
tooltip.cfg.iwtsth=Pozwala poprosić o wyświetlenie ręki rywala na wyłożenie kart.
tooltip.cfg.rabbit=Po rozdaniu odkrywa nierozdane karty wspólne. Pierwsza prośba każdego gracza jest bezpłatna. Wybrany tryb określa, czy późniejsze żądania pozostaną bezpłatne, czy będą kosztować niewielką kwotę lub duża ciemna.
tooltip.cfg.rebuy_limit=Maksymalne wykupy na gracza.
tooltip.cfg.recover=Wznawia grę, która została wcześniej przerwana.
tooltip.cfg.rit=Umożliwia dwukrotne rozdanie pozostałych kart, gdy All-in kończy zakład.
tooltip.cfg.straddle=Gracz po duża ciemna może wrzucić dwa duża ciemna przed obejrzeniem swoich kart i zagrać jako ostatni przed flopem.
tooltip.cfg.straddle_on_timeout=Opublikuj straddle automatycznie po upływie limitu czasu monitu. Dotyczy to tylko odtwarzacza i jest domyślnie wyłączone.
tooltip.cfg.structure=Struktura gry na poziomie Ciemne.
tooltip.cfg.think_time=Dostępne sekundy na podjęcie decyzji. Akcja automatyczna uruchamia się po upływie czasu.
tooltip.cfg.showdown_time=Wynik rozdania pozostaje na ekranie przez kilka sekund, zanim zostanie rozdane następne rozdanie.
tooltip.cfg.allow_hot_join=Umożliwia nowym graczom dołączenie w ramach ROZGRZEWKI i wejście do następnego rozdania. Zmiana w trakcie gry ma wpływ tylko na nowe próby połączenia.
tooltip.cfg.card_flip_duration=Określa, ile czasu zajmuje każda karta, aby zakończyć swoją turę po odkryciu.
tooltip.cfg.community_reveal_style=Wybierz, jak odwracane są karty wspólne. Każdy widok zapamiętuje własne ustawienie. Domyślnie obrót jest sztywny w 2D i elastyczny w 3D.
tooltip.cfg.card_flip_direction=Wybiera, w którą stronę obracają się karty po odkryciu. Mieszane wybiera kierunek dla każdego ościeża. Karty w tej samej grupie odwracają się razem w ten sam sposób.
tooltip.cfg.card_flip_zoom=Powiększa karty podczas odwracania, dzięki czemu wydają się poruszać w kierunku ekranu.
tooltip.cfg.reparto_velocidad=Określa czas podróży każdej karty z talii na miejsce.
tooltip.cfg.community_deal_style=Wybierz, czy wszystkie pięć kart wspólnych ma zostać rozdanych zakrytych na początku, czy też rozdanych na osobnej ulicy. Zapisane zmiany obowiązują od następnego rozdania.
tooltip.cfg.anim_calidad=Jakość zachowuje każdy szczegół wizualny. Wydajność zmniejsza koszt lotów kart i ujawnia się na słabszych komputerach.
tooltip.cfg.downgrade_velocidad=Ustawia czas potrzebny na zmianę położenia stołu, gdy gracz opuści stół.
tooltip.cfg.swap_velocidad=Ustawia czas potrzebny na przejście kart po posortowaniu.
tooltip.cfg.swap_estilo=Arc podnosi jedną kartę nad drugą. Poziomy przecina je na tej samej wysokości.
tooltip.cfg.resaltar_avatares=Jeśli zatrzymasz mysz na chwilę na awatarze gracza, wyświetli się on w powiększeniu nad stołem, obok jego nazwy i stosu, i zniknie, gdy odsuniesz od niego mysz.
tooltip.cfg.resaltar_jugada_showdown=Podczas wyłożenie kart najechanie myszką na nazwę ręki dowolnego gracza (zwycięzcy lub przegranego) podświetla tylko karty, które ją tworzą i przyciemnia resztę.
tooltip.cfg.screenshot_fin_timba=Automatycznie zapisuje zrzut ekranu końcowego ekranu po zakończeniu liczenia pieniędzy (lub po wyjściu z niego, jeśli wyjdziesz wcześniej).
tooltip.cfg.server_ip=Adres (IP lub domena), pod którym nasłuchuje serwer gry.
tooltip.cfg.server_port=TCP port od 1 do 65535, na którym nasłuchuje serwer.
tooltip.cfg.upnp=Prosi router o przekazanie tego portu TCP do hosta do czasu zamknięcia sesji gry.
tooltip.cfg.preset=Ładuje zapisany profil ustawień.
tooltip.cfg.preset_save=Zapisuje bieżące ustawienia jako profil wielokrotnego użytku.
tooltip.cfg.preset_delete=Usuwa wybrany profil ustawień.
tooltip.cfg.buyin=Żetony, z którymi każdy gracz zaczyna przy stole.
tooltip.cfg.buyin_range=Ze zmienną wpisowe każdy gracz wybiera swoje wpisowe z tego zakresu (w duża ciemna).
tooltip.cfg.volume=Ogólna głośność gry.
tooltip.cfg.sound_master=Włącza lub wycisza muzykę, efekty dźwiękowe i dźwięk czatu. Pokerowy odtwarzacz wideo ma własną głośność.
tooltip.cfg.music_master=Włącza i wyłącza całą muzykę.
tooltip.cfg.fx_master=Włącza i wyłącza wszystkie efekty dźwiękowe.
tooltip.cfg.game_start_sound=Odtwarza dźwięk startowy po rozpoczęciu lub wznowieniu gry.
tooltip.cfg.music_surface=Włącza muzykę dla tego ekranu lub chwili. Przycisk odtwarzania umożliwia podgląd bez opuszczania Ustawień.
tooltip.cfg.recovery_music=Włącza muzykę odtwarzaną podczas odzyskiwania przerwanej gry.
tooltip.cfg.silly_sounds=Włącza dźwięki żartów, które mogą być odtwarzane podczas gry.
gdx.settings.tooltip.mod_audio_override=Używana jest wersja dostarczona przez załadowany MOD.
tooltip.cfg.play_own_notes=Odtwarza także własne notatki głosowe po ich wysłaniu.
tooltip.cfg.notes_retention=Ustawia czas przechowywania notatek głosowych. W przypadku opcji „Na zawsze” są one usuwane wyłącznie ręcznie.
tooltip.cfg.purge_notes=Usuwa teraz wszystkie zapisane notatki głosowe.
tooltip.cfg.view_notes=Otwiera przeglądarkę zapisanych notatek głosowych.
tooltip.cfg.voice_notes_rule=Reguła tabeli: umożliwia wysyłanie i odbieranie notatek głosowych.
tooltip.cfg.notes_local=Włącza notatki głosowe na Twoim urządzeniu (nagrywanie i odtwarzanie).
tooltip.cfg.tts=Umożliwia czytanie na głos wiadomości czatu przy stole. Każdy gracz może wyciszyć funkcję zamiany tekstu na mowę na swoim urządzeniu.
tooltip.cfg.display_mode=Wybierz pomiędzy trybem pełnoekranowym w oknie, bez obramowania i ekskluzywnym pełnym ekranem. Obowiązuje przy zapisie.
tooltip.cfg.compact_view=Zmniejsza żetony i karty, aby wyświetlić więcej stołu. Stany: wyłączone, kompaktowe, kompaktowe z małymi kartami, a także kompaktowe na własną rękę.
tooltip.cfg.dialog_zoom=Skale okien dialogowych i ich tekstu. Można to zmienić jedynie na ekranie startowym. Dotyczy to następnego otwartego okna dialogowego.
tooltip.cfg.deck=Projekt talii kart.
tooltip.cfg.table_renderer=Dla następnego stołu wybierz GDX lub Swing Legacy. Nie można go zmienić w trakcie gry.
tooltip.cfg.table_renderer_cli=Mechanizm renderujący jest zmuszony do tego uruchomienia z wiersza poleceń.
tooltip.cfg.deck_back=Projekt rewersu karty.
tooltip.cfg.table_felt=Kolor filcu stołowego.
tooltip.cfg.nivel_luz=Jaką jasność (%) utrzymuje stół przy wyłączonych światłach, niezależnie od tego, czy wyłączysz je samodzielnie, czy też zgasną same (pauza, koniec gry). Im jest niższy, tym ciemniejszy wydaje się. Domyślnie 35%.
