gdx.settings.tooltip.animation=Zmienia ruch lub prędkość tego efektu wizualnego.
gdx.settings.tooltip.shuffle_preload=Zatrzymuje tasowanie klatek w RAM, aby uniknąć ich dekodowania podczas animacji. Zwiększa wykorzystanie pamięci.
gdx.settings.tooltip.cinematic=Włącza lub wyłącza tę sekwencję wizualną.
gdx.settings.tooltip.information=Pokazuje lub ukrywa te informacje podczas gry.
gdx.settings.tooltip.show_time=Pokazuje zegar stołowy podczas gry.
gdx.settings.tooltip.pot_player_count=Pokazuje, ilu graczy może jeszcze działać w rozdaniu. Spasowani gracze, gracze all-in, widzowie i gracze na rozgrzewce są wykluczeni. Licznik jest ukryty na zero.
gdx.settings.tooltip.dim_folded_opponents=Przyciemnia miejsca przeciwników, którzy pasują do następnego rozdania.
gdx.settings.tooltip.show_call_cost=Pokazuje, ile potrzeba, aby sprawdzić bieżący zakład na stole.
gdx.settings.tooltip.anti_dos_warnings=Wyświetla ostrzeżenie, gdy ochrona sieci wykryje zbyt wiele żądań.
gdx.settings.tooltip.table_chat_feed=Pokazuje powiadomienia o czacie i grach nad stołem. Szybki czat przechowuje pełną historię.
gdx.settings.tooltip.table_speaking_emoji=Wyświetla żółty emoji nad głośnikiem podczas zamiany tekstu na mowę i notatek głosowych, w tym Twoich własnych.
gdx.settings.tooltip.chat_images=Umożliwia wysyłanie obrazów ze stołu i wyświetla otrzymane obrazy nad graczem, który je wysłał.
gdx.settings.tooltip.animations_master=Główny przełącznik animacji, efektów, filmów i pokerowego odtwarzacza wideo.
gdx.settings.option.mostrar_videos_poker=Filmy o pokerze
gdx.settings.tooltip.poker_videos=Pokazuje gracza w menu głównym, lobby i przy stole. Zamyka się po uruchomieniu gry i można go ponownie otworzyć za pomocą ikony.
gdx.settings.tooltip.halo_effects=Sterowanie się obraca, wokół siedzeń świeci niebezpieczeństwo i zwycięzca.
gdx.settings.tooltip.modal_blur=Rozmywa tło za modalnymi oknami dialogowymi i powiadomieniami.
gdx.settings.tooltip.glass_effects=Kontroluje dekoracyjny połysk i głębokość przycisków i elementów sterujących.
gdx.settings.tooltip.cinematics_master=Włącza lub wyłącza sekwencje ALL-IN i KONIEC GRY.
gdx.settings.tooltip.cinematic_allin=Pokazuje sekwencję wizualną, gdy gracz przechodzi All-in.
gdx.settings.tooltip.cinematic_gameover=Pokazuje sekwencję wizualną, gdy graczowi skończą się żetony.
gdx.settings.tooltip.animation_shuffle=Rozgrywa tasowanie przed rozdaniem każdego rozdania.
gdx.settings.tooltip.animation_deal=Animuje karty przelatujące z talii do graczy i do pozycji kart wspólnych.
gdx.settings.tooltip.animation_reveal=Animuje obracanie się kart po ich odkryciu.
gdx.settings.tooltip.animation_position_chips=Animuje krupiera, żetony ciemne i straddle poruszają się po stole.
gdx.settings.tooltip.animation_counters=Animuje zmiany w stosach, zakładach i puli.
gdx.settings.tooltip.animation_seats=Animuje wchodzenie i przestawianie siedzeń wokół stołu.
gdx.settings.tooltip.animation_sort_hand=Animuje skrzyżowanie kart podczas ich sortowania.
gdx.settings.tooltip.animation_final_count=Animuje licznik zysków i strat po zakończeniu gry.
gdx.settings.tooltip.animation_final_summary_cards=Animuje pojawienie się kart równowagi po zakończeniu gry. Wyłącz go, aby karty natychmiast były na swoim miejscu.
gdx.settings.tooltip.animation_allin_fire=Pokazuje ogień za graczami, którzy mają All-in.
gdx.settings.tooltip.animation_winner=Pokazuje światła i cząstki wokół zwycięskich miejsc.
gdx.settings.tooltip.animation_chips=Animuje latające żetony podczas obstawiania i zbierania puli.
gdx.settings.tooltip.animation_reseat=Animuje zmianę układu stołu, gdy gracz opuszcza grę.
gdx.settings.tooltip.animation_shuffle_cascade=Pokazuje rozproszone tasowanie przemieszczające się pomiędzy graczami.
gdx.settings.tooltip.auto_fullscreen=Automatycznie przechodzi do trybu pełnoekranowego po uruchomieniu stołu i pozwala na to wybrany tryb okna.
gdx.settings.tooltip.vsync=Synchronizuje klatki z monitorem, aby zapobiec rozdarciu. Może obniżyć FPS i zwiększyć opóźnienie.
gdx.settings.tooltip.fps_limit=Czapki FPS. „Częstotliwość odświeżania monitora” podąża za Twoim wyświetlaczem. Większa liczba klatek na sekundę zużywa więcej energii.
gdx.settings.tooltip.msaa=Wygładza geometryczne krawędzie sceny. Więcej próbek zwiększa obciążenie GPU. Obowiązuje po ponownym uruchomieniu.
gdx.settings.tooltip.card_rendering=Smooth stosuje dodatkowy filtr do krawędzi kart. Native dobiera karty bezpośrednio.
gdx.settings.tooltip.show_fps=Pokazuje na ekranie bieżący stan FPS i VSync.
gdx.settings.tooltip.show_cpu_memory=Pokazuje Java CPU i wykorzystanie pamięci.
gdx.settings.tooltip.gpu_renderer=Pokazuje kartę graficzną i sterownik OpenGL używany przez grę.
gdx.settings.tooltip.audio_output=Wybiera urządzenie używane do odtwarzania dźwięku z gry.
gdx.settings.tooltip.audio_capture=Wybiera mikrofon używany do nagrywania wiadomości głosowych.
gdx.settings.tooltip.microphone=Umożliwia nagrywanie i wysyłanie wiadomości głosowych z gry.
gdx.settings.tooltip.mic_auto_gain=Automatycznie dostosowuje poziom mikrofonu, aby kompensować głosy, które są zbyt ciche lub głośne.
gdx.settings.tooltip.local_tts=Zezwala lub blokuje odtwarzanie wiadomości zamiany tekstu na mowę na tym komputerze.
gdx.settings.tooltip.auto_buttons=Pokazuje automatyczne akcje, które można wykonać, gdy nadejdzie Twoja tura.
gdx.settings.tooltip.auto_call=Konfiguruje automatyczne dzwonienie i jego maksymalną dozwoloną kwotę.
gdx.settings.tooltip.auto_persist=Utrzymuje wybraną akcję automatyczną po jej uruchomieniu, aż do zakończenia rozdania lub wyczyszczenia wyboru.
gdx.settings.tooltip.auto_confirm=Żąda potwierdzenia przed uruchomieniem automatycznej akcji.
gdx.settings.tooltip.confirm_actions=Żąda potwierdzenia przed ważnymi ręcznymi działaniami.
gdx.settings.tooltip.auto_rebuy=Automatycznie wkupuje się ponownie, gdy skończą Ci się żetony i dozwolone są ponowne dokupy.
gdx.settings.tooltip.shortcut=Wybierz wiersz, a następnie naciśnij klawisz, który chcesz przypisać do tej akcji.
gdx.settings.tooltip.rebuy_cap=Wybiera, czy limit żetonów po dokupienie opiera się na wpisowe, czy na największym stosie na stole.
gdx.settings.tooltip.blind_structures=Otwiera edytor do zarządzania strukturami na poziomie ciemne.
gdx.settings.tooltip.blind_unit=Wybiera, czy podwyżki o ciemne mają być zaplanowane na podstawie rozegranych rozdań czy minut.
gdx.settings.tooltip.blind_interval=Ustawia liczbę rozdań lub minut, które upływają pomiędzy wzrostami o ciemne.
gdx.settings.tooltip.blind_cap_level=Maksymalna liczba ciemne wzrasta od poziomu początkowego.
gdx.settings.tooltip.rebuy=Umożliwia graczom zakup większej liczby żetonów w trakcie gry, aż do limitu dokupienie.
