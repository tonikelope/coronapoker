player.en_el_bmodo_recuperacionb_se=W <b>TRYBIE ODZYSKIWANIA</b> poprzednia gra będzie kontynuowana od miejsca, w którym się zatrzymała:\n\n1) <b>OBOWIĄZKOWE</b> jest, aby starzy gracze używali <b>SAME NICKS</b>.\n\n2) Aby kontynuować od <b>DOKŁADNEGO PUNKTU</b> rozdania, <b>OBOWIĄZKOWE</b> jest ponowne połączenie <b>WSZYSTKICH</b> starych graczy. Jeśli nie jest to możliwe, rozdanie trwające w momencie przerwania gry zostanie utracone.\n\n3) <b>Nowi gracze</b> mogą dołączyć do gry (będą widzami pierwszego rozdania).
