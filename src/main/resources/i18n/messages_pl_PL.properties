zero_trust.fatal_incident_body=CoronaPoker odrzucił uwierzytelniony stan krytyczny i zatrzymał tabelę przed kontynuowaniem. Potwierdź to ostrzeżenie, aby zamknąć tabelę, której dotyczy problem.\n\nDowód zaufania Zero: {0}
