game.mano_anulada_footer=\n\nOSTRZEŻENIE: Wszystkie zakłady zostały zwrócone graczom w stanie nienaruszonym.
game.showdown_forfeit_msg=UWAGA: Weryfikacja wyłożenie kart nie powiodła się dla następujących graczy i ich karty NIE zostaną ujawnione:\n\n%nicks%\n\nCi gracze są wykluczeni z oporu wyłożenie kart (automatyczne składanie) i NIE MOGĄ wygrać tej puli. Gra toczy się normalnie.
zero_trust.peer_sra_corrupt=Podpis wyłożenie kart jest prawdziwy, ale klucz SRA partnera nie jest rozpoznawany jako ważne karty. Dzieje się tak tylko wtedy, gdy partner celowo podpisał uszkodzony klucz lub jego klient ma błędy. Nie jesteśmy w stanie stwierdzić które i dla bezpieczeństwa kończymy grę.
zero_trust.straddle_recover_mismatch=Odzyskując rozdanie, gospodarz ogłosił straddle inny niż ten, który zarejestrował Twój lokalny egzemplarz. Dzieje się tak tylko wtedy, gdy host manipuluje odzyskanym straddle lub jego klient ma błędy. Ręka jest nadal rekonstruowana na podstawie Twojej zaufanej kopii, ale ostrzegamy Cię jako środek ostrożności.
zero_trust.rit_recover_mismatch=Odzyskując rozdanie, gospodarz ogłosił wynik dwukrotnie różniący się od tego, który zarejestrowała Twoja lokalna kopia. Dzieje się tak tylko wtedy, gdy host manipuluje odzyskanym wynikiem lub jego klient ma błędy. Ręka jest nadal rekonstruowana na podstawie Twojej zaufanej kopii, ale ostrzegamy Cię jako środek ostrożności.
zero_trust.peer_sra_corrupt_registro=Klucz \u2014 wyłożenie kart podpisany, ale nie przekłada się na karty. Możliwy cheat lub błąd klienta.
