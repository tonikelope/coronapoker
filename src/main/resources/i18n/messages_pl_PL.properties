zero_trust.action_rejected_invalid_signature=\u26a0\ufe0f [ZERO-TRUST] Akcja odrzucona (nieprawidłowy podpis) -> {0}
zero_trust.auditing_memory=[ZERO-TRUST] Sprawdzanie pamięci roju RAM...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Dziennik binarny załadowany do pamięci (sygnatury {0} gotowe do zsynchronizowanego odtwarzania).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Kaskada tasowania kryptograficznego nie powiodła się. Rozdanie zostało anulowane.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Nie udało się odblokować prywatnych kart (gracz nie odpowiedział na czas). Rozdanie zostało anulowane.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Odszyfrowana karta nie pasuje do żadnej ważnej karty w talii. Gra została anulowana.
peer.not_enough_players=Gracz odpadł podczas tasowania i nie ma już wystarczającej liczby graczy, aby rozdać rozdanie.
peer.unlock_no_testament=Gracz rozłączył się bez pozostawienia klucza deszyfrującego. Rozdanie zostało anulowane.
peer.broadcast_failed=Błąd sieciowy podczas rozgłaszania kart prywatnych. Rozdanie zostało anulowane.
peer.recovery_action_data_unavailable=Nie można odczytać zapisanej historii działań. Rozdanie zostało bezpiecznie anulowane i wróci do regeneracji.
straddle.deferred_release_failed=Nie udało się odkryć kart ciemne straddle (gracz rozłączył się lub odmówił współpracy). Rozdanie zostało anulowane.
peer.state_inconsistent=Stan dealera stał się niespójny. Rozdanie zostało anulowane.
peer.bot_no_token=Bot nie ma przygotowanego klucza deszyfrującego. Rozdanie zostało anulowane.
peer.community_unlock_no_testament=Gracz rozłączył się bez pozostawienia klucza, aby odsłonić karty wspólne. Rozdanie zostało anulowane.
peer.dropped_during_cascade=Gracz rozłączył się podczas tasowania kryptograficznego talii. Rozdanie zostało anulowane.
peer.dropped_during_rotation=Gracz rozłączył się podczas rotacji kryptograficznej talii. Rozdanie zostało anulowane.
zero_trust.rotation_refused=Połączony gracz odmówił dostarczenia klucza do rotacji talii. Gra zostaje zatrzymana. Będą musieli uzasadnić swoją odmowę ponownego przyjęcia.
zero_trust.cascade_refused=Połączony gracz odmówił wzięcia udziału w kaskadzie tasowania talii. Gra zostaje zatrzymana. Będą musieli uzasadnić swoją odmowę ponownego przyjęcia.
zero_trust.pocket_unlock_refused=Połączony gracz odmówił dostarczenia klucza do odszyfrowania kart kieszonkowych. Gra zostaje zatrzymana. Będą musieli uzasadnić swoją odmowę ponownego przyjęcia.
zero_trust.community_unlock_refused=Połączony gracz odmówił dostarczenia klucza w celu odsłonięcia kart wspólnych. Gra zostaje zatrzymana. Będą musieli uzasadnić swoją odmowę ponownego przyjęcia.
zero_trust.host_showdown_sig_missing=Z serwera otrzymano klucz wyłożenie kart BEZ podpisu kryptograficznego autora lub ze zniekształconym podpisem. Serwer może zastępować klucz na kablu.
zero_trust.host_showdown_sig_invalid=Z serwera odebrano klucz wyłożenie kart z NIEPRAWIDŁOWYM podpisem kryptograficznym. Serwer może zastępować klucz na kablu.
zero_trust.host_potcards_mismatch=Tekst jawny wyłożenie kart wysłany przez serwer NIE JEST ZGODNY z wynikiem odszyfrowania fragmentu lokalnego za pomocą podpisanego klucza. Serwer może wysyłać fałszywe karty pod numer wyłożenie kart.
zero_trust.host_community_garbage=Dane kryptograficzne z karty wspólnej otrzymane z serwera są niespójne (fragment nie jest deszyfrowany w celu uzyskania ważnej talii karty lub nie jest zgodny z podpisanym ogłoszeniem serwera). Możliwe przyczyny: BŁĄD w jakiejś wersji oprogramowania, wersja serwera, której kod mógł zostać zmieniony lub uszkodzenie lokalnego klucza tożsamości. Klient nie widzi różnicy i NIE oskarża nikogo.
zero_trust.host_unlock_out_of_order=Z serwera otrzymano żądanie odszyfrowania w niewłaściwej kolejności (niewłaściwa ulica, powtarzający się przedział, brak kolejności faz lub żądanie wydane przed zamknięciem poprzedniej ulicy).
zero_trust.host_cascade_mid_hand=W trakcie trwającego rozdania z serwera otrzymano żądanie ponownego uruchomienia w trybie losowym (zastąpiłoby to mój klucz deszyfrujący).
zero_trust.host_pocket_extraction=Z serwera otrzymano żądanie odszyfrowania, które będzie miało wpływ na TWOJE WŁASNE karty prywatne.
zero_trust.host_community_extraction=Z serwera otrzymano żądanie odszyfrowania, które miało ujawnić kartę wspólną z wyprzedzeniem.
zero_trust.host_rotation_replay=Serwer zażądał rotacji drugiej karty w tym samym rozdaniu. Prawidłowa rotacja jest unikalna dla każdego rozdania. Powtórzenie sugeruje próbę użycia klienta do odszyfrowania kart innych graczy.
zero_trust.host_shuffle_proof_failed=Weryfikacja transakcji nie powiodła się: nie można było udowodnić, że talia rozdana przez serwer była uczciwym przetasowaniem talii Genezy. Odblokowanie przez społeczność zostało odrzucone i ta sesja została zakończona w celu ochrony prywatnych kart.
zero_trust.host_shuffle_proof_missing=Do zawarcia transakcji nie doszło bez sprawdzalnego dowodu uczciwego przetasowania talii tej ręki, a karty wspólne są teraz ujawniane. Może to być błąd, opóźnienie sieci lub host próbujący manipulować transakcją. Możesz grać dalej, ale zdecydowanie zaleca się opuszczenie tego stołu.
zero_trust.deck_unverified=Talia tego rozdania NIE mogła zostać zweryfikowana jako uczciwe przetasowanie. PODEJRZANY: gospodarz „{0}”, który zajmuje się i transmituje dowód przetasowania. Może to być gospodarz manipulujący transakcją lub gracz, który zataił dowód. Rozdanie zostaje rozegrane, ponieważ karty zostały już rozdane.
zero_trust.deck_unverified_body=Zapisano podpisane dowody tej anomalii (w dzienniku gry, kolorem czerwonym i w tabeli spornych rąk). Możesz grać dalej, ale jeśli nie ufasz gospodarzowi, opuść stół.
zero_trust.seat_redraw=Gospodarz „{0}” wymusił NOWĄ losowanie miejsc. To NIEZWYKŁE: losowanie jest zbiorowe i możliwe do sprawdzenia, więc gospodarz nie może wybrać miejsc, ale MOŻE przerzucać losowanie, dopóki nie uzyska układu, który mu się podoba. Jeśli sytuacja się powtórzy, może to oznaczać, że gospodarz próbuje ustawić Twoje miejsce.
zero_trust.seat_redraw_body=Nowe losowanie przebiegło w ten sam sposób i nadal można je zweryfikować: nikt, łącznie z gospodarzem, nie może wybrać wyniku. Może się tak zdarzyć, jeśli gracz odpadł już na początku, ale jeśli zobaczysz kilka ponownych prób i nie ufasz gospodarzowi, opuść stół. Zostało zarejestrowane.
zero_trust.seat_recover_mismatch=Po przywróceniu gry kolejność miejsc wysłana przez gospodarza „{0}” NIE jest zgodna z tą zapisaną przez klienta: ktoś, kogo już znałeś, zmienił miejsce przy stole. Może to być gospodarz próbujący zmienić kolejność miejsc pod przykrywką rekonwalescencji.
zero_trust.seat_recover_mismatch_body=Twój klient zachował numer referencyjny miejsca siedzącego, który sam zweryfikował na początku. Dołączanie graczy lub opuszczanie ich w międzyczasie jest normalne. Ponowne zamawianie kogoś, kto już tam był, nie jest. Jeśli nie ufasz gospodarzowi, opuść stół. Zostało zarejestrowane.
zero_trust.host_recover_action_forged=Gospodarz próbował wstrzyknąć FORGED akcję (nieprawidłowy podpis) podczas odzyskiwania gry. Twój klient odmówił.
zero_trust.host_recover_action_omitted=Podczas odzyskiwania host pominął akcję, którą TY wykonałeś i zapisałeś w lokalnej bazie danych. Twój klient wykrył to na własnej kopii i NIE porzucił po cichu Twojej akcji.
zero_trust.host_recover_balance_mismatch=Gospodarz próbował zmienić Twoje saldo (żetonów/wpisowe) podczas odzyskiwania gry: nie jest ono zgodne z Twoim lokalnym rekordem. Twój klient zachował TWOJĄ prawdziwą równowagę.
zero_trust.host_board_peek=Gospodarz poprosił o odszyfrowanie karty wspólnej z PRZYSZŁEJ ulicy (próba wcześniejszego odczytania tablicy). Twój klient odmówił.
zero_trust.suspect_host_prefix=PODEJRZANY: host „{0}”.
zero_trust.suspect_peer_prefix=PODEJRZANY: gracz „{0}”.
zero_trust.peer_alert=⚠️ [ANOMATYCZNE ZACHOWANIE GRACZY]
zero_trust.peer_suspicious_header=Przy Twoim stole wykryto nietypowe lub obraźliwe zachowanie gracza:\n
zero_trust.peer_suspicious_body=Stół zastosował odpowiednie zabezpieczenie i gra toczy się dalej dla pozostałych graczy. Zakłada się dobrą wiarę. Może to być błąd oprogramowania i nikt nie jest oskarżany. Dowody są rejestrowane.
zero_trust.peer_inbound_flood=Utrzymywany ruch uwierzytelniony powyżej progu ochrony przed DoS.
zero_trust.peer_binary_flood=Operacje na wiadomościach głosowych są wysyłane z niezwykle dużą szybkością.
zero_trust.host_binary_flood=Host wysyła wiadomości głosowe z niezwykle dużą szybkością.
zero_trust.peer_flood_log=Incydent Anti-DoS oczekujący na decyzję: gracz {0}, IP {1}. Powód: {2}
zero_trust.peer_flood_confirm=Użytkownik {0} wysyła nadmierny ruch. Może to być atak DoS lub błąd. Wyrzucić ich z gry?\n\nIP: {1}\nWykryty powód: {2}
zero_trust.peer_flood_suppress=Nie pokazuj tych ostrzeżeń
zero_trust.peer_hand_ready_withheld=Gracz odpowiada na PING, ale nie potwierdza gotowości do następnego rozdania w trakcie gry. Zablokował start ręczny i został WYKLEPONY. Gra toczy się dalej bez nich.
zero_trust.peer_action_withheld=Gracz odpowiada na PING, ale nie wysyła swojej akcji w trakcie gry, po upływie czasu namysłu. Runda zamrażała i został WYKLEPONY. Gra toczy się dalej bez nich.
zero_trust.peer_conf_withheld=Gracz odpowiada na PING, ale nie potwierdza otrzymania wiadomości o rozdaniu podczas trwania gry. Blokował ruch stołu i został WYKLEPONY. Gra toczy się dalej bez nich.
zero_trust.peer_deal_refusal_expelled=Gracz wymusił kilka odwołań rozdań z rzędu, odmawiając przetasowania lub rotacji talii. Został WYKONANY, więc gra może być kontynuowana.
zero_trust.suspicious_alert=⚠️ [ANOMATYCZNE ZACHOWANIE SERWERA]
zero_trust.suspicious_header=Twój klient wykrył nietypowe zachowanie serwera (nie jest to zdarzenie krytyczne powodujące zawieszenie gry):\n
zero_trust.suspicious_body=Twój klient odrzucił anomalną operację i gra MOŻE być kontynuowana. Zakładamy dobrą wiarę: może to być BŁĄD oprogramowania (klienta lub serwera) i nikt nie jest oskarżany. Ponieważ jednak błędu nie da się odróżnić od manipulacji, DLA TWOJEGO BEZPIECZEŃSTWA ZDECYDOWANIE ZALECA SIĘ Opuszczenie tego stołu za pomocą przycisku „Opuść” (Twoje pieniądze NIE zostaną przetworzone w tym rozdaniu).
zero_trust.host_bad_wire=Z serwera otrzymano żądanie odszyfrowania z nieprawidłowym formatem lub punktami nie należącymi do krzywej kryptograficznej.
zero_trust.host_critical_command_invalid=Nie można sprawdzić poprawności krytycznego polecenia {0} wysłanego przez serwer. Może to być niekompatybilność, błąd lub zmodyfikowany serwer. Sesja zostaje zatrzymana w celu ochrony jej integralności.
zero_trust.cheater_detected=[ZERO-TRUST] Wykryto gracza ze zmodyfikowaną wersją CoronaPoker, co sugeruje, że może próbować oszukiwać. Czy chcesz kontynuować?
zero_trust.corrupted_mac_action=Serwer próbował przetworzyć akcję z nieprawidłowym podpisem kryptograficznym (uszkodzony adres MAC) w imieniu:
zero_trust.critical=\u274c [ZERO-ZAUFANIE] ALERT KRYTYCZNY: NIEWAŻNY PODPIS LUB ZŁAMANY KONSENS.
zero_trust.critical_alert_body=AKTYWOWANY STAN KWARANTANNY:\nTwój klient NIE WYśle więcej kluczy kryptograficznych do serwera w tej sesji.\nGra jest matematycznie zawieszona, aby chronić Twoje saldo.\n\nMOŻLIWE przyczyny to:\n - BŁĄD w samym kodzie klienta,\n - BŁĄD w kodzie klienta kod serwera, lub\n - SERWER, którego kod mógł zostać zmieniony.\n\nKlient nie jest w stanie ich rozróżnić i nie wiąże się to z ŻADNYM oskarżeniem. Dla bezpieczeństwa i do czasu sprawdzenia przyczyny, ZALECA SIĘ OPUSZCZENIE tej gry za pomocą przycisku „Wyjdź” (Twoje pieniądze NIE zostaną przetworzone w tym rozdaniu).
zero_trust.critical_alert_header=INCYDENT ZERO-TUST!\n\nTwój klient wykrył anomalię w protokole kryptograficznym:\n
zero_trust.critical_session_error=[ZERO-TRUST] KRYTYCZNY BŁĄD SESJI
zero_trust.decrypting_street=[ZERO-TRUST] SZYFROWANIE ULICY...
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Szybki limit czasu na konsensus. Wymuszanie awansu.
zero_trust.forged_identity_action=Serwer próbował przetworzyć akcję za pomocą sfałszowanego podpisu tożsamości w imieniu:
zero_trust.game_aborted=[ZERO-TRUST] Gra przerwana. Wykop oszustów.
zero_trust.generating_kem=[ZERO-ZAUFANIE] GENEROWANIE KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ALERT ZERO ZAUFANIA] Nieprawidłowy adres MAC na kartach wspólnych. Możliwa manipulacja.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] KONSENSUSOWA WERYFIKACJA KRYPTOGRAFICZNA: WSZYSCY GRACZE POTWIERDZALI PRZECHODZENIE LOKALNEJ RĘCZNEJ WERYFIKACJI KRYPTOGRAFICZNEJ.
zero_trust.legit2_error=\u274c [ZERO-TRUST] KONSENSUSOWA WERYFIKACJA KRYPTOGRAFICZNA: CO NAJMNIEJ JEDEN GRACZ NIE POTWIERDZAŁ PRZECHODZENIA LOKALNEJ RĘCZNEJ WERYFIKACJI KRYPTOGRAFICZNEJ.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] LOKALNA RĘCZNA WERYFIKACJA KRYPTOGRAFICZNA: MOJE KARTY, KARTY SPOŁECZNOŚCI ORAZ WSZYSTKIE ZAPISANE DZIAŁANIA SĄ UPRAWNIONE.
zero_trust.legit_error=\u274c [ZERO-TRUST] LOKALNA RĘCZNA WERYFIKACJA KRYPTOGRAFICZNA: NIE MOGĘ ZAPEWNIĆ, ŻE MOJE KARTY, KARTY SPOŁECZNOŚCI ORAZ WSZYSTKIE ZAPISANE DZIAŁANIA SĄ UPRAWNIONE.
zero_trust.lockdown_activated=\ud83d\udd12 [BLOKADA] Aktywowano kwarantannę. Blokowanie transmisji kluczy kryptograficznych.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Brak poprzedniego dziennika binarnego dla tego rozdania.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: KONTROLA PAMIĘCI...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] Wykryto gracza ze zmodyfikowaną wersją CoronaPoker, co sugeruje, że może próbować oszukiwać.
zero_trust.p2p_finished_resuming=Weryfikacja P2P KEM zakończona. Wznawianie rozdania...
zero_trust.p2p_generating_challenges=[ZERO-ZAUFANIE] P2P: GENEROWANIE WYZWAŃ...
zero_trust.p2p_timeout=Przekroczono limit czasu roju P2P! Część zawodników została oznaczona jako nierzetelna.
zero_trust.p2p_verifying_signatures=[ZERO-TRUST] P2P: WERYFIKACJA PODPISÓW...
zero_trust.read_binary_log_failure=[ZERO-TRUST] Nie udało się odczytać dziennika binarnego.
zero_trust.rejecting_master_key=\ud83d\udd12 [BLOKADA] Odrzucanie transmisji klucza głównego do serwera.
zero_trust.rejecting_street_token=\ud83d\udd12 [BLOKADA] Odrzucanie żądania Street Token z serwera.
zero_trust.replay_queue_synced=\u2714\ufe0f [ZERO-TRUST] Kolejka powtórek zsynchronizowana (sygnatury {0}).
zero_trust.security_alert=\u26a0\ufe0f [ALERT BEZPIECZEŃSTWA]
zero_trust.evidence_location=Dowód zerowego zaufania: {0}
