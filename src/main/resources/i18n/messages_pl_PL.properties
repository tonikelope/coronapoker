game.recover_accion_ausencia=⚠ Uwaga: gospodarz odtworzył akcje później niż Twoja ostatnia zarejestrowana akcja, prawdopodobnie zagrane, gdy byłeś poza rozdaniem – nie można ich zweryfikować i są akceptowane w postaci, w jakiej zostały wysłane przez gospodarza
game.mano_verificacion_divergente=⚠ ROZbieżność weryfikacji kryptograficznej. Jeden lub więcej uczestników zgłosiło inny stan rozdania końcowego. Dowód: {0}
game.mano_verificacion_jugador_ausente=⚠ Uwaga: {0} nie wysłał podpisu końcowego. Bezpieczne zamknięcie dłoni zostało zatrzymane. Dowód: {1}
game.mano_verificacion_firma_invalida=⚠ Uwaga: {0} wykrył podczas tego rozdania nieprawidłowy podpis kryptograficzny. Bezpieczne zamknięcie zostało zatrzymane. Dowód: {1}
game.popup_verificacion_firma_invalida=Podczas tego rozdania jeden lub więcej uczestników ({0}) wykrył nieprawidłowy podpis kryptograficzny w akcji.\n\nDane otrzymane przez wszystkich uczestników były spójne (oznaczenie skrótu końcowego łańcucha było zgodne), ale co najmniej jedna akcja nie została poprawnie podpisana przez jej oczekiwanego autora.\n\nCoronaPoker zatrzymał bezpieczne zamykanie rozdań i zamknie stół z powodu naruszenia bezpieczeństwa po ustąpieniu tego ostrzeżenia potwierdzone.\n\nDowód zapisany w:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Uwaga: {0} nie otrzymał dowodu na uczciwe tasowanie dla tego rozdania. Dowód: {1}
game.popup_verificacion_host_sin_prueba=Jeden lub więcej uczestników ({0}) nie otrzymało dowodu uczciwego przetasowania dla tego rozdania.\n\nSkrót końcowego łańcucha jest zgodny u wszystkich uczestników, więc akcje rozdań są spójne. Właściwy gospodarz zawsze wysyła ten dowód, zatem powtarzająca się lub wybiórcza nieobecność może wskazywać na modyfikację oprogramowania lub defekt oprogramowania.\n\nRozdanie zostało rozstrzygnięte, ale zaleca się opuszczenie gry jako środek ostrożności.\n\nDowód zapisany w:\n{1}
game.popup_verificacion_titulo_alerta=Rozbieżność weryfikacji kryptograficznej
game.popup_verificacion_titulo_aviso=Weryfikacja kryptograficzna niekompletna
game.popup_verificacion_divergente=Jeden lub więcej uczestników zgłosiło inną weryfikację kryptograficzną ostatecznego stanu rozdania.\n\nMoże to być spowodowane zmodyfikowanym oprogramowaniem lub defektem oprogramowania. CoronaPoker nie może automatycznie określić przyczyny ani tego, kto ją spowodował.\n\nCoronaPoker zatrzymał bezpieczne zamknięcie ręki i zamknie stół z powodu naruszenia bezpieczeństwa po potwierdzeniu tego ostrzeżenia.\n\nDowód zapisany w:\n{0}
game.popup_verificacion_ausente=W ostatnim rozdaniu nie udało się osiągnąć konsensusu, ponieważ gracz {0} nie wysłał podpisu końcowego.\n\nMoże to być spowodowane awarią sieci, awarią klienta lub modyfikacją oprogramowania. CoronaPoker zatrzymał bezpieczne zamknięcie dłoni i zamknie stół ze względu na awarię bezpieczeństwa po potwierdzeniu tego ostrzeżenia.\n\nDowód zapisany w:\n{1}
game.mano_verificacion_interrumpida=KRYTYCZNY: Niepowodzenie bezpiecznego zamknięcia dłoni ({0}). Tabela zostanie zamknięta z powodu awarii zabezpieczeń. Dowód: {1}
game.popup_verificacion_interrumpida=CoronaPoker nie mógł ukończyć kryptograficznego protokołu zamknięcia ostatniego rozdania.\n\nNiepowodzenie: {0}\n\nRęka pozostaje otwarta do odzyskania. Tabela zostanie zamknięta z powodu błędu bezpieczeństwa dopiero po potwierdzeniu tego ostrzeżenia.\n\nDowód zapisany w:\n{1}
