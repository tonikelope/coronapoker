zero_trust.qa_lockdown_fault=Uwierzytelniony stan hosta nie przeszedł weryfikacji kryptograficznej.
zero_trust.session_generated=\u2714\ufe0f [ZERO-TRUST] Nowa sesja wygenerowana i zapisana na dysku.
zero_trust.session_restored=\u2714\ufe0f [ZERO-TRUST] Klucz sesji pomyślnie przywrócony.
zero_trust.timeout=\u274c [ZERO-TRUST] PRZEKRÓT CZASU (WALIDACJA POMIŃCZONA RĘKĄ)
zero_trust.timeout_community_cards=\u274c [ZERO-TRUST] Przekroczono limit czasu oczekiwania na karty wspólne.
zero_trust.verifying_integrity=[ZERO-TRUST] Weryfikacja integralności gry...
