straddle.deferred_release_failed=As cartas blinds straddle não puderam ser reveladas (um jogador desligou-se ou recusou-se a cooperar). A mão foi cancelada.
peer.state_inconsistent=O estado do revendedor tornou-se inconsistente. A mão foi cancelada.
peer.bot_no_token=Um bot não tem a sua chave de desencriptação pronta. A mão foi cancelada.
peer.community_unlock_no_testament=Um jogador desconectou sem deixar a sua chave para revelar cartas comunitárias. A mão foi cancelada.
peer.dropped_during_cascade=Um jogador desconectou-se durante o embaralhamento criptográfico do baralho. A mão foi cancelada.
peer.dropped_during_rotation=Um jogador desconectou-se durante a rotação criptográfica do baralho. A mão foi cancelada.
zero_trust.rotation_refused=Um jogador ligado recusou-se a entregar a sua chave de rotação do baralho. O jogo está interrompido. Precisarão de justificar a sua recusa em serem readmitidos.
zero_trust.cascade_refused=Um jogador ligado recusou-se a participar na cascata de embaralhamento de baralhos. O jogo está interrompido. Precisarão de justificar a sua recusa em serem readmitidos.
zero_trust.pocket_unlock_refused=Um jogador ligado recusou-se a entregar a sua chave para desencriptar cartões de bolso. O jogo está interrompido. Precisarão de justificar a sua recusa em serem readmitidos.
zero_trust.community_unlock_refused=Um jogador ligado recusou-se a entregar a sua chave para revelar cartas comunitárias. O jogo está interrompido. Precisarão de justificar a sua recusa em serem readmitidos.
zero_trust.host_showdown_sig_missing=Foi recebida uma chave showdown do servidor SEM assinatura criptográfica do autor ou com assinatura malformada. O servidor pode estar a substituir a chave na transmissão.
zero_trust.host_showdown_sig_invalid=Foi recebida uma chave showdown do servidor com uma assinatura criptográfica INVÁLIDA. O servidor pode estar a substituir a chave na transmissão.
zero_trust.host_potcards_mismatch=O texto simples showdown enviado pelo servidor NÃO CORRESPONDE ao resultado da desencriptação da sua peça local com a chave assinada. O servidor pode estar a enviar cartões falsos em showdown.
zero_trust.host_community_garbage=Os dados criptográficos da carta comunitária recebidos do servidor são inconsistentes (a peça não é desencriptada numa carta de baralho válida ou não corresponde ao anúncio assinado pelo servidor). Possíveis causas: um BUG em alguma versão do software, uma versão do servidor cujo código pode ter sido alterado ou corrupção da chave de identidade local. O cliente não percebe a diferença e NÃO está a acusar ninguém.
zero_trust.host_unlock_out_of_order=Foi recebida uma solicitação de desencriptação do servidor fora de sequência (rua errada, slot repetido, fase fora de ordem ou pedido emitido antes do fecho da rua anterior).
zero_trust.host_cascade_mid_hand=Foi recebida uma solicitação de reinicialização aleatória do servidor no meio de uma mão em curso (substituiria a minha chave de desencriptação).
zero_trust.host_pocket_extraction=Foi recebida uma solicitação de desencriptação do servidor que afetaria os SEUS PRÓPRIOS cartões privados.
zero_trust.host_community_extraction=Foi recebida uma solicitação de desencriptação do servidor que revelaria um cartão comunitário antecipadamente.
zero_trust.host_rotation_replay=O servidor solicitou uma segunda rotação de cartas na mesma mão. A rotação legítima é única por mão. Uma repetição sugere uma tentativa de utilizar o seu cliente para desencriptar as cartas de outros jogadores.
zero_trust.host_shuffle_proof_failed=A verificação do acordo falhou: não foi possível provar que o baralho que o servidor distribuiu era um embaralhamento honesto do baralho genesis. Os desbloqueios comunitários foram recusados ​​e esta sessão está a ser encerrada para proteger os cartões privados.
zero_trust.host_shuffle_proof_missing=O acordo chegou sem uma prova verificável de embaralhamento honesto para o baralho desta mão, e as cartas comunitárias estão a ser reveladas agora. Pode ser um bug ou um atraso na rede, ou um host a tentar manipular o negócio. Pode continuar a jogar, mas é altamente recomendável sair desta mesa.
zero_trust.deck_unverified=O baralho desta mão NÃO pôde ser verificado como um embaralhamento honesto. SUSPEITO: apresentador "{0}", que trata e transmite a prova de embaralhamento. Pode ser o anfitrião a manipular o acordo ou um jogador que reteve a prova. A mão termina porque as cartas já foram distribuídas.
zero_trust.deck_unverified_body=Foi registada evidência assinada desta anomalia (no registo do jogo, a vermelho, e na mesa de mãos disputadas). Pode continuar a jogar, mas se não confiar no anfitrião, saia da mesa.
zero_trust.seat_redraw=O anfitrião "{0}" forçou um NOVO sorteio de lugares. Isto é INCOMUM: o sorteio é coletivo e verificável, pelo que o anfitrião não pode escolher os lugares, mas PODE voltar a rolar até conseguir um arranjo que lhe agrade. Se isto se repetir, pode ser o anfitrião a tentar manipular o seu assento.
zero_trust.seat_redraw_body=O novo sorteio decorreu da mesma forma e não deixa de ser verificável: ninguém, incluindo o anfitrião, pode escolher o resultado. Pode acontecer se um jogador cair logo no início, mas se vir várias tentativas e não confiar no anfitrião, saia da mesa. Foi registado.
zero_trust.seat_recover_mismatch=Na recuperação do jogo, a ordem de lugar enviada pelo anfitrião "{0}" NÃO corresponde à que o seu cliente guardou: alguém que já conhecia mudou de lugar à mesa. Pode ser um anfitrião a tentar reordenar os lugares sob o pretexto da recuperação.
zero_trust.seat_recover_mismatch_body=O seu cliente manteve a referência de assento que verificou no início. A entrada ou saída de jogadores é normal. Reordenar alguém que já lá estava não existe. Se não confia no anfitrião, saia da mesa. Foi registado.
zero_trust.host_recover_action_forged=O anfitrião tentou injetar uma ação FORGED (assinatura inválida) durante a recuperação do jogo. O seu cliente recusou.
zero_trust.host_recover_action_omitted=Durante a recuperação, o host omitiu uma ação que VOCÊ executou e registou na sua base de dados local. O seu cliente detetou isso na sua própria cópia e NÃO abandonou a sua ação silenciosamente.
zero_trust.host_recover_balance_mismatch=O anfitrião tentou alterar o seu saldo (fichas/entrada) durante a recuperação do jogo: não corresponde ao seu recorde local. O seu cliente manteve o SEU equilíbrio real.
zero_trust.host_board_peek=O anfitrião solicitou a desencriptação de um cartão comunitário de uma rua FUTURA (uma tentativa de ler o tabuleiro antecipadamente). O seu cliente recusou.
zero_trust.suspect_host_prefix=SUSPEITO: anfitrião "{0}".
zero_trust.suspect_peer_prefix=SUSPEITO: jogador "{0}".
zero_trust.peer_alert=⚠️ [COMPORTAMENTO ANOMALOSO DO JOGADOR]
zero_trust.peer_suspicious_header=Comportamento anómalo ou abusivo de um jogador foi detetado na sua mesa:\n
zero_trust.peer_suspicious_body=A mesa aplicou a medida de segurança correspondente e o jogo continua para os restantes jogadores. A boa-fé presume-se. Pode ser um bug de software e ninguém está a ser acusado. A evidência é registada.
zero_trust.peer_inbound_flood=Tráfego autenticado sustentado acima do limite anti-DoS.
zero_trust.peer_binary_flood=Operações de mensagens de voz enviadas a uma taxa excecionalmente elevada.
zero_trust.host_binary_flood=O host está a enviar operações de mensagens de voz a uma taxa invulgarmente elevada.
zero_trust.peer_flood_log=Incidente anti-DoS a aguardar decisão: jogador {0}, IP {1}. Motivo: {2}
zero_trust.peer_flood_confirm=O utilizador {0} está a enviar uma quantidade excessiva de tráfego. Isto pode ser um ataque DoS ou um bug. Expulsá-los do jogo?\n\nIP: {1}\nMotivo detetado: {2}
zero_trust.peer_flood_suppress=Não mostre estes avisos
zero_trust.peer_hand_ready_withheld=Um jogador responde ao PING, mas não confirma que está pronto para a próxima mão enquanto o jogo está a decorrer. Estava a congelar o hand start e foi EXPELIDO. O jogo continua sem eles.
zero_trust.peer_action_withheld=Um jogador responde ao PING mas não envia a sua acção de aposta enquanto o jogo está a decorrer, após o seu tempo de reflexão. Estava a congelar a rodada e foi EXPELIDO. O jogo continua sem eles.
zero_trust.peer_conf_withheld=Um jogador responde ao PING, mas não confirma a receção de uma mensagem de troca enquanto o jogo está a decorrer. Estava a impedir o avanço da mesa e foi EXPELIDO. O jogo continua sem eles.
zero_trust.peer_deal_refusal_expelled=Um jogador forçou vários cancelamentos de mãos consecutivos ao recusar o embaralhamento ou a rotação do baralho. Foi EXPELIDO para que o jogo possa continuar.
zero_trust.suspicious_alert=⚠️ [COMPORTAMENTO ANÓMALO DO SERVIDOR]
zero_trust.suspicious_header=O seu cliente detetou um comportamento anómalo no servidor (não um incidente crítico que congela o jogo):\n
zero_trust.suspicious_body=O seu cliente rejeitou a operação anómala e o jogo PODE continuar. Assumimos boa-fé: pode ser um BUG de software (cliente ou servidor) e ninguém está a ser acusado. Mas como um bug não pode ser diferenciado de uma adulteração, PARA SUA SEGURANÇA É FORTEMENTE RECOMENDADO SAIR desta mesa usando o botão 'Sair' (o seu dinheiro NÃO será processado nesta mão).
zero_trust.host_bad_wire=Foi recebida uma solicitação de desencriptação do servidor com um formato inválido ou pontos que não pertencem à curva criptográfica.
zero_trust.host_critical_command_invalid=O comando crítico {0} enviado pelo servidor não pôde ser validado. Pode ser uma incompatibilidade, um bug ou um servidor modificado. A sessão é interrompida para proteger a sua integridade.
zero_trust.cheater_detected=[ZERO-TRUST] Foi detetado um jogador com uma versão CoronaPoker modificada, sugerindo que pode estar a tentar fazer batota. Quer continuar?
zero_trust.corrupted_mac_action=O Servidor tentou processar uma ação com uma assinatura criptográfica inválida (MAC corrompido) em nome de:
zero_trust.critical=\u274c [ZERO-CONFIANÇA] ALERTA CRÍTICO: ASSINATURA INVÁLIDA OU CONSENSO PARTIDO.
zero_trust.critical_alert_body=ESTADO DE QUARENTENA ATIVADO:\nO seu cliente NÃO enviará mais nenhuma chave criptográfica para o servidor nesta sessão.\nO jogo está matematicamente congelado para proteger o seu saldo.\n\nAs POSSÍVEIS causas são:\n - um BUG no próprio código do cliente,\n - um BUG no código do servidor, ou\n - um SERVIDOR cujo código pode ter sido alterado.\n\nO cliente não consegue distinguir entre eles e NÃO está implícita qualquer acusação. Por segurança, e enquanto se aguarda a análise da causa raiz, é RECOMENDADO que SAIA deste jogo utilizando o botão 'Sair' (o seu dinheiro NÃO será processado nesta mão).
zero_trust.critical_alert_header=INCIDENTE DE CONFIANÇA ZERO!\n\nO seu cliente detetou uma anomalia no protocolo criptográfico:\n
zero_trust.critical_session_error=[ZERO-TRUST] ERRO CRÍTICO DE SESSÃO
zero_trust.decrypting_street=[ZERO-CONFIANÇA] DESCRIPTOGRAFIA DA RUA...
zero_trust.wait_deal=A aguardar as contribuições dos jogadores para baralhar e distribuir as cartas.
zero_trust.wait_shuffle_proof=A aguardar a prova criptográfica do baralhamento.
zero_trust.wait_sra_unlock=A aguardar as chaves SRA para revelar {0}.
game.settlement_verification_wait=A aguardar os comprovativos para verificar a mão e confirmar os saldos.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [ZERO-TRUST] Tempo limite rápido de consenso. Forçando o avanço.
zero_trust.forged_identity_action=O Servidor tentou processar uma ação com uma assinatura de identidade forjada em nome de:
