tooltip.cfg.custom_bots=Activa o catálogo personalizado. Os perfis configurados são adicionados em primeiro lugar, seguidos pelos bots padrão.
tooltip.cfg.custom_bots.only=Impede a adição de bots padrão. Não será possível adicionar mais bots depois de o catálogo personalizado se esgotar.
tooltip.cfg.custom_bots.manage=Abra o gestor para criar, editar e ordenar os seus bots. Pode escolher a sua dificuldade e estilo.
tooltip.cfg.custom_bots.row=Selecione este bot para editar o seu nome, avatar, dificuldade, estilo ou recompra.
tooltip.cfg.custom_bots.avatar=Escolha uma imagem válida ou mantenha o avatar oficial do bot. CoronaPoker armazena uma cópia segura para que não se perca.
tooltip.cfg.custom_bots.name=Introduza o nome visível sem $. O marcador reservado é adicionado automaticamente.
tooltip.cfg.custom_bots.difficulty=Define o desafio e as táticas que o bot utiliza. Easy joga de forma recreativa, Normal utiliza uma estratégia mais disciplinada e Hard utiliza táticas avançadas.
tooltip.cfg.custom_bots.personality=Define o estilo base. O Random seleciona-o quando o bot é criado e mantém-no durante a sessão ativa. O bot pode adaptar as suas decisões à situação.
gdx.settings.option_help.bot_difficulty.easy=Joga casualmente e comete erros com mais frequência.
gdx.settings.option_help.bot_difficulty.medium=Utiliza uma estratégia mais disciplinada e ajusta as decisões à medida que a mão se desenvolve.
gdx.settings.option_help.bot_difficulty.hard=Utiliza táticas mais avançadas, como roubar blinds ou aplicar pressão quando um adversário parece vulnerável.
gdx.settings.option_help.custom_bot_personality.random=Escolhe um estilo quando o bot é criado e mantém-no durante a sessão ativa.
gdx.settings.option_help.custom_bot_personality.nit=Entra em poucas mãos e geralmente espera por cartas fortes antes de arriscar fichas.
gdx.settings.option_help.custom_bot_personality.station=Tende a pagar as apostas e a permanecer na mão. Aumenta com menos frequência.
gdx.settings.option_help.custom_bot_personality.tag=Escolhe as mãos seletivamente e tende a assumir a liderança com apostas e aumentos.
gdx.settings.option_help.custom_bot_personality.lag=Joga uma gama mais ampla de mãos e aplica pressão com apostas e aumentos frequentes.
gdx.settings.option_help.ante_mode.traditional=Cada jogador ativo regista um décimo de big blind, arredondado para o cêntimo mais próximo.
gdx.settings.option_help.ante_mode.big_blind=O jogador em big blind coloca o ante inteiro, igual a um big blind.
gdx.settings.option_help.ante_mode.button=O jogador no botão coloca o ante inteiro, igual a um big blind.
gdx.settings.option_help.ante_mode.small_blind=O jogador em small blind coloca o ante inteiro, igual a um big blind.
gdx.settings.option_help.rebuy_cap.buy_in=O seu stack máximo após recompra é baseado no entrada do jogo.
gdx.settings.option_help.rebuy_cap.highest_stack=Recompra até à maior pilha da mesa. O limite nunca está abaixo do padrão entrada.
