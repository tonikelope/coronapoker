game.popup_verificacion_firma_invalida=Durante esta mão, um ou mais participantes ({0}) detetaram uma assinatura criptográfica inválida numa ação.\n\nOs dados recebidos por todos os participantes foram consistentes (os hashes da cadeia final corresponderam), mas pelo menos uma ação não foi devidamente assinada pelo seu autor esperado.\n\nCoronaPoker interrompeu o fecho seguro da mão e fechará a mesa como uma falha de segurança após este aviso ser reconhecido.\n\nEvidência guardada em:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Aviso: {0} não recebeu a prova de embaralhamento honesto para esta mão. Evidência: {1}
game.popup_verificacion_host_sin_prueba=Um ou mais participantes ({0}) não receberam a prova de embaralhamento honesto para esta mão.\n\nOs hashes da cadeia final correspondem a todos os participantes, pelo que as ações das mãos são consistentes. Um host correto envia sempre esta prova, pelo que uma ausência repetida ou seletiva de pares pode indicar software modificado ou defeito de software.\n\nA mão foi resolvida, mas recomenda-se abandonar o jogo por precaução.\n\nEvidência guardada em:\n{1}
game.popup_verificacion_titulo_alerta=Divergência de verificação criptográfica
game.popup_verificacion_titulo_aviso=Verificação criptográfica incompleta
game.popup_verificacion_divergente=Um ou mais participantes relataram uma verificação criptográfica diferente do estado final da mão.\n\nIsto pode ser causado por software modificado ou por um defeito de software. CoronaPoker não pode determinar automaticamente a causa ou quem o originou.\n\nCoronaPoker interrompeu o fecho seguro da mão e fechará a mesa como uma falha de segurança após este aviso ser reconhecido.\n\nEvidência guardada em:\n{0}
game.popup_verificacion_ausente=A última mão não conseguiu chegar a consenso porque o jogador {0} não enviou uma assinatura de fecho.\n\nIsto pode ser causado por uma interrupção na rede, uma falha no cliente ou software modificado. CoronaPoker interrompeu o fecho manual seguro e fechará a mesa como uma falha de segurança após este aviso ser reconhecido.\n\nEvidência guardada em:\n{1}
game.mano_verificacion_interrumpida=CRÍTICO: Falha no fecho seguro da mão ({0}). A tabela será encerrada devido a uma falha de segurança. Evidência: {1}
game.popup_verificacion_interrumpida=CoronaPoker não conseguiu completar o protocolo de fecho criptográfico da última mão.\n\nFalha: {0}\n\nA mão permanece aberta para recuperação. A tabela será fechada como uma falha de segurança apenas após este aviso ser reconhecido.\n\nEvidência guardada em:\n{1}
