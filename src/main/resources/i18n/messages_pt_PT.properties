zero_trust.generating_kem=[ZERO-CONFIANÇA] GERANDO KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ALERTA DE CONFIANÇA ZERO] MAC inválido em cartões comunitários. Possível manipulação.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-CONFIANÇA] VERIFICAÇÃO CRIPTOGRÁFICA DE CONSENSO: TODOS OS JOGADORES FORAM CERTIFICADOS PASSANDO A VERIFICAÇÃO CRIPTOGRÁFICA LOCAL.
zero_trust.legit2_error=\u274c [ZERO-CONFIANÇA] VERIFICAÇÃO CRIPTOGRÁFICA DE CONSENSO: PELO MENOS UM JOGADOR NÃO FOI CERTIFICADO PASSANDO A VERIFICAÇÃO CRIPTOGRÁFICA LOCAL.
zero_trust.legit=\u2714\ufe0f [ZERO-CONFIANÇA] VERIFICAÇÃO CRIPTOGRÁFICA LOCAL: OS MEUS CARTÕES, CARTÕES COMUNITÁRIOS E TODAS AS AÇÕES REGISTADAS SÃO LEGÍTIMAS.
zero_trust.legit_error=\u274c [ZERO-CONFIANÇA] VERIFICAÇÃO CRIPTOGRÁFICA LOCAL: NÃO É POSSÍVEL GARANTIR QUE OS MEUS CARTÕES, CARTÕES COMUNITÁRIOS E TODAS AS AÇÕES REGISTADAS SÃO LEGÍTIMAS.
zero_trust.lockdown_activated=\ud83d\udd12 [LOCKDOWN] Quarentena ativada. Bloqueio da transmissão de chaves criptográficas.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Sem registo binário anterior para esta mão.
zero_trust.p2p_auditing_memory=[ZERO-CONFIANÇA] P2P: AUDITORIA DE MEMÓRIA...
