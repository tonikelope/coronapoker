tooltip.cfg.ante=Adiciona uma contribuição forçada ao pote após blinds. A modalidade define quem paga e quanto.
tooltip.cfg.ante_mode=No modo Tradicional, cada jogador ativo paga 10% dos big blind. No BBA, BA ou SBA, o big blind, botão ou small blind paga um big blind. Blinds são publicados em primeiro lugar.
tooltip.cfg.blind_cap=Os stops blinds aumentam no limite configurado.
tooltip.cfg.blinds_level=Começando blinds (pequeno/grande) para o jogo.
tooltip.cfg.bot_balance=Quando o jogo termina, o saldo combinado dos bots é dividido igualmente entre os jogadores humanos, pelo que o dinheiro real é liquidado apenas entre as pessoas.
tooltip.cfg.bot_rebuy=Controlo global automático recompra para cada bot. Desligá-lo também desativa as definições recompra dos bots personalizados.
tooltip.cfg.bots=Define a dificuldade dos bots padrão. Os bots personalizados mantêm a dificuldade configurada individualmente no Bot Manager.
tooltip.cfg.buyin_fixed=Todos começam com o mesmo entrada. Quando desativado, os jogadores escolhem dentro do intervalo configurado.
tooltip.cfg.double_blinds=Avança para o nível seguinte blinds na estrutura após um determinado número de mãos ou minutos.
tooltip.cfg.hand_limit=O jogo termina quando esta contagem de mãos é atingida.
tooltip.cfg.iwtsth=Permite pedir para ver a mão de um rival a showdown.
tooltip.cfg.rabbit=Revela cartas comunitárias não distribuídas após a mão. O primeiro pedido de cada jogador é gratuito. O modo escolhido define se os pedidos posteriores permanecerão gratuitos ou se custarão um pequeno ou big blind.
tooltip.cfg.rebuy_limit=Máximo de recompras por jogador.
tooltip.cfg.recover=Retoma um jogo que foi interrompido anteriormente.
tooltip.cfg.rit=Permite uma votação para distribuir as cartas restantes duas vezes quando um All-in termina as apostas.
tooltip.cfg.straddle=O jogador após o big blind pode lançar dois big blind antes de ver as suas cartas e agir em último lugar no pré-flop.
tooltip.cfg.straddle_on_timeout=Publique o straddle automaticamente quando o aviso expirar. Isto afeta apenas o seu leitor e está desativado por defeito.
tooltip.cfg.structure=Estrutura de níveis Blinds para o jogo.
tooltip.cfg.think_time=Segundos disponíveis para decidir. A ação automática é executada quando o tempo expira.
tooltip.cfg.showdown_time=Segundos, o resultado da mão permanece no ecrã antes da próxima mão ser distribuída.
tooltip.cfg.allow_hot_join=Permite que os novos jogadores entrem como WARMING UP e entrem na mão seguinte. Quando alterado durante um jogo, apenas afeta novas tentativas de ligação.
tooltip.cfg.card_flip_duration=Define quanto tempo demora cada carta a completar o seu turno quando revelada.
tooltip.cfg.card_flip_direction=Escolhe para que lado ficam as cartas quando reveladas. Misto seleciona uma direção para cada revelação. As cartas do mesmo grupo rodam juntas da mesma forma.
tooltip.cfg.reparto_velocidad=Define quanto tempo demora cada carta a viajar do baralho até ao seu lugar.
tooltip.cfg.community_deal_style=Escolha se todas as cinco cartas comunitárias serão distribuídas viradas para baixo no início ou na sua própria rua. As alterações guardadas serão aplicadas na próxima mão.
tooltip.cfg.anim_calidad=A qualidade mantém todos os detalhes visuais. O desempenho reduz o custo dos voos de cartão e das revelações em computadores mais fracos.
tooltip.cfg.downgrade_velocidad=Define quanto tempo a mesa demora a reorganizar os seus lugares quando um jogador sai.
tooltip.cfg.swap_velocidad=Define quanto tempo os seus cartões demoram a cruzar quando classificados.
tooltip.cfg.swap_estilo=Arc levanta uma carta acima da outra. Horizontal cruza-os à mesma altura.
