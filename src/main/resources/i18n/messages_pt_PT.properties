game.showdown_forfeit_msg=AVISO: showdown verificação falhou para o(s) seguinte(s) jogador(es) e as suas cartas NÃO serão reveladas:\n\n%nicks%\n\nEstes jogadores são excluídos da resistência showdown (auto-fold) e NÃO PODEM ganhar este pote. O jogo continua normalmente.
zero_trust.peer_sra_corrupt=A assinatura showdown é genuína, mas a chave SRA do par não resolve os cartões válidos. Isto só acontece se o par tiver assinado intencionalmente uma chave corrompida ou se o cliente estiver com erros. Não podemos dizer qual e, por segurança, terminámos o jogo.
zero_trust.straddle_recover_mismatch=Ao recuperar a mão, o anfitrião anunciou um straddle diferente daquele que a sua cópia local tinha gravado. Isto só acontece se o host adulterar o straddle recuperado ou se o seu cliente estiver com erros. A mão ainda foi reconstruída a partir da sua cópia fidedigna, mas avisamos por precaução.
zero_trust.rit_recover_mismatch=Ao recuperar a mão, o anfitrião anunciou um resultado de execução duas vezes diferente daquele que a sua própria cópia local tinha registado. Isto só acontece se o host adulterar o resultado recuperado ou se o seu cliente estiver com erros. A mão ainda foi reconstruída a partir da sua cópia fidedigna, mas avisamos por precaução.
zero_trust.peer_sra_corrupt_registro=\u2014 showdown chave assinada mas não resolve para cartões. Possível cheat ou bug do cliente.
