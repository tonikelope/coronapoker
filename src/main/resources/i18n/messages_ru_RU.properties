zero_trust.unlock_failed=\u274c [НУЛЕВОЕ ДОВЕРИЕ] Не удалось разблокировать личные карты (игрок не ответил вовремя). Раздача отменена.
zero_trust.card_resolve_failed=\u274c [НУЛЕВОЕ ДОВЕРИЕ] Расшифрованная карта не соответствует ни одной действительной карте в колоде. Игра отменена.
peer.not_enough_players=Игрок выпал во время перетасовки, и игроков для раздачи больше не хватает.
peer.unlock_no_testament=Игрок отключился, не оставив ключ расшифровки. Раздача отменена.
peer.broadcast_failed=Ошибка сети при рассылке личных карт. Раздача отменена.
peer.recovery_action_data_unavailable=Сохраненную историю действий невозможно прочитать. Раздача была благополучно отменена и будет восстановлена.
straddle.deferred_release_failed=Карты блайнды страддл не удалось раскрыть (игрок отключился или отказался сотрудничать). Раздача отменена.
peer.state_inconsistent=Состояние дилера стало противоречивым. Раздача отменена.
peer.bot_no_token=У бота нет готового ключа расшифровки. Раздача отменена.
peer.community_unlock_no_testament=Игрок отключился, не оставив ключ, чтобы раскрыть общие карты. Раздача отменена.
peer.dropped_during_cascade=Игрок отключился во время криптографического перемешивания колоды. Раздача отменена.
peer.dropped_during_rotation=Игрок отключился во время криптографической ротации колоды. Раздача отменена.
zero_trust.rotation_refused=Подключенный игрок отказался предоставить ключ для ротации колоды. Игра остановлена. Им придется обосновать свой отказ в повторном приеме.
zero_trust.cascade_refused=Подключенный игрок отказался принимать участие в каскаде тасования колод. Игра остановлена. Им придется обосновать свой отказ в повторном приеме.
zero_trust.pocket_unlock_refused=Подключенный игрок отказался предоставить ключ для расшифровки карманных карт. Игра остановлена. Им придется обосновать свой отказ в повторном приеме.
zero_trust.community_unlock_refused=Подключенный игрок отказался передать ключ для раскрытия общих карт. Игра остановлена. Им придется обосновать свой отказ в повторном приеме.
zero_trust.host_showdown_sig_missing=С сервера получен ключ вскрытие БЕЗ криптографической подписи автора или с некорректной подписью. Возможно, сервер подменяет ключ по проводу.
zero_trust.host_showdown_sig_invalid=От сервера получен ключ вскрытие с НЕДЕЙСТВИТЕЛЬНОЙ криптографической подписью. Возможно, сервер подменяет ключ по проводу.
zero_trust.host_potcards_mismatch=Открытый текст вскрытие, отправленный сервером, НЕ СООТВЕТСТВУЕТ результату расшифровки вашего локального фрагмента с помощью подписанного ключа. Возможно, сервер отправляет поддельные карты в вскрытие.
zero_trust.host_community_garbage=Криптографические данные общей карты, полученные с сервера, противоречивы (часть не расшифровывается до действительной карты колоды или не соответствует подписанному объявлению сервера). Возможные причины: ОШИБКА в какой-либо версии программного обеспечения, версия сервера, код которой мог быть изменен, или повреждение локального идентификационного ключа. Клиент не может заметить разницу и НЕ обвиняет никого.
zero_trust.host_unlock_out_of_order=Запрос на расшифровку получен от сервера вне последовательности (неправильная улица, повторяющийся слот, нарушение порядка фазы или запрос, отправленный до закрытия предыдущей улицы).
zero_trust.host_cascade_mid_hand=Запрос на перезапуск в случайном порядке был получен от сервера в середине текущей раздачи (это приведет к перезаписи моего ключа дешифрования).
zero_trust.host_pocket_extraction=С сервера получен запрос на расшифровку, который может повлиять на ВАШИ СОБСТВЕННЫЕ личные карты.
zero_trust.host_community_extraction=С сервера был получен запрос на расшифровку, который позволит заранее раскрыть общую карту.
zero_trust.host_rotation_replay=Сервер запросил вторую ротацию карты в той же раздаче. Законная ротация уникальна для каждой руки. Повтор предполагает попытку использовать ваш клиент для расшифровки карт других игроков.
zero_trust.host_shuffle_proof_failed=Проверка сделки не удалась: не удалось доказать, что колода, которую сдал сервер, является честной перетасовкой колоды Бытия. В разблокировке сообщества было отказано, и этот сеанс прекращается в целях защиты личных карт.
zero_trust.host_shuffle_proof_missing=Сделка состоялась без поддающегося проверке доказательства честного тасования колоды этой руки, и сейчас раскрываются общие карты. Это может быть ошибка, задержка в сети или хост, пытающийся манипулировать сделкой. Вы можете продолжать играть, но настоятельно рекомендуется покинуть этот стол.
zero_trust.deck_unverified=Колода этой руки НЕ может быть проверена как честная тасовка. ПОДОЗРЕВАЕМЫЙ: ведущий "{0}", который раздает и транслирует доказательство тасования. Это может быть хозяин, манипулирующий сделкой, или игрок, который скрыл свои доказательства. Раздача разыгрывается, поскольку карты уже разданы.
zero_trust.deck_unverified_body=Зарегистрированы подписанные доказательства этой аномалии (в журнале игры, красным цветом и в таблице спорных рук). Вы можете продолжать играть, но если не доверяете ведущему, покиньте стол.
zero_trust.seat_redraw=Ведущий "{0}" форсировал розыгрыш НОВЫХ мест. Это НЕОБЫЧНО: жеребьевка является коллективной и проверяемой, поэтому ведущий не может выбирать места, но МОЖЕТ перебрасывать результаты, пока не получит желаемое расположение. Если это повторяется, возможно, хозяин пытается настроить ваше сиденье.
zero_trust.seat_redraw_body=Новый розыгрыш прошел по той же схеме, и его все еще можно проверить: никто, включая хозяина, не может выбрать результат. Это может случиться, если игрок упал в самом начале, но если вы видите несколько повторов и не доверяете хосту, покиньте стол. Это было зарегистрировано.
zero_trust.seat_recover_mismatch=При восстановлении игры порядок рассадки, отправленный хостом «{0}», НЕ соответствует тому, который сохранил ваш клиент: кто-то, кого вы уже знали, поменял место за столом. Это может быть хост, пытающийся переупорядочить места под прикрытием рекавери.
zero_trust.seat_recover_mismatch_body=Ваш клиент сохранил ссылку на место, которую он проверил в самом начале. Присоединение или уход игроков между ними является нормальным. Переупорядочивать того, кто уже был, нет. Если вы не доверяете ведущему, покиньте стол. Это было зарегистрировано.
zero_trust.host_recover_action_forged=Хост попытался внедрить действие FORGED (неверная подпись) во время восстановления игры. Ваш клиент отказался.
zero_trust.host_recover_action_omitted=Во время восстановления хост пропустил действие, которое ВЫ выполнили и которое было записано в вашей локальной базе данных. Ваш клиент обнаружил это в своей собственной копии и НЕ прекратил ваше действие молча.
zero_trust.host_recover_balance_mismatch=Хост попытался изменить ваш баланс (фишки/бай-ин) во время восстановления игры: он не соответствует вашей локальной записи. Ваш клиент сохранил ВАШ реальный баланс.
zero_trust.host_board_peek=Ведущий запросил расшифровку общей карты с улицы БУДУЩЕГО (попытка прочитать доску раньше). Ваш клиент отказался.
zero_trust.suspect_host_prefix=ПОДОЗРЕВАЕМЫЙ: хост "{0}".
zero_trust.suspect_peer_prefix=ПОДОЗРЕВАЕМЫЙ: игрок «{0}».
zero_trust.peer_alert=⚠️ [АНОМАЛЬНОЕ ПОВЕДЕНИЕ ИГРОКОВ]
zero_trust.peer_suspicious_header=За вашим столом обнаружено аномальное или оскорбительное поведение игрока:\n
zero_trust.peer_suspicious_body=К столу применены соответствующие меры безопасности, и игра продолжается для остальных игроков. Добросовестность предполагается. Это может быть программная ошибка, и никто не обвиняется. Доказательства зафиксированы.
zero_trust.peer_inbound_flood=Устойчивый аутентифицированный трафик выше порога защиты от DoS.
zero_trust.peer_binary_flood=Голосовые сообщения отправляются с необычно высокой скоростью.
zero_trust.host_binary_flood=Хост отправляет голосовые сообщения с необычно высокой скоростью.
zero_trust.peer_flood_log=Анти-DoS-инцидент ожидает решения: игрок {0}, IP {1}. Причина: {2}
zero_trust.peer_flood_confirm=Пользователь {0} отправляет чрезмерный объем трафика. Это может быть DoS-атака или ошибка. Выгнать их из игры?\n\nIP: {1}\nОбнаруженная причина: {2}
zero_trust.peer_flood_suppress=Не показывать эти предупреждения
zero_trust.peer_hand_ready_withheld=Игрок отвечает на PING, но не подтверждает готовность к следующей раздаче во время игры. Он заморозил старт руки и был ОТКЛЮЧЕН. Игра продолжается без них.
zero_trust.peer_action_withheld=Игрок отвечает на PING, но не отправляет свое действие по ставке во время игры, по истечении времени размышления. Он заморозил раунд и был ИСКЛЮЧЕН. Игра продолжается без них.
zero_trust.peer_conf_withheld=Игрок отвечает на PING, но не подтверждает получение сообщения о раздаче во время игры. Он блокировал продвижение стола и был УДАЛЕН. Игра продолжается без них.
zero_trust.peer_deal_refusal_expelled=Игрок принудительно отменил несколько раздач подряд, отказавшись от перетасовки или ротации колоды. Он был УДАЛЕН, поэтому игра может продолжаться.
zero_trust.suspicious_alert=⚠️ [АНОМАЛЬНОЕ ПОВЕДЕНИЕ СЕРВЕРА]
zero_trust.suspicious_header=Ваш клиент обнаружил аномальное поведение сервера (не критический инцидент, приводящий к зависанию игры):\n
zero_trust.suspicious_body=Ваш клиент отклонил аномальную операцию, и игра МОЖЕТ продолжаться. Мы предполагаем добросовестно: это может быть ОШИБКА программного обеспечения (клиента или сервера), и никто не обвиняется. Но поскольку ошибку невозможно отличить от взлома, ДЛЯ ВАШЕЙ БЕЗОПАСНОСТИ НАСТОЯТЕЛЬНО РЕКОМЕНДУЕТСЯ ПОКИНИТЬ этот стол с помощью кнопки «Покинуть» (ваши деньги НЕ будут обработаны в этой раздаче).
zero_trust.host_bad_wire=От сервера получен запрос на расшифровку с неверным форматом или точками, не принадлежащими криптографической кривой.
zero_trust.host_critical_command_invalid=Критическая команда {0}, отправленная сервером, не может быть проверена. Это может быть несовместимость, ошибка или модифицированный сервер. Сеанс останавливается для защиты его целостности.
zero_trust.cheater_detected=[НУЛЕВОЕ ДОВЕРИЕ] Обнаружен игрок с модифицированной версией CoronaPoker, что позволяет предположить, что он пытается жульничать. Хотите продолжить?
zero_trust.corrupted_mac_action=Сервер попытался обработать действие с недействительной криптографической подписью (поврежденный MAC) от имени:
zero_trust.critical=\u274c [НУЛЕВОЕ ДОВЕРИЕ] КРИТИЧЕСКОЕ ПРЕДУПРЕЖДЕНИЕ: НЕДЕЙСТВИТЕЛЬНАЯ ПОДПИСЬ ИЛИ НАРУШЕННЫЙ КОНСЕНСУС.
zero_trust.critical_alert_body=СОСТОЯНИЕ КАРАНТИНА АКТИВИРОВАНО:\nВаш клиент НЕ БУДЕТ больше отправлять криптографические ключи на сервер в этом сеансе.\nДля защиты вашего баланса игра математически заморожена.\n\nВОЗМОЖНЫЕ причины:\n - ОШИБКА в самом клиентском коде, \n - ОШИБКА в коде клиента. код сервера, или\n - СЕРВЕР, код которого мог быть изменен.\n\nКлиент не может различить их, и НИКАКИХ обвинений не подразумевается. В целях безопасности и до рассмотрения основной причины РЕКОМЕНДУЕТСЯ ВЫЙТИ из игры, нажав кнопку «Выход» (ваши деньги НЕ будут обработаны в этой раздаче).
zero_trust.critical_alert_header=ИНЦИДЕНТ НУЛЕВОГО ДОВЕРИЯ!\n\nВаш клиент обнаружил аномалию в криптографическом протоколе:\n
zero_trust.critical_session_error=[НУЛЕВОЕ ДОВЕРИЕ] КРИТИЧЕСКАЯ ОШИБКА СЕАНСА
zero_trust.decrypting_street=[НУЛЕВОЕ ДОВЕРИЕ] ДЕШИФРОВАНИЕ УЛИЦЫ...
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] Тайм-аут быстрого консенсуса. Принуждение к продвижению.
zero_trust.forged_identity_action=Сервер попытался обработать действие с поддельной идентификационной подписью от имени:
zero_trust.game_aborted=[НУЛЕВОЕ ДОВЕРИЕ] Игра прервана. Выгнать мошенников.
zero_trust.generating_kem=[НУЛЕВОЕ ДОВЕРИЕ] ГЕНЕРИРУЕМ KEM (P2P)...
zero_trust.invalid_mac=\u26a0\ufe0f [ПРЕДУПРЕЖДЕНИЕ О НУЛЕВОМ ДОВЕРИИ] Неверный MAC-адрес на общих картах. Возможные манипуляции.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] КОНСЕНСУСНАЯ КРИПТОГРАФИЧЕСКАЯ ПРОВЕРКА: ВСЕ ИГРОКИ ПОДТВЕРЖДАЮТ ПРОХОЖДЕНИЕ ЛОКАЛЬНОЙ РУЧНОЙ КРИПТОГРАФИЧЕСКОЙ ПРОВЕРКИ.
zero_trust.legit2_error=\u274c [НУЛЕВОЕ ДОВЕРИЕ] КОНСЕНСУСНАЯ КРИПТОГРАФИЧЕСКАЯ ПРОВЕРКА: ПО крайней мере один игрок не подтвердил прохождение локальной ручной криптографической проверки.
zero_trust.legit=\u2714\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] ЛОКАЛЬНАЯ РУЧНАЯ КРИПТОГРАФИЧЕСКАЯ ПРОВЕРКА: МОИ КАРТЫ, КАРТЫ СООБЩЕСТВА И ВСЕ ЗАПИСАННЫЕ ДЕЙСТВИЯ ЯВЛЯЮТСЯ ЗАКОННЫМИ.
zero_trust.legit_error=\u274c [НУЛЕВОЕ ДОВЕРИЕ] ЛОКАЛЬНАЯ РУЧНАЯ КРИПТОГРАФИЧЕСКАЯ ПРОВЕРКА: НЕ МОГУ УБЕДИТЬСЯ, ЧТО МОИ КАРТЫ, КАРТЫ СООБЩЕСТВА И ВСЕ ЗАПИСАННЫЕ ДЕЙСТВИЯ ЯВЛЯЮТСЯ ЗАКОННЫМИ.
zero_trust.lockdown_activated=\ud83d\udd12 [БЛОКИРОВКА] Карантин активирован. Блокировка передачи криптографических ключей.
zero_trust.no_binary_log=\u26a0\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] Для этой раздачи нет предыдущего двоичного журнала.
zero_trust.p2p_auditing_memory=[НУЛЕВОЕ ДОВЕРИЕ] P2P: ПРОВЕРКА ПАМЯТИ...
zero_trust.p2p_cheater_detected2=[НУЛЕВОЕ ДОВЕРИЕ] Обнаружен игрок с модифицированной версией CoronaPoker, что позволяет предположить, что он пытается жульничать.
zero_trust.p2p_finished_resuming=Проверка P2P KEM завершена. Возобновление раздачи...
zero_trust.p2p_generating_challenges=[НУЛЕВОЕ ДОВЕРИЕ] P2P: ПОРОЖДАЕМ ПРОБЛЕМЫ…
zero_trust.p2p_timeout=Таймаут P2P Swarm! Некоторые игроки были отмечены как ненадежные.
zero_trust.p2p_verifying_signatures=[НУЛЕВОЕ ДОВЕРИЕ] P2P: ПРОВЕРКА ПОДПИСИ...
zero_trust.read_binary_log_failure=[ZERO-TRUST] Не удалось прочитать двоичный журнал.
zero_trust.rejecting_master_key=\ud83d\udd12 [LOKDOWN] Отказ в передаче общего доступа к главному ключу на сервер.
zero_trust.rejecting_street_token=\ud83d\udd12 [LOCKDOWN] Отказ от запроса Street Token с сервера.
zero_trust.replay_queue_synced=\u2714\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] Очередь воспроизведения синхронизирована (подписи {0}).
zero_trust.security_alert=\u26a0\ufe0f [ПРЕДУПРЕЖДЕНИЕ БЕЗОПАСНОСТИ]
zero_trust.evidence_location=Доказательства нулевого доверия: {0}
zero_trust.fatal_incident_title=ИНЦИДЕНТ НУЛЕВОГО ДОВЕРИЯ
zero_trust.fatal_incident_body=CoronaPoker отклонил критическое состояние аутентификации и остановил таблицу, прежде чем продолжить. Подтвердите это предупреждение, чтобы закрыть соответствующую таблицу.\n\nСвидетельство нулевого доверия: {0}
zero_trust.qa_pre_settlement_fault=Криптографическая сделка была отклонена до урегулирования.
zero_trust.qa_lockdown_fault=Состояние аутентифицированного хоста не прошло криптографическую проверку.
zero_trust.session_generated=\u2714\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] Новый сеанс создан и сохранен на диске.
zero_trust.session_restored=\u2714\ufe0f [НУЛЕВОЕ ДОВЕРИЕ] Ключ сеанса успешно восстановлен.
zero_trust.timeout=\u274c ТАЙМ-АУТ [НУЛЕВОГО ДОВЕРИЯ] (ПРПУСКАЕМАЯ ПРОВЕРКА РУЧКИ)
