game.recover_accion_ausencia=⚠ Обратите внимание: организатор воспроизвел действия позже, чем ваше последнее записанное действие, вероятно, сыгранное, когда вы были вне раздачи. Они не могут быть проверены и принимаются в том виде, в каком их отправил хост.
game.mano_verificacion_divergente=⚠РАСХОЖДЕНИЕ КРИПТОГРАФИЧЕСКОЙ ВЕРИФИКАЦИИ. Один или несколько участников сообщили о другом конечном состоянии руки. Доказательства: {0}
game.mano_verificacion_jugador_ausente=⚠ Обратите внимание: {0} не отправила закрывающую подпись. Надежное закрытие руки было остановлено. Доказательства: {1}
game.mano_verificacion_firma_invalida=⚠ Примечание: {0} обнаружил недействительную криптографическую подпись во время этой раздачи. Надежное закрытие было остановлено. Доказательства: {1}
game.popup_verificacion_firma_invalida=Во время этой раздачи один или несколько участников ({0}) обнаружили недействительную криптографическую подпись для действия.\n\nДанные, полученные всеми участниками, были согласованными (конечные хэши цепочки совпадали), но по крайней мере одно действие не было должным образом подписано его ожидаемым автором.\n\nCoronaPoker прекратил безопасное закрытие раздачи и закроет стол из-за сбоя безопасности после появления этого предупреждения. подтверждено.\n\nДоказательства сохранены в:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Обратите внимание: {0} не получило доказательство честного тасования для этой руки. Доказательства: {1}
game.popup_verificacion_host_sin_prueba=Один или несколько участников ({0}) не получили доказательство честного тасования для этой руки.\n\nОкончательные хеши цепочки совпадают у всех участников, поэтому действия рук согласованы. Правильный хост всегда отправляет это доказательство, поэтому повторное или выборочное отсутствие может указывать на модифицированное программное обеспечение или дефект программного обеспечения.\n\nРаздача решена, но в качестве меры предосторожности рекомендуется выйти из игры.\n\nДоказательства сохранены в:\n{1}
game.popup_verificacion_titulo_alerta=Расхождение в криптографической проверке
game.popup_verificacion_titulo_aviso=Криптографическая проверка не завершена
game.popup_verificacion_divergente=Один или несколько участников сообщили о другой криптографической проверке конечного состояния руки.\n\nЭто может быть вызвано модифицированным программным обеспечением или дефектом программного обеспечения. CoronaPoker не может автоматически определить причину или того, кто ее инициировал.\n\nCoronaPoker прекратил безопасное закрытие руки и закроет стол как сбой в системе безопасности после подтверждения этого предупреждения.\n\nДоказательства сохранены в:\n{0}
game.popup_verificacion_ausente=В последней раздаче не удалось достичь консенсуса, поскольку игрок {0} не отправил закрывающую подпись. \n\nЭто может быть вызвано сбоем сети, сбоем клиента или изменением программного обеспечения. CoronaPoker остановлено безопасное закрытие рукой и закроет стол как сбой в системе безопасности после подтверждения этого предупреждения.\n\nДоказательства сохранены в:\n{1}
game.mano_verificacion_interrumpida=КРИТИЧЕСКОЕ: Не удалось надежно закрыть руку ({0}). Стол закроется из-за сбоя безопасности. Доказательства: {1}
game.popup_verificacion_interrumpida=CoronaPoker не удалось завершить протокол криптографического закрытия для последней руки.\n\nСбой: {0}\n\nРука остается открытой для восстановления. Таблица закроется из-за сбоя безопасности только после подтверждения этого предупреждения.\n\nДоказательства сохранены в:\n{1}
