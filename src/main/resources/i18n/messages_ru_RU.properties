gdx.settings.tooltip.table_chat_feed=Показывает чат и уведомления об играх над столом. Быстрый чат сохраняет полную историю.
gdx.settings.tooltip.table_speaking_emoji=Показывает желтый смайлик над динамиком во время преобразования текста в речь и голосовых заметок, включая ваши собственные.
gdx.settings.tooltip.chat_images=Позволяет отправлять изображения со стола и отображать полученные изображения над отправившим их игроком.
gdx.settings.tooltip.animations_master=Главный переключатель анимации, эффектов, видеороликов и видеоплеера покера.
gdx.settings.option.mostrar_videos_poker=Видео о покере
gdx.settings.tooltip.poker_videos=Показывает игрока в главном меню, лобби и за столом. Он закрывается при запуске игры, и его можно открыть повторно с помощью значка.
gdx.settings.tooltip.halo_effects=Управляет поворотом, опасностью и победителем светится вокруг сиденья.
gdx.settings.tooltip.modal_blur=Размывает фон за модальными диалогами и уведомлениями.
gdx.settings.tooltip.glass_effects=Управляет декоративным блеском и глубиной кнопок и элементов управления.
gdx.settings.tooltip.cinematics_master=Включает или отключает последовательности ОЛЛ-ИН и GAME OVER.
