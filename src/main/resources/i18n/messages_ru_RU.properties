tooltip.cfg.ante=Добавляет обязательный вклад в банк после блайнды. Режим устанавливает, кто и сколько платит.
tooltip.cfg.ante_mode=В традиционном режиме каждый активный игрок платит 10% от большой блайнд. В BBA, BA или SBA кнопка большой блайнд или малый блайнд приносит один большой блайнд. Блайнды публикуются первыми.
tooltip.cfg.blind_cap=Остановка блайнды увеличивается при установленном пределе.
tooltip.cfg.blinds_level=Начало игры с блайнды (маленькое/большое).
tooltip.cfg.bot_balance=Когда игра заканчивается, совокупный баланс ботов делится поровну между игроками-людьми, поэтому реальные деньги распределяются только между людьми.
tooltip.cfg.bot_rebuy=Глобальный автоматический контроль ребай для каждого бота. Отключение также отключает настройки ребай пользовательских ботов.
tooltip.cfg.bots=Устанавливает сложность стандартных ботов. Для пользовательских ботов сложность настраивается индивидуально в Менеджере ботов.
tooltip.cfg.buyin_fixed=Все начинают с одинакового бай-ин. Если выключено, игроки выбирают в пределах настроенного диапазона.
tooltip.cfg.double_blinds=Переход на следующий уровень блайнды в структуре после определенного количества раздач или минут.
tooltip.cfg.hand_limit=Игра заканчивается, когда достигается это количество рук.
tooltip.cfg.iwtsth=Позволяет вам попросить увидеть руку соперника в вскрытие.
tooltip.cfg.rabbit=После раздачи раскрывает неразданные общие карты. Первый запрос каждого игрока бесплатен. Выбранный режим определяет, останутся ли последующие запросы бесплатными или будут стоить небольшую сумму или большой блайнд.
tooltip.cfg.rebuy_limit=Максимальное количество ребаев на игрока.
tooltip.cfg.recover=Возобновляет игру, которая была ранее прервана.
tooltip.cfg.rit=Позволяет голосовать за раздачу оставшихся карт дважды, когда Олл-ин закрывает ставки.
tooltip.cfg.straddle=Игрок после большой блайнд может выставить два большой блайнд до того, как увидит свои карты, и действовать последним на префлопе.
tooltip.cfg.straddle_on_timeout=Опубликуйте страддл автоматически, когда истечет время ожидания. Это влияет только на ваш плеер и отключено по умолчанию.
tooltip.cfg.structure=Блайнды структура уровней игры.
tooltip.cfg.think_time=Секунды на принятие решения. Автоматическое действие запускается по истечении времени.
tooltip.cfg.showdown_time=Секунды, в течение которых результат раздачи остается на экране, прежде чем будет разыграна следующая раздача.
tooltip.cfg.allow_hot_join=Позволяет новым игрокам присоединяться в качестве РАЗМИНКИ и участвовать в следующей раздаче. Изменение во время игры влияет только на новые попытки подключения.
tooltip.cfg.card_flip_duration=Устанавливает, сколько времени потребуется каждой карте, чтобы завершить свой ход при раскрытии.
tooltip.cfg.community_reveal_style=Выберите, как переворачиваются общие карты. Каждый вид запоминает свой выбор. По умолчанию в 2D карты переворачиваются без изгиба, а в 3D изгибаются.
tooltip.cfg.card_flip_direction=Выбирает, в какую сторону повернутся карты при раскрытии. Смешанный выбирает направление для каждого раскрытия. Карты одной группы складываются одинаково.
tooltip.cfg.card_flip_zoom=Увеличивает карты во время переворачивания, чтобы казалось, что они движутся к экрану.
tooltip.cfg.reparto_velocidad=Устанавливает, сколько времени требуется каждой карте, чтобы пройти от колоды до своего места.
tooltip.cfg.community_deal_style=Выберите, будут ли все пять общих карт раздаваться взакрытую в начале или на отдельной улице. Сохраненные изменения применяются со следующей раздачи.
tooltip.cfg.anim_calidad=Качество сохраняет каждую визуальную деталь. Производительность снижает стоимость карточных перелетов и проявляется на более слабых компьютерах.
tooltip.cfg.downgrade_velocidad=Устанавливает, сколько времени понадобится столу, чтобы переставить места, когда игрок уходит.
tooltip.cfg.swap_velocidad=Устанавливает, сколько времени потребуется вашим картам для пересечения при сортировке.
tooltip.cfg.swap_estilo=Арк поднимает одну карту над другой. Горизонталь пересекает их на одной высоте.
tooltip.cfg.resaltar_avatares=Если на мгновение навести указатель мыши на аватар игрока, он увеличится над столом, рядом с его именем и стеком, и исчезнет, ​​когда вы уберете с него указатель мыши.
tooltip.cfg.resaltar_jugada_showdown=Во время вскрытие при наведении курсора на имя руки любого игрока (победителя или проигравшего) выделяются только карты, составляющие ее, а остальные затемняются.
tooltip.cfg.screenshot_fin_timba=Автоматически сохраняет скриншот финального экрана, когда счетчик денег заканчивается (или когда вы выходите из него, если выходите раньше).
tooltip.cfg.server_ip=Адрес (IP или домен), который прослушивает игровой сервер.
tooltip.cfg.server_port=TCP порт от 1 до 65535, который прослушивает сервер.
tooltip.cfg.upnp=Просит ваш маршрутизатор перенаправить этот порт TCP на хост, пока игровой сеанс не закроется.
tooltip.cfg.preset=Загружает сохраненный профиль настроек.
tooltip.cfg.preset_save=Сохраняет текущие настройки в виде многоразового профиля.
tooltip.cfg.preset_delete=Удаляет выбранный профиль настроек.
tooltip.cfg.buyin=Фишки, с которыми каждый игрок начинает игру за столом.
tooltip.cfg.buyin_range=С помощью переменной бай-ин каждый игрок выбирает свое бай-ин в этом диапазоне (в большой блайнд).
tooltip.cfg.volume=Общий объем игры.
tooltip.cfg.sound_master=Включает или отключает музыку, звуковые эффекты и звук чата. Покерный видеоплеер имеет собственную громкость.
tooltip.cfg.music_master=Включает или выключает всю музыку.
tooltip.cfg.fx_master=Включает или выключает все звуковые эффекты.
tooltip.cfg.game_start_sound=Воспроизводит стартовый звук, когда игра начинается или восстанавливается.
tooltip.cfg.music_surface=Включает музыку для этого экрана или момента. Кнопка воспроизведения позволяет просмотреть его, не выходя из настроек.
tooltip.cfg.recovery_music=Включает музыку, которая воспроизводится во время восстановления прерванной игры.
tooltip.cfg.silly_sounds=Включает звуки шуток, которые могут воспроизводиться во время игры.
gdx.settings.tooltip.mod_audio_override=Используется версия, предоставленная загруженным модом.
tooltip.cfg.play_own_notes=Также воспроизводит ваши собственные голосовые заметки при их отправке.
tooltip.cfg.notes_retention=Устанавливает продолжительность хранения голосовых заметок. При выборе «Навсегда» они удаляются только вручную.
tooltip.cfg.purge_notes=Удаляет все сохраненные голосовые заметки прямо сейчас.
tooltip.cfg.view_notes=Открывает средство просмотра сохраненных голосовых заметок.
tooltip.cfg.voice_notes_rule=Правило таблицы: позволяет отправлять и получать голосовые заметки.
tooltip.cfg.notes_local=Включает голосовые заметки на вашем компьютере (запись и воспроизведение).
tooltip.cfg.tts=Позволяет читать сообщения в чате вслух. Каждый игрок может отключить преобразование текста в речь на своем устройстве.
tooltip.cfg.display_mode=Выбирайте между оконным, полноэкранным режимом без полей и эксклюзивным полноэкранным режимом. Применяется при сохранении.
tooltip.cfg.compact_view=Сжимает фишки и карты, чтобы показать больше стола. Состояния: выключенный, компактный, компактный с маленькими карточками, а также компактный своими руками.
tooltip.cfg.dialog_zoom=Масштабирует диалоги и их текст. Его можно изменить только на стартовом экране. Это применяется к следующему диалоговому окну, которое вы открываете.
tooltip.cfg.deck=Дизайн колоды карт.
tooltip.cfg.table_renderer=Для следующей таблицы выберите GDX или Swing Legacy. Его нельзя изменить во время игры.
tooltip.cfg.table_renderer_cli=Средство визуализации принудительно запускается из командной строки.
tooltip.cfg.deck_back=Дизайн обратной стороны карты.
tooltip.cfg.table_felt=Цвет фетра столового.
tooltip.cfg.nivel_luz=Сколько яркости (%) сохраняет стол при выключенном свете, независимо от того, выключаете ли вы его самостоятельно или он гаснет сам по себе (пауза, игра окончена). Чем он ниже, тем темнее он выглядит. 35% по умолчанию.
tooltip.change_avatar=Нажмите, чтобы изменить аватар (щелкните правой кнопкой мыши, чтобы восстановить аватар по умолчанию)
