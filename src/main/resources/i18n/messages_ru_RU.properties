gdx.settings.tooltip.animation_position_chips=Оживляет дилера, перемещая фишки блайнды и страддл по столу.
gdx.settings.tooltip.animation_counters=Анимирует изменения стеков, ставок и банка.
gdx.settings.tooltip.animation_seats=Анимирует вход и перестановку сидений вокруг стола.
gdx.settings.tooltip.animation_sort_hand=Анимирует пересечение карточек при их сортировке.
gdx.settings.tooltip.animation_final_count=Анимирует подсчет прибылей и убытков по окончании игры.
gdx.settings.tooltip.animation_final_summary_cards=Анимирует появление балансовых карт по окончании игры. Выключите его, чтобы показать карты сразу на месте.
gdx.settings.tooltip.animation_allin_fire=Показывает огонь позади игроков, находящихся в Олл-ин.
gdx.settings.tooltip.animation_winner=Показывает огни и частицы вокруг выигрышных мест.
gdx.settings.tooltip.animation_chips=Анимирует полет фишек при ставке и сборе банка.
gdx.settings.tooltip.animation_reseat=Анимирует перестановку стола, когда игрок уходит.
gdx.settings.tooltip.animation_shuffle_cascade=Показывает распределенное перемешивание, перемещающееся между игроками.
