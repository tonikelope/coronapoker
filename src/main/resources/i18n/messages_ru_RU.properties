tooltip.cfg.custom_bots=Включает пользовательский каталог. Сначала добавляются настроенные профили, а затем стандартные боты.
tooltip.cfg.custom_bots.only=Запрещает добавление стандартных ботов. После исчерпания пользовательского каталога больше нельзя добавлять ботов.
tooltip.cfg.custom_bots.manage=Откройте менеджер, чтобы создавать, редактировать и упорядочивать своих ботов. Вы можете выбрать их сложность и стиль.
tooltip.cfg.custom_bots.row=Выберите этого бота, чтобы изменить его имя, аватар, сложность, стиль или ребай.
tooltip.cfg.custom_bots.avatar=Выберите допустимое изображение или оставьте официальный аватар бота. CoronaPoker сохраняет безопасную копию, чтобы она не потерялась.
tooltip.cfg.custom_bots.name=Введите видимое имя без $. Зарезервированный маркер добавляется автоматически.
tooltip.cfg.custom_bots.difficulty=Устанавливает задачу и тактику, которую использует бот. «Легкий» играет развлекательно, «Нормальный» использует более дисциплинированную стратегию, а «Трудный» использует продвинутую тактику.
tooltip.cfg.custom_bots.personality=Устанавливает базовый стиль. Случайный выбор выбирает его при создании бота и сохраняет на время активного сеанса. Бот может адаптировать свои решения к ситуации.
gdx.settings.option_help.bot_difficulty.easy=Играет небрежно и чаще допускает ошибки.
gdx.settings.option_help.bot_difficulty.medium=Использует более дисциплинированную стратегию и корректирует решения по мере развития руки.
gdx.settings.option_help.bot_difficulty.hard=Использует более продвинутую тактику, например, крадет блайнды или оказывает давление, когда противник выглядит уязвимым.
gdx.settings.option_help.custom_bot_personality.random=Выбирает стиль при создании бота и сохраняет его для активного сеанса.
gdx.settings.option_help.custom_bot_personality.nit=Вступает в игру с небольшим количеством раздач и обычно ждет сильных карт, прежде чем рисковать фишками.
gdx.settings.option_help.custom_bot_personality.station=Склонен коллировать ставки и оставаться в раздаче. Реже поднимает.
gdx.settings.option_help.custom_bot_personality.tag=Выборочно выбирает руки и склонен брать на себя инициативу по ставкам и рейзам.
gdx.settings.option_help.custom_bot_personality.lag=Разыгрывает более широкий диапазон рук и оказывает давление с помощью частых ставок и рейзов.
gdx.settings.option_help.ante_mode.traditional=Каждый активный игрок размещает одну десятую часть большой блайнд, округленную до ближайшего цента.
gdx.settings.option_help.ante_mode.big_blind=Игрок в большой блайнд выкладывает весь анте, равный одному большой блайнд.
gdx.settings.option_help.ante_mode.button=Игрок на кнопке размещает весь анте, равный одному большой блайнд.
gdx.settings.option_help.ante_mode.small_blind=Игрок в малый блайнд выкладывает весь анте, равный одному большой блайнд.
gdx.settings.option_help.blind_unit.minutes=Интервал между увеличениями блайнды измеряется в минутах игры.
gdx.settings.option_help.blind_unit.hands=Блайнды увеличивается после завершения указанного количества раздач.
gdx.settings.option_help.rebuy_cap.buy_in=Ваш максимальный стек после ребай основан на бай-ин в игре.
gdx.settings.option_help.rebuy_cap.highest_stack=Ребай до самого большого стека за столом. Ограничение никогда не опускается ниже стандартного бай-ин.
gdx.settings.option_help.rabbit.off=Неразданные общие карты остаются скрытыми после окончания раздачи.
gdx.settings.option_help.rabbit.free=Вы можете попросить показать неразданные общие карты после окончания раздачи, не платя фишек.
gdx.settings.option_help.rabbit.free_small_blind=Ваш первый запрос игры бесплатен. Каждый последующий запрос стоит один малый блайнд.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Ваш первый запрос игры бесплатен, второй стоит один малый блайнд, а последующие запросы стоят один большой блайнд.
gdx.settings.option_help.window_mode.exclusive=Использует полноэкранный режим монитора.
gdx.settings.option_help.window_mode.borderless=Заполняет экран окном без полей и сохраняет режим отображения рабочего стола.
gdx.settings.option_help.window_mode.windowed=Открывается CoronaPoker в окне, которое можно перемещать и изменять размер.
gdx.settings.option_help.fps_limit.fixed=Устанавливает фиксированную максимальную частоту кадров. Более низкая крышка может снизить энергопотребление.
gdx.settings.option_help.fps_limit.monitor=Сопоставляет ограничение частоты кадров с частотой обновления монитора, на котором отображается игра.
gdx.settings.option_help.msaa.0=Отключает мультисэмпловое сглаживание для таблицы и интерфейса. Требует перезагрузки.
gdx.settings.option_help.msaa.2=Использует 2 образца на пиксель для сглаживания краев с низкими затратами на графику. Требует перезагрузки.
gdx.settings.option_help.msaa.4=Использует 4 образца на пиксель, чтобы сбалансировать сглаживание краев и затраты на графику. Требует перезагрузки.
gdx.settings.option_help.msaa.8=Использует 8 выборок на пиксель для максимально сильного сглаживания, которое предлагает этот параметр. Требует перезагрузки.
gdx.settings.option_help.card_rendering.native=Рисует карты напрямую, чтобы снизить стоимость рендеринга.
gdx.settings.option_help.card_rendering.smooth=Использует дополнительный фильтр для сглаживания краев карты при более высоких затратах на графику.
tooltip.cfg.custom_bots.automatic_rebuy=Запустит этого специального бота ребай после того, как у него закончатся фишки. Глобальное автоматическое управление ребай должно быть включено.
tooltip.cfg.custom_bots.order_up=Перемещает выбранный профиль на одну позицию вверх. Список следует за ним, когда необходима прокрутка.
tooltip.cfg.custom_bots.order_down=Перемещает выбранный профиль на одну позицию вниз. Список следует за ним, когда необходима прокрутка.
tooltip.cfg.custom_bots.random_selection=Перетасовывает каталог один раз при создании лобби. Каждый пользовательский бот может войти только один раз, и выбор остается стабильным для этого лобби.
tooltip.cfg.custom_bots.new=Готовит новый профиль без изменения уже сохраненных ботов.
tooltip.cfg.custom_bots.save=Добавляет новый профиль или сохраняет изменения, внесенные в выбранного бота.
tooltip.cfg.custom_bots.delete=Удаляет выбранный профиль после запроса подтверждения.
tooltip.cfg.custom_bots.close=Закрывает менеджер. Сохраненные профили и их порядок сохраняются автоматически.
