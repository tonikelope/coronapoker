game.showdown_forfeit_msg=ВНИМАНИЕ: проверка вскрытие не удалась для следующих игроков, и их карты НЕ будут раскрыты:\n\n%nicks%\n\nЭти игроки исключены из сопротивления вскрытие (автофолд) и НЕ МОГУТ выиграть этот банк. Игра продолжается нормально.
zero_trust.peer_sra_corrupt=Подпись вскрытие является подлинной, но ключ SRA узла не разрешает действительные карты. Это происходит только в том случае, если партнер намеренно подписал поврежденный ключ или его клиент содержит ошибки. Мы не можем сказать, какой именно, и в целях безопасности заканчиваем игру.
zero_trust.straddle_recover_mismatch=Восстанавливая раздачу, ведущий объявил страддл, отличный от того, который записала ваша локальная копия. Это происходит только в том случае, если хост подделывает восстановленный страддл или его клиент содержит ошибки. Рука по-прежнему реконструируется из вашей доверенной копии, но мы предупреждаем вас в качестве меры предосторожности.
zero_trust.rit_recover_mismatch=Во время восстановления раздачи хост объявил результат повторного запуска, отличный от того, который записала ваша собственная локальная копия. Это происходит только в том случае, если хост подделывает восстановленный результат или его клиент содержит ошибки. Рука по-прежнему реконструируется из вашей доверенной копии, но мы предупреждаем вас в качестве меры предосторожности.
zero_trust.peer_sra_corrupt_registro=Ключ \u2014 вскрытие подписан, но не разрешается для карт. Возможен чит или баг клиента.
