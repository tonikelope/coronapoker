gdx.settings.tooltip.vsync=Синхронизирует кадры с монитором для предотвращения разрывов. Это может снизить FPS и увеличить задержку.
gdx.settings.tooltip.fps_limit=Шапки FPS. «Частота обновления монитора» следует за вашим дисплеем. Более высокая частота кадров требует больше энергии.
gdx.settings.tooltip.msaa=Сглаживает геометрические края сцены. Большее количество образцов увеличивает нагрузку на GPU. Применяется после перезапуска.
gdx.settings.tooltip.card_rendering=Smooth применяет дополнительный фильтр к краям карточки. Native тянет карты напрямую.
gdx.settings.tooltip.show_fps=Показывает текущий статус FPS и VSync на экране.
gdx.settings.tooltip.show_cpu_memory=Показывает Java CPU и использование памяти.
gdx.settings.tooltip.gpu_renderer=Показывает графический адаптер и драйвер OpenGL, используемые игрой.
gdx.settings.tooltip.audio_output=Выбор устройства, используемого для воспроизведения игрового звука.
gdx.settings.tooltip.audio_capture=Выбор микрофона, используемого для записи голосовых сообщений.
gdx.settings.tooltip.microphone=Позволяет записывать и отправлять голосовые сообщения из игры.
gdx.settings.tooltip.mic_auto_gain=Автоматически регулирует уровень микрофона, чтобы компенсировать слишком тихие или громкие голоса.
gdx.settings.tooltip.local_tts=Разрешает или блокирует воспроизведение текстовых сообщений на этом компьютере.
gdx.settings.tooltip.auto_buttons=Показывает автоматические действия, которые можно выполнить, когда придет ваша очередь.
gdx.settings.tooltip.auto_call=Настраивает автоматический вызов и его максимально допустимую сумму.
gdx.settings.tooltip.auto_persist=Сохраняет выбранное автоматическое действие после его выполнения до тех пор, пока не закончится раздача или не будет очищен выбор.
gdx.settings.tooltip.auto_confirm=Запрашивает подтверждение перед выполнением автоматического действия.
gdx.settings.tooltip.confirm_actions=Запрашивает подтверждение перед важными действиями вручную.
gdx.settings.tooltip.auto_rebuy=Автоматически совершает повторные покупки, когда у вас заканчиваются фишки, и ребаи разрешены.
gdx.settings.tooltip.shortcut=Выберите строку и нажмите клавишу, которую хотите назначить этому действию.
gdx.settings.tooltip.rebuy_cap=Выбирает, будет ли лимит фишек после ребай основан на бай-ин или на самом большом стеке за столом.
gdx.settings.tooltip.blind_structures=Открывает редактор для управления структурами уровня блайнды.
gdx.settings.tooltip.blind_unit=Выбирает, будет ли увеличение блайнды запланировано по сыгранным рукам или по минутам.
