player.en_el_bmodo_recuperacionb_se=In <b>REŽIM OBNOVENIA</b> predchádzajúca hra bude pokračovať od miesta, kde skončila:\n\n1) Je <b>POVINNÝ</b> že starí hráči používajú <b>ROVNAKÉ NICKY</b>.\n\n2) Ak chcete pokračovať od <b>PRESNÝ BOD</b> z ruky to je <b>POVINNÝ</b> že <b>VŠETKY</b> starí hráči sa znova pripájajú. Ak to nie je možné, hra, ktorá prebieha v čase prerušenia hry, bude stratená.\n\n3) <b>Noví hráči</b> sa môžu zapojiť do hry (z prvej ruky budú divákmi).
