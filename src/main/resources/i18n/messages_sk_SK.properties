tooltip.cfg.fx_master=Zapína alebo vypína všetky zvukové efekty.
tooltip.cfg.game_start_sound=Prehrá úvodný zvuk, keď sa hra začne alebo je obnovená.
tooltip.cfg.music_surface=Povolí hudbu pre túto obrazovku alebo moment. Tlačidlo prehrávania zobrazí ukážku bez opustenia nastavení.
tooltip.cfg.recovery_music=Umožňuje prehrávanie hudby, keď sa obnovuje prerušená hra.
tooltip.cfg.silly_sounds=Umožňuje vtipné zvuky, ktoré sa môžu prehrávať počas hry.
