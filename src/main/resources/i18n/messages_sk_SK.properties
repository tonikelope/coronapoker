game.showdown_forfeit_msg=UPOZORNENIE: Overenie ukázanie kariet zlyhalo pre nasledujúcich hráčov a ich karty NEBUDÚ odhalené: \n\n%nicks%\n\nTíto hráči sú vylúčení z odporu ukázanie kariet (automatické skladanie) a NEMÔŽU vyhrať tento bank. Hra pokračuje normálne.
zero_trust.peer_sra_corrupt=Podpis ukázanie kariet je pravý, ale kľúč SRA partnera sa nedá určiť na platné karty. Stáva sa to iba vtedy, ak partner úmyselne podpísal poškodený kľúč alebo je jeho klient chybný. Nevieme povedať ktoré a pre istotu hru ukončíme.
zero_trust.straddle_recover_mismatch=Počas obnovovania ruky hostiteľ oznámil straddle odlišný od tej, ktorú zaznamenala vaša vlastná lokálna kópia. Toto sa stane iba vtedy, ak hostiteľ manipuluje s obnoveným straddle alebo jeho klient je chybný. Ruka je stále zrekonštruovaná z vašej dôveryhodnej kópie, ale preventívne vás varujeme.
zero_trust.rit_recover_mismatch=Počas obnovovania ruky hostiteľ oznámil výsledok spustenia dvakrát odlišný od toho, ktorý zaznamenala vaša vlastná lokálna kópia. Stáva sa to iba vtedy, ak hostiteľ manipuluje s obnoveným výsledkom alebo ak je jeho klient chybný. Ruka je stále zrekonštruovaná z vašej dôveryhodnej kópie, ale preventívne vás varujeme.
zero_trust.peer_sra_corrupt_registro=\u2014 ukázanie kariet kľúč je podpísaný, ale neidentifikuje sa na karty. Možný cheat alebo chyba klienta.
