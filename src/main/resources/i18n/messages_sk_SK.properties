tooltip.cfg.custom_bots=Povolí vlastný katalóg. Najprv sa pridajú nakonfigurované profily a potom štandardné roboty.
tooltip.cfg.custom_bots.only=Zabraňuje pridávaniu štandardných robotov. Po vyčerpaní vlastného katalógu nie je možné pridať žiadne ďalšie roboty.
tooltip.cfg.custom_bots.manage=Otvorte správcu, aby ste mohli vytvárať, upravovať a objednávať svoje roboty. Môžete si vybrať ich obtiažnosť a štýl.
tooltip.cfg.custom_bots.row=Vyberte tohto robota, ak chcete upraviť jeho názov, avatar, obtiažnosť, štýl alebo dokúpenie.
tooltip.cfg.custom_bots.avatar=Vyberte platný obrázok alebo si ponechajte oficiálny avatar robota. CoronaPoker ukladá bezpečnú kópiu, aby sa nestratila.
tooltip.cfg.custom_bots.name=Zadajte viditeľný názov bez $. Rezervovaná značka sa pridá automaticky.
tooltip.cfg.custom_bots.difficulty=Stanovuje výzvu a taktiku, ktorú robot používa. Easy hrá rekreačne, Normal používa disciplinovanejšiu stratégiu a Hard využíva pokročilé taktiky.
tooltip.cfg.custom_bots.personality=Nastaví základný štýl. Náhodne ho vyberie pri vytvorení robota a ponechá si ho počas aktívnej relácie. Robot môže prispôsobiť svoje rozhodnutia situácii.
gdx.settings.option_help.bot_difficulty.easy=Hrá nenútene a častejšie robí chyby.
gdx.settings.option_help.bot_difficulty.medium=Používa disciplinovanejšiu stratégiu a upravuje rozhodnutia podľa toho, ako sa ruka vyvíja.
gdx.settings.option_help.bot_difficulty.hard=Používa pokročilejšie taktiky, ako je krádež blindy alebo použitie tlaku, keď súper vyzerá zraniteľne.
gdx.settings.option_help.custom_bot_personality.random=Vyberie štýl pri vytvorení robota a ponechá si ho počas aktívnej relácie.
gdx.settings.option_help.custom_bot_personality.nit=Zadáva málo rúk a zvyčajne čaká na silné karty, kým riskuje žetóny.
gdx.settings.option_help.custom_bot_personality.station=Má tendenciu dorovnať stávky a zostať v hre. Zdvíha menej často.
gdx.settings.option_help.custom_bot_personality.tag=Vyberá si ruky selektívne a má tendenciu prevziať vedenie pomocou stávok a navýšení.
gdx.settings.option_help.custom_bot_personality.lag=Hrá širšiu škálu rúk a vyvíja tlak s častými stávkami a navýšeniami.
gdx.settings.option_help.ante_mode.traditional=Každý aktívny hráč posiela jednu desatinu veľký blind, zaokrúhlenú na najbližší cent.
gdx.settings.option_help.ante_mode.big_blind=Hráč v veľký blind uverejní celé ante, čo sa rovná jednému veľký blind.
gdx.settings.option_help.ante_mode.button=Hráč na tlačidle uverejní celú ante, ktorá sa rovná jednej veľký blind.
gdx.settings.option_help.ante_mode.small_blind=Hráč v malý blind uverejní celé ante, čo sa rovná jednému veľký blind.
gdx.settings.option_help.rebuy_cap.buy_in=Váš maximálny stack po dokúpenie je založený na vstupné hry.
gdx.settings.option_help.rebuy_cap.highest_stack=Dokúpenie až po najväčší stack pri stole. Strop nikdy neklesne pod štandard vstupné.
gdx.settings.option_help.rabbit.off=Nerozdané spoločné karty zostanú po skončení hry skryté.
gdx.settings.option_help.rabbit.free=Po skončení hry môžete požiadať o zobrazenie nerozdaných spoločných kariet bez platenia žetónov.
gdx.settings.option_help.rabbit.free_small_blind=Vaša prvá žiadosť o hru je bezplatná. Každá neskoršia žiadosť stojí jeden malý blind.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Vaša prvá žiadosť o hru je bezplatná, druhá stojí 1 malý blind a neskoršia žiadosť stojí 1 veľký blind.
gdx.settings.option_help.window_mode.exclusive=Používa režim celej obrazovky monitora.
gdx.settings.option_help.window_mode.borderless=Vyplní obrazovku oknom bez okrajov a zachová režim zobrazenia pracovnej plochy.
tooltip.cfg.custom_bots.automatic_rebuy=Nechajte tohto vlastného robota dokúpenie po vyčerpaní žetónov. Musí byť povolené globálne automatické ovládanie dokúpenie.
tooltip.cfg.custom_bots.order_up=Posunie vybraný profil o jednu pozíciu nahor. Zoznam nasleduje, keď je potrebné rolovanie.
tooltip.cfg.custom_bots.order_down=Posunie vybraný profil o jednu pozíciu nadol. Zoznam nasleduje, keď je potrebné rolovanie.
tooltip.cfg.custom_bots.random_selection=Zamieša katalóg raz, keď sa vytvorí lobby. Každý vlastný robot môže vstúpiť iba raz a výber zostáva stabilný pre danú lobby.
tooltip.cfg.custom_bots.new=Pripraví nový profil bez zmeny už uložených robotov.
tooltip.cfg.custom_bots.save=Pridá nový profil alebo uloží zmeny vykonané na vybranom robotovi.
tooltip.cfg.custom_bots.delete=Odstráni vybraný profil po požiadaní o potvrdenie.
tooltip.cfg.custom_bots.close=Zatvorí manažér. Uložené profily a ich poradie sa uchovávajú automaticky.
