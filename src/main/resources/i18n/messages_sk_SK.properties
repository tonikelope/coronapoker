tooltip.cfg.ante=Pridá vynútený príspevok do banku po blindy. Režim nastavuje, kto a koľko platí.
tooltip.cfg.ante_mode=V tradičnom režime každý aktívny hráč zaplatí 10 % z veľký blind. V BBA, BA alebo SBA platí tlačidlo veľký blind, tlačidlo alebo malý blind jeden veľký blind. Blindy sú zverejnené ako prvé.
tooltip.cfg.blind_cap=Zastaví zvýšenie blindy pri nakonfigurovanom strope.
tooltip.cfg.blinds_level=Počnúc blindy (malý/veľký) za hru.
tooltip.cfg.bot_balance=Keď hra skončí, kombinovaný zostatok robotov sa rovnomerne rozdelí medzi ľudských hráčov, takže skutočné peniaze sa vyrovnávajú iba medzi ľuďmi.
tooltip.cfg.bot_rebuy=Globálne automatické ovládanie dokúpenie pre každého robota. Vypnutím tiež zakážete nastavenia dokúpenie vlastných robotov.
tooltip.cfg.bots=Nastavuje obtiažnosť štandardných robotov. Vlastné roboty si nechávajú obtiažnosť nakonfigurovanú individuálne v správcovi botov.
tooltip.cfg.buyin_fixed=Každý začína rovnakým vstupné. Keď je vypnutá, hráči si vyberajú v rámci nakonfigurovaného rozsahu.
tooltip.cfg.double_blinds=Postúpi na ďalšiu úroveň blindy v štruktúre po nastavenom počte hier alebo minút.
tooltip.cfg.hand_limit=Hra končí, keď sa dosiahne tento počet rúk.
tooltip.cfg.iwtsth=Umožňuje vám požiadať o zobrazenie karty súpera pri ukázanie kariet.
tooltip.cfg.rabbit=Odhaľuje nerozdané spoločné karty po hre. Prvá žiadosť každého hráča je bezplatná. Zvolený režim nastavuje, či neskoršie požiadavky zostanú bezplatné alebo budú stáť malý alebo veľký blind.
tooltip.cfg.rebuy_limit=Maximálny rebuy na hráča.
tooltip.cfg.recover=Obnoví hru, ktorá bola predtým prerušená.
tooltip.cfg.rit=Umožňuje hlasovanie rozdať zvyšné karty dvakrát, keď stávka All-in končí.
tooltip.cfg.straddle=Hráč po veľký blind môže poslať dve veľký blind predtým, ako uvidí svoje karty a hrať ako posledný preflop.
tooltip.cfg.straddle_on_timeout=Uverejnite straddle automaticky, keď vyprší časový limit výzvy. Ovplyvní to iba váš prehrávač a je predvolene vypnuté.
tooltip.cfg.structure=Štruktúra úrovne Blindy pre hru.
tooltip.cfg.think_time=Počet sekúnd na rozhodnutie. Automatická akcia sa spustí po uplynutí času.
tooltip.cfg.showdown_time=Po niekoľkých sekundách zostane výsledok hry na obrazovke pred rozdaním ďalšej hry.
tooltip.cfg.allow_hot_join=Umožňuje novým hráčom pripojiť sa ako WARMING UP a vstúpiť do ďalšej hry. Keď sa zmení počas hry, ovplyvní to iba nové pokusy o pripojenie.
tooltip.cfg.card_flip_duration=Nastavuje, ako dlho každej karte po odkrytí trvá dokončenie ťahu.
tooltip.cfg.card_flip_direction=Vyberá, akým smerom sa karty obrátia, keď sú odkryté. Zmiešaný vyberie smer pre každé odhalenie. Karty v rovnakej skupine sa otáčajú rovnakým spôsobom.
tooltip.cfg.reparto_velocidad=Nastavuje, ako dlho každej karte trvá cesta z balíčka na miesto.
tooltip.cfg.community_deal_style=Vyberte si, či sa všetkých päť spoločných kariet rozdá na začiatku lícom nadol, alebo sa rozdá na vlastnej ulici. Uložené zmeny sa použijú od nasledujúcej hry.
tooltip.cfg.anim_calidad=Kvalita zachováva každý vizuálny detail. Výkon znižuje náklady na kartové lety a odhaľuje na slabších počítačoch.
tooltip.cfg.downgrade_velocidad=Nastavuje, ako dlho trvá pri stole zmeniť usporiadanie sedadiel, keď hráč odíde.
tooltip.cfg.swap_velocidad=Nastavuje, ako dlho trvá kríženie kariet pri triedení.
tooltip.cfg.swap_estilo=Arc dvíha jednu kartu nad druhú. Horizontálne ich pretína v rovnakej výške.
tooltip.cfg.resaltar_avatares=Keď na chvíľu položíte myš na hráčovho avatara, zobrazí sa zväčšený nad stolom, vedľa jeho mena a zásobníka, a zmizne, keď z neho stlačíte myš.
tooltip.cfg.resaltar_jugada_showdown=Počas ukázanie kariet sa kurzorom myši nad menom ktoréhokoľvek hráča (víťaz alebo porazený) zvýraznia iba karty, ktoré ho tvoria, a zvyšok sa stlmí.
tooltip.cfg.screenshot_fin_timba=Automaticky uloží snímku obrazovky poslednej obrazovky, keď skončí počítadlo peňazí (alebo keď ho opustíte, ak odídete skôr).
tooltip.cfg.server_ip=Adresa (IP alebo doména), na ktorej počúva herný server.
tooltip.cfg.server_port=TCP port od 1 do 65535, na ktorom server počúva.
tooltip.cfg.upnp=Požiada váš smerovač, aby preposielal tento port TCP hostiteľovi, kým sa herná relácia neukončí.
tooltip.cfg.preset=Načíta uložený profil nastavení.
tooltip.cfg.preset_save=Uloží aktuálne nastavenia ako opätovne použiteľný profil.
tooltip.cfg.preset_delete=Odstráni vybraný profil nastavení.
tooltip.cfg.buyin=Žetóny, s ktorými začína každý hráč pri stole.
tooltip.cfg.buyin_range=S premennou vstupné si každý hráč vyberie svoje vstupné v rámci tohto rozsahu (v veľký blind).
tooltip.cfg.volume=Celkový objem hry.
tooltip.cfg.sound_master=Povolí alebo stlmí hudbu, zvukové efekty a zvuk rozhovoru. Pokerový videoprehrávač má svoj vlastný objem.
