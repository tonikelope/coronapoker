game.recover_accion_ausencia=⚠ Upozornenie: hostiteľ prehral akcie neskôr ako vaša posledná zaznamenaná akcia, pravdepodobne hraná, keď ste boli mimo hry – nemožno ich overiť a sú akceptované tak, ako ich hostiteľ odoslal
