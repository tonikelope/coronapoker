zero_trust.peer_alert=⚠️ [ANOMÁLNE SPRÁVANIE HRÁČA]
zero_trust.peer_suspicious_header=Pri vašom stole bolo zistené neobvyklé alebo urážlivé správanie hráča:\n
zero_trust.peer_suspicious_body=Stôl použil zodpovedajúce bezpečnostné opatrenie a hra pokračuje pre ostatných hráčov. Predpokladá sa dobrá viera. Môže ísť o softvérovú chybu a nikto nie je obvinený. Dôkazy sú zaznamenané.
zero_trust.peer_inbound_flood=Trvalá overená prevádzka nad prahom anti-DoS.
zero_trust.peer_binary_flood=Operácie hlasových správ sa odosielajú nezvyčajne vysokou rýchlosťou.
zero_trust.host_binary_flood=Hostiteľ posiela operácie hlasových správ nezvyčajne vysokou rýchlosťou.
zero_trust.peer_flood_log=Anti-DoS incident čakajúci na rozhodnutie: hráč {0}, IP {1}. Dôvod: {2}
zero_trust.peer_flood_confirm=Používateľ {0} odosiela nadmerné množstvo prenosu. Môže to byť útok DoS alebo chyba. Vylúčiť ich z hry?\n\nIP: {1}\nZistený dôvod: {2}
zero_trust.peer_flood_suppress=Nezobrazovať tieto upozornenia
zero_trust.peer_hand_ready_withheld=Hráč odpovie PING, ale počas hry nepotvrdí pripravenosť na ďalšiu hru. Zamrzol ručný štart a bol VYHNUTÝ. Hra pokračuje bez nich.
zero_trust.peer_action_withheld=Hráč odpovie PING, ale nepošle svoju stávkovú akciu, kým hra beží, po uplynutí času na rozmyslenie. Zmrzlo kolo a bolo VYHNUTÉ. Hra pokračuje bez nich.
zero_trust.peer_conf_withheld=Hráč odpovie PING, ale nepotvrdí prijatie rozdávacej správy, kým hra beží. Blokoval postup stola a bol VYHNUTÝ. Hra pokračuje bez nich.
zero_trust.peer_deal_refusal_expelled=Hráč si vynútil niekoľko zrušení hry za sebou tým, že odmietol premiešať alebo striedať balíček. Bolo VYHNUTÉ, takže hra môže pokračovať.
zero_trust.suspicious_alert=⚠️ [ANOMÁLNE SPRÁVANIE SERVERA]
zero_trust.suspicious_header=Váš klient zistil anomálne správanie servera (nie je to kritický incident, ktorý zmrazí hru):\n
zero_trust.suspicious_body=Váš klient odmietol anomálnu operáciu a hra MÔŽE pokračovať. Predpokladáme dobrú vieru: môže ísť o softvérovú CHYBU (klienta alebo servera) a nikto nie je obvinený. Ale keďže chybu nemožno rozlíšiť okrem manipulácie, PRE VAŠU BEZPEČNOSŤ DÔRAZNE ODPORÚČAME OPUSTIŤ tento stôl pomocou tlačidla 'Opustiť' (vaše peniaze NEBUDÚ v tejto hre spracované).
zero_trust.host_bad_wire=Zo servera bola prijatá požiadavka na dešifrovanie s neplatným formátom alebo bodmi, ktoré nepatria do kryptografickej krivky.
zero_trust.host_critical_command_invalid=Kritický príkaz {0} odoslaný serverom sa nepodarilo overiť. Môže ísť o nekompatibilitu, chybu alebo upravený server. Relácia sa zastaví, aby sa ochránila jej integrita.
zero_trust.cheater_detected=[ZERO-TRUST] Bol zistený hráč s upravenou verziou CoronaPoker, čo naznačuje, že sa možno pokúša podvádzať. Chcete pokračovať?
zero_trust.corrupted_mac_action=Server sa pokúsil spracovať akciu s neplatným kryptografickým podpisom (poškodený MAC) v mene:
zero_trust.critical=\u274c [NULOVÁ DÔVERA] KRITICKÉ VAROVANIE: NEPLATNÝ PODPIS ALEBO PORUŠENÝ KONSENZUS.
zero_trust.critical_alert_body=STAV KARANTÉNY AKTIVOVANÝ:\nVáš klient NEBUDE v tejto relácii posielať na server žiadne ďalšie kryptografické kľúče.\nHra je matematicky zmrazená, aby bola chránená vaša rovnováha.\n\nMOŽNÉ príčiny sú:\n  - CHYBA v samotnom klientskom kóde,\n  - CHYBA v kóde servera, príp\n  - SERVER, ktorého kód mohol byť pozmenený.\n\nKlient ich nevie rozlíšiť a nie je implikované ŽIADNE obvinenie. Z bezpečnostných dôvodov a až do posúdenia základnej príčiny sa ODPORÚČAME OPUSTIŤ túto hru pomocou tlačidla 'Exit' (vaše peniaze NEBUDÚ v tejto hre spracované).
zero_trust.critical_alert_header=NULOVÝ INCIDENT!\n\nVáš klient zistil anomáliu v kryptografickom protokole:\n
zero_trust.critical_session_error=[ZERO-TRUST] CHYBA KRITICKEJ RELÁCIE
