radar.el_servidor_ha_activado_el=Server aktivoval anti-cheat RADAR pre túto hru. Každý hráč môže počas hry požiadať o anti-cheat správu iného hráča, ktorá obsahuje snímku obrazovky hráča (bez zobrazenia jeho kariet), ako aj zoznam jeho systémových procesov.
radar.esta_funcionalidad_permite_a_cualquier=Táto funkcia umožňuje každému hráčovi získať snímku obrazovky a zoznam procesov iného hráča, ak ho podozrieva z podvádzania alebo používania softvéru tretej strany. Ako hostiteľ prosím pred povolením tejto možnosti zvážte dôsledky pre súkromie (nie je možné ju zmeniť v priebehu hry).\n\nPoznámka: Táto funkcia je dosť závislá od platformy, takže nie je zaručené, že bude dokonale fungovať na všetkých klientoch.
