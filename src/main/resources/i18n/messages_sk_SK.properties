zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Binárny protokol načítaný do pamäte (podpisy {0} pripravené na synchronizované prehrávanie).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Zlyhala kaskáda kryptografického náhodného výberu. Ruka bola zrušená.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Nepodarilo sa odomknúť súkromné ​​karty (hráč nereagoval včas). Ruka bola zrušená.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Dešifrovaná karta sa nezhoduje so žiadnou platnou kartou v balíčku. Hra bola zrušená.
peer.not_enough_players=Hráč vypadol počas miešania a už nie je dostatok hráčov na rozdanie kariet.
peer.unlock_no_testament=Hráč sa odpojil bez toho, aby zanechal svoj dešifrovací kľúč. Ruka bola zrušená.
peer.broadcast_failed=Chyba siete pri vysielaní súkromných kariet. Ruka bola zrušená.
peer.recovery_action_data_unavailable=Uloženú históriu akcií nebolo možné prečítať. Ruka bola bezpečne zrušená a obnoví sa.
straddle.deferred_release_failed=Karty blindy straddle sa nepodarilo odhaliť (hráč sa odpojil alebo odmietol spolupracovať). Ruka bola zrušená.
peer.state_inconsistent=Stav dílera sa stal nekonzistentným. Ruka bola zrušená.
peer.bot_no_token=Robot nemá pripravený dešifrovací kľúč. Ruka bola zrušená.
peer.community_unlock_no_testament=Hráč sa odpojil bez toho, aby opustil svoj kľúč, aby odhalil spoločné karty. Ruka bola zrušená.
peer.dropped_during_cascade=Hráč sa odpojil počas kryptografického miešania balíčka. Ruka bola zrušená.
peer.dropped_during_rotation=Hráč odpojený počas kryptografickej rotácie balíčka. Ruka bola zrušená.
zero_trust.rotation_refused=Pripojený hráč odmietol doručiť kľúč na otáčanie balíčkov. Hra je zastavená. Svoje odmietnutie opätovného prijatia budú musieť odôvodniť.
zero_trust.cascade_refused=Pripojený hráč sa odmietol zúčastniť kaskády miešania balíčkov. Hra je zastavená. Svoje odmietnutie opätovného prijatia budú musieť odôvodniť.
zero_trust.pocket_unlock_refused=Pripojený hráč odmietol doručiť svoj kľúč na dešifrovanie vreckových kariet. Hra je zastavená. Svoje odmietnutie opätovného prijatia budú musieť odôvodniť.
zero_trust.community_unlock_refused=Pripojený hráč odmietol doručiť svoj kľúč, aby odhalil spoločné karty. Hra je zastavená. Svoje odmietnutie opätovného prijatia budú musieť odôvodniť.
zero_trust.host_showdown_sig_missing=Zo servera bol prijatý kľúč ukázanie kariet BEZ kryptografického podpisu autora alebo s chybným podpisom. Server môže nahrádzať kľúč na drôte.
zero_trust.host_showdown_sig_invalid=Zo servera bol prijatý kľúč ukázanie kariet s NEPLATNÝM kryptografickým podpisom. Server môže nahrádzať kľúč na drôte.
zero_trust.host_potcards_mismatch=Čistý text ukázanie kariet odoslaný serverom NEZHODUJE s výsledkom dešifrovania vašej lokálnej položky pomocou podpísaného kľúča. Server môže odosielať falošné karty o ukázanie kariet.
zero_trust.host_community_garbage=Údaje o kryptografickej spoločnej karte prijaté zo servera sú nekonzistentné (kus sa nedešifruje na platnú palubnú kartu alebo sa nezhoduje s podpísaným oznámením servera). Možné príčiny: CHYBA v niektorej verzii softvéru, verzia servera, ktorej kód mohol byť pozmenený, alebo poškodenie lokálneho kľúča identity. Klient nevie rozlíšiť a nikoho neobviňuje.
zero_trust.host_unlock_out_of_order=Požiadavka na dešifrovanie bola prijatá zo servera mimo poradia (nesprávna ulica, opakovaný slot, fáza mimo poradia alebo požiadavka vydaná pred uzavretím predchádzajúcej ulice).
zero_trust.host_cascade_mid_hand=Požiadavka na náhodné reštartovanie bola prijatá zo servera uprostred prebiehajúcej hry (prepísalo by sa môj dešifrovací kľúč).
zero_trust.host_pocket_extraction=Zo servera bola prijatá požiadavka na dešifrovanie, ktorá by ovplyvnila VAŠE VLASTNÉ súkromné ​​karty.
zero_trust.host_community_extraction=Zo servera bola prijatá požiadavka na dešifrovanie, ktorá by vopred odhalila spoločnú kartu.
zero_trust.host_rotation_replay=Server požiadal o druhú rotáciu karty v tej istej ruke. Legitímna rotácia je jedinečná pre každú ruku. Opakovanie naznačuje pokus použiť vášho klienta na dešifrovanie kariet iných hráčov.
zero_trust.host_shuffle_proof_failed=Overenie dohody zlyhalo: nebolo možné dokázať, že balík, ktorý server rozdal, bol čestným premiešaním balíka genesis. Odomknutie komunity bolo odmietnuté a táto relácia sa ukončuje z dôvodu ochrany súkromných kariet.
zero_trust.host_shuffle_proof_missing=Dohoda prišla bez overiteľného dôkazu o úprimnom zamiešaní pre tento balík kariet a teraz sa odhaľujú spoločné karty. Môže to byť chyba alebo oneskorenie siete alebo hostiteľ, ktorý sa snaží zmanipulovať dohodu. Môžete pokračovať v hre, ale dôrazne sa odporúča opustiť tento stôl.
zero_trust.deck_unverified=Balíček tejto kombinácie sa NEDÁ overiť ako poctivé zamiešanie. PODOZRIVÁ: hostiteľ "{0}", ktorý rozdáva a vysiela dôkaz o náhodnom poradí. Môže to byť hostiteľ manipulujúci s dohodou alebo hráč, ktorý zadržal svoj dôkaz. Hra je rozohraná, pretože karty sú už rozdané.
zero_trust.deck_unverified_body=Podpísaný dôkaz o tejto anomálii bol zaznamenaný (v denníku hry, červenou farbou a v tabuľke sporných kariet). Môžete hrať ďalej, ale ak hostiteľovi neveríte, odíďte od stola.
zero_trust.seat_redraw=Hostiteľ "{0}" si vynútil NOVÉ žrebovanie miest. Toto je NEZVYČAJNÉ: žrebovanie je kolektívne a overiteľné, takže hostiteľ si nemôže vybrať miesta, ale MÔŽE sa hádzať znova, kým nedosiahne usporiadanie, ktoré sa mu páči. Ak sa to zopakuje, môže to byť hostiteľ, ktorý sa pokúša pripevniť vaše miesto.
zero_trust.seat_redraw_body=Nové žrebovanie prebiehalo rovnakým spôsobom a je stále overiteľné: nikto, vrátane hostiteľa, nemôže zvoliť výsledok. Môže sa to stať, ak hráč vypadne hneď na začiatku, ale ak vidíte niekoľko pokusov a neveríte hostiteľovi, odíďte od stola. Bolo zaznamenané.
zero_trust.seat_recover_mismatch=Pri obnove hry sa poradie na sedenie zaslané hostiteľom „{0}“ nezhoduje s poradím, ktoré si váš klient uložil: niekto, koho ste už poznali, si zmenil miesto pri stole. Môže to byť hostiteľ, ktorý sa pokúša zmeniť poradie sedadiel pod krytom zotavenia.
zero_trust.seat_recover_mismatch_body=Váš klient si ponechal referenciu na sedenie, ktorú si sám overil na začiatku. Hráči, ktorí sa medzitým pripájajú alebo odchádzajú, je normálne. Zmena poradia niekoho, kto tam už bol, nie je. Ak hostiteľovi neveríte, odíďte od stola. Bolo zaznamenané.
zero_trust.host_recover_action_forged=Hostiteľ sa pokúsil použiť FORGED akciu (neplatný podpis) počas obnovy hry. Váš klient to odmietol.
zero_trust.host_recover_action_omitted=Počas obnovy hostiteľ vynechal akciu, ktorú ste VY prehrali a zaznamenali ste ju vo svojej lokálnej databáze. Váš klient to zistil proti svojej vlastnej kópii a NEVYHNAL v tichosti vašu akciu.
zero_trust.host_recover_balance_mismatch=Hostiteľ sa pokúsil zmeniť váš zostatok (žetóny/vstupné) počas obnovy hry: nezodpovedá vášmu miestnemu rekordu. Váš klient udržal VAŠU skutočnú rovnováhu.
