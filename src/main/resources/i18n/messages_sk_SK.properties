tooltip.cfg.play_own_notes=Tiež prehrá vaše vlastné hlasové poznámky, keď ich odošlete.
tooltip.cfg.notes_retention=Nastavuje, ako dlho sa budú uchovávať hlasové poznámky. Pomocou „Navždy“ sa odstránia iba manuálne.
tooltip.cfg.purge_notes=Okamžite odstráni všetky uložené hlasové poznámky.
tooltip.cfg.view_notes=Otvorí prehliadač pre uložené hlasové poznámky.
tooltip.cfg.voice_notes_rule=Pravidlo tabuľky: umožňuje odosielanie a prijímanie hlasových poznámok.
tooltip.cfg.notes_local=Umožňuje hlasové poznámky na vašom zariadení (nahrávanie a prehrávanie).
tooltip.cfg.tts=Umožňuje čítať nahlas správy pri stole. Každý hráč môže na svojom zariadení stlmiť prevod textu na reč.
tooltip.cfg.display_mode=Vyberte si medzi zobrazením na celú obrazovku, bez okrajov a exkluzívnou celou obrazovkou. Platí pri uložení.
tooltip.cfg.compact_view=Zmenší žetóny a karty, aby sa zobrazilo viac tabuľky. Stavy: vypnuté, kompaktné, kompaktné s malými kartami a tiež do ruky kompaktné.
tooltip.cfg.dialog_zoom=Dialógové okná mierky a ich text. Dá sa zmeniť iba z úvodnej obrazovky. Platí to pre nasledujúce dialógové okno, ktoré otvoríte.
