zero_trust.legit=\u2714\ufe0f [NULOVÁ DÔVERA] MIESTNE RUČNÉ KRYPTOGRAFICKÉ OVERENIE: MOJE KARTY, KARTY KOMUNITY A VŠETKY ZÁZNAMNÉ AKCIE SÚ LEGITÍMNE.
