gdx.settings.tooltip.show_call_cost=Ukazuje, koľko je potrebné na dorovnanie aktuálnej stávky na stole.
gdx.settings.tooltip.anti_dos_warnings=Zobrazuje varovanie, keď ochrana siete zistí príliš veľa požiadaviek.
gdx.settings.tooltip.table_chat_feed=Zobrazuje upozornenia na rozhovory a hry nad stolom. Rýchly chat uchováva celú históriu.
gdx.settings.tooltip.table_speaking_emoji=Zobrazuje žlté emotikony nad reproduktorom počas prevodu textu na reč a hlasových poznámok vrátane vašich vlastných.
gdx.settings.tooltip.chat_images=Umožňuje odosielať obrázky zo stola a zobrazuje prijaté obrázky nad prehrávačom, ktorý ich odoslal.
gdx.settings.tooltip.animations_master=Hlavný prepínač pre animácie, efekty, kinematografiu a prehrávač pokerových videí.
gdx.settings.option.mostrar_videos_poker=Pokerové videá
gdx.settings.tooltip.poker_videos=Zobrazuje hráča v hlavnom menu, lobby a pri stole. Zatvorí sa pri spustení hry a dá sa znova otvoriť z jej ikony.
gdx.settings.tooltip.halo_effects=Ovládacie prvky otáčania, nebezpečenstva a víťaza žiaria okolo sedadiel.
gdx.settings.tooltip.modal_blur=Rozmazáva pozadie za modálnymi dialógmi a upozorneniami.
gdx.settings.tooltip.glass_effects=Ovláda dekoratívny lesk a hĺbku tlačidiel a ovládacích prvkov.
gdx.settings.tooltip.cinematics_master=Povolí alebo zakáže sekvencie ALL-IN a GAME OVER.
gdx.settings.tooltip.cinematic_allin=Zobrazuje vizuálnu sekvenciu, keď hráč prejde na All-in.
gdx.settings.tooltip.cinematic_gameover=Zobrazuje vizuálnu sekvenciu, keď hráčovi dôjdu žetóny.
gdx.settings.tooltip.animation_shuffle=Hrá náhodne pred rozdaním každej ruky.
gdx.settings.tooltip.animation_deal=Oživuje karty lietajúce z balíčka k hráčom a na pozície spoločných kariet.
gdx.settings.tooltip.animation_reveal=Oživuje otáčanie kariet, keď sú odhalené.
gdx.settings.tooltip.animation_position_chips=Animuje dealera, žetóny blindy a straddle sa pohybujú po stole.
gdx.settings.tooltip.animation_counters=Animuje zmeny na stacky, stávky a bank.
gdx.settings.tooltip.animation_seats=Oživuje vstup sedadiel a ich usporiadanie okolo stola.
gdx.settings.tooltip.animation_sort_hand=Animuje kríženie vašich kariet, keď sú zoradené.
gdx.settings.tooltip.animation_final_count=Po skončení hry animuje počet ziskov a strát.
gdx.settings.tooltip.flying_chip_shadows=Tiene žetónov v lete na 3D stole. Vysoká zachová pôvodné vyhladzovanie hrán. Normálna používa menej vzoriek na plynulejšie veľké dokúpenia.
gdx.settings.tooltip.stack_bet_preview=Keď si na ťahu, prejdi kurzorom nad Dorovnaj, Zvýš alebo All-in. Príslušné žetóny sa zvýraznia zlatou. Ak treba rozmeniť, zvýraznia sa žetóny, ktoré pokryjú sumu.
gdx.settings.tooltip.animation_final_summary_cards=Animuje príchod balančných kariet po skončení hry. Vypnite, aby sa karty okamžite zobrazili na mieste.
gdx.settings.tooltip.animation_allin_fire=Zobrazuje oheň za hráčmi, ktorí majú All-in.
gdx.settings.tooltip.animation_winner=Zobrazuje svetlá a častice okolo víťazných miest.
gdx.settings.tooltip.animation_chips=Animuje lietajúce žetóny pri stávkovaní a zbieraní banku.
gdx.settings.tooltip.animation_reseat=Animuje preskupenie stola, keď hráč odíde.
gdx.settings.tooltip.animation_shuffle_cascade=Zobrazuje distribuované náhodné miešanie medzi hráčmi.
gdx.settings.tooltip.auto_fullscreen=Automaticky prejde na celú obrazovku pri spustení stola a vybraný režim okna to umožňuje.
gdx.settings.tooltip.vsync=Synchronizuje snímky s monitorom, aby sa zabránilo roztrhnutiu. Môže znížiť FPS a zvýšiť latenciu.
gdx.settings.tooltip.fps_limit=Čiapky FPS. Po obrazovke nasleduje „Obnovovacia frekvencia monitora“. Vyššia snímková frekvencia spotrebuje viac energie.
gdx.settings.tooltip.msaa=Vyhladzuje geometrické okraje v scéne. Viac vzoriek zvyšuje záťaž o GPU. Platí po reštarte.
gdx.settings.tooltip.card_rendering=Smooth aplikuje na okraje karty ďalší filter. Domorodec ťahá karty priamo.
gdx.settings.tooltip.show_fps=Zobrazuje aktuálny stav FPS a VSync na obrazovke.
gdx.settings.tooltip.show_cpu_memory=Zobrazuje Java CPU a využitie pamäte.
gdx.settings.tooltip.gpu_renderer=Zobrazuje grafický adaptér a ovládač OpenGL používaný hrou.
gdx.settings.tooltip.audio_output=Vyberie zariadenie používané na prehrávanie zvuku hry.
gdx.settings.tooltip.audio_capture=Vyberie mikrofón používaný na nahrávanie hlasových správ.
gdx.settings.tooltip.microphone=Umožňuje nahrávanie a odosielanie hlasových správ z hry.
gdx.settings.tooltip.mic_auto_gain=Automaticky upravuje úroveň mikrofónu, aby kompenzoval hlasy, ktoré sú príliš tiché alebo hlasné.
gdx.settings.tooltip.local_tts=Povolí alebo zablokuje prehrávanie správ prevodu textu na reč na tomto počítači.
gdx.settings.tooltip.auto_buttons=Zobrazuje automatické akcie, ktoré sa môžu spustiť, keď na vás príde rad.
gdx.settings.tooltip.auto_call=Konfiguruje automatické volanie a jeho maximálnu povolenú sumu.
gdx.settings.tooltip.auto_persist=Ponechá vybratú automatickú akciu po jej spustení, kým sa ruka neskončí alebo kým sa výber nezruší.
gdx.settings.tooltip.auto_confirm=Pred spustením automatickej akcie požaduje potvrdenie.
gdx.settings.tooltip.confirm_actions=Vyžaduje potvrdenie pred dôležitými ručnými akciami.
gdx.settings.tooltip.auto_rebuy=Keď vám dôjdu žetóny, automaticky sa dokúpia a sú povolené rebuy.
gdx.settings.tooltip.shortcut=Vyberte riadok a potom stlačte kláves, ktorý chcete priradiť tejto akcii.
gdx.settings.tooltip.rebuy_cap=Určuje, či je limit žetónov po dokúpenie založený na vstupné alebo na najväčšom stacku pri stole.
gdx.settings.tooltip.blind_structures=Otvorí editor na správu štruktúr na úrovni blindy.
gdx.settings.tooltip.blind_unit=Určuje, či je zvýšenie o blindy naplánované podľa odohraných rúk alebo podľa minút.
gdx.settings.tooltip.blind_interval=Nastavuje, koľko rúk alebo minút uplynie medzi nárastmi blindy.
gdx.settings.tooltip.blind_cap_level=Maximálny počet blindy sa zvyšuje od počiatočnej úrovne.
gdx.settings.tooltip.rebuy=Umožňuje hráčom kúpiť si počas hry viac žetónov až do limitu dokúpenie.
