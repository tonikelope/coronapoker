game.mano_verificacion_jugador_ausente=⚠ Upozornenie: {0} neodoslal záverečný podpis. Bezpečné ručné zatváranie bolo zastavené. Dôkaz: {1}
game.mano_verificacion_firma_invalida=⚠ Upozornenie: {0} zistil počas tejto hry neplatný kryptografický podpis. Bezpečné zatváranie bolo zastavené. Dôkaz: {1}
game.popup_verificacion_firma_invalida=Počas tejto hry jeden alebo viacerí účastníci ({0}) zistil neplatný kryptografický podpis akcie.\n\nÚdaje, ktoré dostali všetci účastníci, boli konzistentné (konečné hash reťazca sa zhodovali), ale minimálne jedna akcia nebola riadne podpísaná jej očakávaným autorom.\n\nCoronaPoker zastavil bezpečné zatváranie rúk a po potvrdení tohto varovania zatvorí stôl ako bezpečnostné zlyhanie.\n\nDôkazy uložené v:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Oznámenie: {0} nedostalo čestný dôkaz o náhodnom miešaní za túto kombináciu. Dôkaz: {1}
game.popup_verificacion_host_sin_prueba=Jeden alebo viac účastníkov ({0}) nezískal čestný dôkaz za túto kombináciu.\n\nKonečné hash reťazca sa zhodujú u všetkých účastníkov, takže akcie rúk sú konzistentné. Správny hostiteľ vždy odošle tento dôkaz, takže opakovaná alebo selektívna neprítomnosť môže naznačovať modifikovaný softvér alebo softvérovú chybu.\n\nRuka bola vyrovnaná, ale ako preventívne opatrenie sa odporúča opustiť hru.\n\nDôkazy uložené v:\n{1}
game.popup_verificacion_titulo_alerta=Divergencia kryptografického overenia
game.popup_verificacion_titulo_aviso=Kryptografické overenie nebolo dokončené
game.popup_verificacion_divergente=Jeden alebo viacerí účastníci nahlásili odlišné kryptografické overenie konečného stavu ruky.\n\nMôže to byť spôsobené upraveným softvérom alebo chybou softvéru. CoronaPoker nemôže automaticky určiť príčinu alebo kto ju spôsobil.\n\nCoronaPoker zastavil bezpečné zatváranie rúk a po potvrdení tohto varovania zatvorí stôl ako bezpečnostné zlyhanie.\n\nDôkazy uložené v:\n{0}
game.popup_verificacion_ausente=Posledná hra nemohla dosiahnuť konsenzus, pretože hráč {0} neposlal záverečný podpis.\n\nMôže to byť spôsobené výpadkom siete, zlyhaním klienta alebo upraveným softvérom. CoronaPoker zastavilo bezpečné zatváranie rukou a po potvrdení tohto varovania zatvorí stôl ako zlyhanie zabezpečenia.\n\nEvidencia uložená v:\n{1}
game.mano_verificacion_interrumpida=KRITICKÉ: Bezpečné zatvorenie ruky zlyhalo ({0}). Tabuľka sa zatvorí ako zlyhanie zabezpečenia. Dôkaz: {1}
game.popup_verificacion_interrumpida=CoronaPoker nemohol dokončiť kryptografický záverečný protokol pre poslednú hru.\n\nZlyhanie: {0}\n\n Ruka zostáva otvorená na obnovenie. Tabuľka sa zatvorí ako zlyhanie zabezpečenia až po potvrdení tohto varovania.\n\nEvidencia uložená v:\n{1}
