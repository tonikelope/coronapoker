tooltip.cfg.ante=Lägger till ett påtvingat bidrag till potten efter mörkar. Läget anger vem som betalar och hur mycket.
tooltip.cfg.ante_mode=I traditionellt läge betalar varje aktiv spelare 10 % av stor mörk. I BBA, BA eller SBA betalar knappen stor mörk, eller liten mörk en stor mörk. Mörkar publiceras först.
tooltip.cfg.blind_cap=Stoppar mörkar ökar vid det konfigurerade locket.
tooltip.cfg.blinds_level=Börjar mörkar (liten/stor) för spelet.
tooltip.cfg.bot_balance=När spelet slutar delas botsernas sammanlagda saldo lika mellan de mänskliga spelarna, så riktiga pengar regleras endast mellan människor.
tooltip.cfg.bot_rebuy=Global automatisk återköp kontroll för varje bot. Om du stänger av den inaktiveras också inställningarna återköp för anpassade bots.
tooltip.cfg.bots=Ställer in svårighetsgraden för standardrobotar. Anpassade bots håller svårigheten konfigurerad individuellt i bothanteraren.
tooltip.cfg.buyin_fixed=Alla börjar med samma inköp. När avstängd väljer spelarna inom det konfigurerade intervallet.
tooltip.cfg.double_blinds=Avancerar till nästa mörkar-nivå i strukturen efter ett visst antal händer eller minuter.
tooltip.cfg.hand_limit=Spelet slutar när detta antal händer har uppnåtts.
tooltip.cfg.iwtsth=Låter dig be om att få se en rivals hand vid visning.
tooltip.cfg.rabbit=Avslöjar outdelade gemensamma kort efter handen. Varje spelares första begäran är gratis. Det valda läget ställer in om senare förfrågningar förblir gratis eller kostar en liten eller stor mörk.
tooltip.cfg.rebuy_limit=Maximalt återköp per spelare.
tooltip.cfg.recover=Återupptar ett spel som tidigare avbrutits.
tooltip.cfg.rit=Tillåter en röst att dela ut de återstående korten två gånger när en All-in stänger vadslagning.
tooltip.cfg.straddle=Spelaren efter stor mörk får lägga upp två stor mörk innan han ser sina kort och agerar senast före floppen.
tooltip.cfg.straddle_on_timeout=Lägg upp straddle automatiskt när meddelandet tar slut. Detta påverkar endast din spelare och är avstängt som standard.
tooltip.cfg.structure=Mörkar-nivåstruktur för spelet.
tooltip.cfg.think_time=Sekunder tillgängliga för att avgöra. Den automatiska åtgärden körs när tiden löper ut.
tooltip.cfg.showdown_time=I sekunder förblir handresultatet på skärmen innan nästa hand delas ut.
tooltip.cfg.allow_hot_join=Tillåter nya spelare att gå med som UPPVÄRMNING och gå in i nästa hand. När det ändras under ett spel, påverkar det bara nya anslutningsförsök.
tooltip.cfg.card_flip_duration=Anger hur lång tid det tar för varje kort att slutföra sin tur när det avslöjas.
tooltip.cfg.community_reveal_style=Välj hur de gemensamma korten vänds. Varje vy sparar sitt eget val. Som standard vänds korten stelt i 2D och flexibelt i 3D.
tooltip.cfg.card_flip_direction=Väljer åt vilket håll korten vänder sig när de avslöjas. Mixed väljer en riktning för varje avslöjande. Kort i samma grupp vänds ihop på samma sätt.
tooltip.cfg.card_flip_zoom=Förstorar kort under vändningen så att de ser ut att röra sig mot skärmen.
tooltip.cfg.reparto_velocidad=Ställer in hur lång tid varje kort tar att resa från kortleken till sitt säte.
tooltip.cfg.community_deal_style=Välj om alla fem gemensamma kort ska delas ut med framsidan nedåt i början eller på deras egen gata. Sparade ändringar gäller från nästa hand.
tooltip.cfg.anim_calidad=Kvalitet behåller varje visuell detalj. Prestanda minskar kostnaden för kortflyg och avslöjar på svagare datorer.
tooltip.cfg.downgrade_velocidad=Ställer in hur lång tid det tar för bordet att ordna om sina platser när en spelare lämnar.
