zero_trust.peer_sra_corrupt=visning-signaturen är äkta men kamratens SRA-nyckel löser sig inte till giltiga kort. Detta händer bara om kamraten avsiktligt har signerat en korrupt nyckel eller om deras klient är buggig. Vi kan inte säga vilket, och för säkerhets skull avslutar vi matchen.
zero_trust.straddle_recover_mismatch=Medan han återställde handen meddelade värden en straddle annorlunda än den som din egen lokala kopia hade spelat in. Detta händer bara om värden manipulerar den återställda straddle eller om dess klient är buggig. Handen är fortfarande rekonstruerad från din betrodda kopia, men vi varnar dig som en försiktighetsåtgärd.
zero_trust.rit_recover_mismatch=Medan han återställde handen tillkännagav värden ett kör-det-två gånger-resultat som skilde sig från det som din egen lokala kopia hade spelat in. Detta händer bara om värden manipulerar det återställda resultatet eller om dess klient är buggig. Handen är fortfarande rekonstruerad från din betrodda kopia, men vi varnar dig som en försiktighetsåtgärd.
