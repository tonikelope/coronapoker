zero_trust.action_rejected_invalid_signature=\u26a0\ufe0f [ZERO-TRUST] Åtgärd avvisad (ogiltig signatur) -> {0}
zero_trust.auditing_memory=[ZERO-TRUST] Granskning svärm RAM minne...
zero_trust.binary_log_loaded=\u2714\ufe0f [ZERO-TRUST] Binär logg laddad i minnet ({0} signaturer redo för Synchronized Replay).
zero_trust.cascade_failed=\u274c [ZERO-TRUST] Kryptografisk shuffle-kaskad misslyckades. Handen har avbrutits.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Det gick inte att låsa upp privata kort (en spelare svarade inte i tid). Handen har avbrutits.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Ett dekrypterat kort matchar inte något giltigt kort i kortleken. Spelet har ställts in.
peer.not_enough_players=En spelare tappade under shuffle och det finns inte längre tillräckligt med spelare för att dela ut handen.
peer.unlock_no_testament=En spelare kopplade från utan att lämna sin dekrypteringsnyckel. Handen har avbrutits.
peer.broadcast_failed=Nätverksfel vid sändning av privata kort. Handen har avbrutits.
peer.recovery_action_data_unavailable=Den sparade åtgärdshistoriken kunde inte läsas. Handen har avbrutits på ett säkert sätt och kommer att återgå till återhämtning.
straddle.deferred_release_failed=mörkar straddle-korten kunde inte avslöjas (en spelare kopplade ur eller vägrade att samarbeta). Handen har avbrutits.
peer.state_inconsistent=Återförsäljarstaten blev inkonsekvent. Handen har avbrutits.
peer.bot_no_token=En bot har inte sin dekrypteringsnyckel redo. Handen har avbrutits.
peer.community_unlock_no_testament=En spelare kopplade ur utan att lämna sin nyckel för att avslöja gemensamma kort. Handen har avbrutits.
peer.dropped_during_cascade=En spelare kopplades bort under den kryptografiska blandningen av leken. Handen har avbrutits.
peer.dropped_during_rotation=En spelare frånkopplad under kortlekens kryptografiska rotation. Handen har avbrutits.
zero_trust.rotation_refused=En ansluten spelare vägrade att leverera sin däckrotationsnyckel. Spelet är stoppat. De kommer att behöva motivera sin vägran att bli återintagen.
zero_trust.cascade_refused=En ansluten spelare vägrade att delta i lekens shuffle-kaskade. Spelet är stoppat. De kommer att behöva motivera sin vägran att bli återintagen.
zero_trust.pocket_unlock_refused=En ansluten spelare vägrade att leverera sin nyckel för att dekryptera fickkort. Spelet är stoppat. De kommer att behöva motivera sin vägran att bli återintagen.
zero_trust.community_unlock_refused=En ansluten spelare vägrade lämna ut sin nyckel för att avslöja gemensamma kort. Spelet är stoppat. De kommer att behöva motivera sin vägran att bli återintagen.
zero_trust.host_showdown_sig_missing=En visning-nyckel togs emot från servern UTAN författarens kryptografiska signatur, eller med en felaktig signatur. Servern kan ersätta nyckeln på tråden.
zero_trust.host_showdown_sig_invalid=En visning-nyckel togs emot från servern med en OGILTIG kryptografisk signatur. Servern kan ersätta nyckeln på tråden.
zero_trust.host_potcards_mismatch=visning klartexten som skickas av servern stämmer inte överens med resultatet av att dekryptera din lokala del med den signerade nyckeln. Servern kan skicka falska kort på visning.
zero_trust.host_community_garbage=De kryptografiska community-kortdata som tas emot från servern är inkonsekventa (biten dekrypterar inte till ett giltigt kortlek eller matchar inte serverns undertecknade meddelande). Möjliga orsaker: en BUG i någon version av programvaran, en serverversion vars kod kan ha ändrats eller korruption av lokal identitetsnyckel. Klienten kan inte se skillnad och anklagar INTE någon.
zero_trust.host_unlock_out_of_order=En dekrypteringsbegäran har mottagits från servern i oordning (fel gata, upprepad plats, fas ur ordning eller begäran utfärdad innan föregående gata stängdes).
zero_trust.host_cascade_mid_hand=En shuffle-omstartsbegäran har mottagits från servern mitt i en pågående hand (skulle skriva över min dekrypteringsnyckel).
zero_trust.host_pocket_extraction=En dekrypteringsförfrågan har mottagits från servern som skulle påverka DINA EGNA privata kort.
zero_trust.host_community_extraction=En dekrypteringsbegäran har mottagits från servern som skulle avslöja ett gemensamt kort i förväg.
zero_trust.host_rotation_replay=Servern begärde en andra kortrotation i samma hand. Den legitima rotationen är unik per hand. En upprepning föreslår ett försök att använda din klient för att dekryptera andra spelares kort.
zero_trust.host_shuffle_proof_failed=Affärsverifieringen misslyckades: kortleken servern delade ut kunde inte bevisas vara en ärlig blandning av genesis-däcket. Gemenskapsupplåsningar har nekats och den här sessionen avslutas för att skydda privata kort.
zero_trust.host_shuffle_proof_missing=Dealen anlände utan ett verifierbart ärligt shuffle-bevis för den här handens kortlek, och gemensamma kort avslöjas nu. Det kan vara en bugg eller en nätverksfördröjning, eller en värd som försöker manipulera affären. Du kan fortsätta spela, men att lämna detta bord rekommenderas starkt.
zero_trust.deck_unverified=Den här handens kortlek kunde INTE verifieras som en ärlig blandning. MISSTÄNK: programledaren "{0}", som delar ut och sänder shuffle-beviset. Det kan vara värden som manipulerar affären eller en spelare som undanhållit sitt bevis. Handen spelas ut eftersom korten redan är utdelade.
zero_trust.deck_unverified_body=Undertecknade bevis på denna anomali har registrerats (i spelloggen, i rött och i tabellen över omstridda händer). Du kan fortsätta spela, men om du inte litar på värden, lämna bordet.
zero_trust.seat_redraw=Värden "{0}" tvingade fram en NY lottdragning. Detta är OVENLIGT: dragningen är kollektiv och verifierbar, så värden kan inte välja platser, men den KAN rulla om tills den får ett arrangemang som den gillar. Om det upprepas kan det vara värden som försöker rigga din plats.
zero_trust.seat_redraw_body=Den nya dragningen gick på samma sätt och är fortfarande verifierbar: ingen, inklusive värden, kan välja resultatet. Det kan hända om en spelare tappade direkt i början, men om du ser flera försök igen och du inte litar på värden, lämna bordet. Det har loggats.
zero_trust.seat_recover_mismatch=Vid spelåterställning stämmer INTE platsordningen som skickas av värden "{0}" med den som din klient hade sparat: någon du redan kände har bytt plats vid bordet. Det kan vara en värd som försöker ordna om platserna i skydd av återhämtningen.
zero_trust.seat_recover_mismatch_body=Din klient behöll sittplatsreferensen den verifierade sig själv i början. Spelare som går med eller lämnar däremellan är normalt. Att göra om någon som redan var där är inte. Om du inte litar på värden, lämna bordet. Det har loggats.
zero_trust.host_recover_action_forged=Värden försökte injicera en FORGED-åtgärd (ogiltig signatur) under spelåterställning. Din klient vägrade det.
zero_trust.host_recover_action_omitted=Under återställningen utelämnade värden en åtgärd som DU spelade upp och hade registrerat i din lokala databas. Din klient upptäckte det mot sin egen kopia och avbröt INTE din åtgärd tyst.
zero_trust.host_recover_balance_mismatch=Värden försökte ändra ditt saldo (marker/inköp) under spelåterställningen: det matchar inte ditt lokala rekord. Din klient behöll DIN verkliga balans.
zero_trust.host_board_peek=Värden begärde att dekryptera ett gemensamt kort från en FRAMTIDA gata (ett försök att läsa tavlan tidigt). Din klient vägrade.
zero_trust.suspect_host_prefix=SUSPECT: värd "{0}".
zero_trust.suspect_peer_prefix=SUSPECT: spelare "{0}".
zero_trust.peer_alert=⚠️ [ANOMALT SPELARBETEENDE]
zero_trust.peer_suspicious_header=Onormalt eller kränkande beteende från en spelare har upptäckts vid ditt bord:\n
zero_trust.peer_suspicious_body=Tabellen tillämpade den matchande säkerhetsåtgärden och spelet fortsätter för de andra spelarna. God tro förutsätts. Det kan vara ett programvarufel och ingen anklagas. Bevisen är nedtecknad.
zero_trust.peer_inbound_flood=Ihållande autentiserad trafik över anti-DoS-tröskeln.
zero_trust.peer_binary_flood=Röstmeddelanden skickas i en ovanligt hög hastighet.
zero_trust.host_binary_flood=Värden skickar röstmeddelandeoperationer i en ovanligt hög hastighet.
zero_trust.peer_flood_log=Anti-DoS-incident som väntar på beslut: spelare {0}, IP {1}. Orsak: {2}
zero_trust.peer_flood_confirm=Användaren {0} skickar en överdriven mängd trafik. Detta kan vara en DoS-attack eller en bugg. Utvisa dem från spelet?\n\nIP: {1}\nDetekterad orsak: {2}
zero_trust.peer_flood_suppress=Visa inte dessa varningar
zero_trust.peer_hand_ready_withheld=En spelare svarar PING men bekräftar inte att han är redo för nästa hand medan spelet pågår. Det höll på att frysa handstarten och har blivit utvisad. Spelet fortsätter utan dem.
zero_trust.peer_action_withheld=En spelare svarar PING men skickar inte sin vadslagning medan spelet pågår, efter sin tanketid. Det höll på att frysa och har blivit utvisat. Spelet fortsätter utan dem.
zero_trust.peer_conf_withheld=En spelare svarar PING men bekräftar inte mottagandet av ett dealingsmeddelande medan spelet körs. Den blockerade bordet från att avancera och har blivit utvisad. Spelet fortsätter utan dem.
zero_trust.peer_deal_refusal_expelled=En spelare tvingade fram flera handavbokningar i rad genom att vägra blandning eller rotation av kortleken. Den har UTVISADS så att spelet kan fortsätta.
zero_trust.suspicious_alert=⚠️ [ANOMALT SERVERBETEENDE]
zero_trust.suspicious_header=Din klient har upptäckt avvikande serverbeteende (inte en kritisk incident som fryser spelet):\n
zero_trust.suspicious_body=Din klient avvisade den onormala operationen och spelet KAN fortsätta. Vi förutsätter god tro: detta kan vara en mjukvaru-BUG (klient eller server) och ingen anklagas. Men eftersom en bugg inte kan ses förutom manipulering, REKOMMENDERAS DET STARKT FÖR DIN SÄKERHET ATT LÄMNA bordet med knappen 'Lämna' (dina pengar kommer INTE att behandlas i denna hand).
zero_trust.host_bad_wire=En dekrypteringsbegäran har mottagits från servern med ett ogiltigt format eller punkter som inte hör till den kryptografiska kurvan.
zero_trust.host_critical_command_invalid=Det kritiska {0}-kommandot som skickades av servern kunde inte valideras. Detta kan vara en inkompatibilitet, en bugg eller en modifierad server. Sessionen stoppas för att skydda dess integritet.
