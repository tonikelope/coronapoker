game.popup_verificacion_host_sin_prueba=En eller flera deltagare ({0}) fick inte det ärliga-shuffle-beviset för denna hand.\n\nDe sista kedjehascharna matchar alla deltagare, så handåtgärderna är konsekventa. En korrekt värd skickar alltid detta bevis, så en upprepad eller peer-selektiv frånvaro kan indikera modifierad programvara eller ett programvarufel.\n\nHanden var avgjord, men att lämna spelet rekommenderas som en försiktighetsåtgärd.\n\nBevis sparat i:\n{1}
