gdx.settings.tooltip.animation_allin_fire=Visar eld bakom spelare som är All-in.
gdx.settings.tooltip.animation_winner=Visar ljus och partiklar runt vinnande platser.
gdx.settings.tooltip.animation_chips=Animerar marker som flyger när du satsar och samlar in potten.
gdx.settings.tooltip.animation_reseat=Animerar bordet som omarrangeras när en spelare lämnar.
gdx.settings.tooltip.animation_shuffle_cascade=Visar den distribuerade blandningen som rör sig mellan spelare.
gdx.settings.tooltip.auto_fullscreen=Går automatiskt in i helskärm när tabellen startar och det valda fönsterläget tillåter det.
gdx.settings.tooltip.vsync=Synkroniserar ramar med monitorn för att förhindra sönderrivning. Det kan sänka FPS och öka latensen.
gdx.settings.tooltip.fps_limit=Kepsar FPS. "Övervaka uppdateringsfrekvens" följer din skärm. Högre bildhastigheter använder mer kraft.
gdx.settings.tooltip.msaa=Jämnar ut geometriska kanter i scenen. Fler prover ökar GPU belastningen. Gäller efter omstart.
gdx.settings.tooltip.card_rendering=Smooth applicerar ett extra filter på kortkanterna. Native drar korten direkt.
gdx.settings.tooltip.show_fps=Visar aktuell FPS och VSync-status på skärmen.
gdx.settings.tooltip.show_cpu_memory=Visar Java CPU och minnesanvändning.
gdx.settings.tooltip.gpu_renderer=Visar grafikkortet och OpenGL drivrutinen som används av spelet.
gdx.settings.tooltip.audio_output=Väljer enheten som används för att spela spelljud.
gdx.settings.tooltip.audio_capture=Väljer mikrofonen som används för att spela in röstmeddelanden.
gdx.settings.tooltip.microphone=Tillåter att spela in och skicka röstmeddelanden från spelet.
gdx.settings.tooltip.mic_auto_gain=Justerar automatiskt mikrofonnivån för att kompensera för röster som är för tysta eller höga.
gdx.settings.tooltip.local_tts=Tillåter eller blockerar uppspelning av text-till-tal-meddelanden på den här datorn.
gdx.settings.tooltip.auto_buttons=Visar automatiska åtgärder som kan köras när din tur kommer.
gdx.settings.tooltip.auto_call=Konfigurerar automatiska samtal och dess högsta tillåtna antal.
gdx.settings.tooltip.auto_persist=Behåller den automatiska åtgärden vald efter att den körts tills handen slutar eller valet rensas.
gdx.settings.tooltip.auto_confirm=Begär bekräftelse innan en automatisk åtgärd körs.
gdx.settings.tooltip.confirm_actions=Begär bekräftelse före viktiga manuella åtgärder.
gdx.settings.tooltip.auto_rebuy=Köper in automatiskt igen när du får slut på marker och återköp är tillåtna.
gdx.settings.tooltip.shortcut=Välj raden och tryck sedan på tangenten du vill tilldela den här åtgärden.
gdx.settings.tooltip.rebuy_cap=Väljer om markerna efter en återköp baseras på inköp eller den största stapeln vid bordet.
gdx.settings.tooltip.blind_structures=Öppnar redigeraren för att hantera strukturer på mörkar-nivå.
gdx.settings.tooltip.blind_unit=Väljer om mörkar ökningar ska schemaläggas efter spelade händer eller minuter.
