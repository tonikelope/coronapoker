tooltip.cfg.custom_bots=Aktiverar den anpassade katalogen. Konfigurerade profiler läggs till först, följt av standardbotar.
tooltip.cfg.custom_bots.only=Förhindrar att standardrobotar läggs till. Inga fler bots kan läggas till efter att den anpassade katalogen är slut.
tooltip.cfg.custom_bots.manage=Öppna hanteraren för att skapa, redigera och beställa dina bots. Du kan välja deras svårighetsgrad och stil.
tooltip.cfg.custom_bots.row=Välj den här boten för att redigera dess namn, avatar, svårighetsgrad, stil eller återköp.
tooltip.cfg.custom_bots.avatar=Välj en giltig bild eller behåll den officiella botavataren. CoronaPoker lagrar en säker kopia så att den inte går förlorad.
tooltip.cfg.custom_bots.name=Ange det synliga namnet utan $. Den reserverade markören läggs till automatiskt.
tooltip.cfg.custom_bots.difficulty=Sätter utmaningen och taktiken som boten använder. Lätt spelar fritidsmässigt, Normal använder en mer disciplinerad strategi och Hard använder avancerad taktik.
tooltip.cfg.custom_bots.personality=Ställer in basstilen. Random väljer den när boten skapas och behåller den för den aktiva sessionen. Boten kan anpassa sina beslut till situationen.
gdx.settings.option_help.bot_difficulty.easy=Spelar slentrianmässigt och gör misstag oftare.
gdx.settings.option_help.bot_difficulty.medium=Använder en mer disciplinerad strategi och justerar beslut när handen utvecklas.
gdx.settings.option_help.bot_difficulty.hard=Använder mer avancerad taktik, som att stjäla mörkar eller utöva press när en motståndare ser sårbar ut.
gdx.settings.option_help.custom_bot_personality.random=Väljer en stil när boten skapas och behåller den för den aktiva sessionen.
gdx.settings.option_help.custom_bot_personality.nit=Anger få händer och väntar vanligtvis på starka kort innan du riskerar marker.
gdx.settings.option_help.custom_bot_personality.station=Tenderar att syna satsningar och stanna kvar i handen. Höjer mer sällan.
gdx.settings.option_help.custom_bot_personality.tag=Väljer händer selektivt och tenderar att ta ledningen med satsningar och höjningar.
gdx.settings.option_help.custom_bot_personality.lag=Spelar ett bredare urval av händer och applicerar press med frekventa satsningar och höjningar.
gdx.settings.option_help.ante_mode.traditional=Varje aktiv spelare lägger en tiondel av stor mörk, avrundat till närmaste cent.
gdx.settings.option_help.ante_mode.big_blind=Spelaren i stor mörk lägger upp hela ante, lika med en stor mörk.
