gdx.settings.tooltip.animation_reveal=Animerar kort som vänds när de avslöjas.
gdx.settings.tooltip.animation_position_chips=Animerar dealern, mörkar och straddle marker som rör sig runt bordet.
gdx.settings.tooltip.animation_counters=Animerar ändringar av stackar, satsningar och potten.
