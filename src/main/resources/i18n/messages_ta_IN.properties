gdx.settings.tooltip.amount_decimal_zeros=முழு சிப் தொகைகளும் தசமங்கள் இல்லாமல் காட்டப்படுகின்றன, எடுத்துக்காட்டாக 9. பகுதி அளவுகளுக்கு, இல்லை (இயல்புநிலை) 6.2 ஐக் காட்டுகிறது. அறை இருந்தால் மட்டுமே 6.20ஐப் பொருத்தி, எழுத்துரு அளவைக் குறைக்கும் முன் 6.2ஐ முயற்சிக்கவும். எப்பொழுதும் 6.20ஐ வைத்து, தேவைப்பட்டால் எழுத்துரு அளவைக் குறைக்கும். மூன்று முறைகளிலும் குறிப்பிடத்தக்க இலக்கங்கள் வைக்கப்பட்டுள்ளன.
