game.popup_verificacion_divergente=ஒன்று அல்லது அதற்கு மேற்பட்ட பங்கேற்பாளர்கள் இறுதி கை நிலையின் வேறுபட்ட கிரிப்டோகிராஃபிக் சரிபார்ப்பைப் புகாரளித்தனர்.\n\nஇது மாற்றியமைக்கப்பட்ட மென்பொருள் அல்லது மென்பொருள் குறைபாட்டால் ஏற்படலாம். CoronaPoker காரணத்தையோ அல்லது யார் உருவானதையோ தானாக கண்டறிய முடியாது.\n\nCoronaPoker பாதுகாப்பான கை மூடுதலை நிறுத்தி, இந்த எச்சரிக்கையை ஒப்புக்கொண்ட பிறகு, பாதுகாப்பு தோல்வி என டேபிளை மூடும்.\n\nசான்றுகள் இதில் சேமிக்கப்பட்டுள்ளன:\n{0}
game.popup_verificacion_ausente=கடைசி கை ஆட்டக்காரர் என்பதால் ஒருமித்த கருத்தை எட்ட முடியவில்லை {0} இறுதி கையெழுத்தை அனுப்பவில்லை.\n\nநெட்வொர்க் செயலிழப்பு, கிளையன்ட் தோல்வி அல்லது மாற்றியமைக்கப்பட்ட மென்பொருளால் இது ஏற்படலாம். CoronaPoker பாதுகாப்பான கை மூடுதலை நிறுத்தியது மற்றும் இந்த எச்சரிக்கையை ஒப்புக்கொண்ட பிறகு பாதுகாப்பு தோல்வி என அட்டவணையை மூடும்.\n\nசான்றுகள் இதில் சேமிக்கப்பட்டுள்ளன:\n{1}
