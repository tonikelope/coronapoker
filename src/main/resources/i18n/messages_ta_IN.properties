ui.identicon.tooltip_lista=AES அமர்வு அடையாளத்தைக் காண எந்த பிளேயரையும் வலது கிளிக் செய்யவும் (நெட்வொர்க் MITM கண்டறிதல்)
ui.identicon.no_verificada=இந்த விசை பாதுகாப்பான வெளிப்புற சேனல் மூலம் சரிபார்க்கப்படவில்லை (எ.கா. WhatsApp, Telegram). மற்ற பிளேயரின் விசையுடன் இது பொருந்துகிறது என்பதை உறுதிப்படுத்தியவுடன், "அடையாளத்தை சரிபார்க்கவும்" என்பதைக் கிளிக் செய்யவும்.
