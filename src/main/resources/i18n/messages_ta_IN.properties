about.software_license=CoronaPoker இன் மூலக் குறியீடு GNU பொதுப் பொது உரிமத்தின் பதிப்பு 3 (GPLv3) கீழ் விநியோகிக்கப்படுகிறது. மூன்றாம் தரப்பு வளங்கள் அவற்றின் சொந்த உரிமைகளுக்கும் உரிமங்களுக்கும் உட்பட்டவை.
