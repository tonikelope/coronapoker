zero_trust.cascade_failed=\u274c [ZERO-TRUST] கிரிப்டோகிராஃபிக் ஷஃபிள் கேஸ்கேட் தோல்வியடைந்தது. கை ரத்து செய்யப்பட்டுள்ளது.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] தனிப்பட்ட கார்டுகளைத் திறக்க முடியவில்லை (ஒரு வீரர் சரியான நேரத்தில் பதிலளிக்கவில்லை). கை ரத்து செய்யப்பட்டுள்ளது.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] டிக்ரிப்ட் செய்யப்பட்ட கார்டு டெக்கில் உள்ள எந்த செல்லுபடியாகும் கார்டுடனும் பொருந்தவில்லை. ஆட்டம் ரத்து செய்யப்பட்டது.
peer.not_enough_players=ஆட்டத்தின் போது ஒரு வீரர் கைவிடப்பட்டார், மேலும் கையை சமாளிக்க போதுமான வீரர்கள் இல்லை.
peer.unlock_no_testament=ஒரு பிளேயர் தங்கள் மறைகுறியாக்க விசையை விட்டு வெளியேறாமல் துண்டிக்கப்பட்டார். கை ரத்து செய்யப்பட்டுள்ளது.
peer.broadcast_failed=தனிப்பட்ட கார்டுகளை ஒளிபரப்பும்போது நெட்வொர்க் பிழை. கை ரத்து செய்யப்பட்டுள்ளது.
peer.recovery_action_data_unavailable=சேமிக்கப்பட்ட செயல் வரலாற்றைப் படிக்க முடியவில்லை. கை பத்திரமாக ரத்து செய்யப்பட்டுள்ளது மற்றும் மீட்கப்படும்.
straddle.deferred_release_failed=கட்டாயப் பந்தயங்கள் ஸ்ட்ராடில் கார்டுகளை வெளிப்படுத்த முடியவில்லை (ஒரு பிளேயர் துண்டிக்கப்பட்டார் அல்லது ஒத்துழைக்க மறுத்தார்). கை ரத்து செய்யப்பட்டுள்ளது.
peer.state_inconsistent=வியாபாரி நிலை சீரற்றதாக மாறியது. கை ரத்து செய்யப்பட்டுள்ளது.
peer.bot_no_token=ஒரு போட் அதன் மறைகுறியாக்க விசையை தயாராக வைத்திருக்கவில்லை. கை ரத்து செய்யப்பட்டுள்ளது.
peer.community_unlock_no_testament=சமூக அட்டைகளை வெளிப்படுத்த ஒரு வீரர் தனது சாவியை விட்டுவிடாமல் துண்டிக்கப்பட்டார். கை ரத்து செய்யப்பட்டுள்ளது.
peer.dropped_during_cascade=டெக் கிரிப்டோகிராஃபிக் ஷஃபிளின் போது பிளேயர் துண்டிக்கப்பட்டது. கை ரத்து செய்யப்பட்டுள்ளது.
peer.dropped_during_rotation=டெக் கிரிப்டோகிராஃபிக் சுழற்சியின் போது ஒரு வீரர் துண்டிக்கப்பட்டார். கை ரத்து செய்யப்பட்டுள்ளது.
zero_trust.rotation_refused=இணைக்கப்பட்ட பிளேயர் தனது டெக்-சுழற்சி விசையை வழங்க மறுத்துவிட்டார். ஆட்டம் நிறுத்தப்பட்டுள்ளது. அவர்கள் மீண்டும் அனுமதிக்க மறுத்ததை நியாயப்படுத்த வேண்டும்.
zero_trust.cascade_refused=இணைக்கப்பட்ட வீரர் டெக் ஷஃபிள் கேஸ்கேடில் பங்கேற்க மறுத்துவிட்டார். ஆட்டம் நிறுத்தப்பட்டுள்ளது. அவர்கள் மீண்டும் அனுமதிக்க மறுத்ததை நியாயப்படுத்த வேண்டும்.
zero_trust.pocket_unlock_refused=இணைக்கப்பட்ட பிளேயர் பாக்கெட் கார்டுகளை டிக்ரிப்ட் செய்ய தங்கள் சாவியை வழங்க மறுத்துவிட்டார். ஆட்டம் நிறுத்தப்பட்டுள்ளது. அவர்கள் மீண்டும் அனுமதிக்க மறுத்ததை நியாயப்படுத்த வேண்டும்.
zero_trust.community_unlock_refused=இணைக்கப்பட்ட பிளேயர் சமூக அட்டைகளை வெளிப்படுத்த தங்கள் சாவியை வழங்க மறுத்துவிட்டார். ஆட்டம் நிறுத்தப்பட்டுள்ளது. அவர்கள் மீண்டும் அனுமதிக்க மறுத்ததை நியாயப்படுத்த வேண்டும்.
zero_trust.host_showdown_sig_missing=ஆசிரியரின் கிரிப்டோகிராஃபிக் கையொப்பம் இல்லாமல் அல்லது தவறான கையொப்பத்துடன் சேவையகத்திலிருந்து அட்டைகளை வெளிப்படுத்துதல் விசை பெறப்பட்டது. சேவையகம் கம்பியில் உள்ள விசையை மாற்றியமைக்கலாம்.
zero_trust.host_showdown_sig_invalid=தவறான கிரிப்டோகிராஃபிக் கையொப்பத்துடன் சேவையகத்திலிருந்து அட்டைகளை வெளிப்படுத்துதல் விசை பெறப்பட்டது. சேவையகம் கம்பியில் உள்ள விசையை மாற்றியமைக்கலாம்.
zero_trust.host_potcards_mismatch=கையொப்பமிடப்பட்ட விசையுடன் உங்கள் உள்ளூர் பகுதியை டிக்ரிப்ட் செய்வதன் விளைவாக சேவையகத்தால் அனுப்பப்பட்ட அட்டைகளை வெளிப்படுத்துதல் எளிய உரை பொருந்தவில்லை. சேவையகம் அட்டைகளை வெளிப்படுத்துதல் இல் போலி கார்டுகளை அனுப்பலாம்.
zero_trust.host_community_garbage=சேவையகத்திலிருந்து பெறப்பட்ட கிரிப்டோகிராஃபிக் சமூக-அட்டை தரவு சீரற்றதாக உள்ளது (துண்டு சரியான டெக் கார்டில் டிக்ரிப்ட் செய்யப்படவில்லை அல்லது சேவையகத்தின் கையொப்பமிடப்பட்ட அறிவிப்புடன் பொருந்தவில்லை). சாத்தியமான காரணங்கள்: மென்பொருளின் சில பதிப்பில் ஒரு பிழை, குறியீடு மாற்றப்பட்டிருக்கும் சேவையக பதிப்பு அல்லது உள்ளூர் அடையாள-விசை சிதைவு. வாடிக்கையாளர் வித்தியாசத்தை சொல்ல முடியாது மற்றும் யாரையும் குற்றம் சாட்டவில்லை.
zero_trust.host_unlock_out_of_order=சேவையகத்திலிருந்து ஒரு டிக்ரிப்ஷன் கோரிக்கை வரிசைக்கு வெளியே பெறப்பட்டது (தவறான தெரு, மீண்டும் மீண்டும் ஸ்லாட், ஒழுங்கற்ற நிலை அல்லது முந்தைய தெரு மூடுவதற்கு முன் வழங்கப்பட்ட கோரிக்கை).
zero_trust.host_cascade_mid_hand=நடந்து கொண்டிருக்கும் கையின் நடுவில் உள்ள சர்வரில் இருந்து ஷஃபிள் மறுதொடக்கம் கோரிக்கை பெறப்பட்டது (எனது மறைகுறியாக்க விசையை மேலெழுதும்).
zero_trust.host_pocket_extraction=உங்கள் சொந்த தனிப்பட்ட கார்டுகளைப் பாதிக்கும் ஒரு மறைகுறியாக்கக் கோரிக்கை சேவையகத்திலிருந்து பெறப்பட்டது.
zero_trust.host_community_extraction=சேவையகத்திலிருந்து டிக்ரிப்ஷன் கோரிக்கை பெறப்பட்டது, இது சமூக அட்டையை முன்கூட்டியே வெளிப்படுத்தும்.
zero_trust.host_rotation_replay=சேவையகம் அதே கையில் இரண்டாவது அட்டை சுழற்சியைக் கோரியது. முறையான சுழற்சி ஒரு கைக்கு தனித்துவமானது. மற்ற வீரர்களின் கார்டுகளை மறைகுறியாக்க உங்கள் கிளையண்டைப் பயன்படுத்துவதற்கான முயற்சியை மீண்டும் மீண்டும் பரிந்துரைக்கிறது.
zero_trust.host_shuffle_proof_failed=ஒப்பந்த சரிபார்ப்பு தோல்வியடைந்தது: சர்வர் டீல் செய்த டெக் ஜெனிசிஸ் டெக்கின் நேர்மையான மாற்றமாக நிரூபிக்கப்படவில்லை. சமூகத் திறப்புகள் மறுக்கப்பட்டு, தனிப்பட்ட கார்டுகளைப் பாதுகாக்க இந்த அமர்வு நிறுத்தப்படுகிறது.
zero_trust.host_shuffle_proof_missing=இந்தக் கைத்தளத்திற்கான சரிபார்க்கக்கூடிய நேர்மையான-குலைப்பு ஆதாரம் இல்லாமல் இந்த ஒப்பந்தம் வந்துள்ளது, மேலும் சமூக அட்டைகள் இப்போது வெளிப்படுத்தப்படுகின்றன. இது ஒரு பிழை அல்லது நெட்வொர்க் தாமதமாக இருக்கலாம் அல்லது ஒப்பந்தத்தை கையாள முயற்சிக்கும் ஹோஸ்ட். நீங்கள் தொடர்ந்து விளையாடலாம், ஆனால் இந்த அட்டவணையை விட்டு வெளியேறுவது கடுமையாக பரிந்துரைக்கப்படுகிறது.
zero_trust.deck_unverified=இந்த கையின் தளம் ஒரு நேர்மையான ஷஃபிள் என சரிபார்க்க முடியவில்லை. சந்தேகம்: புரவலன் "{0}", ஷஃபிள் ஆதாரத்தை டீல் செய்து ஒளிபரப்புகிறார். இது ஒப்பந்தத்தை கையாளும் புரவலராக இருக்கலாம் அல்லது அவர்களின் ஆதாரத்தை நிறுத்திய வீரராக இருக்கலாம். அட்டைகள் ஏற்கனவே கொடுக்கப்பட்டதால் கை வெளியே விளையாடப்படுகிறது.
zero_trust.deck_unverified_body=இந்த ஒழுங்கின்மைக்கான கையொப்பமிடப்பட்ட சான்றுகள் பதிவு செய்யப்பட்டுள்ளன (விளையாட்டு பதிவில், சிவப்பு நிறத்தில் மற்றும் சர்ச்சைக்குரிய கை அட்டவணையில்). நீங்கள் தொடர்ந்து விளையாடலாம், ஆனால் ஹோஸ்டை நம்பவில்லை என்றால், மேசையை விட்டு வெளியேறவும்.
zero_trust.seat_redraw=ஹோஸ்ட் "{0}" ஒரு புதிய இருக்கை சமநிலையை கட்டாயப்படுத்தியது. இது அசாதாரணமானது: டிரா கூட்டு மற்றும் சரிபார்க்கக்கூடியது, எனவே ஹோஸ்ட் இருக்கைகளைத் தேர்ந்தெடுக்க முடியாது, ஆனால் அது விரும்பும் ஏற்பாட்டைப் பெறும் வரை அதை மீண்டும் உருட்டலாம். இது மீண்டும் மீண்டும் நடந்தால், அது உங்கள் இருக்கையை சீர்செய்ய முயற்சிக்கும் ஹோஸ்ட் இருக்கலாம்.
zero_trust.seat_redraw_body=புதிய டிரா அதே வழியில் இயங்கியது மற்றும் இன்னும் சரிபார்க்கக்கூடியது: யாரும், ஹோஸ்ட் உட்பட, முடிவைத் தேர்வு செய்ய முடியாது. தொடக்கத்தில் ஒரு பிளேயர் கைவிடப்பட்டால் அது நிகழலாம், ஆனால் நீங்கள் பல முயற்சிகளைப் பார்த்து, ஹோஸ்டை நம்பவில்லை என்றால், அட்டவணையை விட்டு வெளியேறவும். இது பதிவு செய்யப்பட்டுள்ளது.
zero_trust.seat_recover_mismatch=கேம் மீட்டெடுப்பின் போது, ​​ஹோஸ்ட் "{0}" அனுப்பிய இருக்கை வரிசையானது உங்கள் கிளையன்ட் சேமித்தவற்றுடன் பொருந்தவில்லை: உங்களுக்கு ஏற்கனவே தெரிந்த ஒருவர் மேஜையில் இருக்கையை மாற்றியுள்ளார். மீட்டெடுப்பின் கீழ் இருக்கைகளை மறுவரிசைப்படுத்த முயற்சிக்கும் ஹோஸ்டாக இது இருக்கலாம்.
zero_trust.seat_recover_mismatch_body=உங்கள் கிளையன்ட் ஆரம்பத்தில் தன்னை சரிபார்த்த இருக்கை குறிப்பை வைத்திருந்தார். வீரர்கள் இடையில் சேர்வது அல்லது வெளியேறுவது சகஜம். ஏற்கனவே இருந்த ஒருவரை மறுவரிசைப்படுத்துவது இல்லை. நீங்கள் ஹோஸ்டை நம்பவில்லை என்றால், மேசையை விட்டு வெளியேறவும். இது பதிவு செய்யப்பட்டுள்ளது.
zero_trust.host_recover_action_forged=கேம் மீட்டெடுப்பின் போது ஹோஸ்ட் ஒரு போலி செயலை (தவறான கையொப்பம்) செலுத்த முயற்சித்தது. உங்கள் வாடிக்கையாளர் அதை மறுத்துவிட்டார்.
zero_trust.host_recover_action_omitted=மீட்டெடுப்பின் போது, நீங்கள் விளையாடிய மற்றும் உங்கள் உள்ளூர் தரவுத்தளத்தில் பதிவு செய்த ஒரு செயலை ஹோஸ்ட் தவிர்த்துவிட்டது. உங்கள் கிளையன்ட் அதை அதன் சொந்த நகலிற்கு எதிராகக் கண்டறிந்தது மற்றும் உங்கள் செயலை அமைதியாக கைவிடவில்லை.
zero_trust.host_recover_balance_mismatch=கேம் மீட்டெடுப்பின் போது ஹோஸ்ட் உங்கள் இருப்பை (சிப்ஸ்/நுழைவுத் தொகை) மாற்ற முயற்சித்தது: இது உங்கள் உள்ளூர் பதிவுடன் பொருந்தவில்லை. உங்கள் வாடிக்கையாளர் உங்கள் உண்மையான இருப்பை வைத்திருந்தார்.
zero_trust.host_board_peek=எதிர்காலத் தெருவிலிருந்து சமூக அட்டையை மறைகுறியாக்க ஹோஸ்ட் கோரினார் (போர்டை முன்கூட்டியே படிக்கும் முயற்சி). உங்கள் வாடிக்கையாளர் மறுத்துவிட்டார்.
zero_trust.suspect_host_prefix=சந்தேகம்: ஹோஸ்ட் "{0}".
zero_trust.suspect_peer_prefix=சந்தேகம்: வீரர் "{0}".
zero_trust.peer_alert=⚠️ [விகாரமற்ற ஆட்டக்காரர் நடத்தை]
zero_trust.peer_suspicious_header=உங்கள் டேபிளில் ஒரு வீரரின் முரண்பாடான அல்லது தவறான நடத்தை கண்டறியப்பட்டது:\n
zero_trust.peer_suspicious_body=அட்டவணை பொருந்தக்கூடிய பாதுகாப்பு நடவடிக்கையைப் பயன்படுத்தியது மற்றும் மற்ற வீரர்களுக்கு விளையாட்டு தொடர்கிறது. நல்ல நம்பிக்கை ஊகிக்கப்படுகிறது. இது ஒரு மென்பொருள் பிழையாக இருக்கலாம் மற்றும் யாரும் குற்றம் சாட்டப்படவில்லை. ஆதாரம் பதிவு செய்யப்பட்டுள்ளது.
zero_trust.peer_inbound_flood=DoS எதிர்ப்பு வரம்புக்கு மேல் நிலையான அங்கீகரிக்கப்பட்ட ட்ராஃபிக்.
zero_trust.peer_binary_flood=குரல்-செய்தி செயல்பாடுகள் வழக்கத்திற்கு மாறாக அதிக விகிதத்தில் அனுப்பப்பட்டன.
zero_trust.host_binary_flood=ஹோஸ்ட் வழக்கத்திற்கு மாறாக அதிக விகிதத்தில் குரல்-செய்தி செயல்பாடுகளை அனுப்புகிறது.
zero_trust.peer_flood_log=Anti-DoS சம்பவம் முடிவுக்காகக் காத்திருக்கிறது: பிளேயர் {0}, IP {1}. காரணம்: {2}
zero_trust.peer_flood_confirm=பயனர் {0} அதிகப்படியான டிராஃபிக்கை அனுப்புகிறார். இது DoS தாக்குதலாக இருக்கலாம் அல்லது பிழையாக இருக்கலாம். அவர்களை விளையாட்டிலிருந்து வெளியேற்றவா?\n\nIP: {1}\nகண்டறியப்பட்ட காரணம்: {2}
zero_trust.peer_flood_suppress=இந்த எச்சரிக்கைகளை காட்ட வேண்டாம்
zero_trust.peer_hand_ready_withheld=ஒரு வீரர் PINGக்கு பதிலளிக்கிறார், ஆனால் விளையாட்டு இயங்கும் போது அடுத்த கைக்கான தயார்நிலையை உறுதிப்படுத்தவில்லை. இது கையின் தொடக்கத்தை உறைய வைத்தது மற்றும் வெளியேற்றப்பட்டது. அவர்கள் இல்லாமல் விளையாட்டு தொடர்கிறது.
zero_trust.peer_action_withheld=ஒரு வீரர் PINGக்கு பதிலளிக்கிறார், ஆனால் விளையாட்டு இயங்கும் போது அதன் பந்தய செயலை அதன் சிந்தனை நேரத்தை கடந்தும் அனுப்பவில்லை. இது சுற்று முழுவதும் உறைந்து இருந்தது மற்றும் வெளியேற்றப்பட்டது. அவர்கள் இல்லாமல் விளையாட்டு தொடர்கிறது.
zero_trust.peer_conf_withheld=ஒரு வீரர் PINGக்கு பதிலளிக்கிறார், ஆனால் விளையாட்டு இயங்கும் போது டீலிங் செய்தியின் ரசீதை உறுதிப்படுத்தவில்லை. அது மேசையை முன்னேற விடாமல் தடுத்து, வெளியேற்றப்பட்டது. அவர்கள் இல்லாமல் விளையாட்டு தொடர்கிறது.
zero_trust.peer_deal_refusal_expelled=டெக் ஷஃபிள் அல்லது சுழற்சியை மறுப்பதன் மூலம் ஒரு வீரர் ஒரு வரிசையில் பல கை ரத்துகளை கட்டாயப்படுத்தினார். அது வெளியேற்றப்பட்டது, அதனால் கேம் தொடரலாம்.
zero_trust.suspicious_alert=⚠️ [விகாரமற்ற சேவையக நடத்தை]
zero_trust.suspicious_header=உங்கள் கிளையன்ட் ஒழுங்கற்ற சர்வர் நடத்தையைக் கண்டறிந்துள்ளார் (விளையாட்டை முடக்கும் முக்கியமான சம்பவம் அல்ல):\n
zero_trust.suspicious_body=உங்கள் கிளையன்ட் முரண்பாடான செயல்பாட்டை நிராகரித்தார் மற்றும் கேம் தொடரலாம். நாங்கள் நல்ல நம்பிக்கையை கருதுகிறோம்: இது ஒரு மென்பொருள் பிழையாக இருக்கலாம் (கிளையண்ட் அல்லது சர்வர்) மற்றும் யாரும் குற்றம் சாட்டப்படவில்லை. ஆனால் ஒரு பிழையை சேதப்படுத்துவதைத் தவிர சொல்ல முடியாது என்பதால், உங்கள் பாதுகாப்பிற்காக, 'லீவ்' பொத்தானைப் பயன்படுத்தி இந்த அட்டவணையை விட்டு வெளியேறுவது கடுமையாகப் பரிந்துரைக்கப்படுகிறது (உங்கள் பணம் இந்தக் கையில் செயலாக்கப்படாது).
zero_trust.host_bad_wire=கிரிப்டோகிராஃபிக் வளைவுக்குச் சொந்தமில்லாத தவறான வடிவம் அல்லது புள்ளிகளுடன் சேவையகத்திலிருந்து மறைகுறியாக்கக் கோரிக்கை பெறப்பட்டது.
zero_trust.host_critical_command_invalid=சர்வரால் அனுப்பப்பட்ட முக்கியமான {0} கட்டளையை சரிபார்க்க முடியவில்லை. இது இணக்கமின்மை, பிழை அல்லது மாற்றியமைக்கப்பட்ட சேவையகமாக இருக்கலாம். அமர்வு அதன் ஒருமைப்பாட்டைப் பாதுகாக்க நிறுத்தப்பட்டது.
zero_trust.cheater_detected=[ZERO-TRUST] மாற்றியமைக்கப்பட்ட CoronaPoker பதிப்பைக் கொண்ட ஒரு பிளேயர் கண்டறியப்பட்டது, அவர்கள் ஏமாற்ற முயற்சிக்கலாம் எனக் கூறப்படுகிறது. தொடர வேண்டுமா?
zero_trust.corrupted_mac_action=சர்வர் சார்பாக ஒரு தவறான கிரிப்டோகிராஃபிக் கையொப்பத்துடன் (கெட்ட MAC) செயலைச் செயல்படுத்த முயற்சித்தது:
zero_trust.critical=\u274c [ZERO-TRUST] முக்கிய எச்சரிக்கை: தவறான கையொப்பம் அல்லது உடைந்த ஒருமித்த கருத்து.
zero_trust.critical_alert_body=தனிமைப்படுத்தப்பட்ட மாநிலம் செயல்படுத்தப்பட்டது:\nஇந்த அமர்வில் உங்கள் கிளையன்ட் இனி எந்த கிரிப்டோகிராஃபிக் விசைகளையும் சேவையகத்திற்கு அனுப்ப மாட்டார்.\nஉங்கள் சமநிலையைப் பாதுகாக்க விளையாட்டு கணித ரீதியாக முடக்கப்பட்டுள்ளது.\n\nசாத்தியமான காரணங்கள்:\n  - கிளையன்ட் குறியீட்டிலேயே ஒரு பிழை,\n  - சர்வர் குறியீட்டில் ஒரு பிழை, அல்லது\n  - ஒரு சேவையகம் அதன் குறியீடு மாற்றப்பட்டிருக்கலாம்.\n\nவாடிக்கையாளர் அவற்றை வேறுபடுத்திப் பார்க்க முடியாது மற்றும் எந்த குற்றச்சாட்டும் குறிப்பிடப்படவில்லை. பாதுகாப்பிற்காகவும், மூல காரணத்தின் மதிப்பாய்வு நிலுவையில் இருப்பதால், 'வெளியேறு' பொத்தானைப் பயன்படுத்தி இந்த விளையாட்டை விட்டு வெளியேறுவது பரிந்துரைக்கப்படுகிறது (உங்கள் பணம் இந்தக் கையில் செயலாக்கப்படாது).
zero_trust.critical_alert_header=ZERO-TRUST INCIDENT!\n\nஉங்கள் கிளையண்ட் கிரிப்டோகிராஃபிக் நெறிமுறையில் ஒரு ஒழுங்கின்மையைக் கண்டறிந்துள்ளார்:\n
