gdx.settings.tooltip.generic=இந்த விருப்பத்தின் நடத்தையை மாற்றுகிறது.
gdx.settings.tooltip.audio_missing={0} என்ற ஒலிக்கோப்பு விளையாட்டிலும் MOD-இலும் இல்லை.
gdx.settings.tooltip.audio_event=இந்த ஒலியை இயக்குகிறது அல்லது முடக்குகிறது. பிளே பட்டன் அமைப்புகளை விட்டு வெளியேறாமல் அதை முன்னோட்டமிடுகிறது.
gdx.settings.tooltip.audio_event.sonido_apostar=முதல் பந்தயம் வைக்கும்போதோ உயர்த்தும்போதோ ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_igualar=ஒரு வீரர் பந்தயத்தைச் சமன் செய்யும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_pasar=சமன் செய்யப் பந்தயம் இல்லாதபோது ஒரு வீரர் கடக்கும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_allin=ஒரு வீரர் மீதமுள்ள அனைத்து சில்லுகளையும் பந்தயம் வைக்கும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_fold=ஒரு வீரர் கையிலிருந்து விலகும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_barajado=அட்டைகளை வழங்குவதற்கு முன் கலைக்கும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_reparto=கட்டிலிருந்து அட்டைகளை வழங்கும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_destape=பொது அட்டைகள் அல்லது காட்டப்படும் கைகள் திறக்கப்படும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_destape_mis_cartas=வழங்கும்போது உங்கள் அட்டைகள் திறக்கப்படும் ஒலியைச் சேர்க்கும். அட்டை திறக்கும் ஒலி இயக்கப்பட்டிருக்க வேண்டும்.
gdx.settings.tooltip.audio_event.sonido_ciegas=கட்டாயப் பந்தயங்கள் அடுத்த நிலைக்கு உயரும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_conteo=இறுதிச் சுருக்கத் திரையில் உங்கள் இருப்பைக் கணக்கிடும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_carga_stacks=வீரர்களின் தொடக்கச் சில்லுகள் மேசைக்கு வரும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_caja=சில்லுகளை மீண்டும் வாங்கி முடிக்கும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_ultima_mano=தற்போதைய கை கடைசிக் கையாகக் குறிக்கப்படும்போதோ குறி நீக்கப்படும்போதோ ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_pausa=மேசையில் ஆட்டம் இடைநிறுத்தப்படும்போது ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_tu_turno=உங்கள் முறை வரும்போது அறிவிக்கும்.
gdx.settings.tooltip.audio_event.sonido_aviso_tiempo=முடிவெடுக்கும் நேரம் முடியும்போது அறிவிக்கும்.
gdx.settings.tooltip.audio_event.sonido_fin_partida=ஆட்டம் முடிந்த அறிவிப்புடன் ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_iwtsth=கைகள் காட்டப்படும்போது எதிராளியின் அட்டைகளைப் பார்க்கக் கேட்டால் ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_entra=புதிய ஆட்டம் உருவாக்கப்படும்போதோ புதிய வீரர் சேரும்போதோ ஒலிக்கும்.
gdx.settings.tooltip.audio_event.sonido_entrar_sala=நடந்துகொண்டிருக்கும் ஆட்டத்தில் சேர யாராவது கேட்டால் அறிவிக்கும்.
