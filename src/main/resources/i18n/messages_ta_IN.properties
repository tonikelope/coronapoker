ui.radar_info_msg=இந்த அம்சம் எந்தவொரு பிளேயரையும் ஏமாற்றி அல்லது மூன்றாம் தரப்பு மென்பொருளைப் பயன்படுத்துவதாக சந்தேகித்தால், மற்றொரு பிளேயரின் ஸ்கிரீன்ஷாட் மற்றும் செயல்முறைப் பட்டியலைப் பெற அனுமதிக்கிறது. புரவலராக, இந்த விருப்பத்தை இயக்கும் முன் தனியுரிமை தாக்கங்களைக் கவனியுங்கள் (நடுத்தர விளையாட்டை மாற்ற முடியாது).\n\nகுறிப்பு: இந்த செயல்பாடு மிகவும் பிளாட்ஃபார்ம் சார்ந்தது, எனவே இது அனைத்து வாடிக்கையாளர்களிடமும் சரியாக வேலை செய்ய உத்தரவாதம் இல்லை.
