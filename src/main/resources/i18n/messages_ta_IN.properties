game.popup_verificacion_firma_invalida=இந்த கையின் போது, ஒன்று அல்லது அதற்கு மேற்பட்ட பங்கேற்பாளர்கள் ({0}) ஒரு செயலில் தவறான கிரிப்டோகிராஃபிக் கையொப்பத்தைக் கண்டறிந்தது.\n\nஅனைத்து பங்கேற்பாளர்களாலும் பெறப்பட்ட தரவு சீரானது (இறுதி சங்கிலி ஹாஷ்கள் பொருந்தியது), ஆனால் குறைந்தபட்சம் ஒரு செயலையாவது அதன் எதிர்பார்த்த ஆசிரியரால் சரியாக கையொப்பமிடப்படவில்லை.\n\nCoronaPoker பாதுகாப்பான கை மூடுதலை நிறுத்தி, இந்த எச்சரிக்கையை ஒப்புக்கொண்ட பிறகு, பாதுகாப்பு தோல்வி என டேபிளை மூடும்.\n\nசான்றுகள் இதில் சேமிக்கப்பட்டுள்ளன:\n{1}
