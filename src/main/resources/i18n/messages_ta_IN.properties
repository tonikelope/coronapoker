ui.identicon.self_explicacion=இது உங்கள் பொது விசை. பாதுகாப்பான வெளிப்புற சேனல் (WhatsApp, Telegram, voice...) மூலம் இந்தப் படத்தையோ அதன் ஹெக்ஸ் கைரேகையையோ நீங்கள் பகிரலாம், அதனால் மற்ற வீரர்கள் உங்கள் அடையாளத்தைச் சரிபார்க்க முடியும்.
ui.identicon.session_explicacion=ஒவ்வொரு ஐகானும் மறைகுறியாக்கப்பட்ட சேனலுக்கான AES விசையின் காட்சி கைரேகை ஆகும். ஒரே சேனலின் இரு முனைகளும் ஒரே ஐகானைப் பார்க்க வேண்டும். குரல், வாட்ஸ்அப் அல்லது டெலிகிராம் போன்ற பாதுகாப்பான வெளிப்புற சேனல் மூலம் மற்ற பிளேயருடன் ஒப்பிடவும். இது பொருந்தினால், இணைப்பை யாரும் குறுக்கிட மாட்டார்கள். இது வேறுபட்டால், நெட்வொர்க்கில் ஒரு இடைத்தரகர் இருக்கிறார், நீங்கள் துண்டிக்க வேண்டும்.
ui.identity.load_error=இந்த நிக்கிற்கான கிரிப்டோகிராஃபிக் அடையாளத்தை ஏற்றவோ உருவாக்கவோ முடியவில்லை.\n\nதொழில்நுட்ப விவரம்: {0}\n\nஒரு பிணைய கேமை நிலையான அடையாளம் இல்லாமல் உள்ளிட முடியாது. உங்கள் பயனர் கோப்பக அனுமதிகளைச் சரிபார்த்து, மீண்டும் முயற்சிக்கவும்.
