gdx.custom_bots.error.limit=தனிப்பயன் பாட் வரம்பை அடைந்துவிட்டது.
gdx.custom_bots.error.invalid=போட் விவரங்களைச் சரிபார்க்கவும்.
gdx.custom_bots.error.avatar=தேர்ந்தெடுக்கப்பட்ட அவதாரத்தைச் சேமிக்க முடியவில்லை.
tooltip.cfg.custom_bots=தனிப்பயன் பட்டியலை இயக்குகிறது. கட்டமைக்கப்பட்ட சுயவிவரங்கள் முதலில் சேர்க்கப்படும், அதைத் தொடர்ந்து நிலையான போட்கள்.
tooltip.cfg.custom_bots.only=நிலையான போட்கள் சேர்க்கப்படுவதைத் தடுக்கிறது. தனிப்பயன் பட்டியல் தீர்ந்த பிறகு மேலும் போட்களைச் சேர்க்க முடியாது.
tooltip.cfg.custom_bots.manage=உங்கள் போட்களை உருவாக்க, திருத்த மற்றும் ஆர்டர் செய்ய மேலாளரைத் திறக்கவும். அவர்களின் சிரமம் மற்றும் பாணியை நீங்கள் தேர்வு செய்யலாம்.
tooltip.cfg.custom_bots.row=அதன் பெயர், அவதார், சிரமம், நடை அல்லது மறுவாங்கல் ஆகியவற்றைத் திருத்த இந்த போட்டைத் தேர்ந்தெடுக்கவும்.
tooltip.cfg.custom_bots.avatar=சரியான படத்தைத் தேர்வு செய்யவும் அல்லது அதிகாரப்பூர்வ போட் அவதாரத்தை வைத்திருக்கவும். CoronaPoker ஒரு பாதுகாப்பான நகலை சேமிக்கிறது, அதனால் அது இழக்கப்படாது.
tooltip.cfg.custom_bots.name=$ இல்லாமல் தெரியும் பெயரை உள்ளிடவும். ஒதுக்கப்பட்ட மார்க்கர் தானாகவே சேர்க்கப்படும்.
tooltip.cfg.custom_bots.difficulty=போட் பயன்படுத்தும் சவாலையும் உத்திகளையும் அமைக்கிறது. பொழுதுபோக்காக எளிதாக விளையாடுகிறது, இயல்பானது மிகவும் ஒழுக்கமான உத்தியைப் பயன்படுத்துகிறது மற்றும் ஹார்ட் மேம்பட்ட தந்திரோபாயங்களைப் பயன்படுத்துகிறது.
tooltip.cfg.custom_bots.personality=அடிப்படை பாணியை அமைக்கிறது. போட் உருவாக்கப்படும்போது ரேண்டம் அதைத் தேர்ந்தெடுத்து செயலில் அமர்வதற்காக வைத்திருக்கிறது. போட் தனது முடிவுகளை சூழ்நிலைக்கு ஏற்ப மாற்றிக்கொள்ள முடியும்.
gdx.settings.option_help.bot_difficulty.easy=நிதானமாக விளையாடி அடிக்கடி தவறு செய்கிறார்.
gdx.settings.option_help.bot_difficulty.medium=மிகவும் ஒழுக்கமான உத்தியைப் பயன்படுத்துகிறது மற்றும் கை வளரும்போது முடிவுகளை சரிசெய்கிறது.
gdx.settings.option_help.bot_difficulty.hard=கட்டாயப் பந்தயங்கள் திருடுவது அல்லது எதிராளி பாதிக்கப்படக்கூடியதாகத் தோன்றும்போது அழுத்தம் கொடுப்பது போன்ற மேம்பட்ட யுக்திகளைப் பயன்படுத்துகிறது.
gdx.settings.option_help.custom_bot_personality.random=போட் உருவாக்கப்படும்போது ஒரு பாணியைத் தேர்ந்தெடுத்து அதை செயலில் அமர்வதற்காக வைத்திருக்கும்.
gdx.settings.option_help.custom_bot_personality.nit=சில கைகளில் நுழைகிறது மற்றும் பொதுவாக சிப்ஸ் அபாயத்திற்கு முன் வலுவான அட்டைகளுக்காக காத்திருக்கிறது.
gdx.settings.option_help.custom_bot_personality.station=பந்தயம் கட்டவும், கையில் இருக்கவும் முனைகிறது. குறைவாக அடிக்கடி எழுப்புகிறது.
gdx.settings.option_help.custom_bot_personality.tag=தேர்ந்தெடுக்கப்பட்ட கைகளைத் தேர்ந்தெடுத்து, பந்தயம் மற்றும் எழுச்சியுடன் முன்னணியில் இருக்க முனைகிறார்.
gdx.settings.option_help.custom_bot_personality.lag=பரந்த அளவிலான கைகளை விளையாடுகிறது மற்றும் அடிக்கடி பந்தயம் மற்றும் உயர்த்துவதன் மூலம் அழுத்தத்தைப் பயன்படுத்துகிறது.
gdx.settings.option_help.ante_mode.traditional=ஒவ்வொரு செயலில் உள்ள வீரரும் பெரிய கட்டாயப் பந்தயம் இல் பத்தில் ஒரு பங்கை இடுகையிடுகிறார்கள், இது அருகிலுள்ள சென்ட்டிற்கு வட்டமானது.
gdx.settings.option_help.ante_mode.big_blind=பெரிய கட்டாயப் பந்தயம் இல் உள்ள பிளேயர் முழு ஆன்டிஐயும் இடுகையிடுகிறார், இது ஒன்று பெரிய கட்டாயப் பந்தயம்க்கு சமம்.
gdx.settings.option_help.ante_mode.button=பொத்தானில் உள்ள பிளேயர் முழு ஆன்டிஐ இடுகையிடுகிறது, இது ஒன்று பெரிய கட்டாயப் பந்தயம்க்கு சமம்.
gdx.settings.option_help.ante_mode.small_blind=சிறிய கட்டாயப் பந்தயம் இல் உள்ள பிளேயர் முழு ஆன்டிஐயும் இடுகையிடுகிறார், இது ஒன்று பெரிய கட்டாயப் பந்தயம்க்கு சமம்.
gdx.settings.option_help.rebuy_cap.buy_in=மறுவாங்கல்க்குப் பிறகு உங்கள் அதிகபட்ச ஸ்டாக் கேமின் நுழைவுத் தொகைஐ அடிப்படையாகக் கொண்டது.
gdx.settings.option_help.rebuy_cap.highest_stack=மறுவாங்கல் மேசையில் உள்ள பெரிய அடுக்கு வரை. தொப்பி ஒருபோதும் நிலையான நுழைவுத் தொகைக்கு கீழே வராது.
gdx.settings.option_help.rabbit.off=கையாளப்படாத சமூக அட்டைகள் கை முடிந்ததும் மறைந்திருக்கும்.
gdx.settings.option_help.rabbit.free=சிப்ஸ் செலுத்தாமல் கையை முடித்த பிறகு, கையாளப்படாத சமூக அட்டைகளைப் பார்க்கச் சொல்லலாம்.
gdx.settings.option_help.rabbit.free_small_blind=விளையாட்டின் முதல் கோரிக்கை இலவசம். ஒவ்வொரு பிந்தைய கோரிக்கைக்கும் ஒரு சிறிய கட்டாயப் பந்தயம் செலவாகும்.
gdx.settings.option_help.rabbit.free_small_and_big_blind=விளையாட்டின் உங்கள் முதல் கோரிக்கை இலவசம், இரண்டாவதாக ஒன்று சிறிய கட்டாயப் பந்தயம், பின்னர் கோரிக்கைகளுக்கு ஒன்று பெரிய கட்டாயப் பந்தயம்.
gdx.settings.option_help.window_mode.exclusive=மானிட்டரின் முழுத்திரை பயன்முறையைப் பயன்படுத்துகிறது.
gdx.settings.option_help.window_mode.borderless=எல்லையற்ற சாளரத்துடன் திரையை நிரப்புகிறது மற்றும் டெஸ்க்டாப் காட்சி பயன்முறையை வைத்திருக்கிறது.
tooltip.cfg.custom_bots.automatic_rebuy=சில்லுகள் தீர்ந்த பிறகு இந்த தனிப்பயன் பாட் மறுவாங்கல்ஐ அனுமதிக்கிறது. உலகளாவிய தானியங்கி மறுவாங்கல் கட்டுப்பாடு இயக்கப்பட்டிருக்க வேண்டும்.
tooltip.cfg.custom_bots.order_up=தேர்ந்தெடுக்கப்பட்ட சுயவிவரத்தை ஒரு நிலைக்கு மேலே நகர்த்துகிறது. ஸ்க்ரோலிங் தேவைப்படும்போது பட்டியல் அதைப் பின்தொடர்கிறது.
tooltip.cfg.custom_bots.order_down=தேர்ந்தெடுக்கப்பட்ட சுயவிவரத்தை ஒரு நிலை கீழே நகர்த்துகிறது. ஸ்க்ரோலிங் தேவைப்படும்போது பட்டியல் அதைப் பின்தொடர்கிறது.
tooltip.cfg.custom_bots.random_selection=லாபி உருவாக்கப்படும்போது பட்டியலை ஒருமுறை கலக்கவும். ஒவ்வொரு தனிப்பயன் போட் ஒரு முறை மட்டுமே நுழைய முடியும் மற்றும் அந்த லாபிக்கான தேர்வு நிலையானதாக இருக்கும்.
tooltip.cfg.custom_bots.new=ஏற்கனவே சேமித்துள்ள போட்களை மாற்றாமல் புதிய சுயவிவரத்தைத் தயாரிக்கிறது.
tooltip.cfg.custom_bots.save=புதிய சுயவிவரத்தைச் சேர்க்கிறது அல்லது தேர்ந்தெடுக்கப்பட்ட போட்டில் செய்யப்பட்ட மாற்றங்களைச் சேமிக்கிறது.
tooltip.cfg.custom_bots.delete=உறுதிப்படுத்தல் கேட்ட பிறகு தேர்ந்தெடுக்கப்பட்ட சுயவிவரத்தை நீக்குகிறது.
tooltip.cfg.custom_bots.close=மேலாளரை மூடுகிறது. சேமித்த சுயவிவரங்கள் மற்றும் அவற்றின் ஆர்டர் தானாகவே வைக்கப்படும்.
