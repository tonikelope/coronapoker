tooltip.cfg.ante=கட்டாயப் பந்தயங்கள்க்குப் பிறகு பானைக்கு கட்டாயப் பங்களிப்பைச் சேர்க்கிறது. யார் செலுத்த வேண்டும், எவ்வளவு செலுத்த வேண்டும் என்பதை இந்த பயன்முறை அமைக்கிறது.
tooltip.cfg.ante_mode=பாரம்பரிய பயன்முறையில், ஒவ்வொரு செயலில் உள்ள வீரரும் பெரிய கட்டாயப் பந்தயம் இல் 10% செலுத்துகிறார்கள். BBA, BA அல்லது SBA இல், பெரிய கட்டாயப் பந்தயம், பொத்தான் அல்லது சிறிய கட்டாயப் பந்தயம் ஒன்று பெரிய கட்டாயப் பந்தயம்ஐ செலுத்துகிறது. கட்டாயப் பந்தயங்கள் முதலில் இடுகையிடப்பட்டது.
tooltip.cfg.blind_cap=கட்டமைக்கப்பட்ட தொப்பியில் கட்டாயப் பந்தயங்கள்ஐ நிறுத்துகிறது.
tooltip.cfg.blinds_level=விளையாட்டிற்கு கட்டாயப் பந்தயங்கள் (சிறிய/பெரிய) தொடங்குகிறது.
tooltip.cfg.bot_balance=கேம் முடிவடையும் போது, ​​போட்களின் ஒருங்கிணைந்த இருப்பு மனித வீரர்களிடையே சமமாகப் பிரிக்கப்படுகிறது, எனவே உண்மையான பணம் மக்களிடையே மட்டுமே தீர்க்கப்படுகிறது.
tooltip.cfg.bot_rebuy=ஒவ்வொரு போட்டிற்கும் உலகளாவிய தானியங்கி மறுவாங்கல் கட்டுப்பாடு. அதை முடக்குவது தனிப்பயன் போட்களின் மறுவாங்கல் அமைப்புகளையும் முடக்குகிறது.
tooltip.cfg.bots=நிலையான போட்களின் சிரமத்தை அமைக்கிறது. தனிப்பயன் போட்கள் பாட் மேலாளரில் தனித்தனியாக உள்ளமைக்கப்பட்ட சிரமத்தை வைத்திருக்கின்றன.
tooltip.cfg.buyin_fixed=அனைவரும் ஒரே நுழைவுத் தொகை இல் தொடங்குகிறார்கள். முடக்கப்பட்டிருக்கும் போது, ​​வீரர்கள் உள்ளமைக்கப்பட்ட வரம்பிற்குள் தேர்வு செய்கிறார்கள்.
tooltip.cfg.double_blinds=ஒரு குறிப்பிட்ட எண்ணிக்கையிலான கைகள் அல்லது நிமிடங்களுக்குப் பிறகு கட்டமைப்பில் அடுத்த கட்டாயப் பந்தயங்கள் நிலைக்கு முன்னேறுகிறது.
tooltip.cfg.hand_limit=இந்த கை எண்ணிக்கையை அடைந்ததும் ஆட்டம் முடிவடைகிறது.
tooltip.cfg.iwtsth=அட்டைகளை வெளிப்படுத்துதல் இல் போட்டியாளரின் கையைப் பார்க்க உங்களை அனுமதிக்கிறது.
tooltip.cfg.rabbit=கைக்குப் பிறகு கையாளப்படாத சமூக அட்டைகளை வெளிப்படுத்துகிறது. ஒவ்வொரு வீரரின் முதல் கோரிக்கையும் இலவசம். தேர்ந்தெடுக்கப்பட்ட பயன்முறையானது பிற்கால கோரிக்கைகள் இலவசமா அல்லது சிறியதா அல்லது பெரிய கட்டாயப் பந்தயம் செலவா என்பதை அமைக்கிறது.
tooltip.cfg.rebuy_limit=ஒரு வீரருக்கு அதிகபட்ச மறு வாங்கல்கள்.
tooltip.cfg.recover=முன்பு குறுக்கிடப்பட்ட கேமை மீண்டும் தொடங்குகிறது.
tooltip.cfg.rit=ஒரு அனைத்தும் வை பந்தயம் முடிவடையும் போது மீதமுள்ள கார்டுகளை இரண்டு முறை கையாள ஒரு வாக்கை அனுமதிக்கிறது.
tooltip.cfg.straddle=பெரிய கட்டாயப் பந்தயம்க்குப் பிறகு விளையாடுபவர், தங்கள் கார்டுகளைப் பார்ப்பதற்கு முன் இரண்டு பெரிய கட்டாயப் பந்தயம்ஐ இடுகையிடலாம் மற்றும் கடைசியாக ப்ரீஃப்ளாப்பாக செயல்படலாம்.
tooltip.cfg.straddle_on_timeout=ஸ்ட்ராடில் ப்ராம்ட் நேரம் முடிந்தவுடன் தானாகவே இடுகையிடவும். இது உங்கள் பிளேயரை மட்டுமே பாதிக்கிறது மற்றும் இயல்பாகவே முடக்கப்படும்.
tooltip.cfg.structure=விளையாட்டுக்கான கட்டாயப் பந்தயங்கள்-நிலை அமைப்பு.
tooltip.cfg.think_time=முடிவு செய்ய வினாடிகள் உள்ளன. நேரம் காலாவதியாகும் போது தானியங்கு செயல் இயங்கும்.
tooltip.cfg.showdown_time=வினாடிகள் அடுத்த கை கையாளப்படுவதற்கு முன்பு கை முடிவு திரையில் இருக்கும்.
tooltip.cfg.allow_hot_join=புதிய பிளேயர்களை வார்மிங் அப் ஆக இணைத்து அடுத்த கையில் நுழைய அனுமதிக்கிறது. விளையாட்டின் போது மாற்றப்பட்டால், அது புதிய இணைப்பு முயற்சிகளை மட்டுமே பாதிக்கும்.
tooltip.cfg.card_flip_duration=ஒவ்வொரு அட்டையும் வெளிப்படுத்தப்படும்போது அதன் திருப்பத்தை முடிக்க எவ்வளவு நேரம் ஆகும் என்பதை அமைக்கிறது.
tooltip.cfg.card_flip_direction=கார்டுகள் வெளிப்படும் போது எந்த வழியில் திரும்பும் என்பதைத் தேர்ந்தெடுக்கும். கலப்பு ஒவ்வொரு வெளிப்பாட்டிற்கும் ஒரு திசையைத் தேர்ந்தெடுக்கிறது. ஒரே குழுவில் உள்ள அட்டைகள் ஒரே மாதிரியாக மாறும்.
tooltip.cfg.reparto_velocidad=ஒவ்வொரு அட்டையும் டெக்கிலிருந்து அதன் இருக்கைக்குச் செல்ல எவ்வளவு நேரம் ஆகும் என்பதை அமைக்கிறது.
tooltip.cfg.community_deal_style=ஐந்து சமூக அட்டைகளும் தொடக்கத்தில் முகம் குப்புறக் காட்டப்பட வேண்டுமா அல்லது அவற்றின் சொந்தத் தெருவில் கொடுக்கப்பட்டுள்ளதா என்பதைத் தேர்வுசெய்யவும். சேமிக்கப்பட்ட மாற்றங்கள் அடுத்த கையிலிருந்து பொருந்தும்.
