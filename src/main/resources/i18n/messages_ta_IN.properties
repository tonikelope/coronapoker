player.en_el_bmodo_recuperacionb_se=இல் <b>மீட்பு முறை</b> முந்தைய விளையாட்டு நிறுத்தப்பட்ட இடத்திலிருந்து தொடரும்:\n\n1) இது <b>கட்டாயம்</b> பழைய வீரர்கள் பயன்படுத்துகின்றனர் <b>அதே நிக்ஸ்</b>.\n\n2) இருந்து தொடர <b>சரியான புள்ளி</b> கை அது <b>கட்டாயம்</b> என்று <b>அனைத்து</b> பழைய வீரர்கள் மீண்டும் இணைகிறார்கள். இது முடியாவிட்டால், ஆட்டம் தடைபட்டபோது இருந்த கையை இழக்க நேரிடும்.\n\n3) <b>புதிய வீரர்கள்</b> விளையாட்டில் சேர அனுமதிக்கப்படுகிறார்கள் (அவர்கள் முதலில் பார்வையாளர்களாக இருப்பார்கள்).
