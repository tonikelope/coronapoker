zero_trust.peer_sra_corrupt=அட்டைகளை வெளிப்படுத்துதல் கையொப்பம் உண்மையானது. சகாவானவர் வேண்டுமென்றே ஒரு சிதைந்த விசையில் கையொப்பமிட்டால் அல்லது அவர்களின் வாடிக்கையாளர் தரமற்றதாக இருந்தால் மட்டுமே இது நடக்கும். எது என்று எங்களால் சொல்ல முடியாது, பாதுகாப்பிற்காக நாங்கள் விளையாட்டை முடிக்கிறோம்.
zero_trust.straddle_recover_mismatch=கையை மீட்டெடுக்கும் போது, ​​உங்கள் சொந்த உள்ளூர் நகல் பதிவு செய்ததிலிருந்து வேறுபட்ட ஸ்ட்ராடில்ஐ ஹோஸ்ட் அறிவித்தது. மீட்டெடுக்கப்பட்ட ஸ்ட்ராடில் அல்லது அதன் கிளையன்ட் தரமற்றதாக இருந்தால் மட்டுமே இது நிகழ்கிறது. உங்கள் நம்பகமான நகலில் இருந்து கை இன்னும் புனரமைக்கப்பட்டுள்ளது, ஆனால் முன்னெச்சரிக்கையாக நாங்கள் உங்களை எச்சரிக்கிறோம்.
zero_trust.rit_recover_mismatch=கையை மீட்டெடுக்கும் போது, ​​உங்கள் சொந்த உள்ளூர் நகல் பதிவு செய்ததில் இருந்து வேறுபட்ட ரன்-இட்-இரண்டு முடிவை ஹோஸ்ட் அறிவித்தது. மீட்டெடுக்கப்பட்ட முடிவை ஹோஸ்ட் சேதப்படுத்தினால் அல்லது அதன் கிளையன்ட் தரமற்றதாக இருந்தால் மட்டுமே இது நடக்கும். உங்கள் நம்பகமான நகலில் இருந்து கை இன்னும் புனரமைக்கப்பட்டுள்ளது, ஆனால் முன்னெச்சரிக்கையாக நாங்கள் உங்களை எச்சரிக்கிறோம்.
