radar.advertencia_este_registro_debe_comprobarse=எச்சரிக்கை: மோசடி பயன்பாடுகள் மற்றும்/அல்லது நூலகங்களுக்கு இந்தப் பதிவேடு கைமுறையாகச் சரிபார்க்கப்பட வேண்டும்.\n\n
radar.atencion_toda_esta_informacion_debe=எச்சரிக்கை: இந்த அனைத்து தகவல்களும் கைமுறையாக மதிப்பாய்வு செய்யப்பட வேண்டும் மற்றும் வீரர் ஏமாற்றினால் முடிவுக்கு வர வேண்டும்.
radar.cuidado_el_ejecutable_del_juego=எச்சரிக்கை: இந்த வீரர் CORONAPOKER இன் மாற்றியமைக்கப்பட்ட பதிப்பைப் பயன்படுத்தி ஏமாற்ற முயற்சிக்கலாம்.
radar.el_servidor_ha_activado_el=இந்த கேமிற்காக சர்வர் ஆன்டி-சீட் ரேடாரைச் செயல்படுத்தியுள்ளது. விளையாட்டின் போது எந்த வீரரும் மற்றொரு வீரரின் ஏமாற்று-எதிர்ப்பு அறிக்கையைக் கோரலாம், அதில் பிளேயரின் ஸ்கிரீன் ஷாட் (அவர்களுடைய கார்டுகளைக் காட்டாமல்) மற்றும் அவர்களின் கணினி செயல்முறை பட்டியல் ஆகியவை அடங்கும்.
radar.esta_funcionalidad_permite_a_cualquier=இந்த அம்சம் எந்தவொரு பிளேயரையும் ஏமாற்றுவதாகவோ அல்லது மூன்றாம் தரப்பு மென்பொருளைப் பயன்படுத்துவதாகவோ சந்தேகப்பட்டால், மற்றொரு பிளேயரின் ஸ்கிரீன்ஷாட் மற்றும் செயல்முறைப் பட்டியலைப் பெற அனுமதிக்கிறது. ஹோஸ்டாக, இந்த விருப்பத்தை இயக்கும் முன் தனியுரிமை தாக்கங்களை கருத்தில் கொள்ளவும் (இதை விளையாட்டின் நடுப்பகுதியில் மாற்ற முடியாது).\n\nகுறிப்பு: இந்த அம்சம் மிகவும் பிளாட்ஃபார்ம் சார்ந்தது, எனவே இது அனைத்து வாடிக்கையாளர்களிடமும் சரியாக வேலை செய்யும் என்பதற்கு உத்தரவாதம் இல்லை.
