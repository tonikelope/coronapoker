about.a_pepillo_por_ese_talento=வித்தியாசமான பிழைகளை வேட்டையாடும் திறமைக்காக பெப்பிலோவுக்கும், மேக்கில் சோதனை செய்ததற்காக லாடோவுக்கும் என் அம்மாவுக்கும்... மற்ற எல்லாவற்றுக்கும்.
about.centimos=(பீட்டாக்களில் விடுபட்ட அனைத்து சென்ட்களும் ஒரு நல்ல காரணத்திற்காக).
about.dedicado=அனைத்து COVID-19 பாதிக்கப்பட்டவர்களின் நினைவாக
about.en_memoria_de_todas_las=கோவிட்-19 நோயால் பாதிக்கப்பட்ட அனைவருக்கும் நினைவாக
about.gracias_1=இந்த சாகசத்தில் ஒத்துழைத்த அனைத்து நண்பர்களுக்கும் நன்றி, குறிப்பாக பெப்சி தனது டெக்குகள் மற்றும் "நல்ல நூல்",
about.gracias_2=அரிதான பிழைகளைப் பிடிக்கும் திறமைக்காக பெப்பிலோவிடம், அவனது மேக்கில் சோதனைக்காக லாடோவுக்கும் என் அம்மாவுக்கும்... மற்ற எல்லாவற்றுக்கும்.
about.hecho_a_mano=tonikelope © 2020 இல் ஸ்பெயினில் கையால் தயாரிக்கப்பட்டது மற்றும் அன்புடன்
about.hecho_a_mano_en_espana=tonikelope © 2020 இல் ஸ்பெயினில் கையால் தயாரிக்கப்பட்டது மற்றும் அன்புடன்
about.merecemos=டெக்சாஸ் எம் என்எல் வீடியோ கேமை நமக்குத் தேவை, நமக்குத் தேவையானது அல்ல... அல்லது வேறு வழியா?
