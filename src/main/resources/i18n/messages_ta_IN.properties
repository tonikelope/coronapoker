gdx.settings.tooltip.joke_winner=கை வெற்றியாளருக்காக ஜோக் குரல் வாசிக்கிறது.
gdx.settings.tooltip.joke_loser=கை இழந்தவருக்கு ஜோக் குரல் கொடுக்கிறார்.
gdx.settings.tooltip.joke_raise=ஒரு உயர்வு அல்லது மீண்டும் உயர்த்து ஜோக் ஒலியை இயக்குகிறது.
gdx.settings.tooltip.joke_norebuy=சிப்ஸ் தீர்ந்து, திரும்ப வாங்காமல் வெளியேறும்போது நகைச்சுவையாக விளையாடுகிறது.
gdx.settings.tooltip.joke_indivisible=பிரிக்க முடியாத எச்சம் பானையில் இருக்கும் போது ஜோக் நோட்டீஸ் விளையாடுகிறது.
gdx.settings.tooltip.joke_lastcard=கடைசி சமூக அட்டையுடன் வெற்றி பெறுவதற்கான ஜோக் ஒலியும் அடங்கும்.
gdx.settings.tooltip.joke_badbeat=மோசமான துடிப்பு கண்டறியப்பட்டால் ஜோக் ஒலியை இயக்குகிறது.
gdx.settings.tooltip.joke_lucky=குறிப்பாக அதிர்ஷ்ட கைக்காக ஜோக் ஒலியை இயக்குகிறது.
gdx.settings.tooltip.joke_special_card=சில அடுக்குகள் அல்லது MODகள் உள்ளிட்ட சிறப்பு ஒலிகளை இயக்குகிறது.
gdx.settings.tooltip.joke_bank_official=MOD கோப்புறை: {0} இதில் MOD WAV கோப்புகள் இல்லை, எனவே அதிகாரப்பூர்வ வங்கி பயன்படுத்தப்படுகிறது. கோப்புப் பெயர்கள் தடையற்றவை.
gdx.settings.tooltip.joke_bank_mod_only=MOD கோப்புறை: {0} இந்த வகை அதன் WAV கோப்புகளை மட்டுமே பயன்படுத்துகிறது, ஏனெனில் fusion_sounds=false. கோப்புப் பெயர்கள் தடையற்றவை.
gdx.settings.tooltip.joke_bank_fused=MOD கோப்புறை: {0} இந்த வகை அதிகாரப்பூர்வ மற்றும் MOD WAV கோப்புகளை ஒருங்கிணைக்கிறது, ஏனெனில் fusion_sounds=true. கோப்புப் பெயர்கள் தடையற்றவை.
gdx.settings.joke_mod_status_exclusive=MOD {0} இலிருந்து ஒலிகள் பயன்பாட்டில் உள்ளன (பிரத்தியேக பயன்முறை)
gdx.settings.joke_mod_status_fused=MOD {0} இலிருந்து ஒலிகள் பயன்பாட்டில் உள்ளன (இணைவு முறை)
gdx.settings.tooltip.joke_sound_item_official={0} | இந்த வங்கியிலிருந்து அதிகாரப்பூர்வ ஒலி. MOD ஒலிகள் {1} க்குள் எந்த கோப்புப் பெயரையும் பயன்படுத்தலாம்.
