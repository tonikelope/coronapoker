zero_trust.legit2_error=\u274c [ZERO-TRUST] ஒருமித்த கிரிப்டோகிராஃபிக் சரிபார்ப்பு: குறைந்த பட்சம் ஒரு வீரர் தங்கள் லோக்கல் ஹேண்ட் கிரிப்டோகிராஃபிக் சரிபார்ப்பைக் கடந்து சான்றிதழ் பெறவில்லை.
