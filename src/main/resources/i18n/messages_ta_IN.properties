game.popup_verificacion_host_sin_prueba=ஒன்று அல்லது அதற்கு மேற்பட்ட பங்கேற்பாளர்கள் ({0}) இந்த கைக்கான நேர்மையான-குலைப்பு ஆதாரம் கிடைக்கவில்லை.\n\nஇறுதி செயின் ஹாஷ்கள் அனைத்து பங்கேற்பாளர்களுக்கும் பொருந்தும், எனவே கை நடவடிக்கைகள் சீரானவை. ஒரு சரியான ஹோஸ்ட் எப்போதும் இந்த ஆதாரத்தை அனுப்புகிறது, எனவே மீண்டும் மீண்டும் அல்லது பியர்-தேர்ந்தெடுக்கப்படாதது மாற்றியமைக்கப்பட்ட மென்பொருள் அல்லது மென்பொருள் குறைபாட்டைக் குறிக்கலாம்.\n\nகை சரி செய்யப்பட்டது, ஆனால் முன்னெச்சரிக்கையாக விளையாட்டை விட்டு வெளியேறுவது பரிந்துரைக்கப்படுகிறது.\n\nசான்றுகள் இதில் சேமிக்கப்பட்டுள்ளன:\n{1}
