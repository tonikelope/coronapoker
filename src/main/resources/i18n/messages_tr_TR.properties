zero_trust.invalid_mac=\u26a0\ufe0f [SIFIR GÜVEN UYARISI] Ortak kartlarda geçersiz MAC. Olası manipülasyon.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [SIFIR GÜVEN] UZLAŞMA KRİPTOGRAFİK DOĞRULAMASI: TÜM OYUNCULAR YEREL EL KRİPTOGRAFİK DOĞRULAMASININ GEÇTİĞİ SERTİFİKALIDIR.
zero_trust.legit2_error=\u274c [SIFIR GÜVEN] UZLAŞMA KRİPTOGRAFİK DOĞRULAMASI: EN AZ BİR OYUNCU YEREL EL KRİPTOGRAFİK DOĞRULAMASININ GEÇMESİNİ ONAYLAMADI.
zero_trust.legit=\u2714\ufe0f [SIFIR GÜVEN] YEREL EL ŞİFRELEME DOĞRULAMASI: KARTLARIM, TOPLULUK KARTLARIM VE KAYITLI TÜM EYLEMLER YASALDIR.
zero_trust.legit_error=\u274c [SIFIR GÜVEN] YEREL EL ŞİFRELEME DOĞRULAMA: KARTLARIMIN, TOPLULUK KARTLARIMIN VE KAYITLI TÜM EYLEMLERİN YASAL OLDUĞUNU SAĞLAYAMIYOR.
zero_trust.lockdown_activated=\ud83d\udd12 [KİLİTLEME] Karantina etkinleştirildi. Kriptografik anahtarların iletiminin engellenmesi.
zero_trust.no_binary_log=\u26a0\ufe0f [SIFIR GÜVEN] Bu el için önceki ikili kayıt yok.
zero_trust.p2p_auditing_memory=[SIFIR GÜVEN] P2P: BELLEK DENETLENİYOR...
zero_trust.p2p_cheater_detected2=[SIFIR GÜVEN] CoronaPoker sürümü değiştirilmiş bir oyuncu tespit edildi, bu da onun hile yapmaya çalışıyor olabileceğini gösteriyor.
zero_trust.p2p_finished_resuming=P2P KEM doğrulaması tamamlandı. El devam ettiriliyor...
zero_trust.p2p_generating_challenges=[SIFIR GÜVEN] P2P: ZORLUKLAR OLUŞTURUYOR...
zero_trust.p2p_timeout=P2P Sürü Zaman Aşımı! Bazı oyuncular güvenilmez olarak işaretlendi.
zero_trust.p2p_verifying_signatures=[SIFIR GÜVEN] P2P: İMZALAR DOĞRULANIYOR...
zero_trust.read_binary_log_failure=[SIFIR GÜVEN] İkili günlük okunamadı.
zero_trust.rejecting_master_key=\ud83d\udd12 [KİLİTLEME] Sunucuya Ana Anahtar Paylaşımı iletimi reddediliyor.
zero_trust.rejecting_street_token=\ud83d\udd12 [KİLİTLEME] Sunucudan gelen Street Token isteği reddediliyor.
