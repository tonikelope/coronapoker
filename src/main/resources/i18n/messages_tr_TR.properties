zero_trust.straddle_recover_mismatch=Eli kurtarırken sunucu, kendi yerel kopyanızın kaydettiğinden straddle farklı olduğunu duyurdu. Bu yalnızca ana bilgisayarın kurtarılan straddle'yi kurcalaması veya istemcisinin hatalı olması durumunda gerçekleşir. El hala güvenilir kopyanızdan yeniden oluşturuluyor ancak sizi önlem olarak uyarıyoruz.
zero_trust.rit_recover_mismatch=Eli kurtarırken sunucu, kendi yerel kopyanızın kaydettiğinden farklı bir iki kez çalıştırma sonucunu duyurdu. Bu yalnızca ana bilgisayarın kurtarılan sonuca müdahale etmesi veya istemcisinin hatalı olması durumunda gerçekleşir. El hala güvenilir kopyanızdan yeniden oluşturuluyor ancak sizi önlem olarak uyarıyoruz.
