tooltip.cfg.buyin_fixed=Herkes aynı giriş bedeli ile başlar. Kapalıyken oyuncular yapılandırılmış aralık içinde seçim yapar.
tooltip.cfg.double_blinds=Belirli sayıda el veya dakikanın ardından yapıdaki bir sonraki kör bahisler seviyesine ilerleme.
tooltip.cfg.hand_limit=Bu el sayısına ulaşıldığında oyun sona erer.
tooltip.cfg.iwtsth=kartları açma'de rakibinizin elini görmeyi istemenizi sağlar.
tooltip.cfg.rabbit=Elden sonra dağıtılmamış ortak kartları ortaya çıkarır. Her oyuncunun ilk isteği ücretsizdir. Seçilen mod, daha sonraki isteklerin ücretsiz mi kalacağını yoksa küçük veya büyük kör bahis tutarında bir maliyete mi sahip olacağını belirler.
tooltip.cfg.rebuy_limit=Oyuncu başına maksimum yeniden satın alma sayısı.
tooltip.cfg.recover=Daha önce kesintiye uğramış bir oyunu devam ettirir.
