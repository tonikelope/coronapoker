zero_trust.fatal_incident_body=CoronaPoker kimliği doğrulanmış bir kritik durumu reddetti ve devam etmeden önce tabloyu durdurdu. Etkilenen tabloyu kapatmak için bu uyarıyı onaylayın.\n\nSıfır Güven kanıtı: {0}
