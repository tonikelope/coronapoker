tooltip.cfg.custom_bots=Özel kataloğu etkinleştirir. Önce yapılandırılmış profiller eklenir, ardından standart botlar eklenir.
tooltip.cfg.custom_bots.only=Standart botların eklenmesini engeller. Özel katalog tükendikten sonra başka bot eklenemez.
tooltip.cfg.custom_bots.manage=Botlarınızı oluşturmak, düzenlemek ve sipariş etmek için yöneticiyi açın. Zorluklarını ve tarzlarını seçebilirsiniz.
tooltip.cfg.custom_bots.row=Adını, avatarını, zorluğunu, stilini veya yeniden alım'yi düzenlemek için bu botu seçin.
tooltip.cfg.custom_bots.avatar=Geçerli bir resim seçin veya resmi bot avatarını koruyun. CoronaPoker kaybolmaması için güvenli bir kopya saklar.
tooltip.cfg.custom_bots.name=Görünen adı $ olmadan girin. Ayrılmış işaretçi otomatik olarak eklenir.
tooltip.cfg.custom_bots.difficulty=Botun kullandığı mücadeleyi ve taktikleri belirler. Kolay eğlence amaçlı oynanır, Normal daha disiplinli bir strateji kullanır ve Sert gelişmiş taktikler kullanır.
tooltip.cfg.custom_bots.personality=Temel stili ayarlar. Bot oluşturulduğunda Random bunu seçer ve aktif oturum boyunca saklar. Bot, kararlarını duruma göre uyarlayabilir.
gdx.settings.option_help.bot_difficulty.easy=Rasgele oynar ve daha sık hata yapar.
gdx.settings.option_help.bot_difficulty.medium=Daha disiplinli bir strateji kullanır ve el geliştikçe kararlarını ayarlar.
gdx.settings.option_help.bot_difficulty.hard=kör bahisler çalmak veya rakip savunmasız göründüğünde baskı uygulamak gibi daha gelişmiş taktikler kullanır.
gdx.settings.option_help.custom_bot_personality.random=Bot oluşturulduğunda bir stil seçer ve onu aktif oturum boyunca saklar.
gdx.settings.option_help.custom_bot_personality.nit=Birkaç ele girer ve genellikle fişleri riske atmadan önce güçlü kartları bekler.
gdx.settings.option_help.custom_bot_personality.station=Bahisleri görme ve elde kalma eğilimindedir. Daha az sıklıkta yükselir.
gdx.settings.option_help.custom_bot_personality.tag=Elleri seçici olarak seçer ve bahisler ve artışlarla liderliği ele geçirme eğilimindedir.
gdx.settings.option_help.custom_bot_personality.lag=Daha geniş bir el yelpazesiyle oynar ve sık sık bahis ve yükseltmelerle baskı uygular.
gdx.settings.option_help.ante_mode.traditional=Her aktif oyuncu büyük kör bahis'nin onda birini en yakın kuruşa yuvarlanmış olarak gönderir.
gdx.settings.option_help.ante_mode.big_blind=büyük kör bahis'deki oyuncu ante'nin tamamını yayınlar, bu da bir büyük kör bahis'ye eşittir.
gdx.settings.option_help.ante_mode.button=Düğmedeki oyuncu, bir büyük kör bahis'ye eşit olan ante'nin tamamını yayınlar.
gdx.settings.option_help.ante_mode.small_blind=küçük kör bahis'deki oyuncu ante'nin tamamını yayınlar, bu da bir büyük kör bahis'ye eşittir.
gdx.settings.option_help.rebuy_cap.buy_in=yeniden alım'den sonraki maksimum yığınınız oyunun giriş bedeli'sine bağlıdır.
gdx.settings.option_help.rebuy_cap.highest_stack=Yeniden alım masadaki en büyük yığına kadar. Üst sınır hiçbir zaman standart giriş bedeli'nin altına düşmez.
gdx.settings.option_help.rabbit.off=Dağıtılmamış ortak kartlar, el bittikten sonra gizli kalır.
gdx.settings.option_help.rabbit.free=El bittikten sonra fiş ödemeden dağıtılmamış ortak kartları görmeyi isteyebilirsiniz.
gdx.settings.option_help.rabbit.free_small_blind=Oyuna ilk talebiniz ücretsizdir. Sonraki her talebin maliyeti bir küçük kör bahis'dir.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Oyuna ilişkin ilk isteğiniz ücretsiz, ikincisi bir küçük kör bahis, sonraki istekleriniz ise bir büyük kör bahis tutarındadır.
gdx.settings.option_help.window_mode.exclusive=Monitörün tam ekran modunu kullanır.
gdx.settings.option_help.window_mode.borderless=Ekranı kenarlıksız bir pencereyle doldurur ve masaüstü görüntüleme modunu korur.
tooltip.cfg.custom_bots.automatic_rebuy=Bu özel botun çipleri bittikten sonra yeniden alım olmasını sağlar. Genel otomatik yeniden alım kontrolü etkinleştirilmelidir.
tooltip.cfg.custom_bots.order_up=Seçilen profili bir konum yukarı taşır. Kaydırma gerektiğinde liste bunu takip eder.
tooltip.cfg.custom_bots.order_down=Seçilen profili bir konum aşağıya taşır. Kaydırma gerektiğinde liste bunu takip eder.
