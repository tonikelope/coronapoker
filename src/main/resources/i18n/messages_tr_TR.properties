tooltip.cfg.straddle=büyük kör bahis'den sonraki oyuncu, kartlarını görmeden önce iki büyük kör bahis atabilir ve flop öncesi son hamleyi yapabilir.
tooltip.cfg.straddle_on_timeout=İstemi zaman aşımına uğradığında straddle'yi otomatik olarak yayınlayın. Bu yalnızca oynatıcınızı etkiler ve varsayılan olarak kapalıdır.
tooltip.cfg.structure=Oyun için Kör bahisler seviyeli yapı.
tooltip.cfg.think_time=Karar vermek için saniyeler var. Otomatik işlem süre dolduğunda çalışır.
tooltip.cfg.showdown_time=Bir sonraki el dağıtılmadan önce el sonucu saniyeler içinde ekranda kalır.
