game.popup_verificacion_firma_invalida=Bu el sırasında, bir veya daha fazla katılımcı ({0}) bir eylemde geçersiz bir kriptografik imza tespit etti.\n\nTüm katılımcılar tarafından alınan veriler tutarlıydı (son zincir karmaları eşleşti), ancak en az bir eylem, beklenen yazarı tarafından düzgün şekilde imzalanmadı.\n\nCoronaPoker, güvenli el kapatmayı durdurdu ve bu uyarının ardından bir güvenlik hatası olarak tabloyu kapatacak. onaylandı.\n\nKanıt şuraya kaydedildi:\n{1}
