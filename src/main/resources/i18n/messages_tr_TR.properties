peer.dropped_during_cascade=Deste kriptografik karışıklığı sırasında bir oyuncunun bağlantısı kesildi. El iptal edildi.
peer.dropped_during_rotation=Deste kriptografik rotasyonu sırasında bir oyuncunun bağlantısı kesildi. El iptal edildi.
zero_trust.rotation_refused=Bağlantılı bir oyuncu deste döndürme anahtarını vermeyi reddetti. Oyun durduruldu. Yeniden kabul edilmeyi reddetmelerini gerekçelendirmeleri gerekecek.
zero_trust.cascade_refused=Bağlantılı bir oyuncu, deste karıştırma kademesinde yer almayı reddetti. Oyun durduruldu. Yeniden kabul edilmeyi reddetmelerini gerekçelendirmeleri gerekecek.
zero_trust.pocket_unlock_refused=Bağlantılı bir oyuncu, cep kartlarının şifresini çözmek için anahtarını teslim etmeyi reddetti. Oyun durduruldu. Yeniden kabul edilmeyi reddetmelerini gerekçelendirmeleri gerekecek.
zero_trust.community_unlock_refused=Bağlantılı bir oyuncu, topluluk kartlarını açığa çıkarmak için anahtarını teslim etmeyi reddetti. Oyun durduruldu. Yeniden kabul edilmeyi reddetmelerini gerekçelendirmeleri gerekecek.
zero_trust.host_showdown_sig_missing=Yazarın kriptografik imzası OLMADAN veya hatalı biçimlendirilmiş imzayla sunucudan bir kartları açma anahtarı alındı. Sunucu anahtarı kablonun üzerinde değiştiriyor olabilir.
zero_trust.host_showdown_sig_invalid=Sunucudan GEÇERSİZ şifreleme imzasına sahip bir kartları açma anahtarı alındı. Sunucu anahtarı kablonun üzerinde değiştiriyor olabilir.
zero_trust.host_potcards_mismatch=Sunucu tarafından gönderilen kartları açma düz metin, yerel parçanızın şifresinin imzalı anahtarla çözülmesinin sonucuyla EŞLEŞMİYOR. Sunucu kartları açma adresine sahte kartlar gönderiyor olabilir.
zero_trust.host_community_garbage=Sunucudan alınan kriptografik topluluk kartı verileri tutarsız (parçanın şifresi geçerli bir deste kartına çözülmüyor veya sunucunun imzalı duyurusuyla eşleşmiyor). Olası nedenler: Yazılımın bazı sürümlerinde bir HATA, kodu değiştirilmiş olabilecek bir sunucu sürümü veya yerel kimlik anahtarı bozulması. Müşteri farkı anlayamıyor ve kimseyi suçlamıyor.
zero_trust.host_unlock_out_of_order=Sunucudan sıra dışı bir şifre çözme isteği alındı (yanlış sokak, tekrarlanan slot, aşamalı olarak kullanım dışı veya önceki cadde kapatılmadan önce gönderilen istek).
zero_trust.host_cascade_mid_hand=Devam eden bir elin ortasında sunucudan bir karıştırma yeniden başlatma isteği alındı ​​(şifre çözme anahtarımın üzerine yazılır).
zero_trust.host_pocket_extraction=Sunucudan KENDİ özel kartlarınızı etkileyecek bir şifre çözme isteği alındı.
zero_trust.host_community_extraction=Sunucudan, önceden bir topluluk kartını açığa çıkaracak bir şifre çözme isteği alındı.
zero_trust.host_rotation_replay=Sunucu aynı elde ikinci bir kart rotasyonu talep etti. Meşru rotasyon el başına benzersizdir. Tekrarlama, diğer oyuncuların kartlarının şifresini çözmek için müşterinizi kullanma girişiminde bulunulduğunu gösterir.
zero_trust.host_shuffle_proof_failed=Anlaşma doğrulaması başarısız oldu: Sunucunun dağıttığı destenin, başlangıç ​​destesinin dürüst bir karışımı olduğu kanıtlanamadı. Topluluk kilit açma işlemleri reddedildi ve özel kartları korumak için bu oturum sonlandırılıyor.
zero_trust.host_shuffle_proof_missing=Anlaşma, bu elin destesi için doğrulanabilir bir dürüst karıştırma kanıtı olmadan gerçekleşti ve şimdi topluluk kartları açıklanıyor. Bu bir hata, ağ gecikmesi ya da anlaşmayı değiştirmeye çalışan bir ana bilgisayar olabilir. Oynamaya devam edebilirsiniz ancak bu masadan ayrılmanız önemle tavsiye edilir.
zero_trust.deck_unverified=Bu elin destesinin dürüst bir karıştırma olduğu doğrulanamadı. ŞÜPHELİ: Karışık kanıtları dağıtan ve yayınlayan sunucu "{0}". Anlaşmayı manipüle eden ev sahibi veya kanıtını saklayan bir oyuncu olabilir. Kartlar zaten dağıtıldığı için el oynanır.
zero_trust.deck_unverified_body=Bu anormalliğin imzalı kanıtı kaydedildi (oyun günlüğünde, kırmızıyla ve tartışmalı eller tablosunda). Oynamaya devam edebilirsiniz ancak sunucuya güvenmiyorsanız masayı terk edin.
zero_trust.seat_redraw=Sunucu "{0}" YENİ koltuk çekilişini zorladı. Bu OLAĞANÜSTÜ bir durum: Çekiliş kolektif ve doğrulanabilir olduğundan, ev sahibi koltukları seçemez, ancak beğendiği bir düzenleme elde edene kadar yeniden çekiliş yapabilir. Tekrarlanıyorsa, koltuğunuza hile karıştırmaya çalışan ev sahibi olabilir.
zero_trust.seat_redraw_body=Yeni çekiliş de aynı şekilde gerçekleşti ve hala doğrulanabilir: Ev sahibi dahil hiç kimse sonucu seçemez. Bu, bir oyuncunun başlangıçta düşmesi durumunda meydana gelebilir, ancak birden fazla yeniden deneme görürseniz ve sunucuya güvenmiyorsanız masayı terk edin. Günlüğe kaydedildi.
zero_trust.seat_recover_mismatch=Oyun kurtarıldığında, sunucu tarafından gönderilen "{0}" oturma sırası müşterinizin kaydettiği oturma düzeniyle EŞLEŞMİYOR: zaten tanıdığınız biri masadaki koltuğu değiştirdi. Kurtarma kisvesi altında koltukları yeniden sıralamaya çalışan bir sunucu olabilir.
zero_trust.seat_recover_mismatch_body=Müşteriniz başlangıçta kendi doğruladığı oturma referansını sakladı. Oyuncuların arada katılması veya ayrılması normaldir. Zaten orada olan birini yeniden sıralamak mümkün değil. Ev sahibine güvenmiyorsanız masayı terk edin. Günlüğe kaydedildi.
zero_trust.host_recover_action_forged=Toplantı sahibi, oyun kurtarma sırasında FORGED eylemi (geçersiz imza) eklemeye çalıştı. Müşteriniz bunu reddetti.
zero_trust.host_recover_action_omitted=Kurtarma sırasında ana bilgisayar, SİZİN yürüttüğünüz ve yerel veritabanınıza kaydettiğiniz bir eylemi atladı. Müşteriniz bunu kendi kopyasında tespit etti ve işleminizi sessizce iptal etmedi.
zero_trust.host_recover_balance_mismatch=Sunucu oyun kurtarma sırasında bakiyenizi (fiş/giriş bedeli) değiştirmeye çalıştı: yerel rekorunuzla eşleşmiyor. Müşteriniz SİZİN gerçek bakiyenizi korudu.
zero_trust.host_board_peek=Toplantı sahibi, GELECEK bir caddeden gelen bir topluluk kartının şifresini çözmeyi talep etti (panoyu erken okuma girişimi). Müşteriniz reddetti.
zero_trust.suspect_host_prefix=ŞÜPHELİ: sunucu "{0}".
zero_trust.suspect_peer_prefix=ŞÜPHELİ: oyuncu "{0}".
zero_trust.peer_alert=⚠️ [ANORMAL OYUNCU DAVRANIŞI]
zero_trust.peer_suspicious_header=Masanızda bir oyuncunun anormal veya kötü niyetli davranışı tespit edildi:\n
zero_trust.peer_suspicious_body=Masaya uygun güvenlik önlemi uygulanır ve oyun diğer oyuncular için devam eder. İyi niyet varsayılmaktadır. Bu bir yazılım hatası olabilir ve kimse suçlanmıyor. Kanıtlar kaydedildi.
zero_trust.peer_inbound_flood=DoS karşıtı eşiğin üzerinde sürekli olarak kimliği doğrulanmış trafik.
zero_trust.peer_binary_flood=Alışılmadık derecede yüksek oranda gönderilen sesli mesaj işlemleri.
zero_trust.host_binary_flood=Toplantı sahibi alışılmadık derecede yüksek bir hızda sesli mesaj işlemleri gönderiyor.
zero_trust.peer_flood_log=Karar bekleyen Anti-DoS olayı: oyuncu {0}, IP {1}. Sebep: {2}
zero_trust.peer_flood_confirm={0} kullanıcısı aşırı miktarda trafik gönderiyor. Bu bir DoS saldırısı veya bir hata olabilir. Onları oyundan çıkarmak mı istiyorsunuz?\n\nIP: {1}\nAlgılanan neden: {2}
zero_trust.peer_flood_suppress=Bu uyarıları gösterme
zero_trust.peer_hand_ready_withheld=Bir oyuncu PING'e yanıt verir ancak oyun devam ederken bir sonraki el için hazır olup olmadığını onaylamaz. El başlangıcını donduruyordu ve ÇIKARILDI. Oyun onlarsız devam ediyor.
zero_trust.peer_action_withheld=Bir oyuncu PING'e yanıt verir ancak oyun devam ederken düşünme süresini aşarak bahis eylemini göndermez. Tur donuyordu ve ihraç edildi. Oyun onlarsız devam ediyor.
zero_trust.peer_conf_withheld=Bir oyuncu PING'e yanıt verir ancak oyun devam ederken bir dağıtma mesajının alındığını onaylamaz. Masanın ilerlemesini engelliyordu ve ihraç edildi. Oyun onlarsız devam ediyor.
zero_trust.peer_deal_refusal_expelled=Bir oyuncu, deste karıştırmayı veya döndürmeyi reddederek arka arkaya birkaç eli iptal etmeye zorladı. Oyunun devam edebilmesi için ÇIKARILDI.
zero_trust.suspicious_alert=⚠️ [ANOMALİ SUNUCU DAVRANIŞI]
zero_trust.suspicious_header=İstemciniz anormal sunucu davranışı tespit etti (oyunu donduran kritik bir olay değil):\n
zero_trust.suspicious_body=İstemciniz anormal işlemi reddetti ve oyun devam edebilir. İyi niyetli olduğumuzu varsayıyoruz: bu bir yazılım HATASI (istemci veya sunucu) olabilir ve kimse suçlanmıyor. Ancak bir hatanın kurcalama dışında söylenemeyeceği için, GÜVENLİĞİNİZ İÇİN 'Ayrıl' butonunu kullanarak bu tablodan ÇIKMANIZ KESİNLİKLE TAVSİYE EDİLİR (paranız bu elde İŞLENMEYECEKTİR).
zero_trust.host_bad_wire=Sunucudan geçersiz formata veya kriptografik eğriye ait olmayan noktalara sahip bir şifre çözme isteği alındı.
zero_trust.host_critical_command_invalid=Sunucu tarafından gönderilen kritik {0} komutu doğrulanamadı. Bu bir uyumsuzluk, bir hata veya değiştirilmiş bir sunucu olabilir. Bütünlüğünü korumak için oturum durdurulur.
zero_trust.cheater_detected=[SIFIR GÜVEN] CoronaPoker sürümü değiştirilmiş bir oyuncu tespit edildi, bu da onun hile yapmaya çalışıyor olabileceğini gösteriyor. Devam etmek istiyor musun?
zero_trust.corrupted_mac_action=Sunucu, aşağıdakiler adına geçersiz şifreleme imzasına (bozuk MAC) sahip bir eylemi işlemeye çalıştı:
zero_trust.critical=\u274c [SIFIR GÜVEN] KRİTİK UYARI: GEÇERSİZ İMZA VEYA BOZUK UZLAŞMA.
zero_trust.critical_alert_body=KARANTİNA DURUMU ETKİNLEŞTİRİLDİ:\nİstemciniz bu oturumda sunucuya daha fazla kriptografik anahtar GÖNDERMEYECEK.\nOyun, bakiyenizi korumak için matematiksel olarak donduruldu.\n\nOLASI nedenler:\n - istemci kodunun kendisinde bir HATA,\n - sunucu kodunda bir HATA, veya\n - kodu değiştirilmiş olabilecek bir SUNUCU.\n\nMüşteri aralarında ayrım yapamaz ve HİÇBİR suçlama ima edilmez. Güvenliğiniz için ve temel nedenin incelenmesini bekleyene kadar, 'Çıkış' düğmesini kullanarak bu oyundan ÇIKMANIZ TAVSİYE EDİLİR (paranız bu elde İŞLENMEYECEKTİR).
zero_trust.critical_alert_header=SIFIR GÜVEN OLAYI!\n\nMüşteriniz şifreleme protokolünde bir anormallik tespit etti:\n
zero_trust.critical_session_error=[SIFIR GÜVEN] KRİTİK OTURUM HATASI
zero_trust.decrypting_street=[SIFIR GÜVEN] SOKAĞIN ŞİFRESİ ÇÖZÜLÜYOR...
zero_trust.wait_deal=Kartları karıştırıp dağıtmak için oyuncuların katkıları bekleniyor.
zero_trust.wait_shuffle_proof=Karıştırmanın kriptografik kanıtı bekleniyor.
zero_trust.wait_sra_unlock={0} kartlarını açmak için SRA anahtarları bekleniyor.
game.settlement_verification_wait=Eli ve bakiyeleri doğrulamak için onaylar bekleniyor.
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [SIFIR GÜVEN] Hızlı Konsensüs Zaman Aşımı. İlerlemeyi zorlamak.
zero_trust.forged_identity_action=Sunucu, aşağıdakiler adına sahte kimlik imzasıyla bir eylemi gerçekleştirmeye çalıştı:
zero_trust.game_aborted=[SIFIR GÜVEN] Oyun iptal edildi. Hile yapanları tekmeleyin.
