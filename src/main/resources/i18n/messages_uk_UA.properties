zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [НУЛЬОВА ДОВІРА] КОНСЕНСУСНА КРИПТОГРАФІЧНА ПЕРЕВІРКА: УСІ ГРАВЦІ СЕРТИФІКТУВАЛИ ПРОХОДЖЕННЯ ЛОКАЛЬНОЇ КРИПТОГРАФІЧНОЇ ПЕРЕВІРКИ.
zero_trust.legit2_error=\u274c [НУЛЬОВА ДОВІРА] КОНСЕНСУСНА КРИПТОГРАФІЧНА ПЕРЕВІРКА: ПРИНАЙМЕНШЕ ОДИН ГРАВЕЦЬ НЕ СЕРТИФІКУВАВ ПРОХОДЖЕННЯ ЛОКАЛЬНОЇ КРИПТОГРАФІЧНОЇ ПЕРЕВІРКИ.
zero_trust.legit=\u2714\ufe0f [НУЛЬ ДОВІРИ] ЛОКАЛЬНА РУЧНА КРИПТОГРАФІЧНА ПЕРЕВІРКА: МОЇ КАРТКИ, СПІЛЬНІ КАРТКИ ТА ВСІ ЗАПИСАНІ ДІЇ Є ЗАКОННИМИ.
zero_trust.legit_error=\u274c [НУЛЬОВА ДОВІРА] ЛОКАЛЬНА РУЧНА КРИПТОГРАФІЧНА ПЕРЕВІРКА: НЕМОЖЛИВО ПЕРЕВІРИТИ, ЩО МОЇ КАРТКИ, СПІЛЬНІ КАРТКИ ТА ВСІ ЗАПИСАНІ ДІЇ Є ЗАКОННИМИ.
