gdx.settings.tooltip.amount_decimal_zeros=Цілі суми фішок відображаються без десяткових знаків, наприклад 9. Для дробових сум Ні (за замовчуванням) показує 6.2. Тільки якщо є місце, показує 6.20, коли він підходить, і пробує 6.2 перед зменшенням розміру шрифту. Завжди зберігає 6.20 і за потреби зменшує розмір шрифту. У всіх трьох режимах зберігаються значущі цифри.
