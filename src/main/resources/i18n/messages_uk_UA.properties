zero_trust.decrypting_street=[НУЛЬОВА ДОВІРА] РОЗШИФРУЄМО ВУЛИЦЮ...
zero_trust.fast_consensus_timeout=\u26a0\ufe0f [НУЛЬ-ДОВІРА] Швидкий тайм-аут консенсусу. Форсування просування.
zero_trust.forged_identity_action=Сервер спробував обробити дію з підробленим ідентифікаційним підписом від імені:
