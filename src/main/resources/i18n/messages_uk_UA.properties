zero_trust.cascade_failed=\u274c [ZERO-TRUST] Помилка криптографічного перетасування. Роздачу скасовано.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Не вдалося розблокувати особисті картки (гравець не відповів вчасно). Роздачу скасовано.
zero_trust.card_resolve_failed=\u274c [НУЛЬОВА ДОВІРА] Розшифрована карта не збігається з жодною дійсною картою в колоді. Гру скасовано.
peer.not_enough_players=Гравець випав під час перемішування, і більше не вистачає гравців, щоб роздати руку.
peer.unlock_no_testament=Гравець від’єднався, не залишивши свого ключа розшифровки. Роздачу скасовано.
peer.broadcast_failed=Помилка мережі під час трансляції приватних карток. Роздачу скасовано.
peer.recovery_action_data_unavailable=Не вдалося прочитати збережену історію дій. Роздачу безпечно скасовано та повернеться до відновлення.
straddle.deferred_release_failed=Не вдалося розкрити карти блайнди страдл (гравець відключився або відмовився співпрацювати). Роздачу скасовано.
peer.state_inconsistent=Стан дилера став суперечливим. Роздачу скасовано.
peer.bot_no_token=У бота не готовий ключ розшифровки. Роздачу скасовано.
peer.community_unlock_no_testament=Гравець від’єднався, не залишивши свого ключа, щоб відкрити спільні карти. Роздачу скасовано.
peer.dropped_during_cascade=Під час криптографічного перемішування колоди відключено гравця. Роздачу скасовано.
peer.dropped_during_rotation=Під час криптографічної ротації колоди відключено гравця. Роздачу скасовано.
zero_trust.rotation_refused=Підключений гравець відмовився надати ключ обертання колоди. Гра зупинена. Їм потрібно буде обґрунтувати свою відмову від повторного прийому.
zero_trust.cascade_refused=Підключений гравець відмовився брати участь у каскаді перемішування колод. Гра зупинена. Їм потрібно буде обґрунтувати свою відмову від повторного прийому.
zero_trust.pocket_unlock_refused=Підключений гравець відмовився надати свій ключ для розшифровки кишенькових карток. Гра зупинена. Їм потрібно буде обґрунтувати свою відмову від повторного прийому.
zero_trust.community_unlock_refused=Підключений гравець відмовився доставити свій ключ, щоб відкрити спільні карти. Гра зупинена. Їм потрібно буде обґрунтувати свою відмову від повторного прийому.
zero_trust.host_showdown_sig_missing=З сервера отримано ключ розкриття БЕЗ криптографічного підпису автора або з неправильним підписом. Можливо, сервер замінює ключ на дроті.
zero_trust.host_showdown_sig_invalid=Від сервера отримано ключ розкриття з НЕДІЙСНИМ криптографічним підписом. Можливо, сервер замінює ключ на дроті.
zero_trust.host_potcards_mismatch=Відкритий текст розкриття, надісланий сервером, НЕ ВІДПОВІДАЄ результату розшифровки вашого локального фрагмента за допомогою підписаного ключа. Можливо, сервер надсилає підроблені картки на розкриття.
zero_trust.host_community_garbage=Криптографічні дані спільної картки, отримані від сервера, є суперечливими (частка не розшифровується до дійсної карти колоди або не відповідає підписаному оголошенню сервера). Можливі причини: ПОМИЛКА в деякій версії програмного забезпечення, версія сервера, код якої, можливо, було змінено, або пошкодження локального ключа ідентифікації. Клієнт не може відрізнити і нікого НЕ звинувачує.
zero_trust.host_unlock_out_of_order=Запит на розшифровку отримано від сервера поза послідовністю (неправильна вулиця, повторний слот, поступове припинення порядку або запит, надісланий до закриття попередньої вулиці).
zero_trust.host_cascade_mid_hand=Запит на перезапуск у випадковому порядку було отримано від сервера в середині поточної роздачі (це перезапише мій ключ дешифрування).
zero_trust.host_pocket_extraction=Від сервера отримано запит на розшифровку, який вплине на ВАШІ ВЛАСНІ приватні картки.
zero_trust.host_community_extraction=Від сервера отримано запит на розшифровку, який завчасно відкриває спільну картку.
zero_trust.host_rotation_replay=Сервер надіслав запит на другу ротацію карти в тій самій роздачі. Законна ротація є унікальною для кожної роздачі. Повторення означає спробу використати ваш клієнт для розшифровки карток інших гравців.
zero_trust.host_shuffle_proof_failed=Перевірити угоду не вдалось: неможливо було довести, що колода, яку роздав сервер, є чесним перетасуванням колоди генезису. Розблокування спільноти було відхилено, і цей сеанс припинено, щоб захистити приватні картки.
zero_trust.host_shuffle_proof_missing=Угода відбулася без підтвердження чесного перетасування колоди цієї роздачі, і зараз розкриваються загальні карти. Це може бути помилка або затримка мережі, або хост намагається маніпулювати угодою. Ви можете продовжувати грати, але настійно рекомендуємо залишити цей стіл.
zero_trust.deck_unverified=Колоду цієї роздачі НЕ можна перевірити як чесну тасування. ПІДОЗРЮВАНИЙ: ведучий "{0}", який роздає та транслює доказ перемішування. Це може бути господар, який маніпулює угодою, або гравець, який приховав свій доказ. Роздача закінчена, оскільки карти вже роздано.
zero_trust.deck_unverified_body=Підписані докази цієї аномалії були записані (в ігровому журналі, червоним кольором і в таблиці спірних роздач). Ви можете продовжувати гру, але якщо ви не довіряєте господареві, покиньте стіл.
zero_trust.seat_redraw=Господар "{0}" примусив НОВЕ жеребкування місць. Це НЕЗВИЧАЙНО: жеребкування є колективним і перевіряється, тому ведучий не може вибрати місця, але він МОЖЕ повторити, доки не отримає розташування, яке йому подобається. Якщо це повторюється, можливо, господар намагається підлаштувати ваше місце.
zero_trust.seat_redraw_body=Новий розіграш відбувався так само, і його все ще можна перевірити: ніхто, включаючи господаря, не може вибрати результат. Це може статися, якщо гравець випав на початку, але якщо ви бачите кілька повторних спроб і не довіряєте організатору, покиньте стіл. Це було записано.
zero_trust.seat_recover_mismatch=Після відновлення гри порядок розсадження, надісланий організатором «{0}», НЕ збігається з тим, який зберіг ваш клієнт: хтось, кого ви вже знаєте, змінив місце за столом. Можливо, господар намагається змінити порядок місць під прикриттям відновлення.
zero_trust.seat_recover_mismatch_body=Ваш клієнт зберіг номер місця, який він сам перевірив на початку. Гравці приєднуються або залишають між собою це нормально. Перезамовлення того, хто вже був там, не є. Якщо ви не довіряєте господареві, покиньте стіл. Це було записано.
zero_trust.host_recover_action_forged=Хост намагався ввести дію FORGED (недійсний підпис) під час відновлення гри. Ваш клієнт відмовився.
zero_trust.host_recover_action_omitted=Під час відновлення хост пропустив дію, яку ВИ грали та записали у вашій локальній базі даних. Ваш клієнт виявив це на своїй власній копії та мовчки НЕ відмовився від вашої дії.
zero_trust.host_recover_balance_mismatch=Організатор спробував змінити ваш баланс (фішки/бай-ін) під час відновлення гри: він не збігається з вашим локальним рекордом. Ваш клієнт зберіг ВАШ реальний баланс.
zero_trust.host_board_peek=Ведучий попросив розшифрувати загальну картку з вулиці FUTURE (спроба прочитати дошку раніше). Ваш клієнт відмовився.
zero_trust.suspect_host_prefix=ПІДОЗРЮВАНИЙ: хост "{0}".
zero_trust.suspect_peer_prefix=ПІДОЗРЮВАНИЙ: гравець "{0}".
zero_trust.peer_alert=⚠️ [АНОМАЛЬНА ПОВЕДІНКА ГРАВЦЯ]
zero_trust.peer_suspicious_header=За вашим столом було виявлено аномальну або образливу поведінку гравця: \n
zero_trust.peer_suspicious_body=Стол застосував відповідний захід безпеки, і гра продовжується для інших гравців. Добросовісність передбачається. Це може бути програмна помилка, і нікого не звинувачують. Свідчення протоколюються.
zero_trust.peer_inbound_flood=Стійкий автентифікований трафік перевищує порогове значення захисту від DoS.
zero_trust.peer_binary_flood=Голосові повідомлення надсилаються з надзвичайно високою швидкістю.
zero_trust.host_binary_flood=Хост надсилає голосові повідомлення з надзвичайно високою швидкістю.
zero_trust.peer_flood_log=Анти-DoS-інцидент очікує на рішення: гравець {0}, IP {1}. Причина: {2}
zero_trust.peer_flood_confirm=Користувач {0} надсилає надмірну кількість трафіку. Це може бути DoS-атака або помилка. Виключити їх із гри?\n\nIP: {1}\nВиявлена причина: {2}
zero_trust.peer_flood_suppress=Не показувати ці попередження
zero_trust.peer_hand_ready_withheld=Гравець відповідає на PING, але не підтверджує готовність до наступної роздачі під час гри. Він заморожував старт руки і був ВИГНАНИЙ. Гра продовжується без них.
zero_trust.peer_action_withheld=Гравець відповідає на запит PING, але не надсилає свою дію щодо ставок під час гри, поза часом на роздуми. Це було холодно, і його ВИГНАЛИ. Гра продовжується без них.
zero_trust.peer_conf_withheld=Гравець відповідає на PING, але не підтверджує отримання повідомлення про роздачу під час гри. Він блокував рух столу, і його ВИГНАЛИ. Гра продовжується без них.
zero_trust.peer_deal_refusal_expelled=Гравець змусив скасувати кілька роздач поспіль, відмовившись від перемішування чи обертання колоди. Його ВИГНАНО, тому гра може продовжуватися.
zero_trust.suspicious_alert=⚠️ [АНОМАЛЬНА ПОВЕДІНКА СЕРВЕРА]
zero_trust.suspicious_header=Ваш клієнт виявив аномальну поведінку сервера (не критичний інцидент, який зависає у грі): \n
zero_trust.suspicious_body=Ваш клієнт відхилив аномальну операцію, і гра МОЖЕ продовжуватися. Ми припускаємо добросовісність: це може бути ПОМИЛКА програмного забезпечення (клієнта чи сервера), і нікого не звинувачують. Але оскільки помилку неможливо відрізнити від втручання, ДЛЯ ВАШОЇ БЕЗПЕКИ НАСТІЙНО РЕКОМЕНДУЄМО ЗАЛИШИТИ цей стіл, натиснувши кнопку «Вийти» (ваші гроші НЕ будуть оброблені в цій роздачі).
zero_trust.host_bad_wire=Від сервера надійшов запит на дешифрування з недійсним форматом або точками, які не належать до криптографічної кривої.
zero_trust.host_critical_command_invalid=Критичну команду {0}, надіслану сервером, не вдалося перевірити. Це може бути несумісність, помилка або модифікований сервер. Сеанс зупинено для захисту його цілісності.
zero_trust.cheater_detected=[НУЛЬ-ДОВІРИ] Було виявлено гравця зі зміненою версією CoronaPoker, що свідчить про те, що він міг намагатися шахраювати. Ви хочете продовжити?
zero_trust.corrupted_mac_action=Сервер спробував обробити дію з недійсним криптографічним підписом (пошкоджений MAC) від імені:
zero_trust.critical=\u274c [НУЛЬ ДОВІРИ] КРИТИЧНЕ ПОПЕРЕДЖЕННЯ: НЕПРАВИЛЬНИЙ ПІДПИС АБО ПОРУШЕНИЙ КОНСЕНСУС.
zero_trust.critical_alert_body=АКТИВОВАНИЙ СТАН КАРАНТИНУ:\nВаш клієнт НЕ БУДЕ надсилати більше криптографічних ключів на сервер протягом цього сеансу.\nГру математично заморожено, щоб захистити ваш баланс.\n\nМОЖЛИВИМИ причинами є:\n - ПОМИЛКА в коді клієнта себе,\n - ПОМИЛКА в коді сервера або\n - СЕРВЕР, код якого, можливо, було змінено.\n\nКлієнт не може розрізняти їх, і ЖОДНОГО звинувачення не мається на увазі. З міркувань безпеки та до розгляду першопричини РЕКОМЕНДОВАНО, щоб ви ЗАЛИШИЛИ цю гру, натиснувши кнопку «Вийти» (ваші гроші НЕ будуть оброблені в цій роздачі).
zero_trust.critical_alert_header=ІНЦИДЕНТ НУЛЬОВОЇ ДОВІРИ!\n\nВаш клієнт виявив аномалію в криптографічному протоколі:\n
