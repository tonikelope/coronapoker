tooltip.cfg.ante=Додає примусовий внесок до банку після блайнди. Режим визначає, хто і скільки платить.
tooltip.cfg.ante_mode=У традиційному режимі кожен активний гравець платить 10% від великий блайнд. У BBA, BA або SBA великий блайнд, кнопка або малий блайнд приносить один великий блайнд. Блайнди публікуються першими.
tooltip.cfg.blind_cap=Зупиняє збільшення блайнди на налаштованому ліміті.
tooltip.cfg.blinds_level=Починаючи з блайнди (маленький/великий) для гри.
tooltip.cfg.bot_balance=Коли гра закінчується, загальний баланс ботів розподіляється порівну між гравцями-людьми, тому реальні гроші розраховуються лише між людьми.
tooltip.cfg.bot_rebuy=Глобальний автоматичний контроль ребай для кожного бота. Вимкнення також вимикає налаштування ребай власних ботів.
tooltip.cfg.bots=Встановлює складність стандартних ботів. Спеціальні боти зберігають складність, налаштовану індивідуально в диспетчері ботів.
tooltip.cfg.buyin_fixed=Усі починають з одного бай-ін. Коли вимкнено, гравці вибирають у межах налаштованого діапазону.
tooltip.cfg.double_blinds=Перехід до наступного рівня блайнди у структурі після встановленої кількості роздач або хвилин.
tooltip.cfg.hand_limit=Гра закінчується, коли досягнуто цієї кількості рук.
tooltip.cfg.iwtsth=Дозволяє попросити побачити руку суперника на розкриття.
tooltip.cfg.rabbit=Відкриває нероздані загальні карти після роздачі. Перший запит кожного гравця безкоштовний. Вибраний режим визначає, чи пізніші запити залишаються безкоштовними чи коштують невелику суму або великий блайнд.
tooltip.cfg.rebuy_limit=Максимальна кількість докупів на гравця.
tooltip.cfg.recover=Відновлює гру, яка була раніше перервана.
tooltip.cfg.rit=Дозволяє голосувати двічі, коли Ол-ін закриває ставки.
tooltip.cfg.straddle=Гравець після великий блайнд може опублікувати два великий блайнд до того, як побачить свої карти, і діяти останнім на префлопі.
tooltip.cfg.straddle_on_timeout=Опублікуйте страдл автоматично, коли закінчиться підказка. Це впливає лише на ваш плеєр і вимкнено за умовчанням.
tooltip.cfg.structure=Структура рівня Блайнди для гри.
tooltip.cfg.think_time=Секунди доступні для прийняття рішення. Автоматична дія виконується після закінчення часу.
tooltip.cfg.showdown_time=Кілька секунд результат роздачі залишається на екрані перед роздачею наступної роздачі.
tooltip.cfg.allow_hot_join=Дозволяє новим гравцям приєднуватися до розігріву та брати участь у наступній роздачі. Якщо змінити під час гри, це впливає лише на нові спроби підключення.
tooltip.cfg.card_flip_duration=Встановлює час, протягом якого кожна картка завершує свій хід після відкриття.
tooltip.cfg.card_flip_direction=Вибирає, у який бік повертаються картки, коли вони відкриваються. Mixed вибирає напрямок для кожного розкриття. Картки в одній групі обертаються однаково.
tooltip.cfg.card_flip_zoom=Збільшує картки під час перегортання, щоб вони рухалися до екрана.
tooltip.cfg.reparto_velocidad=Встановлює, скільки часу потрібна кожній карті, щоб пройти від колоди до свого місця.
tooltip.cfg.community_deal_style=Виберіть, чи роздавати всі п’ять спільних карт обличчям донизу на початку чи на їхній вулиці. Збережені зміни застосовуються з наступної роздачі.
tooltip.cfg.anim_calidad=Якість зберігає кожну візуальну деталь. Продуктивність знижує вартість карткових польотів і розкриття на більш слабких комп'ютерах.
tooltip.cfg.downgrade_velocidad=Встановлює час, протягом якого стіл переставляє свої місця, коли гравець виходить.
tooltip.cfg.swap_velocidad=Встановлює час, протягом якого ваші картки перетинаються після сортування.
tooltip.cfg.swap_estilo=Арк піднімає одну карту над іншою. Горизонталь перетинає їх на одній висоті.
tooltip.cfg.resaltar_avatares=Якщо на мить навести вказівник миші на аватар гравця, він буде збільшений над столом, поруч із його іменем і стеком, і він зникне, коли ви відведете мишу від нього.
tooltip.cfg.resaltar_jugada_showdown=Під час розкриття наведення курсора на назву будь-якої роздачі гравця (переможець чи програш) висвітлює лише карти, які входять до нього, і затемнює решту.
tooltip.cfg.screenshot_fin_timba=Автоматично зберігає знімок екрана останнього екрана, коли лічильник грошей закінчується (або коли ви залишаєте його, якщо виходите раніше).
tooltip.cfg.server_ip=Адреса (IP або домен), де слухає ігровий сервер.
tooltip.cfg.server_port=TCP порт від 1 до 65535, який прослуховує сервер.
tooltip.cfg.upnp=Запитує ваш маршрутизатор пересилати цей порт TCP на хост до завершення ігрового сеансу.
tooltip.cfg.preset=Завантажує збережений профіль налаштувань.
tooltip.cfg.preset_save=Зберігає поточні налаштування як багаторазовий профіль.
tooltip.cfg.preset_delete=Видалення вибраного профілю налаштувань.
tooltip.cfg.buyin=Фішки, з яких кожен гравець починає за столом.
tooltip.cfg.buyin_range=Зі змінною бай-ін кожен гравець вибирає свій бай-ін у цьому діапазоні (у великий блайнд).
tooltip.cfg.volume=Загальний обсяг гри.
tooltip.cfg.sound_master=Вмикає або вимикає музику, звукові ефекти та звук чату. Покерний відеоплеєр має власну гучність.
tooltip.cfg.music_master=Вмикає або вимикає всю музику.
tooltip.cfg.fx_master=Вмикає або вимикає всі звукові ефекти.
tooltip.cfg.game_start_sound=Відтворює звук початку, коли гра починається або відновлюється.
tooltip.cfg.music_surface=Вмикає музику для цього екрана або моменту. Кнопка відтворення переглядає його, не виходячи з налаштувань.
tooltip.cfg.recovery_music=Вмикає музику, яка відтворюється під час відновлення перерваної гри.
tooltip.cfg.silly_sounds=Вмикає звуки жартів, які можуть відтворюватися під час гри.
gdx.settings.tooltip.mod_audio_override=Використовується версія, яка надається завантаженим MOD.
tooltip.cfg.play_own_notes=Також відтворює ваші власні голосові нотатки, коли ви їх надсилаєте.
tooltip.cfg.notes_retention=Встановлює тривалість зберігання голосових нотаток. З «Назавжди» вони видаляються лише вручну.
tooltip.cfg.purge_notes=Прямо зараз видаляє всі збережені голосові нотатки.
tooltip.cfg.view_notes=Відкриває засіб перегляду збережених голосових нотаток.
tooltip.cfg.voice_notes_rule=Правило таблиці: дозволяє надсилати та отримувати голосові нотатки.
tooltip.cfg.notes_local=Вмикає голосові нотатки на вашій машині (запис і відтворення).
tooltip.cfg.tts=Дозволяє читати вголос повідомлення чату. Кожен гравець може вимкнути синтез мовлення на своєму пристрої.
tooltip.cfg.display_mode=Вибирайте між повноекранним режимом у вікні, без рамок і ексклюзивним повноекранним режимом. Застосовується під час збереження.
tooltip.cfg.compact_view=Зменшує фішки та карти, щоб показати більше столу. Штати: вимкнений, компактний, компактний з маленькими картками, а також компактний своїми руками.
tooltip.cfg.dialog_zoom=Масштабує діалоги та їхній текст. Його можна змінити лише з початкового екрана. Це стосується наступного діалогового вікна, яке ви відкриваєте.
tooltip.cfg.deck=Дизайн колоди карт.
tooltip.cfg.table_renderer=Виберіть GDX або Swing Legacy для наступної таблиці. Його не можна змінити під час гри.
