game.popup_verificacion_divergente=Один або кілька учасників повідомили про іншу криптографічну перевірку кінцевого стану руки.\n\nЦе може бути спричинено модифікованим програмним забезпеченням або дефектом програмного забезпечення. CoronaPoker не може автоматично визначити причину чи причину.\n\nCoronaPoker припинив безпечне закриття рук і закриє стіл через збій безпеки після підтвердження цього попередження.\n\nДокази збережено в:\n{0}
game.popup_verificacion_ausente=В останній роздачі не вдалося досягти консенсусу, оскільки гравець {0} не надіслав завершальний підпис.\n\nЦе може бути спричинено збоєм у мережі, збоєм клієнта або зміненим програмним забезпеченням. CoronaPoker зупинив надійне закриття рукою та закриє стіл через помилку безпеки після підтвердження цього попередження.\n\nДокази збережено в:\n{1}
game.mano_verificacion_interrumpida=КРИТИЧНО: Не вдалося надійно закрити рукою ({0}). Таблиця закриється через помилку безпеки. Докази: {1}
