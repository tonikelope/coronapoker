tooltip.cfg.custom_bots=Вмикає спеціальний каталог. Спочатку додаються налаштовані профілі, а потім стандартні боти.
tooltip.cfg.custom_bots.only=Запобігає додаванню стандартних ботів. Після вичерпання спеціального каталогу більше ботів не можна додавати.
tooltip.cfg.custom_bots.manage=Відкрийте менеджер, щоб створювати, редагувати та впорядковувати своїх ботів. Ви можете вибрати їх складність і стиль.
tooltip.cfg.custom_bots.row=Виберіть цього бота, щоб змінити його ім’я, аватар, складність, стиль або ребай.
tooltip.cfg.custom_bots.avatar=Виберіть дійсне зображення або збережіть офіційний аватар бота. CoronaPoker зберігає безпечну копію, щоб її не втратити.
tooltip.cfg.custom_bots.name=Введіть видиме ім'я без $. Зарезервований маркер додається автоматично.
tooltip.cfg.custom_bots.difficulty=Встановлює завдання та тактику, яку використовує бот. Easy грає на дозвіллі, Normal використовує більш дисципліновану стратегію, а Hard використовує просунуту тактику.
tooltip.cfg.custom_bots.personality=Встановлює базовий стиль. Випадковий вибирає його під час створення бота та зберігає для активного сеансу. Бот може адаптувати свої рішення до ситуації.
gdx.settings.option_help.bot_difficulty.easy=Грає невимушено і частіше помиляється.
gdx.settings.option_help.bot_difficulty.medium=Використовує більш дисципліновану стратегію та коригує рішення в міру розвитку руки.
gdx.settings.option_help.bot_difficulty.hard=Використовує більш просунуту тактику, як-от крадіжку блайнди або застосування тиску, коли опонент виглядає вразливим.
gdx.settings.option_help.custom_bot_personality.random=Вибирає стиль під час створення бота та зберігає його для активного сеансу.
gdx.settings.option_help.custom_bot_personality.nit=Вступає в кілька роздач і зазвичай чекає сильних карт, перш ніж ризикувати фішками.
gdx.settings.option_help.custom_bot_personality.station=Схильний коллувати ставки та залишатися в роздачі. Піднімає рідше.
gdx.settings.option_help.custom_bot_personality.tag=Вибірково вибирає руки і прагне взяти на себе лідерство з ставками та рейзами.
gdx.settings.option_help.custom_bot_personality.lag=Грає з ширшим діапазоном рук і чинить тиск за допомогою частих ставок і рейзів.
gdx.settings.option_help.ante_mode.traditional=Кожен активний гравець ставить одну десяту великий блайнд, округлену до найближчого цента.
gdx.settings.option_help.ante_mode.big_blind=Гравець у полі великий блайнд публікує весь анте, що дорівнює одному великий блайнд.
gdx.settings.option_help.ante_mode.button=Гравець на баттоні ставить цілий анте, що дорівнює одному великий блайнд.
gdx.settings.option_help.ante_mode.small_blind=Гравець у полі малий блайнд публікує весь анте, що дорівнює одному великий блайнд.
gdx.settings.option_help.blind_unit.minutes=Інтервал між підвищеннями блайнди вимірюється в хвилинах гри.
gdx.settings.option_help.blind_unit.hands=Блайнди збільшується після завершення вказаної кількості роздач.
gdx.settings.option_help.rebuy_cap.buy_in=Ваш максимальний стек після ребай базується на бай-ін гри.
gdx.settings.option_help.rebuy_cap.highest_stack=Ребай до найбільшого стека за столом. Кришка ніколи не опускається нижче стандарту бай-ін.
gdx.settings.option_help.rabbit.off=Нероздані загальні карти залишаються прихованими після завершення роздачі.
gdx.settings.option_help.rabbit.free=Ви можете попросити побачити нероздані загальні карти після того, як роздача завершиться без сплати фішок.
gdx.settings.option_help.rabbit.free_small_blind=Ваш перший запит у грі безкоштовний. Кожен наступний запит коштує один малий блайнд.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Ваш перший запит у грі безкоштовний, другий коштує один малий блайнд, а наступні запити коштують один великий блайнд.
gdx.settings.option_help.window_mode.exclusive=Використовує повноекранний режим монітора.
gdx.settings.option_help.window_mode.borderless=Заповнює екран вікном без полів і зберігає режим відображення робочого столу.
gdx.settings.option_help.window_mode.windowed=Відкриває CoronaPoker у вікні, яке можна переміщувати та змінювати розмір.
gdx.settings.option_help.fps_limit.fixed=Встановлює фіксовану максимальну частоту кадрів. Нижня кришка може зменшити споживання енергії.
gdx.settings.option_help.fps_limit.monitor=Відповідає обмеженню частоти кадрів до частоти оновлення монітора, на якому відображається гра.
gdx.settings.option_help.msaa.0=Вимикає згладжування кількох вибірок для таблиці та інтерфейсу. Вимагає перезавантаження.
gdx.settings.option_help.msaa.2=Використовує 2 зразки на піксель для згладжування країв із низькою вартістю графіки. Вимагає перезавантаження.
gdx.settings.option_help.msaa.4=Використовує 4 вибірки на піксель, щоб збалансувати згладжування країв і вартість графіки. Вимагає перезавантаження.
gdx.settings.option_help.msaa.8=Використовує 8 вибірок на піксель для найсильнішого згладжування, яке пропонує це налаштування. Вимагає перезавантаження.
gdx.settings.option_help.card_rendering.native=Витягує картки безпосередньо, щоб зменшити витрати на рендеринг.
gdx.settings.option_help.card_rendering.smooth=Використовує додатковий фільтр для згладжування країв карти за вищої вартості графіки.
tooltip.cfg.custom_bots.automatic_rebuy=Дозволяє цьому спеціальному боту ребай після закінчення фішок. Глобальний автоматичний контроль ребай має бути ввімкнено.
tooltip.cfg.custom_bots.order_up=Переміщує вибраний профіль на одну позицію вгору. Список слідує за ним, коли потрібно прокручувати.
tooltip.cfg.custom_bots.order_down=Пересуває вибраний профіль на одну позицію вниз. Список слідує за ним, коли потрібно прокручувати.
tooltip.cfg.custom_bots.random_selection=Перемішує каталог один раз, коли створюється лобі. Кожен спеціальний бот може увійти лише один раз, і вибір залишається стабільним для цього лобі.
tooltip.cfg.custom_bots.new=Готує новий профіль без зміни вже збережених ботів.
tooltip.cfg.custom_bots.save=Додає новий профіль або зберігає зміни, внесені до вибраного бота.
tooltip.cfg.custom_bots.delete=Видаляє вибраний профіль після запиту підтвердження.
tooltip.cfg.custom_bots.close=Закриває менеджер. Збережені профілі та їх порядок зберігаються автоматично.
