game.popup_verificacion_firma_invalida=Під час цієї роздачі один або кілька учасників ({0}) виявили недійсний криптографічний підпис у дії.\n\nДані, отримані всіма учасниками, були узгодженими (кінцеві хеші ланцюга збігалися), але принаймні одна дія не була належним чином підписана її очікуваним автором.\n\nCoronaPoker припинив безпечне закриття роздач і закриє стіл як збій безпеки після підтвердження цього попередження.\n\nДокази збережено в:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Примітка: {0} не отримав підтвердження чесного перемішування для цієї роздачі. Докази: {1}
game.popup_verificacion_host_sin_prueba=Один або кілька учасників ({0}) не отримали підтвердження чесного перемішування для цієї роздачі.\n\nОстанній ланцюжок хешів збігається для всіх учасників, тому дії рук є послідовними. Правильний хост завжди надсилає це підтвердження, тому повторна або селективна відсутність може вказувати на модифіковане програмне забезпечення або дефект програмного забезпечення.\n\nРоздачу було вирішено, але як запобіжний захід рекомендується залишити гру.\n\nДокази збережено в:\n{1}
game.popup_verificacion_titulo_alerta=Розбіжність криптографічної перевірки
