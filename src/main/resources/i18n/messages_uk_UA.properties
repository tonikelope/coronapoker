zero_trust.peer_sra_corrupt=Підпис розкриття є справжнім, але ключ SRA однорангового вузла не розпізнає дійсні картки. Це трапляється, лише якщо одноранговий вузол навмисно підписав пошкоджений ключ або його клієнт має помилку. Ми не можемо сказати, який, і для безпеки завершуємо гру.
zero_trust.straddle_recover_mismatch=Відновлюючи руку, ведучий оголосив страдл, відмінний від того, який записала ваша локальна копія. Це трапляється, лише якщо хост втручається у відновлений страдл або його клієнт має помилки. Рука все ще реконструюється з вашої надійної копії, але ми попереджаємо вас як запобіжний захід.
zero_trust.rit_recover_mismatch=Відновлюючи роздачу, ведучий оголосив про результат двічі, відмінний від того, який записала ваша локальна копія. Це трапляється, лише якщо хост втручається у відновлений результат або його клієнт має помилки. Рука все ще реконструюється з вашої надійної копії, але ми попереджаємо вас як запобіжний захід.
zero_trust.peer_sra_corrupt_registro=Ключ \u2014 розкриття підписаний, але не розв’язується з картками. Можливий чит або помилка клієнта.
