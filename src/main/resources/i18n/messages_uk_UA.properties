tooltip.cfg.nivel_luz=Яку яскравість (%) зберігає стіл при вимкненому освітленні, незалежно від того, вимикаєте ви його самі чи воно вимикається самостійно (пауза, гра закінчена). Чим нижче, тим темніше виглядає. 35% за замовчуванням.
