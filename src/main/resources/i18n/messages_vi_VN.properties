gdx.settings.option_help.rabbit.free_small_blind=Yêu cầu đầu tiên của bạn về trò chơi là miễn phí. Mỗi yêu cầu sau này có giá một mù nhỏ.
gdx.settings.option_help.rabbit.free_small_and_big_blind=Yêu cầu trò chơi đầu tiên của bạn là miễn phí, yêu cầu thứ hai có giá một mù nhỏ và các yêu cầu sau đó có giá một mù lớn.
