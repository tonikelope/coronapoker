radar.esta_funcionalidad_permite_a_cualquier=Tính năng này cho phép bất kỳ người chơi nào có được ảnh chụp màn hình và xử lý danh sách của người chơi khác nếu họ nghi ngờ họ gian lận hoặc sử dụng phần mềm của bên thứ ba. Với tư cách là người tổ chức, vui lòng xem xét các ý nghĩa về quyền riêng tư trước khi bật tùy chọn này (không thể thay đổi tùy chọn này trong khi chơi).\n\nLưu ý: tính năng này khá phụ thuộc vào nền tảng nên không đảm bảo sẽ hoạt động hoàn hảo trên tất cả các máy khách.
