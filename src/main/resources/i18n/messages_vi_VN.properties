game.mano_verificacion_firma_invalida=⚠ Thông báo: {0} đã phát hiện thấy chữ ký mật mã không hợp lệ trong ván bài này. Việc đóng cửa an toàn đã bị dừng lại. Bằng chứng: {1}
game.popup_verificacion_firma_invalida=Trong ván bài này, một hoặc nhiều người tham gia ({0}) đã phát hiện chữ ký mật mã không hợp lệ trên một hành động.\n\nDữ liệu mà tất cả những người tham gia nhận được là nhất quán (băm chuỗi cuối cùng khớp với nhau), nhưng ít nhất một hành động không được tác giả dự kiến ký chính xác.\n\nCoronaPoker đã dừng việc đóng ván bài an toàn và sẽ đóng bàn do lỗi bảo mật sau khi cảnh báo này được gỡ bỏ được thừa nhận.\n\nBằng chứng được lưu trong:\n{1}
game.mano_verificacion_host_sin_prueba=⚠ Thông báo: {0} không nhận được bằng chứng xáo trộn trung thực cho ván bài này. Bằng chứng: {1}
game.popup_verificacion_host_sin_prueba=Một hoặc nhiều người tham gia ({0}) đã không nhận được bằng chứng xáo trộn trung thực cho ván bài này.\n\nCác chuỗi băm cuối cùng khớp với tất cả những người tham gia, do đó các hành động của ván bài là nhất quán. Người tổ chức chính xác luôn gửi bằng chứng này, do đó, việc vắng mặt nhiều lần hoặc có chọn lọc ngang hàng có thể cho thấy phần mềm đã bị sửa đổi hoặc lỗi phần mềm.\n\n Ván bài đã được xử lý nhưng bạn nên rời khỏi trò chơi để đề phòng.\n\nBằng chứng được lưu trong:\n{1}
