game.popup_verificacion_divergente=Một hoặc nhiều người tham gia đã báo cáo một quá trình xác minh mật mã khác ở trạng thái bàn tay cuối cùng.\n\nĐiều này có thể do phần mềm bị sửa đổi hoặc do lỗi phần mềm. CoronaPoker không thể tự động xác định nguyên nhân hoặc ai đã tạo ra nó.\n\nCoronaPoker đã ngừng đóng ván bài an toàn và sẽ đóng bàn do lỗi bảo mật sau khi cảnh báo này được xác nhận.\n\nBằng chứng được lưu trong:\n{0}
