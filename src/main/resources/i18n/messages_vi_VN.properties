zero_trust.invalid_mac=\u26a0\ufe0f [Cảnh báo ZERO-TRUST] MAC không hợp lệ trên thẻ cộng đồng. Có thể thao túng.
zero_trust.legit2=\u2714\ufe0f\u2714\ufe0f [ZERO-TRUST] XÁC MINH MÃ HÓA ĐỒNG Ý: TẤT CẢ NGƯỜI CHƠI ĐÃ CHỨNG NHẬN XÁC MINH MẬT MÃ TAY ĐỊA PHƯƠNG CỦA HỌ.
zero_trust.legit2_error=\u274c [ZERO-TRUST] XÁC MINH MÃ HÓA ĐỒNG THUẬN: ÍT NHẤT MỘT NGƯỜI CHƠI CHƯA CHỨNG NHẬN XÁC MINH MÃ HÓA TAY ĐỊA PHƯƠNG CỦA HỌ.
zero_trust.legit=\u2714\ufe0f [ZERO-TRUST] XÁC MINH MÃ HÓA TAY ĐỊA PHƯƠNG: THẺ CỦA TÔI, THẺ CỘNG ĐỒNG VÀ TẤT CẢ HÀNH ĐỘNG ĐƯỢC GHI LẠI LÀ HỢP PHÁP.
zero_trust.legit_error=\u274c [ZERO-TRUST] XÁC MINH MÃ HÓA TAY ĐỊA PHƯƠNG: KHÔNG THỂ ĐẢM BẢO RẰNG THẺ CỦA TÔI, THẺ CỘNG ĐỒNG VÀ TẤT CẢ HÀNH ĐỘNG ĐƯỢC GHI LẠI LÀ HỢP PHÁP.
zero_trust.lockdown_activated=\ud83d\udd12 [KHÓA] Đã kích hoạt chế độ cách ly. Chặn việc truyền khóa mật mã.
zero_trust.no_binary_log=\u26a0\ufe0f [ZERO-TRUST] Không có nhật ký nhị phân trước đó cho ván bài này.
zero_trust.p2p_auditing_memory=[ZERO-TRUST] P2P: KIỂM TOÁN BỘ NHỚ...
zero_trust.p2p_cheater_detected2=[ZERO-TRUST] Đã phát hiện một người chơi có phiên bản CoronaPoker đã sửa đổi, cho thấy họ có thể đang cố gắng gian lận.
