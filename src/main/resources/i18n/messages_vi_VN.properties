tooltip.cfg.bot_rebuy=Điều khiển mua thêm chip tự động toàn cầu cho mọi bot. Tắt nó cũng sẽ vô hiệu hóa cài đặt mua thêm chip của bot tùy chỉnh.
tooltip.cfg.bots=Đặt độ khó của bot tiêu chuẩn. Các bot tùy chỉnh giữ độ khó được cấu hình riêng trong Trình quản lý Bot.
tooltip.cfg.buyin_fixed=Mọi người đều bắt đầu với tiền vào bàn giống nhau. Khi tắt, người chơi sẽ chọn trong phạm vi đã định cấu hình.
tooltip.cfg.double_blinds=Tiến lên cấp tiền mù tiếp theo trong cấu trúc sau một số tay hoặc số phút đã đặt.
tooltip.cfg.hand_limit=Trò chơi kết thúc khi đạt đến số tay này.
tooltip.cfg.iwtsth=Cho phép bạn yêu cầu xem ván bài của đối thủ ở mức lật bài.
tooltip.cfg.rabbit=Tiết lộ những lá bài cộng đồng chưa được chia sau ván bài. Yêu cầu đầu tiên của mỗi người chơi là miễn phí. Chế độ đã chọn sẽ đặt xem các yêu cầu sau này có miễn phí hay không hoặc có chi phí nhỏ hoặc mù lớn.
tooltip.cfg.rebuy_limit=Số lần mua lại tối đa cho mỗi người chơi.
tooltip.cfg.recover=Tiếp tục một trò chơi đã bị gián đoạn trước đó.
tooltip.cfg.rit=Cho phép bỏ phiếu để chia các quân bài còn lại hai lần khi Tất tay đóng cược.
tooltip.cfg.straddle=Người chơi sau mù lớn có thể đăng hai mù lớn trước khi xem quân bài của họ và hành động ở vòng preflop cuối cùng.
tooltip.cfg.straddle_on_timeout=Tự động đăng straddle khi lời nhắc của nó hết thời gian. Điều này chỉ ảnh hưởng đến trình phát của bạn và bị tắt theo mặc định.
tooltip.cfg.structure=Cấu trúc cấp độ Tiền mù cho trò chơi.
tooltip.cfg.think_time=Giây có sẵn để quyết định. Hành động tự động chạy khi hết thời gian.
tooltip.cfg.showdown_time=Số giây, kết quả ván bài vẫn hiển thị trên màn hình trước khi ván bài tiếp theo được chia.
tooltip.cfg.allow_hot_join=Cho phép người chơi mới tham gia với tư cách KHỞI ĐỘNG và tham gia ván tiếp theo. Khi thay đổi trong trò chơi, nó chỉ ảnh hưởng đến các lần thử kết nối mới.
tooltip.cfg.card_flip_duration=Đặt khoảng thời gian mỗi thẻ sẽ hoàn thành lượt của mình khi được tiết lộ.
tooltip.cfg.card_flip_direction=Chọn hướng thẻ quay khi được tiết lộ. Hỗn hợp chọn một hướng cho mỗi tiết lộ. Các thẻ trong cùng một nhóm sẽ xoay theo cùng một cách.
tooltip.cfg.reparto_velocidad=Đặt khoảng thời gian mỗi lá bài đi từ bộ bài đến chỗ ngồi của nó.
tooltip.cfg.community_deal_style=Chọn xem tất cả năm lá bài chung được chia úp khi bắt đầu hay được chia trên đường riêng của chúng. Những thay đổi đã lưu sẽ được áp dụng từ ván tiếp theo.
tooltip.cfg.anim_calidad=Chất lượng giữ mọi chi tiết hình ảnh. Hiệu suất làm giảm chi phí của các chuyến bay thẻ và hiển thị trên các máy tính yếu hơn.
tooltip.cfg.downgrade_velocidad=Đặt khoảng thời gian bàn sẽ sắp xếp lại chỗ ngồi khi người chơi rời đi.
