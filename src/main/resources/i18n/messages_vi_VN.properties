zero_trust.cascade_failed=\u274c [ZERO-TRUST] Tầng xáo trộn mật mã không thành công. Bàn tay đã bị hủy bỏ.
zero_trust.unlock_failed=\u274c [ZERO-TRUST] Không thể mở khóa thẻ riêng tư (người chơi không phản hồi kịp thời). Bàn tay đã bị hủy bỏ.
zero_trust.card_resolve_failed=\u274c [ZERO-TRUST] Thẻ được giải mã không khớp với bất kỳ thẻ hợp lệ nào trong bộ bài. Trò chơi đã bị hủy bỏ.
peer.not_enough_players=Một người chơi bị rớt trong quá trình xáo bài và không còn đủ người chơi để chia bài.
peer.unlock_no_testament=Người chơi bị ngắt kết nối mà không để lại khóa giải mã. Bàn tay đã bị hủy bỏ.
peer.broadcast_failed=Lỗi mạng khi phát thẻ riêng. Bàn tay đã bị hủy bỏ.
peer.recovery_action_data_unavailable=Không thể đọc được lịch sử hành động đã lưu. Ván bài đã được hủy an toàn và sẽ quay trở lại trạng thái phục hồi.
straddle.deferred_release_failed=Không thể tiết lộ thẻ tiền mù straddle (người chơi bị ngắt kết nối hoặc từ chối hợp tác). Bàn tay đã bị hủy bỏ.
peer.state_inconsistent=Trạng thái đại lý trở nên không nhất quán. Bàn tay đã bị hủy bỏ.
peer.bot_no_token=Bot không có sẵn khóa giải mã. Bàn tay đã bị hủy bỏ.
peer.community_unlock_no_testament=Người chơi bị ngắt kết nối mà không để lại chìa khóa để lộ thẻ cộng đồng. Bàn tay đã bị hủy bỏ.
peer.dropped_during_cascade=Một người chơi bị ngắt kết nối trong quá trình xáo trộn mật mã bộ bài. Bàn tay đã bị hủy bỏ.
peer.dropped_during_rotation=Một người chơi bị ngắt kết nối trong quá trình quay mật mã bộ bài. Bàn tay đã bị hủy bỏ.
zero_trust.rotation_refused=Một người chơi được kết nối đã từ chối cung cấp chìa khóa xoay bộ bài của họ. Trò chơi bị dừng lại. Họ sẽ cần phải biện minh cho việc từ chối tái nhận của mình.
zero_trust.cascade_refused=Một người chơi được kết nối đã từ chối tham gia vào tầng xáo trộn bộ bài. Trò chơi bị dừng lại. Họ sẽ cần phải biện minh cho việc từ chối tái nhận của mình.
zero_trust.pocket_unlock_refused=Một người chơi được kết nối đã từ chối giao chìa khóa của họ để giải mã thẻ bỏ túi. Trò chơi bị dừng lại. Họ sẽ cần phải biện minh cho việc từ chối tái nhận của mình.
zero_trust.community_unlock_refused=Người chơi được kết nối đã từ chối cung cấp chìa khóa của họ để tiết lộ thẻ cộng đồng. Trò chơi bị dừng lại. Họ sẽ cần phải biện minh cho việc từ chối tái nhận của mình.
zero_trust.host_showdown_sig_missing=Đã nhận được khóa lật bài từ máy chủ KHÔNG CÓ chữ ký mật mã của tác giả hoặc có chữ ký không đúng định dạng. Máy chủ có thể đang thay thế khóa trên dây.
zero_trust.host_showdown_sig_invalid=Đã nhận được khóa lật bài từ máy chủ có chữ ký mật mã KHÔNG HỢP LỆ. Máy chủ có thể đang thay thế khóa trên dây.
zero_trust.host_potcards_mismatch=Bản rõ lật bài được gửi bởi máy chủ KHÔNG PHÙ HỢP với kết quả giải mã phần cục bộ của bạn bằng khóa đã ký. Máy chủ có thể đang gửi thẻ giả tại lật bài.
zero_trust.host_community_garbage=Dữ liệu thẻ cộng đồng mật mã nhận được từ máy chủ không nhất quán (phần không giải mã thành thẻ bài hợp lệ hoặc không khớp với thông báo đã ký của máy chủ). Nguyên nhân có thể: LỖI trong một số phiên bản phần mềm, phiên bản máy chủ có mã có thể đã bị thay đổi hoặc hỏng khóa nhận dạng cục bộ. Khách hàng không thể nhận ra sự khác biệt và KHÔNG buộc tội bất kỳ ai.
zero_trust.host_unlock_out_of_order=Một yêu cầu giải mã đã được nhận từ máy chủ không theo trình tự (sai đường, vị trí lặp lại, không theo thứ tự hoặc yêu cầu được đưa ra trước khi đường trước đó đóng cửa).
zero_trust.host_cascade_mid_hand=Một yêu cầu khởi động lại ngẫu nhiên đã được nhận từ máy chủ ở giữa ván bài đang diễn ra (sẽ ghi đè khóa giải mã của tôi).
zero_trust.host_pocket_extraction=Một yêu cầu giải mã đã được nhận từ máy chủ và yêu cầu này sẽ ảnh hưởng đến thẻ riêng của BẠN.
zero_trust.host_community_extraction=Một yêu cầu giải mã đã được nhận từ máy chủ sẽ tiết lộ thẻ cộng đồng trước thời hạn.
zero_trust.host_rotation_replay=Máy chủ yêu cầu xoay lá bài thứ hai trong cùng một ván bài. Vòng quay hợp pháp là duy nhất cho mỗi ván bài. Việc lặp lại gợi ý nỗ lực sử dụng ứng dụng khách của bạn để giải mã thẻ của người chơi khác.
zero_trust.host_shuffle_proof_failed=Việc xác minh giao dịch không thành công: bộ bài mà máy chủ xử lý không thể chứng minh được là sự xáo trộn trung thực của bộ bài gốc. Việc mở khóa cộng đồng đã bị từ chối và phiên này sẽ bị chấm dứt để bảo vệ thẻ riêng tư.
zero_trust.host_shuffle_proof_missing=Thỏa thuận đã đến mà không có bằng chứng xáo trộn trung thực có thể xác minh được cho bộ bài này và các lá bài cộng đồng hiện đang được tiết lộ. Đó có thể là lỗi hoặc mạng chậm hoặc máy chủ đang cố gắng thao túng giao dịch. Bạn có thể tiếp tục chơi, nhưng bạn nên rời khỏi bàn này.
zero_trust.deck_unverified=Bộ bài của ván bài này KHÔNG thể được xác minh là một ván bài xáo trộn trung thực. NGHI NGỜ: người dẫn chương trình "{0}", người xử lý và phát sóng bằng chứng xáo trộn. Đó có thể là người chủ trì thao túng giao dịch hoặc người chơi đã giấu bằng chứng của họ. Ván bài được chơi ra vì các lá bài đã được chia.
zero_trust.deck_unverified_body=Bằng chứng có chữ ký về sự bất thường này đã được ghi lại (trong nhật ký trò chơi, màu đỏ và trong bàn bài tranh chấp). Bạn có thể tiếp tục chơi nhưng nếu không tin tưởng chủ nhà thì hãy rời khỏi bàn.
zero_trust.seat_redraw=Chủ nhà "{0}" buộc phải rút ghế MỚI. Điều này là KHÔNG BÌNH THƯỜNG: việc rút thăm mang tính tập thể và có thể kiểm chứng được nên người tổ chức không thể chọn chỗ ngồi, nhưng CÓ THỂ quay lại cho đến khi có được sự sắp xếp như ý muốn. Nếu điều này lặp lại, có thể người tổ chức đang cố gắng gian lận chỗ ngồi của bạn.
zero_trust.seat_redraw_body=Lần rút thăm mới diễn ra theo cách tương tự và vẫn có thể xác minh được: không ai, kể cả người tổ chức, có thể chọn kết quả. Điều này có thể xảy ra nếu một người chơi bỏ cuộc ngay từ đầu, nhưng nếu bạn thấy một số lần thử lại và bạn không tin tưởng người chủ trì, hãy rời khỏi bàn. Nó đã được ghi lại.
zero_trust.seat_recover_mismatch=Khi khôi phục trò chơi, thứ tự chỗ ngồi do người tổ chức gửi "{0}" KHÔNG khớp với thứ tự mà khách hàng của bạn đã lưu: ai đó mà bạn biết đã đổi chỗ ngồi tại bàn. Có thể chủ nhà đang cố gắng sắp xếp lại chỗ ngồi để che đậy sự phục hồi.
zero_trust.seat_recover_mismatch_body=Khách hàng của bạn đã giữ lại thông tin tham khảo về chỗ ngồi mà họ đã tự xác minh ngay từ đầu. Người chơi tham gia hoặc rời đi giữa chừng là điều bình thường. Sắp xếp lại một người đã ở đó thì không. Nếu không tin tưởng chủ nhà, hãy rời khỏi bàn. Nó đã được ghi lại.
zero_trust.host_recover_action_forged=Máy chủ đã cố gắng thực hiện hành động FORGED (chữ ký không hợp lệ) trong quá trình khôi phục trò chơi. Khách hàng của bạn đã từ chối nó.
zero_trust.host_recover_action_omitted=Trong quá trình khôi phục, máy chủ đã bỏ qua một hành động mà BẠN đã chơi và đã ghi lại trong cơ sở dữ liệu cục bộ của bạn. Khách hàng của bạn đã phát hiện ra nó so với bản sao của chính nó và KHÔNG âm thầm hủy bỏ hành động của bạn.
zero_trust.host_recover_balance_mismatch=Người tổ chức đã cố gắng thay đổi số dư của bạn (chip/tiền vào bàn) trong quá trình khôi phục trò chơi: nó không khớp với hồ sơ địa phương của bạn. Khách hàng của bạn đã giữ số dư thực của BẠN.
zero_trust.host_board_peek=Người tổ chức đã yêu cầu giải mã thẻ cộng đồng từ đường TƯƠNG LAI (cố gắng đọc bảng sớm). Khách hàng của bạn đã từ chối.
zero_trust.suspect_host_prefix=NGHI NGỜ: người dẫn chương trình "{0}".
zero_trust.suspect_peer_prefix=NGHI NGỜ: người chơi "{0}".
zero_trust.peer_alert=⚠️ [HÀNH VI CỦA NGƯỜI CHƠI BẤT THƯỜNG]
zero_trust.peer_suspicious_header=Hành vi bất thường hoặc lạm dụng từ một người chơi đã được phát hiện tại bàn của bạn:\n
zero_trust.peer_suspicious_body=Bàn áp dụng biện pháp bảo mật phù hợp và trò chơi tiếp tục dành cho những người chơi khác. Đức tin tốt được cho là. Đó có thể là lỗi phần mềm và không ai bị buộc tội. Bằng chứng được ghi lại.
zero_trust.peer_inbound_flood=Lưu lượng truy cập được xác thực được duy trì trên ngưỡng chống DoS.
zero_trust.peer_binary_flood=Hoạt động tin nhắn thoại được gửi với tốc độ cao bất thường.
zero_trust.host_binary_flood=Máy chủ đang gửi các thao tác tin nhắn thoại với tốc độ cao bất thường.
zero_trust.peer_flood_log=Sự cố chống DoS đang chờ quyết định: người chơi {0}, IP {1}. Lý do: {2}
zero_trust.peer_flood_confirm=Người dùng {0} đang gửi lượng truy cập quá lớn. Đây có thể là một cuộc tấn công DoS hoặc một lỗi. Trục xuất họ khỏi trò chơi?\n\nIP: {1}\nLý do được phát hiện: {2}
zero_trust.peer_flood_suppress=Không hiển thị những cảnh báo này
zero_trust.peer_hand_ready_withheld=Người chơi trả lời PING nhưng không xác nhận sự sẵn sàng cho ván tiếp theo khi trò chơi đang diễn ra. Nó bị đóng băng khi bắt đầu và đã bị TRỤC XUẤT. Trò chơi tiếp tục mà không có họ.
zero_trust.peer_action_withheld=Người chơi trả lời PING nhưng không gửi hành động cá cược khi trò chơi đang chạy, quá thời gian suy nghĩ. Trận đấu đã bị đóng băng và đã bị TRỤC XUẤT. Trò chơi tiếp tục mà không có họ.
zero_trust.peer_conf_withheld=Người chơi trả lời PING nhưng không xác nhận đã nhận được tin nhắn chia bài trong khi trò chơi đang chạy. Nó đã chặn không cho bàn tiến lên và đã bị TRỤC XUẤT. Trò chơi tiếp tục mà không có họ.
zero_trust.peer_deal_refusal_expelled=Người chơi buộc phải hủy nhiều ván bài liên tiếp bằng cách từ chối xáo trộn hoặc xoay bộ bài. Nó đã bị XUẤT KHẨU để trò chơi có thể tiếp tục.
zero_trust.suspicious_alert=⚠️ [HÀNH VI MÁY CHỦ BẤT THƯỜNG]
zero_trust.suspicious_header=Khách hàng của bạn đã phát hiện hành vi bất thường của máy chủ (không phải sự cố nghiêm trọng khiến trò chơi bị treo):\n
zero_trust.suspicious_body=Khách hàng của bạn đã từ chối hoạt động bất thường và trò chơi CÓ THỂ tiếp tục. Chúng tôi cho rằng có thiện chí: đây có thể là BUG phần mềm (máy khách hoặc máy chủ) và không ai bị buộc tội. Nhưng vì không thể phân biệt được lỗi ngoài việc giả mạo, ĐỂ AN TOÀN CỦA BẠN NÊN RỜI KHUYẾN CÁO bảng này bằng cách sử dụng nút 'Rời khỏi' (tiền của bạn sẽ KHÔNG được xử lý trong ván bài này).
zero_trust.host_bad_wire=Yêu cầu giải mã đã được nhận từ máy chủ có định dạng không hợp lệ hoặc các điểm không thuộc đường cong mật mã.
zero_trust.host_critical_command_invalid=Không thể xác thực lệnh quan trọng {0} do máy chủ gửi. Đây có thể là sự không tương thích, lỗi hoặc máy chủ đã bị sửa đổi. Phiên này được dừng lại để bảo vệ tính toàn vẹn của nó.
zero_trust.cheater_detected=[ZERO-TRUST] Đã phát hiện một người chơi có phiên bản CoronaPoker đã sửa đổi, cho thấy họ có thể đang cố gắng gian lận. Bạn có muốn tiếp tục không?
zero_trust.corrupted_mac_action=Máy chủ đã cố gắng xử lý một hành động có chữ ký mật mã không hợp lệ (MAC bị hỏng) thay mặt cho:
zero_trust.critical=\u274c [ZERO-TRUST] CẢNH BÁO QUAN TRỌNG: CHỮ KÝ KHÔNG HỢP LỆ HOẶC ĐỒNG Ý BỊ HỎNG.
zero_trust.critical_alert_body=TRẠNG THÁI KIỂM SOÁT ĐƯỢC KÍCH HOẠT:\nKhách hàng của bạn SẼ KHÔNG gửi thêm bất kỳ khóa mật mã nào đến máy chủ trong phiên này.\nTrò chơi bị đóng băng về mặt toán học để bảo vệ số dư của bạn.\n\nCác nguyên nhân CÓ THỂ là:\n - LỖI trong chính mã máy khách,\n - LỖI trong mã máy chủ, hoặc\n - một MÁY CHỦ có mã có thể đã bị thay đổi.\n\nKhách hàng không thể phân biệt giữa chúng và KHÔNG có lời buộc tội nào được ngụ ý. Để đảm bảo an toàn và chờ xem xét nguyên nhân gốc rễ, bạn RẤT RỜI trò chơi này bằng nút 'Thoát' (tiền của bạn sẽ KHÔNG được xử lý trong ván bài này).
zero_trust.critical_alert_header=SỰ CỐ KHÔNG TIN CẬY!\n\nKhách hàng của bạn đã phát hiện sự bất thường trong giao thức mật mã:\n
zero_trust.critical_session_error=[ZERO-TRUST] LỖI PHIÊN QUAN TRỌNG
zero_trust.decrypting_street=[ZERO-TRUST] GIẢI MÃ ĐƯỜNG...
