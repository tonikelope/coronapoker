game.showdown_forfeit_msg=LƯU Ý: lật bài xác minh không thành công đối với (những) người chơi sau và thẻ của họ sẽ KHÔNG được tiết lộ:\n\n%nicks%\n\nNhững người chơi đó bị loại khỏi khả năng kháng cự lật bài (tự động gấp) và KHÔNG THỂ thắng tiền cược này. Trò chơi vẫn tiếp tục bình thường.
zero_trust.peer_sra_corrupt=Chữ ký lật bài là chính hãng nhưng khóa SRA của máy ngang hàng không phân giải thành thẻ hợp lệ. Điều này chỉ xảy ra nếu đối tác cố tình ký một khóa bị hỏng hoặc ứng dụng khách của họ có lỗi. Chúng tôi không thể biết đó là gì và vì sự an toàn, chúng tôi kết thúc trò chơi.
zero_trust.straddle_recover_mismatch=Trong khi lấy lại ván bài, người tổ chức đã thông báo straddle khác với giá trị mà bản sao cục bộ của bạn đã ghi lại. Điều này chỉ xảy ra nếu máy chủ giả mạo straddle đã được khôi phục hoặc ứng dụng khách của nó có lỗi. Bàn tay vẫn được xây dựng lại từ bản sao đáng tin cậy của bạn, nhưng chúng tôi cảnh báo bạn để đề phòng.
zero_trust.rit_recover_mismatch=Trong khi lấy lại ván bài, người dẫn chương trình đã thông báo kết quả chạy hai lần khác với kết quả mà bản sao cục bộ của bạn đã ghi lại. Điều này chỉ xảy ra nếu máy chủ giả mạo kết quả được khôi phục hoặc máy khách của nó có lỗi. Bàn tay vẫn được xây dựng lại từ bản sao đáng tin cậy của bạn, nhưng chúng tôi cảnh báo bạn để đề phòng.
zero_trust.peer_sra_corrupt_registro=\u2014 lật bài khóa đã ký nhưng không giải quyết được thẻ. Có thể có lỗi gian lận hoặc lỗi máy khách.
