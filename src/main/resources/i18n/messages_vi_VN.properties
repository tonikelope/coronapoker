zero_trust.fatal_incident_body=CoronaPoker từ chối trạng thái quan trọng đã được xác thực và dừng bàn trước khi tiếp tục. Xác nhận cảnh báo này để đóng bảng bị ảnh hưởng.\n\nBằng chứng Zero Trust: {0}
