zero_trust.forged_identity_action=Máy chủ đã cố gắng xử lý một hành động có chữ ký nhận dạng giả mạo thay mặt cho:
zero_trust.game_aborted=[ZERO-TRUST] Trò chơi bị hủy. Đá những kẻ lừa đảo.
