tooltip.cfg.swap_estilo=Arc nâng một lá bài lên trên lá bài kia. Ngang vượt qua chúng ở cùng độ cao.
tooltip.cfg.resaltar_avatares=Đặt chuột một lúc trên hình đại diện của người chơi sẽ hiển thị nó được phóng to trên bàn, bên cạnh tên và ngăn xếp của họ, đồng thời nó sẽ biến mất khi bạn di chuột ra khỏi nó.
tooltip.cfg.resaltar_jugada_showdown=Trong lật bài, việc di chuột qua tên bài của bất kỳ người chơi nào (người thắng hoặc người thua) chỉ làm nổi bật các lá bài tạo nên nó và làm mờ phần còn lại.
