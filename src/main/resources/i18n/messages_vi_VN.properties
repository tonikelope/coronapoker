tooltip.cfg.ante=Thêm khoản đóng góp bắt buộc vào tiền thưởng sau tiền mù. Chế độ đặt ai trả tiền và bao nhiêu.
tooltip.cfg.ante_mode=Ở chế độ Truyền thống, mỗi người chơi đang hoạt động sẽ trả 10% của mù lớn. Trong BBA, BA hoặc SBA, nút mù lớn, hoặc mù nhỏ trả một mù lớn. Tiền mù được đăng đầu tiên.
