zero_trust.peer_hand_ready_withheld=游戏进行时，玩家回答 PING，但没有确认下一局的准备情况。它冻结了手启动并已被驱逐。没有他们，比赛仍在继续。
zero_trust.peer_action_withheld=玩家在游戏运行期间应答 PING，但未发送其下注操作，超过了其思考时间。它冻结了回合并已被驱逐。没有他们，比赛仍在继续。
zero_trust.peer_conf_withheld=游戏运行时，玩家应答 PING，但未确认收到发牌消息。它阻碍了桌子的前进并已被驱逐。没有他们，比赛仍在继续。
zero_trust.peer_deal_refusal_expelled=一名玩家因拒绝洗牌或轮换牌组而连续取消数手牌。它已被驱逐，因此比赛可以继续。
zero_trust.suspicious_alert=⚠️ [服务器异常行为]
zero_trust.suspicious_header=您的客户端检测到服务器异常行为（不是导致游戏冻结的严重事件）：\n
zero_trust.suspicious_body=您的客户端拒绝了异常操作，游戏可以继续。我们善意地假设：这可能是一个软件 BUG（客户端或服务器），并且没有人受到指控。但由于无法区分错误和篡改，因此为了您的安全，强烈建议使用“离开”按钮离开此牌桌（您的资金将不会在这手牌中处理）。
zero_trust.host_bad_wire=从服务器收到的解密请求具有无效格式或不属于加密曲线的点。
zero_trust.host_critical_command_invalid=无法验证服务器发送的关键{0}命令。这可能是不兼容、错误或修改的服务器。会话被停止以保护其完整性。
zero_trust.cheater_detected=[零信任] 已检测到修改了 CoronaPoker 版本的玩家，表明他们可能试图作弊。您想继续吗？
zero_trust.corrupted_mac_action=服务器尝试代表以下用户处理具有无效加密签名（损坏的 MAC）的操作：
zero_trust.critical=\u274c [零信任] 严重警报：签名无效或共识被破坏。
zero_trust.critical_alert_body=隔离状态已激活：\n在此会话中，您的客户端将不再向服务器发送任何加密密钥。\n游戏在数学上被冻结以保护您的余额。\n\n可能的原因是：\n - 客户端代码本身的 BUG，\n - 服务器代码中的 BUG，或\n - 代码可能已被更改的服务器。\n\n客户端无法区分它们，并且不暗示任何指控。为了安全起见，并等待根本原因的审查，建议您使用“退出”按钮离开此游戏（您的钱将不会在这手牌中处理）。
zero_trust.critical_alert_header=零信任事件！\n\n您的客户端检测到加密协议中存在异常：\n
