game.showdown_forfeit_msg=注意：以下玩家摊牌验证失败，其底牌将不会被揭晓：\n\n%nicks%\n\n这些玩家被排除在摊牌抵抗（自动弃牌）之外，无法赢得此底池。比赛正常继续。
zero_trust.peer_sra_corrupt=摊牌 签名是真实的，但对等方的 SRA 密钥无法解析为有效卡。仅当对等方故意签署损坏的密钥或其客户端有错误时才会发生这种情况。我们无法判断是哪一个，为了安全起见，我们结束了游戏。
zero_trust.straddle_recover_mismatch=当收回手时，主持人宣布了一个与您本地副本记录的不同的抓头注。仅当主机篡改恢复的抓头注或其客户端有错误时才会发生这种情况。手牌仍然是根据您信任的副本重建的，但我们警告您以防万一。
zero_trust.rit_recover_mismatch=在收回手牌时，主持人宣布了与您自己的本地副本记录的两次运行结果不同的结果。仅当主机篡改恢复结果或其客户端有错误时才会发生这种情况。手牌仍然是根据您信任的副本重建的，但我们警告您以防万一。
zero_trust.peer_sra_corrupt_registro=\u2014 摊牌 密钥已签名，但未解析为卡。可能是作弊或客户端错误。
