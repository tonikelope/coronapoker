zero_trust.peer_suspicious_header=在您的牌桌上检测到玩家的异常或辱骂行为：\n
zero_trust.peer_suspicious_body=桌子采用了匹配的安全措施，其他玩家的游戏继续进行。假定善意。这可能是一个软件错误，但没有人受到指控。证据已被记录。
zero_trust.peer_inbound_flood=经过身份验证的流量持续高于反 DoS 阈值。
zero_trust.peer_binary_flood=语音消息操作的发送速率异常高。
