peer.community_unlock_no_testament=玩家在没有留下钥匙的情况下断开连接以露出公共牌。手牌已被取消。
peer.dropped_during_cascade=一名玩家在牌组加密洗牌过程中断开连接。手牌已被取消。
peer.dropped_during_rotation=一名玩家在套牌加密轮换期间断开连接。手牌已被取消。
zero_trust.rotation_refused=一名已连接的玩家拒绝提供他们的套牌轮换密钥。比赛暂停。他们需要证明拒绝重新入学的理由。
zero_trust.cascade_refused=已连接的玩家拒绝参加牌组洗牌级联。比赛暂停。他们需要证明拒绝重新入学的理由。
zero_trust.pocket_unlock_refused=已连接的玩家拒绝提供解密口袋卡的密钥。比赛暂停。他们需要证明拒绝重新入学的理由。
zero_trust.community_unlock_refused=一名已连接的玩家拒绝交出钥匙以揭开公共牌。比赛暂停。他们需要证明拒绝重新入学的理由。
zero_trust.host_showdown_sig_missing=从服务器收到的摊牌密钥没有作者的加密签名，或者签名格式错误。服务器可能正在替换线路上的密钥。
zero_trust.host_showdown_sig_invalid=从服务器收到带有无效加密签名的 摊牌 密钥。服务器可能正在替换线路上的密钥。
zero_trust.host_potcards_mismatch=服务器发送的 摊牌 明文与使用签名密钥解密本地片段的结果不匹配。服务器可能会在摊牌发送假卡。
zero_trust.host_community_garbage=从服务器接收到的加密公共卡数据不一致（该部分无法解密为有效的牌，或者与服务器的签名公告不匹配）。可能的原因：某些版本的软件存在BUG、代码可能已被更改的服务器版本或本地身份密钥损坏。客户无法区分，也没有指责任何人。
zero_trust.host_unlock_out_of_order=从服务器接收到的解密请求不按顺序（错误的街道、重复的时段、阶段顺序混乱或在上一条街道关闭之前发出请求）。
zero_trust.host_cascade_mid_hand=在正在进行的牌局中，已从服务器收到随机重新启动请求（将覆盖我的解密密钥）。
zero_trust.host_pocket_extraction=已从服务器收到解密请求，该请求会影响您自己的私人卡。
zero_trust.host_community_extraction=已从服务器收到解密请求，该请求将提前显示公共卡。
zero_trust.host_rotation_replay=服务器请求在同一手牌中进行第二次牌轮换。每手牌的合法轮换都是唯一的。重复表明尝试使用您的客户端解密其他玩家的卡牌。
zero_trust.host_shuffle_proof_failed=交易验证失败：服务器处理的牌组无法被证明是创世牌组的诚实洗牌。社区解锁已被拒绝，此会话将被终止以保护私人卡。
zero_trust.host_shuffle_proof_missing=这笔交易在没有可验证的这手牌的诚实洗牌证明的情况下达成，而公共牌现在正在揭晓。这可能是一个错误或网络延迟，或者主机试图操纵交易。您可以继续玩，但强烈建议您离开这张桌子。
zero_trust.deck_unverified=这手牌的牌组无法被验证为诚实的洗牌。嫌疑人：主持人“{0}”，负责处理和广播洗牌证明。可能是主持人操纵了交易，也可能是玩家隐瞒了证据。由于牌已经发完，所以这手牌已经结束。
zero_trust.deck_unverified_body=这种异常现象的签名证据已被记录（在游戏日志中，以红色显示，并在争议手牌表中）。您可以继续玩，但如果您不信任主持人，请离开桌子。
zero_trust.seat_redraw=主持人“{0}”强行抽签。这是不寻常的：抽签是集体的且可验证的，因此主办方无法选择座位，但它可以重新滚动，直到得到它喜欢的安排。如果重复出现，则可能是主持人试图操纵您的座位。
zero_trust.seat_redraw_body=新的抽签以同样的方式进行，并且仍然可以验证：包括主持人在内的任何人都无法选择结果。如果玩家一开始就掉线，可能会发生这种情况，但如果您看到多次重试并且您不信任主持人，请离开桌子。它已被记录。
zero_trust.seat_recover_mismatch=在游戏恢复时，主持人“{0}”发送的座位顺序与您的客户保存的座位顺序不匹配：您已经认识的人改变了桌子上的座位。可能是主持人试图在恢复的掩护下重新排序座位。
zero_trust.seat_recover_mismatch_body=您的客户保留了其在开始时自行验证的座位参考。球员之间的加入或离开是正常的。重新排序已经存在的人则不然。如果您不信任主人，请离开餐桌。它已被记录。
zero_trust.host_recover_action_forged=主机尝试在游戏恢复期间注入 FORGED 操作（无效签名）。你的客户拒绝了。
zero_trust.host_recover_action_omitted=在恢复过程中，主机忽略了您播放并记录在本地数据库中的动作。您的客户根据自己的副本检测到它，并且没有默默地放弃您的操作。
zero_trust.host_recover_balance_mismatch=主机在游戏恢复期间尝试更改您的余额（筹码/买入）：与您的本地记录不符。你的客户保持了你的真实平衡。
zero_trust.host_board_peek=主机请求解密来自 FUTURE 街道的公共卡（试图尽早读取棋盘）。你的客户拒绝了。
